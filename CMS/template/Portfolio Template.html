    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* Zinc 950 */
            color: #e4e4e7; /* Zinc 200 */
            overflow-x: hidden;
        }

            font-family: 'JetBrains Mono', monospace;
        }

            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #09090b; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3f3f46; 
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Keyboard focus. The dark theme hid the UA default outline, so every
           interactive element needs an explicit high-contrast indicator. */
        :focus-visible {
            outline: 2px solid #22d3ee;
            outline-offset: 2px;
            border-radius: 4px;
        }
        :focus:not(:focus-visible) { outline: none; }
        .skip-link {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -150%);
            z-index: 300;
            padding: 0.75rem 1.25rem;
            background: #22d3ee;
            color: #09090b;
            font-weight: 700;
            border-radius: 0 0 0.5rem 0.5rem;
            transition: transform 0.15s ease-out;
        }
        .skip-link:focus { transform: translate(-50%, 0); }

        /* Rich Text Styles */
        /* The .rt-h* classes carry the visual size for CMS headings whose tag has been
           demoted to keep document heading order valid. See demoteHeadings(). */
        .rich-text h1, .rich-text .rt-h1 { font-size: 1.5em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: white; }
        .rich-text h2, .rich-text .rt-h2 { font-size: 1.25em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: #e4e4e7; }
        .rich-text p { margin-bottom: 1em; line-height: 1.6; }
        .rich-text p:last-child { margin-bottom: 0; }
        .rich-text em { color: #9ca3af; font-style: italic; }
        .rich-text strong { color: white; font-weight: bold; }
        /* Spec List Builder export — category headings match the CMS live preview */
        .rich-text.specs-rich-text h2,
        .rich-text.specs-rich-text .rt-h2 {
            font-size: 1.25rem;
            font-weight: bold;
            margin-top: 1.5em;
            margin-bottom: 0.75em;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        .rich-text.specs-rich-text h2:first-child,
        .rich-text.specs-rich-text .rt-h2:first-child { margin-top: 0; }
        .rich-text.specs-rich-text p { margin-bottom: 1rem; }
        /* Paragraph margins are counted in the clamped box height, which lets a
           partial extra line bleed past the clamp on card previews. */
        .rich-text.line-clamp-3 p { margin-bottom: 0; }
        .rich-text ul { list-style-type: disc !important; padding-left: 1.5em !important; margin-bottom: 1em; }
        .rich-text ol { list-style-type: decimal !important; padding-left: 1.5em !important; margin-bottom: 1em; }
        .rich-text li { display: list-item !important; }
        .rich-text a { color: #22d3ee; text-decoration: underline; }
        /* Quill indent classes (used by CMS rich text editor) */
        .rich-text .ql-indent-1 { margin-left: 3em; }
        .rich-text .ql-indent-2 { margin-left: 6em; }
        .rich-text .ql-indent-3 { margin-left: 9em; }
        .rich-text .ql-indent-4 { margin-left: 12em; }
        .rich-text .ql-indent-5 { margin-left: 15em; }
        .rich-text .ql-indent-6 { margin-left: 18em; }
        .rich-text .ql-indent-7 { margin-left: 21em; }
        .rich-text .ql-indent-8 { margin-left: 24em; }

        /* Custom video player progress scrubber (click + drag to seek) */
        .video-progress {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            outline: none;

            -webkit-appearance: none;

            width: 12px;

            background: #22d3ee;

        const Facebook = (p) => <Icon {...p}><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></Icon>;
        const TikTok = (p) => <Icon {...p}><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></Icon>;

        const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
        const Minus = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"/></Icon>;

        // --- GLOBAL HELPER: URL NORMALIZER ---
        const ensureProtocol = (url) => {
            if (!url) return '';
            if (url.startsWith('mailto:')) return url;
            if (url.startsWith('#')) return url;
            if (url.startsWith('/') || url.startsWith('./') || url.startsWith('../')) return url;
            const trimmed = url.trim();
            if (!/^https?:\/\//i.test(trimmed)) {
                // Relative paths (e.g. media/...) should be served as-is
                if (!/^[a-zA-Z0-9+\-.]+:\/\//.test(trimmed) && !trimmed.includes('://') && trimmed.match(/^[a-zA-Z]+\//)) {
                    return trimmed;
                }
                return `https://${trimmed}`;
            }
            return trimmed;
        };

        const getYouTubeId = (url) => {
            if (!url || typeof url !== 'string') return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            const match = url.trim().match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        // Gallery entries are either a bare URL string or { url, caption } once a
        // caption has been authored in the CMS.
        const mediaSrc = (item) => (typeof item === 'string' ? item : (item?.url || ''));
        const mediaCaption = (item) => (typeof item === 'string' ? '' : (item?.caption || ''));
        const mediaFit = (item) => (typeof item === 'string' ? null : (item?.fit || null));
        const mediaPoster = (item) => (typeof item === 'string' ? null : (item?.poster || null));
        const mediaThumbnail = (item) => (typeof item === 'string' ? null : (item?.thumbnail || null));
        const mediaHasAudio = (item) => typeof item === 'object' && !!item?.hasAudio;

        // Self-hosted (non-YouTube) video files uploaded via the CMS's video
        // converter always come out as .mp4, but a manually-typed URL could point
        // at another common container.
        const isVideoUrl = (url) => typeof url === 'string' && /\.(mp4|webm|mov|m4v)$/i.test(url.split('?')[0]);

        // Returns inline style for a cropped image. When scale=1, only objectPosition
        // is set so CSS hover transitions (e.g. group-hover:scale-105) still work.
        const fitStyle = (fit) => {
            if (!fit) return {};
            const { scale = 1, x = 50, y = 50 } = fit;
            if (scale <= 1) return { objectPosition: `${x}% ${y}%` };
            return { transform: `scale(${scale})`, transformOrigin: `${x}% ${y}%`, objectPosition: `${x}% ${y}%` };
        };

        const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])';

        // Confines Tab cycling to `containerRef`, closes on Escape, and returns
        // focus to whatever was focused before the dialog opened. `isActive` lets a
        // parent dialog stand down while a nested one (the lightbox) is on top.
        const useDialog = (containerRef, onClose, isActive = true) => {
            // Read through a ref so the once-only effect below never sees stale state.
            const stateRef = useRef(null);
            stateRef.current = { onClose, isActive };

            useEffect(() => {
                const previouslyFocused = document.activeElement;
                const container = containerRef.current;

                const focusables = () =>
                    Array.from(container ? container.querySelectorAll(FOCUSABLE) : [])
                        .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);

                const first = focusables()[0];
                (first || container)?.focus();

                const onKeyDown = (e) => {
                    if (!stateRef.current.isActive) return;
                    if (e.key === 'Escape') {
                        e.stopPropagation();
                        stateRef.current.onClose();
                        return;
                    }
                    if (e.key !== 'Tab') return;
                    const items = focusables();
                    if (!items.length) { e.preventDefault(); return; }
                    const firstItem = items[0];
                    const lastItem = items[items.length - 1];
                    if (e.shiftKey && (document.activeElement === firstItem || !container.contains(document.activeElement))) {
                        e.preventDefault();
                        lastItem.focus();
                    } else if (!e.shiftKey && document.activeElement === lastItem) {
                        e.preventDefault();
                        firstItem.focus();
                    }
                };

                document.addEventListener('keydown', onKeyDown, true);
                return () => {
                    document.removeEventListener('keydown', onKeyDown, true);
                    if (previouslyFocused && document.contains(previouslyFocused)) previouslyFocused.focus();
                };
            }, []);
        };

        // The CMS editor emits <h1>/<h2>, which collide with the heading level of the
        // section the markup gets embedded in (an <h2> landing inside the <h4>
        // "Specifications" panel reads as a jump back up the outline). Retag to the right
        // level and move the visual size onto a class.
        const demoteHeadings = (html, startLevel) => {
            if (!html) return html;
            const source = String(html);
            const present = [...source.matchAll(/<h([1-6])\b/gi)].map(m => parseInt(m[1], 10));
            if (!present.length) return source;
            // Anchor the shallowest authored heading at startLevel so the outline neither
            // jumps backwards nor skips a level, and keep relative nesting below it.
            const shallowest = Math.min(...present);
            return source.replace(/<(\/?)h([1-6])([^>]*)>/gi, (match, slash, lvl, attrs) => {
                const original = parseInt(lvl, 10);
                const level = Math.min(6, startLevel + original - shallowest);
                if (slash) return `</h${level}>`;
                const cls = `rt-h${original}`;
                const withClass = /class\s*=\s*"/i.test(attrs)
                    ? attrs.replace(/class\s*=\s*"([^"]*)"/i, (m, c) => `class="${c} ${cls}"`)
                    : `${attrs} class="${cls}"`;
                return `<h${level}${withClass}>`;
            });
        };

        // Fallback for gallery entries with no authored caption. Filenames here are
        // camera-roll noise (20250317_180727, Screenshot 2025-03-17...), so a positional
        // label is the most accurate description available.
        const describeMedia = (url, index, total, projectTitle) => {
            const position = `${index + 1} of ${total}`;
            return (getYouTubeId(url) || isVideoUrl(url))
                ? `Play video ${position} for ${projectTitle}`
                : `${projectTitle}, image ${position}`;
        };

        // --- READ DATA ---
        let projects = [];
        let settings = {};

        try {
            const rawContent = document.getElementById('portfolio-data').textContent.trim();
            let parsedData;
            
            if (rawContent.includes('{{PORTFOLIO_DATA}}')) {
                 console.log("Template mode detected.");
                 parsedData = { projects: [], settings: {} }; // Fallback
            } else {
                parsedData = JSON.parse(rawContent);
            }

            projects = Array.isArray(parsedData) ? parsedData : (parsedData.projects || []);

        const ContactModal = ({ email, onClose, emailConfig }) => {

        // Self-hosted video playback with custom chrome (no native browser controls):
        // click-to-play, a click/drag-to-seek progress bar, and a fullscreen toggle
        // that keeps the custom controls visible (fullscreening the wrapper, not the
        // bare <video> element). Videos uploaded with audio also get mute + volume.
        const VideoPlayer = ({ src, poster, className = "", autoPlay = false, hasAudio = false }) => {
            const videoRef = useRef(null);
            const containerRef = useRef(null);
            const [playing, setPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [seeking, setSeeking] = useState(false);
            const [looping, setLooping] = useState(false);
            const [muted, setMuted] = useState(!!hasAudio);
            const [volume, setVolume] = useState(1);
            const [buffering, setBuffering] = useState(!!autoPlay);
            const [frameReady, setFrameReady] = useState(false);

            useEffect(() => {
                const v = videoRef.current;
                setFrameReady(false);
                setBuffering(!!autoPlay);
                setCurrentTime(0);
                setDuration(0);
                if (v) {
                    v.playbackRate = 1;
                    v.muted = !!hasAudio;
                    v.volume = 1;
                }
                setMuted(!!hasAudio);
                setVolume(1);
                if (autoPlay) v?.play().catch(() => {});
            }, [src, autoPlay, hasAudio]);

            useEffect(() => {
                const onFsChange = () => setIsFullscreen(document.fullscreenElement === containerRef.current);
                document.addEventListener('fullscreenchange', onFsChange);
                return () => document.removeEventListener('fullscreenchange', onFsChange);
            }, []);

            const togglePlay = (e) => {
                e?.stopPropagation();
                const v = videoRef.current;
                if (!v) return;
                // A stall looks like a stop. Clicking should resume, not pause.
                if (v.paused || v.readyState < 3) v.play().catch(() => {});
                else v.pause();
            };

            const handleSeekInput = (e) => {
                e.stopPropagation();
                setSeeking(true);
                setCurrentTime(parseFloat(e.target.value));
            };

            const commitSeek = (e) => {
                e.stopPropagation();
                const v = videoRef.current;
                if (v) v.currentTime = parseFloat(e.target.value);
                setSeeking(false);
            };

            const toggleMute = (e) => {
                e.stopPropagation();
                const v = videoRef.current;
                if (!v) return;
                const next = !v.muted;
                v.muted = next;
                setMuted(next);
                if (!next && v.volume === 0) {
                    v.volume = 1;
                    setVolume(1);
                }
            };

            const handleVolumeInput = (e) => {
                e.stopPropagation();
                const v = videoRef.current;
                const next = parseFloat(e.target.value);
                setVolume(next);
                if (!v) return;
                v.volume = next;
                const shouldMute = next === 0;
                v.muted = shouldMute;
                setMuted(shouldMute);
            };

            const toggleFullscreen = (e) => {
                e.stopPropagation();
                if (document.fullscreenElement) document.exitFullscreen();
                else containerRef.current?.requestFullscreen?.();
            };

            const toggleLoop = (e) => {
                e.stopPropagation();
                setLooping((l) => !l);
            };

            const formatTime = (s) => {
                if (!isFinite(s) || s < 0) s = 0;
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60).toString().padStart(2, '0');
                return `${m}:${sec}`;
            };

            const pct = duration > 0 ? (currentTime / duration) * 100 : 0;
            const volPct = (muted ? 0 : volume) * 100;

            return (
                <div ref={containerRef} onClick={(e) => e.stopPropagation()} className={`relative bg-black flex items-center justify-center group ${className}`}>
                    <video
                        ref={videoRef}
                        src={src}
                        poster={autoPlay ? undefined : (poster || undefined)}
                        preload="auto"
                        playsInline
                        muted={hasAudio ? muted : false}
                        loop={looping}
                        onClick={togglePlay}
                        onPlay={() => setPlaying(true)}
                        onPause={() => setPlaying(false)}
                        onEnded={() => setPlaying(false)}
                        onWaiting={() => setBuffering(true)}
                        onStalled={() => setBuffering(true)}
                        onPlaying={() => setBuffering(false)}
                        onLoadedData={() => setFrameReady(true)}
                        onLoadedMetadata={(e) => setDuration(e.target.duration || 0)}
                        onTimeUpdate={(e) => { if (!seeking) setCurrentTime(e.target.currentTime); }}
                        className={`w-full h-full max-h-full object-contain cursor-pointer ${frameReady ? 'opacity-100' : 'opacity-0'}`}
                    />

                    {buffering && frameReady && (
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                            <div className="w-10 h-10 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                        </div>
                    )}

                    {!playing && frameReady && !buffering && (
                        <button type="button" onClick={togglePlay} aria-label="Play video" className="absolute inset-0 flex items-center justify-center">
                            <div className="w-16 h-16 bg-white/90 rounded-full flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform">
                                <Play className="text-zinc-900 fill-zinc-900 ml-1" size={28} />
                            </div>
                        </button>
                    )}

                    <div className="absolute bottom-0 left-0 right-0 px-3 pb-2 pt-6 bg-gradient-to-t from-black/80 to-transparent flex items-center gap-3">
                        <button type="button" onClick={togglePlay} aria-label={playing ? 'Pause' : 'Play'} className="text-white hover:text-cyan-400 transition-colors flex-shrink-0">
                            {playing ? <Pause size={18} /> : <Play size={18} />}
                        </button>
                        <span className="text-xs font-mono text-zinc-300 flex-shrink-0 hidden sm:inline">
                            {formatTime(currentTime)} / {formatTime(duration)}
                        </span>
                        <input
                            type="range"
                            className="video-progress flex-1"
                            min="0"
                            max={duration || 0}
                            step="0.01"
                            value={currentTime}
                            style={{ background: `linear-gradient(to right, #22d3ee ${pct}%, rgba(255,255,255,0.25) ${pct}%)` }}
                            onInput={handleSeekInput}
                            onChange={commitSeek}
                            onClick={(e) => e.stopPropagation()}
                            aria-label="Seek"
                        />
                        {hasAudio && (
                            <div className="flex items-center gap-2 flex-shrink-0">
                                <button type="button" onClick={toggleMute} aria-label={muted ? 'Unmute' : 'Mute'} aria-pressed={muted} title={muted ? 'Unmute' : 'Mute'} className="text-white hover:text-cyan-400 transition-colors">
                                    {muted || volume === 0 ? <VolumeX size={18} /> : <Volume2 size={18} />}
                                </button>
                                <input
                                    type="range"
                                    className="video-progress video-volume hidden sm:block"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                    value={muted ? 0 : volume}
                                    style={{ background: `linear-gradient(to right, #22d3ee ${volPct}%, rgba(255,255,255,0.25) ${volPct}%)` }}
                                    onInput={handleVolumeInput}
                                    onChange={handleVolumeInput}
                                    onClick={(e) => e.stopPropagation()}
                                    aria-label="Volume"
                                />
                            </div>
                        )}
                        <button type="button" onClick={toggleLoop} aria-label={looping ? 'Disable loop' : 'Loop video'} aria-pressed={looping} title={looping ? 'Looping on' : 'Loop video'} className={`transition-colors flex-shrink-0 ${looping ? 'text-cyan-400' : 'text-white hover:text-cyan-400'}`}>
                            <Repeat size={18} />
                        </button>
                        <button type="button" onClick={toggleFullscreen} aria-label={isFullscreen ? 'Exit fullscreen' : 'Enter fullscreen'} className="text-white hover:text-cyan-400 transition-colors flex-shrink-0">
                            {isFullscreen ? <Minimize size={18} /> : <Maximize size={18} />}
                        </button>
                    </div>
                </div>
            );
        };

        const Lightbox = ({ images, initialIndex, onClose, projectTitle }) => {
            const [index, setIndex] = useState(initialIndex);
            // Keyed to the index rather than reset in an effect, so navigating to the
            // next item collapses its caption without a frame of expanded text first.
            const [expandedFor, setExpandedFor] = useState(null);
            const [captionOverflows, setCaptionOverflows] = useState(false);
            const [zoom, setZoom] = useState(1);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [shareCopied, setShareCopied] = useState(false);
            const dragStart = useRef(null);
            const touchStartX = useRef(null);
            const touchEndX = useRef(null);
            const didSwipe = useRef(false);
            const dialogRef = useRef(null);
            const captionRef = useRef(null);
            const minSwipeDistance = 50;
            const captionId = 'lightbox-caption';

            useDialog(dialogRef, onClose);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowLeft') prevImage();
                    if (e.key === 'ArrowRight') nextImage();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [index]);

            const nextImage = () => {
                if (index < images.length - 1) setIndex(index + 1);
                else setIndex(0); 
            };

            const prevImage = () => {
                if (index > 0) setIndex(index - 1);
                else setIndex(images.length - 1); 
            };

            const onTouchStart = (e) => { touchEndX.current = null; touchStartX.current = e.targetTouches[0].clientX; };
            const onTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
            const onTouchEnd = () => {
                if (!touchStartX.current || !touchEndX.current) return;
                const distance = touchStartX.current - touchEndX.current;
                if (Math.abs(distance) > minSwipeDistance) didSwipe.current = true;
                if (distance > minSwipeDistance) nextImage();
                if (distance < -minSwipeDistance) prevImage();
            };

            // Reset zoom and drag position whenever the viewed item changes.
            useEffect(() => {
                setZoom(1);
                setDragOffset({ x: 0, y: 0 });
                setIsDragging(false);
            }, [index]);

            // Clicking away from the media closes the viewer. Controls and the media
            // itself stop propagation, so anything reaching here is backdrop. A swipe
            // can surface as a click afterwards, so the first one after it is eaten.
            const onBackdropClick = () => {
                if (isDragging) return;
                if (didSwipe.current) { didSwipe.current = false; return; }
                onClose();
            };

            const stopClick = (e) => e.stopPropagation();

            // --- Zoom & drag handlers (images only) ---
            const onImageWheel = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const delta = e.deltaY < 0 ? 0.5 : -0.5;
                setZoom(z => {
                    const next = Math.max(1, Math.min(5, z + delta));
                    if (next === 1) setDragOffset({ x: 0, y: 0 });
                    return next;
                });
            };

            const onImageMouseDown = (e) => {
                if (zoom <= 1) return;
                e.stopPropagation();
                e.preventDefault();
                setIsDragging(true);
                dragStart.current = { x: e.clientX - dragOffset.x, y: e.clientY - dragOffset.y };
            };

            const onImageMouseMove = (e) => {
                if (!isDragging || !dragStart.current) return;
                e.stopPropagation();
                setDragOffset({ x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y });
            };

            const onImageMouseUp = (e) => {
                if (isDragging) {
                    e.stopPropagation();
                    setIsDragging(false);
                }
            };

            // --- Share handler ---
            const handleLightboxShare = (e) => {
                e.stopPropagation();
                const shareTitle = `${projectTitle || 'Project'} — ${index + 1} of ${images.length}`;
                if (navigator.share) {
                    navigator.share({ title: shareTitle, url: currentUrl }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(currentUrl).then(() => {
                        setShareCopied(true);
                        setTimeout(() => setShareCopied(false), 2000);
                    }).catch(() => {});
                }
            };

            const currentItem = images[index];
            const currentUrl = mediaSrc(currentItem);
            const caption = mediaCaption(currentItem);
            const captionExpanded = expandedFor === index;
            const ytId = getYouTubeId(currentUrl);
            const isVid = !ytId && isVideoUrl(currentUrl);

            // Only offer the toggle when the text is actually cut off. Measuring is
            // skipped while expanded (nothing is clamped then), which leaves the last
            // clamped result standing so the collapse control stays available.
            // A single measurement here reads equal heights and misses the overflow:
            // Tailwind's runtime CDN injects the line-clamp rule after this commit, and
            // the web font reflows the text later still. Observing the box catches both,
            // and covers viewport resizes for free.
            useEffect(() => {
                const el = captionRef.current;
                if (!el || captionExpanded) return;
                const measure = () => setCaptionOverflows(el.scrollHeight > el.clientHeight + 1);
                measure();
                const observer = new ResizeObserver(measure);
                observer.observe(el);
                return () => observer.disconnect();
            }, [caption, captionExpanded]);

            return (
                <div ref={dialogRef} role="dialog" aria-modal="true" aria-label={`Media viewer for ${projectTitle || 'project'}`}
                     className="fixed inset-0 z-[200] bg-black flex flex-col"
                     onClick={onBackdropClick}
                     onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
                    <button onClick={(e) => { e.stopPropagation(); onClose(); }} aria-label="Close media viewer" className="absolute top-4 right-4 p-3 bg-zinc-800/80 rounded-full text-white hover:bg-zinc-700 transition-colors z-[210]">
                        <X size={24} aria-hidden="true" />
                    </button>
                    <button onClick={handleLightboxShare} aria-label="Share this media" className="absolute top-4 left-4 p-3 bg-zinc-800/80 rounded-full text-white hover:bg-cyan-500/80 transition-colors z-[210]">
                        {shareCopied ? <Check size={20} aria-hidden="true" /> : <Share2 size={20} aria-hidden="true" />}
                    </button>
                    {/* min-h-0 lets this shrink below its content so the image's max-h-full
                        resolves against the space left over by the caption, instead of
                        pushing the caption off-screen. */}
                    <div className="relative flex-1 min-h-0 w-full flex items-center justify-center p-4 md:p-10">
                        <button onClick={(e) => { e.stopPropagation(); prevImage(); }} aria-label="Previous item" className="absolute left-1 md:left-4 top-1/2 -translate-y-1/2 p-2 md:p-4 bg-black/40 md:bg-transparent rounded-full text-white/70 hover:text-white transition-colors z-[210]">
                            <ChevronLeft className="w-8 h-8 md:w-12 md:h-12" aria-hidden="true" />
                        </button>
                        {ytId ? (
                            <div className="relative w-full h-full max-w-5xl aspect-video" onClick={stopClick}>
                                <iframe 
                                    src={`https://www.youtube.com/embed/${ytId}?autoplay=1`} 
                                    title={`Video ${index + 1} of ${images.length} for ${projectTitle || 'project'}`}
                                    aria-describedby={caption ? captionId : undefined}
                                    className="w-full h-full border-0 rounded-lg shadow-2xl bg-black relative z-10"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowFullScreen
                                ></iframe>
                                {/* Touch zones for swiping - sides only, center remains interactive for video controls */}
                                <div className="absolute inset-0 z-20 flex pointer-events-none">
                                    <div 
                                        className="w-1/4 h-full"
                                        style={{ pointerEvents: 'auto' }}
                                        onTouchStart={onTouchStart}
                                        onTouchMove={onTouchMove}
                                        onTouchEnd={onTouchEnd}
                                    ></div>
                                    <div className="w-1/2 h-full"></div>
                                    <div 
                                        className="w-1/4 h-full"
                                        style={{ pointerEvents: 'auto' }}
                                        onTouchStart={onTouchStart}
                                        onTouchMove={onTouchMove}
                                        onTouchEnd={onTouchEnd}
                                    ></div>
                                </div>
                            </div>
                        ) : isVid ? (
                            <div className="relative w-full h-full max-w-5xl aspect-video" onClick={stopClick}>
                                <VideoPlayer key={currentUrl} src={currentUrl} poster={mediaPoster(currentItem)} hasAudio={mediaHasAudio(currentItem)} className="w-full h-full rounded-lg shadow-2xl" autoPlay />
                            </div>
                        ) : (
                            <img
                                src={currentUrl}
                                alt={describeMedia(currentUrl, index, images.length, projectTitle || 'Project')}
                                aria-describedby={caption ? captionId : undefined}
                                onClick={(e) => { if (isDragging) { e.stopPropagation(); } else { stopClick(e); } }}
                                onWheel={onImageWheel}
                                onMouseDown={onImageMouseDown}
                                onMouseMove={onImageMouseMove}
                                onMouseUp={onImageMouseUp}
                                onMouseLeave={onImageMouseUp}
                                style={{
                                    transform: `scale(${zoom}) translate(${dragOffset.x / zoom}px, ${dragOffset.y / zoom}px)`,
                                    cursor: isDragging ? 'grabbing' : zoom > 1 ? 'grab' : 'default',
                                    transition: isDragging ? 'none' : 'transform 0.15s ease',
                                }}
                                className="max-w-full max-h-full object-contain select-none"
                                draggable="false"
                            />
                        )}
                        <button onClick={(e) => { e.stopPropagation(); nextImage(); }} aria-label="Next item" className="absolute right-1 md:right-4 top-1/2 -translate-y-1/2 p-2 md:p-4 bg-black/40 md:bg-transparent rounded-full text-white/70 hover:text-white transition-colors z-[210]">
                            <ChevronRight className="w-8 h-8 md:w-12 md:h-12" aria-hidden="true" />
                        </button>
                        {!ytId && !isVid && (
                            <div className="absolute bottom-4 right-4 flex items-center gap-1 z-[210]" onClick={stopClick}>
                                <button
                                    onClick={(e) => { e.stopPropagation(); setZoom(z => { const n = Math.max(1, z - 0.5); if (n === 1) setDragOffset({ x: 0, y: 0 }); return n; }); }}
                                    aria-label="Zoom out"
                                    className="p-2 bg-zinc-800/80 rounded-full text-white hover:bg-zinc-700 transition-colors"
                                >
                                    <Minus size={16} aria-hidden="true" />
                                </button>
                                {zoom !== 1 && (
                                    <button
                                        onClick={(e) => { e.stopPropagation(); setZoom(1); setDragOffset({ x: 0, y: 0 }); }}
                                        aria-label="Reset zoom"
                                        className="px-2 py-1 bg-zinc-800/80 rounded-full text-white text-xs font-mono hover:bg-zinc-700 transition-colors"
                                    >
                                        {Math.round(zoom * 10) / 10}×
                                    </button>
                                )}
                                <button
                                    onClick={(e) => { e.stopPropagation(); setZoom(z => Math.min(5, z + 0.5)); }}
                                    aria-label="Zoom in"
                                    className="p-2 bg-zinc-800/80 rounded-full text-white hover:bg-zinc-700 transition-colors"
                                >
                                    <Plus size={16} aria-hidden="true" />
                                </button>
                            </div>
                        )}
                    </div>
                    <div className="flex-shrink-0 w-full px-4 pb-6 flex flex-col items-center gap-2">
                        {caption && (
                            <div className="max-w-3xl w-full flex flex-col items-center" onClick={stopClick}>
                                <p
                                    ref={captionRef}
                                    id={captionId}
                                    className={`text-center text-sm md:text-base leading-relaxed text-zinc-200 ${captionExpanded ? 'max-h-[30vh] overflow-y-auto custom-scrollbar' : 'line-clamp-3'}`}
                                >
                                    {caption}
                                </p>
                                {(captionOverflows || captionExpanded) && (
                                    <button
                                        type="button"
                                        onClick={(e) => { e.stopPropagation(); setExpandedFor(captionExpanded ? null : index); }}
                                        aria-expanded={captionExpanded}
                                        aria-controls={captionId}
                                        className="mt-1 text-xs font-bold uppercase tracking-widest text-cyan-400 hover:text-cyan-300 transition-colors"
                                    >
                                        {captionExpanded ? 'Show less' : 'Show more'}
                                    </button>
                                )}
                            </div>
                        )}
                        <div aria-live="polite" onClick={stopClick} className="bg-zinc-800/80 px-4 py-2 rounded-full text-sm font-mono text-zinc-300">
                            <span aria-hidden="true">{index + 1} / {images.length}</span>
                            <span className="sr-only">Item {index + 1} of {images.length}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectModal = ({ project, onClose, onFilterByTag }) => {
            const [lightboxIndex, setLightboxIndex] = useState(null);
            const [hoveredRelated, setHoveredRelated] = useState(null);
            const [hoveredFile, setHoveredFile] = useState(null);
            const [showShare, setShowShare] = useState(false);
            const [copied, setCopied] = useState(false);
            const dialogRef = useRef(null);
            const scrollRef = useRef(null);
            const titleId = `project-modal-title-${project.id}`;

            // Escape peels off one layer at a time; the lightbox owns the trap when open.
            useDialog(
                dialogRef,
                () => { if (showShare) { setShowShare(false); } else { onClose(); } },
                lightboxIndex === null
            );

            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => document.body.style.overflow = 'unset';
            }, []);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = 0;
            }, [project.id]);

            const shareUrl = `${window.location.origin}${window.location.pathname}#project/${encodeURIComponent(project.id)}`;

            const handleShare = (e) => {
                e.stopPropagation();
                if (navigator.share) {
                    navigator.share({ title: project.title, url: shareUrl }).catch(() => {});
                } else {
                    setShowShare(true);
                }
            };

            const handleCopyShare = () => {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            };

            const getFileExt = (url) => {
                if(!url) return "FILE";
                return url.split('.').pop().slice(0,4).toUpperCase();
            };

            const hasActions = project.websiteLink || project.launchLink || project.shopLink || project.githubLink;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8">
                    <div aria-hidden="true" className="absolute inset-0 bg-black/90 backdrop-blur-md transition-opacity" onClick={onClose}></div>
                    <div
                        ref={dialogRef}
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby={titleId}
                        tabIndex={-1}
                        className="relative bg-zinc-950 w-full max-w-5xl max-h-[90vh] rounded-2xl overflow-hidden flex flex-col border border-zinc-800 shadow-2xl animate-fade-in"
                    >
                        
                        {/* CLOSE BUTTON - Fixed outside scroll */}
                        <button onClick={(e) => { e.stopPropagation(); onClose(); }} aria-label="Close project details" className="absolute top-4 right-4 p-2 bg-black/50 rounded-full text-white hover:bg-red-500/80 transition-colors backdrop-blur z-50">
                            <X size={24} aria-hidden="true" />
                        </button>

                        <div ref={scrollRef} className="overflow-y-auto overflow-x-hidden custom-scrollbar flex-1">
                            <div className="relative h-64 md:h-96 w-full overflow-hidden">
                                {/* PERFORMANCE: Lazy Loading on Modal Header */}
                                {/* Empty alt: the h2 below is the accessible name for this dialog. */}
                                <img 
                                    src={project.image} 
                                    alt="" 
                                    loading="lazy"
                                    decoding="async"
                                    className="w-full h-full object-cover" 
                                    style={fitStyle(project.bannerFit)}
                                />
                                <div aria-hidden="true" className="absolute inset-0 bg-gradient-to-t from-zinc-950 to-transparent"></div>
                                {/* SHARE BUTTON - scrolls with header */}
                                <button onClick={handleShare} aria-label={`Share ${project.title}`} aria-expanded={showShare} className="absolute top-4 left-4 p-2 bg-black/50 rounded-full text-white hover:bg-cyan-500/80 transition-colors backdrop-blur">
                                    <Share2 size={20} aria-hidden="true" />
                                </button>
                                <div className="absolute bottom-6 left-6 md:left-10 pointer-events-none">
                                    {project.wip && (
                                        <div className="mb-3">
                                            <span className="px-2 py-1 bg-purple-600 backdrop-blur text-[10px] font-mono rounded border border-purple-400/50 uppercase text-white shadow-lg">
                                                <span aria-hidden="true">WIP</span>
                                                <span className="sr-only">Work in progress</span>
                                            </span>
                                        </div>
                                    )}
                                    <h2 id={titleId} className="text-3xl md:text-5xl font-bold text-white shadow-black drop-shadow-lg">{project.title}</h2>
                                </div>
                            </div>

                            <div className="p-6 md:p-10 flex flex-col gap-8 md:grid md:grid-cols-3 md:gap-10">
                                {/* On mobile: wrappers use display:contents so sections become
                                    direct flex children, reordered via order-N classes.
                                    On desktop (md+): wrappers become block grid items and
                                    order has no effect inside them. */}
                                <div className="contents md:block md:col-span-2 md:space-y-8 md:min-w-0">
                                    <div className="order-1">
                                        <h3 className="text-xl font-bold text-white mb-4">About the Project</h3>
                                        <div 
                                            className="text-zinc-300 text-lg leading-relaxed break-words rich-text"
                                            dangerouslySetInnerHTML={{ __html: demoteHeadings(project.longDescription || project.description, 4) }}
                                        />
                                        {project.tags && project.tags.length > 0 && (
                                            <div className="flex flex-wrap gap-2 mt-4">
                                                {project.tags.map(tag => (
                                                    <button type="button" key={tag} onClick={() => onFilterByTag && onFilterByTag(tag)} className="text-xs font-mono px-2 py-1 bg-zinc-800 text-cyan-400 border border-cyan-500/30 rounded uppercase tracking-wider hover:bg-cyan-500/20 hover:border-cyan-500/50 hover:text-cyan-300 cursor-pointer transition-colors">
                                                        {tag}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {project.video && (
                                        <div className="order-2 mb-8">
                                            <h3 className="text-xl font-bold text-white mb-4">Project Video</h3>
                                            <div className="aspect-video w-full rounded-xl overflow-hidden border border-zinc-800 bg-black">
                                                {project.video.includes('youtube.com') || project.video.includes('youtu.be') ? (
                                                    <iframe 
                                                        src={project.video} 
                                                        title={`Project video for ${project.title}`}
                                                        className="w-full h-full" 
                                                        frameBorder="0" 
                                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                        allowFullScreen
                                                    ></iframe>
                                                ) : (
                                                    <video controls className="w-full h-full">
                                                        <source src={project.video} type="video/mp4" />
                                                        Your browser does not support the video tag.
                                                    </video>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {project.gallery && project.gallery.length > 0 && (
                                        <div className="order-4">
                                            <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                                                <ImageIcon size={20} className="text-zinc-500" aria-hidden="true"/> Project Gallery
                                            </h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                {project.gallery.map((item, i) => {
                                                    const mediaUrl = mediaSrc(item);
                                                    const ytId = getYouTubeId(mediaUrl);
                                                    const isVid = !ytId && isVideoUrl(mediaUrl);
                                                    const label = mediaCaption(item) || describeMedia(mediaUrl, i, project.gallery.length, project.title);
                                                    return (
                                                        <button type="button" key={i} onClick={() => setLightboxIndex(i)} aria-label={(ytId || isVid) ? label : `Open full size: ${label}`} className="w-full rounded-lg overflow-hidden border border-zinc-800 aspect-video group cursor-pointer relative bg-zinc-900">
                                                            {ytId ? (
                                                                <>
                                                                    <img src={`https://img.youtube.com/vi/${ytId}/hqdefault.jpg`} loading="lazy" decoding="async" className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 opacity-90" alt="" />
                                                                    <div aria-hidden="true" className="absolute inset-0 flex items-center justify-center">
                                                                        <div className="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                                                                            <Play className="text-white fill-white ml-1" size={20} /> 
                                                                        </div>
                                                                    </div>
                                                                </>
                                                            ) : isVid ? (
                                                                <>
                                                                    {mediaPoster(item) ? (
                                                                        <div className="w-full h-full group-hover:scale-110 transition-transform duration-700">
                                                                            <img src={mediaThumbnail(item) || mediaPoster(item)} loading="lazy" decoding="async" className="w-full h-full object-cover opacity-90" alt="" style={fitStyle(mediaFit(item))} />
                                                                        </div>
                                                                    ) : (
                                                                        <div className="w-full h-full bg-zinc-800" />
                                                                    )}
                                                                    <div aria-hidden="true" className="absolute inset-0 flex items-center justify-center">
                                                                        <div className="w-12 h-12 bg-white/90 rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                                                                            <Play className="text-zinc-900 fill-zinc-900 ml-1" size={20} />
                                                                        </div>
                                                                    </div>
                                                                </>
                                                            ) : (
                                                                <>
                                                                    <div className="w-full h-full group-hover:scale-110 transition-transform duration-700">
                                                                        <img src={mediaThumbnail(item) || mediaUrl} loading="lazy" decoding="async" className="w-full h-full object-cover" alt="" style={fitStyle(mediaFit(item))} />
                                                                    </div>
                                                                    <div aria-hidden="true" className="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-colors flex items-center justify-center">
                                                                        <Maximize2 className="text-white opacity-0 group-hover:opacity-100 transition-opacity" size={24}/>
                                                                    </div>
                                                                </>
                                                            )}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="contents md:block md:space-y-6 md:min-w-0">
                                    {project.specs && (
                                        <div className="order-3 bg-zinc-900/50 border border-zinc-800 p-6 rounded-xl">
                                            <h4 className="text-sm font-bold text-zinc-500 uppercase tracking-widest mb-4">Specifications</h4>
                                            <div className="rich-text specs-rich-text text-zinc-300 text-sm leading-relaxed"
                                                 dangerouslySetInnerHTML={{ __html: demoteHeadings(project.specs, 5) }} />
                                        </div>
                                    )}

                                    {hasActions && (
                                        <div className="order-5 bg-zinc-900/50 border border-zinc-800 p-6 rounded-xl">
                                            <h4 className="text-sm font-bold text-zinc-500 uppercase tracking-widest mb-4">Actions</h4>
                                            <div className="space-y-3">
                                                {project.websiteLink && (
                                                    <a href={ensureProtocol(project.websiteLink)} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-colors font-medium shadow-lg shadow-blue-900/20">
                                                        <Globe size={18} aria-hidden="true" /> Visit Website
                                                        <span className="sr-only">(opens in a new tab)</span>
                                                    </a>
                                                )}
                                                {project.launchLink && (
                                                    <a href={ensureProtocol(project.launchLink)} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 w-full py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition-colors font-medium shadow-lg shadow-purple-900/20">
                                                        <ExternalLink size={18} aria-hidden="true" /> Launch App
                                                        <span className="sr-only">(opens in a new tab)</span>
                                                    </a>
                                                )}
                                                {project.shopLink && (
                                                    <a href={ensureProtocol(project.shopLink)} className="flex items-center justify-center gap-2 w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition-colors font-medium shadow-lg shadow-cyan-900/20">
                                                        <ShoppingCart size={18} aria-hidden="true" /> Buy Kit
                                                    </a>
                                                )}
                                                {project.githubLink && (
                                                    <a href={ensureProtocol(project.githubLink)} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg transition-colors font-medium border border-zinc-700">
                                                        <Github size={18} aria-hidden="true" /> View Code
                                                        <span className="sr-only">(opens in a new tab)</span>
                                                    </a>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {(project.files && project.files.length > 0) && (
                                        <div className="order-6 bg-zinc-900/50 border border-zinc-800 p-6 rounded-xl">
                                            <h4 className="text-sm font-bold text-zinc-500 uppercase tracking-widest mb-4">Downloads</h4>
                                            <ul className="space-y-3">
                                                {project.files.map((f, i) => {
                                                    const url = typeof f === 'string' ? f : f.url;
                                                    const name = typeof f === 'string' ? `File ${i+1}` : f.name;
                                                    const desc = typeof f === 'object' ? f.description : '';
                                                    return (
                                                        <li key={i} className="relative" onMouseEnter={() => setHoveredFile(i)} onMouseLeave={() => setHoveredFile(null)} onFocus={() => setHoveredFile(i)} onBlur={() => setHoveredFile(null)}>
                                                            <a href={ensureProtocol(url)} download aria-label={`Download ${name}, ${getFileExt(url)} file${desc ? '. ' + desc : ''}`} className="flex items-center gap-3 p-3 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition-colors group">
                                                                <div aria-hidden="true" className="bg-zinc-900 p-2 rounded text-zinc-400 group-hover:text-white">
                                                                    <FileIcon size={20}/>
                                                                </div>
                                                                <div className="flex-1 min-w-0">
                                                                    <div className="text-sm font-bold text-white truncate">{name}</div>
                                                                    <div className="text-xs text-zinc-500 uppercase tracking-wider">{getFileExt(url)}</div>
                                                                </div>
                                                                <Download size={16} aria-hidden="true" className="text-zinc-500 group-hover:text-cyan-400 transition-colors"/>
                                                            </a>
                                                            {hoveredFile === i && (
                                                                <div aria-hidden="true" className="absolute right-full bottom-0 mr-3 z-50 w-72 pointer-events-none">
                                                                    <div className="bg-zinc-900 border border-zinc-700 rounded-xl shadow-2xl p-4">
                                                                        <div className="flex items-start gap-3 mb-3">
                                                                            <div className="bg-zinc-800 p-2 rounded text-zinc-400 shrink-0">
                                                                                <FileIcon size={20}/>
                                                                            </div>
                                                                            <div className="min-w-0">
                                                                                <div className="text-sm font-bold text-white break-words leading-snug">{name}</div>
                                                                                <div className="text-xs text-cyan-400 uppercase tracking-wider mt-1">{getFileExt(url)} File</div>
                                                                            </div>
                                                                        </div>
                                                                        {desc && (
                                                                            <p className="text-xs text-zinc-400 leading-relaxed">{desc}</p>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </li>
                                                    );
                                                })}
                                            </ul>
                                        </div>
                                    )}

                                    {(!project.files || project.files.length === 0) && project.link && (
                                         <div className="order-7 bg-zinc-900/50 border border-zinc-800 p-6 rounded-xl">
                                            <a href={ensureProtocol(project.link)} className="flex items-center justify-center gap-2 w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg transition-colors font-medium">
                                                <Download size={18} /> Download Files
                                            </a>
                                         </div>
                                    )}

                                    {(project.related && project.related.length > 0) && (
                                        <div className="order-8 bg-zinc-900/50 border border-zinc-800 p-6 rounded-xl">
                                            <h4 className="text-sm font-bold text-zinc-500 uppercase tracking-widest mb-4">Related</h4>
                                            <ul className="space-y-3">
                                                {project.related.map((r, i) => {
                                                    const isLocalHash = r.url && r.url.startsWith('#project/');
                                                    const linkedId = isLocalHash ? decodeURIComponent(r.url.slice('#project/'.length)) : null;
                                                    const linkedProject = linkedId ? projects.find(p => p.id === linkedId) : null;
                                                    const displayTitle = (isLocalHash && linkedProject) ? linkedProject.title : r.name;
                                                    const displayImage = (isLocalHash && linkedProject) ? linkedProject.image : null;

                                                    if (isLocalHash) {
                                                        return (
                                                            <li key={i} className="relative" onMouseEnter={() => setHoveredRelated(i)} onMouseLeave={() => setHoveredRelated(null)} onFocus={() => setHoveredRelated(i)} onBlur={() => setHoveredRelated(null)}>
                                                                <a href={r.url} aria-label={`View related project: ${displayTitle}`} className="flex items-center gap-3 p-3 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition-colors group">
                                                                    {displayImage ? (
                                                                        <div className="w-10 h-10 rounded shrink-0 overflow-hidden bg-zinc-700">
                                                                            <img src={displayImage} alt="" className="w-full h-full object-cover" style={fitStyle(linkedProject.thumbnailFit)} />
                                                                        </div>
                                                                    ) : (
                                                                        <div aria-hidden="true" className="w-10 h-10 rounded bg-zinc-700 shrink-0 flex items-center justify-center text-zinc-500">
                                                                            <FileIcon size={18}/>
                                                                        </div>
                                                                    )}
                                                                    <span className="flex-1 min-w-0 text-sm font-medium text-white truncate">{displayTitle}</span>
                                                                    <ChevronRight size={14} aria-hidden="true" className="text-zinc-600 group-hover:text-cyan-400 shrink-0 transition-colors"/>
                                                                </a>
                                                                {hoveredRelated === i && linkedProject && (
                                                                    <div aria-hidden="true" className="hidden md:block absolute right-full bottom-0 mr-3 z-50 w-72 pointer-events-none">
                                                                        <div className="bg-zinc-900 border border-zinc-700 rounded-xl shadow-2xl overflow-hidden">
                                                                            {linkedProject.image && (
                                                                                <div className="aspect-video w-full overflow-hidden">
                                                                                    <img src={linkedProject.image} alt="" className="w-full h-full object-cover" style={fitStyle(linkedProject.thumbnailFit)} />
                                                                                </div>
                                                                            )}
                                                                            <div className="p-3">

                        </div>
                        
                        <footer className="mt-20 text-zinc-600 text-sm font-mono">
                            &copy; 2026 Chris Moore Designs. All rights reserved.
                        </footer>
                    </div>
                    {showModal && settings.email && <ContactModal email={settings.email} onClose={() => setShowModal(false)} emailConfig={emailConfig} />}
                </section>
            );
        };

        const FilteredView = ({ filter, onClear, onOpenProject }) => {
            const matching = projects.filter(p => p.tags && p.tags.includes(filter));
            return (
                <section className="pt-32 pb-20 bg-black min-h-[60vh]">
                    <div className="container mx-auto px-6">
                        <div className="mb-12">
                            <div className="flex items-center gap-3 text-cyan-400 mb-2 font-mono text-sm uppercase tracking-widest">
                                <Filter size={16} />
                                <span>Filtered by Skill</span>
                            </div>
                            <div className="flex items-center gap-4 flex-wrap">
                                <h2 className="text-3xl md:text-4xl font-bold">{filter}</h2>
                                <button type="button" onClick={onClear} className="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-zinc-400 bg-zinc-800 border border-zinc-700 rounded-lg hover:bg-zinc-700 hover:text-white transition-colors">
                                    <X size={14} /> Clear Filter
                                </button>
                            </div>
                        </div>
                        {matching.length > 0 ? (
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {matching.map(p => (
                                    <ProjectCard key={p.id} project={p} onOpen={onOpenProject} />
                                ))}
                            </div>
                        ) : (
                            <div className="p-12 border border-dashed border-zinc-800 rounded-xl text-center text-zinc-500">
                                <p className="text-lg mb-2">No projects tagged with "{filter}" yet.</p>
                                <p className="text-sm">Tag projects with this skill in the CMS to see them here.</p>
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const App = () => {
            const [selectedProject, setSelectedProject] = useState(null);
            const [activeFilter, setActiveFilter] = useState(null);
            const pushedHash = useRef(false);
            const justOpenedFromCard = useRef(false);

            useEffect(() => {
                const syncFromHash = () => {
                    const hash = window.location.hash;
                    if (hash.startsWith('#project/')) {
                        const id = decodeURIComponent(hash.slice('#project/'.length));
                        const found = projects.find(p => p.id === id);
                        if (found) {
                            if (justOpenedFromCard.current) {
                                justOpenedFromCard.current = false;
                            }
                            setSelectedProject(found);
                        } else {
                            setSelectedProject(null);
                            pushedHash.current = false;
                            justOpenedFromCard.current = false;
                        }
                    } else {
                        setSelectedProject(null);
                        pushedHash.current = false;
                        justOpenedFromCard.current = false;
                    }
                };
                syncFromHash();
                window.addEventListener('hashchange', syncFromHash);
                return () => window.removeEventListener('hashchange', syncFromHash);
            }, []);

            const handleOpenProject = (project) => {
                pushedHash.current = true;
                justOpenedFromCard.current = true;
                window.location.hash = 'project/' + encodeURIComponent(project.id);
            };

            const handleCloseProject = () => {
                pushedHash.current = false;
                justOpenedFromCard.current = false;
                history.replaceState(null, '', window.location.pathname + window.location.search);
                setSelectedProject(null);
            };

            const handleSetFilter = (tag) => {
                setActiveFilter(tag);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleFilterByTag = (tag) => {
                handleCloseProject();
                handleSetFilter(tag);
            };

            const handleNavToSection = (id) => {
                setActiveFilter(null);
                setTimeout(() => {
                    history.replaceState(null, '', '#' + id);
                    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
                }, 0);
            };

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-200 selection:bg-cyan-500/30">
                    <a href="#main-content" className="skip-link">Skip to main content</a>
                    <Nav onNavToSection={handleNavToSection} />
                    <main id="main-content">
                    {activeFilter ? (
                        <FilteredView filter={activeFilter} onClear={() => setActiveFilter(null)} onOpenProject={handleOpenProject} />
                    ) : (
                        <>
                        <Hero />
                        
                        <SimpleSection 
                            id="lighting" 
                            title="Lighting" 
                            subtitle="Lighting Design" 
                            icon={Lightbulb} 
                            category="Lighting" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-black"
                        />
                        
                        <SimpleSection 
                            id="art" 
                            title="Art" 
                            subtitle="Sculpture & Form" 
                            icon={Palette} 
                            category="Art" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-zinc-950"
                        />
                        <SimpleSection 
                            id="fixtures" 
                            title="Fixtures" 
                            subtitle="Custom Fixtures" 
                            icon={Cpu} 
                            category="Fixtures" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-black"
                        />
                        <SimpleSection 
                            id="software" 
                            title="Software" 
                            subtitle="Applications" 
                            icon={Smartphone} 
                            category="Software" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-zinc-950"
                        />
                        <SimpleSection 
                            id="tooling" 
                            title="Shop" 
                            subtitle="Tools & Repair" 
                            icon={Wrench} 
                            category="Tooling" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-black"
                        />
                        <SimpleSection 
                            id="systems" 
                            title="Systems" 
                            subtitle="Show Control" 
                            icon={Layers} 
                            category="Systems" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-zinc-950"
                        />
                        </>
                    )}
                    
                    <AboutMe onFilterBySkill={handleSetFilter} />
                    
                    <Contact />
                    </main>
                    
                    {selectedProject && (
                        <ProjectModal 
                            project={selectedProject} 
                            onClose={handleCloseProject}
                            onFilterByTag={handleFilterByTag}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
