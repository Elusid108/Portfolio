ebp"}],"files":[],"specs":"\u003ch2>FIXTURE BRANDS\u003c/h2>\u003cp>\u003cstrong>Martin\u003c/strong>\u003c/p>\u003cp>\u003cstrong>Clay Paky\u003c/strong>\u003c/p>\u003cp>\u003cstrong>ETC\u003c/strong>\u003c/p>\u003cp>\u003cstrong>Vari-Lite\u003c/strong>\u003c/p>\u003cp>\u003cstrong>High End\u003c/strong>\u003c/p>\u003cp>\u003cstrong>ElektraLite\u003c/strong>\u003c/p>\u003cp>\u003cstrong>Generic Clones\u003c/strong>\u003c/p>\u003ch2>SFX\u003c/h2>\u003cp>\u003cstrong>Hazers\u003c/strong>\u003c/p>\u003cp>\u003cstrong>Foggers\u003c/strong>\u003cbr>\u003cem>Worst repair on the list\u003c/em>\u003c/p>\u003cp>\u003cstrong>Cryo\u003c/strong>\u003c/p>\u003cp>\u003cstrong>Snow\u003c/strong>\u003c/p>\u003cp>\u003cstrong>Confetti\u003c/strong>\u003c/p>\u003cp>\u003cstrong>Bubbles\u003c/strong>\u003c/p>\u003ch2>BENCH &amp; THROUGHPUT\u003c/h2>\u003cp>\u003cstrong>Typical week\u003c/strong>\u003cbr>\u003cem>30-40 lights • Brown Note\u003c/em>\u003c/p>\u003cp>\u003cstrong>Tenure\u003c/strong>\u003cbr>\u003cem>~1 year Barbizon • ~2 years Brown Note lighting service\u003c/em>\u003c/p>\u003cp>\u003cstrong>Install maintenance\u003c/strong>\u003cbr>\u003cem>Glow Lounge • monthly • about a year\u003c/em>\u003c/p>\u003ch2>REPAIR SCOPE\u003c/h2>\u003cp>\u003cstrong>Movers\u003c/strong>\u003cbr>\u003cem>Power-on motion • feel for grinding steppers • harness • spare motor • then driver\u003c/em>\u003c/p>\u003cp>\u003cstrong>Preventive\u003c/strong>\u003cbr>\u003cem>Blow fans • wipe optics\u003c/em>\u003c/p>\u003cp>\u003cstrong>Power supplies\u003c/strong>\u003cbr>\u003cem>AC/DC isolation (VL1000 lesson)\u003c/em>\u003c/p>","related":[{"name":"Immersive Dance Lighting Rig","url":"#project/1"},{"name":"Immersive Lighting Layer","url":"#project/2395"},{"name":"Temple SF","url":"#project/8252"},{"name":"Temple Denver","url":"#project/4382"},{"name":"Tracks Discotheque","url":"#project/3671"},{"name":"Glow Lounge","url":"#project/3309"},{"name":"Architectural Lighting","url":"#project/299"},{"name":"The Basement","url":"#project/5045"}],"video":"","timestamp":"2026-09-05T01:52:02.598Z","id":"1862","order":1,"thumbnailFit":{"scale":1.15,"x":0,"y":63.5,"rotate":0},"bannerFit":{"scale":1,"x":47.9,"y":21.9,"rotate":0},"slug":"lighting-and-sfx-service","imageThumb":"media/Fabrication/Lighting & SFX Service/Lighting-SFX-Service-img-d2e5bf-thumb.webp"},{"title":"LED Video Panel Service","category":"Tooling","image":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-616e44.webp","thumbnail":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-616e44-thumb.webp","description":"\u003cp>One enamel-wire jumper pinched a live screw pad. The panel caught fire on site. I never routed a repair that way again.\u003c/p>","longDescription":"\u003cp>The worst module I ever put back out taught me the hard way. I had jumped a ripped pad with enamel wire and did not know the screw pads in that frame were electrically live. The wire got pinched under a screw. On site, during the day, the panel caught fire. The crew put it out fast. I took the burned board apart until I understood exactly what I had done, and I never routed a jumper that close to a mounting hole again.\u003c/p>\u003cp>At Brown Note Productions I was the LED video panel tech across two stints that added up to about three years. Cases came back from festivals missing LEDs, pads, and sometimes chunks of board. Absen and ROE sent technicians to train me on their products, everything else I taught myself on the bench.\u003c/p>\u003cp>Most of the work was a reflow station putting knocked-off pixels back on. When the pads were gone, a short enamel wire jumped the break in the multiplexed array. These were mostly waterproof screens, so the iron never went straight to the face. Mask off, silicone scraped out, and on the bad ones the PCB came out of the housing so the plastic did not melt while I worked. Beyond the diodes I straightened bent frames and repaired the large spine PCBs that held the receiving cards, plus power supplies, ports, latches, and front masks.\u003c/p>\u003cp>Speed mattered. Damaged panels rotated in constantly. I marked every dead pixel with a dry-erase marker, pulled modules out of the frames in a batch, and worked the easy ones first. A normal day was a hundred to a hundred and fifty LEDs, often fifty or more modules. Trace repairs waited until later. End of day, silicone on everything finished. Next morning, masks back on, modules into the repaired stock, and the cycle started over.\u003c/p>\u003cp>I took the same bench process to Temple San Francisco to keep the immersive video ceiling alive when replacement modules were scarce, and to the wall in the basement at Triangle.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["SMD Soldering","Reflow","Repair","LED Video"],"gallery":[{"url":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-b16a82.webp","fit":{"scale":1,"x":53.2,"y":8.7,"rotate":0},"thumbnail":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-b16a82-thumb.webp"},{"url":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-3161d6.webp","thumbnail":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-3161d6-thumb.webp"},{"url":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-f1e8d6.webp","thumbnail":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-f1e8d6-thumb.webp"},{"url":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-ca2758.webp","thumbnail":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-ca2758-thumb.webp"},{"url":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-3f3c60.webp","thumbnail":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-3f3c60-thumb.webp"},{"url":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-4db34a.we ory tech training\u003c/em>\u003c/p>\u003cp>\u003cstrong>GTEK\u003c/strong>\u003c/p>\u003ch2>BENCH &amp; THROUGHPUT\u003c/h2>\u003cp>\u003cstrong>Typical day\u003c/strong>\u003cbr>\u003cem>100-150 LED pixels • ~50+ modules\u003c/em>\u003c/p>\u003cp>\u003cstrong>Tenure\u003c/strong>\u003cbr>\u003cem>~3 years across two stints at Brown Note Productions\u003c/em>\u003c/p>\u003cp>\u003cstrong>Reflow station\u003c/strong>\u003cbr>\u003cem>Knocked-off SMD LED replacement\u003c/em>\u003c/p>\u003cp>\u003cstrong>Trace repair\u003c/strong>\u003cbr>\u003cem>Enamel wire jumper on multiplexed arrays\u003c/em>\u003c/p>\u003ch2>REPAIR SCOPE\u003c/h2>\u003cp>\u003cstrong>Pixels &amp; pads\u003c/strong>\u003cbr>\u003cem>Reflow • ripped-pad jumpers\u003c/em>\u003c/p>\u003cp>\u003cstrong>Waterproof prep\u003c/strong>\u003cbr>\u003cem>Mask removal • silicone scrape • PCB pull from housing\u003c/em>\u003c/p>\u003cp>\u003cstrong>Mechanicals\u003c/strong>\u003cbr>\u003cem>Bent frames • latches • front masks\u003c/em>\u003c/p>\u003cp>\u003cstrong>Electronics\u003c/strong>\u003cbr>\u003cem>Spine PCB • receiving cards • power supplies • ports\u003c/em>\u003c/p>","related":[{"name":"Immersive Dance Lighting Rig","url":"#project/1"},{"name":"Immersive Video Layer","url":"#project/4250"},{"name":"Temple SF","url":"#project/8252"},{"name":"The Basement","url":"#project/5045"},{"name":"Tracks Discotheque","url":"#project/3671"},{"name":"Immersive Lighting Layer","url":"#project/2395"}],"video":"","timestamp":"2026-09-05T01:53:03.450Z","id":"4623","order":0,"thumbnailFit":{"scale":1,"x":50,"y":37.9,"rotate":0},"bannerFit":{"scale":1,"x":59.3,"y":60.8},"slug":"led-video-panel-service","imageThumb":"media/Fabrication/LED Video Panel Service/LED-Video-Panel-Service-img-616e44-thumb.webp"},{"title":"Chain Hoist Service","category":"Tooling","image":"media/Fabrication/Chain Hoist Service/Chain-Hoist-Service-Repair-img-24e9d8.webp","thumbnail":"media/Fabrication/Chain Hoist Service/Chain-Hoist-Service-Repair-img-1b986b-thumb.webp","description":"\u003cp>A whole show of 1-ton motors sat in wet cases for days. Every one came apart for rust and new brake pads.\u003c/p>","longDescription":"\u003cp>A whole show of 1-ton motors sat in their wet cases for a few days. The entire batch came apart: rust knocked off, brake pads replaced, every shell opened. It was exhausting.\u003c/p>\u003cp>At Brown Note Productions I was the full-time chain hoist tech for about two years of my first stint. Columbus McKinnon came in and trained a handful of us on Lodestar service. The certification was good for four years, which covered the time I was there. I was the one who actually did it full time. Before that, the company sent motors out to a third party. We took the work in-house and started servicing the inventory retroactively, gaskets included.\u003c/p>\u003cp>The warehouse was an endless rotation. Good equipment went out. Questionable equipment came back. Everything got cleaned and tested, then packed for the next gig or put into a service cycle. Hoists were no different, except people hang under them, so the pass was stricter. Service stickers tracked the dates. I kept written logs as well.\u003c/p>\u003cp>Chain inspection was always first. Then the shell came off. Rust was almost a guarantee. If it rained on a gig and the cases sat, motors rusted overnight. I knocked the rust out, replaced gaskets to slow the next round, changed brake pads, set limits, checked electrical, and repaired the control and power boxes that sit on the ground. Load tests closed the cycle. The gaskets helped, but every motor in the shop needed them.\u003c/p>\u003cp>I cycled through about fifty motors a week: quarter-ton, half-ton, 1-ton, and 2-ton CM touring Lodestars.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":[],"gallery":[{"url":"media/Fabrication/Chain Hoist Service/Chain-Hoist-Service-Repair-img-6f3e12.webp","fit":{"scale":1.15,"x":51 u003cbr>\u003cem>~2 years • first stint\u003c/em>\u003c/p>\u003cp>\u003cstrong>Typical week\u003c/strong>\u003cbr>\u003cem>~50 motors\u003c/em>\u003c/p>\u003ch2>SERVICE SCOPE\u003c/h2>\u003cp>\u003cstrong>Records\u003c/strong>\u003cbr>\u003cem>Service stickers • written logs\u003c/em>\u003c/p>\u003cp>\u003cstrong>First check\u003c/strong>\u003cbr>\u003cem>Chain inspection\u003c/em>\u003c/p>\u003cp>\u003cstrong>Corrosion\u003c/strong>\u003cbr>\u003cem>Rust de-scale • gasket replacement\u003c/em>\u003c/p>\u003cp>\u003cstrong>Mechanical\u003c/strong>\u003cbr>\u003cem>Brake pads • limits\u003c/em>\u003c/p>\u003cp>\u003cstrong>Electrical\u003c/strong>\u003cbr>\u003cem>Components • ground control and power boxes\u003c/em>\u003c/p>\u003cp>\u003cstrong>Proof\u003c/strong>\u003cbr>\u003cem>Load test\u003c/em>\u003c/p>","related":[{"name":"Temple Denver","url":"#project/4382"},{"name":"The Orb","url":"#project/6841"}],"video":"","timestamp":"2026-09-05T01:55:24.530Z","id":"989","order":2,"thumbnailFit":{"scale":1,"x":53.9,"y":49.1,"rotate":0},"bannerFit":{"scale":1,"x":49.8,"y":54.8,"rotate":0},"slug":"chain-hoist-service"},{"title":"Mini Heart","category":"Art","image":"media/Art/Mini Heart/Mini-Heart-img-ac4b50.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-img-2d5c96-thumb.webp","description":"\u003cp>Even at this size, the LEDs generate enough heat to melt the plastic if the current runs wide open.\u003c/p>","longDescription":"\u003cp>The idea was a simple subdivided heart I could hand out as gifts. This is the second 8x8 sculpture I built, scaled down to run off a standard USB port. I printed a two-material QR code directly into the base. Since the print is short, standard black and white PLA was enough to let the light punch through the surface.\u003c/p>\u003cp>I modeled the whole thing in Solidworks. The first batch came off an old TenLog IDEX printer, and the surface was rough. Moving the job to an X1C smoothed things out. Even at this size, the LEDs generate heat. I had to limit the current in software to prevent thermal runaway and damage to the model. I gave them to friends and family for Valentine's Day. They plug into any USB block and run a preset playlist of patterns.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":[],"gallery":[{"url":"media/Art/Mini Heart/models/Mini-Heart-gfx-1f75e6.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":-0.0262,"phi":0.3257,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.35,"x":63.8,"y":33.4},"poster":"media/Art/Mini Heart/Mini-Heart-gfx-1f75e6-poster.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-gfx-1f75e6-poster-thumb.webp"},{"url":"media/Art/Mini Heart/Mini-Heart-vid-820e04.mp4","poster":"media/Art/Mini Heart/Mini-Heart-img-1b8af8.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-img-1b8af8-thumb.webp"},{"url":"media/Art/Mini Heart/Mini-Heart-vid-2549a4.mp4","poster":"media/Art/Mini Heart/Mini-Heart-vid-2549a4-poster.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-vid-2549a4-poster-thumb.webp"},{"url":"media/Art/Mini Heart/Mini-Heart-img-2b2175.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-img-2b2175-thumb.webp"},{"url":"media/Art/Mini Heart/Mini-Heart-img-4fbee1.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-img-4fbee1-thumb.webp"},{"url":"media/Art/Mini Heart/Mini-Heart-img-16ca03.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-img-16ca03-thumb.webp"},{"url":"media/Art/Mini Heart/Mini-Heart-img-73edfa.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-img-73edfa-thumb.webp"},{"url":"media/Art/Mini Heart/Mini-Heart-img-948af8.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-img-948af8-thumb.webp"}],"files":[{"name":"Mini Heart.zip","url":"media/Art/Mini Heart/files/Mini Heart.zip","description":"Single‑plate .3mf with every printed part for the Mini Heart, ready to slice and assemble. Fits a 8x8 WS2812b matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Mini Heart/Mini-Heart-img-27ee92.webp","thumbnail":"media/Art/Mini Heart/Mini-Heart-img-27ee92-thumb.webp","thumbnailFit":{"scale":1.5,"x":58.4,"y":47.3}}],"specs":"","related":[],"video":"","timestamp":"2026-09-05T22:51:50.484Z","id":"8230","order":11,"thumbnailFit":{"scale":1.1,"x":0.1,"y":44.7,"rotate":0},"bannerFit":{"scale":1.25,"x":100,"y":44.5,"rotate":0},"slug":"mini-heart","imageThumb":"media/Art/Mini Heart/Mini-Heart-img-ac4b50-thumb.webp"}],"settings":{"email":"chrismooredesignsllc@gmail.com","instagram":"https://www.instagram.com/pixel_freak/#","linkedin":"https://www.linkedin.com/in/christopher-moore-39a3b6211","github":"https://github.com/Elusid108","emailjs_service":"service_uk1sc0n","emailjs_template":"template_y1ut396","emailjs_public_key":"9xxn3H48uT3zIv6Jl","about_headshot":"media/headshot_1.webp","about_text":"\u003cp>I'm a multidisciplinary technologist and designer currently building a new career in robotics, with a hands-on background in lighting design, rapid prototyping, and interactive systems. My work blends physical fabrication and digital tools, designing lighting installations, building custom electronics, developing apps, and using 3D printing to move quickly from idea to functional object. I'm most at home in the space where creative intent meets technical execution.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>I focus on making systems that are practical, resilient, and thoughtfully designed. That means understanding circuitry and power, iterating hardware through real-world use, and building software that supports the experience without unnecessary complexity. I'm drawn to robotics because it demands the same mindset I've used for years, working with constraints, debugging in the physical world, and designing for safety, feedback, and reliability. I
