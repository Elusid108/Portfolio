.webp","fit":{"scale":1.3,"x":21.4,"y":81.2},"thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-img-cd25e7-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-img-bec194.webp","fit":{"scale":1,"x":19.8,"y":27.1},"thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-img-bec194-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-img-fd3106.webp","fit":{"scale":1.35,"x":37.2,"y":24.7},"thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-img-fd3106-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-img-e58276.webp","fit":{"scale":1.1,"x":77.5,"y":31.7},"thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-img-e58276-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-img-3ae42b.webp","thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-img-3ae42b-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-vid-258729.mp4","thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-vid-258729-poster-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-vid-dfb38d.mp4","thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-vid-dfb38d-poster-thumb.webp"}],"files":[],"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Beam (x8)\u003c/strong>\u003cbr>\u003cem>ColorfulLighting • PD60 • LED • beam 4° • 60W • RGBW • infinite pan &amp; tilt\u003c/em>\u003c/p>\u003cp>\u003cstrong>Beye (x4)\u003c/strong>\u003cbr>\u003cem>ColorfulLighting • B6 • LED • wash + FX hybrid • 240W • RGBW\u003c/em>\u003c/p>\u003cp>\u003cstrong>Hybrid (x2)\u003c/strong>\u003cbr>\u003cem>Chauvet • Intimidator Hybrid\u003c/em>\u003c/p>\u003ch2>COMPUTE &amp; CONTROL\u003c/h2>\u003cp>\u003cstrong>Lighting Console (x1)\u003c/strong>\u003cbr>\u003cem>WOLFMIX WMX1 • 1u unlocked\u003c/em>\u003c/p>","related":[{"name":"Lighting & SFX Service","url":"#project/1862"}],"video":"","timestamp":"2026-08-14T22:12:34.696Z","id":"3309","order":4,"slug":"glow-lounge","imageThumb":"media/Lighting/Glow Lounge/Glow-Lounge-img-9fcfdb-thumb.webp"},{"title":"Mezzanine Bar","category":"Lighting","image":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-img-5baeb6.webp","thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-img-5baeb6-thumb.webp","thumbnailFit":{"scale":1,"x":48.6,"y":40.8},"bannerFit":{"scale":1,"x":48.6,"y":37.4},"description":"\u003cp>The bottle shelves turned out to be wood blocks with sheet metal on top. Twenty-three extrusions, and gaps I had to fake in the patch.\u003c/p>","longDescription":"\u003cp>I didn't realize how the mezzanine bar at Que Bueno Suerte was built until I got there. The bottle shelves were blocks of wood with sheet metal stacked on top. I needed to wash the bottles from the front without exposing the wiring. I pre-cut 23 segments of aluminum extrusion and built the strips on a workbench. I soldered and heat-shrunk 3000K RGBW tape inside 45-degree channels, leaving wire whips on both ends.\u003c/p>\u003cp>I stuck the tracks to the top of each metal plate with foam tape. I used Dolphin crimps to splice the segments into four rows. To hide the connections, I ran cables between the wood blocks and sleeved the gaps in wire wrap.\u003c/p>\u003cp>The space under the bar had a different constraint. At night, the staff turned the mezzanine into a dance floor and shoved heavy tables underneath. Knees, coats, and sliding furniture were going to hit the lighting. I loaded more tape into an extrusion and siliconed it directly to the underside of the bar. I mounted it far enough back to survive the room flips.\u003c/p>\u003cp>Every line ran to an Advatek decoder and a power supply hidden behind the bar. I patched the rig in Madrix. Because the shelves were staggered, I had to approximate the empty space in the software patch so effects would travel at the right speed. When the rig fired up, the fire presets moved naturally across the metal plates.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-ff69d4.mp4","fit":{"scale":1,"x":47.5,"y":37.3},"poster":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-ff69d4-poster.webp","thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-ff69d4-poster-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-a674bd.mp4","fit":{"scale":1.1,"x":100,"y":31.4},"poster":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-a674bd-poster.webp","thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-a674bd-poster-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-img-23f841.webp","fit":{"scale":1,"x":50.2,"y":22.4},"thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-img-23f841-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-32bd0d.mp4","fit":{"scale":1,"x":43.4,"y":8.1},"poster":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-32bd0d-poster.webp","thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-32bd0d-poster-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-519826.mp4","fit":{"scale":1,"x":52.1,"y":29},"poster":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-519826-poster.webp","thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-519826-poster-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-95e184.mp4","fit":{"scale":1,"x":50,"y":50},"poster":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-95e184-poster.webp","thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-95e184-poster-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-9942a9.mp4","fit":{"scale":1,"x":50,"y":43.7},"poster":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-9942a9-poster.webp","thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-9942a9-poster-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-824cce.mp4","fit":{"scale":1,"x":50.5,"y":43},"poster":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-824cce-poster.webp","thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-vid-824cce-poster-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-img-b53789.webp","fit":{"scale":1,"x":19.9,"y":27},"thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-img-b53789-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-img-db359f.webp","fit":{"scale":1,"x":50,"y":59.8},"thumbnail":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-img-db359f-thumb.webp"}],"files":[],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixel Tape (x26.3m)\u003c/strong>\u003cbr>\u003cem>qty: 526px • WS2814 • RGBW (3000k) • 12Vdc • 60/m • 20px/m\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x2)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • HLG-320H-12 • 12Vdc • 22A\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Advatek • R4D-S\u003c/em>\u003c/p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"}],"video":"","timestamp":"2026-08-14T23:16:48.264Z","id":"9280","order":9,"slug":"mezzanine-bar","imageThumb":"media/Lighting/Mezzanine Bar/Mezzanine-Bar-img-5baeb6-thumb.webp"},{"title":"Bubblescape","category":"Art","image":"media/Art/Bubblescape/Bubblescape-img-3a8e7c.webp","thumbnail":"media/Art/Bubblescape/Bubblescape-img-3a8e7c-thumb.webp","thumbnailFit":{"scale":1,"x":52.1,"y":31.6},"bannerFit":{"scale":1,"x":50,"y":27.7},"description":"\u003cp>Fused spheres, and not one overhang anywhere. An overhang makes a pocket the matrix underneath can never reach.\u003c/p>","longDescription":"\u003cp>A cluster of soap bubbles, lit from behind. That was the whole picture in my head. Every piece before this had come out of SolidWorks, but SolidWorks does not want to make bubbles, so this one pulled Blender into the workflow for the first time. I took spheres of different sizes and fused them together until the surface read as a cluster.\u003c/p>\u003cp>The organic surface made the inside harder. The print uses three materials, black for the mask, white to bounce light, and clear for diffusion, over a 16 x 16 matrix. Keeping the internal grid even under a lumpy exterior was a step up in complexity. The pixels cannot get close enough to the face to hotspot, and the model cannot have a single overhang. An overhang makes a pocket the matrix underneath can never reach, and it shows up as a dead dark spot in the middle of a glowing bubble.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","FDM 3D Printing","Lighting Design","Rapid Prototyping","SPI","WLED"],"gallery":[{"url":"media/Art/Bubblescape/models/Bubblescape-gfx-b0631e.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1},{"name":"Part_3","color":"#9ca3af","opacity":0.5}],"view":{"theta":0.0268,"phi":0.6614,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.4,"x":56.4,"y":34.4},"poster":"media/Art/Bubblescape/Bubblescape-gfx-b0631e-poster.webp","thumbnail":"media/Art/Bubblescape/Bubblescape-gfx-b0631e-poster-thumb.webp"},{"url":"media/Art/Bubblescape/Bubblescape-vid-d009f0.mp4","fit":{"scale":1,"x":48.8,"y":30},"poster":"media/Art/Bubblescape/Bubblescape-vid-d009f0-poster.webp","thumbnail":"media/Art/Bubblescape/Bubblescape-vid-d009f0-poster-thumb.webp"}],"files":[{"name":"Bubblescape.zip","url":"media/Art/Bubblescape/files/Bubblescape.zip","description":"Multi‑plate .3mf with every printed part for the Bubblescape, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Bubblescape/Bubblescape-img-08f61b.webp","thumbnail":"media/Art/Bubblescape/Bubblescape-img-08f61b-thumb.webp","thumbnailFit":{"scale":1.3,"x":62.1,"y":32}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>bounce\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( &quot;Transparent&quot; )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"Celtic Owl","url":"#project/8609"},{"name":"Scream-Face","url":"#project/1829"},{"name":"Face","url":"#project/4827"}],"video":"","timestamp":"2026-08-16T19:45:09.127Z","id":"9191","order":7,"slug":"bubblescape","imageThumb":"media/Art/Bubblescape/Bubblescape-img-3a8e7c-thumb.webp"},{"title":"Zig-Zag","category":"Art","image":"media/Art/Zig-Zag/Zig-Zag-img-43ffc3.webp","thumbnail":"media/Art/Zig-Zag/Zig-Zag-img-43ffc3-thumb.webp","thumbnailFit":{"scale":1,"x":50,"y":22.4},"bannerFit":{"scale":1,"x":50.2,"y":21.4},"description":"\u003cp>Every other panel keeps its shape inside one cell. This pattern runs across all 256.\u003c/p>","longDescription":"\u003cp>Every other panel in this series keeps its shape inside a single cell. Zig-Zag was the first time I let a pattern run across cells. Off, the front is a flat white square. On, a repeating grid of alternating L shapes punches through, and because each L spans several cells the shapes read as one continuous figure across the whole face instead of 256 little pictures.\u003c/p>\u003cp>Behind the face, a black internal grid divides the board into 10 mm cells so each light stays isolated even where the pattern crosses over. I printed it face down, white diffusion layer first, black walls built directly behind it, with a small controller running WLED for the animation. The whole effect lives or dies on the thickness of that white layer. Too thin and you can see the plastic shapes resting behind it when the piece is off. Too thick and the LEDs cannot push through. One millimeter was the exact limit.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","FDM 3D Printing","Lighting Design","Rapid Prototyping","SPI","WLED"],"gallery":[{"url":"media/Art/Zig-Zag/models/Zig-Zag-gfx-ed8578.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":-0.0026,"phi":0,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.25,"x":60.7,"y":35},"poster":"media/Art/Zig-Zag/Zig-Zag-gfx-ed8578-poster.webp","thumbnail":"media/Art/Zig-Zag/Zig-Zag-gfx-ed8578-poster-thumb.webp"},{"url":"media/Art/Zig-Zag/Zig-Zag-vid-37ca00.mp4","fit":{"scale":1,"x":50,"y":20.2},"poster":"media/Art/Zig-Zag/Zig-Zag-vid-37ca00-poster.webp","thumbnail":"media/Art/Zig-Zag/Zig-Zag-vid-37ca00-poster-thumb.webp"}],"files":[{"name":"Zig-Zag.zip","url":"media/Art/Zig-Zag/files/Zig-Zag.zip","description":"Multi‑plate .3mf with every printed part for the Zig-Zag, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Zig-Zag/Zig-Zag-img-63afc5.webp","thumbnail":"media/Art/Zig-Zag/Zig-Zag-img-63afc5-thumb.webp","thumbnailFit":{"scale":1.25,"x":74.7,"y":49.2}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T19:50:18.919Z","id":"7412","order":16,"slug":"zig-zag","imageThumb":"media/Art/Zig-Zag/Zig-Zag-img-43ffc3-thumb.webp"},{"title":"Clay Face","category":"Art","image":"media/Art/Clay Face/Clay-Face-img-1c6627.webp","thumbnail":"media/Art/Clay Face/Clay-Face-img-1c6627-thumb.webp","thumbnailFit":{"scale":1.15,"x":14.2,"y":39.1},"bannerFit":{"scale":1,"x":50,"y":36.3},"description":"\u003cp>First thing I'd sculpted since grade school. Kept simple enough for the scanner to see it and a 16x16 grid to divide it.\u003c/p>","longDescription":"\u003cp>The last time I had sculpted anything by hand was a grade-school art class. I shaped this mask out of white modeling clay, keeping it rough and simple on purpose: simple enough for a hand scanner to read, and simple enough that a 16 x 16 grid could divide it without fighting the surface.\u003c/p>\u003cp>The scan refused to cooperate anyway. The RevoPop kept leaving holes in the mesh that I struggled to close, and the sculpt did not have enough vertical height at the base to fit the hardware. I ended up running a low-poly pass over the whole scan just to force it into a closed shape. Once I had a solid model, I pulled it into Blender and built the internal subdivision to isolate 256 pixels behind it.\u003c/p>\u003cp>The result is a rough, hand-made exterior sitting on a perfectly rigid grid of black walls and white diffusion. The two do not look like they belong together until the lights come on.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Lighting Design","FDM 3D Printing","Rapid Prototyping","SPI","WLED"],"gallery":[{"url":"media/Art/Clay Face/models/Clay-Face-gfx-ee7ba7.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":-0.0027,"phi":0.3846,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.3,"x":69.2,"y":35.4},"poster":"media/Art/Clay Face/Clay-Face-gfx-ee7ba7-poster.webp","thumbnail":"media/Art/Clay Face/Clay-Face-gfx-ee7ba7-poster-thumb.webp"},{"url":"media/Art/Clay Face/Clay-Face-vid-3795d3.mp4","fit":{"scale":1.1,"x":4.3,"y":41.1},"poster":"media/Art/Clay Face/Clay-Face-vid-3795d3-poster.webp","thumbnail":"media/Art/Clay Face/Clay-Face-vid-3795d3-poster-thumb.webp"},{"url":"media/Art/Clay Face/Clay-Face-img-7d6bbb.webp","fit":{"scale":1.2,"x":53.4,"y":47.5,"rotate":3},"thumbnail":"media/Art/Clay Face/Clay-Face-img-7d6bbb-thumb.webp"},{"url":"media/Art/Clay Face/Clay-Face-img-2f12a8.webp","fit":{"scale":1.15,"x":63.4,"y":49,"rotate":-3},"thumbnail":"media/Art/Clay Face/Clay-Face-img-2f12a8-thumb.webp"}],"files":[{"name":"Clay Face.zip","url":"media/Art/Clay Face/files/Clay Face.zip","description":"Multi‑plate .3mf with every printed part for the Clay Face, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Clay Face/Clay-Face-img-5fc80d.webp","thumbnail":"media/Art/Clay Face/Clay-Face-img-5fc80d-thumb.webp","thumbnailFit":{"scale":1.25,"x":53.4,"y":43.4}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"Clay Tree","url":"#project/3139"}],"video":"","timestamp":"2026-08-16T19:55:48.429Z","id":"8740","order":4,"slug":"clay-face","imageThumb":"media/Art/Clay Face/Clay-Face-img-1c6627-thumb.webp"},{"title":"Scream-Face","category":"Art","image":"media/Art/Scream-Face/Scream-Face-img-fc5b57.webp","thumbnail":"media/Art/Scream-Face/Scream-Face-img-fc5b57-thumb.webp","thumbnailFit":{"scale":1,"x":47.5,"y":30.9},"bannerFit":{"scale":1,"x":49.3,"y":34},"description":"\u003cp>The face dives deep into a flat surface, dragging the plastic toward the diodes. Ten extra millimeters of frame fixed it.\u003c/p>","longDescription":"\u003cp>The face on this one dives deep into the flat surface around it, and those steep, dramatic edges were exactly what I liked about the model. They were also the problem. Put a flat pixel grid behind a curved object and the distance between the light and the plastic changes constantly. At the deepest part of the dip, the plastic sits right on top of the diodes, and every one of them shows up as a harsh bright spot.\u003c/p>\u003cp>I was not willing to give up the depth and I was not willing to accept hotspots, so I changed the structure instead. I added ten millimeters to the height of the grid's base layer and to the outer frame, which pushed the entire matrix back far enough that even the bottom of the dip stays clear. Ten millimeters is the minimum distance an LED can sit from the surface on any of these prints. This one just needed more room to get there.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","FDM 3D Printing","Lighting Design","SPI","WLED"],"gallery":[{"url":"media/Art/Scream-Face/models/Scream-Face-gfx-81e988.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#000000","opacity":1},{"name":"Part_2","color":"#9ca3af","opacity":1}],"view":{"theta":-0.0027,"phi":0.3551,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.35,"x":51.7,"y":37.3},"poster":"media/Art/Scream-Face/Scream-Face-gfx-81e988-poster.webp","thumbnail":"media/Art/Scream-Face/Scream-Face-gfx-81e988-poster-thumb.webp"},{"url":"media/Art/Scream-Face/Scream-Face-vid-8c1f44.mp4","fit":{"scale":1.15,"x":62.6,"y":34.1},"poster":"media/Art/Scream-Face/Scream-Face-vid-8c1f44-poster.webp","thumbnail":"media/Art/Scream-Face/Scream-Face-vid-8c1f44-poster-thumb.webp"},{"url":"media/Art/Scream-Face/Scream-Face-vid-cae394.mp4","fit":{"scale":1.15,"x":81.2,"y":52.9},"poster":"media/Art/Scream-Face/Scream-Face-vid-cae394-poster.webp","thumbnail":"media/Art/Scream-Face/Scream-Face-vid-cae394-poster-thumb.webp"},{"url":"media/Art/Scream-Face/Scream-Face-vid-51b450.mp4","fit":{"scale":1.15,"x":83.5,"y":42.7},"poster":"media/Art/Scream-Face/Scream-Face-vid-51b450-poster.webp","thumbnail":"media/Art/Scream-Face/Scream-Face-vid-51b450-poster-thumb.webp"}],"files":[{"name":"Scream-Face.zip","url":"media/Art/Scream-Face/files/Scream-Face.zip","description":"Multi‑plate .3mf with every printed part for the Scream Face, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Scream-Face/Scream-Face-img-3cd898.webp","thumbnail":"media/Art/Scream-Face/Scream-Face-img-3cd898-thumb.webp","thumbnailFit":{"scale":1.5,"x":56,"y":47}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"Celtic Owl","url":"#project/8609"},{"name":"Bubblescape","url":"#project/9191"},{"name":"Face","url":"#project/4827"}],"video":"","timestamp":"2026-08-16T20:00:30.235Z","id":"1829","order":6,"slug":"scream-face","imageThumb":"media/Art/Scream-Face/Scream-Face-img-fc5b57-thumb.webp"},{"title":"Clay Tree","category":"Art","image":"media/Art/Clay Tree/Clay-Tree-img-20e9a1.webp","thumbnail":"media/Art/Clay Tree/Clay-Tree-img-20e9a1-thumb.webp","thumbnailFit":{"scale":1,"x":50,"y":53.8},"bannerFit":{"scale":1,"x":50.4,"y":45.4},"description":"\u003cp>I still can't tell you what it is. A tree is the closest word. I sculpted it knowing 256 LEDs were going inside.\u003c/p>","longDescription":"\u003cp>I still could not tell you exactly what this shape is. A tree is the closest thing I can think of. I sculpted it in white modeling clay knowing from the start that it would be scanned and filled with LEDs, so the only real requirement was enough depth to hide an internal grid inside it.\u003c/p>\u003cp>Once the RevoPop scan came out clean, I brought the mesh into Blender and ran it through the same internal subdivision process as the other organic pieces. It printed in dual-color PLA, black for the mask and white for the diffusion, over a 256-pixel matrix. Getting light to punch through an irregular shape meant keeping the outer shell exactly one millimeter thick everywhere. Thicker and the branches went dark. The grid underneath is rigid and square. The thing on top of it is whatever you decide it is.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Lighting Design","FDM 3D Printing","SPI","WLED"],"gallery":[{"url":"media/Art/Clay Tree/models/Clay-Tree-gfx-ee4e7f.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":0.0032,"phi":0.6025,"radiusScale":3.275,"panX":-0.0141,"panY":0.0646},"fit":{"scale":1.45,"x":62.2,"y":39.7},"poster":"media/Art/Clay Tree/Clay-Tree-gfx-ee4e7f-poster.webp","thumbnail":"media/Art/Clay Tree/Clay-Tree-gfx-ee4e7f-poster-thumb.webp"},{"url":"media/Art/Clay Tree/Clay-Tree-vid-33e906.mp4","fit":{"scale":1.1,"x":0,"y":40.1},"poster":"media/Art/Clay Tree/Clay-Tree-vid-33e906-poster.webp","thumbnail":"media/Art/Clay Tree/Clay-Tree-vid-33e906-poster-thumb.webp"},{"url":"media/Art/Clay Tree/Clay-Tree-vid-919aa5.mp4","fit":{"scale":1,"x":48.9,"y":35.4},"poster":"media/Art/Clay Tree/Clay-Tree-vid-919aa5-poster.webp","thumbnail":"media/Art/Clay Tree/Clay-Tree-vid-919aa5-poster-thumb.webp"}],"files":[{"name":"Clay Tree.zip","url":"media/Art/Clay Tree/files/Clay Tree.zip","description":"Multi‑plate .3mf with every printed part for the Clay Tree, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Clay Tree/Clay-Tree-img-4a1075.webp","thumbnail":"media/Art/Clay Tree/Clay-Tree-img-4a1075-thumb.webp","thumbnailFit":{"scale":1.35,"x":54.8,"y":53.5}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"Clay Face","url":"#project/8740"}],"video":"","timestamp":"2026-08-16T20:06:37.433Z","id":"3139","order":9,"slug":"clay-tree","imageThumb":"media/Art/Clay Tree/Clay-Tree-img-20e9a1-thumb.webp"},{"title":"Face","category":"Art","image":"media/Art/Face/Face-img-72bb09.webp","thumbnail":"media/Art/Face/Face-img-72bb09-thumb.webp","thumbnailFit":{"scale":1,"x":44.5,"y":21.7},"bannerFit":{"scale":1,"x":50.2,"y":21.4},"description":"\u003cp>Shelved for a year. My printers could not hold a surface smooth enough for a face to read, so I waited for one that could.\u003c/p>","longDescription":"\u003cp>A human face on a 16 x 16 grid was one of the first ideas I had when I started making these prints. It sat on the shelf for about a year. My old printers could not do it. The surface came out too rough to read as a face, I could not hold the white layer at a consistent thickness, and the machines flatly refused to print the white-lined walls I needed for internal bounce.\u003c/p>\u003cp>I shelved it until I got a Bambu Lab X1C. That machine solved the surface finish. I printed the mask and borders in black and the diffusion in white, and then spent the real effort on the one variable that mattered: the exact thickness of that white layer. A face is the least forgiving subject for a low-resolution matrix. Too thick and the expression washes out. Too thin and you see the grid instead of the face. Dialed in, it reads.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","FDM 3D Printing","Lighting Design","SPI","WLED"],"gallery":[{"url":"media/Art/Face/models/Face-gfx-7ea1d5.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":0.8161,"phi":0.3374,"radiusScale":3.275,"panX":-0.0186,"panY":0.0417},"fit":{"scale":1.45,"x":64.2,"y":39.8},"poster":"media/Art/Face/Face-gfx-7ea1d5-poster.webp","thumbnail":"media/Art/Face/Face-gfx-7ea1d5-poster-thumb.webp"},{"url":"media/Art/Face/Face-vid-c44ade.mp4","fit":{"scale":1,"x":46.1,"y":20.8},"poster":"media/Art/Face/Face-vid-c44ade-poster.webp","thumbnail":"media/Art/Face/Face-vid-c44ade-poster-thumb.webp"}],"files":[{"name":"Face.zip","url":"media/Art/Face/files/Face.zip","description":"Multi‑plate .3mf with every printed part for the Face, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Face/Face-img-8002b7.webp","thumbnail":"media/Art/Face/Face-img-8002b7-thumb.webp","thumbnailFit":{"scale":1.5,"x":61.6,"y":58.1}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"Celtic Owl","url":"#project/8609"},{"name":"Scream-Face","url":"#project/1829"},{"name":"Bubblescape","url":"#project/9191"}],"video":"","timestamp":"2026-08-16T20:11:26.500Z","id":"4827","order":8,"slug":"face","imageThumb":"media/Art/Face/Face-img-72bb09-thumb.webp"},{"title":"X","category":"Art","image":"media/Art/X/X-img-1734c2.webp","thumbnail":"media/Art/X/X-img-1734c2-thumb.webp","thumbnailFit":{"scale":1.15,"x":76.2,"y":37.3},"bannerFit":{"scale":1,"x":50,"y":27.1},"description":"\u003cp>The first time I put a 3D printer and an LED matrix in the same object. Flat white face, hidden mask, nothing outside to give it away.\u003c/p>","longDescription":"\u003cp>I was tired of regular squares. Up to this point I had been building 3D objects with internal subdivisions and putting the texture on the outside. This time I kept the front face perfectly flat and changed the light coming from behind it instead. It was also the first time I really let a 3D printer and an LED matrix become one object, rather than a print sitting on top of some pixels.\u003c/p>\u003cp>Behind the panel, the grid breaks into 10 mm cells, and each one holds a simple X. For the shapes to read without bleeding into each other, the print had to be exact. I held the white diffusion layer to one millimeter across the entire surface, then printed a one-millimeter black mask directly onto the back of it. The mask is where the shapes actually live. From the front, until it powers on, there is nothing to see.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Lighting Design","FDM 3D Printing","SPI","WLED"],"gallery":[{"url":"media/Art/X/models/X-gfx-08c0a2.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":0.0032,"phi":0,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.25,"x":51.7,"y":35.5},"poster":"media/Art/X/X-gfx-08c0a2-poster.webp","thumbnail":"media/Art/X/X-gfx-08c0a2-poster-thumb.webp"},{"url":"media/Art/X/X-vid-5f3644.mp4","fit":{"scale":1.15,"x":23.1,"y":42.3},"poster":"media/Art/X/X-vid-5f3644-poster.webp","thumbnail":"media/Art/X/X-vid-5f3644-poster-thumb.webp"}],"files":[{"name":"X.zip","url":"media/Art/X/files/X.zip","description":"Multi‑plate .3mf with every printed part for the X, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/X/X-img-9f0b3e.webp","thumbnail":"media/Art/X/X-img-9f0b3e-thumb.webp","thumbnailFit":{"scale":1.25,"x":66.2,"y":47.5}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T20:19:44.564Z","id":"7080","order":17,"slug":"x","imageThumb":"media/Art/X/X-img-1734c2-thumb.webp"},{"title":"Dot Matrix","category":"Art","image":"media/Art/Dot Matrix/Dot-Matrix-img-b965aa.webp","thumbnail":"media/Art/Dot Matrix/Dot-Matrix-img-b965aa-thumb.webp","thumbnailFit":{"scale":1,"x":48.4,"y":32.5},"bannerFit":{"scale":1,"x":48.6,"y":41.4},"description":"\u003cp>Temple SF's old dot-matrix rig went in a dumpster to make room for mine. This is that look, rebuilt at 16x16.\u003c/p>","longDescription":"\u003cp>The old rigs at Temple Denver and Temple San Francisco both had a specific look, big fields of circular dots, and the San Francisco one was the rig I tore out myself to make room for the new install. I wanted that look back on my wall. Dot Matrix is a flat white square until it powers on, and then 256 circles appear where there were none.\u003c/p>\u003cp>The circles are not on the surface. They are black filament printed behind a solid white front layer, framing every cell of a 16 by 16 grid from the inside. I tried to run the enclosure on my IDEX printer first and it could not lay down the pattern inside cells that small. It just kept failing. I shelved the project until I got a Bambu X1C, which finally put the two colors down face down on the bed without making a mess. Printing the whole thing face down on a machine that could hold the pattern was the only way to get a surface that flat.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Lighting Design","FDM 3D Printing","SPI","WLED"],"gallery":[{"url":"media/Art/Dot Matrix/models/Dot-Matrix-gfx-1522eb.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#000000","opacity":1},{"name":"Part_2","color":"#9ca3af","opacity":1}],"view":{"theta":-0.0027,"phi":0,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.25,"x":59.1,"y":30.2},"poster":"media/Art/Dot Matrix/Dot-Matrix-gfx-1522eb-poster.webp","thumbnail":"media/Art/Dot Matrix/Dot-Matrix-gfx-1522eb-poster-thumb.webp"},{"url":"media/Art/Dot Matrix/Dot-Matrix-vid-c3dcd2.mp4","fit":{"scale":1,"x":50,"y":35.1},"poster":"media/Art/Dot Matrix/Dot-Matrix-vid-c3dcd2-poster.webp","thumbnail":"media/Art/Dot Matrix/Dot-Matrix-vid-c3dcd2-poster-thumb.webp"}],"files":[{"name":"Dot Matrix.zip","url":"media/Art/Dot Matrix/files/Dot Matrix.zip","description":"Multi‑plate .3mf with every printed part for the Dot Matrix, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Dot Matrix/Dot-Matrix-img-8091d2.webp","thumbnail":"media/Art/Dot Matrix/Dot-Matrix-img-8091d2-thumb.webp","thumbnailFit":{"scale":1.35,"x":45.1,"y":46.7}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"X","url":"#project/7080"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T20:23:22.050Z","id":"5202","order":15,"slug":"dot-matrix","imageThumb":"media/Art/Dot Matrix/Dot-Matrix-img-b965aa-thumb.webp"},{"title":"Inverted Triangles","category":"Art","image":"media/Art/Inverted Triangles/Inverted-Triangles-img-c15027.webp","thumbnail":"media/Art/Inverted Triangles/Inverted-Triangles-img-c15027-thumb.webp","thumbnailFit":{"scale":1,"x":50.2,"y":31.6},"bannerFit":{"scale":1,"x":50,"y":42.6},"description":"\u003cp>By this one the technique was muscle memory. Designed, printed, and wired in a single day.\u003c/p>","longDescription":"\u003cp>Unplugged on a wall, Inverted Triangles is a plain white square. That was the goal: a piece that only exists when the power is on.\u003c/p>\u003cp>By this point I had the printing technique figured out, and I designed and printed the whole object in a single day. The frame holds a 16 x 16 matrix running WLED. The pattern is a mask of inverted triangles printed in black PLA and hidden directly behind the white front face. When the matrix fires, the black plastic blocks the light and the triangles punch through. When the power drops, they have to vanish completely, and that comes down to one number: the white diffusion layer is exactly one millimeter thick. Any more and the pattern dims. Any less and you can see it when the piece is off.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Lighting Design","FDM 3D Printing","SPI","WLED"],"gallery":[{"url":"media/Art/Inverted Triangles/models/Inverted-Triangles-gfx-febc00.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#000000","opacity":1},{"name":"Part_2","color":"#9ca3af","opacity":1}],"view":{"theta":-0.0085,"phi":0,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.3,"x":52.4,"y":34.2},"poster":"media/Art/Inverted Triangles/Inverted-Triangles-gfx-febc00-poster.webp","thumbnail":"media/Art/Inverted Triangles/Inverted-Triangles-gfx-febc00-poster-thumb.webp"},{"url":"media/Art/Inverted Triangles/Inverted-Triangles-vid-b51021.mp4","fit":{"scale":1.15,"x":63.2,"y":32.4},"poster":"media/Art/Inverted Triangles/Inverted-Triangles-vid-b51021-poster.webp","thumbnail":"media/Art/Inverted Triangles/Inverted-Triangles-vid-b51021-poster-thumb.webp"}],"files":[{"name":"Inverted Triangles.zip","url":"media/Art/Inverted Triangles/files/Inverted Triangles.zip","description":"Multi‑plate .3mf with every printed part for the Inverted Triangles, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Inverted Triangles/Inverted-Triangles-img-9c49c4.webp","thumbnail":"media/Art/Inverted Triangles/Inverted-Triangles-img-9c49c4-thumb.webp","thumbnailFit":{"scale":1.25,"x":59.4,"y":47.2}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T20:25:20.687Z","id":"6865","order":18,"slug":"inverted-triangles","imageThumb":"media/Art/Inverted Triangles/Inverted-Triangles-img-c15027-thumb.webp"},{"title":"Circles Corner","category":"Art","image":"media/Art/Circles Corner/Circles-Corner-img-91e8e8.webp","thumbnail":"media/Art/Circles Corner/Circles-Corner-img-91e8e8-thumb.webp","thumbnailFit":{"scale":1.15,"x":22.1,"y":30},"bannerFit":{"scale":1.15,"x":27.2,"y":35.1},"description":"\u003cp>One diagonal cut across every cell. The simplest mask in the series, repeated 256 times.\u003c/p>","longDescription":"\u003cp>One diagonal cut across every cell. I blacked out half of each of the 256 pixels from behind, so each 10 mm cell works like a tiny gobo with a hard edge through the middle. Off, the face is blank. On, the hidden half-shapes appear through the diffusion all at once.\u003c/p>\u003cp>It is the simplest mask in the series and the easiest to repeat 256 times, which is part of why it works. The only thing that can break it is bleed. If light from the lit half leaks across into the dark half, the shape is gone. So the black layer behind the white diffusion had to be exactly one millimeter thick, enough for total blackout with no room for the print to get lazy.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","FDM 3D Printing","Lighting Design","SPI","WLED"],"gallery":[{"url":"media/Art/Circles Corner/models/Circles-Corner-gfx-12d8fe.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":0.0091,"phi":0,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.2,"x":76.8,"y":28.4},"poster":"media/Art/Circles Corner/Circles-Corner-gfx-12d8fe-poster.webp","thumbnail":"media/Art/Circles Corner/Circles-Corner-gfx-12d8fe-poster-thumb.webp"},{"url":"media/Art/Circles Corner/Circles-Corner-vid-89e093.mp4","fit":{"scale":1.15,"x":19.4,"y":30.1},"poster":"media/Art/Circles Corner/Circles-Corner-vid-89e093-poster.webp","thumbnail":"media/Art/Circles Corner/Circles-Corner-vid-89e093-poster-thumb.webp"}],"files":[{"name":"Circles Corner.zip","url":"media/Art/Circles Corner/files/Circles Corner.zip","description":"Multi‑plate .3mf with every printed part for the Circles Corner, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Circles Corner/Circles-Corner-img-5c77de.webp","thumbnail":"media/Art/Circles Corner/Circles-Corner-img-5c77de-thumb.webp","thumbnailFit":{"scale":1.15,"x":42,"y":49.2}}],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T20:29:37.203Z","id":"2451","order":12,"slug":"circles-corner","imageThumb":"media/Art/Circles Corner/Circles-Corner-img-91e8e8-thumb.webp"},{"title":"TangiPix","category":"Software","image":"media/Apps/TangiPix/TangiPix-img-78f141.webp","thumbnail":"media/Apps/TangiPix/TangiPix-img-78f141-thumb.webp","thumbnailFit":{"scale":1,"x":49.5,"y":0},"bannerFit":{"scale":1,"x":45.7,"y":29.1},"description":"\u003cp>Photo in, bead-curtain schematic out, with a bill of materials and numbered squares for hand sorting. Test subject: the Mona Lisa in neon.\u003c/p>","longDescription":"\u003cp>Bead curtains and stacked-brick images were the goal, and I had no way to plan either one. Taking a photo and forcing it into a handful of physical colors sounds simple. It is not. So I built the planner first.\u003c/p>\u003cp>You drop a photo in, lock it to a grid, and map the cells to whatever inventory of colors you actually have. The engine reduces the image into that strict color space. Because real inventory never matches a photo cleanly, I built a few different rendering options to choose between. The heavy math, k-means clustering in particular, would normally freeze the tab, so I pushed it into a Web Worker. The first real test was forcing the Mona Lisa into a neon rainbow palette. It came back as a PDF schematic with a bill of materials and numbered squares for hand sorting.\u003c/p>\u003cp>I have not built the bead curtain yet, though it is still a good first project for it. The real destination is bigger. I want to build one of those marble picture machines that drops colored marbles down a series of columns to form an image, then clears it and starts over. TangiPix is the engine that will tell it what to drop.\u003c/p>","websiteLink":"","launchLink":"https://elusid108.github.io/TangiPix/","githubLink":"https://github.com/Elusid108/TangiPix","shopLink":"","featured":false,"wip":true,"tags":["TypeScript","React","Vite"],"gallery":[{"url":"media/Apps/TangiPix/TangiPix-img-78f141.webp","fit":{"scale":1,"x":52.5,"y":47.9},"thumbnail":"media/Apps/TangiPix/TangiPix-img-78f141-thumb.webp"},{"url":"media/Apps/TangiPix/TangiPix-img-6220a5.webp","fit":{"scale":1,"x":52.7,"y":23.3},"thumbnail":"media/Apps/TangiPix/TangiPix-img-6220a5-thumb.webp"},{"url":"media/Apps/TangiPix/TangiPix-img-4df806.webp","fit":{"scale":1,"x":50,"y":71.6},"thumbnail":"media/Apps/TangiPix/TangiPix-img-4df806-thumb.webp"},{"url":"media/Apps/TangiPix/TangiPix-img-cae909.webp","fit":{"scale":1,"x":51.3,"y":44},"thumbnail":"media/Apps/TangiPix/TangiPix-img-cae909-thumb.webp"},{"url":"media/Apps/TangiPix/TangiPix-img-47c003.webp","fit":{"scale":1.1,"x":47.7,"y":94.8},"thumbnail":"media/Apps/TangiPix/TangiPix-img-47c003-thumb.webp"},{"url":"media/Apps/TangiPix/TangiPix-img-eb535b.webp","fit":{"scale":1.1,"x":52.3,"y":94.3},"thumbnail":"media/Apps/TangiPix/TangiPix-img-eb535b-thumb.webp"},{"url":"media/Apps/TangiPix/TangiPix-img-f3cc11.webp","fit":{"scale":1.1,"x":41.9,"y":13.8},"thumbnail":"media/Apps/TangiPix/TangiPix-img-f3cc11-thumb.webp"},{"url":"media/Apps/TangiPix/TangiPix-img-355ab2.webp","fit":{"scale":1.1,"x":57.4,"y":14},"thumbnail":"media/Apps/TangiPix/TangiPix-img-355ab2-thumb.webp"}],"files":[{"name":"monalisa_rainbow.pdf","url":"media/Apps/TangiPix/files/monalisa_rainbow.pdf","description":""}],"specs":"\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Framework\u003c/strong>\u003cbr>\u003cem>React 19.1\u003c/em>\u003c/p>\u003cp>\u003cstrong>Language\u003c/strong>\u003cbr>\u003cem>TypeScript ~5.9\u003c/em>\u003c/p>\u003cp>\u003cstrong>Build\u003c/strong>\u003cbr>\u003cem>Vite 6.4\u003c/em>\u003c/p>\u003cp>\u003cstrong>Styling\u003c/strong>\u003cbr>\u003cem>Custom CSS\u003c/em>\u003c/p>\u003cp>\u003cstrong>Deploy\u003c/strong>\u003cbr>\u003cem>GitHub Pages\u003c/em>\u003c/p>","related":[],"video":"","timestamp":"2026-08-22T19:10:36.064Z","id":"2955","order":2,"slug":"tangipix","imageThumb":"media/Apps/TangiPix/TangiPix-img-78f141-thumb.webp"},{"title":"BorderBuilder","category":"Software","image":"media/Apps/BorderBuilder/BorderBuilder-img-2e9e9c.webp","thumbnailFit":{"scale":1.25,"x":9.6,"y":47.5},"bannerFit":{"scale":1.25,"x":0,"y":32.2},"description":"\u003cp>A lithophane goes in, a printable frame comes out. I tested the geometry on a cog, because if the math survives a cog it survives anything.\u003c/p>","longDescription":"\u003cp>Every lithophane needs a frame, and I never once tried to model one by hand. I could have learned enough Blender to do it. That was not the point. I have a whole workflow in my head for going from a photo to a finished, framed, backlit print, and every step I can turn into a custom app is a step I can eventually automate. Frames were the next step.\u003c/p>\u003cp>BorderBuilder branched off LithoLab. You drop in an exported lithophane, dial in a decorative edge, and export a frame ready to print, with the lithophane seated in the back. It also works on its own for photo frames and mirrors, and it exports DXF files for laser-cutting acrylic light panels. The math for irregular outlines was the hard part. I tested the routing and masks against a complex cog, on the theory that if it survives a cog it survives anything. It took several attempts before the app stopped failing on it.\u003c/p>\u003cp>It runs in the browser with nothing behind it. The frames print. The Blender tab is still closed.\u003c/p>","websiteLink":"","launchLink":"https://elusid108.github.io/BorderBuilder/","githubLink":"https://github.com/Elusid108/BorderBuilder","shopLink":"","featured":false,"wip":true,"tags":["FDM 3D Printing"],"gallery":[{"url":"media/Apps/BorderBuilder/BorderBuilder-img-2e9e9c.webp","thumbnail":"media/Apps/BorderBuilder/BorderBuilder-img-2e9e9c-thumb.webp"},{"url":"media/Apps/BorderBuilder/BorderBuilder-img-fa0128.webp","thumbnail":"media/Apps/BorderBuilder/BorderBuilder-img-fa0128-thumb.webp"},{"url":"media/Apps/BorderBuilder/BorderBuilder-img-49e083.webp","thumbnail":"media/Apps/BorderBuilder/BorderBuilder-img-49e083-thumb.webp"}],"files":[],"specs":"\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Language\u003c/strong>\u003cbr>\u003cem>TypeScript ~5.9\u003c/em>\u003c/p>\u003cp>\u003cstrong>Build\u003c/strong>\u003cbr>\u003cem>Vite 5.4\u003c/em>\u003c/p>\u003cp>\u003cstrong>3D\u003c/strong>\u003cbr>\u003cem>Three.js 0.170\u003c/em>\u003c/p>\u003cp>\u003cstrong>Export\u003c/strong>\u003cbr>\u003cem>binary STL (mm) • JSZip\u003c/em>\u003c/p>\u003cp>\u003cstrong>Deploy\u003c/strong>\u003cbr>\u003cem>GitHub Pages\u003c/em>\u003c/p>\u003cp>\u003cstrong>Version\u003c/strong>\u003cbr>\u003cem>0.7.0\u003c/em>\u003c/p>","related":[{"name":"LithoLab","url":"#project/2944"}],"video":"","timestamp":"2026-08-23T03:28:57.175Z","id":"8287","order":1,"slug":"borderbuilder","imageThumb":"media/Apps/BorderBuilder/BorderBuilder-img-2e9e9c-thumb.webp"},{"title":"Immersive Video Layer","category":"Fixtures","image":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-d92ffc.webp","description":"\u003cp>The eighty-foot screen pulled four hundred amps and cooked its stock power supplies in the club heat.\u003c/p>","longDescription":"\u003cp>Nobody sells a mount to hang an eighty-foot video screen perfectly flat inside a hundred-year-old building. I had to build a custom suspension frame from strut channel, L-brackets, and allthread.\u003c/p>\u003cp>The owner wanted the fifteen-foot-wide ceiling to run the length of the dance floor and then curve down behind the DJ booth. I drove lag bolts into the beams and hung the strut. To get the grid level, I put a laser in the ceiling and used the washers on top of the strut as targets across the room. Each row of the curve needed its own set of allthread drops to hit the right angles. The corner plates for the video panels bolted directly over the strut, locking everything in place. We expanded the system during the pandemic lockdown, adding curved wings, marquee strips, and a freestanding monolith on the floor.\u003c/p>\u003cp>I gave the ceiling a 400-amp service on switched relay banks so it could run full white at full intensity. But the panels sat in the highest, hottest part of the room. The mix of club heat, vibration, and crowd moisture cooked the capacitors in the stock power supplies. We swapped the dead units for better replacements every night before doors until the rig finally stabilized.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":[],"gallery":[{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-vid-3a1fcb.mp4","poster":"media/Electronics/Immersive Video Layer/Video-Ceiling-vid-3a1fcb-poster.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-vid-3a1fcb-poster-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-vid-d94826.mp4","poster":"media/Electronics/Immersive Video Layer/Video-Ceiling-vid-d94826-poster.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-vid-d94826-poster-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-vid-482480.mp4","poster":"media/Electronics/Immersive Video Layer/Video-Ceiling-vid-482480-poster.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-vid-482480-poster-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-42fc2a.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-42fc2a-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-0b5797.webp","fit":{"scale":1,"x":48.9,"y":81.4,"rotate":0},"thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-0b5797-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-7bda41.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-7bda41-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-9a8c71.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-9a8c71-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-6b57e6.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-6b57e6-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-95aa5b.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-95aa5b-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-8b6b3a.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-8b6b3a-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-6db9d3.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-6db9d3-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-4861d1.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-4861d1-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-39340d.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-39340d-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-467d54.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-467d54-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-8f8ce0.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-8f8ce0-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-37cb42.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-37cb42-thumb.webp"},{"url":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-3fd531.webp","thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-3fd531-thumb.webp"}],"files":[],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>Ceiling Screen (x1)\u003c/strong>\u003cbr>\u003cem>3.5m x 23m • P4.81 • 728 x 4784\u003c/em>\u003c/p>\u003cp>\u003cstrong>DJ Booth Screen (x1)\u003c/strong>\u003cbr>\u003cem>7m x 1.5m • P4.81 • 1456 x 312\u003c/em>\u003c/p>\u003cp>\u003cstrong>Marquee Left Screen (x1)\u003c/strong>\u003cbr>\u003cem>14m x 1m • P4.81 • 2912 x 208\u003c/em>\u003c/p>\u003cp>\u003cstrong>Marquee Right Screen (x1)\u003c/strong>\u003cbr>\u003cem>18m x 1m • P4.81 • 3744 x 208\u003c/em>\u003c/p>\u003cp>\u003cstrong>Monolith Screens (x1)\u003c/strong>\u003cbr>\u003cem>1.5m x 3m (x2) • P4.81 • 312 x 624 (x2)\u003c/em>\u003c/p>","related":[{"name":"Temple SF","url":"#project/8252"},{"name":"Immersive Dance Lighting Rig","url":"#project/1"},{"name":"Immersive Lighting Layer","url":"#project/2395"},{"name":"Immersive Dance Floor Pillars","url":"#project/6371"},{"name":"LED Video Panel Service","url":"#project/4623"}],"video":"","timestamp":"2026-09-05T01:32:22.408Z","id":"4250","order":7,"thumbnail":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-d92ffc-thumb.webp","thumbnailFit":{"scale":1.05,"x":59.7,"y":0,"rotate":0},"bannerFit":{"scale":1.05,"x":50.2,"y":41.8,"rotate":-1},"slug":"immersive-video-layer","imageThumb":"media/Electronics/Immersive Video Layer/Video-Ceiling-img-d92ffc-thumb.webp"},{"title":"Acrylic Etchings","category":"Fixtures","image":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-07a72d.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-46362f-thumb.webp","description":"\u003cp>I hid wireless pixel decoders on the frames because the original power lines were mudded straight into the wall.\u003c/p>","longDescription":"\u003cp>The venue had a series of acrylic etchings by an artist who had passed away. They had to stay. I wanted to replace their solid-color strips with pixel tape to see how the light would play with the etched effect. The original power lines were mudded straight into the wall, making new data cable impossible. I needed a wireless pixel controller small enough to hide on the frames.\u003c/p>\u003cp>I kept the original wires for DC power and used Athom decoders to catch the data over Wi-Fi. The etchings had an aluminum channel across the top. I laid RGBW tape inside the channel and mounted the decoders right on top.\u003c/p>\u003cp>It kept the walls intact, but 2.4GHz Wi-Fi in a crowded room is a mess. When the venue fills up, hundreds of cell phones fight the decoders for airspace. If I rebuilt these today, I would use an ESP32-C5 chip to get them onto a 5GHz network and out of the traffic.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":[],"gallery":[{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-23437f.mp4","poster":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-3b68fe.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-3b68fe-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-9be44e.mp4","fit":{"scale":1.75,"x":36.3,"y":45.5,"rotate":0},"poster":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-6a980d.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-6a980d-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-f269e1.mp4","poster":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-f269e1-poster.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-f269e1-poster-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-a8acd4.mp4","poster":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-a8acd4-poster.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-a8acd4-poster-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-79a20a.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-79a20a-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-ed0c9e.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-ed0c9e-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-d1067a.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-d1067a-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-ba21de.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-ba21de-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-df5e00.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-df5e00-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-084cbd.mp4","poster":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-084cbd-poster.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-vid-084cbd-poster-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-357c9f.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-357c9f-thumb.webp"},{"url":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-f533c1.webp","thumbnail":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-f533c1-thumb.webp"}],"files":[],"specs":"","related":[],"video":"","timestamp":"2026-09-05T01:34:07.514Z","id":"5614","order":5,"thumbnailFit":{"scale":1.3,"x":27.1,"y":19.2,"rotate":0},"bannerFit":{"scale":1.45,"x":19,"y":37.8,"rotate":0},"slug":"acrylic-etchings","imageThumb":"media/Electronics/Acrylic Etchings/Acrylic-Etchings-img-07a72d-thumb.webp"},{"title":"Immersive Lighting Layer","category":"Lighting","image":"media/Lighting/Immersive Lighting Layer/Immersive-Lighting-Layer-img-77aa96.webp","description":"\u003cp>Individually a 4-degree RGBW beam is nothing. One hundred forty-four of them in haze is the lighting layer.\u003c/p>","longDescription":"\u003cp>On either side of the video ceiling I hung 72 RGBW pixel dots, 144 total. Individually they are underwhelming: a 4-degree color-mixing beam with infinite pan and tilt, and that's it. Array them, put haze in the room, and they behave like pixel tape. One diode is a point of light. A grid of them is the show.\u003c/p>\u003cp>Profiles sat in the same line for texture: color wheel, gobos, prisms. RGBWA+UV washes covered floods, strobes, and blacklight. Everything was evenly spaced and mirrored so the room was one canvas, any angle. Fixtures hung on strut in pods. A pod was 12 dots, one LSM150, and three WFP12s. Two pods filled a universe. The layer ran on six. Power was 120 volt on the same 200-amp service as the dance floor pillars, on switched relays so unused fixtures went dark without touching the desk.\u003c/p>\u003cp>Straight runs down both sides of the room kept conduit cheap and fast. DMX was copper over CAT6 to Art-Net nodes in the rack. I kept every bit of processing on the ground. If the network died during a night, I wanted it in one place, away from the crowd.\u003c/p>\u003cp>The HVAC duct on stage right was not on the drawings. It sat in the path of the last strut run. I put a gradual angle on that pod to clear the vent. It framed the stage better than a straight line would have.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":[],"gallery":[{"url":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-vid-91a9bd.mp4","poster":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-vid-91a9bd-poster.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-vid-91a9bd-poster-thumb.webp"},{"url":"media/Lighting/Im da3.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-eeeda3-thumb.webp"},{"url":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-5b563c.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-5b563c-thumb.webp"},{"url":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-06abcd.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-06abcd-thumb.webp"},{"url":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-6d568f.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-6d568f-thumb.webp"},{"url":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-bf77ce.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-bf77ce-thumb.webp"},{"url":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-1c4256.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-1c4256-thumb.webp"},{"url":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-c4930c.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-c4930c-thumb.webp"},{"url":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-577740.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-577740-thumb.webp"},{"url":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-3d7247.webp","thumbnail":"media/Lighting/Immersive Lighting Layer/Lighting-Layer-img-3d7247-thumb.webp"}],"files":[{"name":"Temple SF instrument schedule.pdf","url":"media/Lighting/Immersive Lighting Layer/files/Temple SF instrument schedule.pdf","description":""}],"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>PD60 (x144)\u003c/strong>\u003cbr>\u003cem>ColorfulLighting • LED • beam 4° • 60W • RGBW • infinite pan &amp; tilt\u003c/em>\u003c/p>\u003cp>\u003cstrong>LSM150 (x12)\u003c/strong>\u003cbr>\u003cem>ColorfulLighting • LED • spot 15° • 150W • pan 520° • tilt 270° • 7 colors + white • 6 static gobos • 6 rotating gobos • 3 facet prism\u003c/em>\u003c/p>\u003cp>\u003cstrong>WFP12, (x40)\u003c/strong>\u003cbr>\u003cem>ColorfulLighting • LED • wash 35° • 280W • RGBWA+UV\u003c/em>\u003c/p>\u003cp>\u003cstrong>Radiance Hazer, (x2)\u003c/strong>\u003cbr>\u003cem>Ultratec • hazer • DMX • 120Vac • 500W\u003c/em>\u003c/p>","related":[{"name":"Temple SF","url":"#project/8252"},{"name":"Immersive Dance Lighting Rig","url":"#project/1"},{"name":"Immersive Video Layer","url":"#project/4250"},{"name":"Immersive Dance Floor Pillars","url":"#project/6371"},{"name":"Lighting & SFX Service","url":"#project/1862"},{"name":"LED Video Panel Service","url":"#project/4623"}],"video":"","timestamp":"2026-09-05T01:35:46.632Z","id":"2395","order":8,"thumbnail":"media/Lighting/Immersive Lighting Layer/Immersive-Lighting-Layer-img-77aa96-thumb.webp","thumbnailFit":{"scale":1.1,"x":67.5,"y":69.4,"rotate":0},"bannerFit":{"scale":1.05,"x":88.3,"y":69.9,"rotate":0},"slug":"immersive-lighting-layer","imageThumb":"media/Lighting/Immersive Lighting Layer/Immersive-Lighting-Layer-img-77aa96-thumb.webp"},{"title":"Architectural Lighting","category":"Lighting","image":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-ab4799.webp","thumbnail":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-ab4799-thumb.webp","description":"\u003cp>I washed the light-colored walls and made the electricians come back to fix their jumped circuits.\u003c/p>","longDescription":"\u003cp>I refused to allow fast movements or strobe effects on the exterior of the building. It is a hazard for drivers. The light-colored walls of Que Bueno Suerte! were a perfect canvas for wall washers. I used IP67 PARs to uplight the street-facing side and downlight the patio, then outlined the front roof edge with LED pixel bars.\u003c/p>\u003cp>I had an electrician come out to install GFI outlets and new breakers. For some reason, electricians tend not to believe me when I am specific about balancing power. They put the outlets in the right spots but jumped existing circuits to cut costs. I had them come back and fix their work. The pixel strips took an Advatek receiver, and the exterior fixtures patched into Madrix to run with the rest of the restaurant.\u003c/p>\u003cp>When the system powered on, you could clearly pick the venue out from a block away. It caught people's eyes as they walked down the street.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":[],"gallery":[{"url":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-f11bdd.webp","thumbnail":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-f11bdd-thumb.webp"},{"url":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-d4ab7b.webp","thumbnail":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-d4ab7b-thumb.webp"},{"url":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-1044c9.webp","thumbnail":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-1044c9-thumb.webp"},{"url":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-a281f5.webp","thumbnail":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-a281f5-thumb.webp"},{"url":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-e1ffd8.webp","thumbnail":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-e1ffd8-thumb.webp"},{"url":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-74e953.webp","thumbnail":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-74e953-thumb.webp"}],"files":[],"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>CL-FP7 (x4)\u003c/strong>\u003cbr>\u003cem>ColorfulLighting • LED • wash 25° • 70W • RGBW • IP65\u003c/em>\u003c/p>\u003cp>\u003cstrong>CL-FP7 (x12)\u003c/strong>\u003cbr>\u003cem>ColorfulLighting • LED • wash 45° • 70W • RGBW • IP65\u003c/em>\u003c/p>\u003cp>\u003cstrong>CL-FP18 (x16)\u003c/strong>\u003cbr>\u003cem>ColorfulLighting • LED • wash 45° • 180W • RGBW • IP65\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Tubes (x16)\u003c/strong>\u003cbr>\u003cem>SuperLightingLED • 1m • 48 LED • 8 pix • white diffusion\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x128)\u003c/strong>\u003cbr>\u003cem>UCS1903 • RGB • 24v\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supply (x1)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • HLG-240H-24 • 24Vdc • 10A\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Advatek • R4D-S • 12 Universe\u003c/em>\u003c/p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Lighting & SFX Service","url":"#project/1862"}],"video":"","timestamp":"2026-09-05T01:37:47.811Z","id":"299","order":11,"thumbnailFit":{"scale":1.4,"x":0,"y":46.7,"rotate":0},"bannerFit":{"scale":1.25,"x":3.7,"y":33,"rotate":0},"slug":"architectural-lighting","imageThumb":"media/Lighting/Architectural Lighting/Architectural-Lighting-img-ab4799-thumb.webp"},{"title":"Lighting & SFX Service","category":"Tooling","image":"media/Fabrication/Lighting & SFX Service/Lighting-SFX-Service-img-d2e5bf.webp","thumbnail":"media/Fabrication/Lighting & SFX Service/Lighting-SFX-Service-img-27fb90-thumb.webp","description":"\u003cp>I wired AC into the DC side of a VL1000. The capacitors exploded and fire came out the side.\u003c/p>","longDescription":"\u003cp>I wired the AC input of a VL1000 into the DC output while replacing a power supply at Barbizon Light of the Rockies. The capacitors exploded and the fixture shot fire out the side. You make that mistake once.\u003c/p>\u003cp>That was my first lighting service gig, about a year, mentored part time in their shop. The bench ran from cracked porcelain sockets and crumbling wiring to unreleased demo heads: movers, scanners, color scrollers, fog, haze, film lights, consoles, dimmer racks.\u003c/p>\u003cp>On a dead or stuttering mover I power it on first and watch whether it moves. Then I kill power, grab the mechanicals, and feel for resistance. Failing steppers grind. I look for anything blocking travel, missing parts, then trace the harness. A spare motor goes in next. If the fault follows, the driver board is next.\u003c/p>\u003cp>Dust is the other killer. On a rotating service cycle it is mostly blowing fans and wiping optics. Let it go and a fan stops. I had a thermal switch fail to trip before, and the inside of a moving head went thermonuclear. I opened the old ElektraLite and every plastic part had melted and puddled in the bottom of the housing.\u003c/p>\u003cp>SFX came through the same shops: hazers, foggers, cryo, snow, confetti, bubbles. Foggers are the worst repair on the list. Hands down. A mess.\u003c/p>\u003cp>At Brown Note I helped push 30 to 40 lights a week for about two years. At Tracks and Temple, keeping the rooms alive was part of the job, and so was teaching other techs the same cycle. Under Chris Moore Designs I pushed a maintenance clause on installs with my name on them. Glow Lounge was the test: I hung the rig, then cleaned it monthly for about a year after.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":[],"gallery":[{"url":"media/Fabrication/Lighting & SFX Service/Lighting-SFX-Service-img-6c7554.webp","fit":{"scale":1.75,"x":27,"y":16.2,"rotate":0},"thumbnail":"media/Fabrication/Lighting & SFX Service/Lighting-SFX-Service-img-6c7554-thumb.webp"},{"url":"media/Fabrication/Lighting & SFX Service/Lighting-SFX-Repair-img-cdfe5c.webp","thumbnail":"media/Fabrication/Lighting & SFX Service/Lighting-SFX-Repair-img-cdfe5c-thumb.webp"},{"url":"media/Fabrication/Lighting & SFX Service/Lighting-SFX-Repair-img-ac7508.webp","thumbnail":"media/Fabrication/Lighting & SFX Service/Lighting-SFX-Repair-img-ac7508-thumb.webp"},{"url":"media/Fabrication/Lighting & SFX Service/Light
