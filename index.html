            "description": "<p>A custom local content management system that generates the fully static React portfolio you are viewing.</p>",
            "longDescription": "<p><strong>Portfolio CMS</strong> is a bespoke local content management system designed to streamline personal website updates without the overhead of a traditional database or paid hosting platform. The primary goal is to provide a rich visual editing environment on a local machine that ultimately outputs a fully static, single-page HTML file. What sets this architecture apart from standard platforms is its zero-runtime philosophy and self-referential nature: the very website you are currently browsing was generated by this software. Instead of relying on a live backend or fetching data from an API, the CMS injects all text and media data directly into the React site template as an embedded JSON block. This approach eliminates server costs, removes database maintenance, and guarantees instantaneous load times for the end user.</p><p>The authoring workflow operates entirely through a lightweight Node and Express server running locally. Users manage content via a custom vanilla JavaScript admin panel, which features a drag-and-drop interface for ordering projects and integrating YouTube previews. When media is uploaded, an automated processing pipeline takes over. It converts legacy image formats to optimized WebP files, applies necessary EXIF rotation fixes, and automatically routes the assets into category-specific folders. Once the content is ready, the user triggers a publish script that merges the local JSON data files with the front-end template, generating a single, self-contained HTML file that can be pushed directly to GitHub Pages.</p><p>The underlying technical engine balances a robust local backend with an exceptionally lean production frontend. The local server utilizes Express for routing and file management, paired with Sharp for high-performance image processing. The administrative interface is styled with Tailwind CSS and uses Quill for rich text formatting. For the live site, React 18 and Babel run directly from a CDN, parsing the embedded JSON payload upon loading. This complete decoupling of the authoring environment from the public-facing deployment results in a highly secure, maintainable, and cost-effective personal portfolio system.</p>",

            "description": "<p><strong>Temple Nightclub | San Francisco </strong>- The main room remodel at Temple San Francisco wraps a 208V curved video ceiling and 10 custom pixel pillars into a flat-black, switched-relay infrastructure built across a two-year pandemic shutdown.</p>",
            "longDescription": "<p>The main room remodel at Temple Nightclub in San Francisco is a dense, hybrid lighting and video installation designed to deliver maximum environmental immersion and operational flexibility. The core architecture integrates a curved video ceiling that wraps behind the DJ, ten custom floor-to-ceiling LED pixel pillars, and a vast array of moving wash fixtures. The primary differentiator of this design is its meticulous flat-black construction across all hardware components. This design choice allows the entire complex infrastructure to vanish completely into the dark when unlit, contrasting sharply with the massive visual output of the active rig.</p><p>Constructed during the 2020 pandemic shutdown, the installation required profound physical and electrical infrastructure modifications before aesthetic integration could begin. To safely accommodate the curved video ceiling, a fire-suppression team was brought in to entirely reroute the sprinklers to deploy beneath the wall. The venue's power capacity was completely overhauled with new 400-amp and 200-amp services and breaker panels, feeding a meticulously mapped network of dedicated and shared circuits based on strict component specifications. Operational efficiency was prioritized throughout the physical build; all rig power was placed on switched relays for centralized shut-down, and independent, hardwired house lighting was installed to allow staff maintenance without activating the complex show systems.</p><p>The defining technical achievement of the installation is the cohesive, cross-system pixel mapping infrastructure layered on top of this robust electrical foundation. By linking the video playback engine directly to the room's environmental lighting—including custom edge-lit VIP tables, illuminated booths, and a double-sided dancefloor monolith—the system translates localized video content into precise color and intensity data distributed across the entire venue. To manage             "description": "<p>A custom 3D printed display stand utilizing high density LED pixels to create dynamic architectural lighting.</p>",
            "longDescription": "<p>This project is a custom display stand designed specifically to house and illuminate an Emmy award. The core objective was to scale down professional live entertainment lighting design principles into a miniature desktop footprint. Unlike standard display cases, this piece treats the award as a practical subject by utilizing a five part optical array to provide structural uplighting, directional side booms, and a dynamic illuminated backdrop.</p><p>The fabrication process combined custom 3D modeling and additive manufacturing using Bambu Lab printers to build a specialized structural enclosure. The physical workflow involved integrating 12 volt WS2815 LED pixels at a high density of 144 per meter throughout the framework. These visual components include a raised pedestal with bounced front lighting, a base styled as a traditional film strip, six sweeping boom towers for side and upward lighting angles, a pleated backdrop, and vertical wall washing strips on the outer edges.</p><p>The primary technical achievement is the thermal and power management system required to safely drive high density LEDs within a plastic enclosure. The fixture operates on a Wasatch Pixels Basic Eight Controller running WLED firmware for precise addressable lighting control. To prevent the 3D printed chassis from warping, the overall current draw is strictly limited in software, successfully balancing optimal visual brightness with safe operating temperatures.</p>",

            "image": "media/Apps/LithoLab/image2.webp",
            "description": "<p>A fully browser-based web application for generating custom-shaped, multi-color 3D printable lithophanes with AI-assisted design tools.</p>",
            "longDescription": "<p><strong>LithoLab </strong>is a client-side web application designed to generate high-fidelity, custom-shaped lithophanes for 3D printing. While standard generators are restricted to traditional four-color CMYK constraints, LithoLab supports customizable, multi-color palettes to achieve superior color accuracy in the final physical print. The project differentiates itself by introducing custom masking capabilities that trim the lithophane into non-standard shapes, along with generating an independently exportable geometric border for polished, multi-part assemblies.</p><p>The system architecture was developed by porting the open-source PIXEStl backend to execute entirely within the browser, avoiding server-side processing overhead. The workflow is managed through a custom frontend interface where users upload source imagery, define masking parameters, and configure border dimensions. Upon export, the software isolates the customized border as a discrete 3D object, allowing users to assign specific filaments and colors when preparing the files in slicing software like Bambu Studio.</p><p>The standout technical achievement is the robust JavaScript implementation of the modified PIXEStl engine, paired with an integrated Google Gemini API for generating base images, structural masks, and file metadata. To solve the hardware constraints of color mapping on advanced machines like the Bambu Lab X1C, a dedicated companion utility called LithoPalletGen was built in parallel. This secondary application handles precise color palette generation, import/export functionality, and material calibration to ensure accurate physical reproduction of the digital models.</p>",

            "image": "media/Apps/Unfold/Screenshot 2026-07-25 154856.webp",
            "description": "<p>A React based web application featuring interactive card decks designed to facilitate meaningful conversations and reconnect people.</p>",
            "longDescription": "<p><strong>Unfold </strong>is a web application designed to help users reconnect with friends and family when relationships become routine. The interactive card game provides structured questions across four distinct decks to prompt reflection and meaningful dialogue. Unlike standard physical card games, Unfold adapts to user preferences by offering three distinct play modes, including a curated journey sequence that gradually deepens the interaction. The digital format optimizes the experience for remote communication over video calls.</p><p>The development process began with rapid prototyping using the Lovable platform to establish the core user experience and interaction logic. Following the initial proof of concept, the project was migrated to a dedicated GitHub repository for independent development and architectural refinement. The primary workflow centers on user choice, allowing individuals to pull from specific decks, combine all cards randomly, or set a defined number of prompts for a structured progression. This flexible logic ensures that users can tailor the depth and pace of their conversations.</p><p>The application operates on a modern React and TypeScript foundation that prioritizes performance and data privacy. The technical core utilizes a custom state management layer built with React Hooks and the LocalStorage API, ensuring all sensitive user interactions remain securely on the client side. The front end integrates Tailwind CSS and Radix UI primitives to deliver an accessible, responsive, and visually refined interface. This UI architecture maintains fluid transitions and robust state handling during complex card drawing interactions.</p>",

            "description": "<p>A 3D-printed, single-print LED pixel art sculpture utilizing clear shells and software-limited thermal management for maximum brightness.</p>",
            "longDescription": "<p>The LED pixel pyramid is an internally divided, single-print pixel art sculpture. The primary goal was to create a vibrant, multi-material light installation without the need for complex post-print assembly. While early proofs of concept were successfully prototyped on an IDEX printer using standard black and white filaments, the opaque outer shell severely limited the light transmission to dark environments. By shifting to a clear top shell, the design maximizes luminosity and creates a much more versatile display piece.</p><p>The fabrication process relies heavily on the speed and multi-material capabilities of the Bambu Lab X1C. Moving from rough prototypes to the final model requires continuous printing over a 1 to 3-day cycle, with three filament swaps occurring on every layer. While this approach achieves the necessary visual quality and structural integrity, it introduces unique challenges with material swap waste, which will inform future optimizations using tool-changer machines.</p><p>The primary engineering hurdle involved managing the trapped internal heat generated by the LEDs, which threatened to warp the 3D-printed structure over time. To solve this, precision software-side current limiting was implemented via WLED. This ensures a perfect balance between maximum visual brightness and safe thermal dynamics, preserving the integrity of the piece.</p>",

            "image": "media/Art/Pixel Mini Pyramid/20230726_201532.webp",
            "description": "<p>A compact, USB-C powered 8x8 LED matrix desk piece featuring a scannable 3D printed QR code base.</p>",
            "longDescription": "<p>The Pixel Mini Pyramid is a compact 8x8 LED matrix display tailored specifically for desktop environments. The primary goal was to scale down a previous 16x16 design into a highly portable footprint powered entirely by a standard 5V USB-C connection. It differentiates itself by integrating a giant physical QR code directly into the base structure, transforming a standard lighting piece into an interactive promotional tool that links users directly to my web portfolio.</p><p>The development process required a hybrid modeling approach to balance mechanical and aesthetic requirements. SolidWorks provided the mechanical precision necessary for securely housing the internal electronics, while Blender handled the external geometric elements. During fabrication, the physical assembly was streamlined by utilizing a Bambu Lab X1C to extrude three distinct materials in a single print job. This manufacturing workflow allowed the intricate QR code base and the structural enclosure to be produced cohesively, ensuring tight tolerances for the internal hardware without complex post processing.</p><p>At the core of the project is an ESP32 microcontroller running WLED firmware, providing robust control over the complex light patterns across the addressable 8x8 pixel grid. Integrating 5V USB-C power delivery was a crucial technical requirement, eliminating the need for bulky external power adapters and making the unit self contained. The standout fabrication achievement remains the seamless three material 3D printing process, which successfully merged the interactive promotional requirements with strict mechanical constraints in one automated step.</p>",

            "id": "8000",
            "timestamp": "2026-01-13T00:04:25.482Z",
            "title": "Pixel Plane Warp",
            "category": "Art",
            "image": "media/Art/Pixel Plane Warp/20230719_221111.webp",
            "description": "<p>A 3D printed LED sculpture that warps a simple two-dimensional plane into a striking floating light display.</p>",
            "longDescription": "<p>Pixel Plane Warp is an internally subdivided, 3D printed LED pixel sculpture designed for display on flat surfaces like tables or pedestals. The core objective is to demonstrate how profound visual effects can emerge from strict design simplicity. Unlike traditional volumetric lighting displays, this piece takes a standard flat plane and distorts it with a single, sweeping wave that terminates in dramatic, opposing points. This geometry, combined with opaque black structural walls, creates the illusion of a floating surface specifically tailored for rendering abstract light patterns.</p><p>The physical fabrication workflow required careful orchestration between mechanical design and organic modeling. The initial geometry and structural framework were engineered in SolidWorks to ensure precise dimensional accuracy and proper mating of the internal subdivisions. The surface was then manipulated in Blender to achieve the sweeping wave and the sharp corner points. The final unified model was fabricated using a Bambu Lab X1C, which provided the tight tolerances necessary to create the opaque black walls that isolate the individual light channels and preserve the crispness of the floating display effect.</p><p>At the core of the piece is an ATHOM ESP8266 based decoder running WLED, which drives the pixel mapping and pattern generation. The primary engineering constraint for this sculpture was thermal management. Heat generation from the LEDs poses a significant risk of warping the internal 3D printed structure. Because the highest point of the warped plane sits at a considerable distance from the light source, balancing light transmission with thermal output required careful calibration. As a result, the sculpture is intentionally optimized for lower light environments, ensuring vibrant visuals while protecting the structural integrity of the print.</p>",

            "image": "media/Fabrication/Field Solder Station/20250317_180657.webp",
            "description": "<p>A portable, field soldering station designed to streamline complex live entertainment installations.</p>",
            "longDescription": "<p>The field solder station is a highly compact, tool carrier engineered to solve the logistical challenges of on site LED installations. Working in unconventional locations like high ladders or cramped spaces under a stage requires immediate access to tools without the burden of a bulky bench setup. This solution differentiates itself by consolidating an entire soldering toolkit into a single portable chassis driven by a standard USB PD battery bank.</p><p>This tool emerged from an iterative prototyping process tested directly in the field during a major San Francisco nightclub installation. Initial concepts explored integrated batteries and complex wiring before the design converged on a simplified approach to maximize reliability and reduce weight. The final iteration logically organizes a TS100 or TS101 iron, solder spool, a bottle of flux, desoldering pump, wick, wet and wire sponges, and rubber feet into an optimized spatial layout.</p><p>I designed the chassis in SolidWorks to tightly pack the required tools into a minimal footprint. Fabricated from PLA using Bambu Lab 3D printers, the structure leverages precision tolerances to secure mechanical hardware like the dual helping hands through a robust friction fit. This precise 3D modeling eliminated the need for secondary mechanical fasteners, resulting in a streamlined and self contained system that reliably supports mobile fabrication work.</p>",

            "title": "LED Pixel Panel",

            "image": "media/Electronics/Pixel Panel PCB/20200910_134441.webp",
            "description": "<p><strong>Temple Nightclub | San Francisco</strong> - A high-impact LED ceiling installation engineered for ultra-low headroom environments using custom-modified dancefloor PCBs.</p>",
            "longDescription": "<p>The objective was to create an immersive LED pixel lighting design for the basement level of Temple nightclub in San Francisco despite severe headroom limitations. This project diverges from standard fixture installations by utilizing custom-modified LED dancefloor PCBs repurposed for ceiling mounting. By stripping the technology down to its bare circuit boards, the design achieves a massive visual impact within a fraction of the traditional spatial footprint.</p><p><br></p><p>The workflow began by sourcing an LED dancefloor manufacturer and collaborating directly with them to engineer custom boards. The physical design required specific functional alterations, including adjusted pixel spacing, enlarged mounting holes, 90-degree wire headers, and a specialized protective backing material. For the physical integration, an aluminum T-track system was mounted directly to the ceiling infrastructure, allowing the custom PCBs to bolt securely into the track for a seamless fit.</p><p><br></p><p>The primary engineering achievement was compressing a high-density lighting matrix into a total vertical profile of under one inch. The system operates on a 24-volt power architecture and utilizes WS2818 addressable pixels. The selection of WS2818 components ensures robust performance through redundant data transmission, preventing single-pixel failures from interrupting the visual array during demanding live operations.</p>",

            "category": "Circuits",

            "image": "media/Lighting/LVL - Denver/IMG_20191009_231844.webp",
            "description": "<p><strong>Temple Nightclub | Denver</strong> - An electrical and data overhaul of an immersive pixel lighting rig to ensure stability and enable 3D voxel mapping.</p>",
            "longDescription": "<p>The LVL room at Temple Denver features an immersive, exclusively pixel-based lighting installation with continuous lines running across the floor, ceiling, and pillars. The core goal of this project was to execute a comprehensive structural rewiring of the power and data distribution to transform an unstable installation into a robust, production-ready system. Unlike standard rig assemblies, this overhaul required retrofitting an existing design, demanding precise power management and signal integrity to support advanced, whole-room spatial mapping without compromising the original aesthetic.</p><p>The project workflow centered on meticulous hardware restoration and systemic reconfiguration. Every segment of the existing LED tape was systematically removed, rigorously tested, resoldered, heat-shrinked, and reinstalled to guarantee structural and electrical integrity. To handle the data load, the LED decoder lines were strategically decentralized across the network. Concurrently, the entire power infrastructure was redesigned, efficiently routing power from supplies located in the back room and beneath the DJ booth to ensure consistent performance across the venue's footprint.</p><p>The primary technical constraint of the installation was the extreme length of the pixel runs, which inherently caused severe voltage drop and data signal degradation. This was overcome by running DC wire in parallel with the LED strips to introduce strategic power injection points, guaranteeing uniform brightness and absolute data stability. With the hardware stabilized, the entire room was 3D voxel mapped, allowing the control system to execute volumetric, full-room effects like spatial line sweeps. By isolating specific structural elements into distinct groups, the system can also effectively simulate the behavior of traditional lighting fixtures within a continuous pixel environment.</p>",

            "tags": [

            "image": "media/Lighting/MIrus Art Gallery - Denver/IMG_20180614_235653.webp",
            "description": "<p><strong>Mirus Art Gallery | Denver </strong>- A dynamic RGBW LED lighting installation integrated into custom wooden ceiling louvers for a modern art gallery.</p>",
            "longDescription": "<p>This project involved the execution and build of a dynamic ceiling lighting installation at the MIRUS Art Gallery in Denver. The primary goal was to provide a versatile lighting environment capable of delivering vibrant psychedelic visuals for modern events while maintaining the ability to produce a clean, solid white wash for displaying traditional paintings. The installation stands out by seamlessly integrating technology into the architecture, utilizing custom fabricated wooden louvers with routed edges to conceal the lighting hardware while maximizing the wash effect across the room.</p><p>Working from a finalized design and parts specification, the build process required precise physical assembly and electrical routing. The workflow began with mounting the RGBW wash LED strips directly into the routed channels of the wooden ceiling louvers. From there, the low voltage wiring was routed through the ceiling infrastructure to connect with the necessary high current power supply units and DMX decoders. This required careful cable management and power distribution planning to ensure reliable operation and clean aesthetics within the gallery space.</p><p>The technical backbone of this installation relies on a streamlined DMX control architecture driven by Madrix Basic software. Because the system utilizes wash strips rather than individually addressable pixels, the entire room's channel count efficiently fits within a single DMX universe. This efficient use of control data, combined with robust high current power supplies and DMX decoders, ensures stable and responsive lighting transitions whether the gallery requires immersive color chases or pristine white illumination.</p>",

            "id": "8787",
            "timestamp": "2026-01-17T17:49:41.986Z",
            "title": "Inflatable Tubes",
            "category": "Lighting",
            "image": "media/Lighting/Reelworks - Denver/20230621_172727.webp",
            "description": "<p><strong>Reelworks | Denver</strong> - Custom ultra-bright LED illumination architecture designed for 100-foot inflatable centerpieces at Denver Pride 2023.</p>",
            "longDescription": "<p>This project delivered the centerpiece lighting architecture for Reelworks and Tracks during Denver Pride 2023, designed specifically to illuminate massive 100-foot inflatable tubes. The primary objective was to achieve an exceptionally high brightness level capable of standing out in a highly saturated live event environment. To exceed standard luminous constraints, the project bypassed off-the-shelf solutions in favor of custom-manufactured pixel strands. These bespoke strands featured double-sided LEDs housed behind clear lenses, maximizing light transmission and ensuring high-fidelity color rendering from every viewing angle.</p><p>Executing the design required a precise electrical and mechanical workflow to manage extreme cable lengths and power demands. Two of the custom 100-foot LED strands were run in parallel inside each inflatable structure to compound the overall brightness. Overcoming the inevitable voltage drop across a 100-foot span required an isolated power distribution strategy. Power supplies were strategically mounted at both ends of the tubes, and the positive voltage lines were physically severed at the midpoint. This safely prevented power back-feeding between the discrete power supply units while allowing data to travel seamlessly across the entire fixture.</p><p>The technical foundation of the installation was built on a 24V LED system equipped with redundant data lines, mitigating the risk of pixel failure during the live show. Visual programming and real-time system control were driven entirely through Resolume Arena for large-scale pixel mapping. A significant engineering constraint emerged regarding signal transmission: while wireless decoders performed flawlessly during closed testing, the deployment revealed severe RF interference caused by the dense concentration of attendee cell phones. This provided a critical validation for utilizing hardwired data infrastructure to maintain system stability in electromagnetically noisy, large-scale event spaces.</p>",

            "id": "9925",
            "title": "GeoLens Pro",
            "category": "Apps",
            "tags": [],

            "description": "<p><strong>GeoLens Pro</strong> is a local-first PWA that automatically sorts and annotates field photos using GPS geofencing.</p>",

            "longDescription": "<p><strong>LithoPalletGen</strong> is a specialized color calibration application designed to streamline multi-material lithophane workflows by accurately mapping printed filament swatches. Unlike standard single-pixel color pickers, this tool utilizes a configurable area-averaging eyedropper that samples regions ranging from 32 to 256 pixels. This distinct approach neutralizes surface noise, lighting variances, and filament translucency, ensuring statistically accurate color profiles that reflect the physical characteristics of the printed material.</p><p>The tool operates through a split-pane interface that directly pairs a canvas-based image viewer with a hierarchical palette builder. Users upload photographs of physical prints and systematically construct multi-layer color profiles, categorizing base colors alongside ordered layers of increasing material thickness. As users sample the image, a live-updating bounding box overlays the canvas, aggregating color data across hundreds of pixels to actively filter out the textural inconsistencies inherent in FDM prints.</p><p>Engineered as a zero-dependency vanilla JavaScript application with no build step, the system operates entirely client-side, utilizing IndexedDB for persistent image storage and localStorage for palette serialization. The core technical achievement is the real-time pixel averaging engine, which rapidly executes per-frame <code>getImageData</code> computations across large pixel arrays while maintaining fluid cursor responsiveness. A unified color model anchors the architecture, driving a dual-format export system that outputs PIXEstl-compatible JSON in either HSL or hex notation for immediate downstream processing.</p>",

            "image": "media/Lighting/The Orb - Temple _ Denver/ORB2.webp",
            "description": "<p><strong>Temple Nightclub | Denver</strong> - An 8 foot diameter kinetic LED sphere featuring complex voxel mapping and remote high current DC power distribution.</p>",
            "longDescription": "<p>The Orb is an 8 foot diameter kinetic lighting centerpiece designed for Temple nightclub in Denver. The primary objective was to deliver a massive, three dimensional visual experience that physically interacts with the crowd by moving dynamically on a motorized hoist during headliner performances. It stands apart from standard LED installations by intentionally maximizing negative space within the aluminum frame to create a true volumetric 3D effect rather than a solid luminous surface.</p><p>Inheriting the project in an unfinished state required an immediate evaluation of the system architecture to ensure structural safety and electrical reliability. The physical build involved securing hundreds of individual LED pixel modules to the frame while carefully managing weight and visual sightlines. To preserve the open aesthetic, only the data decoders were housed inside the sphere. The bulky power supply units were relocated above the ceiling, requiring thick gauge copper wiring to transport the power safely down the hoist lines and into the moving structure.</p><p>The core technical achievement of this build was engineering safe and reliable high current DC power distribution over a significant distance. Mitigating the voltage drop from the remote ceiling power supplies to the suspended orb required precise load calculations and rigorous power protection methods. On the control side, the physical layout of the LEDs was translated into an exact 3D voxel map using Madrix software to enable complex volumetric lighting programming.</p>",

            "title": "The Basement",
            "category": "Lighting",
            "image": "media/Lighting/The Triangle/IMG_20180614_174327.webp",
            "description": "<p><strong>Triangle Bar | Denver</strong> - A mixed-rig nightclub lighting installation featuring video integration, moving profiles, and a custom indirect pixel ceiling.</p>",
            "longDescription": "<p>The basement installation at Triangle in Denver is a comprehensive entertainment environment utilizing a mixed rig of pixels, conventional lighting, and video elements. The primary goal was to create an immersive visual experience across the DJ booth, dancefloor, and bar areas. What sets this design apart is the custom bounce-effect ceiling array. Instead of directing light straight down at the audience, each ceiling slat houses twenty pixel modules pointing upwards. The spaced slats allow the reflected light to bleed through, producing a highly unique and perfectly smooth color gradient effect overhead.</p><p>Executing this design required orchestrating multiple distinct zones into a unified visual system. The physical workflow integrated a front screen and rear backdrop for the DJ booth, moving profile fixtures for the dancefloor, and high impact under-lighting for the bar rails. A major spatial constraint was the acoustic noise generated by the large number of power supplies required for the overhead pixels. To solve this, the installation process involved routing all power and data from an isolated adjacent room, keeping the main club environment entirely free of hardware clutter and fan noise.</p><p>The technical success of this project relies heavily on the implementation of long-range pixel decoders. Transmitting high-speed data and stable power over extended distances introduces significant signal integrity challenges. By leveraging specialized long-range decoding hardware, the system effectively bridges the physical gap between the remote power racks and the ceiling array. This solution overcomes the structural limitations of the venue, ensuring flawless pixel mapping and synchronization across the ceiling without compromising the acoustic or visual aesthetic.</p>",

        {
            "title": "Vertical Pixel Bar Tubes",
            "category": "Circuits",
            "image": "media/Lighting/Vertical Pixel Tubes - Que Bueno Suerte!/20240619_122306.webp",
            "description": "<p><strong>Que Bueno Suerte! | Denver</strong> - Restoration of a custom, high-channel-count LED installation integrating recycled fluorescent tubes into a modernized venue network.</p>",
            "longDescription": "<p>This project involved the structural restoration and system integration of a legacy lighting centerpiece suspended above the main bar at Que Bueno Suerte!. The primary goal was to salvage an inherited visual asset constructed from recycled four-foot and eight-foot fluorescent tubes and bring it online with a newly installed venue-wide control system. The key differentiator was the strict constraint of working within a pre-existing physical framework, which required reverse-engineering and modernizing a failing, custom-built design rather than executing a standard blank-slate installation.</p><p>The physical workflow required systematically uninstalling dead fixtures, separating the three-tube clusters, and extracting the degraded LED tape from the core of each bundle. Concurrently, the electrical infrastructure underwent a complete overhaul to replace obsolete decoders housed in custom overhead power boxes. This hardware intervention established the necessary communication link, bridging the repaired legacy physical structures with the modern, centralized data network governing the rest of the venue's lighting.</p><p>The upgraded fixtures utilize 5V WS2813 LED strips, selected specifically for their backup data line to provide signal redundancy and prevent future cascade failures within hard-to-access overhead locations. Because the physical design dictated maintaining the original 60-pixel-per-meter density, the resulting display requires an astronomical channel count to operate. Managing this immense data footprint required integrating upgraded decoders capable of processing high-density pixel output while staying continuously synchronized with the venue's overarching control system.</p>",

            "title": "Pixel Negative \"X\"",
            "category": "Art",
            "image": "media/Art/Pixel Negative _X_/20230717_155724.webp",
            "description": "<p>A minimalist LED art installation that transforms from a blank canvas into a textured light display.</p>",
            "longDescription": "<p>Pixel Negative \"X\" is a custom illuminated art piece designed to serve as a minimalist white square when powered off and a complex visual display when activated. The defining feature of this project is the internal geometry of the LED cells. Instead of a standard diffused grid, each pixel is optically isolated and features a physical \"X\" obstruction through its center. This configuration casts a uniform array of negative space across the diffusion layer to create a uniquely textured pattern when displaying multicolor light arrays.</p><p>The development process required precise mechanical design to ensure proper light isolation between adjacent pixels. The structural framework and light baffles were modeled in SolidWorks to exact tolerances before being fabricated. Assembly involved integrating the custom physical grid with the outer material to ensure the hidden internal structure remained completely invisible until the light source was activated.</p><p>Fabrication was executed using a Bambu Lab X1C 3D printer for high dimensional accuracy. The lighting system is driven by an ATHOM ESP8266 microcontroller running WLED software. To ensure ongoing reliability and physical stability, the system utilizes software based current limiting. This precise power management prevents thermal buildup, effectively protecting the printed internal components from heat deformation and warping during extended use.</p>",

        {
            "title": "Pixel Seed of Life",
            "category": "Art",
            "image": "media/Art/Pixel Seed of Life/20230717_155617.webp",
            "description": "<p>A dual-material LED art installation that conceals a vibrant, geometric pattern behind a minimalist white facade.</p>",
            "longDescription": "<p>Pixel Seed of Life is a dual-material LED pixel art installation designed to reveal a hidden geometric pattern only when illuminated. The core objective is to contrast a minimalist exterior with a vibrant, dynamic interior display, visually representing the concept of open-mindedness. Unlike standard exposed LED matrices, this piece relies on a specialized physical design that appears as a blank white canvas when unpowered, successfully concealing the intricate cellular structure underneath.</p><p>The physical enclosure and internal components were designed entirely in SolidWorks, focusing on precise geometric boundaries. To achieve a seamless and flat exterior face, the main display surface is printed face down on the build plate. The internal architecture features specific cellular subdivisions that physically isolate each light source. This structural light-blocking approach prevents color bleeding between the pixels, ensuring sharp contrast for the underlying geometric pattern when the LEDs activate.</p><p>Fabrication was executed on a Bambu Lab X1C 3D printer to manage the precise dual-material extrusion required for both the light-blocking and light-diffusing layers. The lighting system itself is driven by an ATHOM ESP8266 controller running WLED firmware, which provides complex and customizable lighting patterns. To ensure long-term stability and safety within the printed enclosure, the system utilizes strict current-limiting parameters that actively prevent heat buildup and protect the internal hardware.</p>",

        {
            "title": "Pixel Celtic Owl",
            "category": "Art",
            "image": "media/Art/Pixel Celtic Owl/20220315_175342.webp",
            "description": "<p>A 3D printed LED sculpture utilizing novel internal subdivisions and a flat panel stamping technique.</p>",
            "longDescription": "<p>Pixel Celtic Owl is a 3D printed, internally subdivided LED sculpture designed to map addressable lighting to intricate, non-linear forms. The project advances previous grid-based lighting designs by introducing a novel process for applying internal light isolation to highly complex shapes. This approach enables precise light control within a detailed geometric model, bypassing the physical limitations of standard rectangular LED matrices.</p><p>Constructing the piece required solving the spatial challenges of embedding an irregular object within a controlled lighting environment. The fabrication workflow involved developing a custom modeling technique to generate an intricate internal grid that contours precisely to the 3D model. To manage the overall footprint, the process also incorporated a custom boolean method to stamp the complex geometry into a flat backing panel. This step effectively filled the negative space around the sculpture and provided a secure housing for the electronics.</p><p>The physical enclosure is fabricated from PLA+ using a Bambu Lab X1C 3D printer to achieve precise dimensional accuracy and clean light boundaries between the internal cells. The lighting system is driven by an ATHOM ESP8266 controller running WLED firmware. This hardware combination provides robust, addressable control for the internal pixel layout, merging precise physical manufacturing with reliable open-source lighting software.</p>",

        {
            "title": "Lobby Wall",
            "category": "Lighting",
            "image": "media/Lighting/Lobby Wall - Tracks _ Denver/0321151647.webp",
            "description": "<p><strong>Tracks | Denver </strong>- A modular, double-sided LED pixel wall engineered for rapid nightclub deployment and controlled via Madrix software.</p>",
            "longDescription": "<p>This project involved designing and deploying a double-sided LED pixel wall for a major facility remodel at Tracks nightclub in Denver. To overcome a highly compressed installation window, the system was engineered as a fully modular framework rather than a traditional in-place build. This approach allowed for comprehensive off-site assembly and testing, minimizing on-site risk and enabling a complete installation over the course of just two days.</p><p>The fabrication process required custom physical formatting to achieve the necessary visual density. Raw LED pucks were manually soldered with custom wire lengths to account for specific pixel spacing requirements. These custom arrays were then contact-cemented onto standardized pegboard panels in eight-pixel configurations. This modular panelized workflow enabled rigorous pre-installation testing of every segment. Once mounted in the venue, the arrays were finished with frosted plexiglass panels secured on standoffs, providing even light diffusion across both sides of the wall.</p><p>The installation's hardware architecture relies on the WS2801 two-wire protocol, driven by a 16-output SanDevices E682 decoder. To streamline the physical wiring and digital mapping, the power and data topology was organized so that each horizontal row of pegboard modules connects to a dedicated output on the controller. The entire double-sided array is mapped and dynamically driven using Madrix 3.6 lighting control software, allowing for complex, real-time pixel manipulation across the network.</p>",

        {
            "title": "Curved Liquor Bottle Display",
            "category": "Lighting",
            "image": "media/Lighting/Curved Liquor Bottle Display/Screenshot 2026-08-01 112340.webp",
            "description": "<p><strong>Que Bueno Suerte! | Denver</strong> - I designed and hardwired 96 custom louvered corner fixtures to illuminate a see-through sheet metal bottle shelf without blinding guests.</p>",
            "longDescription": "<p>Off-the-shelf extrusion was out of the question for the main bottle display at Que Bueno Suerte!. I wanted to aim light up at the bottles from the corners of the display sections without putting a lens or diffuser in front of the LEDs, preserving maximum throw distance and brightness. To keep raw diodes out of the guests' eyes, I 3D printed custom corner fixtures with integrated light-blocking louvers. Getting the louver spacing and angle right took a few rapid prototyping iterations, and the alignment pins snapped off on almost every print, but the LED tape track itself held the end caps in line.</p><p>The shelf is a see-through metal grid, which made hiding the wiring for 96 individual fixtures a project in itself. I handwired the entire array and wrapped the routing in black tubing secured with mini zip ties. Because there was no closed conduit to hide inside, I used double-sided foam tape to mount the louvers and leaned on the physical stiffness of the bundled wire to support its own weight across the grid.</p><p>In action, the shelf is mapped into the rest of the venue's LED pixel installations through a centralized Madrix server, running unified, building-wide dynamic looks. It worked cleanly until the restaurant opened for dancing and guests started abandoning drinks on every flat surface in the room. I had built the shelf for empty display bottles and never anticipated liquids up there. Spills dripped into the tracks and corroded the LED tape, and because of how the louver tracks were dimensioned, standard waterproof silicone tape would not fit as a drop-in replacement. I ended up requesting a sign to keep drinks off the display and keeping spare parts on hand.</p>",

        {
            "title": "Extrusion Centering Sled",
            "category": "Solutions",
            "image": "media/Fabrication/Extrusion Centering Sled/20200909_213244.webp",
            "description": "<p>A custom modular 3D printed alignment jig designed to perfectly center LED extrusion tracks on uneven nightclub pillars.</p>",
            "longDescription": "<p>This project required designing a custom alignment tool to install LED strip extrusions on the foundational pillars of Temple nightclub in San Francisco. The primary goal was to achieve visually perfect vertical alignment of center tracks on boxed pillars that were irregularly shaped and wavy. Unlike standard measuring methods, this unique solution utilized a physical jig that referenced the outer edge tracks to automatically find the relative center at any given height, ensuring the final installation appeared flawlessly straight.</p><p>The workflow began with a rudimentary prototype using scrap material and a ruler to test the alignment concept. The final tool functioned as a dynamic sled that rode inside the center LED extrusion track during the physical installation. As the jig slid upward along the track, notched ends highlighted with yellow china marker allowed for constant visual verification against the outer corner extrusions. This continuous referencing system made it possible to secure the center track with a pneumatic nailer progressively, actively compensating for the hidden waves in the underlying pillar casing.</p><p>The standout technical achievement was engineering a rigid tool that bypassed spatial manufacturing constraints. Because the required length of the jig exceeded the available 3D printer build plate, the component was designed as a four-part modular assembly. These interlocking sections maintained the structural integrity required to withstand the physical forces of the pneumatic nailing process while keeping the sled firmly on track. This custom hardware solution successfully transformed a highly irregular architectural environment into a precise, uniform lighting canvas.</p>",

        {
            "title": "Dance Floor Pillars",
            "category": "Circuits",
            "image": "media/Electronics/Pillars - Temple Nightclub _ San Francisco/Screenshot_20210306-180716_Photos~2.webp",
            "description": "<p><strong>Temple Nightclub | San Francisco</strong> - A ruggedized 320-meter pixel mapping installation engineered to deliver floor-to-ceiling architectural lighting within an immersive nightclub environment.</p>",
            "longDescription": "<p>The Temple Nightclub San Francisco main room remodel required powering and controlling 320 meters of high-density pixel tape across ten floor-to-ceiling architectural pillars. The primary objective was to immerse the dance floor in dynamic lighting while protecting fragile electronics from direct crowd contact. Unlike conventional stage lighting that operates at a safe distance, this installation integrated custom illumination directly into public structural elements, requiring a tamper-proof and visually seamless enclosure system that extends from the dance floor to above the main high-resolution LED video ceiling.</p><p>To achieve a clean aesthetic and prevent physical damage from venue patrons, the structural supports were wrapped in oriented strand board to mount mud-in aluminum extrusions using a pneumatic nailer. The remaining gaps were filled with additional board material, finished with drywall mud, sanded, primed, painted black, and sealed at the base with silicone caulk for spill resistance. Power injection wiring was concealed inside the corner moldings to mitigate voltage drop over the vertical spans, while thin metal tubing protected three-conductor 18 AWG wiring at the bottom of each column to reliably bridge power and data without exposing cables to the crowd.</p><p>The technical core of the installation relies on a modular, serviceable power and data distribution architecture engineered to support ten pillars, each featuring eight four-meter pixel strips across its corners and faces. Dedicated switched electrical outlets were professionally installed to provide isolated power across the system. At the top of each pillar, the individual strips converge into four consolidated data runs using a screw terminal block that interfaces with a 24-pin ATX power coupler. This coupler connects directly to a custom power distribution, fuse, and data control board housed safely above the video ceiling, ensuring safe current delivery, clean data transmission, and streamlined maintenance during live event operations.</p>",

        {
            "title": "Blackout Ceiling Tubes",
            "category": "Lighting",
            "image": "media/Lighting/Mezzanine Ceiling Tubes/20240619_123414.webp",
            "thumbnailFit": {
                "scale": 1.25,

            "bannerFit": {

            },
            "description": "<p><strong>Que Bueno Suerte! | Denver - </strong>18 fanless power supplies drive a blackout 3000K pixel array below a low mezzanine HVAC duct.</p>",
            "longDescription": "<p>A central HVAC duct and a low ceiling above the Que Bueno Suerte! mezzanine had already killed one designer's lighting concept years earlier. I took the lowest point of that duct as a hard clearance limit and shot a laser level across the room to hang a flat array of blackout tubes. The venue needed warm 3000K white for early evening dinner service and high-impact RGBW pixel chases for Latin dance nights. Standard milky white LED diffusion looks cheap when powered off, so I used black diffusion against the dark ceiling paint so the rig would visually disappear during the day.</p><p>I spent a month working overhead from 6ft ladders and restaurant benches, cutting strutchannel and setting cable anchors every 12 in along the beams. I originally ran 18/2 wire inside the tubes for power injection at the far end, but the wire drooped inside the casing and cast obvious shadows. I ripped the extra wiring out entirely and tested the strips from a single end, which ran full white with zero color shift.</p><p>Silent operation meant no fanned power supplies. I specced 18 waterproof MEAN WELL HLG units across 3 new 20A circuits, with each circuit powering a bank of 6 supplies and each supply driving 2 bars through independent fuses. Booting 6 fanless supplies at once tripped the breakers instantly from inrush current. I built custom sequencer boxes to stagger startup by 5 seconds so the capacitors could charge. Long-range decoders fed over 24 universes of sACN pixel data from a rack server in the office, running ENTTEC ELM before I moved the venue to Madrix 5.</p><p>The owner finally got his mezzanine installation without a low-hanging mess above the tables. The array blends into the ceiling paint by afternoon, gives a warm incandescent glow over dinner, and hits hard when the dance floor opens.</p>",
            "websiteLink": "",

            "featured": false,
            "wip": false,
            "tags": [

        const useDialog = (containerRef, onClose, isActive = true) => {
            // Read through a ref so the once-only effect below never sees stale state.
            const stateRef = useRef(null);
            stateRef.current = { onClose, isActive };

            useEffect(() => {
                const previouslyFocused = document.activeElement;
                const container = containerRef.current;

                const focusables = () =>
                    Array.from(container ? container.querySelectorAll(FOCUSABLE) : [])
                        .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);

                const first = focusables()[0];
                (first || container)?.focus();

                const onKeyDown = (e) => {
                    if (!stateRef.current.isActive) return;
                    if (e.key === 'Escape') {
                        e.stopPropagation();
                        stateRef.current.onClose();
                        return;
                    }
                    if (e.key !== 'Tab') return;
                    const items = focusables();
                    if (!items.length) { e.preventDefault(); return; }
                    const firstItem = items[0];
                    const lastItem = items[items.length - 1];
                    if (e.shiftKey && (document.activeElement === firstItem || !container.contains(document.activeElement))) {
                        e.preventDefault();
                        lastItem.focus();
                    } else if (!e.shiftKey && document.activeElement === lastItem) {
                        e.preventDefault();
                        firstItem.focus();
                    }
                };

                document.addEventListener('keydown', onKeyDown, true);
                return () => {

        const demoteHeadings = (html, startLevel) => {
            if (!html) return html;
            const source = String(html);
            const present = [...source.matchAll(/<h([1-6])\b/gi)].map(m => parseInt(m[1], 10));
            if (!present.length) return source;
            // Anchor the shallowest authored heading at startLevel so the outline neither
            // jumps backwards nor skips a level, and keep relative nesting below it.
            const shallowest = Math.min(...present);
            return source.replace(/<(\/?)h([1-6])([^>]*)>/gi, (match, slash, lvl, attrs) => {
                const original = parseInt(lvl, 10);
                const level = Math.min(6, startLevel + original - shallowest);
                if (slash) return `</h${level}>`;
                const cls = `rt-h${original}`;

        const Lightbox = ({ images, initialIndex, onClose, projectTitle }) => {
            const [index, setIndex] = useState(initialIndex);
            // Keyed to the index rather than reset in an effect, so navigating to the
            // next item collapses its caption without a frame of expanded text first.
            const [expandedFor, setExpandedFor] = useState(null);
            const [captionOverflows, setCaptionOverflows] = useState(false);
            const touchStartX = useRef(null);
            const touchEndX = useRef(null);
            const didSwipe = useRef(false);
            const dialogRef = useRef(null);
            const captionRef = useRef(null);
            const minSwipeDistance = 50;
            const captionId = 'lightbox-caption';

            useDialog(dialogRef, onClose);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowLeft') prevImage();
                    if (e.key === 'ArrowRight') nextImage();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [index]);

            const nextImage = () => {
                if (index < images.length - 1) setIndex(index + 1);
                else setIndex(0); 
            };

            const prevImage = () => {
                if (index > 0) setIndex(index - 1);
                else setIndex(images.length - 1); 
            };

            const onTouchStart = (e) => { touchEndX.current = null; touchStartX.current = e.targetTouches[0].clientX; };
            const onTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
            const onTouchEnd = () => {
                if (!touchStartX.current || !touchEndX.current) return;
                const distance = touchStartX.current - touchEndX.current;
                if (Math.abs(distance) > minSwipeDistance) didSwipe.current = true;
                if (distance > minSwipeDistance) nextImage();
                if (distance < -minSwipeDistance) prevImage();
            };

            // Clicking away from the media closes the viewer. Controls and the media
            // itself stop propagation, so anything reaching here is backdrop. A swipe
            // can surface as a click afterwards, so the first one after it is eaten.
            const onBackdropClick = () => {
                if (didSwipe.current) { didSwipe.current = false; return; }
                onClose();
            };

            const stopClick = (e) => e.stopPropagation();

            const currentItem = images[index];
            const currentUrl = mediaSrc(currentItem);
            const caption = mediaCaption(currentItem);
            const captionExpanded = expandedFor === index;
            const ytId = getYouTubeId(currentUrl);

            // Only offer the toggle when the text is actually cut off. Measuring is
            // skipped while expanded (nothing is clamped then), which leaves the last
            // clamped result standing so the collapse control stays available.
            // A single measurement here reads equal heights and misses the overflow:
            // Tailwind's runtime CDN injects the line-clamp rule after this commit, and
            // the web font reflows the text later still. Observing the box catches both,
            // and covers viewport resizes for free.
            useEffect(() => {
                const el = captionRef.current;
                if (!el || captionExpanded) return;
                const measure = () => setCaptionOverflows(el.scrollHeight > el.clientHeight + 1);
                measure();
                const observer = new ResizeObserver(measure);
                observer.observe(el);
                return () => observer.disconnect();
            }, [caption, captionExpanded]);

            return (
                <div ref={dialogRef} role="dialog" aria-modal="true" aria-label={`Media viewer for ${projectTitle || 'project'}`}
                     className="fixed inset-0 z-[200] bg-black flex flex-col animate-fade-in"
                     onClick={onBackdropClick}
                     onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
                    <button onClick={(e) => { e.stopPropagation(); onClose(); }} aria-label="Close media viewer" className="absolute top-4 right-4 p-3 bg-zinc-800/80 rounded-full text-white hover:bg-zinc-700 transition-colors z-[210]">
                        <X size={24} aria-hidden="true" />
                    </button>
                    {/* min-h-0 lets this shrink below its content so the image's max-h-full
                        resolves against the space left over by the caption, instead of
                        pushing the caption off-screen. */}
                    <div className="relative flex-1 min-h-0 w-full flex items-center justify-center p-4 md:p-10">
                        <button onClick={(e) => { e.stopPropagation(); prevImage(); }} aria-label="Previous item" className="absolute left-1 md:left-4 top-1/2 -translate-y-1/2 p-2 md:p-4 bg-black/40 md:bg-transparent rounded-full text-white/70 hover:text-white transition-colors z-[210]">
                            <ChevronLeft className="w-8 h-8 md:w-12 md:h-12" aria-hidden="true" />
                        </button>
                        {ytId ? (
                            <div className="relative w-full h-full max-w-5xl aspect-video" onClick={stopClick}>
                                <iframe 
                                    src={`https://www.youtube.com/embed/${ytId}?autoplay=1`} 
                                    title={`Video ${index + 1} of ${images.length} for ${projectTitle || 'project'}`}
                                    aria-describedby={caption ? captionId : undefined}
                                    className="w-full h-full border-0 rounded-lg shadow-2xl bg-black relative z-10"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowFullScreen
                                ></iframe>
                                {/* Touch zones for swiping - sides only, center remains interactive for video controls */}
                                <div className="absolute inset-0 z-20 flex pointer-events-none">
                                    <div 
                                        className="w-1/4 h-full"
                                        style={{ pointerEvents: 'auto' }}
                                        onTouchStart={onTouchStart}
                                        onTouchMove={onTouchMove}
                                        onTouchEnd={onTouchEnd}
                                    ></div>
                                    <div className="w-1/2 h-full"></div>
                                    <div 
                                        className="w-1/4 h-full"
                                        style={{ pointerEvents: 'auto' }}
                                        onTouchStart={onTouchStart}
                                        onTouchMove={onTouchMove}
                                        onTouchEnd={onTouchEnd}
                                    ></div>
                                </div>
                            </div>
                        ) : (
                            <img
                                src={currentUrl}
                                alt={describeMedia(currentUrl, index, images.length, projectTitle || 'Project')}
                                aria-describedby={caption ? captionId : undefined}
                                onClick={stopClick}
                                className="max-w-full max-h-full object-contain select-none"
                                draggable="false"
                            />
                        )}
                        <button onClick={(e) => { e.stopPropagation(); nextImage(); }} aria-label="Next item" className="absolute right-1 md:right-4 top-1/2 -translate-y-1/2 p-2 md:p-4 bg-black/40 md:bg-transparent rounded-full text-white/70 hover:text-white transition-colors z-[210]">
                            <ChevronRight className="w-8 h-8 md:w-12 md:h-12" aria-hidden="true" />
                        </button>
                    </div>
                    <div className="flex-shrink-0 w-full px-4 pb-6 flex flex-col items-center gap-2">
                        {caption && (
                            <div className="max-w-3xl w-full flex flex-col items-center" onClick={stopClick}>
                                <p
                                    ref={captionRef}
                                    id={captionId}
                                    className={`text-center text-sm md:text-base leading-relaxed text-zinc-200 ${captionExpanded ? 'max-h-[30vh] overflow-y-auto custom-scrollbar' : 'line-clamp-3'}`}
                                >
                                    {caption}
                                </p>
                                {(captionOverflows || captionExpanded) && (
                                    <button
                                        type="button"
                                        onClick={(e) => { e.stopPropagation(); setExpandedFor(captionExpanded ? null : index); }}
                                        aria-expanded={captionExpanded}
                                        aria-controls={captionId}
                                        className="mt-1 text-xs font-bold uppercase tracking-widest text-cyan-400 hover:text-cyan-300 transition-colors"
                                    >
                                        {captionExpanded ? 'Show less' : 'Show more'}
                                    </button>
                                )}
                            </div>
                        )}
                        <div aria-live="polite" onClick={stopClick} className="bg-zinc-800/80 px-4 py-2 rounded-full text-sm font-mono text-zinc-300">
                            <span aria-hidden="true">{index + 1} / {images.length}</span>
                            <span className="sr-only">Item {index + 1} of {images.length}</span>
                        </div>
                    </div>
                </div>
            );
        };
