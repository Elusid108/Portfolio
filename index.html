    {"projects":[{"id":"1842","title":"Portfolio CMS","category":"Software","tags":["JavaScript","React","Node.js","REST APIs"],"image":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181136.webp","description":"<p>I built a local Express content management system that compiles this entire site into a single 300KB file, not including the media.</p>","longDescription":"<p>Existing website builders always lock away some layout tweak or charge monthly fees to host a basic portfolio. My old workflow meant cutting videos in ClipAmp and hosting them on YouTube, which left content fragmented across external platforms and slow to load. I wanted everything in 1 place, running locally, with 0 recurring costs.</p><p>I built an administrative panel using vanilla JavaScript and an Express server that runs on my laptop. Dropping a video or photo into the editor triggers an automated pipeline that strips video audio, encodes to 1080p H.264, converts images to WebP, and sorts them into project folders. The front end runs React 18 from a CDN and reads from a JSON block. Updating a project now feels as fast as moving desktop files around, though I am still fixing an offset bug that leaves a black gap on mobile screens.</p><p>When I hit publish, the server merges the media and JSON data into index.html in under 10 seconds. That build process keeps the final footprint under 300KB. Pushing the project directory to GitHub Pages updates the live site immediately.</p>","video":"","gallery":[{"url":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181136.webp","thumbnail":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181136-thumb.webp"},{"url":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181154.webp","thumbnail":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181154-thumb.webp"},{"url":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181201.webp","thumbnail":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181201-thumb.webp"}],"launchLink":"","githubLink":"https://github.com/Elusid108/Portfolio","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-12T01:03:01.269Z","wip":false,"order":9,"specs":"<p><strong>Framework:</strong> React 18 (CDN), Node.js</p><p><strong>Language:</strong> Vanilla JavaScript</p><p><strong>Backend:</strong> Express, Sharp, Multer</p><p><strong>Styling:</strong> Tailwind CSS, Quill</p><p><strong>Storage:</strong> Local JSON (filesystem)</p><p><strong>Deploy:</strong> GitHub Pages (static output)</p>","related":[{"name":"chrismoore.me","url":"http://chrismoore.me"}],"thumbnail":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181136-thumb.webp"},{"id":"1","title":"Immersive Dance Lighting Rig","category":"Lighting","tags":["Lighting Design","Capture","Madrix","Resolume Arena","OSCpilot","Video Mapping","Pixel Mapping","Custom Fabrication","Roadhog 4"],"image":"media/Lighting/Immersive Dance Lighting Rig/20210516_134200.webp","description":"<p><strong>Temple Nightclub | San Francisco </strong>- The main room remodel at Temple San Francisco wraps a 208V curved video ceiling and 10 custom pixel pillars into a flat-black, switched-relay infrastructure built across a two-year pandemic shutdown.</p>","longDescription":"<p>The main room at Temple Nightclub in San Francisco required a dense hybrid lighting, pixel and video rig that could vanish entirely into the dark when unlit. I designed the system around a curved video ceiling wrapping behind the DJ, 10 custom LED pixel pillars, beams, wash's, profiles, all built in flat black. Before aesthetic integration could even start, the physical ceiling forced a massive life-safety detour. Because the curved video wall blocked standard fire suppression coverage, I brought in a fire crew to reroute the sprinklers both above and below the solid ceiling plane using side sprayers with a 15 ft reach. When we found the main sewer drain blocked, we had to run the drainage above grade through an alley test valve and cut in a new low-point basement drain just to clear the system.</p><p>Powering that density without burning equipment lifespan meant overhauling the venue's electrical capacity with new 400A and 200A services. I split the load across two new panels: 24 circuits of 208V on twist-lock connectors dedicated exclusively to the video ceiling, and 60 circuits of standard 120V Edison for the lighting. Rather than relying on independent wall switches, I wired the entire rig onto switched relays grouped in clusters of 4. That setup gave us centralized shutdown so fixtures would not sit sucking dust and burning hours during dark days, while hardwired house lights let staff handle maintenance without booting the show systems.</p><p>What was supposed to be a three-month build turned into a two-year pandemic ordeal where I cycled through three separate crews and stepped up to manage electricians, plumbers, and carpenters directly. The hardest recurring fight was not mechanical, but restraint. The owner and creative director wanted every fixture and screen blasted at 100% all the time. I argued that crowding that many lights into a small room is about having angles and combinations, like a single-color sweep or white eggbeater prisms, not raw brightness. When we finally opened and they tested that full-blast look on the crowd, the patrons rejected it within 10 minutes. When we ran the rig my way, linking the Resolume and Madrix engines across the ceiling, pillars, and scrap-built VIP tape walls, the entire room lit up on the first try without a single glitch.</p>","video":"","gallery":[{"url":"media/Lighting/Immersive Dance Lighting Rig/Screen Recording 2025-03-14 124624.mp4","fit":{"scale":1.3,"x":58.2,"y":51},"poster":"media/Lighting/Immersive Dance Lighting Rig/frame-thumb-1786196916589.webp","thumbnail":"media/Lighting/Immersive Dance Lighting Rig/frame-thumb-1786196916589-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/Screenshot 2025-03-14 124321.webp","thumbnail":"media/Lighting/Immersive Dance Lighting Rig/Screenshot 2025-03-14 124321-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/20210516_134200.webp","fit":{"scale":1.15,"x":32,"y":69.3},"thumbnail":"media/Lighting/Immersive Dance Lighting Rig/20210516_134200-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/VID_20200416_142554.mp4","poster":"media/Lighting/Immersive Dance Lighting Rig/VID_20200416_142554-poster.webp","thumbnail":"media/Lighting/Immersive Dance Lighting Rig/VID_20200416_142554-poster-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/20210517_112418~2.mp4","fit":{"scale":1.3,"x":12.7,"y":97.3},"poster":"media/Lighting/Immersive Dance Lighting Rig/frame-thumb-1786196823000.webp","thumbnail":"media/Lighting/Immersive Dance Lighting Rig/frame-thumb-1786196823000-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/Screenshot 2025-03-12 151156.webp","fit":{"scale":1,"x":50.5,"y":1.6},"thumbnail":"media/Lighting/Immersive Dance Lighting Rig/Screenshot 2025-03-12 151156-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/Screenshot 2025-03-17 193550.webp","fit":{"scale":1.15,"x":0,"y":39.4},"thumbnail":"media/Lighting/Immersive Dance Lighting Rig/Screenshot 2025-03-17 193550-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/Screenshot 2025-03-12 151235.webp","fit":{"scale":1,"x":47.7,"y":49},"thumbnail":"media/Lighting/Immersive Dance Lighting Rig/Screenshot 2025-03-12 151235-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[{"name":"Instrument schedule","url":"media/Lighting/Immersive Dance Lighting Rig/files/Temple SF instrument schedule.pdf","description":"Instrument schedule for the 2020 remodel of the main room lighting rig at Temple Nightclub in San Francisco"}],"featured":true,"websiteLink":"","timestamp":"2026-01-12T01:03:01.269Z","wip":false,"order":0,"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>Beam (x144)</strong><br><em>PD60 • LED • beam 4° • 60W • RGBW • infinite pan &amp; tilt</em></p><p><stro "2","specs":"Radiance Hazer, DMX, 120Vac, 500W"}]},{"id":"ac6ae498-f20c-45f5-9231-becea0b7b820","title":"PIXELS & DISPLAY","items":[{"id":"647d35f5-746c-45fa-b5c6-537b9f543364","name":"Dancefloor Pixel Pillars","qty":"10","specs":"x8 + 4m, RGBW (6000k), 60/m, 20px/m, "},{"id":"408be04b-a2d0-4326-9406-263044a8457f","name":"WiFi VIP Pixel Tables","qty":"32","specs":"2.1m, RGBW (6000k), 60/m, 20px/m, "},{"id":"148a40e2-bcb0-430b-8bd2-a798c77028e4","name":"Ceiling Screen","qty":"1","specs":"3.5m x 23m, P4.81, 728 x 4784, "},{"id":"409a907d-1120-4918-97f5-aa89b2c0ed7b","name":"DJ Booth Screen","qty":"1","specs":"7m x 1.5m, P4.81, 1456 x 312, "},{"id":"414aa3fd-6c43-45a6-8f83-0cfee36acafe","name":"Marquee Left Screen","qty":"1","specs":"14m x 1m, P4.81, 2912 x 208, "},{"id":"9ad37540-a9a0-4ac1-ba51-492d42f2b942","name":"Marquee Right Screen","qty":"1","specs":"18m x 1m, P4.81, 3744 x 208, "},{"id":"0dea8e17-9c96-41c5-afaf-5480898a284c","name":"Monolith Screens","qty":"1","specs":"1.5m x 3m (x2), P4.81, 312 x 624 (x2), "}]}]},{"id":"8147","timestamp":"2026-01-12T01:03:01.269Z","title":"Emmy Stand","category":"Sculpture","image":"media/Art/Emmy Stand/Gemini_Generated_Image_4xox7h4xox7h4xox.webp","description":"<p>I built a desktop display stand to house and illuminate a friend’s Emmy without melting the PLA+ enclosure.</p>","longDescription":"<p>An old coworker from my Tracks days won an Emmy and asked for a custom display. We used to work together when he was a bartender, so he knew my lighting background. I built him a desktop rig that scaled ballet lighting principles into a PLA+ enclosure.</p><p>The stand runs 512 addressable WS2815 LEDs across 7 data lines, driven by a Wasatch Pixels Basic Eight controller hidden inside the base. There are 3 boom towers per side with frosted lenses that arch back from downstage to upstage, while 45 deg wall washers sit recessed along the outer edges. A black and white film strip lines the bottom, printed in dual materials for diffusion and masking. The curved backdrop was too large for a single Bambu Lab print, so I built it in modular sections and turned the seams into an exaggerated surface texture.</p><p>Packing 144/m density LEDs into closed plastic is basically building a slow toaster. To keep heat from destroying the display from the inside out, I locked the current limit to 3A at 12V in WLED before I powered it on for the first time. I programmed the fixture in my dark apartment. When I set the Emmy on the pedestal, the reflective gold finish mirrored the light sources more than it absorbed the illumination, creating a warped mirror effect across the metal.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","Power Distribution","Lighting Design","SPI","Rapid Prototyping","ESP32","Custom Fabrication","AC/DC Load Calc","Wire-to-Board Soldering","Embedded Systems"],"gallery":[{"url":"media/Art/Emmy Stand/20250415_215715.webp","fit":{"scale":1.15,"x":36.2,"y":44.2},"thumbnail":"media/Art/Emmy Stand/20250415_215715-thumb.webp"},{"url":"media/Art/Emmy Stand/20250415_215552.webp","fit":{"scale":1.1,"x":100,"y":30.4},"thumbnail":"media/Art/Emmy Stand/20250415_215552-thumb.webp"},{"url":"media/Art/Emmy Stand/20250415_215613.webp","fit":{"scale":1.2,"x":0.6,"y":22.5},"thumbnail":"media/Art/Emmy Stand/20250415_215613-thumb.webp"},{"url":"media/Art/Emmy Stand/20250415_215637.webp","fit":{"scale":1,"x":46.4,"y":20.5},"thumbnail":"media/Art/Emmy Stand/20250415_215637-thumb.webp"},{"url":"media/Art/Emmy Stand/20250415_214902.mp4","poster":"media/Art/Emmy Stand/20250415_214902-poster.webp","thumbnail":"media/Art/Emmy Stand/20250415_214902-poster-thumb.webp"},{"url":"media/Art/Emmy Stand/20250415_215408.mp4","poster":"media/Art/Emmy Stand/20250415_215408-poster.webp","thumbnail":"media/Art/Emmy Stand/20250415_215408-poster-thumb.webp"},{"url":"media/Art/Emmy Stand/20250415_215438.mp4","poster":"media/Art/Emmy Stand/20250415_215438-poster.webp","thumbnail":"media/Art/Emmy Stand/20250415_215438-poster-thumb.webp"},{"url":"media/Art/Emmy Stand/20250415_215506.mp4","poster":"media/Art/Emmy Stand/20250415_215506-poster.webp","thumbnail":"media/Art/Emmy Stand/20250415_215506-poster-thumb.webp"},{"url":"media/Art/Emmy Stand/16a32949-8804-4094-9421-f709f77425ed.webp","fit":{"scale":1,"x":49.6,"y":59.2},"thumbnail":"media/Art/Emmy Stand/16a32949-8804-4094-9421-f709f77425ed-thumb.webp"}],"files":[],"video":"","order":0,"specs":"<p><strong>Medium:</strong> PLA+ (3 material)</p><p><strong>Color:</strong> Black, White, Transparent</p><p><strong>LEDs: </strong>512 (144/m)</p><p><strong>Driver: </strong>WS2815 (RGB)</p><p><strong>Decoder:</strong> Wasatch Pixels Basic Eight</p><p><strong>Firmware: </strong>WLED</p>","related":[],"thumbnailFit":{"scale":1.1,"x":39.1,"y":37.1},"bannerFit":{"scale":1,"x":27.5,"y":22.6},"thumbnail":"media/Art/Emmy Stand/Gemini_Generated_Image_4xox7h4xox7h4xox-thumb.webp"},{"id":"2944","title":"LithoLab","category":"Software","tags":["LLM Integration","TypeScript"],"image":"media/Apps/LithoLab/image2.webp","description":"<p>A client-side web application that generates multi-color lithophanes in custom shapes with an exportable border for 3D printing.</p>","longDescription":"<p>Four-color generators output rectangular prints and turn skin tones into magenta splotches. I wanted multi-color prints in custom shapes with an independent border, so I ported the PIXEStl engine to run client-side in a browser. Hosting the application on GitHub Pages kept it lightweight without server overhead.</p><p>Running mesh processing locally hit strict cache limits in the browser immediately. Early prints on a Bambu Lab X1C also exposed a persistent micro-gap along the right edge between the lithophane and its border, which took several of failed attempts to eliminate. I stripped the calibration tools out of the main application and built LithoPalletGen as a standalone utility to keep the primary interface clean. This companion app handles color mapping for any filament palette, extending past 4 colors to fix the banding on faces.</p><p>My own printer runs an 8 color setup across 2 AMS2 units, but the software supports any palette size. Once calibrated and backlit, the physical prints match the source photos.</p>","video":"","gallery":[{"url":"media/Apps/LithoLab/image2.webp","caption":"The LithoLab workspace links source image manipulation directly to physical 3D print parameters. In the main canvas, users apply custom geometric masks and adjust spatial orientation, while the sidebar controls physical dimensions, border scaling, and filament palette selection. The dual-preview engine at the bottom provides immediate feedback, displaying both a palette-accurate color rendering and a surface-texture depth map to verify print accuracy before exporting.","thumbnail":"media/Apps/LithoLab/image2-thumb.webp"},{"url":"media/Apps/LithoLab/20260717_135329.webp","thumbnail":"media/Apps/LithoLab/20260717_135329-thumb.webp"}],"launchLink":"https://elusid108.github.io/LithoLab/","githubLink":"https://github.com/Elusid108/LithoLab","shopLink":"","files":[{"name":"0.05mm Calibrated pallet file","url":"media/Apps/LithoLab/files/0.05mm_10layer_9 colors.json","description":"9 color calibrated .json file for LithoLab to 0.05mm layer height increments for use with a 0.2mm nozzle"}],"featured":true,"websiteLink":"","timestamp":"2026-01-12T01:03:01.269Z","wip":true,"order":0,"specs":"<p><strong>Language:</strong> TypeScript</p><p><strong>Build:</strong> Vite</p><p><strong>3D Engine:</strong> JSCAD Modeling</p><p><strong>AI:</strong> Google Gemini (text/image)</p><p><strong>Export:</strong> JSZip (STL bundling)</p><p><strong>Deploy:</strong> GitHub Pages</p>","related":[{"name":"Pallet generator","url":"#project/968"}],"thumbnail":"media/Apps/LithoLab/image2-thumb.webp"},{"id":"3670","title":"Unfold","category":"Software","tags":["React","TypeScript"],"image":"media/Apps/Unfold/Screenshot 2026-07-25 154856.webp","description":"<p>A browser-based card game with 4 prompt decks, built with local save states for video calls.</p>","longDescription":"<p>Unfold started as a quick prototype on Lovable to generate conversation cards for video calls. The game runs 4 prompt decks across 3 play modes to move discussions past routine small talk. Since the app needed no user registration or backend databases, paying for a subscription platform made no sense. I pulled the codebase into a dedicated GitHub repository and hosted it statically on GitHub Pages.</p><p>To avoid server costs, I used Cursor to build a local save-state layer using React Hooks and browser storage. That setup tracks previously seen cards and stores custom decks directly on the client. Built with Tailwind CSS and Radix UI primitives, the interface handles deck combining and card draws without dropping state.</p>","video":"","gallery":[{"url":"media/Apps/Unfold/Screenshot 2026-07-25 154856.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-07-25 154856-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183035.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183035-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183054.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183054-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183115.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183115-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183122.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183122-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183144.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183144-thumb.webp"}],"launchLink":"https://elusid108.github.io/Unfold/","githubLink":"https://github.com/Elusid108/Unfold","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-12T01:03:01.269Z","wip":false,"order":1,"specs":"<p><strong>Framework:</strong> React 18</p><p><strong>Language:</strong> TypeScript</p><p><strong>Build:</strong> Vite (SWC)</p><p><strong>Styling:</strong> Tailwind CSS, Radix UI</p><p><strong>Storage:</strong> localStorage</p><p><strong>Deploy:</strong> GitHub Pages</p>","related":[],"thumbnail":"media/Apps/Unfold/Screenshot 2026-07-25 154856-thumb.webp"},{"id":"670","timestamp":"2026-01-12T23:50:49.052Z","title":"Pixel Pyramid","category":"Sculpture","image":"media/Art/Pixel Pyramid/Gemini_Generated_Image_rmmssrmmssrmmssr.webp","description":"<p>Trapped LED heat inside a sealed, 3 material PLA+ pyramid print required software current limiting to prevent structural melting.</p>","longDescription":"<p>Getting crisp pixel isolation without light bleed across an internally divided pyramid required printing the entire sculpture as a single piece. Each cell needed a black core to block light from adjacent shafts, white walls to bounce illumination upward, and a frosted PLA+ shell for diffusion. Building that geometry without manual post-processing meant committing to a 1 to 3 day continuous print cycle on a Bambu Lab X1C, with 3 filament swaps on every single layer and a mountain of purge waste.</p><p>Trapped LED heat nearly killed the design during burn-in testing. I lifted the sculpture after a long run and accidentally mushed the softened grid with my thumb. Venting the back enclosure helped, but drilling holes into the frosted top shell would have ruined the display.</p><p>To keep the structure solid without sacrificing visual punch, I swapped the hardware to 12V WS2815 matrices and set a 1A current limit in WLED. Keeping the diodes over 1 cm from the surface eliminated visible hotspots while letting the grid show through the frost. The finished piece hung at Glow Lounge in Denver and ran for days at a time without warping, becoming the foundation for a fabrication process I still use.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Rapid Prototyping","Lighting Design","ESP8266","Custom Fabrication","Wire-to-Board Soldering","Pixel Mapping"],"gallery":[{"url":"media/Art/Pixel Pyramid/20230717_154810.webp","fit":{"scale":1.25,"x":0,"y":50},"thumbnail":"media/Art/Pixel Pyramid/20230717_154810-thumb.webp"},{"url":"media/Art/Pixel Pyramid/20230717_154820.webp","fit":{"scale":1.2,"x":10.1,"y":85.1},"thumbnail":"media/Art/Pixel Pyramid/20230717_154820-thumb.webp"},{"url":"media/Art/Pixel Pyramid/20230808_152320.webp","fit":{"scale":1.8,"x":32.8,"y":16},"thumbnail":"media/Art/Pixel Pyramid/20230808_152320-thumb.webp"},{"url":"media/Art/Pixel Pyramid/20230707_072443~2.mp4","poster":"media/Art/Pixel Pyramid/20230707_072443~2-poster.webp","thumbnail":"media/Art/Pixel Pyramid/20230707_072443~2-poster-thumb.webp"},{"url":"media/Art/Pixel Pyramid/20230612_131709~2.mp4","poster":"media/Art/Pixel Pyramid/20230612_131709~2-poster.webp","thumbnail":"media/Art/Pixel Pyramid/20230612_131709~2-poster-thumb.webp"},{"url":"media/Art/Pixel Pyramid/20230707_082949~2.mp4","poster":"media/Art/Pixel Pyramid/20230707_082949~2-poster.webp","thumbnail":"media/Art/Pixel Pyramid/20230707_082949~2-poster-thumb.webp"}],"files":[],"video":"","order":2,"specs":"<p><strong>Medium:</strong> PLA+ (3 material)</p><p><strong>Color:</strong> Black, White, Transparent</p><p><strong>LEDs: </strong>256 (16x16)</p><p><strong>Driver: </strong>WS2815 (RGB)</p><p><strong>Decoder:</strong> ATHOM (ESP8266)</p><p><strong>Firmware: </strong>WLED</p>","related":[],"thumbnailFit":{"scale":1.05,"x":44.2,"y":91.9},"bannerFit":{"scale":1,"x":77,"y":38.2},"thumbnail":"media/Art/Pixel Pyramid/Gemini_Generated_Image_rmmssrmmssrmmssr-thumb.webp"},{"id":"5632","title":"Pixel Mini Pyramid","category":"Sculpture","tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","ESP32","Lighting Design","Rapid Prototyping","SPI","WLED","Pixel Mapping","Wire-to-Board Soldering"],"image":"media/Art/Pixel Mini Pyramid/minipyramidfix.webp","description":"<p>An 8x8 pixel matrix desk lamp powered over 5V USB-C with a scannable QR code base.</p>","longDescription":"<p>Stepping down from my 16x16 matrix to an 8x8 desk piece meant solving a packaging problem. I modeled the Pixel Mini Pyramid in SolidWorks and Blender around an ESP32 running WLED on 5V USB-C power. The base doubles as a scannable QR code that links to my site.</p><p>Squeezing 64 LEDs into the small footprint left very little room for hardware. The USB-C port wanted to push back into the case whenever I plugged a cable in, and closing the shell kept crushing the internal wiring. It took several 3D printed iterations and test fits to anchor the controller securely and route the leads cleanly.</p><p>A short throw distance usually creates hotspots. I used a frosted diffusion layer over white cell walls to break up the light, and printed the case in 3 materials on an X1C. A few friends and family have them on their desks now, and the QR code base still scans on the first try.</p>","video":"","gallery":[{"url":"media/Art/Pixel Mini Pyramid/20230726_201532.webp","fit":{"scale":1,"x":48.9,"y":19.2},"thumbnail":"media/Art/Pixel Mini Pyramid/20230726_201532-thumb.webp"},{"url":"media/Art/Pixel Mini Pyramid/20240316_141546~2.mp4","poster":"media/Art/Pixel Mini Pyramid/20240316_141546~2-poster.webp","thumbnail":"media/Art/Pixel Mini Pyramid/20240316_141546~2-poster-thumb.webp"},{"url":"media/Art/Pixel Mini Pyramid/20240316_135358.webp","fit":{"scale":1,"x":66.6,"y":64.7},"thumbnail":"media/Art/Pixel Mini Pyramid/20240316_135358-thumb.webp"},{"url":"media/Art/Pixel Mini Pyramid/20240316_134702.webp","fit":{"scale":1.1,"x":26.9,"y":46.5},"thumbnail":"media/Art/Pixel Mini Pyramid/20240316_134702-thumb.webp"},{"url":"media/Art/Pixel Mini Pyramid/20230808_152641.webp","fit":{"scale":1,"x":48.4,"y":40.2},"thumbnail":"media/Art/Pixel Mini Pyramid/20230808_152641-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-13T00:01:33.897Z","wip":false,"order":3,"specs":"<p><strong>Medium:</strong> PLA+ (3 material)</p><p><strong>Color:</strong> Black, White, Transparent</p><p><strong>LEDs: </strong>64 (8x8)</p><p><strong>Driver: </strong>WS2813 (RGB)</p><p><strong>Decoder:</strong> ESP32-s3</p><p><strong>Firmware: </strong>WLED</p>","related":[],"thumbnailFit":{"scale":1,"x":52.5,"y":99},"bannerFit":{"scale":1,"x":19.3,"y":27.7},"thumbnail":"media/Art/Pixel Mini Pyramid/minipyramidfix-thumb.webp"},{"id":"8000","timestamp":"2026-01-13T00:04:25.482Z","title":"Pixel Plane Warp","category":"Sculpture","image":"media/Art/Pixel Plane Warp/pixelplanewarp_fix.webp","description":"<p>By combining black light-isolation walls with reflective white cell linings and frosted diffusion, this sweeping surface installation achieves sharp, vibrant patterns at low operating temperatures and current limits.</p>","longDescription":"<p>I destroyed an early print trying to push enough light into the high corner of the wave. The piece is a subdivided grid with a sweeping surface distortion that terminates in sharp points. Because the peak sits far above the LEDs, lighting the far corners required running the strips at full brightness. The trapped heat ruined the print. Plastic and hot LEDs do not get along.</p><p>I modeled the unit in SolidWorks for dimensional accuracy. A Bambu Lab X1C printed the unified model with black walls to isolate each light channel. For the final version, I lined the cells in white and added a frosted layer. That combination let me cap the WLED output on the ATHOM ESP8266 controller to a 1a limit at 12vdc without losing clarity.</p><p>It ended up on the ceiling at Glow Lounge for a while. In a dark room, the black walls disappear and leave only the distorted pattern floating overhead. The simple geometry did the work without needing to fight for brightness.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","Custom Fabrication","SPI","Rapid Prototyping","Lighting Design","ESP8266","Pixel Mapping","Wire-to-Board Soldering"],"gallery":[{"url":"media/Art/Pixel Plane Warp/pixelplanewarp_fix.webp","fit":{"scale":1,"x":45.6,"y":41.8},"thumbnail":"media/Art/Pixel Plane Warp/pixelplanewarp_fix-thumb.webp"},{"url":"media/Art/Pixel Plane Warp/IMG_20230720_092545_165.webp","thumbnail":"media/Art/Pixel Plane Warp/IMG_20230720_092545_165-thumb.webp"},{"url":"media/Art/Pixel Plane Warp/20230605_021706~3.mp4","poster":"media/Art/Pixel Plane Warp/20230605_021706~3-poster.webp","thumbnail":"media/Art/Pixel Plane Warp/20230605_021706~3-poster-thumb.webp"},{"url":"media/Art/Pixel Plane Warp/20230808_152350.webp","fit":{"scale":1,"x":87.5,"y":37.5},"thumbnail":"media/Art/Pixel Plane Warp/20230808_152350-thumb.webp"},{"url":"media/Art/Pixel Plane Warp/20230712_072919.webp","fit":{"scale":1,"x":44.3,"y":40.5},"thumbnail":"media/Art/Pixel Plane Warp/20230712_072919-thumb.webp"}],"files":[],"video":"","order":4,"specs":"<p><strong>Medium:</strong> PLA+ (3 material)</p><p><strong>Color:</strong> Black, White, Transparent</p><p><strong>LEDs: </strong>256 (16x16)</p><p><strong>Driver: </strong>WS2815 (RGB)</p><p><strong>Decoder:</strong> ATHOM (ESP8266)</p><p><strong>Firmware: </strong>WLED</p>","related":[],"thumbnailFit":{"scale":1,"x":49.4,"y":33.1},"bannerFit":{"scale":1,"x":45.2,"y":3.4},"thumbnail":"media/Art/Pixel Plane Warp/pixelplanewarp_fix-thumb.webp"},{"id":"8252","timestamp":"2026-01-13T00:14:02.780Z","title":"Temple SF","category":"Systems","image":"media/Integration/Temple SF/banner.webp","description":"<p><strong>Temple Nightclub | San Francisco</strong> - Routing a three layer club rig through an inherited lighting console to survive single operator control.</p>","longDescription":"<p>The owners at Temple San Francisco wanted 1 person to operate the lighting, video, and pixels in the main room simultaneously. That was never going to work with 2 hands, especially since we were stuck with the Road Hog 4 that came from the last rig. It lacked the routing capability to act as a central hub. Releasing a DMX overwrite on that console took a macro requiring dozens of screen presses. That cost several seconds, which meant missing the drop on any heavy track.</p><p>I bypassed the console entirely by routing Art-Net out of Resolume and the Hog into Madrix. I merged them using highest takes priority (HTP) on the RGB channels across 8 universes of sACN. That gave instant control back and forth just by blacking out 1 system. I also routed the video so a clip on the ceiling sliced across the main screens, overrode console colors, and drove the pillar pixels. Mask patterns kept the intensity in check. Behind the booth, I built a dedicated Resolume server with RAID6 SSDs to push simultaneous 4K layers, and we installed 400 A and 200 A electrical services to power the room. My crew built wireless receivers using ESP32s for the acrylic VIP tables and I installed a pixel wall on the mezzanine for matching ambiance.</p><p>I tore the pixel mapping down to the ground 6 times before I got all 3 systems talking to each other clean. The first night they fired together without tearing, I got goosebumps. But my control scheme was too ambitious. I installed a 65 in touchscreen running OSC Pilot to handle signal routing and live previews. It technically worked, but live operation under pressure is a different beast. The operators ripped the screen out after a few months and went back to MIDI controllers.</p><p>The demand for 1 operator survived for slow nights. Using a global fader for blackouts and the video routing from the ceiling, 1 person could run the whole room from a couple of controllers. But for busy nights and headlining DJs, the reality of the rig won out. They put 2 operators in the booth.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":["OSCpilot","OSC","MIDI","DMX","ArtNet","sACN","Show Cockpit","Madrix","Resolume Arena","TCP/IP","Custom Fabrication","Roadhog 4","Pixel Mapping","Video Mapping","ESP32","Power Distribution","NDI"],"gallery":[{"url":"media/Integration/Temple SF/20210621_215648.mp4","poster":"media/Integration/Temple SF/20210621_215648-poster.webp","thumbnail":"media/Integration/Temple SF/20210621_215648-poster-thumb.webp"},{"url":"media/Integration/Temple SF/20210516_190216-2.mp4","poster":"media/Integration/Temple SF/20210516_190216-poster-2.webp","thumbnail":"media/Integration/Temple SF/20210516_190216-poster-2-thumb.webp"},{"url":"media/Integration/Temple SF/20210516_195648_1.mp4","poster":"media/Integration/Temple SF/20210516_195648_1-poster.webp","thumbnail":"media/Integration/Temple SF/20210516_195648_1-poster-thumb.webp"},{"url":"media/Integration/Temple SF/20210517_114547.mp4","poster":"media/Integration/Temple SF/20210517_114547-poster.webp","thumbnail":"media/Integration/Temple SF/20210517_114547-poster-thumb.webp"},{"url":"media/Integration/Temple SF/20210517_111653.mp4","poster":"media/Integration/Temple SF/20210517_111653-poster.webp","thumbnail":"media/Integration/Temple SF/20210517_111653-poster-thumb.webp"},{"url":"media/Integration/Temple SF/20210611_131029.webp","thumbnail":"media/Integration/Temple SF/20210611_131029-thumb.webp"},{"url":"media/Integration/Temple SF/20210514_2025472.webp","thumbnail":"media/Integration/Temple SF/20210514_2025472-thumb.webp"},{"url":"media/Integration/Temple SF/20210510_141521.mp4","poster":"media/Integration/Temple SF/20210510_141521-poster.webp","thumbnail":"media/Integration/Temple SF/20210510_141521-poster-thumb.webp"},{"url":"media/Integration/Temple SF/VID_20200427_140434.mp4","poster":"media/Integration/Temple SF/VID_20200427_140434-poster.webp","thumbnail":"media/Integration/Temple SF/VID_20200427_140434-poster-thumb.webp"},{"url":"media/Integration/Temple SF/IMG_20200504_185605.webp","thumbnail":"media/Integration/Temple SF/IMG_20200504_185605-thumb.webp"},{"url":"media/Integration/Temple SF/20210625_125151.webp","thumbnail":"media/Integration/Temple SF/20210625_125151-thumb.webp"},{"url":"media/Integration/Temple SF/20210515_184126.webp","thumbnail":"media/Integration/Temple SF/20210515_184126-thumb.webp"},{"url":"media/Integration/Temple SF/20210429_122346.webp","thumbnail":"media/Integration/Temple SF/20210429_122346-thumb.webp"},{"url":"media/Integration/Temple SF/IMG_20200707_150706.webp","thumbnail":"media/Integration/Temple SF/IMG_20200707_150706-thumb.webp"}],"files":[],"video":"","order":1,"specs":"<p>Lighting Console: Roadhog 4</p><p>Video: Resolume Arena</p><p>Pixels: Madrix</p><p>DJ link: ShowKontrol</p><p>Signal Manipulation: Show Cockpit</p><p>Touch Software: OSCPilot</p>","related":[{"name":"Lighting design","url":"#project/1"},{"name":"Dancefloor pillars","url":"#project/6371"},{"name":"WiFi VIP Tables","url":"#project/496"},{"name":"VIP glass wall","url":"#project/8983"}],"thumbnail":"media/Integration/Temple SF/banner-thumb.webp"},{"id":"9517","title":"Field Solder Station","category":"Tooling","tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","Rapid Prototyping","Hand tools"],"image":"media/Fabrication/Field Solder Station/20250317_180657.webp","description":"<p>A compact solder station built to survive ladder work and crawl spaces during a nightclub remodel.</p>","longDescription":"<p>The Temple SF remodel required 80 vertical pixel strips running 4m straight up from the dance floor. 8 strips covered each pillar, which meant soldering bases at ground level or working from lifts and ladders. My bench setup was useless there. I needed a compact carrier for a TS100 iron, solder spool, flux, wick, desoldering pump, sponges, and 2 helping hands.</p><p>Early prototypes used integrated rechargeable batteries. That added too much risk, so I stripped the design down to not integrate power at all. The first field version was a rough assembly held together by tape and magnets. I iterated on it over 1 year as the remodel expanded.</p><p>I modeled the final chassis in SolidWorks and printed it in PLA on Bambu Lab printers. Precision tolerances secure the hardware through a friction fit without secondary fasteners. The helping hands are stiff enough that I have to hold the base down to bend them, but it became my main iron for pixel work.</p>","video":"","gallery":[{"url":"media/Fabrication/Field Solder Station/20250317_180657.webp","fit":{"scale":1,"x":48.8,"y":71.6},"thumbnail":"media/Fabrication/Field Solder Station/20250317_180657-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/20210202_182541.webp","thumbnail":"media/Fabrication/Field Solder Station/20210202_182541-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/20201025_014922.webp","thumbnail":"media/Fabrication/Field Solder Station/20201025_014922-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/20201015_000651.webp","thumbnail":"media/Fabrication/Field Solder Station/20201015_000651-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/20201012_144931.webp","thumbnail":"media/Fabrication/Field Solder Station/20201012_144931-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[{"name":"Field Solder Station","url":"media/Fabrication/Field Solder Station/files/fieldsolderstation.zip","description":"Zip file containing the 3mf of the field solder station. Ready to download and print."}],"featured":false,"websiteLink":"","timestamp":"2026-01-13T00:23:48.073Z","wip":false,"order":3,"specs":"<p><strong>Designed In:</strong> SolidWorks 2022</p><p><strong>Printed On:</strong> Bambu Lab X1C</p><p><strong>Material:</strong> Black PLA+</p><p><strong>Iron:</strong> TS100 (friction-fit mount)</p>","related":[],"thumbnailFit":{"scale":1,"x":51.8,"y":72.2},"bannerFit":{"scale":1,"x":49.5,"y":58},"thumbnail":"media/Fabrication/Field Solder Station/20250317_180657-thumb.webp"},{"id":"9469","title":"LED Pixel Panel","category":"Fixtures","tags":["Resolume Arena","Video Mapping","Custom Fabrication","SPI","Lighting Design"],"image":"media/Electronics/LED Pixel Panel/20200910_134441.webp","description":"<p><strong>Temple Nightclub | San Francisco</strong> - With eight feet from tile to joists and a basement ceiling gutted to the wood, we bolted custom LED dancefloor boards directly to aluminum T-track to build an array under an inch thick.</p>","longDescription":"<p>We ripped out and rerouted the fire suppression system and two layers of ceiling drywall just to buy a little breathing room. From the tile floor to the bottom of the wooden joists was exactly 8 feet, and every 1/4\" mattered. Half the joists up there were broken anyway, so I had those fixed and the others restructured to push electrical, data, and HVAC down the runs of the room in line with the pillars, leaving the center in between clear.</p><p>We needed a rigid, identical grid that could hold a diffuser at an even distance without sagging. Strips droop, and wiring them is a mess. Large, cheap rigid PCBs are a good solution, so we took LED dancefloor boards and had the manufacturer alter the pixel spacing, enlarge the mounting holes, and swap in 90-degree headers. We bolted them straight into aluminum T-track mounted to the ceiling infrastructure, compressing a 24-volt WS2818 pixel matrix into a vertical profile under an inch.</p><p>I never actually saw it powered on overhead. By the time the basement was ready for the hang, I had hit my breaking point with the remodel and walked away. I had completed the upstairs main room immersive dance lighting rig during the COVID-19 pandemic and had designed and procured the parts for the basement. I pixel-mapped the array flat across a sea of road cases in the unfinished basement, proved it worked, and handed the plans off to my crew to finish the hang.</p>","video":"","gallery":[{"url":"media/Electronics/LED Pixel Panel/20211202_171311.mp4","poster":"media/Electronics/LED Pixel Panel/20211202_171311-poster.webp","thumbnail":"media/Electronics/LED Pixel Panel/20211202_171311-poster-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20211202_171527.mp4","poster":"media/Electronics/LED Pixel Panel/20211202_171527-poster.webp","thumbnail":"media/Electronics/LED Pixel Panel/20211202_171527-poster-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20211202_171343.webp","fit":{"scale":1.5,"x":62.1,"y":68.4},"thumbnail":"media/Electronics/LED Pixel Panel/20211202_171343-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20211118_154350.webp","fit":{"scale":1.3,"x":41.6,"y":80.7},"thumbnail":"media/Electronics/LED Pixel Panel/20211118_154350-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20211118_155135.webp","fit":{"scale":1,"x":50.9,"y":77.8},"thumbnail":"media/Electronics/LED Pixel Panel/20211118_155135-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20200910_13437.webp","thumbnail":"media/Electronics/LED Pixel Panel/20200910_13437-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20200910_134533.webp","thumbnail":"media/Electronics/LED Pixel Panel/20200910_134533-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20200910_134441.webp","thumbnail":"media/Electronics/LED Pixel Panel/20200910_134441-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-13T00:48:58.329Z","wip":false,"order":7,"specs":"<p><strong>Pixels:</strong> WS2818 RGB</p><p><strong>Voltage:</strong> 24V DC</p><p><strong>Mount:</strong> Aluminum T-track · custom 90-degree headers · under 1 in profile</p><p><strong>Clearance:</strong> 8 ft tile to joist</p><p><strong>Distribution:</strong> 24-pin ATX power couplers</p>","related":[],"bannerFit":{"scale":1,"x":47.9,"y":27.7},"thumbnail":"media/Electronics/LED Pixel Panel/20200910_134441-thumb.webp"},{"id":"5416","title":"LVL","category":"Fixtures","tags":["Pixel Mapping","Madrix","Hand tools","Power tools","ArtNet","MIDI","TCP/IP","SPI","Repair","AC/DC Load Calc","Power Distribution","Lighting Design","Wire-to-Board Soldering"],"image":"media/Electronics/LVL/IMG_20191009_231844.webp","description":"<p><strong>Temple Nightclub | Denver</strong> - I salvaged 8 dead pixel runs from ruined floor channels and rewired them for 3D voxel mapping.</p>","longDescription":"<p>When I walked into LVL, the side room at Temple Denver, the lighting rig was dead or stuck on solid blue. Someone had installed unsealed channels in the floor, and the wood support strips had absorbed months of spilled drinks, mop water, and sewage backups until the diffusion caved in and shattered. Even the foam tape holding the strips smelled like club funk. The EnvironmentalLighting pixel tape itself was expensive and salvageable, so I cut out the shorted sections, scrubbed the tracks, and built new structural support out of acrylic.</p><p>Wiring 16 strip runs across a room requires heavy power injection to stop voltage drop. My first attempt was immediately unstable. I ran DC wire in parallel and tied the negative leads together back in the supply room, which wasn't sufficient and triggered ground loop flicker across part of the system. The fix was coupling the negative leads close to the pixels above the dancefloor in addition to at the power supplies. The 12V pillar modules also fought me because of undersized wire, so I added more injection points and ground jumpers between sections until the signal stabilized. The ceiling and floor ran on 24V tape and behaved once the grounds were tied overhead.</p><p>With the power and data lines stable, I mapped all 16 floor and ceiling runs plus the pillars into a 3D voxel setup. The room runs almost entirely on those pixels, so getting the hardware clean mattered. Now the control system drives spatial sweeps through the floor, pillars, and ceiling without a single drop.</p>","video":"","gallery":[{"url":"media/Electronics/LVL/VID_20181107_194547.mp4","fit":{"scale":1.1,"x":6.6,"y":25},"poster":"media/Electronics/LVL/frame-thumb-1786219096452.webp","thumbnail":"media/Electronics/LVL/frame-thumb-1786219096452-thumb.webp"},{"url":"media/Electronics/LVL/Video Project 10 (3).mp4","fit":{"scale":1.1,"x":79.2,"y":96.8},"poster":"media/Electronics/LVL/frame-thumb-1786219127360.webp","thumbnail":"media/Electronics/LVL/frame-thumb-1786219127360-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20191009_231844.webp","fit":{"scale":1,"x":48,"y":28.1},"thumbnail":"media/Electronics/LVL/IMG_20191009_231844-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20191009_231900.webp","fit":{"scale":1.1,"x":73.3,"y":32.1},"thumbnail":"media/Electronics/LVL/IMG_20191009_231900-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20181107_194215.webp","fit":{"scale":1.15,"x":100,"y":30.7},"thumbnail":"media/Electronics/LVL/IMG_20181107_194215-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180926_042731.webp","fit":{"scale":1,"x":49.1,"y":1},"thumbnail":"media/Electronics/LVL/IMG_20180926_042731-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20190723_101926.webp","fit":{"scale":1,"x":50.9,"y":78.9},"thumbnail":"media/Electronics/LVL/IMG_20190723_101926-thumb.webp"},{"url":"media/Electronics/LVL/VID_20180516_143529.mp4","poster":"media/Electronics/LVL/frame-thumb-1786219215596.webp","thumbnail":"media/Electronics/LVL/frame-thumb-1786219215596-thumb.webp"},{"url":"media/Electronics/LVL/VID_20180627_171922.mp4","fit":{"scale":1.15,"x":1.4,"y":0},"poster":"media/Electronics/LVL/VID_20180627_171922-poster.webp","thumbnail":"media/Electronics/LVL/VID_20180627_171922-poster-thumb.webp"},{"url":"media/Electronics/LVL/VID_20180925_154339.mp4","fit":{"scale":1.15,"x":52.2,"y":66.3},"poster":"media/Electronics/LVL/frame-thumb-1786219264064.webp","thumbnail":"media/Electronics/LVL/frame-thumb-1786219264064-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180926_042750.webp","fit":{"scale":1.35,"x":99.5,"y":41.6},"thumbnail":"media/Electronics/LVL/IMG_20180926_042750-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180627_171913.webp","fit":{"scale":1,"x":55.4,"y":34.1},"thumbnail":"media/Electronics/LVL/IMG_20180627_171913-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180913_155906.webp","fit":{"scale":1,"x":60.7,"y":100},"thumbnail":"media/Electronics/LVL/IMG_20180913_155906-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180912_153940.webp","fit":{"scale":1,"x":55.2,"y":99.8},"thumbnail":"media/Electronics/LVL/IMG_20180912_153940-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180913_193013.webp","fit":{"scale":1.15,"x":0,"y":57},"thumbnail":"media/Electronics/LVL/IMG_20180913_193013-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180912_113756.webp","thumbnail":"media/Electronics/LVL/IMG_20180912_113756-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180628_121319.webp","fit":{"scale":1.2,"x":83.4,"y":23.7},"thumbnail":"media/Electronics/LVL/IMG_20180628_121319-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-17T17:46:42.266Z","wip":false,"order":2,"specs":"<p><strong>Strip:</strong> EnvironmentalLighting pixel tape (salvaged)</p><p><strong>Voltage:</strong> 12V DC (pillars) · 24V DC (floor / ceiling)</p><p><strong>Runs:</strong> 16 strip runs</p><p><strong>Protocol:</strong> sACN</p><p><strong>Control:</strong> Madrix 5.x</p>","related":[],"thumbnailFit":{"scale":1,"x":0,"y":37.7},"bannerFit":{"scale":1,"x":42.1,"y":24.6},"thumbnail":"media/Electronics/LVL/IMG_20191009_231844-thumb.webp"},{"id":"4939","title":"MIRUS","category":"Lighting","tags":["AC/DC Load Calc","DMX","Custom Fabrication","Hand tools","Lighting Design","Madrix","Power Distribution","Power tools","Wire-to-Board Soldering"],"image":"media/Lighting/MIRUS/IMG_20180614_235653.webp","description":"<p><strong>Mirus Art Gallery | Denver </strong>- I wired an RGBW wash lighting system into hanging wooden baffles 12 ft above MIRUS Art Gallery.</p>","longDescription":"<p>On my first install for the company, someone else handed me a parts list and told me to build a ceiling rig at MIRUS Art Gallery in Denver. Another contracting team had already hung the wooden louvers 12 ft in the air. That meant I spent the project on a scissor lift, adhering RGBW strips into routed channels overhead. If I had chosen the materials, I would have spec'd addressable pixels for full mapping across the room. Instead, I worked with wash strips driven by Madrix Basic, keeping the entire room on 1 DMX universe.</p><p>The routed channels in the baffles ended in 90 degree corners. Forcing the LED tape around those sharp turns snapped the copper backing on my first attempt. Because they were wash strips instead of pixels, the repair was simple. I cut out the broken module at each corner and soldered jumper wires across the gap to the next copper pads.</p><p>Up in the 6 ft plenum above the ceiling, I stashed the high current supplies and DMX decoders. Each supply group controlled 16 baffles. The spec'd power units were thin and ran with loud fans, which usually spells trouble in an art space. Luckily, the gallery connected to a club room with a Funktion-One sound system, so ambient noise swallowed the fan hum.</p><p>Because the gallery walls are painted white, the saturated colors transform the space. Flip the rig from white illumination to psychedelic chases, and the whole room changes. The client loved it.</p>","video":"","gallery":[{"url":"media/Lighting/MIRUS/IMG_20180614_235653.webp","fit":{"scale":1,"x":46.8,"y":0},"thumbnail":"media/Lighting/MIRUS/IMG_20180614_235653-thumb.webp"},{"url":"media/Lighting/MIRUS/Video Project 10 (5).mp4","fit":{"scale":1.3,"x":0.3,"y":100},"poster":"media/Lighting/MIRUS/frame-thumb-1786199438087.webp","thumbnail":"media/Lighting/MIRUS/frame-thumb-1786199438087-thumb.webp"},{"url":"media/Lighting/MIRUS/IMG_20180417_174333.webp","fit":{"scale":1,"x":6.6,"y":77.1},"thumbnail":"media/Lighting/MIRUS/IMG_20180417_174333-thumb.webp"},{"url":"media/Lighting/MIRUS/IMG_20180408_233818~2.webp","fit":{"scale":1,"x":49.6,"y":81.7},"thumbnail":"media/Lighting/MIRUS/IMG_20180408_233818~2-thumb.webp"},{"url":"media/Lighting/MIRUS/IMG_20180311_221410.webp","fit":{"scale":1,"x":51.6,"y":81.4},"thumbnail":"media/Lighting/MIRUS/IMG_20180311_221410-thumb.webp"},{"url":"media/Lighting/MIRUS/IMG_20180311_221426.webp","fit":{"scale":1.25,"x":15.9,"y":28.2},"thumbnail":"media/Lighting/MIRUS/IMG_20180311_221426-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-17T17:47:45.485Z","wip":false,"order":14,"thumbnailFit":{"scale":1.2,"x":0,"y":23.8},"bannerFit":{"scale":1,"x":50.4,"y":27.4},"specs":"<p><strong>Strip:</strong> RGBW LED wash (non-addressable)</p><p><strong>Universes:</strong> 1 DMX</p><p><strong>Decoder:</strong> DMX decoders (plenum-mounted)</p><p><strong>Power:</strong> 16 baffles per supply group</p><p><strong>Control:</strong> Madrix Basic</p>","related":[],"thumbnail":"media/Lighting/MIRUS/IMG_20180614_235653-thumb.webp"},{"id":"8787","timestamp":"2026-01-17T17:49:41.986Z","title":"Inflatable Tubes","category":"Lighting","image":"media/Lighting/Inflatable Tubes/20230621_172727.webp","description":"<p><strong>Reelworks | Denver</strong> - To get eight inflatable tubes to cut through a club lighting rig, you cannot use off-the-shelf LED tape.</p>","longDescription":"<p>The centerpiece for Track's Denver Pride 2023 was a forest of eight custom inflatable tubes rigged to the ceiling beams with wire cable. To get the brightness I needed, I had custom 24V redundant-data pixel module strands made with double-sided clear lenses, then ran two 30m or 23m strands in parallel inside each tube, securing them directly to the internal fabric ties. Because running that much LED load over a single line would cause massive voltage drop, I put a power supply at both ends of every tube and severed the positive wire at the midpoint to prevent the units from back-feeding into each other. I fed and tested the guts on the floor, hoisted the tubes empty, and powered the fans and decoders once they were in the air.</p><p>During load-in and testing, the Resolume Arena control system and wireless decoders worked without a hitch. The problem started when 2,000 people walked into the room with cellphones in their pockets. The saturated RF environment completely choked the wireless signal. Data rates dropped to roughly 5fps, and the tubes repeatedly lost connection and defaulted. Luckily, I had programmed their default state to a static Pride palette, so when the signal dropped, the centerpiece stayed on theme.</p><p>The inflatables ran warm, but the double-stranded clear-lens build pushed out enough light and resolution that another local fabricator called me after the show to ask what hardware I was using. I got them through the weekend on the fallback palette, and told the venue to replace the wireless units with hardwired decoders before the next run.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Resolume Arena","Pixel Mapping","Lighting Design","AC/DC Load Calc","WLED","Custom Fabrication"],"gallery":[{"url":"media/Lighting/Inflatable Tubes/20230621_172739.webp","fit":{"scale":1,"x":54.1,"y":81.1},"thumbnail":"media/Lighting/Inflatable Tubes/20230621_172739-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230621_172749.webp","fit":{"scale":1,"x":49.8,"y":76.7},"thumbnail":"media/Lighting/Inflatable Tubes/20230621_172749-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Video Project 22 (4).mp4","fit":{"scale":1.05,"x":78.4,"y":79.7},"poster":"media/Lighting/Inflatable Tubes/frame-thumb-1786197874300.webp","thumbnail":"media/Lighting/Inflatable Tubes/frame-thumb-1786197874300-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230621_172427.mp4","fit":{"scale":1.05,"x":59.8,"y":49.7},"poster":"media/Lighting/Inflatable Tubes/frame-thumb-1786197988499.webp","thumbnail":"media/Lighting/Inflatable Tubes/frame-thumb-1786197988499-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230621_172541.mp4","fit":{"scale":1.05,"x":95.9,"y":32.7},"poster":"media/Lighting/Inflatable Tubes/frame-thumb-1786198246558.webp","thumbnail":"media/Lighting/Inflatable Tubes/frame-thumb-1786198246558-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230621_172621.mp4","fit":{"scale":1,"x":49.5,"y":22.4},"poster":"media/Lighting/Inflatable Tubes/frame-thumb-1786198333307.webp","thumbnail":"media/Lighting/Inflatable Tubes/frame-thumb-1786198333307-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_205214.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230615_205214-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230616_091904.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230616_091904-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_204414.webp","fit":{"scale":1,"x":58.2,"y":61.9},"thumbnail":"media/Lighting/Inflatable Tubes/20230615_204414-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_194557.webp","fit":{"scale":1,"x":44.6,"y":31.6},"thumbnail":"media/Lighting/Inflatable Tubes/20230615_194557-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_193318.webp","fit":{"scale":1,"x":50,"y":59.8},"thumbnail":"media/Lighting/Inflatable Tubes/20230615_193318-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_223123.webp","fit":{"scale":1,"x":47.9,"y":28.1},"thumbnail":"media/Lighting/Inflatable Tubes/20230615_223123-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230616_095821.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230616_095821-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230605_162502.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230605_162502-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_172756.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230615_172756-thumb.webp"}],"files":[],"video":"","order":2,"specs":"<p><strong>Pixels:</strong> 2100x SK6812 RGBW</p><p><strong>Strip:</strong> 8x 30m @ 5/m · 8x 23m @ 5/m · 24V DC</p><p><strong>Voltage:</strong> 24V DC</p><p><strong>Control:</strong> Resolume Arena 7.x</p>","related":[],"thumbnailFit":{"scale":1.4,"x":56.3,"y":65.5},"bannerFit":{"scale":1.4,"x":56.5,"y":69.3},"thumbnail":"media/Lighting/Inflatable Tubes/20230621_172727-thumb.webp"},{"id":"9925","title":"GeoLens Pro","category":"Software","tags":["React","TypeScript","REST APIs"],"image":"media/Apps/GeoLens Pro/Screenshot_20260118_082950_Chrome.webp","description":"<p>I built a localized browser app that automatically sorts field photos by GPS coordinate into project folders.</p>","longDescription":"<p>Doing custom lighting work around Denver meant taking quick reference photos on my phone all day. Every picture dumped into a single camera roll, and I never spent the time to sort them later. I also had loose wiring notes, drawings, and measurements that needed to stay with the right job.</p><p>To fix that, I built a browser app in React 18 and TypeScript that sorts incoming photos by GPS coordinate automatically. Using Leaflet for map boundaries and exifr to read file metadata, the app runs Haversine math against active project geofences. Photos taken inside a boundary drop straight into that project folder. Anything it misses lands in a bin for manual sorting.</p><p>For notes, I built a canvas editor to layer virtual transparencies over the photos. I could circle a part or scribble a measurement, then export a PDF report using jsPDF. Dexie handles the IndexedDB storage locally, while Supabase and Lovable manage the backend and deployment. I left contract work before running it through a full season, but the core engine did what I needed.</p>","video":"","gallery":[{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082611_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082611_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082803_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082803_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082823_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082823_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082832_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082832_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082925_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082925_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082950_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082950_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_083031_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_083031_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_083102_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_083102_Chrome-thumb.webp"}],"launchLink":"https://geo-field-snap.lovable.app","githubLink":"https://github.com/Elusid108/geo-field-snap","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-18T13:45:57.049Z","wip":true,"order":8,"specs":"<p><strong>Framework:</strong> React 18</p><p><strong>Language:</strong> TypeScript</p><p><strong>Build:</strong> Vite (SWC)</p><p><strong>Styling:</strong> Tailwind CSS, Radix UI</p><p><strong>Maps:</strong> Leaflet, React-Leaflet</p><p><strong>Geo:</strong> exifr (EXIF extraction)</p><p><strong>Storage:</strong> Dexie (IndexedDB)</p><p><strong>Export:</strong> jsPDF</p><p><strong>Backend:</strong> Supabase</p><p><strong>Deploy:</strong> Lovable</p>","related":[],"thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082950_Chrome-thumb.webp"},{"id":"3991","title":"PixelForge","category":"Software","tags":["React","TypeScript","LLM Integration"],"image":"media/Apps/PixelForge/Screenshot 2026-07-25 173231.webp","description":"<p>A web workspace that uses hallucinated text prompts to break repetitive visual loops in image generation.</p>","longDescription":"<p>Standard image generators get boring fast. I built PixelForge to see what happens when a language model hallucinates an abstract, poetic foundation before any rendering starts. The frontend runs on React, TypeScript, Vite, and Tailwind CSS. It connects the Gemini API for prompt generation to the Imagen or NanoBanana API for the final render, and stores the whole session history locally in IndexedDB and LocalStorage.</p><p>Early iterations got stuck in a visual loop. The app kept generating characters in the same poses or returning to identical themes. It was accidentally feeding pieces of previous prompts into the new input context. I spent hours going back and forth with Gemini and later Cursor to isolate the client-side state and force the app to forget old generations between runs.</p><p>Even with a clean state, individual models drift toward repetitive styles over time. I added a manual model selector in the settings menu to route prompts across different versions. That switch breaks the visual convergence by letting different models interpret the same parameters, and it keeps the app functional as older models retire.</p>","video":"","gallery":[{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173332.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173332-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173246.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173246-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173231.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173231-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173207.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173207-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173147.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173147-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173126.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173126-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173111.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173111-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173100.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173100-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173040.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173040-thumb.webp"}],"launchLink":"https://elusid108.github.io/PixelForge-AI/","githubLink":"https://github.com/Elusid108/PixelForge-AI","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-18T14:24:23.784Z","wip":true,"order":2,"specs":"<p><strong>Framework:</strong> React 18</p><p><strong>Language:</strong> TypeScript</p><p><strong>Build:</strong> Vite</p><p><strong>Styling:</strong> Tailwind CSS</p><p><strong>State:</strong> Zustand</p><p><strong>AI:</strong> Google Gemini (text), Google Imagen (image)</p><p><strong>Storage:</strong> IndexedDB, localStorage</p><p><strong>Export:</strong> JSZip</p><p><strong>Deploy:</strong> GitHub Pages</p>","related":[],"thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173231-thumb.webp"},{"id":"7085","title":"Chronicle: Iterative Fiction Engine","category":"Software","tags":["React","JavaScript","LLM Integration"],"image":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182215.webp","description":"<p>I built a browser-based storytelling engine in zero-build React that generates text, illustrations, and audio entirely client-side.</p>","longDescription":"<p>I wanted an interactive storytelling game inspired by the retro aesthetic in Mr. Robot, and I wanted to host it for free on GitHub Pages. That meant zero backend and no bundlers. I started the prototype in a Gemini Canvas and kept the zero-build architecture when I moved the codebase over to GitHub, wiring React 18, ES modules, and Tailwind CSS directly through the browser. Every turn runs client-side and hits the Google Gemini API to build the narrative, 4 player choices, an illustration, and spoken audio.</p><p>The first attempts fell apart fast. Without a strict memory structure, image styles drifted after a few turns, the story got stuck in loops, and the narrative would ramble with no clear end. Keeping track of earlier events inside a growing prompt was the hardest part. I had to build a memory stack that compresses older beats into shorthand summaries while passing along the recent prose and visual reference tags.</p><p>Each turn triggers several API calls at once to generate the prose, questions, image, audio, and log updates. With heavier models, a single turn took upwards of 2 minutes to load. I switched to default models to drop the wait down to 15 to 20 seconds. It works well enough for my own playthroughs, but managing that much client-side state without a build step is painful enough that I plan to rebuild the entire engine from scratch.</p>","video":"","gallery":[{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 184721.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 184721-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 185736.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 185736-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190202.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190202-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190218.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190218-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190442.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190442-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190505.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190505-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190524.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190524-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 173338.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 173338-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181638.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181638-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181802.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181802-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181836.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181836-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182215.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182215-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182452.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182452-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182528.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182528-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182606.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182606-thumb.webp"}],"launchLink":"https://elusid108.github.io/Chronicle-AIIF/","githubLink":"https://github.com/Elusid108/Chronicle-AIIF","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-19T00:26:00.827Z","wip":true,"order":5,"specs":"<p><strong>Framework:</strong> React 18 (CDN, zero-build)</p><p><strong>Language:</strong> JavaScript (ES Modules)</p><p><strong>Styling:</strong> Tailwind CSS (CDN)</p><p><strong>AI:</strong> Google Gemini (text/image/TTS)</p><p><strong>Audio:</strong> Web Speech API (fallback)</p><p><strong>Storage:</strong> localStorage</p><p><strong>Deploy:</strong> GitHub Pages</p>","related":[],"thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182215-thumb.webp"},{"id":"6638","title":"Strata - Digital Notebook","category":"Software","tags":["React","Google Drive API"],"image":"media/Apps/Strata - Digital Notebook/Screenshot 2026-01-23 200024.webp","description":"<p>I built a serverless digital notebook that embeds Google Drive files inside a custom client-side canvas.</p>","longDescription":"<p>Flipping through dozens of Google Docs, Sheets, and Slides every day at Boston Dynamics got exhausting without a clear hierarchy to organize them. I wanted a OneNote layout with notebooks, tabs, and pages, but I refused to pay for a server. Piping everything straight through the Google Drive API and browser storage solved the hosting cost, but it meant building the engine from scratch.</p><p>To embed webpages directly into notebook pages, I built a desktop prototype to dodge iframe security blocks. The desktop build worked, but needing an installed app killed the convenience of opening a workspace on any browser. I abandoned the desktop build, accepted the iframe limitations, and pivoted back to the web application.</p><p>The browser fought back on performance. Canvas zooming stuttered, and touchscreen inputs refused to line up with SVG drawings. While I sorted out the coordinate math, sync remains a headache. Edits sometimes drop, and deleted pages occasionally resurrect themselves on reload. Strata is still an active work in progress, but the client-side layout is set.</p>","video":"","gallery":[{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-01-23 195925.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-01-23 195925-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-01-24 223430.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-01-24 223430-thumb.webp"}],"launchLink":"https://elusid108.github.io/Strata-vite/","githubLink":"https://github.com/Elusid108/Strata-vite","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-24T02:36:52.522Z","wip":true,"order":7,"specs":"<p><strong>Framework:</strong> React 19</p><p><strong>Build:</strong> Vite 7</p><p><strong>Styling:</strong> Tailwind CSS 4</p><p><strong>Editor:</strong> CodeMirror (JS/HTML/Python)</p><p><strong>Diagrams:</strong> Mermaid</p><p><strong>Maps:</strong> Leaflet</p><p><strong>Cloud:</strong> Google Drive API</p><p><strong>Storage:</strong> localStorage</p><p><strong>Deploy:</strong> GitHub Pages</p>","related":[],"thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-01-23 200024-thumb.webp"},{"id":"6962","title":"IdeaForge.AI","category":"Software","tags":["React","TypeScript","LLM Integration","Google Drive API"],"image":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 232928.webp","description":"<p>I built a multi-stage idea sifter that runs its entire backend on the Google Sheets and Drive APIs.</p>","longDescription":"<p>People like to treat early concepts like target practice. They shoot holes in an idea before it has room to breathe. I wanted a sifter that takes raw dumps of thought and builds them up without initial critique. I first prototyped the workflow in Notion and rebuilt it with Lovable and Supabase, but both meant recurring monthly subscriptions. I stripped out the cloud database entirely and wired the application directly into the Google Sheets and Google Drive APIs.</p><p>The frontend runs on React and TypeScript, with a local data layer handling offline edits and reconciliation against the spreadsheet. Users drop in raw thoughts, and a Gemini integration tags and summarizes them. When a concept shows promise, you promote it to a brainstorm. The model runs an interview to extract missing detail, then compiles an execution strategy, an expense tracker, and a structured task list.</p><p>Every user already has a Google account, so the backend infrastructure costs nothing to run. I put my custom lithophane generator, LithoLab, through the campaign pipeline to test the playbook generation. Instead of killing half-formed ideas early, the workflow pushes them into actionable phases until you can see whether they actually work.</p>","video":"","gallery":[{"url":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 232928.webp","thumbnail":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 232928-thumb.webp"},{"url":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 233034.webp","thumbnail":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 233034-thumb.webp"},{"url":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 233053.webp","thumbnail":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 233053-thumb.webp"}],"launchLink":"https://elusid108.github.io/IdeaForge-AI/","githubLink":"https://github.com/Elusid108/IdeaForge-AI","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-02-15T04:59:58.733Z","wip":true,"order":4,"specs":"<p><strong>Framework:</strong> React 18</p><p><strong>Language:</strong> TypeScript</p><p><strong>Build:</strong> Vite (SWC)</p><p><strong>Styling:</strong> Tailwind CSS, Radix UI</p><p><strong>State:</strong> Zustand</p><p><strong>AI:</strong> Google Gemini</p><p><strong>Cloud:</strong> Google Drive API, Google Sheets API</p><p><strong>Testing:</strong> Vitest</p><p><strong>Deploy:</strong> GitHub Pages</p>","related":[],"thumbnail":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 232928-thumb.webp"},{"id":"648","title":"CharGen.AI","category":"Software","tags":["React","TypeScript","LLM Integration"],"image":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174417.webp","description":"<p>I built a browser-based character engine that turns 100 attributes into structured profiles and Imagen 4.0 artwork.</p>","longDescription":"<p>I wanted to generate varied, realistic characters across human and fantasy archetypes without paying for server infrastructure or storing user data. I built the entire engine to run locally in the browser using React 18, Vite, and Zustand. The interface uses an 8 section builder with over 100 conditional attributes that adapt dynamically to species selection. Users plug in their own Google API keys, and the application coordinates Gemini 2.5 Flash for text generation and Imagen 4.0 for visual synthesis, saving complex JSON objects and image payloads directly to IndexedDB.</p><p>I started the build in Gemini Canvas, but the app rotted once the single file hit 1000 lines of code. Options disappeared, previous settings reverted, and the interface broke completely. I moved the project to Cursor and GitHub to break the architecture into modular files. Once the app compiled reliably, the AI models struggled with basic logic. Without context, the randomizer picked identical stats repeatedly. The vision pipeline also fought clothing layers. When a prompt described muscle definition, the model rendered bare skin right through the shirt. I reduced that visual bleed by looping reference images back through NanoBanana to enforce outfit consistency.</p><p>The engine now operates in 2 directions. I can generate a character from scratch and lock specific parameters like species or clothing, or I can feed reference art into the vision model to extract structured physical and psychological data. It serves as a working proof of concept, and I plan to use the underlying system to drive an AI tabletop RPG generator and a random persona chat tool.</p>","video":"","gallery":[{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174417.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174417-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174050.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174050-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174702.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174702-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174709.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174709-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174717.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174717-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174725.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174725-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174647.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174647-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174641.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174641-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174635.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174635-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174607.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174607-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174504.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174504-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174752.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174752-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174744.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174744-thumb.webp"}],"launchLink":"https://elusid108.github.io/CharGen.AI/","githubLink":"https://github.com/Elusid108/CharGen.AI","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-03-22T16:37:25.240Z","wip":true,"order":6,"specs":"<p><strong>Framework:</strong> React 18</p><p><strong>Language:</strong> TypeScript</p><p><strong>Build:</strong> Vite</p><p><strong>Styling:</strong> Tailwind CSS</p><p><strong>State:</strong> Zustand</p><p><strong>AI:</strong> Google Gemini 2.5 Flash, Imagen 4.0</p><p><strong>Storage:</strong> IndexedDB</p><p><strong>Export:</strong> JSZip</p><p><strong>Deploy:</strong> GitHub Pages</p>","related":[],"thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-07-25 174417-thumb.webp"},{"id":"968","title":"LithoPalletGen","category":"Software","tags":["JavaScript"],"image":"media/Apps/LithoPalletGen/lithopalletgen1.webp","description":"<p>A zero-dependency calibration tool that averages pixel data from physical filament swatches for multi-material lithophane printing.</p>","longDescription":"<p>A sunflower field photo of my partner and me printed in CMYW left our faces covered in maroon splotches. Layer thickness kills light transmission before CMYW can produce realistic skin tones. I bought a 2nd AMS2 for extra filaments, but I still needed accurate calibration data.</p><p>My calibration template is a 4x5 grid of 25 mm squares scaling in 0.05 mm steps over a 0.15 mm white backing. I print the swatches at 100% infill, photograph them on a light panel, and upload the image. Even off an X1C, surface texture breaks a single-pixel eyedropper reading. I wrote an area-averaging sampler in vanilla JavaScript that aggregates up to 256 pixels to grab the true color of each thickness. Collapsible palette sets keep the interface readable across multiple materials.</p><p>Having zero dependencies lets me host the app free on GitHub Pages. The engine exports a HSL or hex JSON to import into LithoLab, my PIXEStl-based generator. Skin tones on the next print came out clean, and I dropped to a 0.2 mm nozzle to push the detail.</p>","video":"","gallery":[{"url":"media/Apps/LithoPalletGen/lithopalletgen2.webp","thumbnail":"media/Apps/LithoPalletGen/lithopalletgen2-thumb.webp"},{"url":"media/Apps/LithoPalletGen/lithopalletgen1.webp","thumbnail":"media/Apps/LithoPalletGen/lithopalletgen1-thumb.webp"}],"launchLink":"https://elusid108.github.io/LithoPalletGen/","githubLink":"https://github.com/Elusid108/LithoPalletGen","shopLink":"","files":[{"name":"0.05mm Calibrated pallet file","url":"media/Apps/LithoPalletGen/files/0.05mm_10layer_9 colors.json","description":"9 color calibrated .json file for LithoLab to 0.05mm layer height increments for use with a 0.2mm nozzle"},{"name":"(0.2mm) 0.05mm swatch","url":"media/Apps/LithoPalletGen/files/(0.2mm) 0.05mm swatch.zip","description":"A 2 material color swatch model to be printed with 0.2mm nozzle and 0.05mm layer height at 100% infill."}],"featured":false,"websiteLink":"","timestamp":"2026-06-11T17:19:00.407Z","wip":false,"order":3,"specs":"<p><strong>Language:</strong> Vanilla JavaScript</p><p><strong>Build:</strong> None (zero-dependency)</p><p><strong>Engine:</strong> Canvas API (pixel averaging)</p><p><strong>Storage:</strong> IndexedDB, localStorage</p><p><strong>Export:</strong> PIXEstl JSON (HSL/Hex)</p><p><strong>Deploy:</strong> GitHub Pages</p>","related":[{"name":"Color lithophane generator","url":"#project/2944"}],"thumbnail":"media/Apps/LithoPalletGen/lithopalletgen1-thumb.webp"},{"title":"Field Bench PSU","category":"Tooling","image":"media/Fabrication/Field Bench PSU/20250317_180727.webp","description":"<p>A 3D printed, portable, DC power supply built from a buck-boost converter designed for testing LED lighting installations in the field.</p>","longDescription":"<p>On-site LED pixel work always runs on 5V, 12V, or 24V DC at under 5A. I wanted to test new strips and isolate lighting sections without dragging a heavy bench supply up a ladder. A PLA+ enclosure housed a buck-boost converter, commonly fed 19V from a 100W laptop brick
