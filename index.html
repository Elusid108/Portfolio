id":"3862834b-7e45-467f-9e99-3146fd3d1026","name":"Language","qty":"","specs":"JavaScript (ES Modules)"},{"id":"03d02fed-3284-4bcc-a4bd-d91202272ffa","name":"Styling","qty":"","specs":"Tailwind CSS (CDN)"},{"id":"36ad05ca-3d49-4264-b1e7-675dbaad4db0","name":"AI","qty":"","specs":"Google Gemini (text/image/TTS)"},{"id":"c8b4972a-2c03-49ab-95a6-86bd4ce7ef03","name":"Audio","qty":"","specs":"Web Speech API (fallback)"},{"id":"3da40386-cf92-48a9-ae6b-a16dbfc67397","name":"Storage","qty":"","specs":"localStorage"},{"id":"1ba82176-8504-4dd3-9e08-1140d40be9d1","name":"Deploy","qty":"","specs":"GitHub Pages"}]}]},{"id":"6638","title":"Strata - Digital Notebook","category":"Software","tags":["React","Google Drive API"],"image":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 151928.webp","description":"<p>OneNote's notebook structure, an infinite canvas, and a code editor that runs what you write. Every file lives in your own Google Drive.</p>","longDescription":"<p>The number of files flying around at work on a normal day is overwhelming. Boston Dynamics runs on the Google ecosystem, so it was Docs, Sheets, Slides, links, and snippets of code, and I kept losing track of all of it. My system was native Drive sorting plus a bookmark folder tree, and the bookmark tree had stopped working as a system some time before I admitted it.</p><p>Strata is what I built to hold it. I took the three-tier structure of OneNote (notebooks, tabs, pages) as the skeleton, then added block pages for structure and an infinite canvas for the things that do not fit in a page. The piece I use most is a split-screen editor that runs the code you write in it, so a specialized calculator can live right next to the notes that explain it. The one wall I hit was embedding other websites. Almost every site refuses to load inside an iframe, so that became a page of shortcut links instead.</p><p>Every file stays in the user's own Google Drive. Sign in with a Google account and it is yours. It is how I keep track of my job now.</p>","video":"","gallery":[{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 151928.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 151928-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-30 170004.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-30 170004-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152921.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152921-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152122.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152122-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152531.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152531-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152046.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152046-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152022.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 152022-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 151942.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 151942-thumb.webp"}],"launchLink":"https://elusid108.github.io/Strata-vite/","githubLink":"https://github.com/Elusid108/Strata-vite","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-24T02:36:52.522Z","wip":true,"order":4,"specs":"","related":[],"thumbnail":"media/Apps/Strata - Digital Notebook/Screenshot 2026-08-22 151928-thumb.webp","thumbnailFit":{"scale":1.4,"x":0,"y":0},"bannerFit":{"scale":1,"x":46.3,"y":0},"specsData":[]},{"id":"6962","title":"IdeaForge.AI","category":"Software","tags":["React","TypeScript","LLM Integration","Google Drive API"],"image":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 232928.webp","description":"<p>Raw thoughts go in. The model interviews you about the gaps, then hands back an execution plan, a budget, and a task list.</p>","longDescription":"<p>Ideas do not survive contact with criticism, including mine. Most of them get shot down before they have enough shape to defend themselves. I built a place to hold them until they do.</p><p>Raw thoughts go in and get tagged. When one shows promise, you promote it to a brainstorm, and the model runs an interview to pull out the details you have not thought about yet. From there it compiles an execution strategy, an expense tracker, and a task list. I prototyped the workflow in Notion first, then rebuilt it on Lovable with a Supabase database. Both meant a monthly subscription for something I use a few times a week, so I stripped the cloud database out and wired the front end straight into Google Sheets and Drive, with a data layer that handles offline edits.</p><p>So far I have only run it backwards. I fed it several finished projects, LithoLab among them, to see whether the plans it produced matched what I actually did. They held up well enough that I trust it. I have not yet taken a brand-new idea through it from start to finish. That is the real test.</p>","video":"","gallery":[{"url":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 232928.webp","thumbnail":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 232928-thumb.webp"},{"url":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 233034.webp","thumbnail":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 233034-thumb.webp"},{"url":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 233053.webp","thumbnail":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 233053-thumb.webp"}],"launchLink":"https://elusid108.github.io/IdeaForge-AI/","githubLink":"https://github.com/Elusid108/IdeaForge-AI","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-02-15T04:59:58.733Z","wip":true,"order":5,"specs":"<h2>SOFTWARE &amp; STACK</h2><p><strong>Framework</strong><br><em>React 18</em></p><p><strong>Language</strong><br><em>TypeScript</em></p><p><strong>Build</strong><br><em>Vite (SWC)</em></p><p><strong>Styling</strong><br><em>Tailwind CSS • Radix UI</em></p><p><strong>State</strong><br><em>Zustand</em></p><p><strong>AI</strong><br><em>Google Gemini</em></p><p><strong>Cloud</strong><br><em>Google Drive API • Google Sheets API</em></p><p><strong>Testing</strong><br><em>Vitest</em></p><p><strong>Deploy</strong><br><em>GitHub Pages</em></p>","related":[],"thumbnail":"media/Apps/IdeaForge.AI/Screenshot 2026-02-14 232928-thumb.webp","specsData":[{"id":"72f3320b-3627-4c18-8f8b-20ec20017109","title":"SOFTWARE & STACK","items":[{"id":"237d29cb-ea01-4309-8637-1f808d52098e","name":"Framework","qty":"","specs":"React 18"},{"id":"20f02659-6acd-4895-acf6-809caf702e19","name":"Language","qty":"","specs":"TypeScript"},{"id":"4bd6ba29-4a64-4cdf-81d7-6224bf2d6626","name":"Build","qty":"","specs":"Vite (SWC)"},{"id":"0b3298b8-7fd7-4506-9973-5bd5ae94b0e9","name":"Styling","qty":"","specs":"Tailwind CSS, Radix UI"},{"id":"5d5c60af-1be7-4f77-971a-57d3bc50e060","name":"State","qty":"","specs":"Zustand"},{"id":"79a84cb5-6383-467b-bedb-ad726fae32dd","name":"AI","qty":"","specs":"Google Gemini"},{"id":"4b42e1b0-30ff-44cc-b1a0-f59c316e587a","name":"Cloud","qty":"","specs":"Google Drive API, Google Sheets API"},{"id":"015b6427-a508-4b7e-9a84-f42d7daece21","name":"Testing","qty":"","specs":"Vitest"},{"id":"1559ce3e-3b0f-4041-abe6-1bac490438d9","name":"Deploy","qty":"","specs":"GitHub Pages"}]}]},{"id":"648","title":"CharGen.AI","category":"Software","tags":["React","TypeScript","LLM Integration"],"image":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171906.webp","description":"<p>The vision model kept rendering muscle definition straight through the shirt.</p>","longDescription":"<p>The end goal is a fully generative tabletop RPG. I want a player to sit down, generate a character with as much or as little detail as they feel like putting in, and come away with a persona that is actually theirs. Character generation was the first piece I could build.</p><p>I started it in Gemini Canvas and the app rotted once the file hit a thousand lines. The interface just broke. I moved it to Cursor and split it into modules, and once it compiled, the model started fighting me on basic logic. The vision pipeline could not handle clothing layers. Describe muscle definition and it rendered bare skin straight through the shirt. I fixed the bleed by looping reference images back through the image model to enforce a consistent outfit.</p><p>It runs in two directions now. Dial in conditional attributes and it generates a structured profile with artwork, or feed it reference art and the vision model extracts the physical data. Everything saves in the browser. The next step is generating 3D models from the character art so players can print their miniatures and carry the same character into virtual play.</p>","video":"","gallery":[{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171630.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171630-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171906.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171906-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171939.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171939-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 172118.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 172118-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 172149.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 172149-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 172406.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 172406-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171609.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171609-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171600.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171600-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171552.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171552-thumb.webp"},{"url":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171525.webp","thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171525-thumb.webp"}],"launchLink":"https://elusid108.github.io/CharGen.AI/","githubLink":"https://github.com/Elusid108/CharGen.AI","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-03-22T16:37:25.240Z","wip":true,"order":8,"specs":"<h2>PLACEHOLDER</h2>","related":[],"thumbnail":"media/Apps/CharGen.AI/Screenshot 2026-08-22 171906-thumb.webp","thumbnailFit":{"scale":1.7,"x":60.6,"y":41.8},"bannerFit":{"scale":1,"x":50,"y":50},"specsData":[{"id":"5794a903-4b20-4914-a01f-301f2417dc8c","title":"Placeholder","items":[]}]},{"id":"968","title":"LithoPalletGen","category":"Software","tags":["JavaScript"],"image":"media/Apps/LithoPalletGen/lithopalletgen1.webp","description":"<p>Surface texture broke a single-pixel eyedropper, so I wrote a client-side sampler to average colors from physical filament swatches.</p>","longDescription":"<p>The sunflower field print is also why I bought a second AMS. Cyan, magenta, yellow and white kept turning our faces maroon. The layer thickness killed the light before the mix could land on anything that looked like skin. More filaments would fix it, but only if I could measure exactly what each one did at each thickness.</p><p>So I printed a grid of swatches for every filament, stepped from thin to thick, set them on a light panel, and photographed the whole thing. Reading the photo was the hard part. Printed plastic has surface texture, and a single-pixel eyedropper landed on a ridge or a valley and gave a different answer every time. I wrote an area-averaging sampler that aggregates up to 256 pixels per swatch to find the true color. Collapsible palette sets keep multiple materials straight, and the result exports as a JSON file that LithoLab reads directly.</p><p>It is vanilla JavaScript with zero dependencies and runs in the browser. It is the reason the two dozen lithophanes since the sunflower print have skin tones instead of maroon.</p>","video":"","gallery":[{"url":"media/Apps/LithoPalletGen/lithopalletgen2.webp","thumbnail":"media/Apps/LithoPalletGen/lithopalletgen2-thumb.webp"},{"url":"media/Apps/LithoPalletGen/lithopalletgen1.webp","thumbnail":"media/Apps/LithoPalletGen/lithopalletgen1-thumb.webp"}],"launchLink":"https://elusid108.github.io/LithoPalletGen/","githubLink":"https://github.com/Elusid108/LithoPalletGen","shopLink":"","files":[{"name":"0.05mm Calibrated pallet file","url":"media/Apps/LithoPalletGen/files/0.05mm_10layer_9 colors.json","description":"9 color calibrated .json file for LithoLab to 0.05mm layer height increments for use with a 0.2mm nozzle"},{"name":"(0.2mm) 0.05mm swatch","url":"media/Apps/LithoPalletGen/files/(0.2mm) 0.05mm swatch.zip","description":"A 2 material color swatch model to be printed with 0.2mm nozzle and 0.05mm layer height at 100% infill."}],"featured":false,"websiteLink":"","timestamp":"2026-06-11T17:19:00.407Z","wip":false,"order":3,"specs":"<h2>SOFTWARE &amp; STACK</h2><p><strong>Language</strong><br><em>vanilla javascript</em></p><p><strong>Build</strong><br><em>no-build</em></p><p><strong>Engine</strong><br><em>canvas API (pixel averaging)</em></p><p><strong>Storage</strong><br><em>IndexedDB • localstorage</em></p><p><strong>Export</strong><br><em>PIXEstl JSON (HSL/Hex)</em></p><p><strong>Deploy</strong><br><em>github pages</em></p>","related":[{"name":"Color lithophane generator","url":"#project/2944"}],"thumbnail":"media/Apps/LithoPalletGen/lithopalletgen1-thumb.webp","specsData":[{"id":"52c91b16-1887-4ea7-90d4-279613ff5785","title":"SOFTWARE & STACK","items":[{"id":"1345efe4-abd8-402b-829a-66a0c6421be4","name":"Language","qty":"","specs":"vanilla javascript"},{"id":"20448c07-f8e4-4462-afce-922003fde4f4","name":"Build","qty":"","specs":"no-build"},{"id":"26a3da7b-8a56-4b52-948d-c833f9f0ac0b","name":"Engine","qty":"","specs":"canvas API (pixel averaging)"},{"id":"7d3d1f40-dd06-40d8-9458-179e5a30e690","name":"Storage","qty":"","specs":"IndexedDB, localstorage"},{"id":"40f3ddbc-a04c-4249-98af-cbfad7ea2193","name":"Export","qty":"","specs":"PIXEstl JSON (HSL/Hex)"},{"id":"dccc297d-f69a-465e-bfda-15900c2a5a72","name":"Deploy","qty":"","specs":"github pages"}]}]},{"title":"Field Bench PSU","category":"Tooling","image":"media/Fabrication/Field Bench PSU/20250317_180727.webp","description":"<p>5, 12, or 24 volts off a laptop brick. It went up the ladder instead of the steel bench supply, and lasted until the voltmeter drifted.</p>","longDescription":"<p>I was testing every pixel product before it went up and re-testing segments after they were installed, and each test meant hauling a steel bench power supply up a ladder or cobbling a test rig together out of bits of the rig I was in the middle of installing. It took a long time every time, and I was doing it constantly. On-site pixel work runs on 5, 12, or 24 volts DC. That is all I needed in the air.</p><p>I built a portable supply around a buck-boost converter, printed a PLA enclosure for it, and ran it off a laptop brick. I left a direct USB-C port off the chassis because my print tolerances could not hold one cleanly. Assembling it was a fight. The banana plugs needed an awkward ring-crimp split, and threading the retaining nuts inside that footprint was miserable.</p><p>The little box replaced the bench rig completely. It came with me to Que Bueno Suerte! to check blackout pixel tubes on the mezzanine before I cut a single one. It survived a few years of site work until the voltage meter drifted and I retired it.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","Power Distribution","Rapid Prototyping"],"gallery":[{"url":"media/Fabrication/Field Bench PSU/20250317_180727.webp","fit":{"scale":1,"x":55.2,"y":40.8},"thumbnail":"media/Fabrication/Field Bench PSU/20250317_180727-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20210309_094910.webp","thumbnail":"media/Fabrication/Field Bench PSU/20210309_094910-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20210308_074801.webp","fit":{"scale":1.2,"x":93,"y":51.9},"thumbnail":"media/Fabrication/Field Bench PSU/20210308_074801-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20210114_091708.webp","thumbnail":"media/Fabrication/Field Bench PSU/20210114_091708-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20201214_013734.webp","thumbnail":"media/Fabrication/Field Bench PSU/20201214_013734-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20201214_012422.webp","thumbnail":"media/Fabrication/Field Bench PSU/20201214_012422-thumb.webp"}],"files":[{"name":"Field Bench PSU","url":"media/Fabrication/Field Bench PSU/files/fieldbenchpsu.zip","description":"Download, print, and assemble the Field Bench PSU. Zip file containing 3mf."}],"video":"","timestamp":"2026-06-21T22:41:13.337Z","id":"707","order":2,"specs":"<h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>BambuLabs • X1C • | • TenLog • TL-D3</em></p><p><strong>Black PLA+</strong><br><em>Duramic • 1.75mm</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>SolidWorks 2022</strong></p>","related":[],"thumbnailFit":{"scale":1.15,"x":2.2,"y":42.1},"bannerFit":{"scale":1.4,"x":28.2,"y":41.4},"thumbnail":"media/Fabrication/Field Bench PSU/20250317_180727-thumb.webp","specsData":[{"id":"c2777f80-b44c-4416-961c-5c0ff226c28f","title":"FABRICATION & MATERIALS","items":[{"id":"c19cdf65-3798-47d6-ad25-0d85f1287c70","name":"3D Printer","qty":"","specs":"BambuLabs, X1C, |,TenLog, TL-D3"},{"id":"01f8d859-cd60-4be7-9458-d8e1cbe15137","name":"Black PLA+","qty":"","specs":"Duramic, 1.75mm"}]},{"id":"b2906ebc-8158-4f03-a625-51187ed79337","title":"SOFTWARE & STACK","items":[{"id":"5a669bbc-ae76-462b-9a1b-fd39abc0923e","name":"SolidWorks 2022","qty":"","specs":""}]}]},{"title":"Club Lexi","category":"Lighting","image":"media/Lighting/Club Lexi/20230508_171150.webp","description":"<p>Ten-foot basement ceiling, 64 fixtures, no truss. Then I handed the DJs live control and watched them find every weak point.</p>","longDescription":"<p>Club Lexi is a basement trapped under a ceiling just short of ten feet. If I used standard box truss, patrons would be hitting their heads on the moving lights. I hung the entire lighting system from strut channel anchored straight through the drywall into the joists. Working flush against a ceiling leaves zero room to hide a mess. Everything is exposed. I laid out the fixtures in straight lines so I could bundle the cables into tight runs.</p><p>An electrician dropped power on dedicated switches, letting the venue kill half the rig early in the night without touching the software. I packed 64 fixtures into the space. I programmed the presets alone on the dance floor with the music blasting. Putting moving heads right above people means watching every inch of clearance. My rule was to never have all fixture types on at the same time. Firing everything at once in a room that low was blinding and unpleasant.</p><p>The venue operates without a technician, so a Wolfmix controller sat in the booth for the DJs. Handing them live control immediately exposed the weak points. They dragged fade times to a crawl and assumed the rig was broken when the lights stopped moving. They also mashed the strobe button until the room was unreadable. I locked the hazer to a low-output toggle, built pre-programmed looks to enforce my lighting rules, and set up a hard reset so they could not trap the program.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Capture","Hand tools","Lighting Design","Power tools","DMX","Power Distribution"],"gallery":[{"url":"media/Lighting/Club Lexi/Club Lexi Comp.mp4","fit":{"scale":1.25,"x":0,"y":0},"poster":"media/Lighting/Club Lexi/frame-thumb-1786199105703.webp","thumbnail":"media/Lighting/Club Lexi/frame-thumb-1786199105703-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230508_171150.webp","fit":{"scale":1.1,"x":70.6,"y":35.8},"thumbnail":"media/Lighting/Club Lexi/20230508_171150-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230508_163509~2.webp","fit":{"scale":1,"x":51.4,"y":59.7},"thumbnail":"media/Lighting/Club Lexi/20230508_163509~2-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230508_144750.webp","fit":{"scale":1,"x":50,"y":81.1},"thumbnail":"media/Lighting/Club Lexi/20230508_144750-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230509_182124.webp","fit":{"scale":1.65,"x":53.6,"y":89.4},"thumbnail":"media/Lighting/Club Lexi/20230509_182124-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230509_100642.webp","fit":{"scale":1.1,"x":49.6,"y":44.8},"thumbnail":"media/Lighting/Club Lexi/20230509_100642-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230502_170747.webp","thumbnail":"media/Lighting/Club Lexi/20230502_170747-thumb.webp"},{"url":"media/Lighting/Club Lexi/IMG_20230502_160224_412.webp","thumbnail":"media/Lighting/Club Lexi/IMG_20230502_160224_412-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230413_155003.webp","fit":{"scale":1,"x":50.2,"y":31.3},"thumbnail":"media/Lighting/Club Lexi/20230413_155003-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230502_134524.webp","thumbnail":"media/Lighting/Club Lexi/20230502_134524-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230502_224801.mp4","poster":"media/Lighting/Club Lexi/20230502_224801-poster.webp","thumbnail":"media/Lighting/Club Lexi/20230502_224801-poster-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T22:45:09.610Z","id":"6350","order":9,"specs":"<h2>FIXTURES &amp; FX</h2>< n the hoist.</p>","longDescription":"<p>The original installer walked off the job and left the frame in two halves. Nobody sells an 8-foot aluminum orb built to hold a 3D pixel array, so finishing it was the only option. One dome was covered in taped-over pixel modules and black spray paint. I stripped the mess and started over.</p><p>Keeping the power supplies in the ceiling left empty space inside the frame for the visual effect, but it meant pushing DC power across a 35-foot run. To beat the voltage drop, I installed supplies with remote sense to adjust output voltage in real time.</p><p>The whole rig hung from a hoist. Moving heavy copper without snagging required a PVC pipe flange mounted through the center. I spiral-wrapped welding cables and fed them down through the pipe. That guide kept the cables clean and stopped the sphere from spinning as it dropped to the dance floor every night.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":["Power Distribution","ArtNet","AC/DC Load Calc","Pixel Mapping","SPI","Madrix","Hand tools","TCP/IP","Custom Fabrication","Lighting Design"],"gallery":[{"url":"media/Electronics/The Orb/IMG_20190105_011459.webp","fit":{"scale":1.35,"x":0,"y":52.3},"thumbnail":"media/Electronics/The Orb/IMG_20190105_011459-thumb.webp"},{"url":"media/Electronics/The Orb/MVIMG_20190309_005437.webp","fit":{"scale":1.25,"x":35.9,"y":51.8},"thumbnail":"media/Electronics/The Orb/MVIMG_20190309_005437-thumb.webp"},{"url":"media/Electronics/The Orb/MVIMG_20190203_004035.webp","fit":{"scale":1.3,"x":0,"y":62.7},"thumbnail":"media/Electronics/The Orb/MVIMG_20190203_004035-thumb.webp"},{"url":"media/Electronics/The Orb/Video Project 10 (1).mp4","poster":"media/Electronics/The Orb/Video Project 10 (1)-poster.webp","thumbnail":"media/Electronics/The Orb/Video Project 10 (1)-poster-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181229_194431.webp","fit":{"scale":1,"x":48.4,"y":20.2},"thumbnail":"media/Electronics/The Orb/IMG_20181229_194431-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181228_174028.webp","fit":{"scale":1,"x":41.2,"y":40.8},"thumbnail":"media/Electronics/The Orb/IMG_20181228_174028-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181230_145358.webp","fit":{"scale":1,"x":93,"y":32.3},"thumbnail":"media/Electronics/The Orb/IMG_20181230_145358-thumb.webp"},{"url":"media/Electronics/The Orb/MVIMG_20190912_124434.webp","fit":{"scale":1.05,"x":27.5,"y":74.2},"thumbnail":"media/Electronics/The Orb/MVIMG_20190912_124434-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181228_171913.webp","fit":{"scale":1,"x":45.9,"y":38.6},"thumbnail":"media/Electronics/The Orb/IMG_20181228_171913-thumb.webp"},{"url":"media/Electronics/The Orb/Video Project 10 (2).mp4","poster":"media/Electronics/The Orb/Video Project 10 (2)-poster.webp","thumbnail":"media/Electronics/The Orb/Video Project 10 (2)-poster-thumb.webp"},{"url":"media/Electronics/The Orb/VID_20181223_161426.mp4","poster":"media/Electronics/The Orb/VID_20181223_161426-poster.webp","thumbnail":"media/Electronics/The Orb/VID_20181223_161426-poster-thumb.webp"},{"url":"media/Electronics/The Orb/ORB2.webp","fit":{"scale":1.1,"x":47.4,"y":58.5},"thumbnail":"media/Electronics/The Orb/ORB2-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181211_233714.webp","fit":{"scale":1.25,"x":76,"y":45.9},"thumbnail":"media/Electronics/The Orb/IMG_20181211_233714-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181211_203336.webp","fit":{"scale":1.25,"x":68.1,"y":42.9},"thumbnail":"media/Electronics/The Orb/IMG_20181211_203336-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181218_194230.webp","fit":{"scale":1,"x":52,"y":58.9},"thumbnail":"media/Electronics/The Orb/IMG_20181218_194230-thumb.webp"},{"url":"media/Electronics/The Orb/IMG-20181222-WA0000.webp","fit":{"scale":1.45,"x":49.8,"y":38.8},"thumbnail":"media/Electronics/The Orb/IMG-20181222-WA0000-thumb.webp"}],"files":[],"video":"","order":1,"specs":"","related":[{"name":"Control system","url":"#project/4382"}],"thumbnailFit":{"scale":1.55,"x":5.4,"y":37.1},"bannerFit":{"scale":1.2,"x":49.8,"y":29.8},"thumbnail":"media/Electronics/The Orb/MVIMG_20190303_010156_1 (1)-thumb.webp","specsData":[]},{"title":"The Basement","category":"Lighting","image":"media/Lighting/The Basement/IMG_20180614_174327.webp","description":"<p>I really don't like looking straight at a light source. Sixty-two slats, four inches under bare concrete, every strand aimed up.</p>","longDescription":"<p>The basement at Triangle had a concrete ceiling at 10ft high. I despise looking directly at bare light sources. Instead of covering an overhead array in standard diffusion, I decided to bounce the light. A carpenter hung 62 slats under the concrete, leaving a four-inch gap. I mounted a 20-pixel strand on top of each slat, pointing straight up.</p><p>I prepped the strands on the ground and wired them as the carpenter worked. I also hung moving lights in the remaining space. That meant rotary-hammering strut channel directly into the ceiling. You get really good at working one-handed when you have to balance on a ladder, hold a fifteen-pound fixture, and thread a bolt. During testing, a loose connection caused the ground to drop and the pixels to flicker. I had zip-tied the wiring tight. With only four inches of clearance, I couldn't squeeze my hands in to pull the cables down. I had to pry the slats back off the ceiling to fix the joints.</p><p>I isolated the power supplies in an adjacent room. I didn't know fanless supplies existed then, but the quiet room made programming easier. When the rig ran, you never saw a source. The reflected wash bled through the gaps and filled the negative space. It took fluid and fire effects perfectly, and hiding the hardware kept a low room from feeling crowded.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","DMX","Hand tools","Lighting Design","Pixel Mapping","MIDI","Power tools","Power Distribution","Resolume Arena","SPI","TCP/IP","Video Mapping"],"gallery":[{"url":"media/Lighting/The Basement/IMG_20180614_174327.webp","fit":{"scale":1,"x":50,"y":70},"thumbnail":"media/Lighting/The Basement/IMG_20180614_174327-thumb.webp"},{"url":"media/Lighting/The Basement/VID_20180708_050000.mp4","fit":{"scale":1.15,"x":100,"y":31.1},"poster":"media/Lighting/The Basement/frame-thumb-1788013946540.webp","thumbnail":"media/Lighting/The Basement/frame-thumb-1788013946540-thumb.webp"},{"url":"media/Lighting/The Basement/VID_20180612_163951 (1).mp4","fit":{"scale":1.2,"x":15.4,"y":100},"poster":"media/Lighting/The Basement/frame-thumb-1786199373574.webp","thumbnail":"media/Lighting/The Basement/frame-thumb-1786199373574-thumb.webp"},{"url":"media/Lighting/The Basement/IMG_20180605_151314.webp","fit":{"scale":1,"x":57.2,"y":46.7},"thumbnail":"media/Lighting/The Basement/IMG_20180605_151314-thumb.webp"},{"url":"media/Lighting/The Basement/IMG_20180610_214856.webp","fit":{"scale":1.3,"x":35.7,"y":39.1},"thumbnail":"media/Lighting/The Basement/IMG_20180610_214856-thumb.webp"},{"url":"media/Lighting/The Basement/IMG_20180611_005701.webp","thumbnail":"media/Lighting/The Basement/IMG_20180611_005701-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T22:55:23.650Z","id":"5045","order":12,"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>Intimidator Spot 255 IRC (x6)</strong><br><em>Chauvet • profile • 60w white • 15° • 8 colors + white • 7 rotating gobos + open</em></p><p><strong>Generic UV LED (x6)</strong><br><em>dmx</em></p><p><strong>Wood Slats (x62)</strong><br><em>20px</em></p><p><strong>Drink Rails (x3)</strong><br><em>frost diffusion</em></p><h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixel Modules (x1500)</strong><br><em>WS2801 • RGB • 12Vdc</em></p><p><strong>LED Video Panels (x21)</strong><br><em>480mm x 480mm • 192 x 192 • 2.5P</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supplies (x5)</strong><br><em>MEAN WELL • 12Vdc</em></p><p><strong>Pixel Decoder (x1)</strong><br><em>Advatek • Pixlite 16 Long Range MKII</em></p><p><strong>Pixel Receiver (x5)</strong><br><em>Advatek • PixLite Long Range Receiver</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>Pixel Control</strong><br><em>LightJams</em></p><p><strong>Video Control</strong><br><em>Resolume Arena</em></p>","related":[],"thumbnailFit":{"scale":1,"x":52,"y":68.9},"bannerFit":{"scale":1,"x":50,"y":66.9},"thumbnail":"media/Lighting/The Basement/IMG_20180614_174327-thumb.webp","specsData":[{"id":"114f5c4f-a433-4128-815d-4ea6e76610f8","title":"FIXTURES & FX","items":[{"id":"c9d0f12b-2e40-4d6d-b059-d5d7d80d1774","name":"Intimidator Spot 255 IRC","qty":"6","specs":"Chauvet, profile, 60w white, 15°, 8 colors + white, 7 rotating gobos + open"},{"id":"47a5b4ce-4a3f-4d56-a996-e1237c567f57","name":"Generic UV LED","qty":"6","specs":"dmx"},{"id":"01969051-9360-4e98-a959-e6bac6cfff79","name":"Wood Slats","qty":"62","specs":"20px"},{"id":"6fe88cd8-d93c-4c1f-a976-e55e5475ed5b","name":"Drink Rails","qty":"3","specs":"frost diffusion"}]},{"id":"16544ad9-26af-4183-a62c-23aae8b2eeeb","title":"PIXELS & DISPLAY","items":[{"id":"b37e0c87-8100-444b-86e4-e12854f769d4","name":"LED Pixel Modules","qty":"1500","specs":"WS2801, RGB, 12Vdc"},{"id":"b91e2226-db50-417c-a487-877f8cc27e5b","name":"LED Video Panels","qty":"21","specs":"480mm x 480mm, 192 x 192, 2.5P, "}]},{"id":"a1a880c8-c45c-4ba7-bfb7-7a7f01ef8c72","title":"POWER & DISTRIBUTION","items":[{"id":"41bddce4-975c-4919-9883-c92b48aea027","name":"Power Supplies","qty":"5","specs":"MEAN WELL • 12Vdc "},{"id":"a33ca46a-82d3-411b-9491-2ab1bc97bc93","name":"Pixel Decoder","qty":"1","specs":"Advatek, Pixlite 16 Long Range MKII"},{"id":"829f0a75-82fb-4812-bc35-7b6c6f8cf703","name":"Pixel Receiver","qty":"5","specs":"Advatek, PixLite Long Range Receiver"}]},{"id":"5368c1be-093d-4196-83ac-b87001c5014c","title":"Software & stack","items":[{"id":"aa2ba3a4-2d3d-48cc-8002-c1cb3c2fe570","name":"Pixel Control","qty":"","specs":"LightJams"},{"id":"e327b0be-c204-45ed-ab02-13c76dfa3c19","name":"Video Control","qty":"","specs":"Resolume Arena"}]}]},{"title":"Que Bueno Suerte!","category":"Systems","image":"media/Integration/Que Bueno Suerte!/20240606_211259.webp","description":"<p>Eleven rigs, two floors, one rack. The old software could not fade the mezzanine without moving the whole building.</p>","longDescription":"<p>The first version ran on ELM on an upstairs server, and it simply could not hand the complex lighting presets I was looking for.</p><p>The wiring came first. I ran long-range decoders back to a single rack in the office, and the cable went wherever it had to: under bars, behind walls, above the kitchen ceiling. Retrofitting the big acrylic etchings meant climbing over dining tables while the old adhesive exploded into a fine powder that turned sticky again the second I started sweating. For control, I built an iPad remote with OSCpilot for the touch interface and Show Cockpit to distribute the signal.</p><p>The first version of that remote gave the staff too much. Speed, color shifting, individual clip selection, cross-fading. What I learned is that when something does not respond the way a person expects, they push every fader to maximum or minimum. A rig this size in a packed dining room also breaks in predictable ways. Controllers drop data and need a breaker flipped. Wireless fixtures lose signal through a dense crowd. So I locked the iPad down to a few preset playlists the bartenders could not get lost in, and I put a slide-out KVM in the rack so I could fix the routing myself.</p><p>Switching the core to Madrix is what finally made it one show. The test was standing in the dining room and watching a slow color shift start at the alabaster bar top, climb the bottle shelves, and roll across the roof liners without a seam.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"t de3-0987aa687791","name":"Epoxy Wedges","qty":"","specs":""},{"id":"0f3a4c37-0a89-4f45-ab6c-3ab6e6650801","name":"Patio Lighting","qty":"","specs":""}]},{"id":"14cbca74-b0bf-4874-b9ba-991186b6aec7","title":"PIXELS & DISPLAY","items":[{"id":"8b56bf63-3ebe-4c42-a986-31ea078279a7","name":"LED Pixels","qty":"22800","specs":"WS2814, WS2815, SK6812"}]},{"id":"0c20cbe3-2d9c-4364-8e79-2e1ea5d8f758","title":"Compute & Control","items":[{"id":"b95d7312-7691-40e0-814b-60c54b9c0d23","name":"Custom PC","qty":"","specs":"rackmount, RTX 2080 TI, slide-out KVM"},{"id":"f2019ae8-1192-43e4-a5cb-e52073b96b7d","name":"iPad Remote","qty":"","specs":"OSC/Pilot, custom touch control"}]},{"id":"ee90beae-349e-4f5d-8169-99decd011ba4","title":"POWER & DISTRIBUTION","items":[{"id":"b74c9a02-a969-4595-a287-c58e53f52165","name":"Advatek PixLite 16 MK2","qty":"6","specs":"Bar Tubes"},{"id":"b68b4783-1213-44f5-935a-52eec530294b","name":"Athom WLED Decoders","qty":"","specs":"Acrylic Etchings"},{"id":"aafecc15-9f14-4ea3-91b9-e860be470bd3","name":"Advatek T8-S MK3","qty":"2","specs":"Alabaster Bar Top, Bar Kicker, Backsplash, Curved Bottle Display, Epoxy Wedges, Pyramid, Blackout Tubes, Mezzanine Tubes, Patio Lights, Roof-Line"},{"id":"1ae6fcc4-b061-4f48-a583-33bf8e3e57c8","name":"Advatek T4-DS","qty":"11","specs":"Alabaster Bar Top, Bar Kicker, Backsplash, Curved Bottle Display, Epoxy Wedges, Pyramid, Blackout Tubes, Mezzanine Tubes, Roof-Line"}]}]},{"title":"Bar Tubes","category":"Fixtures","image":"media/Electronics/Bar Tubes/20240619_122306.webp","description":"<p>393 recycled fluorescent tubes, hung in threes, all brittle. A ladder on a flexing ceiling grid is a strong argument for backup data lines.</p>","longDescription":"<p>The array over the main bar was 393 recycled fluorescent tubes hung in clusters of three. They came with the building and needed serious help. The materials were brittle. If I wasn't locked into saving the original bundles, I would have used plastic tubes and found a better way to hang them.</p><p>Because the restaurant was open every day, I could only pull down a few clusters at a time. I stood on a telescoping ladder resting on the ceiling grid, which flexed just enough to make every climb interesting. I lowered the clusters, broke the old wraps, and pulled the dead strip from the center. I swapped the tape for WS2813 LEDs. The backup data line meant a single failed pixel wouldn't force another ladder climb. Up in the power boxes, I gutted the undocumented decoders and wired in Advatek PixLite 16 MK2s. When I first fired the rig up, the current blew the inline fuses. I bumped the fuses to seven amps per tube, and the rig stabilized.</p><p>Keeping the original pixel density meant the display needed 70 universes to run. I built a 3D voxel map of the layout to push effects through the depth of the room. The tubes hang at uneven lengths, but the rebuilt bundles survived the daily grind of an open bar, and the backup data lines kept me off that flexing ceiling grid.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Madrix","ELM","TCP/IP","Pixel Mapping","SPI","Repair","Wire-to-Board Soldering","AC/DC Load Calc","Lighting Design","Power Distribution","Hand tools"],"gallery":[{"url":"media/Electronics/Bar Tubes/20240619_122306.webp","thumbnail":"media/Electronics/Bar Tubes/20240619_122306-thumb.webp"},{"url":"media/Electronics/Bar Tubes/Video Project 18 (1).mp4","poster":"media/Electronics/Bar Tubes/Video Project 18 (1)-poster.webp","thumbnail":"media/Electronics/Bar Tubes/Video Project 18 (1)-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/20241029_100945.mp4","poster":"media/Electronics/Bar Tubes/20241029_100945-poster.webp","thumbnail":"media/Electronics/Bar Tubes/20241029_100945-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/20241029_101122.mp4","poster":"media/Electronics/Bar Tubes/20241029_101122-poster.webp","thumbnail":"media/Electronics/Bar Tubes/20241029_101122-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/20241028_103756.mp4","poster":"media/Electronics/Bar Tubes/20241028_103756-poster.webp","thumbnail":"media/Electronics/Bar Tubes/20241028_103756-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/20241029_103556.mp4","poster":"media/Electronics/Bar Tubes/20241029_103556-poster.webp","thumbnail":"media/Electronics/Bar Tubes/20241029_103556-poster-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T23:30:44.785Z","id":"4411","order":5,"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>Short Tubes (x62)</strong><br><em>4ft • 60px</em></p><p><strong>Long tubes (x69)</strong><br><em>8ft • 120px</em></p><h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x11880)</strong><br><em>198m • WS281x • RGB 60px/m • 5Vdc</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supplies (x6)</strong><br><em>5Vdc</em></p><p><strong>Pixel Decoder (x6)</strong><br><em>Advatek • PixLite 16 MK12</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>Pixel Control</strong><br><em>Madrix 5.x</em></p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Bar Backsplash","url":"#project/7026"},{"name":"Alabaster Bar Top","url":"#project/9525"},{"name":"Bar Kicker","url":"#project/468"}],"thumbnailFit":{"scale":1.1,"x":33.8,"y":9.4},"bannerFit":{"scale":1.2,"x":30.8,"y":41},"thumbnail":"media/Electronics/Bar Tubes/20240619_122306-thumb.webp","specsData":[{"id":"a4d6fc6a-1532-4804-ab76-e090dcae0e0b","title":"FIXTURES & FX","items":[{"id":"444b756a-55a5-40de-aade-2fea8f3dc959","name":"Short Tubes","qty":"62","specs":"4ft, 60px"},{"id":"39011a65-8dd8-48df-9de5-e9b885508ef8","name":"Long tubes","qty":"69","specs":"8ft, 120px"}]},{"id":"fc41dba2-3261-4fc1-98d5-bf6f5e7b42b7","title":"Pixels & display","items":[{"id":"5807c140-15a7-4338-a938-ab0fe932d253","name":"LED Pixels","qty":"11880","specs":"198m, WS281x, RGB 60px/m, 5Vdc, "}]},{"id":"cbeb5929-df93-45b5-ba4c-28381c5a6345","title":"power & distribution","items":[{"id":"3ac185c7-4743-4103-9d06-7c1be8fbf11d","name":"Power Supplies","qty":"6","specs":"5Vdc, "},{"id":"5c16bebd-8873-4c71-8536-dfb03b8c3bc7","name":"Pixel Decoder","qty":"6","specs":"Advatek, PixLite 16 MK12"}]},{"id":"d1e65ded-6d58-4ff8-a09d-89cec905140d","title":"Software & stack","items":[{"id":"3cc40cfe-6d5a-4d3f-bb83-8bb4f2aa4fc7","name":"Pixel Control","qty":"","specs":"Madrix 5.x"}]}]},{"title":"Negative \"X\"","category":"Art","image":"media/Art/Negative _X_/negative x fix.webp","description":"<p>Blocking each cell's center turns 256 pixels into 1,024 converging arrows. It also still catches the print head.</p>","longDescription":"<p>A gobo is a stencil you drop in front of a stage light to shape the beam. I wanted the pixel equivalent. So instead of an open cell over each LED, I modeled 256 cells with a solid X standing in the middle of every one. Off, the piece is a plain square. On, the X blocks the center of each light and a single square pixel becomes four arrows converging on a point. Run a fluid pattern across it and all those identical obstructions go fuzzy and ripply at once.</p><p>It is the piece that fights me. The first print failed when the nozzle dragged across the X pattern and shifted the layers. Printing the face against the build plate helped but never made it reliable. Even on the X1C, the wall thickness inside the X shapes still catches the print head on some runs. When one does finish, a one-millimeter PLA face gives enough diffusion without bleeding between cells, and a current cap in the controller keeps the all-plastic frame from warping under its own heat.</p><p>A good copy hung at Glow Lounge for several months.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Rapid Prototyping","Custom Fabrication","ESP8266","Lighting Design","Pixel Mapping","Wire-to-Board Soldering"],"gallery":[{"url":"media/Art/Negative _X_/20230613_172255~2.mp4","fit":{"scale":1.1,"x":57.6,"y":31.8},"poster":"media/Art/Negative _X_/frame-thumb-1787096994245.webp","thumbnail":"media/Art/Negative _X_/frame-thumb-1787096994245-thumb.webp"},{"url":"media/Art/Negative _X_/20230717_155724.webp","thumbnail":"media/Art/Negative _X_/20230717_155724-thumb.webp"},{"url":"media/Art/Negative _X_/20230717_155731.webp","thumbnail":"media/Art/Negative _X_/20230717_155731-thumb.webp"},{"url":"media/Art/Negative _X_/20230808_152442.webp","fit":{"scale":1.4,"x":34.4,"y":24.5},"thumbnail":"media/Art/Negative _X_/20230808_152442-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-02T22:15:06.716Z","id":"2285","order":12,"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Seed of Life","url":"#project/9896"}],"thumbnailFit":{"scale":1.3,"x":50.2,"y":48.3},"bannerFit":{"scale":1,"x":59,"y":36.6},"thumbnail":"media/Art/Negative _X_/negative x fix-thumb.webp","specsData":[{"id":"97e7ac57-39a3-4c59-9e5c-ae9146df64e5","title":"Pixels & Display","items":[{"id":"38aaa760-83dd-4e21-ba5e-67529510c8fd","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"d0667795-a720-4b0e-81fa-1ecf924aba57","title":"FABRICATION & MATERIALS","items":[{"id":"7e8f9621-c5ff-4575-be81-73161b3c45d0","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"9bb5e3bb-66a6-4858-84ed-aff7788d31d7","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"549b9174-39a0-423f-b46f-3d651f4e57dd","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"ae395ebc-dfdd-48ff-9086-d08d4e38559a","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"30162bee-5793-4e79-9d79-e490e622ad2b","title":"EMBEDDED ELECTRONICS","items":[{"id":"a3ac06c2-3790-44cf-9f62-123d912588c0","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}]},{"title":"Seed of Life","category":"Art","image":"media/Art/Seed of Life/seedoflifefix.webp","description":"<p>The proof of concept for the whole series. The corners curled, the grid went soft, and it still hung at Glow Lounge for months.</p>","longDescription":"<p>Off, it is a white square. Lit in clusters, you see fragments of a pattern. The full Seed of Life only appears when every pixel is on. I built it as a proof of concept, to find out whether a subdivided matrix behind a printed face would actually read.</p><p>I printed it face down so the front came out clean, with a one-millimeter face thin enough to pass light and thick enough to hide the black walls behind it. At a ten-millimeter throw there was no need to bounce anything. What I did not account for was heat. I ran the early tests at full brightness inside a sealed enclosure, and over time the corners curled, the internal grid softened enough to move by hand, and the whole unit bowed away from the wall.</p><p>It survived, and it taught me the two things every one of these panels now has: vents in the back, and a current limit in the firmware. It hung at Glow Lounge for several months next to Negative \"X\".</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","ESP8266","WLED","SPI","Lighting Design","Rapid Prototyping","Custom Fabrication","Wire-to-Board Soldering","Pixel Mapping"],"gallery":[{"url":"media/Art/Seed of Life/20230717_155617.webp","fit":{"scale":1.15,"x":97,"y":31.8},"thumbnail":"media/Art/Seed of Life/20230717_155617-thumb.webp"},{"url":"media/Art/Seed of Life/20230717_155640.webp","fit":{"scale":1.1,"x":64.1,"y":45.5},"thumbnail":"media/Art/Seed of Life/20230717_155640-thumb.webp"},{"url":"media/Art/Seed of Life/20250303_163922.webp","fit":{"scale":1,"x":55.5,"y":62.9},"thumbnail":"media/Art/Seed of Life/20250303_163922-thumb.webp"},{"url":"media/Art/Seed of Life/20230808_152626.webp","fit":{"scale":1,"x":47.7,"y":30.6},"thumbnail":"media/Art/Seed of Life/20230808_152626-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-02T22:16:10.943Z","id":"9896","order":13,"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Zig-Zag","url":"#project/7412"}],"thumbnailFit":{"scale":1.4,"x":45.8,"y":57.9},"bannerFit":{"scale":1.55,"x":100,"y":52.3},"thumbnail":"media/Art/Seed of Life/seedoflifefix-thumb.webp","specsData":[{"id":"c09e8cbe-80f3-4012-94a1-820097354f7e","title":"Pixels & Display","items":[{"id":"8169cff4-de32-4597-9fc7-7007f63f9d2e","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"ae7e1067-d6c1-45eb-a8c4-5a1aebee6b33","title":"FABRICATION & MATERIALS","items":[{"id":"ed662cdf-4906-450b-ae2b-fc62cc0ecccb","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"6aba7472-75a3-4b6d-b6d6-3d696be62eba","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"fef27904-bf7b-40f4-bbc1-23a6b14c0f7c","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"f887781a-3456-4311-8f55-316710a0853d","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"3f040080-87a1-4ed2-a275-a1f0a4c4a261","title":"EMBEDDED ELECTRONICS","items":[{"id":"6a966bfc-7f98-44f3-9b44-32d043b50126","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}]},{"title":"Celtic Owl","category":"Art","image":"media/Art/Celtic Owl/frame-thumb-1786238531082.webp","description":"<p>My workstation crashes on any grid bigger than 16x16. Cutting 256 cells out of Celtic knotwork sat exactly at that limit.</p>","longDescription":"<p>Off, this reads as a lithophane: a white owl carved in Celtic knotwork, sitting in a black frame. Turn it on and a 16 x 16 grid of light cuts straight through the carving lines. That collision was the idea, a rigid geometric matrix living inside an organic relief.</p><p>My workstation laptop crashes if I try to compute an internal grid bigger than 16 by 16, and this piece sat right at that edge. I bought an owl model online and split the work between SolidWorks and Blender, and subtracting 256 cells out of the knotwork was about all the hardware could take. The early prints leaked light everywhere. Stopping the bleed first meant 0.8 mm walls, which took two passes of the nozzle and never came out clean. Moving the job to the X1C with an AMS solved it. A double wall of 0.4 mm black PLA+ now isolates every cell.</p><p>The owl looks like a carving until you plug it in.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Rapid Prototyping","Lighting Design","ESP8266","Custom Fabrication","Blender","Pixel Mapping","Wire-to-Board Soldering"],"gallery":[{"url":"media/Art/Celtic Owl/20240203_174318~2.mp4","poster":"media/Art/Celtic Owl/frame-thumb-1786238531082.webp","thumbnail":"media/Art/Celtic Owl/frame-thumb-1786238531082-thumb.webp"},{"url":"media/Art/Celtic Owl/20220315_175407.webp","thumbnail":"media/Art/Celtic Owl/20220315_175407-thumb.webp"},{"url":"media/Art/Celtic Owl/20220315_175356.webp","thumbnail":"media/Art/Celtic Owl/20220315_175356-thumb.webp"},{"url":"media/Art/Celtic Owl/20220315_175342.webp","thumbnail":"media/Art/Celtic Owl/20220315_175342-thumb.webp"},{"url":"media/Art/Celtic Owl/Screenshot 2026-07-02 185618.webp","thumbnail":"media/Art/Celtic Owl/Screenshot 2026-07-02 185618-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-02T23:00:41.951Z","id":"8609","order":2,"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>bounce • diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"Scream-Face","url":"#project/1829"},{"name":"Face","url":"#project/4827"},{"name":"Bubblescape","url":"#project/9191"}],"thumbnailFit":{"scale":1.25,"x":50.3,"y":33.5},"bannerFit":{"scale":1,"x":47.7,"y":31.8},"thumbnail":"media/Art/Celtic Owl/frame-thumb-1786238531082-thumb.webp","specsData":[{"id":"bee4acbf-c1c1-4218-b977-6f975b0656f0","title":"Pixels & Display","items":[{"id":"f7293f35-ecff-49ec-bac0-093104795cb3","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"c0567e65-deea-4ce2-90a4-926bd6f61f3a","title":"FABRICATION & MATERIALS","items":[{"id":"91bb9fe2-df19-46a2-b2ac-53896dae4d64","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"e4534d06-8cf3-40da-9da1-5e0b23cac134","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"5fa5fa85-c2e7-46b7-8546-f597bbbc6f05","name":"PLA+ ( White )","qty":"","specs":"bounce, diffusion"},{"id":"ba3128d4-8a5b-447a-b736-062cf2447250","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"ec251119-ebd3-453f-bd46-a2ae23a2ca4c","title":"EMBEDDED ELECTRONICS","items":[{"id":"57fff659-759e-466e-836a-f9c6fc0a6bbc","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}]},{"title":"Lobby Wall","category":"Fixtures","image":"media/Electronics/Lobby Wall/0321151647.webp","description":"<p>We spent weeks in the basement soldering five thousand joints by hand, then hung this double-sided array in five days.</p>","longDescription":"<p>I didn't know you could buy pre-made LED pixel strands. I was just figuring out that addressable pixels existed at all, and they were hard to source. Instead, I built a double-sided LED wall from scratch.</p><p>Another tech and I spent weeks in the basement building modular panels. We cut 2' x 4' pegboard sheets. We contact-cemented 8 raw LED pucks to each board. We manually soldered custom wire lengths using 4 conductor wire. We made over 5000 solder joints by hand before we ever hung a panel.</p><p>We mounted the rows of pegboard to the lobby wall and covered both sides with frosted plexiglass on standoffs. I wired each row to a SanDevices E682, which is essentially a Christmas light decoder. The initial test run was rough. The pixels flickered badly across the entire wall. I didn't know about power injection yet. I added inline resistors at the inputs to smooth out the data signal, and I retrofitted power injection later.</p><p>We had to get the modules out of the basement and onto the wall without shutting the club down. We had exactly five days between open weekends to hang the panels, wire the decoders, and map the array in Madrix. The wall was running when the doors opened that Thursday.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Custom Fabrication","Embedded Systems","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Through-Hole Soldering"],"gallery":[{"url":"media/Electronics/Lobby Wall/Trackswall3.mp4","fit":{"scale":1.35,"x":79.6,"y":54.6},"poster":"media/Electronics/Lobby Wall/frame-thumb-1786199470802.webp","thumbnail":"media/Electronics/Lobby Wall/frame-thumb-1786199470802-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Trackswall2.mp4","fit":{"scale":1.25,"x":30.3,"y":100},"poster":"media/Electronics/Lobby Wall/frame-thumb-1786199551651.webp","thumbnail":"media/Electronics/Lobby Wall/frame-thumb-1786199551651-thumb.webp"},{"url":"media/Electronics/Lobby Wall/0317152322.webp","fit":{"scale":1.25,"x":100,"y":45.8},"thumbnail":"media/Electronics/Lobby Wall/0317152322-thumb.webp"},{"url":"media/Electronics/Lobby Wall/0317152321.webp","fit":{"scale":1.35,"x":0,"y":25.4},"thumbnail":"media/Electronics/Lobby Wall/0317152321-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Trackswall1.mp4","fit":{"scale":1.4,"x":76.9,"y":100},"poster":"media/Electronics/Lobby Wall/frame-thumb-1786199579728.webp","thumbnail":"media/Electronics/Lobby Wall/frame-thumb-1786199579728-thumb.webp"},{"url":"media/Electronics/Lobby Wall/0317152050.webp","fit":{"scale":1.5,"x":25.9,"y":100},"thumbnail":"media/Electronics/Lobby Wall/0317152050-thumb.webp"},{"url":"media/Electronics/Lobby Wall/0315151546.webp","fit":{"scale":1.3,"x":23.8,"y":100},"thumbnail":"media/Electronics/Lobby Wall/0315151546-thumb.webp"},{"url":"media/Electronics/Lobby Wall/0313151634.webp","fit":{"scale":1.15,"x":100,"y":55},"thumbnail":"media/Electronics/Lobby Wall/0313151634-thumb.webp"},{"url":"media/Electronics/Lobby Wall/0312151534.webp","fit":{"scale":2.45,"x":46.9,"y":53.3},"thumbnail":"media/Electronics/Lobby Wall/0312151534-thumb.webp"},{"url":"media/Electronics/Lobby Wall/0221152259b.webp","fit":{"scale":1.3,"x":17.6,"y":11.8},"thumbnail":"media/Electronics/Lobby Wall/0221152259b-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-20T20:00:01.882Z","id":"7590","order":11,"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>Modular Panels (x65)</strong><br><em>8px • 2' x 4' • peg board</em></p><h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x520)</strong><br><em>WS2811 • 6LED/px • 12Vdc</em></p><h2>POWER &amp; DISTRIBTUION</h2><p><strong>Power Supply (x1)</strong><br><em>12Vdc</em></p><p><strong>Pixel Decoder (x1)</strong><br><em>SanDevice E682</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>Madrix 3.6</strong></p>","related":[{"name":"Tracks Discotheque ","url":"#project/3671"}],"bannerFit":{"scale":1.2,"x":66.7,"y":47.6},"thumbnail":"media/Electronics/Lobby Wall/0321151647-thumb.webp","specsData":[{"id":"3707c80c-26d6-48e6-93c6-42cba4a38bff","title":"Fixtures & FX","items":[{"id":"cbc09764-0415-48a9-832c-83e4b9a981e9","name":"Modular Panels","qty":"65","specs":"8px, 2' x 4', peg board"}]},{"id":"bc1b415b-2f6c-48c7-853d-8b9c78466ce8","title":"PIXELS & DISPLAY","items":[{"id":"37a81dda-b88e-495a-8554-442da4e96677","name":"LED Pixels","qty":"520","specs":"WS2811, 6LED/px, 12Vdc"}]},{"id":"05a5fcb0-f0ee-4c6a-8e30-2c28e1781fe5","title":"Power & Distribtuion","items":[{"id":"89f918f4-0d51-47fc-a61a-57e9ec114b92","name":"Power Supply","qty":"1","specs":"12Vdc"},{"id":"d6eb69b5-75c8-4a4b-a0b2-fa2e068797f3","name":"Pixel Decoder","qty":"1","specs":"SanDevice E682"}]},{"id":"1be9fca9-dd25-4a9d-9429-c613ab4264ee","title":"Software & Stack","items":[{"id":"727125bf-f815-49e5-96cb-8664999b3866","name":"Madrix 3.6","qty":"","specs":""}]}]},{"title":"Curved Liquor Bottle Display","category":"Lighting","image":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198604784.webp","description":"<p>I printed 96 louvered tracks with tolerances so tight a solder joint would prevent assembly.</p>","longDescription":"<p>I refused to put a diffuser over the LEDs and kill the brightness. The liquor display was an open metal grid. I wanted to hit the glass bottles from multiple angles to make them pop. To preserve the throw distance while hiding raw diodes from guests, I needed custom louvered fixtures.</p><p>I designed the tracks and ran my 3D printers for a couple of weeks to manufacture 96 units. A flat bracer slid in behind the LED strip to hold it against the plastic. The fit was so tight I had to use un-spliced sections, because a solder joint would not clear the gap. The diodes poked perfectly through the slots. I wired them all at my house, hiding a strain relief inside the end caps.</p><p>The metal frame started at hip level. I sat on a checkout table behind it and used foam tape to mount the fixtures into the corners. With nowhere to hide wiring, I wrapped the routing in black tubing and let the stiff bundle support itself across the gaps.</p><p>The array tied into the building's Madrix server. It worked cleanly until guests started abandoning drinks on the shelf. Spills dripped down and corroded the unsealed tape. Because my printed tolerances were so tight, waterproof tape would not fit as a replacement. I had to pry five fixtures off the metal and completely rebuild them. I asked management for a sign to not put drinks there.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Custom Fabrication","Pixel Mapping","Lighting Design","Madrix","SPI","sACN","Hand tools","FDM 3D Printing","ELM","AC/DC Load Calc"],"gallery":[{"url":"media/Lighting/Curved Liquor Bottle Display/Screenshot 2026-08-01 112340.webp","fit":{"scale":1.1,"x":0,"y":100},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/Screenshot 2026-08-01 112340-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/20240419_101740.webp","fit":{"scale":1.15,"x":0,"y":97.2},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/20240419_101740-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/QBS Bottle shelf 2.mp4","fit":{"scale":1.05,"x":38.2,"y":100},"poster":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198542432.webp","thumbnail":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198542432-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/QBS Bottle shelf 3.mp4","fit":{"scale":1.45,"x":77.8,"y":40.9},"poster":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198604784.webp","thumbnail":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198604784-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/QBS Bottle shelf 1.mp4","fit":{"scale":1.15,"x":6.7,"y":68.7},"poster":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198714641.webp","thumbnail":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198714641-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/20240224_083551.webp","fit":{"scale":1.2,"x":99.1,"y":14.3},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/20240224_083551-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/20240409_124553.webp","fit":{"scale":1.55,"x":65.3,"y":49.9},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/20240409_124553-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/20240403_095909.webp","fit":{"scale":1,"x":57.9,"y":55.7},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/20240403_095909-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-20T21:09:12.884Z","id":"6808","order":5,"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x1152)</strong><br><em>19.2m • WS2815 • RGB • 60px/m • 12Vdc</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supplies (x1)</strong><br><em>MEAN WELL • HLG-320H-12 • 12Vdc • 22A</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>Louver Lights (x96)</strong><br><em>custom • 3D printed • 45deg • louvers • corner fixture</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>Pixel Control</strong><br><em>Madrix 5.x</em></p>","related":[{"name":"Control system","url":"#project/4113"},{"name":"Louver lights","url":"#project/2052"}],"bannerFit":{"scale":1.05,"x":85.5,"y":47.5},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198604784-thumb.webp","thumbnailFit":{"scale":1.05,"x":53,"y":39.8},"specsData":[{"id":"17c12cf8-6551-4f47-a9ee-db122a361299","title":"Pixels & display","items":[{"id":"caa5503b-214b-4a29-adb3-4372491f11c4","name":"LED Pixels","qty":"1152","specs":"19.2m, WS2815, RGB, 60px/m, 12Vdc, "}]},{"id":"418e2640-91d7-43bc-a96c-b96a39ea011c","title":"power & distribution","items":[{"id":"eb5879d4-57ba-41e3-bb09-d61fa94795a9","name":"Power Supplies","qty":"1","specs":"MEAN WELL, HLG-320H-12,12Vdc, 22A"}]},{"id":"92e00212-9979-480a-be42-2be1188089bd","title":"Fabrication & Materials","items":[{"id":"6fa7a3ce-4d2d-4707-bbd6-d2ba4a0f7606","name":"Louver Lights","qty":"96","specs":"custom, 3D printed, 45deg, louvers, corner fixture"}]},{"id":"3a9cc267-0afc-4945-9466-4e0894fd903b","title":"Software & stack","items":[{"id":"502a45de-5065-4eb5-872b-0f54ba75309f","name":"Pixel Control","qty":"","specs":"Madrix 5.x"}]}]},{"title":"Temple Denver","category":"Systems","image":"media/Integration/Temple Denver/MVIMG_20190817_211751.webp","description":"<p>I bridged Resolume and Madrix over NDI until we could read a few words scaled across the room.</p>","longDescription":"<p>Almost every week a tour manager called to ask whether we could do something else with the video. We sent our specs out in advance, and it did not matter. The big-name DJs would show up with a touring VJ and a drive full of 4K content, and we would watch them try to figure out how to run it on three screens that were each 48 by 48 pixels. The main room's entire resolution was smaller than an app icon. It was comical, and it was also a problem I could somewhat fix.</p><p>I needed a bigger canvas without tearing out the hardware. Resolume Arena was already pushing slices of video to the converter boxes for the screens, and Madrix was driving the floor-to-ceiling frosted pixel pillars. I bridged the two machines over NDI so content could cross between them, then networked the Road Hog console to send DMX triggers to the video rig, the pillars, the orb, and the hallway computers. That gave us live master intensity and speed for the whole room from one desk.</p><p>Mapping a low-resolution mesh onto the pillars was the headache. The pixel spacing was not an even grid, so scaling an irregular shape across the walls never quite lined up. If I were starting from scratch I would run everything through Madrix. But combined, the room became one uninterrupted canvas just under 200 pixels wide. The test was text. Once we could scale a few words down and read them across the whole room, it was one show, and the touring VJs had somewhere to put their content.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["DMX","ArtNet","sACN","MIDI","Madrix","Resolume Arena","TCP/IP","Video Mapping","Pixel Mapping","NDI","SPI","Roadhog 4"],"gallery":[{"url":"media/Integration/Temple Denver/MVIMG_20190817_211751.webp","thumbnail":"media/Integration/Temple Denver/MVIMG_20190817_211751-thumb.webp"},{"url":"media/Integration/Temple Denver/VID_20190705_212851.mp4","poster":"media/Integration/Temple Denver/VID_20190705_212851-poster.webp","thumbnail":"media/Integration/Temple Denver/VID_20190705_212851-poster-thumb.webp"},{"url":"media/Integration/Temple Denver/Video Project 10 (4).mp4","poster":"media/Integration/Temple Denver/Video Project 10 (4)-poster.webp","thumbnail":"media/Integration/Temple Denver/Video Project 10 (4)-poster-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-25T16:47:23.504Z","id":"4382","order":2,"specs":"","related":[{"name":"The Orb","url":"#project/6841"},{"name":"Backboard Repair","url":"#project/3965"},{"name":"Entrance Hall","url":"#project/5650"},{"name":"LVL","url":"#project/5416"},{"name":"MIRUS","url":"#project/4939"}],"thumbnail":"media/Integration/Temple Denver/MVIMG_20190817_211751-thumb.webp","specsData":[]},{"title":"Extrusion Centering Sled","category":"Tooling","image":"media/Fabrication/Extrusion Centering Sled/20200909_213244.webp","description":"<p>One pillar with a laser level looked awful. The jig found true center on its own, and the other 160 meters took an afternoon.</p>","longDescription":"<p>I did one pillar with a laser level and it looked awful. The columns at Temple San Francisco were encased in OSB that came out wavy, so a laser gave me a straight line on a surface that was not straight, and any drift in the vertical LED track was going to mirror across ten pillars in a room full of them. I needed the extrusion to find true center on its own.</p><p>I built a four-part 3D printed sled, broken into pieces to beat my printer's build plate. The first prints refused to fit inside the aluminum channel. Once I dialed in the width, the interlocking joints held rigid. I rubbed a yellow china marker on the notched ends so I could reference the outer corner extrusions at any height without measuring.</p><p>In use, I slid the jig upward with one hand while I matched the ends to find center, and tacked the extrusion with a pneumatic nailer with the other. The 160 meters of track that had been a multi-day problem took a couple of hours. The wavy casing disappeared behind straight lines.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","Rapid Prototyping","Hand tools"],"gallery":[{"url":"media/Fabrication/Extrusion Centering Sled/20200909_213244.webp","fit":{"scale":1,"x":52.9,"y":98.7},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200909_213244-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/20200907_234532.webp","fit":{"scale":1,"x":54.8,"y":49.5},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200907_234532-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/20200909_013406.webp","fit":{"scale":1.05,"x":53.3,"y":100},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200909_013406-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/20200908_090628.webp","fit":{"scale":1,"x":50,"y":72.9},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200908_090628-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/20200907_231655.webp","fit":{"scale":1,"x":48.4,"y":81.6},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200907_231655-thumb.webp"}],"files":[],"specs":"<h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>TenLog • TL-D3</em></p><p><strong>Black PLA+</strong><br><em>Duramic • 1.75mm</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>SolidWorks 2022</strong></p>","related":[{"name":"Pixel Pillars","url":"#project/6371"}],"video":"","timestamp":"2026-07-26T23:20:01.923Z","id":"5376","order":3,"thumbnailFit":{"scale":1.05,"x":5.3,"y":1.8},"bannerFit":{"scale":1,"x":48.8,"y":41.4},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200909_213244-thumb.webp","specsData":[{"id":"eeb42c74-a961-4c8d-8a70-6196647d2935","title":"FABRICATION & MATERIALS","items":[{"id":"36d1fc9a-87fa-4102-a856-10ef5ccaa27b","name":"3D Printer","qty":"","specs":"TenLog, TL-D3"},{"id":"7b4a148e-42e2-426c-8c84-796d3bd630fd","name":"Black PLA+","qty":"","specs":"Duramic, 1.75mm"}]},{"id":"eedd62d7-6819-40f0-8d73-1c6ae9e380fc","title":"SOFTWARE & STACK","items":[{"id":"27fb98c6-878c-4da7-9e26-27c7e18fc93d","name":"SolidWorks 2022","qty":"","specs":""}]}]},{"title":"Dance Floor Pillars","category":"Fixtures","image":"media/Electronics/Dance Floor Pillars/Screenshot_20210306-180716_Photos~2.webp","description":"<p>Ten uneven columns, a hundred years old, and no drilling into structural wood. OSB, drywall mud, and weeks of sanding on a scissor lift.</p>","longDescription":"<p>I needed ten floor-to-ceiling pillars of recessed pixel tape on the dance floor. The original columns were a hundred years old and made of uneven wood. I was not going to drill into structural supports, and you cannot buy a uniform enclosure that wraps a century-old beam.</p><p>I encased the columns in OSB to build a straight box. I mounted mud-in aluminum extrusions to the wood with a pneumatic nailer, then filled the gaps with more board. I plastered everything with drywall mud. That meant spending weeks on a scissor lift with an orbital sander hooked to a shop vac. I primed the columns and painted them flat black. Firing the 320 meters of tape made it look like light was jumping straight out of the concrete.</p><p>The wiring had to survive a nightclub dance floor. I sealed the bottoms with silicone caulk and ran the base wiring through thin metal tubing to protect it from kick damage. To fight voltage drop across the four-meter strips, power injection lines hid inside the corner moldings. The pillars took the crowd abuse exactly as built.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Wire-to-Board Soldering","Video Mapping","Resolume Arena"],"gallery":[{"url":"media/Electronics/Dance Floor Pillars/20210423_185515.webp","fit":{"scale":1.25,"x":58.3,"y":44.9},"thumbnail":"media/Electronics/Dance Floor Pillars/20210423_185515-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/20210403_195111.webp","fit":{"scale":1.85,"x":70.6,"y":76.4},"thumbnail":"media/Electronics/Dance Floor Pillars/20210403_195111-thumb.webp"},{
