umb.webp"},{"url":"media/Art/Emmy Stand/Emmy-Stand-img-05eb9f.webp","fit":{"scale":1,"x":49.6,"y":59.2},"thumbnail":"media/Art/Emmy Stand/Emmy-Stand-img-05eb9f-thumb.webp"}],"files":[{"name":"Emmy stand.zip","url":"media/Art/Emmy Stand/files/Emmy stand.zip","description":"Multi‑plate .3mf with every printed part for the Emmy Stand, ready to slice and assemble. Fits 144/m WS2815 strips (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Emmy Stand/Emmy-Stand-img-f2d23f.webp","thumbnail":"media/Art/Emmy Stand/Emmy-Stand-img-f2d23f-thumb.webp","thumbnailFit":{"scale":1.35,"x":63.6,"y":65.6}}],"video":"","order":0,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x512)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • white flex pcb • 144/m • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border • base\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion • bounce\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( &quot;Transparent&quot; )\u003c/strong>\u003cbr>\u003cem>lens frost\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Wasatch Pixels Basic Eight • ESP32 • 12Vdc\u003c/em>\u003c/p>","related":[],"thumbnailFit":{"scale":1.1,"x":39.1,"y":37.1},"bannerFit":{"scale":1,"x":27.5,"y":22.6},"thumbnail":"media/Art/Emmy Stand/Emmy-Stand-img-a889ec-thumb.webp","slug":"emmy-stand","imageThumb":"media/Art/Emmy Stand/Emmy-Stand-img-a889ec-thumb.webp"},{"id":"2944","title":"LithoLab","category":"Software","tags":["LLM Integration","TypeScript","FDM 3D Printing"],"image":"media/Apps/LithoLab/LithoLab-img-f923d0.webp","description":"\u003cp>Standard CMYK generators turn skin tones into magenta splotches, so I ported an open-source color lithophane engine to the browser.\u003c/p>","longDescription":"\u003cp>The first lithophane I tried to print was a photo of my partner and me in a sunflower field. I ran it through a standard CMYK generator at least half a dozen times, and every print came back with magenta splotches across our faces. Four filaments cannot make a skin tone, and the generators only output flat rectangles anyway. Photos of couples were the whole reason I wanted to do this, so the skin tones had to be right.\u003c/p>\u003cp>I ported the open-source PIXEStl engine to run in the browser and built the interface I actually wanted around it: import a photo, overlay a custom mask so the print is not stuck as a rectangle, set the filament colors and depths, and export the files. Early prints on the X1C had a persistent micro-gap along the right edge between the image and its border. It took several failed attempts to close it. The calibration tools were cluttering the main screen, so I split them out into a companion app, LithoPalletGen, that handles the color mapping.\u003c/p>\u003cp>The sunflower photo prints correctly now. At the time of writing I have printed around two dozen lithophanes through it, all from a browser tab with nothing behind it, with extra filament colors dialed in for skin. Backlit, they match the source photos.\u003c/p>","video":"","gallery":[{"url":"media/Apps/LithoLab/LithoLab-img-f923d0.webp","caption":"The LithoLab workspace links source image manipulation directly to physical 3D print parameters. In the main canvas, users apply custom geometric masks and adjust spatial orientation, while the sidebar controls physical dimensions, border scaling, and filament palette selection. The dual-preview engine at the bottom provides immediate feedback, displaying both a palette-accurate color rendering and a surface-texture depth map to verify print accuracy before exporting.","thumbnail":"media/Apps/LithoLab/LithoLab-img-f923d0-thumb.webp"},{"url":"media/Apps/LithoLab/LithoLab-img-d37639.webp","thumbnail":"media/Apps/LithoLab/LithoLab-img-d37639-thumb.webp"},{"url":"media/Apps/LithoLab/LithoLab-img-b14435.webp","fit":{"scale":1.05,"x":48,"y":42.7},"thumbnail":"media/Apps/LithoLab/LithoLab-img-b14435-thumb.webp"},{"url":"media/Apps/LithoLab/LithoLab-img-0ef368.webp","fit":{"scale":1.15,"x":77.3,"y":60.8},"thumbnail":"media/Apps/LithoLab/LithoLab-img-0ef368-thumb.webp"}],"launchLink":"https://elusid108.github.io/LithoLab/","githubLink":"https://github.com/Elusid108/LithoLab","shopLink":"","files":[{"name":"0.05mm Calibrated pallet file","url":"media/Apps/LithoLab/files/0.05mm_10layer_9 colors.json","description":"9 color calibrated .json file for LithoLab to 0.05mm layer height increments for use with a 0.2mm nozzle"}],"featured":true,"websiteLink":"","timestamp":"2026-01-12T01:03:01.269Z","wip":false,"order":0,"specs":"","related":[{"name":"BorderBuilder","url":"#project/8287"},{"name":"Pallet generator","url":"#project/968"}],"thumbnail":"media/Apps/LithoLab/LithoLab-img-f923d0-thumb.webp","slug":"litholab","imageThumb":"media/Apps/LithoLab/LithoLab-img-f923d0-thumb.webp"},{"id":"3670","title":"Unfold","category":"Software","tags":["React","TypeScript"],"image":"media/Apps/Unfold/Unfold-img-d96aed.webp","description":"\u003cp>Four decks of prompts for people on a video call who are tired of asking about the weather.\u003c/p>","longDescription":"\u003cp>Small talk on a video call is the worst version of small talk. Nobody can read the room, everyone talks over each other, and the weather comes up twice. Unfold is a deck of conversation prompts for getting past that part faster.\u003c/p>\u003cp>It started as a quick prototype for combining decks and drawing cards. There are four decks and three ways to play them. To make it useful across more than one session, the game had to remember which cards a group had already seen and let people build their own decks, so I added a save-state layer that lives entirely in the browser. Nobody has to sign up for anything. That also meant there was nothing to host, so it sits on GitHub Pages as a static site.\u003c/p>\u003cp>I have played it with my partner sitting next to me on the couch. I have not yet played it on an actual video call with friends or family, which is the whole point. That is on the list.\u003c/p>","video":"","gallery":[{"url":"media/Apps/Unfold/Unfold-img-d96aed.webp","thumbnail":"media/Apps/Unfold/Unfold-img-d96aed-thumb.webp"},{"url":"media/Apps/Unfold/Unfold-img-c4a3b9.webp","thumbnail":"media/Apps/Unfold/Unfold-img-c4a3b9-thumb.webp"},{"url":"media/Apps/Unfold/Unfold-img-fdd272.webp","thumbnail":"media/Apps/Unfold/Unfold-img-fdd272-thumb.webp"},{"url":"media/Apps/Unfold/Unfold-img-303b5a.webp","thumbnail":"media/Apps/Unfold/Unfold-img-303b5a-thumb.webp"},{"url":"media/Apps/Unfold/Unfold-img-91335b.webp","thumbnail":"media/Apps/Unfold/Unfold-img-91335b-thumb.webp"},{"url":"media/Apps/Unfold/Unfold-img-43faba.webp","thumbnail":"media/Apps/Unfold/Unfold-img-43faba-thumb.webp"}],"launchLink":"https://elusid108.github.io/Unfold/","githubLink":"https://github.com/Elusid108/Unfold","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-12T01:03:01.269Z","wip":false,"order":6,"specs":"\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Framework\u003c/strong>\u003cbr>\u003cem>React 18\u003c/em>\u003c/p>\u003cp>\u003cstrong>Language\u003c/strong>\u003cbr>\u003cem>TypeScript\u003c/em>\u003c/p>\u003cp>\u003cstrong>Build\u003c/strong>\u003cbr>\u003cem>Vite (SWC)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Styling\u003c/strong>\u003cbr>\u003cem>Tailwind CSS • Radix UI\u003c/em>\u003c/p>\u003cp>\u003cstrong>Storage\u003c/strong>\u003cbr>\u003cem>localStorage\u003c/em>\u003c/p>\u003cp>\u003cstrong>Deploy\u003c/strong>\u003cbr>\u003cem>GitHub Pages\u003c/em>\u003c/p>","related":[],"thumbnail":"media/Apps/Unfold/Unfold-img-d96aed-thumb.webp","slug":"unfold","imageThumb":"media/Apps/Unfold/Unfold-img-d96aed-thumb.webp"},{"id":"670","timestamp":"2026-01-12T23:50:49.052Z","title":"Pyramid","category":"Art","image":"media/Art/Pyramid/Pyramid-img-c7b4d7.webp","description":"\u003cp>I trapped a pixel matrix inside a sealed 3D print and accidentally mushed the melting plastic with my thumb.\u003c/p>","longDescription":"\u003cp>A pixel effect crawling across the surface of a solid object. That was the picture. The first thing I built to get it was a glowing pyramid with a subdivided grid inside.\u003c/p>\u003cp>Getting crisp isolation without light bleed meant printing the sculpture as a single piece. Every layer needed a black core to block light between shafts, white walls to bounce it up, and a frosted shell for diffusion. The printer did three filament swaps per layer, leaving a mountain of purge waste. I put a 256-pixel matrix inside and turned it on. Heat built up fast. I picked the piece up after a burn-in test and accidentally mushed the softened grid in with my thumb.\u003c/p>\u003cp>Venting the back helped, but potting holes in the front would ruin the look. I swapped to 12-volt matrices, kept the diodes a centimeter off the surface, and set a 1-amp current limit in the software. The piece hung at Glow Lounge in Denver and ran for months without warping. Every sealed piece since has been printed the same way, as a single body.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Rapid Prototyping","Lighting Design","Custom Fabrication"],"gallery":[{"url":"media/Art/Pyramid/models/Pyramid-gfx-0cd8a3.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#000000","opacity":1},{"name":"Part_2","color":"#ffffff","opacity":1},{"name":"Part_3","color":"#9ca3af","opacity":0.5}],"view":{"theta":-0.5078,"phi":1.3334,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.3,"x":55.5,"y":41.8},"poster":"media/Art/Pyramid/Pyramid-gfx-0cd8a3-poster.webp","thumbnail":"media/Art/Pyramid/Pyramid-gfx-0cd8a3-poster-thumb.webp"},{"url":"media/Art/Pyramid/Pyramid-img-05075a.webp","fit":{"scale":1.25,"x":0,"y":50},"thumbnail":"media/Art/Pyramid/Pyramid-img-05075a-thumb.webp"},{"url":"media/Art/Pyramid/Pyramid-img-ba1de9.webp","fit":{"scale":1.2,"x":10.1,"y":85.1},"thumbnail":"media/Art/Pyramid/Pyramid-img-ba1de9-thumb.webp"},{"url":"media/Art/Pyramid/Pyramid-img-200786.webp","fit":{"scale":1.8,"x":32.8,"y":16},"thumbnail":"media/Art/Pyramid/Pyramid-img-200786-thumb.webp"},{"url":"media/Art/Pyramid/Pyramid-vid-34a56d.mp4","poster":"media/Art/Pyramid/Pyramid-vid-34a56d-poster.webp","thumbnail":"media/Art/Pyramid/Pyramid-vid-34a56d-poster-thumb.webp"},{"url":"media/Art/Pyramid/Pyramid-vid-fdbf4b.mp4","poster":"media/Art/Pyramid/Pyramid-vid-fdbf4b-poster.webp","thumbnail":"media/Art/Pyramid/Pyramid-vid-fdbf4b-poster-thumb.webp"},{"url":"media/Art/Pyramid/Pyramid-vid-e2d962.mp4","poster":"media/Art/Pyramid/Pyramid-vid-e2d962-poster.webp","thumbnail":"media/Art/Pyramid/Pyramid-vid-e2d962-poster-thumb.webp"}],"files":[{"name":"Pyramid.zip","url":"media/Art/Pyramid/files/Pyramid.zip","description":"Multi‑plate .3mf with every printed part for the Pyramid, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Pyramid/Pyramid-img-1d5ba1.webp","thumbnail":"media/Art/Pyramid/Pyramid-img-1d5ba1-thumb.webp","thumbnailFit":{"scale":1.4,"x":56.3,"y":52.1}}],"video":"","order":1,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C with AMS\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>bounce\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( &quot;Transparent&quot; )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"Mini Pyramid","url":"#project/5632"},{"name":"Plane Warp","url":"#project/8000"}],"thumbnailFit":{"scale":1.05,"x":44.2,"y":91.9},"bannerFit":{"scale":1,"x":77,"y":38.2},"thumbnail":"media/Art/Pyramid/Pyramid-img-c7b4d7-thumb.webp","slug":"pyramid","imageThumb":"media/Art/Pyramid/Pyramid-img-c7b4d7-thumb.webp"},{"id":"5632","title":"Mini Pyramid","category":"Art","tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","ESP32","Lighting Design","Rapid Prototyping","SPI","WLED"],"image":"media/Art/Mini Pyramid/Mini-Pyramid-img-3032b6.webp","description":"\u003cp>Sixty-four LEDs, an ESP32, and a QR code on the bottom. Every time I plugged in a cable, the USB-C port retreated into the case.\u003c/p>","longDescription":"\u003cp>The desk version came next: an 8 x 8 pixel display in a pyramid small enough to sit beside a keyboard. I went with a pyramid simply because it was an easy shape to model in SolidWorks. The bottom doubled as a scannable QR code linking to my site.\u003c/p>\u003cp>Squeezing 64 LEDs and an ESP32 into that footprint left almost no room for hardware. I had to do several iterations of the base to hold the board in place. The USB-C port wanted to push back into the case whenever I plugged a cable in, and closing the shell kept crushing the internal wiring. It took several printed iterations to anchor the controller securely and route the leads.\u003c/p>\u003cp>Putting pixels that close to the surface usually creates hotspots, so I kept at least 10mm distance. I used a frosted layer over white cell walls to break up the light, printing the whole case in three different materials.\u003c/p>","video":"","gallery":[{"url":"media/Art/Mini Pyramid/models/Mini-Pyramid-gfx-c40035.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1},{"name":"Part_3","color":"#9ca3af","opacity":0.5}],"view":{"theta":0.6747,"phi":1.1326,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.1,"x":54.2,"y":25.3},"poster":"media/Art/Mini Pyramid/Mini-Pyramid-gfx-c40035-poster.webp","thumbnail":"media/Art/Mini Pyramid/Mini-Pyramid-gfx-c40035-poster-thumb.webp"},{"url":"media/Art/Mini Pyramid/Mini-Pyramid-img-ebe078.webp","fit":{"scale":1,"x":48.9,"y":19.2},"thumbnail":"media/Art/Mini Pyramid/Mini-Pyramid-img-ebe078-thumb.webp"},{"url":"media/Art/Mini Pyramid/Mini-Pyramid-vid-4dd3b6.mp4","poster":"media/Art/Mini Pyramid/Mini-Pyramid-vid-4dd3b6-poster.webp","thumbnail":"media/Art/Mini Pyramid/Mini-Pyramid-vid-4dd3b6-poster-thumb.webp"},{"url":"media/Art/Mini Pyramid/Mini-Pyramid-img-681623.webp","fit":{"scale":1,"x":66.6,"y":64.7},"thumbnail":"media/Art/Mini Pyramid/Mini-Pyramid-img-681623-thumb.webp"},{"url":"media/Art/Mini Pyramid/Mini-Pyramid-img-24bffe.webp","fit":{"scale":1.1,"x":26.9,"y":46.5},"thumbnail":"media/Art/Mini Pyramid/Mini-Pyramid-img-24bffe-thumb.webp"},{"url":"media/Art/Mini Pyramid/Mini-Pyramid-img-095865.webp","fit":{"scale":1,"x":48.4,"y":40.2},"thumbnail":"media/Art/Mini Pyramid/Mini-Pyramid-img-095865-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[{"name":"Mini Pyramid.zip","url":"media/Art/Mini Pyramid/files/Mini Pyramid.zip","description":"Single‑plate .3mf with every printed part for the Mini Pyramid, ready to slice and assemble. Fits a 8x8 WS2812b matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Mini Pyramid/Mini-Pyramid-img-b062dc.webp","thumbnail":"media/Art/Mini Pyramid/Mini-Pyramid-img-b062dc-thumb.webp","thumbnailFit":{"scale":1.5,"x":39.8,"y":59.6}}],"featured":false,"websiteLink":"","timestamp":"2026-01-13T00:01:33.897Z","wip":false,"order":10,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x64)\u003c/strong>\u003cbr>\u003cem>WS2812b • RGB • 8 x 8 matrix • black flex pcb • 5Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border • case\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>bounce • QR code\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( &quot;Transparent&quot; )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>ESP32-S3 • WLED • USB-C\u003c/em>\u003c/p>","related":[{"name":"Pyramid","url":"#project/670"},{"name":"Plane Warp","url":"#project/8000"}],"thumbnailFit":{"scale":1,"x":52.5,"y":99},"bannerFit":{"scale":1,"x":19.3,"y":27.7},"thumbnail":"media/Art/Mini Pyramid/Mini-Pyramid-img-3032b6-thumb.webp","slug":"mini-pyramid","imageThumb":"media/Art/Mini Pyramid/Mini-Pyramid-img-3032b6-thumb.webp"},{"id":"8000","timestamp":"2026-01-13T00:04:25.482Z","title":"Plane Warp","category":"Art","image":"media/Art/Plane Warp/Plane-Warp-img-4c702f.webp","description":"\u003cp>Trapped heat destroyed the first print, so I lined the cells to bounce the light instead of forcing it.\u003c/p>","longDescription":"\u003cp>In a dark room, the black structure of this piece disappears, leaving only a distorted grid of light floating overhead. Plane Warp is a 16 x 16 matrix with a sweeping surface wave that ends in sharp points.\u003c/p>\u003cp>Because the wave's peak sits far above the base, lighting the corners meant running the LEDs at full brightness. I destroyed an early print trying to push enough light up there. The trapped heat ruined it.\u003c/p>\u003cp>It hung on the ceiling at Glow Lounge for a while. To get it there, I changed the cell design. I printed black walls to isolate each channel, lined the insides with white, and added a frosted diffusion layer. That combination became the rule: bounce the light instead of forcing it. It let me cap the controller to a one-amp limit, and the plastic survived.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","Custom Fabrication","SPI","Rapid Prototyping","Lighting Design"],"gallery":[{"url":"media/Art/Plane Warp/models/Plane-Warp-gfx-435424.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1},{"name":"Part_3","color":"#9ca3af","opacity":0.5}],"view":{"theta":0.0386,"phi":0.8381,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.2,"x":60.3,"y":35.3},"poster":"media/Art/Plane Warp/Plane-Warp-gfx-435424-poster.webp","thumbnail":"media/Art/Plane Warp/Plane-Warp-gfx-435424-poster-thumb.webp"},{"url":"media/Art/Plane Warp/Plane-Warp-vid-c686a1.mp4","poster":"media/Art/Plane Warp/Plane-Warp-vid-c686a1-poster.webp","thumbnail":"media/Art/Plane Warp/Plane-Warp-vid-c686a1-poster-thumb.webp"},{"url":"media/Art/Plane Warp/Plane-Warp-img-4c702f.webp","fit":{"scale":1,"x":45.6,"y":41.8},"thumbnail":"media/Art/Plane Warp/Plane-Warp-img-4c702f-thumb.webp"},{"url":"media/Art/Plane Warp/Plane-Warp-img-2e4a6a.webp","thumbnail":"media/Art/Plane Warp/Plane-Warp-img-2e4a6a-thumb.webp"},{"url":"media/Art/Plane Warp/Plane-Warp-img-34c5de.webp","fit":{"scale":1,"x":87.5,"y":37.5},"thumbnail":"media/Art/Plane Warp/Plane-Warp-img-34c5de-thumb.webp"},{"url":"media/Art/Plane Warp/Plane-Warp-img-ae7eba.webp","fit":{"scale":1,"x":44.3,"y":40.5},"thumbnail":"media/Art/Plane Warp/Plane-Warp-img-ae7eba-thumb.webp"}],"files":[{"name":"Plane Warp.zip","url":"media/Art/Plane Warp/files/Plane Warp.zip","description":"Multi‑plate .3mf with every printed part for the Plane Warp, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Plane Warp/Plane-Warp-img-df081d.webp","thumbnail":"media/Art/Plane Warp/Plane-Warp-img-df081d-thumb.webp","thumbnailFit":{"scale":1.45,"x":51.5,"y":37.1}}],"video":"","order":5,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>bounce\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( &quot;Transparent&quot; )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"Pyramid","url":"#project/670"},{"name":"Mini Pyramid","url":"#project/5632"}],"thumbnailFit":{"scale":1,"x":49.4,"y":33.1},"bannerFit":{"scale":1,"x":45.2,"y":3.4},"thumbnail":"media/Art/Plane Warp/Plane-Warp-img-4c702f-thumb.webp","slug":"plane-warp","imageThumb":"media/Art/Plane Warp/Plane-Warp-img-4c702f-thumb.webp"},{"id":"8252","timestamp":"2026-01-13T00:14:02.780Z","title":"Temple SF","category":"Systems","image":"media/Integration/Temple SF/Temple-SF-img-5779b3.webp","description":"\u003cp>Six teardowns before three control systems would talk to each other. The test was one slow diagonal line dragging across the ceiling.\u003c/p>","longDescription":"\u003cp>When a heavy track drops, the energy in the room explodes, and the lights have to explode with it. If they don't, you are standing in the dark for a few seconds longer than feels right, and everyone on the floor knows it. That was happening on every big drop at Temple. The operator was in sync with the DJ. The system was not. Releasing a DMX overwrite on the old Road Hog 4 took a macro that needed dozens of screen presses, and those lost seconds were the drop.\u003c/p>\u003cp>The owners wanted one person to run lighting, video, and pixels at once, so I rebuilt the routing around Madrix as the hub. Resolume and the Hog both fed Art-Net into Madrix on unused universes. Madrix merged them using highest takes priority, meaning whichever source was sending the brighter value won, and pushed the result to the decoders. That made the handoff instant. Black out one system and the other has the room. A video clip on the ceiling could slice across the main screens, override the console colors, and drive every pixel in the building at once.\u003c/p>\u003cp>I got a little ambitious with the control surface. I installed a 65-inch touchscreen running OSC Pilot for routing and live previews. It technically worked. Live operation under pressure is a different beast, and after a few months the operators ripped the screen out and went back to MIDI controllers.\u003c/p>\u003cp>I tore the mapping down and rebuilt it six times before all three systems talked to each other clean. Each rebuild meant a fresh Resolume advanced layout, a new canvas size and orientation for the enormous segmented display, re-adjusting Madrix for the pixels, and repatching the lighting on the Hog. Every pass taught me a new trick. My test was always the same: one diagonal line, slowed way down. I would trigger it and watch the ceiling, the back wall, and the pixels to see whether the line stayed one line as it dragged across all of them.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["OSCpilot","OSC","MIDI","DMX","ArtNet","sACN","Show Cockpit","Madrix","Resolume Arena","TCP/IP","Custom Fabrication","Roadhog 4","Pixel Mapping","Video Mapping","ESP32","Power Distribution","NDI"],"gallery":[{"url":"media/Integration/Temple SF/Temple-SF-vid-6d9c52.mp4","poster":"media/Integration/Temple SF/Temple-SF-vid-6d9c52-poster.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-vid-6d9c52-poster-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-img-19b882.webp","fit":{"scale":1,"x":43.2,"y":67.6,"rotate":0},"thumbnail":"media/Integration/Temple SF/Temple-SF-img-19b882-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-vid-32a61b.mp4","poster":"media/Integration/Temple SF/Temple-SF-vid-32a61b-poster.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-vid-32a61b-poster-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-vid-2ad86e.mp4","poster":"media/Integration/Temple SF/Temple-SF-vid-2ad86e-poster.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-vid-2ad86e-poster-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-vid-2432ff.mp4","poster":"media/Integration/Temple SF/Temple-SF-vid-2432ff-poster.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-vid-2432ff-poster-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-vid-5d4c34.mp4","poster":"media/Integration/Temple SF/Temple-SF-vid-5d4c34-poster.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-vid-5d4c34-poster-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-img-5601f4.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-img-5601f4-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-img-511f5a.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-img-511f5a-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-img-d516ba.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-img-d516ba-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-img-0bee5f.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-img-0bee5f-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-vid-ba5554.mp4","poster":"media/Integration/Temple SF/Temple-SF-vid-ba5554-poster.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-vid-ba5554-poster-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-vid-706fe4.mp4","poster":"media/Integration/Temple SF/Temple-SF-vid-706fe4-poster.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-vid-706fe4-poster-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-img-c8ae17.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-img-c8ae17-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-img-2b1fd2.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-img-2b1fd2-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-img-f103e9.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-img-f103e9-thumb.webp"},{"url":"media/Integration/Temple SF/Temple-SF-img-e484e7.webp","thumbnail":"media/Integration/Temple SF/Temple-SF-img-e484e7-thumb.webp"}],"files":[],"video":"","order":1,"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Beam (x144)\u003c/strong>\u003cbr>\u003cem>PD60 • LED • beam 4° • 60W • RGBW • infinite pan &amp; tilt\u003c/em>\u003c/p>\u003cp>\u003cstrong>Spot (x12)\u003c/strong>\u003cbr>\u003cem>LSM150 • LED • spot 15° • 150W • pan 520° • tilt 270° • 7 colors + white • 6 static gobos • 6 rotating gobos • 3 facet prism\u003c/em>\u003c/p>\u003cp>\u003cstrong>Wash (x40)\u003c/strong>\u003cbr>\u003cem>WFP12 • LED • wash 35° • 280W • RGBWA+UV\u003c/em>\u003c/p>\u003cp>\u003cstrong>Hazer (x2)\u003c/strong>\u003cbr>\u003cem>Radiance Hazer • DMX • 120Vac • 500W\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>Dancefloor Pixel Pillars (x10)\u003c/strong>\u003cbr>\u003cem>x8 + 4m • RGBW (6000k) • 60/m • 20px/m\u003c/em>\u003c/p>\u003cp>\u003cstrong>WiFi VIP Pixel Tables (x32)\u003c/strong>\u003cbr>\u003cem>2.1m • RGBW (6000k) • 60/m • 20px/m\u003c/em>\u003c/p>\u003cp>\u003cstrong>Ceiling Screen (x1)\u003c/strong>\u003cbr>\u003cem>3.5m x 23m • P4.81 • 728 x 4784\u003c/em>\u003c/p>\u003cp>\u003cstrong>DJ Booth Screen (x1)\u003c/strong>\u003cbr>\u003cem>7m x 1.5m • P4.81 • 1456 x 312\u003c/em>\u003c/p>\u003cp>\u003cstrong>Marquee Left Screen (x1)\u003c/strong>\u003cbr>\u003cem>14m x 1m • P4.81 • 2912 x 208\u003c/em>\u003c/p>\u003cp>\u003cstrong>Marquee Right Screen (x1)\u003c/strong>\u003cbr>\u003cem>18m x 1m • P4.81 • 3744 x 208\u003c/em>\u003c/p>\u003cp>\u003cstrong>Monolith Screens (x1)\u003c/strong>\u003cbr>\u003cem>1.5m x 3m (x2) • P4.81 • 312 x 624 (x2)\u003c/em>\u003c/p>","related":[{"name":"Immersive Dance Lighting Rig","url":"#project/1"},{"name":"Immersive Video Layer","url":"#project/4250"},{"name":"Immersive Lighting Layer","url":"#project/2395"},{"name":"Immersive Dance Floor Pillars","url":"#project/6371"},{"name":"WiFi VIP Tables","url":"#project/496"},{"name":"VIP glass wall","url":"#project/8983"},{"name":"LED Pixel Panel","url":"#project/9469"},{"name":"LED Video Panel Service","url":"#project/4623"},{"name":"Lighting & SFX Service","url":"#project/1862"}],"thumbnail":"media/Integration/Temple SF/Temple-SF-img-5779b3-thumb.webp","slug":"temple-sf","imageThumb":"media/Integration/Temple SF/Temple-SF-img-5779b3-thumb.webp"},{"id":"9517","title":"Field Solder Station","category":"Tooling","tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","Rapid Prototyping","Hand tools"],"image":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-c2c0fc.webp","description":"\u003cp>Eighty strips, four meters straight up, soldered from a lift. Iron, spool, flux, wick, pump, and two helping hands in one printed block.\u003c/p>","longDescription":"\u003cp>At the start of the Temple San Francisco remodel I was on top of a ladder with a plug-in soldering iron in one hand and a heat gun in the other, trying to keep a spool of solder from rolling off the platform. The job was eighty vertical pixel strips, eight per pillar, each running four meters straight up from the dance floor. Every one of them needed joints made from a lift or a ladder. With that much pixel work, the juggling act got aggravating fast.\u003c/p>\u003cp>What I needed was a carrier for everything at once: a TS100 iron, the solder spool, flux, wick, a pump, sponges, and two helping hands. The early prototypes had rechargeable batteries built in. That added more risk than it was worth, so I stripped the power out entirely. The first field version was a rough thing held together with tape and magnets, and I tweaked it for about a year as the remodel kept growing.\u003c/p>\u003cp>The final chassis is modeled in SolidWorks and printed in PLA. Everything secures with a friction fit and no fasteners. The helping hands are stiff enough that I have to hold the base down to bend them, which is exactly what you want when the base is sitting on a ladder platform. It has been my main rig for pixel work ever since.\u003c/p>","video":"","gallery":[{"url":"media/Fabrication/Field Solder Station/models/Field-Solder-Station-gfx-7e397d.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#505050","opacity":1},{"name":"Part_2","color":"#505050","opacity":1}],"view":{"theta":-2.5218,"phi":0.9029,"radiusScale":2.852,"panX":-0.0115,"panY":0.0625},"fit":{"scale":1.3,"x":52.3,"y":34.6},"poster":"media/Fabrication/Field Solder Station/Field-Solder-Station-gfx-7e397d-poster.webp","thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-gfx-7e397d-poster-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-c2c0fc.webp","fit":{"scale":1,"x":48.8,"y":71.6},"thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-c2c0fc-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-811753.webp","thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-811753-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-2c17c4.webp","thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-2c17c4-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-78b471.webp","thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-78b471-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-490841.webp","thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-490841-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-1a19fd.webp","thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-1a19fd-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-8b38bb.webp","thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-8b38bb-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-b91938.webp","thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-b91938-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[{"name":"Field Solder Station.zip","url":"media/Fabrication/Field Solder Station/files/Field Solder Station.zip","description":"Printable .3mf of the field solder station, ready to slice and assemble.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-46c35c.webp","thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-46c35c-thumb.webp","thumbnailFit":{"scale":1.25,"x":49.3,"y":45.9}}],"featured":false,"websiteLink":"","timestamp":"2026-01-13T00:23:48.073Z","wip":false,"order":3,"specs":"\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>BambuLabs • X1C • | • TenLog • TL-D3\u003c/em>\u003c/p>\u003cp>\u003cstrong>Black PLA+\u003c/strong>\u003cbr>\u003cem>Duramic • 1.75mm\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>SolidWorks 2022\u003c/strong>\u003c/p>","related":[],"thumbnailFit":{"scale":1,"x":51.8,"y":72.2},"bannerFit":{"scale":1,"x":49.5,"y":58},"thumbnail":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-c2c0fc-thumb.webp","slug":"field-solder-station","imageThumb":"media/Fabrication/Field Solder Station/Field-Solder-Station-img-c2c0fc-thumb.webp"},{"id":"9469","title":"LED Pixel Panel","category":"Fixtures","tags":["SPI","Lighting Design","Custom Fabrication"],"image":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-bd8ff4.webp","description":"\u003cp>With eight feet of clearance, we bolted altered dancefloor boards to aluminum track to build an array under an inch thick.\u003c/p>","longDescription":"\u003cp>LED strips droop, and wiring them overhead is a mess. We needed a rigid, identical grid that could hold a diffuser at an even distance without sagging. Large, cheap PCBs were the answer. I took standard LED dancefloor boards and had the manufacturer alter the pixel spacing, enlarge the mounting holes, and swap in 90-degree headers.\u003c/p>\u003cp>The basement gave us exactly eight feet from the floor tile to the bottom of the wooden joists. Every quarter inch mattered. We ripped out two layers of drywall and rerouted the fire suppression system just to buy breathing room. Half the joists were broken, so I had them fixed and restructured to push the electrical, data, and HVAC runs to the edges of the room, leaving the center clear.\u003c/p>\u003cp>We bolted the custom boards straight into aluminum T-track, compressing a 24-volt WS2818 pixel matrix into a vertical profile under an inch. I never actually saw it powered on overhead. By the time the basement was ready for the hang, I had left the company. I pixel-mapped the array flat across a sea of road cases, proved the hardware worked, and handed the plans off to my crew to lift into a ceiling that refused to give us another inch.\u003c/p>","video":"","gallery":[{"url":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-vid-7ee743.mp4","poster":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-vid-7ee743-poster.webp","thumbnail":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-vid-7ee743-poster-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-vid-4608fb.mp4","poster":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-vid-4608fb-poster.webp","thumbnail":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-vid-4608fb-poster-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-18b908.webp","fit":{"scale":1.5,"x":62.1,"y":68.4},"thumbnail":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-18b908-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-68a9e7.webp","fit":{"scale":1.3,"x":41.6,"y":80.7},"thumbnail":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-68a9e7-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-466852.webp","fit":{"scale":1,"x":50.9,"y":77.8},"thumbnail":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-466852-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-65ee43.webp","thumbnail":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-65ee43-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-85a0ae.webp","thumbnail":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-85a0ae-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-bd8ff4.webp","thumbnail":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-bd8ff4-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-13T00:48:58.329Z","wip":false,"order":10,"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Custom PCB\u003c/strong>\u003cbr>\u003cem>12 x 6 pixel matrix\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x72)\u003c/strong>\u003cbr>\u003cem>WS2818 • RGB • 24v\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Custom Rigging\u003c/strong>\u003cbr>\u003cem>t-track • t-nuts • rubber washers • bolts\u003c/em>\u003c/p>","related":[{"name":"Temple SF","url":"#project/8252"}],"bannerFit":{"scale":1,"x":47.9,"y":27.7},"thumbnail":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-bd8ff4-thumb.webp","slug":"led-pixel-panel","imageThumb":"media/Electronics/LED Pixel Panel/LED-Pixel-Panel-img-bd8ff4-thumb.webp"},{"id":"5416","title":"LVL","category":"Fixtures","tags":["Pixel Mapping","Madrix","Hand tools","Power tools","ArtNet","MIDI","TCP/IP","SPI","Repair","AC/DC Load Calc","Power Distribution","Lighting Design","Wire-to-Board Soldering"],"image":"media/Electronics/LVL/LVL-img-b5637b.webp","description":"\u003cp>Floor channels set on wood inserts. Months of spilled drinks swelled them until the diffusion caved in. The tape was worth saving.\u003c/p>","longDescription":"\u003cp>I needed custom acrylic support strips for floor pixels because the existing channels were construction-adhesived into the floor and refused to come out. Someone had installed unsealed tracks using wood inserts. The wood absorbed months of spilled drinks, mop water, and sewage backups until the diffusion caved in and shattered. Even the foam tape holding the strips smelled like club funk. The pixel tape itself was expensive and salvageable. I cut out the shorted sections, scrubbed the tracks, and built new supports out of acrylic. I knew the plastic would survive if the silicone seal ever broke again.\u003c/p>\u003cp>Wiring sixteen strip runs across the room required heavy power injection to stop voltage drop. My first attempt was unstable. I ran DC wire in parallel and tied the negative leads together back in the supply room, which triggered ground loop flicker across part of the system. The fix was coupling the negative leads close to the pixels above the dancefloor. The pillar modules also fought me because of undersized wire, so I added more injection points and ground jumpers until the signal stabilized.\u003c/p>\u003cp>Once the power and data lines behaved, I mapped the floor, pillars, and ceiling into a 3D voxel setup. The room runs almost entirely on those pixels. Now the control system drives spatial sweeps through the room, and the floor channels can take a direct hit from a spilled drink without shorting out.\u003c/p>","video":"","gallery":[{"url":"media/Electronics/LVL/LVL-vid-20a297.mp4","fit":{"scale":1.1,"x":6.6,"y":25},"poster":"media/Electronics/LVL/LVL-vid-20a297-poster.webp","thumbnail":"media/Electronics/LVL/LVL-vid-20a297-poster-thumb.webp"},{"url":"media/Electronics/LVL/LVL-vid-d84098.mp4","fit":{"scale":1.1,"x":79.2,"y":96.8},"poster":"media/Electronics/LVL/LVL-vid-d84098-poster.webp","thumbnail":"media/Electronics/LVL/LVL-vid-d84098-poster-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-b5637b.webp","fit":{"scale":1,"x":48,"y":28.1},"thumbnail":"media/Electronics/LVL/LVL-img-b5637b-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-4c48ef.webp","fit":{"scale":1.1,"x":73.3,"y":32.1},"thumbnail":"media/Electronics/LVL/LVL-img-4c48ef-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-f5bf56.webp","fit":{"scale":1.15,"x":100,"y":30.7},"thumbnail":"media/Electronics/LVL/LVL-img-f5bf56-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-9841bc.webp","fit":{"scale":1,"x":49.1,"y":1},"thumbnail":"media/Electronics/LVL/LVL-img-9841bc-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-490bd5.webp","fit":{"scale":1,"x":50.9,"y":78.9},"thumbnail":"media/Electronics/LVL/LVL-img-490bd5-thumb.webp"},{"url":"media/Electronics/LVL/LVL-vid-a57e0d.mp4","poster":"media/Electronics/LVL/LVL-vid-a57e0d-poster.webp","thumbnail":"media/Electronics/LVL/LVL-vid-a57e0d-poster-thumb.webp"},{"url":"media/Electronics/LVL/LVL-vid-81bb9d.mp4","fit":{"scale":1.15,"x":1.4,"y":0},"poster":"media/Electronics/LVL/LVL-vid-81bb9d-poster.webp","thumbnail":"media/Electronics/LVL/LVL-vid-81bb9d-poster-thumb.webp"},{"url":"media/Electronics/LVL/LVL-vid-7bd318.mp4","fit":{"scale":1.15,"x":52.2,"y":66.3},"poster":"media/Electronics/LVL/LVL-vid-7bd318-poster.webp","thumbnail":"media/Electronics/LVL/LVL-vid-7bd318-poster-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-171ada.webp","fit":{"scale":1.35,"x":99.5,"y":41.6},"thumbnail":"media/Electronics/LVL/LVL-img-171ada-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-1d4a23.webp","fit":{"scale":1,"x":55.4,"y":34.1},"thumbnail":"media/Electronics/LVL/LVL-img-1d4a23-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-0a425f.webp","fit":{"scale":1,"x":60.7,"y":100},"thumbnail":"media/Electronics/LVL/LVL-img-0a425f-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-261f11.webp","fit":{"scale":1,"x":55.2,"y":99.8},"thumbnail":"media/Electronics/LVL/LVL-img-261f11-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-fb9325.webp","fit":{"scale":1.15,"x":0,"y":57},"thumbnail":"media/Electronics/LVL/LVL-img-fb9325-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-70325b.webp","thumbnail":"media/Electronics/LVL/LVL-img-70325b-thumb.webp"},{"url":"media/Electronics/LVL/LVL-img-61d133.webp","fit":{"scale":1.2,"x":83.4,"y":23.7},"thumbnail":"media/Electronics/LVL/LVL-img-61d133-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-17T17:46:42.266Z","wip":false,"order":3,"specs":"\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Temple Denver","url":"#project/4382"},{"name":"MIRUS","url":"#project/4939"}],"thumbnailFit":{"scale":1,"x":0,"y":37.7},"bannerFit":{"scale":1,"x":42.1,"y":24.6},"thumbnail":"media/Electronics/LVL/LVL-img-b5637b-thumb.webp","slug":"lvl","imageThumb":"media/Electronics/LVL/LVL-img-b5637b-thumb.webp"},{"id":"4939","title":"MIRUS","category":"Lighting","tags":["AC/DC Load Calc","DMX","Hand tools","Lighting Design","Madrix","Power Distribution","Power tools","Wire-to-Board Soldering"],"image":"media/Lighting/MIRUS/MIRUS-img-48878d.webp","description":"\u003cp>Blasting saturated light against white walls washes out the art, but the paintings were psychedelic anyway.\u003c/p>","longDescription":"\u003cp>Someone handed me a parts list and told me to build a ceiling rig. Another crew had already hung eighty wooden baffles twelve feet above the floor. I had them also press in the RGBW wash strips in routed channels on the bottom. The channels had sharp ninety-degree corners. Bending flexible copper tape around those turns snapped the backing. I ended up doing quite a lot of repairs.\u003c/p>\u003cp>To keep the install clean, I ran the wiring out the ends of the wood and straight up into a six-foot plenum. I walked across the rafters up there to build the control system. I grouped the baffles into ten zones, pairing one power supply to one DMX decoder with 8 outputs. The power units they bought ran with loud fans. Usually, that ruins an art gallery. Luckily, the room shared a door with a nightclub. The ambient bass swallowed the fan hum.\u003c/p>\u003cp>I wired the decoders to control each baffle individually while keeping the ceiling on a single DMX universe. During the day, the room needed flat white illumination. At night, we flipped a preset and the ceiling ran heavy color chases. Blasting saturated light against white walls completely washed out the art. Because most of the paintings were psychedelic anyway, I threw out standard gallery rules. We let the colors bleed and turned the room into an extension of the dance floor.\u003c/p>","video":"","gallery":[{"url":"media/Lighting/MIRUS/MIRUS-img-48878d.webp","fit":{"scale":1,"x":46.8,"y":0},"thumbnail":"media/Lighting/MIRUS/MIRUS-img-48878d-thumb.webp"},{"url":"media/Lighting/MIRUS/MIRUS-vid-4de001.mp4","fit":{"scale":1.3,"x":0.3,"y":100},"poster":"media/Lighting/MIRUS/MIRUS-vid-4de001-poster.webp","thumbnail":"media/Lighting/MIRUS/MIRUS-vid-4de001-poster-thumb.webp"},{"url":"media/Lighting/MIRUS/MIRUS-img-7164f7.webp","fit":{"scale":1,"x":6.6,"y":77.1},"thumbnail":"media/Lighting/MIRUS/MIRUS-img-7164f7-thumb.webp"},{"url":"media/Lighting/MIRUS/MIRUS-img-340774.webp","fit":{"scale":1,"x":49.6,"y":81.7},"thumbnail":"media/Lighting/MIRUS/MIRUS-img-340774-thumb.webp"},{"url":"media/Lighting/MIRUS/MIRUS-vid-a0c414.mp4","poster":"media/Lighting/MIRUS/MIRUS-vid-a0c414-poster.webp","thumbnail":"media/Lighting/MIRUS/MIRUS-vid-a0c414-poster-thumb.webp"},{"url":"media/Lighting/MIRUS/MIRUS-img-756bf1.webp","fit":{"scale":1,"x":51.6,"y":81.4},"thumbnail":"media/Lighting/MIRUS/MIRUS-img-756bf1-thumb.webp"},{"url":"media/Lighting/MIRUS/MIRUS-img-dc6dda.webp","fit":{"scale":1.25,"x":15.9,"y":28.2},"thumbnail":"media/Lighting/MIRUS/MIRUS-img-dc6dda-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-17T17:47:45.485Z","wip":false,"order":16,"thumbnailFit":{"scale":1.2,"x":0,"y":23.8},"bannerFit":{"scale":1,"x":50.4,"y":27.4},"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Custom Wood Baffles (x80)\u003c/strong>\u003cbr>\u003cem>5m RGBW Strip\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Strip (x80)\u003c/strong>\u003cbr>\u003cem>Environmental Lights • 5m • RGBW (6000k) • wash strip • 24Vdc\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x12)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • RSP-1000-24 • 24Vdc • 40A\u003c/em>\u003c/p>\u003cp>\u003cstrong>DMX Decoder (x12)\u003c/strong>\u003cbr>\u003cem>Environmental Lights • 32ch • 8 RGBW output\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>LED Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Temple Denver","url":"#project/4382"},{"name":"LVL","url":"#project/5416"}],"thumbnail":"media/Lighting/MIRUS/MIRUS-img-48878d-thumb.webp","slug":"mirus","imageThumb":"media/Lighting/MIRUS/MIRUS-img-48878d-thumb.webp"},{"id":"8787","timestamp":"2026-01-17T17:49:41.986Z","title":"Inflatable Tubes","category":"Lighting","image":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-128bb5.webp","description":"\u003cp>Crawling inside an inflated three-foot cylinder on a concrete floor is a disorienting way to wire pixels.\u003c/p>","longDescription":"\u003cp>The centerpiece for Denver Pride was an array of eight inflatable tubes rigged to the ceiling beams. Standard LED tape was never going to cut through a club lighting rig. I ordered custom 24-volt pixel strands with double-sided clear lenses. I inflated the three-foot tubes on the concrete floor, turned the strands on, and crawled inside to tie the wiring down. It was disorienting. The tubes had strange twists in unusual directions, and dragging myself over the concrete hurt.\u003c/p>\u003cp>I ran two strands in parallel inside each tube. Pushing that much load causes voltage drop, so I put a power supply at both ends and severed the positive wire at the midpoint to stop back-feeding. We hoisted them empty and powered the fans in the air. The wireless control system worked perfectly during load-in. Then two thousand people walked into the room. Their cell phones choked the RF environment. Data rates dropped to five frames per second, and the tubes lost connection.\u003c/p>\u003cp>I used wireless decoders to save money. It is a choice I would reverse today. Luckily, I programmed their default state to a static Pride palette. When the signal dropped, the centerpiece stayed on theme. The rig pushed out enough light that another fabricator called me later to ask what hardware I used. I got the venue through the weekend on the fallback palette and told them to hardwire the data next time.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Lighting Design","Pixel Mapping","Resolume Arena","ArtNet","WLED","Embedded Systems","AC/DC Load Calc"],"gallery":[{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-312ee2.webp","fit":{"scale":1,"x":54.1,"y":81.1},"thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-312ee2-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-bc7776.webp","fit":{"scale":1,"x":49.8,"y":76.7},"thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-bc7776-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-cc7971.mp4","fit":{"scale":1.05,"x":78.4,"y":79.7},"poster":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-cc7971-poster.webp","thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-cc7971-poster-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-3edcfb.mp4","fit":{"scale":1.05,"x":59.8,"y":49.7},"poster":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-3edcfb-poster.webp","thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-3edcfb-poster-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-d7bcf4.mp4","fit":{"scale":1.05,"x":95.9,"y":32.7},"poster":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-d7bcf4-poster.webp","thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-d7bcf4-poster-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-791289.mp4","fit":{"scale":1,"x":49.5,"y":22.4},"poster":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-791289-poster.webp","thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-vid-791289-poster-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-9f775b.webp","thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-9f775b-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-e2e4dc.webp","thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-e2e4dc-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-3d3d4e.webp","fit":{"scale":1,"x":58.2,"y":61.9},"thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-3d3d4e-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-4353f7.webp","fit":{"scale":1,"x":44.6,"y":31.6},"thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-4353f7-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-faf404.webp","fit":{"scale":1,"x":50,"y":59.8},"thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-faf404-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-14f8ed.webp","fit":{"scale":1,"x":47.9,"y":28.1},"thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-14f8ed-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-67bd24.webp","thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-67bd24-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-bee755.webp","thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-bee755-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-03fade.webp","thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-03fade-thumb.webp"}],"files":[],"video":"","order":2,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>Short Tubes (x4)\u003c/strong>\u003cbr>\u003cem>2x UCS1903 strand (23m) • clear lens • 6 LED • RGB • 5px/m • 24Vdc • 115px\u003c/em>\u003c/p>\u003cp>\u003cstrong>Long Tubes (x4)\u003c/strong>\u003cbr>\u003cem>2x UCS1903 strand (30m) • clear lens • 6 LED • RGB • 5px/m • 24Vdc • 150px\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supply (x16)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • HLG-240H-24 • 24Vdc • 10A\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x16)\u003c/strong>\u003cbr>\u003cem>Athom • LS4P-WLED-LA • WLED\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Mapping\u003c/strong>\u003cbr>\u003cem>Resolume Arena\u003c/em>\u003c/p>","related":[{"name":"Tracks Discotheque","url":"#project/3671"}],"thumbnailFit":{"scale":1.4,"x":56.3,"y":65.5},"bannerFit":{"scale":1.4,"x":56.5,"y":69.3},"thumbnail":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-128bb5-thumb.webp","slug":"inflatable-tubes","imageThumb":"media/Lighting/Inflatable Tubes/Inflatable-Tubes-img-128bb5-thumb.webp"},{"id":"9925","title":"GeoLens Pro","category":"Software","tags":["React","TypeScript","REST APIs"],"image":"media/Apps/GeoLens Pro/GeoLens-Pro-img-b442f0.webp","description":"\u003cp>A day on site leaves two hundred photos in one camera roll. This reads the GPS tag and files each one under the job it was shot at.\u003c/p>","longDescription":"\u003cp>For a few years I was doing lighting installs and maintenance all over the Denver metro area, and my phone was the job file. Reference photos, shots of patch lists, pages of manuals, and a lot of wiring sketches drawn right on top of the photos. All of it dumped into one camera roll, and I never took the time to sort it. Finding the patch list from a site three weeks ago meant scrolling.\u003c/p>\u003cp>GeoLens Pro sorts by where you were standing. Each project gets a geofence on a map. Import a batch of photos, or take them live, and the app reads the GPS tag from each one and checks it against every active boundary. If it lands inside one, it files straight to that job. Anything that misses drops into a bin for manual sorting. I added a canvas editor so the wiring notes I was already scribbling could go on the image inside the app instead of in a separate markup tool.\u003c/p>\u003cp>I prototyped it on Lovable with everything stored locally in the browser. Then I left contract work before it saw a full season, so it never got the real-world run it was built for. Of everything here, it is the one that most needs a job site to prove itself on.\u003c/p>","video":"","gallery":[{"url":"media/Apps/GeoLens Pro/GeoLens-Pro-img-e5c985.webp","thumbnail":"media/Apps/GeoLens Pro/GeoLens-Pro-img-e5c985-thumb.webp"},{"url":"media/Apps/GeoLens Pro/GeoLens-Pro-img-d0337c.webp","thumbnail":"media/Apps/GeoLens Pro/GeoLens-Pro-img-d0337c-thumb.webp"},{"url":"media/Apps/GeoLens Pro/GeoLens-Pro-img-3374fb.webp","thumbnail":"media/Apps/GeoLens Pro/GeoLens-Pro-img-3374fb-thumb.webp"},{"url":"media/Apps/GeoLens Pro/GeoLens-Pro-img-fe48db.webp","thumbnail":"media/Apps/GeoLens Pro/GeoLens-Pro-img-fe48db-thumb.webp"},{"url":"media/Apps/GeoLens Pro/GeoLens-Pro-img-d783eb.webp","thumbnail":"media/Apps/GeoLens Pro/GeoLens-Pro-img-d783eb-thumb.webp"},{"url":"media/Apps/GeoLens Pro/GeoLens-Pro-img-b442f0.webp","thumbnail":"media/Apps/GeoLens Pro/GeoLens-Pro-img-b442f0-thumb.webp"},{"url":"media/Apps/GeoLens Pro/GeoLens-Pro-img-950555.webp","thumbnail":"media/Apps/GeoLens Pro/GeoLens-Pro-img-950555-thumb.webp"},{"url":"media/Apps/GeoLens Pro/GeoLens-Pro-img-87a52f.webp","thumbnail":"media/Apps/GeoLens Pro/GeoLens-Pro-img-87a52f-thumb.webp"}],"launchLink":"https://geo-field-snap.lovable.app","githubLink":"https://github.com/Elusid108/geo-field-snap","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-18T13:45:57.049Z","wip":true,"order":10,"specs":"\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Framework\u003c/strong>\u003cbr>\u003cem>React 18\u003c/em>\u003c/p>\u003cp>\u003cstrong>Language\u003c/strong>\u003cbr>\u003cem>TypeScript\u003c/em>\u003c/p>\u003cp>\u003cstrong>Build\u003c/strong>\u003cbr>\u003cem>Vite (SWC)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Styling\u003c/strong>\u003cbr>\u003cem>Tailwind CSS • Radix UI\u003c/em>\u003c/p>\u003cp>\u003cstrong>Maps\u003c/strong>\u003cbr>\u003cem>Leaflet • React-Leaflet\u003c/em>\u003c/p>\u003cp>\u003cstrong>Geo\u003c/strong>\u003cbr>\u003cem>elixfr (EXIF extraction)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Storage\u003c/strong>\u003cbr>\u003cem>Dexie (IndexedDB)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Export\u003c/strong>\u003cbr>\u003cem>jsPDF\u003c/em>\u003c/p>\u003cp>\u003cstrong>Backend\u003c/strong>\u003cbr>\u003cem>Supabase\u003c/em>\u003c/p>\u003cp>\u003cstrong>Deploy\u003c/strong>\u003cbr>\u003cem>Lovable\u003c/em>\u003c/p>","related":[],"thumbnail":"media/Apps/GeoLens Pro/GeoLens-Pro-img-b442f0-thumb.webp","slug":"geolens-pro","imageThumb":"media/Apps/GeoLens Pro/GeoLens-Pro-img-b442f0-thumb.webp"},{"id":"3991","title":"PixelForge","category":"Software","tags":["React","TypeScript","LLM Integration"],"image":"media/Apps/PixelForge/PixelForge-img-1db62c.webp","description":"\u003cp>Pick a category, roll the dice, type nothing. It kept producing the same pose until I found I was feeding old prompts back into the context.\u003c/p>","longDescription":"\u003cp>This one exists purely for fun. I am fascinated by how these models think, and I wanted to see how far off the rails I could push an image generator without typing anything. So I put a language model in front of it. You pick a category, roll the dice, and the model hallucinates an abstract prompt before any image rendering starts.\u003c/p>\u003cp>Early on it fell into a rut. Every character came back in the same pose, run after run. It turned out I was accidentally feeding the previous prompts back into the new context, so the model was quietly agreeing with itself. I isolated the client-side state so the app forgets every old generation between runs. Even with a clean slate, individual models drift toward their own habits, so I added a switch to route prompts across different versions and break the convergence.\u003c/p>\u003cp>The whole session history lives in the browser. I roll the dice, see what comes out, and roll again.\u003c/p>","video":"","gallery":[{"url":"media/Apps/PixelForge/PixelForge-img-89d12a.webp","thumbnail":"media/Apps/PixelForge/PixelForge-img-89d12a-thumb.webp"},{"url":"media/Apps/PixelForge/PixelForge-img-607a6c.webp","thumbnail":"media/Apps/PixelForge/PixelForge-img-607a6c-thumb.webp"},{"url":"media/Apps/PixelForge/PixelForge-img-1db62c.webp","thumbnail":"media/Apps/PixelForge/PixelForge-img-1db62c-thumb.webp"},{"url":"media/Apps/PixelForge/PixelForge-img-ad1cc4.webp","thumbnail":"media/Apps/PixelForge/PixelForge-img-ad1cc4-thumb.webp"},{"url":"media/Apps/PixelForge/PixelForge-img-e80f10.webp","thumbnail":"media/Apps/PixelForge/PixelForge-img-e80f10-thumb.webp"},{"url":"media/Apps/PixelForge/PixelForge-img-dd4cc8.webp","thumbnail":"media/Apps/PixelForge/PixelForge-img-dd4cc8-thumb.webp"},{"url":"media/Apps/PixelForge/PixelForge-img-a1f5eb.webp","thumbnail":"media/Apps/PixelForge/PixelForge-img-a1f5eb-thumb.webp"},{"url":"media/Apps/PixelForge/PixelForge-img-ef2db9.webp","thumbnail":"media/Apps/PixelForge/PixelForge-img-ef2db9-thumb.webp"},{"url":"media/Apps/PixelForge/PixelForge-img-283bed.webp","thumbnail":"media/Apps/PixelForge/PixelForge-img-283bed-thumb.webp"}],"launchLink":"https://elusid108.github.io/PixelForge-AI/","githubLink":"https://github.com/Elusid108/PixelForge-AI","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-18T14:24:23.784Z","wip":true,"order":11,"specs":"\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Framework\u003c/strong>\u003cbr>\u003cem>React 18\u003c/em>\u003c/p>\u003cp>\u003cstrong>Language\u003c/strong>\u003cbr>\u003cem>TypeScript\u003c/em>\u003c/p>\u003cp>\u003cstrong>Build\u003c/strong>\u003cbr>\u003cem>Vite\u003c/em>\u003c/p>\u003cp>\u003cstrong>Styling\u003c/strong>\u003cbr>\u003cem>Tailwind CSS\u003c/em>\u003c/p>\u003cp>\u003cstrong>State\u003c/strong>\u003cbr>\u003cem>Zustand\u003c/em>\u003c/p>\u003cp>\u003cstrong>AI\u003c/strong>\u003cbr>\u003cem>Google Gemini (text) • Google Imagen (image)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Storage\u003c/strong>\u003cbr>\u003cem>IndexedDB • localStorage\u003c/em>\u003c/p>\u003cp>\u003cstrong>Export\u003c/strong>\u003cbr>\u003cem>JSZip\u003c/em>\u003c/p>\u003cp>\u003cstrong>Deploy\u003c/strong>\u003cbr>\u003cem>GitHub Pages\u003c/em>\u003c/p>","related":[],"thumbnail":"media/Apps/PixelForge/PixelForge-img-1db62c-thumb.webp","slug":"pixelforge","imageThumb":"media/Apps/PixelForge/PixelForge-img-1db62c-thumb.webp"},{"id":"7085","title":"Chronicle: Iterative Fiction Engine","category":"Software","tags":["React","JavaScript","LLM Integration"],"image":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-f5a5af.webp","description":"\u003cp>Every turn generates a scene, an illustration, and narration. Without a memory stack, the art drifted and the plot looped.\u003c/p>","longDescription":"\u003cp>The longest session I have played was on a ship. I spent it going cabin to cabin looking for a key to open a box, and the game kept generating rooms, illustrating them, and reading them to me. I never found the key. I also have not finished a story end to end yet, because the mechanics are still the thing I am fixing.\u003c/p>\u003cp>Every turn in Chronicle is generated from scratch: a short scene, an illustration, and narration. You pick one of four choices or type your own. When you have had enough, you hit end and the engine gives you five final choices that lock in the outcome. Early versions fell apart fast. Without a strict memory structure, the art style drifted, the plot looped, and the prompt kept growing until the engine choked on it. I built a memory stack that compresses older events into shorthand while carrying forward the exact visual tags the image model needs. A turn used to take two minutes. Lighter models got it down to twenty seconds.\u003c/p>\u003cp>It runs with no backend and no build step, which is painful enough that I plan to tear the engine down and start over. The ship is still out there.\u003c/p>","video":"","gallery":[{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-72056f.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-72056f-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-00b44c.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-00b44c-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-c71748.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-c71748-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-58dd87.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-58dd87-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-3da1c1.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-3da1c1-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-3cd690.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-3cd690-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-c7c27f.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-c7c27f-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-5fb237.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-5fb237-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Ch
