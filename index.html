bp"},{"url":"media/Electronics/Dance Floor Pillars/20200830_215210.webp","fit":{"scale":1.5,"x":45.1,"y":29.3},"thumbnail":"media/Electronics/Dance Floor Pillars/20200830_215210-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/IMG_20200706_140158.webp","fit":{"scale":1.3,"x":71.4,"y":67.1},"thumbnail":"media/Electronics/Dance Floor Pillars/IMG_20200706_140158-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/IMG_20200325_202122.webp","fit":{"scale":1.1,"x":22.2,"y":48.6},"thumbnail":"media/Electronics/Dance Floor Pillars/IMG_20200325_202122-thumb.webp"}],"files":[],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x6400)</strong><br><em>320m • SM16704 • RGBW (6000k) • 20px/m • 12Vdc</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supplies (x10)</strong><br><em>MEAN WELL • 12Vdc • 50A</em></p><p><strong>Pixel Decoder (x2)</strong><br><em>Advatek • PixLite 16 Long Range MK2</em></p><p><strong>Pixel Receiver (x10)</strong><br><em>Advatek • PixLite Long Range Receiver</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>Mud-In Extrusion ( flat ) (x40)</strong><br><em>4m • flush • drywall mud-in • opal diffusion</em></p><p><strong>Mud-In Extrusion ( corner ) (x40)</strong><br><em>4m • flush • drywall mud-in • opal diffusion</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>Pixel Control</strong><br><em>Madrix 5.x</em></p>","related":[{"name":"Extrusion Center Sled","url":"#project/5376"},{"name":"Immersive Lighting Rig","url":"#project/1"},{"name":"Cross System Control","url":"#project/8252"}],"video":"","timestamp":"2026-07-31T21:40:01.374Z","id":"6371","order":0,"thumbnailFit":{"scale":1.15,"x":33.2,"y":41.7},"bannerFit":{"scale":1,"x":50.4,"y":55.7},"thumbnail":"media/Electronics/Dance Floor Pillars/Screenshot_20210306-180716_Photos~2-thumb.webp","specsData":[{"id":"dad0f335-04ea-4841-9848-9a7d9f0c86fd","title":"Pixels & display","items":[{"id":"bbc56ba3-274f-42fe-82d7-81e04f104f11","name":"LED Pixels","qty":"6400","specs":"320m, SM16704, RGBW (6000k), 20px/m, 12Vdc, "}]},{"id":"08aa8e42-9fc4-4404-b662-ce25d90de22f","title":"power & distribution","items":[{"id":"82024af1-2b73-4b85-9873-33dba42a5802","name":"Power Supplies","qty":"10","specs":"MEAN WELL, 12Vdc, 50A"},{"id":"6cdbfef8-1ed8-4de8-9d01-690d3531eebd","name":"Pixel Decoder","qty":"2","specs":"Advatek, PixLite 16 Long Range MK2"},{"id":"16dbc46f-8612-47ac-beb2-8976755aa8b4","name":"Pixel Receiver","qty":"10","specs":"Advatek, PixLite Long Range Receiver"}]},{"id":"b4d8a265-f57a-42f6-8760-62ae13ac5e3e","title":"Fabrication & Materials","items":[{"id":"7f65aacb-0522-4afb-a7ae-6afc08f477aa","name":"Mud-In Extrusion ( flat )","qty":"40","specs":"4m, flush, drywall mud-in, opal diffusion"},{"id":"7a09a9e4-5cae-4474-a563-51f87bc07c67","name":"Mud-In Extrusion ( corner )","qty":"40","specs":"4m, flush, drywall mud-in, opal diffusion"}]},{"id":"4c8f95ba-d365-42a2-8248-2949f7991c87","title":"Software & stack","items":[{"id":"c50b9f55-4aa8-4b45-9ee4-e258c2cc4500","name":"Pixel Control","qty":"","specs":"Madrix 5.x"}]}]},{"title":"Pixel Louver Lights","category":"Fixtures","image":"media/Electronics/Pixel Louver Lights/20240322_115100.webp","description":"<p>Nobody sells a corner LED channel with louvers in it, so I modeled one and printed enough for 48 cubbies. They were supposed to stay dry.</p>","longDescription":"<p>I needed to light 48 bar cubbies from the front corners without blasting raw RGB pixels into people's eyes. I have never seen a commercial LED channel with louvers, let alone a corner extrusion built for illumination. I modeled one in SolidWorks and printed 96 of them.</p><p>Getting the slide-in backing to fit took a few tries. Factory solder splices on the LED tape created bumps that jammed the plastic. I had to cut the tape strictly between splices to keep it flat. I also added internal zip ties so hanging wires wouldn't rip the solder pads off the strips.</p><p>Since the shelves were supposed to stay dry, I used non-waterproof tape. That was a mistake. On busy nights, people set drinks in the cubbies. Spills pooled in the corners, corroded the strips, and shorted them out. If I make these again, I am elevating the electronics off the deck and using waterproof tape.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Custom Fabrication","FDM 3D Printing","Hand tools","Lighting Design","Rapid Prototyping","SolidWorks","Wire-to-Board Soldering"],"gallery":[{"url":"media/Electronics/Pixel Louver Lights/20240401_103859.webp","fit":{"scale":1,"x":50,"y":63.7},"thumbnail":"media/Electronics/Pixel Louver Lights/20240401_103859-thumb.webp"},{"url":"media/Electronics/Pixel Louver Lights/20240329_170517.webp","fit":{"scale":1.4,"x":49.1,"y":43.2},"thumbnail":"media/Electronics/Pixel Louver Lights/20240329_170517-thumb.webp"},{"url":"media/Electronics/Pixel Louver Lights/20240322_115100.webp","fit":{"scale":1.3,"x":0,"y":46.7},"thumbnail":"media/Electronics/Pixel Louver Lights/20240322_115100-thumb.webp"},{"url":"media/Electronics/Pixel Louver Lights/20240324_152125.webp","fit":{"scale":1.25,"x":74.5,"y":27.6},"thumbnail":"media/Electronics/Pixel Louver Lights/20240324_152125-thumb.webp"},{"url":"media/Electronics/Pixel Louver Lights/Screenshot 2026-08-01 140532.webp","thumbnail":"media/Electronics/Pixel Louver Lights/Screenshot 2026-08-01 140532-thumb.webp"}],"files":[{"name":"Louver Light Model","url":"media/Electronics/Pixel Louver Lights/files/LouverLight.zip","description":"ZIP containing STL files for the pixel louver lights I designed and installed at Que Bueno Suerte! specifically for the curved liquor display install."}],"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>Pixel Louver Light (x96)</strong><br><em>12px • 0.2m</em></p><h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x1152)</strong><br><em>230.4m • WS2815 • RGB • 60px/m • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>BambuLabs • X1C • P1P</em></p><p><strong>PLA+ (Black)</strong><br><em>3 piece assembly</em></p><p><strong>Zipties (x2)</strong><br><em>Mini</em></p><p><strong>Hook-up Wire</strong><br><em>18awg</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>CAD</strong><br><em>SolidWorks 2022</em></p>","related":[{"name":"Bottle shelf","url":"#project/6808"}],"video":"","timestamp":"2026-08-01T15:14:28.453Z","id":"2052","order":4,"thumbnailFit":{"scale":1.2,"x":0.4,"y":41.6},"bannerFit":{"scale":1.15,"x":0.2,"y":40.8},"thumbnail":"media/Electronics/Pixel Louver Lights/20240322_115100-thumb.webp","specsData":[{"id":"f54da86a-4fe1-44b2-bd2b-5eb659821c68","title":"FIXTURES & FX","items":[{"id":"b5dc4ce7-2226-42e6-b051-722a12363dc5","name":"Pixel Louver Light","qty":"96","specs":"12px, 0.2m"}]},{"id":"1cb3620c-8933-4ee8-bc37-e23c521282aa","title":"Pixels & display","items":[{"id":"302af920-5e88-43c5-8b66-b46454de298e","name":"LED Pixels","qty":"1152","specs":"230.4m, WS2815, RGB, 60px/m, 12Vdc, "}]},{"id":"bebac490-6699-4056-84b8-c1e504fbcdde","title":"Fabrication & Materials","items":[{"id":"5992b5df-11f0-4f8b-bf05-75737be4204b","name":"3D Printer","qty":"","specs":"BambuLabs, X1C, P1P"},{"id":"fb8fce1c-dc12-445d-8c41-1cdb2c6a78e5","name":"PLA+ (Black)","qty":"","specs":"3 piece assembly"},{"id":"c406b472-7d39-493f-a8e3-9586c0858a24","name":"Zipties","qty":"2","specs":"Mini"},{"id":"ce8a574b-2d40-4453-9be3-021e3415410a","name":"Hook-up Wire","qty":"","specs":"18awg"}]},{"id":"89a1d670-470d-4d7d-96ba-c57eb4268343","title":"SOFTWARE & STACK","items":[{"id":"4860b126-f1f4-4eaa-98ce-4c99bc6745dc","name":"CAD","qty":"","specs":"SolidWorks 2022"}]}]},{"title":"Blackout Ceiling Tubes","category":"Lighting","image":"media/Lighting/Blackout Ceiling Tubes/20240619_123414.webp","thumbnailFit":{"scale":1.25,"x":58.5,"y":64.3},"bannerFit":{"scale":1.05,"x":100,"y":48.4},"description":"<p>The lowest point of an HVAC duct set the height of the whole rig. Black diffusion on black paint keeps it invisible until dinner service.</p>","longDescription":"<p>A central HVAC duct and a low mezzanine ceiling had already killed a previous lighting concept. I took the lowest point of that duct as a hard clearance limit and shot a laser level across the room. We hung a flat array of blackout pixel tubes. Standard milky white LED diffusion looks cheap when powered off. I used black diffusion against dark ceiling paint so the rig would visually disappear during the day.</p><p>We assembled the five-meter tubes on the floor. A friend helped me lift them onto two six-foot ladders, stringing them up and leveling them a few inches at a time. I originally ran wire inside the casing for power injection at the far end, but it drooped and cast shadows. I ripped the extra wiring out. The strips ran full white from a single end with zero color shift. Black diffusion eats light, but pixel rigs are usually too bright anyway. The physical dimming was exactly what we wanted.</p><p>Silent operation meant no fanned power supplies. I split eighteen waterproof units across three circuits. Booting them at once tripped the breakers instantly from inrush current. I wired generic relay PCBs into custom sequencer boxes to stagger the startup by five seconds. The hardware vanishes into the ceiling by afternoon, washes the tables in warm white for dinner, and runs heavy chases when the dance floor opens. The only repair since has been one strip with a single pixel stuck on.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Lighting Design","Pixel Mapping","Madrix","ELM","Capture","Custom Fabrication"],"gallery":[{"url":"media/Lighting/Blackout Ceiling Tubes/20240619_123414.webp","fit":{"scale":1,"x":50,"y":68.7},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20240619_123414-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20240619_123416.webp","fit":{"scale":1,"x":48.6,"y":69.4},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20240619_123416-th 45805.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Screenshot 2026-08-14 145805-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/IMG_20221221_111336_620.webp","fit":{"scale":1.35,"x":95.4,"y":41.5},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/IMG_20221221_111336_620-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20221215_153203.mp4","fit":{"scale":1.2,"x":69.9,"y":71},"poster":"media/Lighting/Blackout Ceiling Tubes/20221215_153203-poster.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/20221215_153203-poster-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20221219_140531.webp","fit":{"scale":1,"x":50.9,"y":7.6},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20221219_140531-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20221206_172954.webp","fit":{"scale":1,"x":46.6,"y":86.3},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20221206_172954-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Mez ceiling 1.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Mez ceiling 1-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/grey view 3.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/grey view 3-thumb.webp"}],"files":[],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>Short Tubes (4m) (x15)</strong><br><em>WS2814 strip (3.9m) • blackout diffusion • RGBW (3000k) • 60/m • 20px/m • 12Vdc • 78px</em></p><p><strong>Mid-length Tubes (4.5m) (x14)</strong><br><em>WS2814 strip (4.4m) • RGBW (3000k) • blackout diffusion • 60/m • 20px/m • 12Vdc • 88px</em></p><p><strong>Long Tubes (5m) (x7)</strong><br><em>WS2814 strip (4.9m) • RGBW (3000k) • blackout diffusion • 60/m • 20px/m • 12Vdc • 98px</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supply (x18)</strong><br><em>MEAN WELL • HLG-320H-12 • 12Vdc • 22A</em></p><p><strong>Pixel Decoder (x3)</strong><br><em>Advatek • R4D-S • 12 Universe</em></p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"PSU Sequencer","url":"#project/1430"}],"video":"","timestamp":"2026-08-01T17:08:27.719Z","id":"1612","order":1,"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20240619_123414-thumb.webp","specsData":[{"id":"67952058-5798-4307-af03-0253cab6f28d","title":"PIXELS & DISPLAY","items":[{"id":"2a0702a5-e7a9-4faa-ad42-960d524d0dbf","name":"Short Tubes (4m)","qty":"15","specs":"WS2814 strip (3.9m), blackout diffusion, RGBW (3000k), 60/m • 20px/m, 12Vdc, 78px, "},{"id":"957f614c-ad07-4890-a739-c71fd7771fb8","name":"Mid-length Tubes (4.5m)","qty":"14","specs":"WS2814 strip (4.4m), RGBW (3000k),  blackout diffusion, 60/m • 20px/m, 12Vdc, 88px"},{"id":"e3913113-4e56-4e37-8030-332b51dcf2dc","name":"Long Tubes (5m)","qty":"7","specs":"WS2814 strip (4.9m), RGBW (3000k) • blackout diffusion, 60/m • 20px/m, 12Vdc, 98px"}]},{"id":"89301d93-762c-4ebb-866e-5c5534a658db","title":"Power & Distribution","items":[{"id":"5427178b-70bc-4c60-91d3-9a017f246326","name":"Power Supply","qty":"18","specs":"MEAN WELL, HLG-320H-12, 12Vdc, 22A"},{"id":"a9bb2638-da4d-45e1-ac97-7a261ee4e1c4","name":"Pixel Decoder","qty":"3","specs":"Advatek, R4D-S, 12 Universe"}]}]},{"title":"LED PSU Boot Sequencer","category":"Tooling","image":"media/Fabrication/LED PSU Boot Sequencer/20221201_184622.webp","thumbnailFit":{"scale":1.4,"x":66.9,"y":46.3},"bannerFit":{"scale":1.6,"x":64.6,"y":54.8},"description":"<p>Eighteen power supplies booting at once trip a breaker every time. Three boxes of relays stagger them five seconds apart.</p>","longDescription":"<p>I learned about inrush current at Tracks. A large video wall I helped instal kept tripping the breakers every time the room powered up, and it took a while to figure out that the power supplies were pulling a huge spike for a fraction of a second before settling down. I have read the inrush line on every spec sheet since.</p><p>So when I needed to run eighteen power supplies for the blackout ceiling tubes, I knew what to do. Pulling more electrical circuits cost too much. Instead I built three 3D-printed sequencer boxes to stagger the load. Six supplies per box. Inside, a small power supply runs a relay board as a switch bank. Packing high-voltage lines, relays, and a nest of WAGOs into a sealed case took a few printed revisions before everything fit. Every connection uses a locking connector. Indicator LEDs on the front show which outputs are live, and status lights on the back confirm AC power.</p><p>The boxes sit on the black wall just above the rafters. Flipping the main breaker starts a cascade of relay clicks across the room, and every five to ten seconds another section of ceiling wakes up as its capacitors charge. When the cascade finishes, the whole rig runs silent.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","FDM 3D Printing","Power Distribution","Rapid Prototyping","SolidWorks"],"gallery":[{"url":"media/Fabrication/LED PSU Boot Sequencer/20221201_184622.webp","thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221201_184622-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221121_105826.webp","fit":{"scale":1.3,"x":72.1,"y":79.8},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221121_105826-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221121_105841.webp","fit":{"scale":1.2,"x":20.8,"y":94.4},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221121_105841-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221121_105849.webp","fit":{"scale":1.2,"x":14.9,"y":34.1},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221121_105849-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221121_190624.webp","fit":{"scale":1,"x":43,"y":36.2},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221121_190624-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221130_082043.webp","fit":{"scale":1,"x":52.7,"y":41.3},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221130_082043-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221020_204730.webp","thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221020_204730-thumb.webp"}],"files":[],"specs":"<h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>BambuLabs • X1C</em></p><p><strong>Black PLA+</strong><br><em>Duramic • 1.75mm</em></p><p><strong>Indicators</strong><br><em>AC power • relay board power • output power</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>SolidWorks 2022</strong></p>","related":[{"name":"Blackout ceiling","url":"#project/1612"}],"video":"","timestamp":"2026-08-01T21:44:42.857Z","id":"1430","order":0,"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221201_184622-thumb.webp","specsData":[{"id":"8007955d-c441-4a54-a15b-1a85e78c75ff","title":"FABRICATION & MATERIALS","items":[{"id":"f55b0ebc-640a-4b6d-add9-e55adaf8a988","name":"3D Printer","qty":"","specs":"BambuLabs, X1C"},{"id":"cc9711b4-4d88-4b54-8310-8c966324b71f","name":"Black PLA+","qty":"","specs":"Duramic, 1.75mm"},{"id":"782f1024-d07f-4270-9f1b-000755b90d48","name":"Indicators","qty":"","specs":"AC power, relay board power, output power"}]},{"id":"f1c2f9a6-2a5f-4e3f-8c6e-b49372c62e19","title":"SOFTWARE & STACK","items":[{"id":"4d077ec7-0718-4aec-8c77-5a9f1d4a555b","name":"SolidWorks 2022","qty":"","specs":""}]}]},{"title":"WiFi VIP Tables","category":"Fixtures","image":"media/Electronics/WiFi VIP Tables/Screenshot 2026-08-07 201527.webp","description":"<p>Thirty-two rotting tables, salvaged for their acrylic. The electronics live in soup containers from the kitchen.</p>","longDescription":"<p>Temple SF needed 32 illuminated VIP tables, but buying new plastic during the pandemic was too expensive. We had a stack of old ones, but the heavy MDF bases had spent years soaking up spilled drinks. The black acrylic tops were chipped into sharp points, and the hardwired wash strips were dead. The acrylic itself was still good, so we stripped them down to rebuild them.</p><p>My carpenter and I routed the acrylic channels deeper for new LED strips and cut a center path for the wiring. We rounded off the sharp edges across all 32 sheets. To replace the ruined MDF, we cut plywood bases, painted them black, and bolted on metal legs. Time got tight, and my 3D printer could not produce enclosures fast enough. I grabbed a stack of plastic soup containers from the kitchen and siliconed them to the underside of each table. They housed an ESP32 decoder and a lithium-ion battery, keeping the electronics safe from spills.</p><p>The operator gathered the batteries at the end of the night to charge them at the control rack. I mapped the tables into Madrix over wireless ArtNet. Running Wi-Fi through a crowded club is a fight against RF noise, but high-gain antennas kept the signal alive. I would have chosen legs with a wider base, since the tables could tip if someone leaned hard on the edge. But they salvaged our most expensive material and survived the crowd.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Custom Fabrication","ESP32","Hand tools","Madrix","Power tools","SPI","TCP/IP","Through-Hole Soldering","Pixel Mapping","Power Distribution","Wire-to-Board Soldering","Embedded Systems","Lighting Design","Repair"],"gallery":[{"url":"media/Electronics/WiFi VIP Tables/20210625_144028.mp4","poster":"media/Electronics/WiFi VIP Tables/20210625_144028-poster.webp","thumbnail":"media/Electronics/WiFi VIP Tables/20210625_144028-poster-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210519_113326.mp4","poster":"media/Electronics/WiFi VIP Tables/20210519_113326-poster.webp","thumbnail":"media/Electronics/WiFi VIP Tables/20210519_113326-poster-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210623_212915.webp","fit":{"scale":1.35,"x":10.3,"y":30.5},"thumbnail":"media/Electronics/WiFi VIP Tables/20210623_212915-thumb.webp"},{"url Pixels (x704)</strong><br><em>67.2m • SM16704 • 60LED/m • 20px/m • 12Vdc</em></p><h2>POWER &amp; DISTRIBTUION</h2><p><strong>Battery Pack (x32)</strong><br><em>Li-Ion • 12Vdc</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Microcontroller (x32)</strong><br><em>ESP32</em></p>","related":[{"name":"Immersive lighting","url":"#project/1"},{"name":"Temple SF control","url":"#project/8252"}],"video":"","timestamp":"2026-08-07T23:07:28.368Z","id":"496","order":8,"thumbnailFit":{"scale":1.3,"x":0,"y":30.9},"bannerFit":{"scale":1.25,"x":46.1,"y":49},"thumbnail":"media/Electronics/WiFi VIP Tables/Screenshot 2026-08-07 201527-thumb.webp","specsData":[{"id":"f4435fa0-366c-481e-880d-41ef96e0fb96","title":"Fixtures & FX","items":[{"id":"9e7cb0d3-7d04-4aa9-80c5-ec7952e7ba0d","name":"VIP Tables","qty":"32","specs":"22px, 2.1m, WiFI, acrylic, edge lighting"}]},{"id":"00123af1-75e4-4ade-bd8d-fe1249b4f3c1","title":"PIXELS & DISPLAY","items":[{"id":"ecfd6e34-aa45-429d-8140-c7f7542c998f","name":"LED Pixels","qty":"704","specs":"67.2m, SM16704, 60LED/m, 20px/m, 12Vdc"}]},{"id":"e07027c6-315b-4ae2-939a-4e463d4f6730","title":"Power & Distribtuion","items":[{"id":"2e676b74-dbb6-4611-a30c-d731df6df64b","name":"Battery Pack","qty":"32","specs":"Li-Ion, 12Vdc"}]},{"id":"1eb8722e-554d-46bd-bbbe-019fafbb79f1","title":"EmbedDED ELECTRONICS","items":[{"id":"5c45dec2-2210-43c8-ade6-c8de640eea74","name":"Microcontroller","qty":"32","specs":"ESP32"}]}]},{"title":"Glass VIP Wall","category":"Fixtures","image":"media/Electronics/Glass VIP Wall/Screenshot 2026-08-07 204525.webp","thumbnailFit":{"scale":1.35,"x":53,"y":100},"bannerFit":{"scale":1.1,"x":24.3,"y":62.6},"description":"<p>Hundred-pound glass panels, walked out on suction cups, to fit a salvaged pixel grid into a five-inch gap.</p>","longDescription":"<p>The glass mezzanine wall needed a pixel grid sized to the panel, and no such thing exists to buy. I built this one from salvaged parts. I found boxes of 24V waterproof LED strips buried under some stairs during lockdown. It was thousands of dollars of high-end product meant to replace a single dead strand. I gathered enough leftover Madrix Nebula decoders and power supplies to build a proper installation.</p><p>The glass panels weighed 100 pounds each. I bought industrial suction cups, got them over the lip, and walked them out by the corners to expose a five-inch working gap. I shot a laser level across the wall to set the rigid track, calculated the physical length of a single pixel, and set the vertical spacing to match exactly.</p><p>Voltage drop over a 20-meter run is inevitable. When I ran all channels at full white, the far end tinted red. I countered this by running an 18AWG power injection wire to the opposite end, tying the DC ( - ) lines together across the power supplies behind the last panel. The wall mapped cleanly, but it hit an operational reality. The venue never fixed the house lighting in that area, making our grid the primary light source for VIP. When the dancefloor hit a master blackout, the lounge plunged into pitch black. We had to isolate the mezzanine to ignore blackouts entirely so people could see their drinks.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Hand tools","Madrix","Pixel Mapping","Power Distribution","Power tools","TCP/IP","SPI","Wire-to-Board Soldering","Lighting Design"],"gallery":[{"url":"media/Electronics/Glass VIP Wall/VID-20210127-WA0002.mp4","fit":{"scale":1.3,"x":18.8,"y":100},"poster":"media/Electronics/Glass VIP Wall/frame-thumb-1786198770286.webp","thumbnail":"media/Electronics/Glass VIP Wall/frame-thumb-1786198770286-thumb.webp"},{"url":"media/Electronics/Glass VIP Wall/VID-20210127-WA0000.mp4","fit":{"scale":1.15,"x":92.2,"y":95.6},"poster":"media/Electronics/Glass VIP Wall/frame-thumb-1786198800149.webp","thumbnail":"media/Electronics/Glass VIP Wall/frame-thumb-1786198800149-thumb.webp"},{"url":"media/Electronics/ a/Art/Pixel Rocks/Screenshot 2026-08-08 133451.webp","description":"<p>The director wanted hand-held props that looked sharp enough to stone someone, but glowed from the inside.</p>","longDescription":"<p>A lighting designer friend needed internally lit rocks for a contemporary ballet. The artistic director wanted them sharp and jagged. They had to look like they could stone someone to death, but fit in one hand.</p><p>I hiked outside Denver and collected stones that fit the aesthetic and my 3D scanner. Scanning them let me scale the models up to the size of about a pineapple. I modeled a universal sled that locked into the base of any rock. A custom puck slid inside, holding the battery, the decoder, and the pixel tape. During the run, the live network choked the 2.4GHz decoders, causing some units to freeze on stage. I never used 2.4GHz for show control again.</p><p>The design worked because every part of it was modular. I printed the clear PLA shells at five percent infill to keep the brightness high, and built the internal hardware to slide out with a single threaded cap.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Blender","Custom Fabrication","ESP8266","FDM 3D Printing","Pixel Mapping","Rapid Prototyping","SPI","WLED","TCP/IP","ELM","3D Scanning","Lighting Design","Wire-to-Board Soldering","Power Distribution"],"gallery":[{"url":"media/Art/Pixel Rocks/20240316_154826.mp4","fit":{"scale":1.25,"x":7.2,"y":46.4},"poster":"media/Art/Pixel Rocks/frame-thumb-1786204679695.webp","thumbnail":"media/Art/Pixel Rocks/frame-thumb-1786204679695-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240316_160039.mp4","fit":{"scale":1.3,"x":3.5,"y":48.9},"poster":"media/Art/Pixel Rocks/frame-thumb-1786204756843.webp","thumbnail":"media/Art/Pixel Rocks/frame-thumb-1786204756843-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240320_214804.mp4","fit":{"scale":1.3,"x":0,"y":51.6},"poster":"media/Art/Pixel Rocks/frame-th m>puck • 15% infill</em></p><p><strong>PLA+ (clear)</strong><br><em>sled • rocks • 5% infill</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Harvested Athom PCB • WLED • 12Vdc</em></p>","related":[],"video":"","timestamp":"2026-08-08T15:03:36.390Z","id":"6179","order":3,"thumbnailFit":{"scale":1.1,"x":96.9,"y":52.3},"bannerFit":{"scale":1.1,"x":100,"y":51.1},"thumbnail":"media/Art/Pixel Rocks/Screenshot 2026-08-08 133451-thumb.webp","specsData":[{"id":"ae26563a-ed4d-4749-a149-e1d0940d92ab","title":"Fixtures & fx","items":[{"id":"9298f4f6-9ba6-46f3-aaab-f9e4b7224efc","name":"Pixel Puck","qty":"10","specs":"rgb, wireless, universal module"}]},{"id":"3bb3a574-1052-4c03-b949-234251a25e61","title":"pixels & display","items":[{"id":"5e44972c-2023-4a40-9118-2cfb7280bc16","name":"LED Pixels","qty":"68","specs":"ws2815, rgb, 12Vdc, redundant data"}]},{"id":"ae9d1e72-1202-4db2-a764-b22b391bbcf1","title":"Power & distribution","items":[{"id":"c4d6e1a9-c494-4e95-9576-cbbe7969de31","name":"Battery","qty":"1","specs":"Li-Ion, 12Vdc, 24000mAh"}]},{"id":"46ca0a74-ffee-45d4-a3a5-ad76898c7a44","title":"Fabrication & materials","items":[{"id":"6d239714-938b-40c0-a2e9-d5e2025d744c","name":"PLA+ (white)","qty":"","specs":"puck, 15% infill"},{"id":"7327d2ea-17bb-4425-9d35-5ec32748e83d","name":"PLA+ (clear)","qty":"","specs":"sled, rocks, 5% infill"}]},{"id":"f1c309b6-7074-4ecc-ac31-bbf53987087e","title":"embedded electronics","items":[{"id":"7b4f81f3-6b4d-4006-ba7a-f1635067cfa3","name":"Pixel Decoder","qty":"1","specs":"Harvested Athom PCB, WLED, 12Vdc, "}]}]},{"title":"Backboard","category":"Fixtures","image":"media/Electronics/Backboard/Gemini_Generated_Image_5l003m5l003m5l00.webp","thumbnailFit":{"scale":1,"x":30.2,"y":66.7},"bannerFit":{"scale":1,"x":76.6,"y":69.3},"description":"<p>Three days on an extension ladder, pulling thirty-pound plywood panels off a wall that was actively melting.</p>","longDescription":"<p>Cost was the absolute bottom line on the swept backwall, which ruled out new LED pixel panels before I even priced them. The existing rig was built from thirty-pound plywood panels carrying pixel modules, and I had to salvage it. I pushed all channels to full intensity to see what I was dealing with. It was an active fire hazard. Severed cables were shorting against the metal frame and melting. The previous installer misunderstood load calculations and wire gauges.</p><p>I ripped out the bad distribution. Getting to the hardware was worse than the electrical work. The wall curved into a sloped ceiling directly above the DJ booth. I spent three days perched twenty feet up an extension ladder footed on a concrete access ramp. Leaning backward against the curve, I pulled the heavy wood panels. The edges shifted and chipped every time a board came down. We pinched a wire replacing one of them and had to drop it a second time to fix the mistake.</p><p>I installed fused DC protection and ran fresh wire to the injection points. I mapped the data runs and swapped the dead modules. I calculated the new hardware so a full software output would only draw an eighty percent physical load. The old pixel wiring was thin and brittle, but tearing the entire system out would have doubled the timeline. The repaired panels went back up the ladder and survived the curved frame.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Hand tools","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Repair"],"gallery":[{"url":"media/Electronics/Backboard/20230209_185631.mp4","fit":{"scale":1.4,"x":18.4,"y":40.5},"poster":"media/Electronics/Backboard/frame-thumb-1786217258502.webp","thumbnail":"media/Electronics/Backboard/frame-thumb-1786217258502-thumb.webp"},{"url":"media/Electronics/Backboard/Gemini_Generated_Image_5l003m5l003m5l00.webp","fit":{"scale":1,"x":47.7,"y":80.5},"thumbnail":"media/Electronics/Backboard/Gemini_G cs/Backboard/received_1746845682384426-thumb.webp"},{"url":"media/Electronics/Backboard/received_500877822236168.webp","fit":{"scale":1.1,"x":47.5,"y":62.3},"thumbnail":"media/Electronics/Backboard/received_500877822236168-thumb.webp"}],"files":[],"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>Pixel Backboard</strong><br><em>36 x 40 pixel matrix</em></p><h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x1440)</strong><br><em>WS2801 • 12v</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supplies (x2)</strong><br><em>MEAN WELL • 12Vdc • 22A</em></p><p><strong>LED Decoder (x2)</strong><br><em>Madrix • Nebula</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>Pixel Control</strong><br><em>Madrix 5.x</em></p>","related":[{"name":"Temple Denver","url":"#project/4382"}],"video":"","timestamp":"2026-08-08T18:29:33.775Z","id":"3965","order":9,"thumbnail":"media/Electronics/Backboard/Gemini_Generated_Image_5l003m5l003m5l00-thumb.webp","specsData":[{"id":"bfbbf834-1718-489f-8233-34319655fe7c","title":"FIXTURES & FX","items":[{"id":"90ccdba1-c36e-4122-83f2-beb0cf06cc45","name":"Pixel Backboard","qty":"","specs":"36 x 40 pixel matrix"}]},{"id":"74dde7bc-2053-441c-982e-9d0acae9fe8e","title":"Pixels & display","items":[{"id":"5569d6fc-4ea8-4fcb-abe3-6689466d29db","name":"LED Pixels","qty":"1440","specs":"WS2801, 12v, "}]},{"id":"eaf57759-8eeb-45bb-a468-92ce9ddde9b5","title":"power & distribution","items":[{"id":"6966afed-1bcc-4b20-ac73-58e7be47e146","name":"Power Supplies","qty":"2","specs":"MEAN WELL, 12Vdc, 22A"},{"id":"99292e9d-980f-4d7e-a4f5-de69edd758ff","name":"LED Decoder","qty":"2","specs":"Madrix, Nebula"}]},{"id":"5022a6b0-6e68-41b5-933d-8e13988c2ea3","title":"Software & stack","items":[{"id":"4cde439b-f978-490b-8e16-f21a9db5aa8d","name":"Pixel Control","qty":"","specs":"Madrix 5.x"}]}]},{"title":"Entrance Hall","category":"Fixtures","image":"media/Electronics/Entrance Hall/VID_20190706_212708-poster.webp","description":"<p>A dead thirty-foot LED tunnel, gutted to raw copper and rebuilt inside walls that were glued shut.</p>","longDescription":"<p>A 30-foot LED tunnel woven through sheet metal and MDF does not have a replacement part number. The original entrance at Temple Denver was a rush job that slowly died. It was never meant to be serviced. Patching a failing rig is a waste of time, so I gutted the entire run down to the raw pixel strips.</p><p>Mid-week gave me a two-day window while the club was closed. Getting the walls open was a pain. I found hidden shims and double-sided tape holding the 3/4-inch panels together. My first plan was to pull the aluminum extrusions, but construction adhesive held them fast. I left the tracks in place and removed the old solder to get clean copper. I wired the data chain fresh and rebuilt the power distribution from the ground up. I balanced the load across two 24-volt power supplies above the ceiling. I tied the DC negative lines together to keep the data stable.</p><p>If I had built the hallway from scratch, I would have made proper access panels. Instead, I routed the new wires in a repeatable pattern and drove actual screws into the MDF so the walls could be opened later. The rebuilt rig lit the full run perfectly, surviving a heavy enclosure that was originally glued shut.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Hand tools","Madrix","Pixel Mapping","Power Distribution","SPI","TCP/IP","Repair","Power tools","Wire-to-Board Soldering"],"gallery":[{"url":"media/Electronics/Entrance Hall/VID_20190706_212708.mp4","fit":{"scale":1,"x":51.8,"y":43},"poster":"media/Electronics/Entrance Hall/frame-thumb-1786220301706.webp","thumbnail":"media/Electronics/Entrance Hall/frame-thumb-1786220301706-thumb.webp"},{"url":"media/Electronics/Entrance Hall/VID_20191113_153132~2.mp4","fit":{"scale":1,"x":58.4,"y":37.5},"poster":"media/Electronics/Entrance Hall/frame-thumb-1786228072983.webp","thumbnail":"media/Electronics/Entrance Hall/frame-thumb-1786228072983-thumb.webp"},{"url":"media/Electronics/Entrance Hall/IMG_20190701_235151.webp","fit":{"scale":1.15,"x":50.6,"y":38.6},"thumbnail":"media/Electronics/Entrance Hall/IMG_20190701_235151-thumb.webp"},{"url":"media/Electronics/Entrance Hall/IMG_20190701_213937.webp","fit":{"scale":1.65,"x":46.1,"y":3.7},"thumbnail":"media/Electronics/Entrance Hall/IMG_20190701_213937-thumb.webp"},{"url":"media/Electronics/Entrance Hall/IMG_20190701_182349.webp","fit":{"scale":1.2,"x":99.7,"y":21},"thumbnail":"media/Electronics/Entrance Hall/IMG_20190701_182349-thumb.webp"},{"url":"media/Electronics/Entrance Hall/VID_20180515_142329.mp4","fit":{"scale":1,"x":47.5,"y":100},"poster":"media/Electronics/Entrance Hall/frame-thumb-1786228003573.webp","thumbnail":"media/Electronics/Entrance Hall/frame-thumb-1786228003573-thumb.webp"}],"files":[],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x1017)</strong><br><em>Environmental Lights • strips • RGB • 24v • 7px/m</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supplies (x2)</strong><br><em>MEAN WELL • 24Vdc</em></p><p><strong>Pixel Decoder (x1)</strong><br><em>Madrix • Nebula</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>Pixel Control</strong><br><em>Madrix 5.x</em></p>","related":[{"name":"Temple Denver","url":"#project/4382"}],"video":"","timestamp":"2026-08-08T20:07:41.799Z","id":"5650","order":6,"thumbnailFit":{"scale":1,"x":50,"y":46.5},"bannerFit":{"scale":1,"x":49.1,"y":48.6},"thumbnail":"media/Electronics/Entrance Hall/VID_20190706_212708-poster-thumb.webp","specsData":[{"id":"daa98db8-4a17-45a5-ad9a-b0e13e2b4aa4","title":"PIXELS & DISPLAY","items":[{"id":"eac98089-efca-46c7-91f5-903eb1ecf39a","name":"LED Pixels","qty":"1017","specs":"Environmental Lights, strips, RGB, 24v, 7px/m"}]},{"id":"d0332395-4b84-4ddb-940c-a9c6e3d4801f","title":"POWER & DISTRIBUTION","items":[{"id":"1cb97795-a0ae-489a-85c8-395ac87b6a38","name":"Power Supplies","qty":"2","specs":"MEAN WELL • 24Vdc "},{"id":"5b12f841-e7ab-4d7a-99b2-06cc9d38a586","name":"Pixel Decoder","qty":"1","specs":"Madrix, Nebula"}]},{"id":"90d7b454-ae24-4eea-ad72-dafb85b72236","title":"Software & stack","items":[{"id":"d95f13d0-3376-4a3a-b6f1-582c31ebb636","name":"Pixel Control","qty":"","specs":"Madrix 5.x"}]}]},{"title":"Discobasket","category":"Fixtures","image":"media/Electronics/Discobasket/IMG_20171108_200749.webp","thumbnailFit":{"scale":1.15,"x":32.3,"y":44.1},"bannerFit":{"scale":1.1,"x":25.3,"y":40.3},"description":"<p>Six people dancing inside a metal cage will grab whatever is in reach. Aluminum-backed strips, hose clamps buried in hot glue, no sharp edges.</p>","longDescription":"<p>I had to design an LED strip that survives a crowd grabbing it all night without someone slicing their hands. I added armored pixel sticks to a metal basket for a dance platform in the middle of a nightclub floor.</p><p>I heatshrunk the strips to aluminum sticks. I secured them to the cage spokes with hose clamps and buried the hardware in hot glue. I built the basket in halves to fit it through the garage doors across the alley. I programmed the pixel map while it sat in pieces. Data hit a decoder under the deck through a cheap access point bridge or a hardline cable.</p><p>The square channel base eventually chewed through the wire insulation. Pull force ripped the solder pads, taking out a couple strips at a time until I spliced new ones in. But when half a dozen people packed inside the cage to dance, the armored sticks survived the crowd.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Custom Fabrication","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering","AC/DC Load Calc","Hand tools","Lighting Design"],"gallery":[{"url":"media/Electronics/Discobasket/IMG_20171108_200749.webp","thumbnail":"media/Electronics/Discobasket/IMG_20171108_200749-thumb.webp"},{"url":"media/Electronics/Discobasket/IMG_20171108_194451.webp","thumbnail":"media/Electronics/Discobasket/IMG_20171108_194451-thumb.webp"},{"url":"media/Electronics/Discobasket/20160129_091032.webp","thumbnail":"media/Electronics/Discobasket/20160129_091032-thumb.webp"},{"url":"media/Electronics/Discobasket/20160129_091056.webp","thumbnail":"media/Electronics/Discobasket/20160129_091056-thumb.webp"},{"url":"media/Electronics/Discobasket/0125161647.webp","thumbnail":"media/Electronics/Discobasket/0125161647-thumb.webp"},{"url":"media/Electronics/Discobasket/Disco Basket Programming~2.mp4","fit":{"scale":1.5,"x":48.5,"y":100},"poster":"media/Electronics/Discobasket/frame-thumb-1786319490474.webp","thumbnail":"media/Electronics/Discobasket/frame-thumb-1786319490474-thumb.webp"},{"url":"media/Electronics/Discobasket/0119161413.mp4","poster":"media/Electronics/Discobasket/0119161413-poster.webp","thumbnail":"media/Electronics/Discobasket/0119161413-poster-thumb.webp"},{"url":"media/Electronics/Discobasket/0115161627.webp","thumbnail":"media/Electronics/Discobasket/0115161627-thumb.webp"},{"url":"media/Electronics/Discobasket/20160114_162456.webp","thumbnail":"media/Electronics/Discobasket/20160114_162456-thumb.webp"},{"url":"media/Electronics/Discobasket/0114161357.webp","thumbnail":"media/Electronics/Discobasket/0114161357-thumb.webp"}],"files":[],"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>LED Strips (x26)</strong><br><em>28px • 0.94m • white heat shrink diffusion</em></p><h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x728)</strong><br><em>24.3m • WS2812B • 30LED/m • 30px/m • 5Vdc</em></p><h2>POWER &amp; DISTRIBTUION</h2><p><strong>Power Supply (x1)</strong><br><em>5Vdc</em></p><p><strong>Pixel Decoder (x1)</strong><br><em>SanDevice E682</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>Madrix 3.6</strong></p>","related":[{"name":"Tracks Danceclub","url":"#project/3671"}],"video":"","timestamp":"2026-08-08T20:42:07.206Z","id":"4903","order":10,"thumbnail":"media/Electronics/Discobasket/IMG_20171108_200749-thumb.webp","specsData":[{"id":"67f54c91-bd1c-4ffd-ae5d-0fd838a0c74b","title":"Fixtures & FX","items":[{"id":"bfc7bb02-9ff4-4343-8eb9-60abd437e1f6","name":"LED Strips","qty":"26","specs":"28px, 0.94m, white heat shrink diffusion"}]},{"id":"673875ef-964d-4ffb-a46d-f4ece4705b73","title":"PIXELS & DISPLAY","items":[{"id":"827f2737-68d1-464e-bbea-3cce0c7b777e","name":"LED Pixels","qty":"728","specs":"24.3m, WS2812B, 30LED/m, 30px/m, 5Vdc"}]},{"id":"cd7f534e-b11e-4223-9ba0-b1a2b145a600","title":"Power & Distribtuion","items":[{"id":"3ca7dfff-0e7b-46d9-b375-b634214903c5","name":"Power Supply","qty":"1","specs":"5Vdc"},{"id":"e2062ed8-128f-41aa-9889-532e3038e4fa","name":"Pixel Decoder","qty":"1","specs":"SanDevice E682"}]},{"id":"8ec19cf7-57f4-4559-81df-df917ece2a07","title":"Software & Stack","items":[{"id":"bfbb1cbd-595d-4486-a758-6aee640c1073","name":"Madrix 3.6","qty":"","specs":""}]}]},{"title":"Pyramid Steps","category":"Lighting","image":"media/Lighting/Pyramid Steps/20240713_100537.webp","thumbnailFit":{"scale":1.25,"x":33.4,"y":25.9},"bannerFit":{"scale":1.3,"x":54.2,"y":21.5},"description":"<p>Fixing the voltage drop meant sitting on a twelve-foot ledge over the tile with a battery-powered soldering iron.</p>","longDescription":"<p>The decorative pyramid above the kitchen sat twelve feet over the dining room tile. I wanted to wash the steps with pixel tape. Guests taking the stairs to the second floor had a clear view down the side. I refused to let the hardware show during the day, but it needed enough throw for a clean wash. I mounted 45-degree aluminum extrusions under the lip of each step. To make the track disappear, I pulled a paint match with a digital sensor, printed custom jigs, and sprayed the metal in batches.</p><p>The layout wrapped two sides of the pyramid. I tucked fanless power supplies in the corner, wired to receivers on the main rack. Firing it up revealed a voltage drop. The bottom steps shifted color. Fixing it meant adding power injection at the far ends. I sat on the twelve-foot edge, splicing wire over the tile floor with a battery-powered iron. I bundled the new lines in black wire wrap, leaving a clean arc at every corner.</p><p>The painted track vanished during the day. At night, the steady voltage let the server push smooth, flowing shapes across the steps. The top of the kitchen rolled with slow waves, and on certain patterns, the pyramid looked like it was on fire.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Pyramid Steps/20240708_123442~2.mp4","fit":{"scale":1.5,"x":16.2,"y":35},"poster":"media/Lighting/Pyramid Steps/frame-thumb-1786279546039.webp","thumbnail":"media/Lighting/Pyramid Steps/frame-thumb-1786279546039-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20250128_112618.mp4","poster":"media/Lighting/Pyramid Steps/20250128_112618-poster.webp","thumbnail":"media/Lighting/Pyramid Steps/20250128_112618-poster-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20250128_112910.mp4","poster":"media/Lighting/Pyramid Steps/20250128_112910-poster.webp","thumbnail":"media/Lighting/Pyramid Steps/20250128_112910-poster-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240713_100537.webp","thumbnail":"media/Lighting/Pyramid Steps/20240713_100537-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240713_100611.webp","thumbnail":"media/Lighting/Pyramid Steps/20240713_100611-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240708_122719.mp4","fit":{"scale":1.2,"x":100,"y":42},"poster":"media/Lighting/Pyramid Steps/frame-thumb-1786279634658.webp","thumbnail":"media/Lighting/Pyramid Steps/frame-thumb-1786279634658-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240708_112007.webp","thumbnail":"media/Lighting/Py ms":[{"id":"f1213d63-cbe2-46fe-9902-ff17b2bb87a9","name":"LED Extrusion","qty":"87.5m","specs":"45deg, 12mm width, opal diffusion, color paint matched, "}]},{"id":"3b03b67e-8ee3-4958-b32c-c831dcfcf584","title":"Software & stack","items":[{"id":"85fe3474-8606-47db-aa4f-558177829e48","name":"Pixel Control","qty":"","specs":"Madrix 5.x"}]}]},{"title":"Tracks Discotheque","category":"Lighting","image":"media/Lighting/Tracks Discotheque/FB_IMG_1561801234515.webp","description":"<p>Twenty-six vintage scanners surrounding the crowd, kept alive by cannibalizing dead units in the basement shop.</p>","longDescription":"<p>Tracks was one of the last classic discotheques left in the country. The design rule was simple: surround the crowd, and keep the focus off the DJ booth. To put the audience directly inside the show, I stacked 26 vintage scanners across three layers in the ceiling. Twelve Trackspot 1s circled the dance floor. Eight Trackspot 2s flanked the sides in straight lines, and six Martin MX10s hung in tilted triangles overhead. I mixed them with pinspots, mirror balls, DataFlash strobes, and modern LEDs, all run from an old GrandMA Light Gen 1 console. Its motorized faders and audio BPM detection were exactly what the room needed.</p><p>For an unconventional layer, I built a dynamic truss warmer. I took leftover raw pixel PCBs from the Lobby Wall install, stuck adhesive zip-tie mounts to the back, and strapped them to the bottom pipe of the triangular truss. I aimed them straight up. The point was to illuminate the metal, not light the crowd. If I pointed them down, the bare diodes would sit directly in the patrons' line of sight.</p><p>The contrast between the hardware defined the look. Modern moving heads provided the brightness, but the 90s/2000's scanners were incredibly fast and locked onto a beat. The problem was keeping them alive. Stepper motor brakes failed. Scanners would start stuttering during slow movements and lose their tracking. The circuit boards were at least a decade obsolete, so we cannibalized dead units in the basement shop, replacing blown capacitors and motor drive chips to keep the rig running.</p><p>I expect a programmed sequence to look the same every time I recall it. With vintage mechanics, that was a constant fight. When a scanner lost its position mid-show, I would drop its intensity to zero and intentionally slam the mirror into its hard stops to force it back into alignment. When the room was packed and the console locked onto the beat, the sheer speed of those old scanners firing overhead proved why the classic club format worked.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Custom Fabrication","DMX","Hand tools","Lighting Design","MA","MIDI","Power Distribution","TCP/IP","SPI","Through-Hole Soldering","Repair"],"gallery":[{"url":"media/Lighting/Tracks Discotheque/20150922_115556-EDIT.webp","fit":{"scale":1.3,"x":36.1,"y":34.4},"thumbnail":"media/Lighting/Tracks Discotheque/20150922_115556-EDIT-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/20150918_124128.webp","fit":{"scale":1.25,"x":78.3,"y":45.4},"thumbnail":"media/Lighting/Tracks Discotheque/20150918_124128-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/20150922_115652.webp","fit":{"scale":1.45,"x":23.3,"y":57},"thumbnail":"media/Lighting/Tracks Discotheque/20150922_115652-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/20150922_115804.webp","fit":{"scale":1.35,"x":54.5,"y":16.8},"thumbnail":"media/Lighting/Tracks Discotheque/20150922_115804-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/20150922_143314.webp","fit":{"scale":1.15,"x":66.1,"y":46.1},"thumbnail":"media/Lighting/Tracks Discotheque/20150922_143314-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/20150922_120016.webp","fit":{"scale":1.65,"x":56.6,"y":5},"thumbnail":"media/Lighting/Tracks Discotheque/20150922_120016-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/2015 8dea4b","title":"COMPUTE & CONTROL","items":[{"id":"8ac8ec48-2eef-402a-86c6-2048d171753d","name":"GrandMA Lite Gen1","qty":"1","specs":"lighting console, 4 universe,"}]}]},{"title":"Remote Fill Fog Jets","category":"Lighting","image":"media/Lighting/Remote Fill Fog Jets/frame-thumb-1786744075304.webp","thumbnailFit":{"scale":1,"x":95,"y":34.7},"bannerFit":{"scale":1,"x":48.2,"y":34.6},"description":"<p>Fifty-five gallons of fluid pumped into the ceiling to fake a cryo blast. It worked. The poles got slick.</p>","longDescription":"<p>After Denver cracked down on CO2 permits, securing clearance for an indoor cryo system became legally impossible. I adapted six Antari fog jets using fast dissipating fluid to simulate the massive cold blast the client wanted. With 16ft ceilings, staff couldn't reach them for manual refills. I set up a 55 gallon drum in the dressing room. Two ground pumps pushed fluid to two header tanks in the ceiling, feeding three jets each.</p><p>The 30 pound jets lacked a built in way to hang upside down. I built adjustable mounts using strut channel L-brackets and bolted them to the ceiling grid from a scissor lift. They required new dedicated circuits and remote booth switches. During the initial power up, one header tank started pouring fluid from the ceiling. A factory float valve was wired backward, signaling the pump to continue filling an overflowing tank. I sprinted to the dressing room to kill the power, then pulled the tank down for a replacement.</p><p>I patched the rig into their ChamSys console. The wash LEDs built into the jets colored the blast and sold the cryo illusion. It worked exactly as intended mechanically, but the vapor condensed on the stage poles. The steel became incredibly slick. The dancers commented, and the only remaining option was for the staff to wipe the poles down between sets.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","DMX","Hand too ulted ceilings. The top is solid alabaster. The original contractors wired the low-voltage LEDs using wire nuts. The connections failed, leaving dead spots across the stone. I wanted to install addressable pixels, but the venue doesn't close. I had a six-hour window each morning to finish one section before the 3 PM open.</p><p>Every day, I sliced the old adhesive and lifted a piece of stone. I stripped the dead tape, installed narrow 12-volt pixels along the edges, and sealed the alabaster down with quick-dry silicone just before the bartenders arrived. The center section was worse. A 200-pound acrylic table wrapped around a support beam. I used spreader bars to lift it, unbolted the legs, and slowly inched the acrylic onto an adjacent table so it wouldn't crack. I ran new DC wire through the sheet metal studs and hid waterproof power supplies behind the kickers.</p><p>For weeks, I locked the finished sections to a static warm white to hide the construction. When the bar finally came online, my Madrix patch wasn't wide enough for a continuous 1500-pixel sweep. I stacked the strips in Z-layers and used fluid effects with mirroring to hide the seams. The alabaster was originally meant for a uniform white. Hitting it with dynamic color created deep internal gradients across the stone.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","Repair","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Alabaster Bar Top/20250225_102012.mp4","fit":{"scale":1.3,"x":48.8,"y":14.8},"poster":"media/Lighting/Alabaster Bar Top/20250225_102012-poster.webp","thumbnail":"media/Lighting/Alabaster Bar Top/20250225_102012-poster-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20250303_144119.webp","fit":{"scale":1,"x":53,"y":24.3},"thumbnail":"media/Lighting/Alabaster Bar Top/20250303_144119-thumb.webp"},{"u my toe.</p>","longDescription":"<p>The original lighting behind the bar was wired like a house. Someone laid a row of white LED modules flat on the floor, hoping the light would bounce through thick amber acrylic. There were nine of these kicker panels at Que Bueno Suerte, built from plywood and weighing 25 pounds each.</p><p>I pulled them down, repaired the damaged wood, and built custom neon flex using square tube and WS2814 pixels. I siliconed the flex along the waveform cuts on the back of the acrylic and taped it until it cured.</p><p>Because I was also lighting the alabaster bar top above, I had to keep pulling the kickers back off. Getting them back in was a physical fight. I had two inches of clearance blocked by a steel rail. I wedged my heel on the rail, pried a 25-pound sheet up with my toe, and disconnected leads blind with my free hand. I dropped two panels doing this. The impact ripped the silicone right off the back. I remounted the flex with industrial tape on the fly.</p><p>When I finally powered the rig up, the physical materials dictated the programming. The amber acrylic completely ate the blue spectrum. I dropped blue from the palette entirely. I built a series of slow sweeps using only red, green, and warm white, giving the lower bar a heavy, saturated accent.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Bar Kicker/20250213_105836.mp4","fit":{"scale":1,"x":50,"y":42.1},"poster":"media/Lighting/Bar Kicker/frame-thumb-1786735672995.webp","thumbnail":"media/Lighting/Bar Kicker/frame-thumb-1786735672995-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241023_133244.mp4","fit":{"scale":1.3,"x":80.2,"y":46.7},"poster":"media/Lighting/Bar Kicker/frame-thumb-1786735695778.webp","thumbnail":"media/Lig
