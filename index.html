            "image": "media/Apps/Portfolio CMS/Screenshot 2026-07-25 181136.webp",
            "description": "<p>A custom local content management system that generates the fully static React portfolio you are viewing.</p>",
            "longDescription": "<p><strong>Portfolio CMS</strong> is a bespoke local content management system designed to streamline personal website updates without the overhead of a traditional database or paid hosting platform. The primary goal is to provide a rich visual editing environment on a local machine that ultimately outputs a fully static, single-page HTML file. What sets this architecture apart from standard platforms is its zero-runtime philosophy and self-referential nature: the very website you are currently browsing was generated by this software. Instead of relying on a live backend or fetching data from an API, the CMS injects all text and media data directly into the React site template as an embedded JSON block. This approach eliminates server costs, removes database maintenance, and guarantees instantaneous load times for the end user.</p><p>The authoring workflow operates entirely through a lightweight Node and Express server running locally. Users manage content via a custom vanilla JavaScript admin panel, which features a drag-and-drop interface for ordering projects and integrating YouTube previews. When media is uploaded, an automated processing pipeline takes over. It converts legacy image formats to optimized WebP files, applies necessary EXIF rotation fixes, and automatically routes the assets into category-specific folders. Once the content is ready, the user triggers a publish script that merges the local JSON data files with the front-end template, generating a single, self-contained HTML file that can be pushed directly to GitHub Pages.</p><p>The underlying technical engine balances a robust local backend with an exceptionally lean production frontend. The local server utilizes Express for routing and file management, paired with Sharp for high-performance image processing. The administrative interface is styled with Tailwind CSS and uses Quill for rich text formatting. For the live site, React 18 and Babel run directly from a CDN, parsing the embedded JSON payload upon loading. This complete decoupling of the authoring environment from the public-facing deployment results in a highly secure, maintainable, and cost-effective personal portfolio system.</p>",

            "image": "media/Lighting/Immersive Dance Lighting Rig/20210516_134200.webp",
            "description": "<p><strong>Temple Nightclub | San Francisco </strong>- The main room remodel at Temple San Francisco wraps a 208V curved video ceiling and 10 custom pixel pillars into a flat-black, switched-relay infrastructure built across a two-year pandemic shutdown.</p>",
            "longDescription": "<p>The main room at Temple Nightclub in San Francisco required a dense hybrid lighting, pixel and video rig that could vanish entirely into the dark when unlit. I designed the system around a curved video ceiling wrapping behind the DJ, 10 custom LED pixel pillars, beams, wash's, profiles, all built in flat black. Before aesthetic integration could even start, the physical ceiling forced a massive life-safety detour. Because the curved video wall blocked standard fire suppression coverage, I brought in a fire crew to reroute the sprinklers both above and below the solid ceiling plane using side sprayers with a 15 ft reach. When we found the main sewer drain blocked, we had to run the drainage above grade through an alley test valve and cut in a new low-point basement drain just to clear the system.</p><p>Powering that density without burning equipment lifespan meant overhauling the venue's electrical capacity with new 400A and 200A services. I split the load across two new panels: 24 circuits of 208V on twist-lock connectors dedicated exclusively to the video ceiling, and 60 circuits of standard 120V Edison for the lighting. Rather than relying on independent wall switches, I wired the entire rig onto switched relays grouped in clusters of 4. That setup gave us centralized shutdown so fixtures would not sit sucking dust and burning hours during dark days, while hardwired house lights let staff handle maintenance without booting the show systems.</p><p>What was supposed to be a three-month build turned into a two-year pandemic ordeal where I cycled through three separate crews and stepped up to manage electricians, plumbers, and carpenters directly. The hardest recurring fight was not mechanical, but restraint. The owner and creative director wanted every fixture and screen blasted at 100% all the time. I argued that crowding that many lights into a small room is about having angles and combinations, like a single-color sweep or white eggbeater prisms, not raw brightness. When we finally opened and they tested that full-blast look on the crowd, the patrons rejected it within 10 minutes. When we ran the rig my way, linking the Resolume and Madrix engines across the ceiling, pillars, and scrap-built VIP tape walls, the entire room lit up on the first try without a single glitch.</p>",

            "description": "<p>I built a desktop display stand to house and illuminate a friend’s Emmy without melting the PLA+ enclosure.</p>",
            "longDescription": "<p>An old coworker from my Tracks days won an Emmy and asked for a custom display. We used to work together when he was a bartender, so he knew my lighting background. I built him a desktop rig that scaled ballet lighting principles into a PLA+ enclosure.</p><p>The stand runs 512 addressable WS2815 LEDs across 7 data lines, driven by a Wasatch Pixels Basic Eight controller hidden inside the base. There are 3 boom towers per side with frosted lenses that arch back from downstage to upstage, while 45 deg wall washers sit recessed along the outer edges. A black and white film strip lines the bottom, printed in dual materials for diffusion and masking. The curved backdrop was too large for a single Bambu Lab print, so I built it in modular sections and turned the seams into an exaggerated surface texture.</p><p>Packing 144/m density LEDs into closed plastic is basically building a slow toaster. To keep heat from destroying the display from the inside out, I locked the current limit to 3A at 12V in WLED before I powered it on for the first time. I programmed the fixture in my dark apartment. When I set the Emmy on the pedestal, the reflective gold finish mirrored the light sources more than it absorbed the illumination, creating a warped mirror effect across the metal.</p>",

            "image": "media/Apps/LithoLab/image2.webp",
            "description": "<p>A client-side web application that generates multi-color lithophanes in custom shapes with an exportable border for 3D printing.</p>",
            "longDescription": "<p>Four-color generators output rectangular prints and turn skin tones into magenta splotches. I wanted multi-color prints in custom shapes with an independent border, so I ported the PIXEStl engine to run client-side in a browser. Hosting the application on GitHub Pages kept it lightweight without server overhead.</p><p>Running mesh processing locally hit strict cache limits in the browser immediately. Early prints on a Bambu Lab X1C also exposed a persistent micro-gap along the right edge between the lithophane and its border, which took several of failed attempts to eliminate. I stripped the calibration tools out of the main application and built LithoPalletGen as a standalone utility to keep the primary interface clean. This companion app handles color mapping for any filament palette, extending past 4 colors to fix the banding on faces.</p><p>My own printer runs an 8 color setup across 2 AMS2 units, but the software supports any palette size. Once calibrated and backlit, the physical prints match the source photos.</p>",

            "description": "<p>A browser-based card game with 4 prompt decks, built with local save states for video calls.</p>",
            "longDescription": "<p>Unfold started as a quick prototype on Lovable to generate conversation cards for video calls. The game runs 4 prompt decks across 3 play modes to move discussions past routine small talk. Since the app needed no user registration or backend databases, paying for a subscription platform made no sense. I pulled the codebase into a dedicated GitHub repository and hosted it statically on GitHub Pages.</p><p>To avoid server costs, I used Cursor to build a local save-state layer using React Hooks and browser storage. That setup tracks previously seen cards and stores custom decks directly on the client. Built with Tailwind CSS and Radix UI primitives, the interface handles deck combining and card draws without dropping state.</p>",

            "image": "media/Art/Pixel Pyramid/20230717_154820.webp",
            "description": "<p>Trapped LED heat inside a sealed, 3 material PLA+ pyramid print required software current limiting to prevent structural melting.</p>",
            "longDescription": "<p>Getting crisp pixel isolation without light bleed across an internally divided pyramid required printing the entire sculpture as a single piece. Each cell needed a black core to block light from adjacent shafts, white walls to bounce illumination upward, and a frosted PLA+ shell for diffusion. Building that geometry without manual post-processing meant committing to a 1 to 3 day continuous print cycle on a Bambu Lab X1C, with 3 filament swaps on every single layer and a mountain of purge waste.</p><p>Trapped LED heat nearly killed the design during burn-in testing. I lifted the sculpture after a long run and accidentally mushed the softened grid with my thumb. Venting the back enclosure helped, but drilling holes into the frosted top shell would have ruined the display.</p><p>To keep the structure solid without sacrificing visual punch, I swapped the hardware to 12V WS2815 matrices and set a 1A current limit in WLED. Keeping the diodes over 1 cm from the surface eliminated visible hotspots while letting the grid show through the frost. The finished piece hung at Glow Lounge in Denver and ran for days at a time without warping, becoming the foundation for a fabrication process I still use.</p>",

            "image": "media/Art/Pixel Mini Pyramid/20230726_201532.webp",
            "description": "<p>An 8x8 pixel matrix desk lamp powered over 5V USB-C with a scannable QR code base.</p>",
            "longDescription": "<p>Stepping down from my 16x16 matrix to an 8x8 desk piece meant solving a packaging problem. I modeled the Pixel Mini Pyramid in SolidWorks and Blender around an ESP32 running WLED on 5V USB-C power. The base doubles as a scannable QR code that links to my site.</p><p>Squeezing 64 LEDs into the small footprint left very little room for hardware. The USB-C port wanted to push back into the case whenever I plugged a cable in, and closing the shell kept crushing the internal wiring. It took several 3D printed iterations and test fits to anchor the controller securely and route the leads cleanly.</p><p>A short throw distance usually creates hotspots. I used a frosted diffusion layer over white cell walls to break up the light, and printed the case in 3 materials on an X1C. A few friends and family have them on their desks now, and the QR code base still scans on the first try.</p>",

            "title": "Pixel Plane Warp",
            "category": "Art",
            "image": "media/Art/Pixel Plane Warp/20230719_221111.webp",
            "description": "<p>By combining black light-isolation walls with reflective white cell linings and frosted diffusion, this sweeping surface installation achieves sharp, vibrant patterns at low operating temperatures and current limits.</p>",
            "longDescription": "<p>I destroyed an early print trying to push enough light into the high corner of the wave. The piece is a subdivided grid with a sweeping surface distortion that terminates in sharp points. Because the peak sits far above the LEDs, lighting the far corners required running the strips at full brightness. The trapped heat ruined the print. Plastic and hot LEDs do not get along.</p><p>I modeled the unit in SolidWorks for dimensional accuracy. A Bambu Lab X1C printed the unified model with black walls to isolate each light channel. For the final version, I lined the cells in white and added a frosted layer. That combination let me cap the WLED output on the ATHOM ESP8266 controller to a 1a limit at 12vdc without losing clarity.</p><p>It ended up on the ceiling at Glow Lounge for a while. In a dark room, the black walls disappear and leave only the distorted pattern floating overhead. The simple geometry did the work without needing to fight for brightness.</p>",

            "id": "8252",
            "timestamp": "2026-01-13T00:14:02.780Z",
            "title": "Main Room - Temple SF",
            "category": "Integration",
            "image": "media/Integration/Main Room - Temple SF/banner.webp",
            "description": "<p><strong>Temple Nightclub | San Francisco</strong> - Routing a three layer club rig through an inherited lighting console to survive single operator control.</p>",
            "longDescription": "<p>The owners at Temple San Francisco wanted 1 person to operate the lighting, video, and pixels in the main room simultaneously. That was never going to work with 2 hands, especially since we were stuck with the Road Hog 4 that came from the last rig. It lacked the routing capability to act as a central hub. Releasing a DMX overwrite on that console took a macro requiring dozens of screen presses. That cost several seconds, which meant missing the drop on any heavy track.</p><p>I bypassed the console entirely by routing Art-Net out of Resolume and the Hog into Madrix. I merged them using highest takes priority (HTP) on the RGB channels across 8 universes of sACN. That gave instant control back and forth just by blacking out 1 system. I also routed the video so a clip on the ceiling sliced across the main screens, overrode console colors, and drove the pillar pixels. Mask patterns kept the intensity in check. Behind the booth, I built a dedicated Resolume server with RAID6 SSDs to push simultaneous 4K layers, and we installed 400 A and 200 A electrical services to power the room. My crew built wireless receivers using ESP32s for the acrylic VIP tables and I installed a pixel wall on the mezzanine for matching ambiance.</p><p>I tore the pixel mapping down to the ground 6 times before I got all 3 systems talking to each other clean. The first night they fired together without tearing, I got goosebumps. But my control scheme was too ambitious. I installed a 65 in touchscreen running OSC Pilot to handle signal routing and live previews. It technically worked, but live operation under pressure is a different beast. The operators ripped the screen out after a few months and went back to MIDI controllers.</p><p>The demand for 1 operator survived for slow nights. Using a global fader for blackouts and the video routing from the ceiling, 1 person could run the whole room from a couple of controllers. But for busy nights and headlining DJs, the reality of the rig won out. They put 2 operators in the booth.</p>",

            "id": "9517",
            "title": "Field Solder Station",

            "image": "media/Fabrication/Field Solder Station/20250317_180657.webp",
            "description": "<p>A portable, field soldering station designed to streamline complex live entertainment installations.</p>",
            "longDescription": "<p>The field solder station is a highly compact, tool carrier engineered to solve the logistical challenges of on site LED installations. Working in unconventional locations like high ladders or cramped spaces under a stage requires immediate access to tools without the burden of a bulky bench setup. This solution differentiates itself by consolidating an entire soldering toolkit into a single portable chassis driven by a standard USB PD battery bank.</p><p>This tool emerged from an iterative prototyping process tested directly in the field during a major San Francisco nightclub installation. Initial concepts explored integrated batteries and complex wiring before the design converged on a simplified approach to maximize reliability and reduce weight. The final iteration logically organizes a TS100 or TS101 iron, solder spool, a bottle of flux, desoldering pump, wick, wet and wire sponges, and rubber feet into an optimized spatial layout.</p><p>I designed the chassis in SolidWorks to tightly pack the required tools into a minimal footprint. Fabricated from PLA using Bambu Lab 3D printers, the structure leverages precision tolerances to secure mechanical hardware like the dual helping hands through a robust friction fit. This precise 3D modeling eliminated the need for secondary mechanical fasteners, resulting in a streamlined and self contained system that reliably supports mobile fabrication work.</p>",

            "id": "9469",

            "category": "Circuits",
            "tags": [

            "image": "media/Electronics/LED Pixel Panel/20200910_134441.webp",
            "description": "<p><strong>Temple Nightclub | San Francisco</strong> - With eight feet from tile to joists and a basement ceiling gutted to the wood, we bolted custom LED dancefloor boards directly to aluminum T-track to build an array under an inch thick.</p>",
            "longDescription": "<p>We ripped out and rerouted the fire suppression system and two layers of ceiling drywall just to buy a little breathing room. From the tile floor to the bottom of the wooden joists was exactly 8 feet, and every 1/4\" mattered. Half the joists up there were broken anyway, so I had those fixed and the others restructured to push electrical, data, and HVAC down the runs of the room in line with the pillars, leaving the center in between clear.</p><p>We needed a rigid, identical grid that could hold a diffuser at an even distance without sagging. Strips droop, and wiring them is a mess. Large, cheap rigid PCBs are a good solution, so we took LED dancefloor boards and had the manufacturer alter the pixel spacing, enlarge the mounting holes, and swap in 90-degree headers. We bolted them straight into aluminum T-track mounted to the ceiling infrastructure, compressing a 24-volt WS2818 pixel matrix into a vertical profile under an inch.</p><p>I never actually saw it powered on overhead. By the time the basement was ready for the hang, I had hit my breaking point with the remodel and walked away. I had completed the upstairs main room immersive dance lighting rig during the COVID-19 pandemic and had designed and procured the parts for the basement. I pixel-mapped the array flat across a sea of road cases in the unfinished basement, proved it worked, and handed the plans off to my crew to finish the hang.</p>",

        {

            "image": "media/Electronics/LVL/IMG_20191009_231844.webp",
            "description": "<p><strong>Temple Nightclub | Denver</strong> - I salvaged 8 dead pixel runs from ruined floor channels and rewired them for 3D voxel mapping.</p>",
            "longDescription": "<p>When I walked into LVL, the side room at Temple Denver, the lighting rig was dead or stuck on solid blue. Someone had installed unsealed channels in the floor, and the wood support strips had absorbed months of spilled drinks, mop water, and sewage backups until the diffusion caved in and shattered. Even the foam tape holding the strips smelled like club funk. The EnvironmentalLighting pixel tape itself was expensive and salvageable, so I cut out the shorted sections, scrubbed the tracks, and built new structural support out of acrylic.</p><p>Wiring 16 strip runs across a room requires heavy power injection to stop voltage drop. My first attempt was immediately unstable. I ran DC wire in parallel and tied the negative leads together back in the supply room, which wasn't sufficient and triggered ground loop flicker across part of the system. The fix was coupling the negative leads close to the pixels above the dancefloor in addition to at the power supplies. The 12V pillar modules also fought me because of undersized wire, so I added more injection points and ground jumpers between sections until the signal stabilized. The ceiling and floor ran on 24V tape and behaved once the grounds were tied overhead.</p><p>With the power and data lines stable, I mapped all 16 floor and ceiling runs plus the pillars into a 3D voxel setup. The room runs almost entirely on those pixels, so getting the hardware clean mattered. Now the control system drives spatial sweeps through the floor, pillars, and ceiling without a single drop.</p>",

        {
            "id": "4939",
            "title": "MIRUS",

            "image": "media/Lighting/MIRUS/IMG_20180614_235653.webp",
            "description": "<p><strong>Mirus Art Gallery | Denver </strong>- I wired an RGBW wash lighting system into hanging wooden baffles 12 ft above MIRUS Art Gallery.</p>",
            "longDescription": "<p>On my first install for the company, someone else handed me a parts list and told me to build a ceiling rig at MIRUS Art Gallery in Denver. Another contracting team had already hung the wooden louvers 12 ft in the air. That meant I spent the project on a scissor lift, adhering RGBW strips into routed channels overhead. If I had chosen the materials, I would have spec'd addressable pixels for full mapping across the room. Instead, I worked with wash strips driven by Madrix Basic, keeping the entire room on 1 DMX universe.</p><p>The routed channels in the baffles ended in 90 degree corners. Forcing the LED tape around those sharp turns snapped the copper backing on my first attempt. Because they were wash strips instead of pixels, the repair was simple. I cut out the broken module at each corner and soldered jumper wires across the gap to the next copper pads.</p><p>Up in the 6 ft plenum above the ceiling, I stashed the high current supplies and DMX decoders. Each supply group controlled 16 baffles. The spec'd power units were thin and ran with loud fans, which usually spells trouble in an art space. Luckily, the gallery connected to a club room with a Funktion-One sound system, so ambient noise swallowed the fan hum.</p><p>Because the gallery walls are painted white, the saturated colors transform the space. Flip the rig from white illumination to psychedelic chases, and the whole room changes. The client loved it.</p>",

            "title": "Inflatable Tubes",
            "category": "Lighting",
            "image": "media/Lighting/Inflatable Tubes/20230621_172727.webp",
            "description": "<p><strong>Reelworks | Denver</strong> - To get eight inflatable tubes to cut through a club lighting rig, you cannot use off-the-shelf LED tape.</p>",
            "longDescription": "<p>The centerpiece for Track's Denver Pride 2023 was a forest of eight custom inflatable tubes rigged to the ceiling beams with wire cable. To get the brightness I needed, I had custom 24V redundant-data pixel module strands made with double-sided clear lenses, then ran two 30m or 23m strands in parallel inside each tube, securing them directly to the internal fabric ties. Because running that much LED load over a single line would cause massive voltage drop, I put a power supply at both ends of every tube and severed the positive wire at the midpoint to prevent the units from back-feeding into each other. I fed and tested the guts on the floor, hoisted the tubes empty, and powered the fans and decoders once they were in the air.</p><p>During load-in and testing, the Resolume Arena control system and wireless decoders worked without a hitch. The problem started when 2,000 people walked into the room with cellphones in their pockets. The saturated RF environment completely choked the wireless signal. Data rates dropped to roughly 5fps, and the tubes repeatedly lost connection and defaulted. Luckily, I had programmed their default state to a static Pride palette, so when the signal dropped, the centerpiece stayed on theme.</p><p>The inflatables ran warm, but the double-stranded clear-lens build pushed out enough light and resolution that another local fabricator called me after the show to ask what hardware I was using. I got them through the weekend on the fallback palette, and told the venue to replace the wireless units with hardwired decoders before the next run.</p>",

            "image": "media/Apps/GeoLens Pro/Screenshot_20260118_082950_Chrome.webp",
            "description": "<p>I built a localized browser app that automatically sorts field photos by GPS coordinate into project folders.</p>",
            "longDescription": "<p>Doing custom lighting work around Denver meant taking quick reference photos on my phone all day. Every picture dumped into a single camera roll, and I never spent the time to sort them later. I also had loose wiring notes, drawings, and measurements that needed to stay with the right job.</p><p>To fix that, I built a browser app in React 18 and TypeScript that sorts incoming photos by GPS coordinate automatically. Using Leaflet for map boundaries and exifr to read file metadata, the app runs Haversine math against active project geofences. Photos taken inside a boundary drop straight into that project folder. Anything it misses lands in a bin for manual sorting.</p><p>For notes, I built a canvas editor to layer virtual transparencies over the photos. I could circle a part or scribble a measurement, then export a PDF report using jsPDF. Dexie handles the IndexedDB storage locally, while Supabase and Lovable manage the backend and deployment. I left contract work before running it through a full season, but the core engine did what I needed.</p>",

            "image": "media/Apps/PixelForge AI/Screenshot 2026-07-25 173231.webp",
            "description": "<p>A web workspace that uses hallucinated text prompts to break repetitive visual loops in image generation.</p>",
            "longDescription": "<p>Standard image generators get boring fast. I built PixelForge to see what happens when a language model hallucinates an abstract, poetic foundation before any rendering starts. The frontend runs on React, TypeScript, Vite, and Tailwind CSS. It connects the Gemini API for prompt generation to the Imagen or NanoBanana API for the final render, and stores the whole session history locally in IndexedDB and LocalStorage.</p><p>Early iterations got stuck in a visual loop. The app kept generating characters in the same poses or returning to identical themes. It was accidentally feeding pieces of previous prompts into the new input context. I spent hours going back and forth with Gemini and later Cursor to isolate the client-side state and force the app to forget old generations between runs.</p><p>Even with a clean state, individual models drift toward repetitive styles over time. I added a manual model selector in the settings menu to route prompts across different versions. That switch breaks the visual convergence by letting different models interpret the same parameters, and it keeps the app functional as older models retire.</p>",

            "image": "media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182215.webp",
            "description": "<p>I built a browser-based storytelling engine in zero-build React that generates text, illustrations, and audio entirely client-side.</p>",
            "longDescription": "<p>I wanted an interactive storytelling game inspired by the retro aesthetic in Mr. Robot, and I wanted to host it for free on GitHub Pages. That meant zero backend and no bundlers. I started the prototype in a Gemini Canvas and kept the zero-build architecture when I moved the codebase over to GitHub, wiring React 18, ES modules, and Tailwind CSS directly through the browser. Every turn runs client-side and hits the Google Gemini API to build the narrative, 4 player choices, an illustration, and spoken audio.</p><p>The first attempts fell apart fast. Without a strict memory structure, image styles drifted after a few turns, the story got stuck in loops, and the narrative would ramble with no clear end. Keeping track of earlier events inside a growing prompt was the hardest part. I had to build a memory stack that compresses older beats into shorthand summaries while passing along the recent prose and visual reference tags.</p><p>Each turn triggers several API calls at once to generate the prose, questions, image, audio, and log updates. With heavier models, a single turn took upwards of 2 minutes to load. I switched to default models to drop the wait down to 15 to 20 seconds. It works well enough for my own playthroughs, but managing that much client-side state without a build step is painful enough that I plan to rebuild the entire engine from scratch.</p>",

            "image": "media/Apps/Strata - Digital Notebook/Screenshot 2026-01-23 200024.webp",
            "description": "<p>I built a serverless digital notebook that embeds Google Drive files inside a custom client-side canvas.</p>",
            "longDescription": "<p>Flipping through dozens of Google Docs, Sheets, and Slides every day at Boston Dynamics got exhausting without a clear hierarchy to organize them. I wanted a OneNote layout with notebooks, tabs, and pages, but I refused to pay for a server. Piping everything straight through the Google Drive API and browser storage solved the hosting cost, but it meant building the engine from scratch.</p><p>To embed webpages directly into notebook pages, I built a desktop prototype to dodge iframe security blocks. The desktop build worked, but needing an installed app killed the convenience of opening a workspace on any browser. I abandoned the desktop build, accepted the iframe limitations, and pivoted back to the web application.</p><p>The browser fought back on performance. Canvas zooming stuttered, and touchscreen inputs refused to line up with SVG drawings. While I sorted out the coordinate math, sync remains a headache. Edits sometimes drop, and deleted pages occasionally resurrect themselves on reload. Strata is still an active work in progress, but the client-side layout is set.</p>",

            "image": "media/Apps/IdeaForge.AI/Screenshot 2026-02-14 232928.webp",
            "description": "<p>I built a multi-stage idea sifter that runs its entire backend on the Google Sheets and Drive APIs.</p>",
            "longDescription": "<p>People like to treat early concepts like target practice. They shoot holes in an idea before it has room to breathe. I wanted a sifter that takes raw dumps of thought and builds them up without initial critique. I first prototyped the workflow in Notion and rebuilt it with Lovable and Supabase, but both meant recurring monthly subscriptions. I stripped out the cloud database entirely and wired the application directly into the Google Sheets and Google Drive APIs.</p><p>The frontend runs on React and TypeScript, with a local data layer handling offline edits and reconciliation against the spreadsheet. Users drop in raw thoughts, and a Gemini integration tags and summarizes them. When a concept shows promise, you promote it to a brainstorm. The model runs an interview to extract missing detail, then compiles an execution strategy, an expense tracker, and a structured task list.</p><p>Every user already has a Google account, so the backend infrastructure costs nothing to run. I put my custom lithophane generator, LithoLab, through the campaign pipeline to test the playbook generation. Instead of killing half-formed ideas early, the workflow pushes them into actionable phases until you can see whether they actually work.</p>",

            "id": "648",
            "title": "CharGen.AI",
            "category": "Apps",
            "tags": [
                "LLM Integration"

            "image": "media/Apps/CharGen.AI/Screenshot 2026-07-25 174417.webp",
            "description": "<p>I built a browser-based character engine that turns 100 attributes into structured profiles and Imagen 4.0 artwork.</p>",
            "longDescription": "<p>I wanted to generate varied, realistic characters across human and fantasy archetypes without paying for server infrastructure or storing user data. I built the entire engine to run locally in the browser using React 18, Vite, and Zustand. The interface uses an 8 section builder with over 100 conditional attributes that adapt dynamically to species selection. Users plug in their own Google API keys, and the application coordinates Gemini 2.5 Flash for text generation and Imagen 4.0 for visual synthesis, saving complex JSON objects and image payloads directly to IndexedDB.</p><p>I started the build in Gemini Canvas, but the app rotted once the single file hit 1000 lines of code. Options disappeared, previous settings reverted, and the interface broke completely. I moved the project to Cursor and GitHub to break the architecture into modular files. Once the app compiled reliably, the AI models struggled with basic logic. Without context, the randomizer picked identical stats repeatedly. The vision pipeline also fought clothing layers. When a prompt described muscle definition, the model rendered bare skin right through the shirt. I reduced that visual bleed by looping reference images back through NanoBanana to enforce outfit consistency.</p><p>The engine now operates in 2 directions. I can generate a character from scratch and lock specific parameters like species or clothing, or I can feed reference art into the vision model to extract structured physical and psychological data. It serves as a working proof of concept, and I plan to use the underlying system to drive an AI tabletop RPG generator and a random persona chat tool.</p>",

            "image": "media/Apps/LithoPalletGen/lithopalletgen1.webp",
            "description": "<p>A zero-dependency calibration tool that averages pixel data from physical filament swatches for multi-material lithophane printing.</p>",
            "longDescription": "<p>A sunflower field photo of my partner and me printed in CMYW left our faces covered in maroon splotches. Layer thickness kills light transmission before CMYW can produce realistic skin tones. I bought a 2nd AMS2 for extra filaments, but I still needed accurate calibration data.</p><p>My calibration template is a 4x5 grid of 25 mm squares scaling in 0.05 mm steps over a 0.15 mm white backing. I print the swatches at 100% infill, photograph them on a light panel, and upload the image. Even off an X1C, surface texture breaks a single-pixel eyedropper reading. I wrote an area-averaging sampler in vanilla JavaScript that aggregates up to 256 pixels to grab the true color of each thickness. Collapsible palette sets keep the interface readable across multiple materials.</p><p>Having zero dependencies lets me host the app free on GitHub Pages. The engine exports a HSL or hex JSON to import into LithoLab, my PIXEStl-based generator. Skin tones on the next print came out clean, and I dropped to a 0.2 mm nozzle to push the detail.</p>",

        {
            "title": "Field Bench PSU",
            "category": "Solutions",
            "image": "media/Fabrication/Field Bench PSU/20250317_180727.webp",
            "description": "<p>A compact, 3D printed bench power supply designed for testing LED lighting installations in the field.</p>",
            "longDescription": "<p>The Field Bench PSU is a portable tool designed to power and test diverse LED products during on-site installations. While standard bench power supplies are bulky and tied to AC mains, this custom unit leverages modular components and a highly versatile interface architecture to provide reliable testing capabilities directly on the job site.</p><p>The physical enclosure was modeled in SolidWorks and fabricated using PLA+ for structural durability. The internal hardware workflow routes power from a 5521-DC input jack through a mini rocker switch into the voltage conversion module. The output side maximizes field flexibility by providing a 5525-DC jack alongside a pair of banana plug jacks equipped with wire screw terminals. This layout allows the hardware to interface with a wide array of standard connectors, or rely on bare wire connections paired with WAGO terminals for rapid setup.</p><p>The primary technical driver is an embedded buck-boost converter capable of handling a 5 to 32VDC input and delivering an equivalent voltage output at up to 5A. A standout operational achievement is the integration of standard USB PD sources, allowing the system to accept a 19V 100W input and reliably convert it to precise 5V, 12V, or 24V outputs. This capability ensures immediate, adaptable power delivery for any low voltage LED architecture encountered in the field.</p>",

        {
            "title": "Club Lexi",
            "category": "Lighting",
            "image": "media/Lighting/Club Lexi/20230508_171150.webp",
            "description": "<p><strong>CrazyHorse | Denver</strong> - I packed 64 fixtures into a low-ceiling basement club using flush-mounted strut channel and DJ-proofed standalone control.</p>",
            "longDescription": "<p>Club Lexi is a basement with three areas (a lounge, a bar, and a main dance floor), all trapped under a ceiling just short of 10 feet. Patrons could jump and touch the rig. Standard box truss would have eaten too much headroom, so I hung the entire system from strut channel mounted flush to the drywall. Working flush against a ceiling means you have zero room above the fixture to route cable or hide a mess. Everything is exposed. I had an electrician drop power at pre-planned locations on dedicated switches, which let the venue kill half the rig across two zones during early hours without touching the software.</p><p>I ran 64 fixtures over 4 universes on a single Wolfmix WMX1. Fitting hybrid profiles and moving heads into a room that low meant watching every inch of clearance. Because the venue operates without a lighting technician, the WMX1 sat in the booth for the DJs to run standalone.</p><p>Handing live control to DJs immediately exposed the weak points. They would twist knobs, drag fade times to a crawl, and assume the rig was broken when the lights stopped responding. They also loved to mash the strobe button until the room was unreadable, and running a Radiance Hazer from the controller turned into a mess. I locked the hazer to a low-output toggle, set up a hard reset so they couldn't trap the program in a crawl, and let the rig do what I built it to do.</p>",

            "category": "Circuits",
            "image": "media/Electronics/The Orb/ORB2.webp",
            "description": "<p><strong>Temple Nightclub | Denver</strong> - I finished an 8 ft aluminum LED sphere and ran high-current DC power over 35 ft.</p>",
            "longDescription": "<p>The original installer walked away mid-job, leaving an 8 ft aluminum sphere sitting in 2 halves on the top-floor. 1 dome was partly covered in LED pixel modules zip-tied to the metal, with tape over the lenses and black spray paint over the rest. Masked strands lay scattered across the floor. I stripped the mess and started over.</p><p>Keeping the power supplies in the ceiling left empty space inside the frame for the 3D effect, but it meant pushing DC power across a 35 ft run. To beat the voltage drop, I installed MEAN WELL supplies with load sharing and remote sense that adjusted output voltage in real time. Every circuit stayed under 80% capacity at 100% white load. Inside the sphere, decoders handled the signal for a 3D voxel map in Madrix.</p><p>The whole rig hung from a hoist that dropped it over the crowd. Moving heavy copper without snagging required a PVC pipe with a flange mounted through the center of the orb. I spiral-wrapped 2/0 welding cables around each other and fed them down through the pipe. That guide kept the cables clean during motion and stopped the sphere from spinning as it traveled.</p><p>We finished the build for New Year's Eve 2018. People on the dance floor mostly miss it, but the surrounding VIP tiers get a clear view of the full voxel map. Every night around midnight, the hoist dropped the sphere with the headliner.</p>",

        {
            "title": "The Basement",
            "category": "Lighting",
            "image": "media/Lighting/The Basement/IMG_20180614_174327.webp",
            "description": "<p><strong>Triangle Bar | Denver</strong> - I bounced upward pixels off ceiling slats to light a 10 ft basement club in Denver.</p>",
            "longDescription": "<p>The basement at Triangle in Denver had a concrete ceiling under 10 ft high. I handled the entire build solo as an independent contractor, covering design, procurement, installation, programming, and training. Hanging moving lights overhead meant rotary-hammering 8 pieces of strut channel directly into the ceiling with 2 to 3 anchor points per piece. Working alone on a ladder, the hardest part was simply holding a fixture in place with one hand while threading a bolt or seating a cable with the other.</p><p>I despise looking directly at bare sources. Instead of covering the overhead array in standard diffusion, I pointed the pixel modules upward to bounce light off the ceiling slats. The reflected light bled through the gaps, creating a smooth gradient overhead without blinding the crowd. I also isolated the power supplies in an adjacent room to keep fan noise out of the club. I did not know fanless supplies existed at the time, but the quiet room made programming and maintenance much easier.</p><p>To bridge the gap from the remote racks to the ceiling array, I used long-range decoders. The run distance was short enough for standard decoders, but I wanted to test the hardware on a live build. During testing, loose connections at 2 points caused the ground to drop and the pixels to flicker. Because pixel runs work cleanly up to a break, finding the fault points was straightforward.</p><p>The indirect wash turned a hidden basement into an intimate club. Venue owners and patrons loved the clean look, and hiding the rig in the ceiling structure kept the low room from feeling crowded.</p>",

        {
            "title": "Que Bueno Suerte!",
            "category": "Integration",
            "image": "media/Integration/Que Bueno Suerte!/20240606_211259.webp",
            "description": "<p><strong>Que Bueno Suerte! | Denver</strong> - Over 2 years, I wired 11 custom lighting installations into a single restaurant server rack.</p>",
            "longDescription": "<p>My friend let me perpetually add lighting inside Que Bueno Suerte! over 2 years, eventually totaling 11 distinct installations. With so many LEDs, the system risked overpowering the dining room. Finesse was key. Deep reds, oranges, and yellows looked phenomenal against the gold walls and red accents, but only if the hardware stayed invisible in broad daylight. I ran long-range decoders back to a server rack in the upstairs office. Wires snaked under bars, behind walls, above the kitchen ceiling, and inside rafters upstairs. Retrofitting the acrylic etchings meant climbing over tables while brittle adhesive exploded into fine powder that turned sticky again the second I sweated.</p><p>I built an iPad remote early on using OSCpilot for touch control and Show Cockpit for signal distribution. Originally, I ran ELM on the server because it was cheaper and isolated the different rigs easily. The tradeoff was programming flexibility. I couldn't transition one element at a time without shifting the entire building. Switching to Madrix solved the visual output, creating room looks that shifted together across the mezzanine ceiling, alabaster bartop, bottle shelves, and roof liners.</p><p>A rig of this complexity in a packed restaurant breaks in predictable ways. The PixLite 16 controllers above the main bar occasionally drop data and require a breaker flip to reboot. The wireless etchings lose signal through dense crowds. Outdoor fixtures leak water, break their IP rating, and trip breakers. Even the iPad control drops out if staff connect to the wrong network or the WLAN hiccups.</p><p>To keep the system usable for bartenders during a rush, I locked the iPad interface down to basic parameters and playlists of preset looks. For everything else, I installed a slide-out KVM in the rack so I could fix server issues directly. The fine control over the building proved worth the routing headaches, and the warm palettes still sit right in the room.</p>",

        {
            "title": "Vertical Pixel Bar Tubes",
            "category": "Circuits",
            "image": "media/Electronics/Vertical Pixel Bar Tubes/20240619_122306.webp",
            "description": "<p><strong>Que Bueno Suerte! | Denver</strong> - Rebuilding an inherited array of 131 recycled fluorescent tube bundles over an operating bar required 70 universes of control and a 3D voxel map.</p>",
            "longDescription": "<p>The vertical tubes above the main bar at Que Bueno Suerte! came with the building, and by the time I got to them, they needed serious help. The array was made of 62 four-foot and 69 eight-foot recycled fluorescent tubes hung in clusters of 3, with 60/m density LED tape running down the center. After years above a bar, the materials were brittle, and because the restaurant was open every day, I could only take down a few clusters at a time. I stood on a telescoping ladder resting on the ceiling grid (which flexed enough to make every climb interesting), lowered the clusters onto the bar, broke the old wraps, and pulled the dead strip from the center.</p><p>I kept the original pixel spacing so I wouldn't have to redesign the physical bundle, but I swapped the strip for WS2813 LEDs. The backup data line meant a single failed pixel wouldn't force another sketchy ladder climb over an open bar. Up in the custom power boxes, I gutted the original decoders, which had zero documentation, and replaced them with Advatek PixLite 16s to tie the array into the venue-wide system I installed. When I first fired the rig up, it immediately tripped breakers and blew the inline fuses. I eventually bumped the fuse rating to 7A per tube to handle the inrush, and the rig stabilized.</p><p>Because I was locked into the original 60/m density, the display takes an astronomical 35,640 channels across 70 universes to run. Once the hardware was solid, I built a 3D voxel map of the entire layout. Because the tubes hang at uneven lengths and the display isn't a straight line, clean 3D effects can get lost if you push them too hard. But isolating different zones and mapping through the depth of the room turned a partially dead, inherited fixture into the centerpiece of the bar.</p>",

        {
            "title": "Pixel Negative \"X\"",
            "category": "Art",
            "image": "media/Art/Pixel Negative _X_/20230717_155724.webp",
            "description": "<p>An internal X obstruction inside each cell turns a white square into an array of 1024 converging arrows.</p>",
            "longDescription": "<p>I wanted to build the pixel diffusion equivalent of a stage gobo. I designed an X obstruction through the center of 256 isolated cells in SolidWorks. Powered off, the piece sat like a plain square. Powered on, the solid X blocked the center of each WS2815 LED and created 4 arrows pointing toward each other.</p><p>My first attempt on a Tenlog TL-D3 failed when the nozzle dragged across the X pattern and caused layer shifts. Printing directly against the buildplate kept the face flat. A 1 mm PLA+ face provided the right balance of diffusion and opacity without bleeding light between cells.</p><p>I capped the current in WLED on an ATHOM ESP8266 controller to stop the PLA+ from heating and warping. Running fluid patterns across the grid made the uniform obstructions look fuzzy and ripply.</p>",

            "specs": "<p><strong>Medium:</strong> PLA+ (2 material)</p><p><strong>Color:</strong> Black, White</p><p><strong>LEDs: </strong>256 (16x16)</p><p><strong>Driver: </strong>WS2815 (RGB)</p><p><strong>Decoder:</strong> ATHOM (ESP8266)</p><p><strong>Firmware: </strong>WLED</p>",

        {
            "title": "Pixel Seed of Life",
            "category": "Art",
            "image": "media/Art/Pixel Seed of Life/20230717_155617.webp",
            "description": "<p>A 1mm face printed over a subdivided matrix hides the seed of life until the pixels fire.</p>",
            "longDescription": "<p>I built this as a proof of concept to expand what I could do with subdivided matrices. Printed face down, the piece looks like a white square when turned off. Getting that surface required a 1mm face. That thickness balanced structural stability and light transmission without showing bleedthrough from the black walls behind it. With a 10mm throw, bouncing the light was unnecessary.</p><p>Heat became the immediate problem. Early tests ran at full brightness inside sealed enclosures. Over time, the corners curled and the grid walls softened enough to move by hand. Without vent holes on the back, the units bowed away from the wall as the PLA+ heated up. Adding vents and limiting current in the firmware stopped the deformation.</p><p>Now the symbol stays hidden until the matrix powers on. Lighting large clusters of pixels reveals parts of the pattern across the surface. The complete shape only appears when every pixel is active.</p>",
            "websiteLink": "",

        {
            "title": "Pixel Celtic Owl",
            "category": "Art",
            "image": "media/Art/Pixel Celtic Owl/20220315_175342.webp",
            "description": "<p>An internally subdivided 16x16 LED matrix housed inside a dual-material relief sculpture of an organic Celtic owl.</p>",
            "longDescription": "<p>My workstation laptop crashes if I calculate an internal grid larger than 16x16. This piece was a test to see if I could map that geometric matrix inside an organic shape. I bought an owl model online and split the workflow between SolidWorks and Blender for the first time. The processing load of subtracting those 256 cells from Celtic knotwork pushed my hardware to its limit.</p><p>Early attempts on a Tenlog TL-D3 IDEX printer leaked light everywhere. Stopping the bleed between cells took 0.8 mm walls of black PLA+, which meant 2 passes with a 0.4 mm nozzle. Moving the job to a Bambu Lab X1C with an AMS unit solved the bleed immediately. A 0.4 mm wall of black PLA+ now isolates every cell cleanly.</p><p>The front relief is thin enough to act like a lithophane. When powered off, it reads as a white carving in a black frame. Turn on the ATHOM ESP8266 controller, and the 16x16 grid cuts straight through the surface lines.</p>",

        {
            "title": "Lobby Wall",
            "category": "Lighting",
            "image": "media/Lighting/Lobby Wall/0321151647.webp",
            "description": "<p><strong>Tracks | Denver </strong>- I built a double-sided wall of LEDs for Tracks in 5 days after soldering 5000 joints by hand.</p>",
            "longDescription": "<p>Tracks could not close for a remodel, so we had 5 days between open weekends to install a double-sided wall of LEDs and as part of a full remodel. It sits right at the entrance where people walk in. To hit that window, another tech and I spent weeks in the club basement and my home shop building modular panels off site. Each 2x4 pegboard panel held 520 raw LED pucks contact-cemented in 8 pixel configurations. Instead of buying pre-made strands, we manually soldered custom wire lengths using lamp cord for power injection, leaving us with over 5000 solder points before we ever hung a panel.</p><p>We mounted the rows of pegboard modules to the wall and wired each row to a dedicated output on a 16 output SanDevices E682 decoder running WS2801 protocol. Frosted plexiglass sheets on standoffs covered both sides to diffuse the light. I mapped the array using Madrix 3.6 software.</p><p>This was my first LED pixel build, and the initial test run was rough. The pixels flickered badly across the wall. I had not linked grounds across multiple power supplies, and I did not know about power injection yet. Adding inline resistors at the inputs smoothed out the data signal, and I later retrofitted power injection at the midpoint. The E682 is a Christmas light decoder and not very rugged, but it worked.</p><p>When we opened the doors that Thursday, regulars gasped walking into the room. Teaching myself pixel mapping on that build launched an entire lighting design focus in my career, even if I should have just bought pre-made LED strands.</p>",

        {
            "title": "Curved Liquor Bottle Display",
            "category": "Lighting",
            "image": "media/Lighting/Curved Liquor Bottle Display/Screenshot 2026-08-01 112340.webp",
            "description": "<p><strong>Que Bueno Suerte! | Denver</strong> - I designed and hardwired 96 custom louvered corner fixtures to illuminate a see-through sheet metal bottle shelf without blinding guests.</p>",
            "longDescription": "<p>Off-the-shelf extrusion was out of the question for the main bottle display at Que Bueno Suerte!. I wanted to aim light up at the bottles from the corners of the display sections without putting a lens or diffuser in front of the LEDs, preserving maximum throw distance and brightness. To keep raw diodes out of the guests' eyes, I 3D printed custom corner fixtures with integrated light-blocking louvers. Getting the louver spacing and angle right took a few rapid prototyping iterations, and the alignment pins snapped off on almost every print, but the LED tape track itself held the end caps in line.</p><p>The shelf is a see-through metal grid, which made hiding the wiring for 96 individual fixtures a project in itself. I handwired the entire array and wrapped the routing in black tubing secured with mini zip ties. Because there was no closed conduit to hide inside, I used double-sided foam tape to mount the louvers and leaned on the physical stiffness of the bundled wire to support its own weight across the grid.</p><p>In action, the shelf is mapped into the rest of the venue's LED pixel installations through a centralized Madrix server, running unified, building-wide dynamic looks. It worked cleanly until the restaurant opened for dancing and guests started abandoning drinks on every flat surface in the room. I had built the shelf for empty display bottles and never anticipated liquids up there. Spills dripped into the tracks and corroded the LED tape, and because of how the louver tracks were dimensioned, standard waterproof silicone tape would not fit as a drop-in replacement. I ended up requesting a sign to keep drinks off the display and keeping spare parts on hand.</p>",

        {
            "title": "Main Room - Temple Denver",
            "category": "Integration",
            "image": "media/Integration/Main Room - Temple Denver/MVIMG_20190817_211751.webp",
            "description": "<p><strong>Temple - Main Room | Denver</strong> - Bridging Resolume and Madrix over NDI to stretch a 196 pixel canvas across an entire nightclub room.</p>",
            "longDescription": "<p>Touring DJs kept coming through with custom VJ content and nowhere to realistically play it. The venue had 3 screens with a 48x48 resolution, giving the main room an accumulative resolution smaller than a phone icon. To give those artists a usable canvas, I needed to span the room without tearing out the existing hardware.</p><p>This was my first time integrating systems past DMX and MIDI cross triggers alone. Resolume Arena pushed slices of video to converter boxes that output SPI pixel signals, while Madrix ran the floor-to-ceiling custom pixel pillars with about 12 modules per row. Bridging the two over NDI let the content cross between machines. From there, I added DMX triggers from our Roadhog 4 console to the main pixel and video rigs, plus the orb and hallway computers, so we could grab master intensity and speed live.</p><p>Getting the low resolution pixel mesh to map onto the frosted pillars was the hardest problem to solve. The pixel spacing was not an even grid, which made scaling irregular shapes across the room a constant headache. If I were building the rig from the ground up, I would have chosen Madrix for the entire system.</p><p>Combining the setups got us an uninterrupted canvas just under 200 pixels wide. A couple of friends were working with me at the time, and we all geeked out when it finally came together. We could display logos and short messages across the whole wall.</p>",

        {
            "title": "Extrusion Centering Sled",
            "category": "Solutions",
            "image": "media/Fabrication/Extrusion Centering Sled/20200909_213244.webp",
            "description": "<p>A custom modular 3D printed alignment jig designed to perfectly center LED extrusion tracks on uneven nightclub pillars.</p>",
            "longDescription": "<p>This project required designing a custom alignment tool to install LED strip extrusions on the foundational pillars of Temple nightclub in San Francisco. The primary goal was to achieve visually perfect vertical alignment of center tracks on boxed pillars that were irregularly shaped and wavy. Unlike standard measuring methods, this unique solution utilized a physical jig that referenced the outer edge tracks to automatically find the relative center at any given height, ensuring the final installation appeared flawlessly straight.</p><p>The workflow began with a rudimentary prototype using scrap material and a ruler to test the alignment concept. The final tool functioned as a dynamic sled that rode inside the center LED extrusion track during the physical installation. As the jig slid upward along the track, notched ends highlighted with yellow china marker allowed for constant visual verification against the outer corner extrusions. This continuous referencing system made it possible to secure the center track with a pneumatic nailer progressively, actively compensating for the hidden waves in the underlying pillar casing.</p><p>The standout technical achievement was engineering a rigid tool that bypassed spatial manufacturing constraints. Because the required length of the jig exceeded the available 3D printer build plate, the component was designed as a four-part modular assembly. These interlocking sections maintained the structural integrity required to withstand the physical forces of the pneumatic nailing process while keeping the sled firmly on track. This custom hardware solution successfully transformed a highly irregular architectural environment into a precise, uniform lighting canvas.</p>",

        {
            "title": "Dance Floor Pillars",
            "category": "Circuits",
            "image": "media/Electronics/Dance Floor Pillars/Screenshot_20210306-180716_Photos~2.webp",
            "description": "<p><strong>Temple Nightclub | San Francisco</strong> - I built 320 meters of custom recessed pixel tape into 10 floor-to-ceiling structural pillars on a skeleton budget.</p>",
            "longDescription": "<p>We remodeled the main room at Temple Nightclub in San Francisco during the pandemic lockdowns with a skeleton crew and no budget. I was putting 320 meters of SM16704 RGBW (6000k) pixel tape seemingly built directly into 10 structural pillars on the dance floor. To build recessed tracks without expensive hardware, I wrapped the columns in OSB and mounted mud-in aluminum extrusions with a pneumatic nailer. I filled the remaining gaps with more board, plastered everything with drywall mud, and spent weeks on a scissor lift with an orbital sander hooked to a shop vac. Then I primed the columns, painted them flat black, and sealed the bottoms with silicone caulk.</p><p>The wiring had to survive crowd contact below and attic heat above. At the bottom of each column, thin metal tubing protected 3-conductor 18 AWG wiring from kick damage. Power injection runs went up inside the corner moldings to fight voltage drop across the 4 m strips. At the top, the lines met at a 24-pin ATX power coupler that connected to custom distribution boards above the video ceiling. Working up there meant crawling across strut channel and the backs of video panels in a 16 in gap, fighting condensation and heat while carpet blower fans pushed air toward the rear wall.</p><p>Just 2 weeks before we opened, the owner decided to flip the building entrance 180 degrees, but the main room layout held. Firing all 10 pillars from the dance floor looked like light jumping out of the concrete and vanishing into the ceiling above. Building custom distribution boards for morning hardware swaps took extra time that I would handle differently today, but the rig survived the crowds exactly as built.</p>",

            "description": "<p><strong>Que Bueno Suerte! | Denver - </strong>18 fanless power supplies drive a blackout 3000K pixel array below a low mezzanine HVAC duct.</p>",
            "longDescription": "<p>A central HVAC duct and a low ceiling above the Que Bueno Suerte! mezzanine had already killed one designer's lighting concept years earlier. I took the lowest point of that duct as a hard clearance limit and shot a laser level across the room to hang a flat array of blackout tubes. The venue needed warm 3000K white for early evening dinner service and high-impact RGBW pixel chases for Latin dance nights. Standard milky white LED diffusion looks cheap when powered off, so I used black diffusion against the dark ceiling paint so the rig would visually disappear during the day.</p><p>I spent a month working overhead from 6ft ladders and restaurant benches, cutting strutchannel and setting cable anchors every 12 in along the beams. I originally ran 18/2 wire inside the tubes for power injection at the far end, but the wire drooped inside the casing and cast obvious shadows. I ripped the extra wiring out entirely and tested the strips from a single end, which ran full white with zero color shift.</p><p>Silent operation meant no fanned power supplies. I specced 18 waterproof MEAN WELL HLG units across 3 new 20A circuits, with each circuit powering a bank of 6 supplies and each supply driving 2 bars through independent fuses. Booting 6 fanless supplies at once tripped the breakers instantly from inrush current. I built custom sequencer boxes to stagger startup by 5 seconds so the capacitors could charge. Long-range decoders fed over 24 universes of sACN pixel data from a rack server in the office, running ENTTEC ELM before I moved the venue to Madrix 5.</p><p>The owner finally got his mezzanine installation without a low-hanging mess above the tables. The array blends into the ceiling paint by afternoon, gives a warm incandescent glow over dinner, and hits hard when the dance floor opens.</p>",

        "about_text": "<p>I'm a multidisciplinary technologist and designer currently building a new career in robotics, with a hands-on background in lighting design, rapid prototyping, and interactive systems. My work blends physical fabrication and digital tools, designing lighting installations, building custom electronics, developing apps, and using 3D printing to move quickly from idea to functional object. I'm most at home in the space where creative intent meets technical execution.</p><p><br></p><p>I focus on making systems that are practical, resilient, and thoughtfully designed. That means understanding circuitry and power, iterating hardware through real-world use, and building software that supports the experience without unnecessary complexity. I'm drawn to robotics because it demands the same mindset I've used for years, working with constraints, debugging in the physical world, and designing for safety, feedback, and reliability. I bring a builder's perspective, strong intuition for how things fail, and a deep respect for craftsmanship.</p>",

        const Repeat = (p) => <Icon {...p}><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></Icon>;
        const Copy = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Icon>;
        const Send = (p) => <Icon {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></Icon>;
        const Share2 = (p) => <Icon {...p}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></Icon>;
        const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;

        const Filter = (p) => <Icon {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Icon>;

        // --- GLOBAL HELPER: URL NORMALIZER ---
        const ensureProtocol = (url) => {
            if (!url) return '';
            if (url.startsWith('mailto:')) return url;
            if (url.startsWith('#')) return url;
            if (url.startsWith('/') || url.startsWith('./') || url.startsWith('../')) return url;
            const trimmed = url.trim();
            if (!/^https?:\/\//i.test(trimmed)) {
                // Relative paths (e.g. media/...) should be served as-is
                if (!/^[a-zA-Z0-9+\-.]+:\/\//.test(trimmed) && !trimmed.includes('://') && trimmed.match(/^[a-zA-Z]+\//)) {
                    return trimmed;
                }
                return `https://${trimmed}`;
            }
            return trimmed;
        };

        const getYouTubeId = (url) => {
            if (!url || typeof url !== 'string') return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            const match = url.trim().match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        // Gallery entries are either a bare URL string or { url, caption } once a
        // caption has been authored in the CMS.
        const mediaSrc = (item) => (typeof item === 'string' ? item : (item?.url || ''));
        const mediaCaption = (item) => (typeof item === 'string' ? '' : (item?.caption || ''));
        const mediaFit = (item) => (typeof item === 'string' ? null : (item?.fit || null));
        const mediaPoster = (item) => (typeof item === 'string' ? null : (item?.poster || null));

        // Self-hosted (non-YouTube) video files uploaded via the CMS's video
        // converter always come out as .mp4, but a manually-typed URL could point

        const isVideoUrl = (url) => typeof url === 'string' && /\.(mp4|webm|mov|m4v)$/i.test(url.split('?')[0]);

        // Returns inline style for a cropped image. When scale=1, only objectPosition
        // is set so CSS hover transitions (e.g. group-hover:scale-105) still work.
        const fitStyle = (fit) => {
            if (!fit) return {};
            const { scale = 1, x = 50, y = 50 } = fit;
            if (scale <= 1) return { objectPosition: `${x}% ${y}%` };
            return { transform: `scale(${scale})`, transformOrigin: `${x}% ${y}%`, objectPosition: `${x}% ${y}%` };
        };

        const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])';

        // Confines Tab cycling to `containerRef`, closes on Escape, and returns
        // focus to whatever was focused before the dialog opened. `isActive` lets a
        // parent dialog stand down while a nested one (the lightbox) is on top.
        const useDialog = (containerRef, onClose, isActive = true) => {
            // Read through a ref so the once-only effect below never sees stale state.
            const stateRef = useRef(null);
            stateRef.current = { onClose, isActive };

            useEffect(() => {
                const previouslyFocused = document.activeElement;
                const container = containerRef.current;

                const focusables = () =>
                    Array.from(container ? container.querySelectorAll(FOCUSABLE) : [])
                        .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);

                const first = focusables()[0];
                (first || container)?.focus();

                const onKeyDown = (e) => {
                    if (!stateRef.current.isActive) return;
                    if (e.key === 'Escape') {
                        e.stopPropagation();
                        stateRef.current.onClose();
                        return;
                    }
                    if (e.key !== 'Tab') return;
                    const items = focusables();
                    if (!items.length) { e.preventDefault(); return; }
                    const firstItem = items[0];
                    const lastItem = items[items.length - 1];
                    if (e.shiftKey && (document.activeElement === firstItem || !container.contains(document.activeElement))) {
                        e.preventDefault();
                        lastItem.focus();
                    } else if (!e.shiftKey && document.activeElement === lastItem) {
                        e.preventDefault();
                        firstItem.focus();
                    }
                };

                document.addEventListener('keydown', onKeyDown, true);
                return () => {
                    document.removeEventListener('keydown', onKeyDown, true);
                    if (previouslyFocused && document.contains(previouslyFocused)) previouslyFocused.focus();
                };
            }, []);
        };

        // The CMS editor emits <h1>/<h2>, which collide with the heading level of the
        // section the markup gets embedded in (an <h2> landing inside the <h4>
        // "Specifications" panel reads as a jump back up the outline). Retag to the right
        // level and move the visual size onto a class.
        const demoteHeadings = (html, startLevel) => {
            if (!html) return html;
            const source = String(html);
            const present = [...source.matchAll(/<h([1-6])\b/gi)].map(m => parseInt(m[1], 10));
            if (!present.length) return source;
            // Anchor the shallowest authored heading at startLevel so the outline neither
            // jumps backwards nor skips a level, and keep relative nesting below it.
            const shallowest = Math.min(...present);
            return source.replace(/<(\/?)h([1-6])([^>]*)>/gi, (match, slash, lvl, attrs) => {
                const original = parseInt(lvl, 10);
                const level = Math.min(6, startLevel + original - shallowest);
                if (slash) return `</h${level}>`;
                const cls = `rt-h${original}`;
                const withClass = /class\s*=\s*"/i.test(attrs)
                    ? attrs.replace(/class\s*=\s*"([^"]*)"/i, (m, c) => `class="${c} ${cls}"`)
                    : `${attrs} class="${cls}"`;
                return `<h${level}${withClass}>`;
            });
        };

        // Fallback for gallery entries with no authored caption. Filenames here are
        // camera-roll noise (20250317_180727, Screenshot 2025-03-17...), so a positional

        const describeMedia = (url, index, total, projectTitle) => {
            const position = `${index + 1} of ${total}`;
            return (getYouTubeId(url) || isVideoUrl(url))
                ? `Play video ${position} for ${projectTitle}`

        // --- READ DATA ---
        let projects = [];

            let parsedData;
            
            if (rawContent.includes('{{PORTFOLIO_DATA}}')) {
                 console.log("Template mode detected.");
                 parsedData = { projects: [], settings: {} }; // Fallback
            } else {
                parsedData = JSON.parse(rawContent);
            }

            projects = Array.isArray(parsedData) ? parsedData : (parsedData.projects || []);
            // Newest first
            projects.sort((a, b) => {
                const dateA = a.timestamp ? new Date(a.timestamp) : new Date(0);
                const dateB = b.timestamp ? new Date(b.timestamp) : new Date(0);
                return dateB - dateA;
            });
            settings = parsedData.settings || {};

        } catch (e) {
            console.error("Failed to parse portfolio data.", e);
            projects = [];
        }

        // --- COMPONENTS ---

        const SectionHeader = ({ title, subtitle, icon: Icon }) => (

        const ProjectCard = ({ project, onOpen }) => {

                                    <Globe size={14} aria-hidden="true" /> WEB

        const ContactModal = ({ email, onClose, emailConfig }) => {

                            <div className="flex gap-3 pt-2">
