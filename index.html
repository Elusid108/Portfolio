    {"projects":[{"id":"1842","title":"Portfolio CMS","category":"Software","tags":["JavaScript","React","Node.js","REST APIs"],"image":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181136.webp","description":"<p>Drop in a video. A server on my laptop strips the audio, encodes it, and folds the site into one HTML file in ten seconds.</p>","longDescription":"<p>Every video for the old portfolio went through someone else's site first. I fought their upload limits, waited on their load times, and then embedded a player that loaded slower than the rest of the page. One night it clicked that I could run a video converter myself, mute the audio, and host the files on GitHub next to everything else. Once I saw that, the rest was a no-brainer.</p><p>The result is a content management system that lives entirely on my laptop. I drop a video into the editor and a local server catches it, strips the audio, encodes it to 1080p, and drops it into the right project folder. Images get converted to WebP the same way. The front end reads from a single JSON block, so updating a project feels about as fast as moving files around on the desktop. When I hit publish, the server compiles the text and media into one HTML file. It takes under ten seconds.</p><p>Pushing that folder to GitHub Pages puts the site live. There is no hosting bill, no upload cap, and no third-party player. The site you are reading came out of it.</p>","video":"","gallery":[{"url":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181136.webp","thumbnail":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181136-thumb.webp"},{"url":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181154.webp","thumbnail":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181154-thumb.webp"},{"url":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181201.webp","thumbnail":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181201-thumb.webp"}],"launchLink":"","githubLink":"https://github.com/Elusid108/Portfolio","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-12T01:03:01.269Z","wip":false,"order":9,"specs":"<h2>SOFTWARE &amp; STACK</h2><p><strong>Framework</strong><br><em>React 18 (CDN) • Node.js</em></p><p><strong>Language</strong><br><em>Vanilla JavaScript</em></p><p><strong>Backend</strong><br><em>Express • Sharp • Multer</em></p><p><strong>Styling</strong><br><em>Tailwind CSS • Quill</em></p><p><strong>Storage</strong><br><em>Local JSON (filesystem)</em></p><p><strong>Deploy</strong><br><em>GitHub Pages (static output)</em></p>","related":[{"name":"chrismoore.me","url":"http://chrismoore.me"}],"thumbnail":"media/Apps/Portfolio CMS/Screenshot 2026-07-25 181136-thumb.webp","specsData":[{"id":"b010ab60-1ae9-4b4a-9943-8254c5adc35f","title":"SOFTWARE & STACK","items":[{"id":"491266fe-96c8-4ea8-9c75-9013eee3813d","name":"Framework","qty":"","specs":"React 18 (CDN), Node.js"},{"id":"2e858bea-64ed-4071-8a62-aa52665240c1","name":"Language","qty":"","specs":"Vanilla JavaScript"},{"id":"76d2cd71-83be-4fb4-bdd0-f6de71c6b623","name":"Backend","qty":"","specs":"Express, Sharp, Multer"},{"id":"4d733738-d995-4bcf-9486-cd7efc4ba5c3","name":"Styling","qty":"","specs":"Tailwind CSS, Quill"},{"id":"04bd3a0b-fd24-4efc-83fc-677323828062","name":"Storage","qty":"","specs":"Local JSON (filesystem)"},{"id":"af10142b-f2b0-4766-8d85-cc152f98116c","name":"Deploy","qty":"","specs":"GitHub Pages (static output)"}]}]},{"id":"1","title":"Immersive Dance Lighting Rig","category":"Lighting","tags":["Lighting Design","Video Mapping","Pixel Mapping","Roadhog 4","Resolume Arena","Madrix","Custom Fabrication","Capture"],"image":"media/Lighting/Immersive Dance Lighting Rig/20210516_134200.webp","description":"<p>I packed two hundred fixtures into the ceiling, but running them at full brightness emptied the dance floor.</p>","longDescription":"<p>There was an ambient power that emanated from the rig. It was all black and incredibly dense. I had never packed so much equipment into such a small space before. When the room was dark, the hardware vanished. It felt like a beast was sleeping up there. The owner wanted a video ceiling running the length of the room, curving down behind the DJ. The designer wanted the support pillars encased in LED strips. I added my own lighting layer, dropping in nearly two hundred moving fixtures.</p><p>Getting it wired and working was half the battle. Getting programming that looked pro was another beast entirely. I spent weeks integrating the video ceiling, the pixel pillars, and the movers so a couple of operators could actually run it. We had a monstrous rig, and it was tempting to use all of it at once.</p><p>But when we finally opened the room, we found out what happens when you do. Running everything at full brightness emptied the dance floor. It was not just about the raw intensity, though that was part of it. It was the ratio of fixtures firing simultaneously. People felt exposed. If you want people to dance, you have to let them feel like no one is watching. We dialed the overall output way back. We learned to let individual elements emerge from the blackness, keeping the crowd in the dark where they belonged.</p>","video":"","gallery":[{"url":"media/Lighting/Immersive Dance Lighting Rig/20210516_134200.webp","fit":{"scale":1.15,"x":32,"y":69.3},"thumbnail":"media/Lighting/Immersive Dance Lighting Rig/20210516_134200-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/20210517_104219.webp","thumbnail":"media/Lighting/Immersive Dance Lighting Rig/20210517_104219-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/Screen Recording 2025-03-14 124624.mp4","fit":{"scale":1.3,"x":58.2,"y":51},"poster":"media/Lighting/Immersive Dance Lighting Rig/frame-thumb-1786196916589.webp","thumbnail":"media/Lighting/Immersive Dance Lighting Rig/frame-thumb-1786196916589-thumb.webp"},{"url":"media/Lighting/Immersive Dance Lighting Rig/Screenshot 2025-03-14 124321.webp","thumbnail":"media/Lighting/Immersive Dance Lighting Rig/Sc  1m, P4.81, 3744 x 208, "},{"id":"0dea8e17-9c96-41c5-afaf-5480898a284c","name":"Monolith Screens","qty":"1","specs":"1.5m x 3m (x2), P4.81, 312 x 624 (x2), "}]}]},{"id":"8147","timestamp":"2026-01-12T01:03:01.269Z","title":"Emmy Stand","category":"Art","image":"media/Art/Emmy Stand/Gemini_Generated_Image_4xox7h4xox7h4xox.webp","description":"<p>A coworker won an Emmy. He got a desktop ballet rig: six boom towers, recessed washers, and a gold finish that threw every source back at me.</p>","longDescription":"<p>An old coworker from my club days won an Emmy. He asked for a custom display, so I scaled ballet lighting principles down to a desktop rig. The stand uses three boom towers per side that arch from downstage to upstage, plus angled wall washers recessed along the outer edges. A dual-material film strip lines the bottom for diffusion and masking.</p><p>The curved backdrop was too large for a single print. I built it in modular sections and turned the seams into an exaggerated surface texture. When I set the statue on the pedestal, the gold finish mirrored the light sources instead of absorbing them. The metal warped the reflections.</p><p>Packing 512 LEDs into closed plastic is basically building a slow toaster. To keep the enclosure from melting from the inside out, the one rule was power management. I locked the current limit to three amps before I ever turned it on.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","Power Distribution","Lighting Design","SPI","Rapid Prototyping","ESP32","Custom Fabrication","AC/DC Load Calc","Wire-to-Board Soldering","Embedded Systems"],"gallery":[{"url":"media/Art/Emmy Stand/20250415_215715.webp","fit":{"scale":1.15,"x":36.2,"y":44.2},"thumbnail":"media/Art/Emmy Stand/20250415_215715-thumb.webp"},{"url":"media/Art/Emmy Stand/20250415_215552.webp","fit":{"scale":1.1,"x":100,"y":30.4},"thumbnail":"media/Art/Emmy Stand/20250415_215552-t ox7h4xox7h4xox-thumb.webp","specsData":[{"id":"f2a0485e-e0c4-4032-981a-a08ac1cbdf91","title":"Pixels & Display","items":[{"id":"ba512384-b6b9-413f-a14f-ffbf5a34bca4","name":"LED Pixels","qty":"512","specs":"WS2815, RGB, white flex pcb, 144/m, 12Vdc, "}]},{"id":"d609b982-c964-4050-8b1f-63ea07d46549","title":"FABRICATION & MATERIALS","items":[{"id":"2f1b73be-890e-4be9-9d4a-b091aa2a1a80","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"7395d389-b1d5-4c9f-9465-00d07b2f2e61","name":"PLA+ ( Black )","qty":"","specs":"mask, border, base"},{"id":"8aa8452c-e340-4bf4-8380-f12d39f9e383","name":"PLA+ ( White )","qty":"","specs":"diffusion, bounce"},{"id":"98ce5cd6-e7c5-49e0-937a-c3e518d20bf3","name":"PLA+ ( \"Transparent\" )","qty":"","specs":"lens frost"}]},{"id":"1f3ef002-b0fd-4f1f-8787-a3c6c41af9ec","title":"EMBEDDED ELECTRONICS","items":[{"id":"482e40c8-e315-4963-ac2a-9b81cf25bb7a","name":"Pixel Decoder","qty":"1","specs":"Wasatch Pixels Basic Eight, ESP32, 12Vdc"}]}]},{"id":"2944","title":"LithoLab","category":"Software","tags":["LLM Integration","TypeScript","FDM 3D Printing"],"image":"media/Apps/LithoLab/image2.webp","description":"<p>Standard CMYK generators turn skin tones into magenta splotches, so I ported an open-source color lithophane engine to the browser.</p>","longDescription":"<p>The first lithophane I tried to print was a photo of my partner and me in a sunflower field. I ran it through a standard CMYK generator at least half a dozen times, and every print came back with magenta splotches across our faces. Four filaments cannot make a skin tone, and the generators only output flat rectangles anyway. Photos of couples were the whole reason I wanted to do this, so the skin tones had to be right.</p><p>I ported the open-source PIXEStl engine to run in the browser and built the interface I actually wanted around it: import a photo, overlay a custom mask so the print is not stuck as a rectangle, set the filament colors and depths, and export the files. Early prints on the X1C had a persistent micro-gap along the right edge between the image and its border. It took several failed attempts to close it. The calibration tools were cluttering the main screen, so I split them out into a companion app, LithoPalletGen, that handles the color mapping.</p><p>The sunflower photo prints correctly now. At the time of writing I have printed around two dozen lithophanes through it, all from a browser tab with nothing behind it, with extra filament colors dialed in for skin. Backlit, they match the source photos.</p>","video":"","gallery":[{"url":"media/Apps/LithoLab/image2.webp","caption":"The LithoLab workspace links source image manipulation directly to physical 3D print parameters. In the main canvas, users apply custom geometric masks and adjust spatial orientation, while the sidebar controls physical dimensions, border scaling, and filament palette selection. The dual-preview engine at the bottom provides immediate feedback, displaying both a palette-accurate color rendering and a surface-texture depth map to verify print accuracy before exporting.","thumbnail":"media/Apps/LithoLab/image2-thumb.webp"},{"url":"media/Apps/LithoLab/20260717_135329.webp","thumbnail":"media/Apps/LithoLab/20260717_135329-thumb.webp"},{"url":"media/Apps/LithoLab/20260725_094414 (1).webp","fit":{"scale":1.05,"x":48,"y":42.7},"thumbnail":"media/Apps/LithoLab/20260725_094414 (1)-thumb.webp"},{"url":"media/Apps/LithoLab/20260712_074944.webp","fit":{"scale":1.15,"x":77.3,"y":60.8},"thumbnail":"media/Apps/LithoLab/20260712_074944-thumb.webp"}],"launchLink":"https://elusid108.github.io/LithoLab/","githubLink":"https://github.com/Elusid108/LithoLab","shopLink":"","files":[{"name":"0.05mm Calibrated pallet file","url":"media/Apps/LithoLab/files/0.05mm_10layer_9 colors.json","description":"9 color calibrated .json file for LithoLab to 0.05mm layer height increments for use with a 0.2mm nozzle"}],"featured":true,"websiteLink":"","timestamp":"2026-01-12T01:03:01.269Z","wip":false,"order":0,"specs":"","related":[{"name":"BorderBuilder","url":"#project/8287"},{"name":"Pallet generator","url":"#project/968"}],"thumbnail":"media/Apps/LithoLab/image2-thumb.webp","specsData":[]},{"id":"3670","title":"Unfold","category":"Software","tags":["React","TypeScript"],"image":"media/Apps/Unfold/Screenshot 2026-07-25 154856.webp","description":"<p>Four decks of prompts for people on a video call who are tired of asking about the weather.</p>","longDescription":"<p>Small talk on a video call is the worst version of small talk. Nobody can read the room, everyone talks over each other, and the weather comes up twice. Unfold is a deck of conversation prompts for getting past that part faster.</p><p>It started as a quick prototype for combining decks and drawing cards. There are four decks and three ways to play them. To make it useful across more than one session, the game had to remember which cards a group had already seen and let people build their own decks, so I added a save-state layer that lives entirely in the browser. Nobody has to sign up for anything. That also meant there was nothing to host, so it sits on GitHub Pages as a static site.</p><p>I have played it with my partner sitting next to me on the couch. I have not yet played it on an actual video call with friends or family, which is the whole point. That is on the list.</p>","video":"","gallery":[{"url":"media/Apps/Unfold/Screenshot 2026-07-25 154856.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-07-25 154856-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183035.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183035-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183054.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183054-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183115.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183115-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183122.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183122-thumb.webp"},{"url":"media/Apps/Unfold/Screenshot 2026-01-11 183144.webp","thumbnail":"media/Apps/Unfold/Screenshot 2026-01-11 183144-thumb.webp"}],"launchLink":"https://elusid108.github.io/Unfold/","githubLink":"https://github.com/Elusid108/Unfold","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-12T01:03:01.269Z","wip":false,"order":6,"specs":"<h2>SOFTWARE &amp; STACK</h2><p><strong>Framework</strong><br><em>React 18</em></p><p><strong>Language</strong><br><em>TypeScript</em></p><p><strong>Build</strong><br><em>Vite (SWC)</em></p><p><strong>Styling</strong><br><em>Tailwind CSS • Radix UI</em></p><p><strong>Storage</strong><br><em>localStorage</em></p><p><strong>Deploy</strong><br><em>GitHub Pages</em></p>","related":[],"thumbnail":"media/Apps/Unfold/Screenshot 2026-07-25 154856-thumb.webp","specsData":[{"id":"744b16be-4b29-47d7-bafb-992b21bc188d","title":"SOFTWARE & STACK","items":[{"id":"a3559b12-8a19-40fe-a3cf-20042195e9e9","name":"Framework","qty":"","specs":"React 18"},{"id":"73f8c529-134b-4b00-b3b4-12a7d74005e3","name":"Language","qty":"","specs":"TypeScript"},{"id":"7c2569dd-ff17-4849-a231-7f168cd2bb0d","name":"Build","qty":"","specs":"Vite (SWC)"},{"id":"5567d6f9-1036-4706-8881-01689a1875d3","name":"Styling","qty":"","specs":"Tailwind CSS, Radix UI"},{"id":"6198d103-d98c-4d94-9582-38d90dcca7a7","name":"Storage","qty":"","specs":"localStorage"},{"id":"c580b228-67c9-4947-bdab-b4d9309a9c02","name":"Deploy","qty":"","specs":"GitHub Pages"}]}]},{"id":"670","timestamp":"2026-01-12T23:50:49.052Z","title":"Pyramid","category":"Art","image":"media/Art/Pyramid/Gemini_Generated_Image_rmmssrmmssrmmssr.webp","description":"<p>I trapped a pixel matrix inside a sealed 3D print and accidentally mushed the melting plastic with my thumb.</p>","longDescription":"<p>A pixel effect crawling across the surface of a solid object. That was the picture. The first thing I built to get it was a glowing pyramid with a subdivided grid inside.</p><p>Getting crisp isolation without light bleed meant printing the sculpture as a single piece. Every layer needed a black core to block light between shafts, white walls to bounce it up, and a frosted shell for diffusion. The printer did three filament swaps per layer, leaving a mountain of purge waste. I put a 256-pixel matrix inside and turned it on. Heat built up fast. I picked the piece up after a burn-in test and accidentally mushed the softened grid in with my thumb.</p><p>Venting the back helped, but potting holes in the front would ruin the look. I swapped to 12-volt matrices, kept the diodes a centimeter off the surface, and set a 1-amp current limit in the software. The piece hung at Glow Lounge in Denver and ran for months without warping. Every sealed piece since has been printed the same way, as a single body.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Rapid Prototyping","Lighting Design","ESP8266","Custom Fabrication","Wire-to-Board Soldering","Pixel Mapping"],"gallery":[{"url":"media/Art/Pyramid/20230717_154810.webp","fit":{"scale":1.25,"x":0,"y":50},"thumbnail":"media/Art/Pyramid/20230717_154810-thumb.webp"},{"url":"media/Art/Pyramid/20230717_154820.webp","fit":{"scale":1.2,"x":10.1,"y":85.1},"thumbnail":"media/Art/Pyramid/20230717_154820-thumb.webp"},{"url":"media/Art/Pyramid/20230808_152320.webp","fit":{"scale":1.8,"x":32.8,"y":16},"thumbnail":"media/Art/Pyramid/20230808_152320-thumb.webp"},{"url":"media/Art/Pyramid/20230707_072443~2.mp4","poster":"media/Art/Pyramid/20230707_072443~2-poster.webp","thumbnail":"media/Art/Pyramid/20230707_072443~2-poster-thumb.webp"},{"url":"media/Art/Pyramid/20230612_131709~2.mp4","poster":"media/Art/Pyramid/20230612_131709~2-poster.webp","thumbnail":"media/Art/Pyramid/20230612_131709~2-poster-thumb.webp"},{"url":"media/Art/Pyramid/20230707_082949~2.mp4","poster":"media/Art/Pyramid/20230707_082949~2-poster.webp","thumbnail":"media/Art/Pyramid/20230707_082949~2-poster-thumb.webp"}],"files":[],"video":"","order":1,"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C with AMS</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>bounce</em></p><p><strong>PLA+ ( &quot;Transparent&quot; )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"Mini Pyramid","url":"#project/5632"},{"name":"Plane Warp","url":"#project/8000"}],"thumbnailFit":{"scale":1.05,"x":44.2,"y":91.9},"bannerFit":{"scale":1,"x":77,"y":38.2},"thumbnail":"media/Art/Pyramid/Gemini_Generated_Image_rmmssrmmssrmmssr-thumb.webp","specsData":[{"id":"e86dbbad-dd93-4b79-a3a8-9a2c070b7191","title":"Pixels & Display","items":[{"id":"fbd776dd-9fe5-4f13-83cc-ff0880771528","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"64dec809-09c6-4125-ab77-b682e1a2af37","title":"FABRICATION & MATERIALS","items":[{"id":"7d400f48-e7dc-4a52-8e80-15e93d6da35e","name":"3D Printer","qty":"","specs":"Bambu Labs X1C with AMS"},{"id":"2c8383c6-08a5-4c72-862e-471d1e64b896","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"022eb713-700a-4888-af0b-13235e914046","name":"PLA+ ( White )","qty":"","specs":"bounce"},{"id":"fbdda1e4-8bc9-458a-8db7-ce7b66157c12","name":"PLA+ ( \"Transparent\" )","qty":"","specs":"diffusion"},{"id":"7ae21261-2cee-457e-8430-7fd22e4d4bba","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"c6a9dbbf-6410-4357-83a3-c1b4d0f4cc92","title":"EMBEDDED ELECTRONICS","items":[{"id":"30c5907a-8896-4b63-89c5-a5a7a24bd302","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}]},{"id":"5632","title":"Mini Pyramid","category":"Art","tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","ESP32","Lighting Design","Rapid Prototyping","SPI","WLED","Pixel Mapping","Wire-to-Board Soldering"],"image":"media/Art/Mini Pyramid/minipyramidfix.webp","description":"<p>Sixty-four LEDs, an ESP32, and a QR code on the bottom. Every time I plugged in a cable, the USB-C port retreated into the case.</p>","longDescription":"<p>The desk version came next: an 8 x 8 pixel display in a pyramid small enough to sit beside a keyboard. I went with a pyramid simply because it was an easy shape to model in SolidWorks. The bottom doubled as a scannable QR code linking to my site.</p><p>Squeezing 64 LEDs and an ESP32 into that footprint left almost no room for hardware. I had to do several iterations of the base to hold the board in place. The USB-C port wanted to push back into the case whenever I plugged a cable in, and closing the shell kept crushing the internal wiring. It took several printed iterations to anchor the controller securely and route the leads.</p><p>Putting pixels that close to the surface usually creates hotspots, so I kept at least 10mm distance. I used a frosted layer over white cell walls to break up the light, printing the whole case in three different materials.</p>","video":"","gallery":[{"url":"media/Art/Mini Pyramid/20230726_201532.webp","fit":{"scale":1,"x":48.9,"y":19.2},"thumbnail":"media/Art/Mini Pyramid/20230726_201532-thumb.webp"},{"url":"media/Art/Mini Pyramid/20240316_141546~2.mp4","poster":"media/Art/Mini Pyramid/20240316_141546~2-poster.webp","thumbnail":"media/Art/Mini Pyramid/20240316_141546~2-poster-thumb.webp"},{"url":"media/Art/Mini Pyramid/20240316_135358.webp","fit":{"scale":1,"x":66.6,"y":64.7},"thumbnail":"media/Art/Mini Pyramid/20240316_135358-thumb.webp"},{"url":"me usion"}]},{"id":"ff041d66-b6f2-4dea-a406-ee54a7d04902","title":"EMBEDDED ELECTRONICS","items":[{"id":"a0ab684a-2244-4e15-947e-3f3d86977a52","name":"Pixel Decoder","qty":"1","specs":"ESP32-S3, WLED, USB-C"}]}]},{"id":"8000","timestamp":"2026-01-13T00:04:25.482Z","title":"Plane Warp","category":"Art","image":"media/Art/Plane Warp/pixelplanewarp_fix.webp","description":"<p>Trapped heat destroyed the first print, so I lined the cells to bounce the light instead of forcing it.</p>","longDescription":"<p>In a dark room, the black structure of this piece disappears, leaving only a distorted grid of light floating overhead. Plane Warp is a 16 x 16 matrix with a sweeping surface wave that ends in sharp points.</p><p>Because the wave's peak sits far above the base, lighting the corners meant running the LEDs at full brightness. I destroyed an early print trying to push enough light up there. The trapped heat ruined it.</p><p>It hung on the ceiling at Glow Lounge for a while. To get it there, I changed the cell design. I printed black walls to isolate each channel, lined the insides with white, and added a frosted diffusion layer. That combination became the rule: bounce the light instead of forcing it. It let me cap the controller to a one-amp limit, and the plastic survived.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","Custom Fabrication","SPI","Rapid Prototyping","Lighting Design","ESP8266","Pixel Mapping","Wire-to-Board Soldering"],"gallery":[{"url":"media/Art/Plane Warp/pixelplanewarp_fix.webp","fit":{"scale":1,"x":45.6,"y":41.8},"thumbnail":"media/Art/Plane Warp/pixelplanewarp_fix-thumb.webp"},{"url":"media/Art/Plane Warp/IMG_20230720_092545_165.webp","thumbnail":"media/Art/Plane Warp/IMG_20230720_092545_165-thumb.webp"},{"url":"media/Art/Plane Warp/20230605_021706~3.mp4","poster":"media/Art/Plane Warp/20230605_021706~3-poster.webp","thumbnail":"media/Art/Plane Warp/20230605_021706~3-poster-thumb.webp"},{"url":"media/Art/Plane Warp/20230808_152350.webp","fit":{"scale":1,"x":87.5,"y":37.5},"thumbnail":"media/Art/Plane Warp/20230808_152350-thumb.webp"},{"url":"media/Art/Plane Warp/20230712_072919.webp","fit":{"scale":1,"x":44.3,"y":40.5},"thumbnail":"media/Art/Plane Warp/20230712_072919-thumb.webp"}],"files":[],"video":"","order":5,"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>bounce</em></p><p><strong>PLA+ ( &quot;Transparent&quot; )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"Pyramid","url":"#project/670"},{"name":"Mini Pyramid","url":"#project/5632"}],"thumbnailFit":{"scale":1,"x":49.4,"y":33.1},"bannerFit":{"scale":1,"x":45.2,"y":3.4},"thumbnail":"media/Art/Plane Warp/pixelplanewarp_fix-thumb.webp","specsData":[{"id":"1100d924-9e38-427a-b162-ba43ac034a5b","title":"Pixels & Display","items":[{"id":"4e110414-96ea-4662-b3cf-61180e18b23e","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"2a20d492-6d81-4bb8-95d1-07345035d8b0","title":"FABRICATION & MATERIALS","items":[{"id":"3d5561bf-d871-4714-b8bd-14bd18c8dd45","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"f9d3bb94-c7e8-404a-8c06-efd0dad9f962","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"9b39910f-d02b-4e4e-b63f-e21cfad24857","name":"PLA+ ( White )","qty":"","specs":"bounce"},{"id":"e6551692-8714-4ccf-be45-21667055357e","name":"PLA+ ( \"Transparent\" )","qty":"","specs":"diffusion"},{"id":"00ff1825-6352-4eec-8550-c70ff0ef2cc9","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"21316155-4f0a-4082-b0d6-e6c06003ca63","title":"EMBEDDED ELECTRONICS","items":[{"id":"26105aad-1447-4fdb-90a4-4302ece5702e","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}]},{"id":"8252","timestamp":"2026-01-13T00:14:02.780Z","title":"Temple SF","category":"Systems","image":"media/Integration/Temple SF/banner.webp","description":"<p>Six teardowns before three control systems would talk to each other. The test was one slow diagonal line dragging across the ceiling.</p>","longDescription":"<p>When a heavy track drops, the energy in the room explodes, and the lights have to explode with it. If they don't, you are standing in the dark for a few seconds longer than feels right, and everyone on the floor knows it. That was happening on every big drop at Temple. The operator was in sync with the DJ. The system was not. Releasing a DMX overwrite on the old Road Hog 4 took a macro that needed dozens of screen presses, and those lost seconds were the drop.</p><p>The owners wanted one person to run lighting, video, and pixels at once, so I rebuilt the routing around Madrix as the hub. Resolume and the Hog both fed Art-Net into Madrix on unused universes. Madrix merged them using highest takes priority, meaning whichever source was sending the brighter value won, and pushed the result to the decoders. That made the handoff instant. Black out one system and the other has the room. A video clip on the ceiling could slice across the main screens, override the console colors, and drive every pixel in the building at once.</p><p>I got a little ambitious with the control surface. I installed a 65-inch touchscreen running OSC Pilot for routing and live previews. It technically worked. Live operation under pressure is a different beast, and after a few months the operators ripped the screen out and went back to MIDI controllers.</p><p>I tore the mapping down and rebuilt it six times before all three systems talked to each other clean. Each rebuild meant a fresh Resolume advanced layout, a new canvas size and orientation for the enormous segmented display, re-adjusting Madrix for the pixels, and repatching the lighting on the Hog. Every pass taught me a new trick. My test was always the same: one diagonal line, slowed way down. I would trigger it and watch the ceiling, the back wall, and the pixels to see whether the line stayed one line as it dragged across all of them.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["OSCpilot","OSC","MIDI","DMX","ArtNet","sACN","Show Cockpit","Madrix","Resolume Arena","TCP/IP","Custom Fabrication","Roadhog 4","Pixel Mapping","Video Mapping","ESP32","Power Distribution","NDI"],"gallery":[{"url":"media/Integration/Temple SF/20210621_215648.mp4","poster":"media/Integration/Temple SF/20210621_215648-poster.webp","thumbnail":"media/Integration/Temple SF/20210621_215648-poster-thumb.webp"},{"url":"media/Integration/Temple SF/20210516_190216-2.mp4","poster":"media/Integration/Temple SF/20210516_190216-poster-2.webp","thumbnail":"media/Integration/Temple SF/20210516_190216-poster-2-thumb.webp"},{"url":"media/Integration/Temple SF/20210516_195648_1.mp4","poster":"media/Integration/Temple SF/20210516_195648_1-poster.webp","thumbnail":"media/Integration/Temple SF/20210516_195648_1-poster-thumb.webp"},{"url":"media/Integration/Temple SF/20210517_114547.mp4","poster":"media/Integration/Temple SF/20210517_114547-poster.webp","thumbnail":"media/Integration/Temple SF/20210517_114547-poster-thumb.webp"},{"url":"media/Integration/Temple SF/20210517_111653.mp4","poster":"media/Integration/Temple SF/20210517_111653-poster.webp","thumbnail":"media/Integration/Temple SF/20210517_111653-poster-thumb.webp"},{"url":"media/Integration/Temple SF/20210611_131029.webp","thumbnail":"media/Integration/Temple SF/20210611_131029-thumb.webp"},{"url":"me 4.81 • 728 x 4784</em></p><p><strong>DJ Booth Screen (x1)</strong><br><em>7m x 1.5m • P4.81 • 1456 x 312</em></p><p><strong>Marquee Left Screen (x1)</strong><br><em>14m x 1m • P4.81 • 2912 x 208</em></p><p><strong>Marquee Right Screen (x1)</strong><br><em>18m x 1m • P4.81 • 3744 x 208</em></p><p><strong>Monolith Screens (x1)</strong><br><em>1.5m x 3m (x2) • P4.81 • 312 x 624 (x2)</em></p>","related":[{"name":"Immersive Dance Lighting Rig","url":"#project/1"},{"name":"Dancefloor pillars","url":"#project/6371"},{"name":"WiFi VIP Tables","url":"#project/496"},{"name":"VIP glass wall","url":"#project/8983"},{"name":"LED Pixel Panel","url":"#project/9469"}],"thumbnail":"media/Integration/Temple SF/banner-thumb.webp","specsData":[{"id":"5781dcd9-ca49-4cc5-8cfc-53e6c3a3a11a","title":"FIXTURES & FX","items":[{"id":"2a7f3582-faf0-4be1-ae62-dc7d8ff56e31","name":"Beam","qty":"144","specs":"PD60, LED, beam 4°, 60W, RGBW, infinite pan & tilt "},{"id":"76142e55-860f-48e2-bb5f-b7468cb60503","name":"Spot","qty":"12","specs":"LSM150, LED, spot 15°, 150W, pan 520°, tilt 270°, 7 colors + white, 6 static gobos, 6 rotating gobos, 3 facet prism"},{"id":"8c3d986a-891b-4e6b-864f-c007e984b1eb","name":"Wash","qty":"40","specs":"WFP12, LED, wash 35°, 280W, RGBWA+UV"},{"id":"5c1bb3b7-ad0e-408e-9d35-4145a8053729","name":"Hazer","qty":"2","specs":"Radiance Hazer, DMX, 120Vac, 500W"}]},{"id":"580af2a5-e2b9-4148-8c9e-d0911a9d43f5","title":"PIXELS & DISPLAY","items":[{"id":"8e2d8abf-0a4e-45a6-8baa-322226ffc900","name":"Dancefloor Pixel Pillars","qty":"10","specs":"x8 + 4m, RGBW (6000k), 60/m, 20px/m, "},{"id":"66a7221e-084b-4cc5-a3b4-5b57ac03acd4","name":"WiFi VIP Pixel Tables","qty":"32","specs":"2.1m, RGBW (6000k), 60/m, 20px/m, "},{"id":"24b408bb-0e21-4f08-906d-83417c86b959","name":"Ceiling Screen","qty":"1","specs":"3.5m x 23m, P4.81, 728 x 4784, "},{"id":"3cd1a281-f17e-4ec5-a6fb-625e1cb07dd6","name":"DJ Booth Screen","qty":"1","specs":"7m x 1.5m, P4.81, 1456 x 312, "},{"id":"34e22b00-f32c-44de-9039-8d44b6ac6615","name":"Marquee Left Screen","qty":"1","specs":"14m x 1m, P4.81, 2912 x 208, "},{"id":"cc95cc9f-d9e8-4da7-aeea-231af6ba29ed","name":"Marquee Right Screen","qty":"1","specs":"18m x 1m, P4.81, 3744 x 208, "},{"id":"3646545c-487a-4e9e-867b-6ecb081002c4","name":"Monolith Screens","qty":"1","specs":"1.5m x 3m (x2), P4.81, 312 x 624 (x2), "}]}]},{"id":"9517","title":"Field Solder Station","category":"Tooling","tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","Rapid Prototyping","Hand tools"],"image":"media/Fabrication/Field Solder Station/20250317_180657.webp","description":"<p>Eighty strips, four meters straight up, soldered from a lift. Iron, spool, flux, wick, pump, and two helping hands in one printed block.</p>","longDescription":"<p>At the start of the Temple San Francisco remodel I was on top of a ladder with a plug-in soldering iron in one hand and a heat gun in the other, trying to keep a spool of solder from rolling off the platform. The job was eighty vertical pixel strips, eight per pillar, each running four meters straight up from the dance floor. Every one of them needed joints made from a lift or a ladder. With that much pixel work, the juggling act got aggravating fast.</p><p>What I needed was a carrier for everything at once: a TS100 iron, the solder spool, flux, wick, a pump, sponges, and two helping hands. The early prototypes had rechargeable batteries built in. That added more risk than it was worth, so I stripped the power out entirely. The first field version was a rough thing held together with tape and magnets, and I tweaked it for about a year as the remodel kept growing.</p><p>The final chassis is modeled in SolidWorks and printed in PLA. Everything secures with a friction fit and no fasteners. The helping hands are stiff enough that I have to hold the base down to bend them, which is exactly what you want when the base is sitting on a ladder platform. It has been my main rig for pixel work ever since.</p>","video":"","gallery":[{"url":"media/Fabrication/Field Solder Station/20250317_180657.webp","fit":{"scale":1,"x":48.8,"y":71.6},"thumbnail":"media/Fabrication/Field Solder Station/20250317_180657-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/20210202_182541.webp","thumbnail":"media/Fabrication/Field Solder Station/20210202_182541-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/20201025_014922.webp","thumbnail":"media/Fabrication/Field Solder Station/20201025_014922-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/20201015_000651.webp","thumbnail":"media/Fabrication/Field Solder Station/20201015_000651-thumb.webp"},{"url":"media/Fabrication/Field Solder Station/20201012_144931.webp","thumbnail":"media/Fabrication/Field Solder Station/20201012_144931-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[{"name":"Field Solder Station","url":"media/Fabrication/Field Solder Station/files/fieldsolderstation.zip","description":"Zip file containing the 3mf of the field solder station. Ready to download and print."}],"featured":true,"websiteLink":"","timestamp":"2026-01-13T00:23:48.073Z","wip":false,"order":1,"specs":"<h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>BambuLabs • X1C • | • TenLog • TL-D3</em></p><p><strong>Black PLA+</strong><br><em>Duramic • 1.75mm</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>SolidWorks 2022</strong></p>","related":[],"thumbnailFit":{"scale":1,"x":51.8,"y":72.2},"bannerFit":{"scale":1,"x":49.5,"y":58},"thumbnail":"media/Fabrication/Field Solder Station/20250317_180657-thumb.webp","specsData":[{"id":"c4925e9b-717d-481a-abcf-6baae4ac7da4","title":"FABRICATION & MATERIALS","items":[{"id":"8f273703-afae-48e1-904c-02b52ee06a05","name":"3D Printer","qty":"","specs":"BambuLabs, X1C, |,TenLog, TL-D3"},{"id":"d0e12412-40fe-4f7f-b8c0-50895c38d66d","name":"Black PLA+","qty":"","specs":"Duramic, 1.75mm"}]},{"id":"f10047c8-f68a-43e5-bbbd-a28849cd8e76","title":"SOFTWARE & STACK","items":[{"id":"60e81bea-0aaf-4bf9-b6c7-b0df71788f42","name":"SolidWorks 2022","qty":"","specs":""}]}]},{"id":"9469","title":"LED Pixel Panel","category":"Fixtures","tags":["Resolume Arena","Video Mapping","SPI","Lighting Design"],"image":"media/Electronics/LED Pixel Panel/20200910_134441.webp","description":"<p>With eight feet of clearance, we bolted altered dancefloor boards to aluminum track to build an array under an inch thick.</p>","longDescription":"<p>LED strips droop, and wiring them overhead is a mess. We needed a rigid, identical grid that could hold a diffuser at an even distance without sagging. Large, cheap PCBs were the answer. I took standard LED dancefloor boards and had the manufacturer alter the pixel spacing, enlarge the mounting holes, and swap in 90-degree headers.</p><p>The basement gave us exactly eight feet from the floor tile to the bottom of the wooden joists. Every quarter inch mattered. We ripped out two layers of drywall and rerouted the fire suppression system just to buy breathing room. Half the joists were broken, so I had them fixed and restructured to push the electrical, data, and HVAC runs to the edges of the room, leaving the center clear.</p><p>We bolted the custom boards straight into aluminum T-track, compressing a 24-volt WS2818 pixel matrix into a vertical profile under an inch. I never actually saw it powered on overhead. By the time the basement was ready for the hang, I had left the company. I pixel-mapped the array flat across a sea of road cases, proved the hardware worked, and handed the plans off to my crew to lift into a ceiling that refused to give us another inch.</p>","video":"","gallery":[{"url":"media/Electronics/LED Pixel Panel/20211202_171311.mp4","poster":"media/Electronics/LED Pixel Panel/20211202_171311-poster.webp","thumbnail":"media/Electronics/LED Pixel Panel/20211202_171311-poster-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20211202_171527.mp4","poster":"media/Electronics/LED Pixel Panel/20211202_171527-poster.webp","thumbnail":"media/Electronics/LED Pixel Panel/20211202_171527-poster-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20211202_171343.webp","fit":{"scale":1.5,"x":62.1,"y":68.4},"thumbnail":"media/Electronics/LED Pixel Panel/20211202_171343-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20211118_154350.webp","fit":{"scale":1.3,"x":41.6,"y":80.7},"thumbnail":"media/Electronics/LED Pixel Panel/20211118_154350-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20211118_155135.webp","fit":{"scale":1,"x":50.9,"y":77.8},"thumbnail":"media/Electronics/LED Pixel Panel/20211118_155135-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20200910_13437.webp","thumbnail":"media/Electronics/LED Pixel Panel/20200910_13437-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20200910_134533.webp","thumbnail":"media/Electronics/LED Pixel Panel/20200910_134533-thumb.webp"},{"url":"media/Electronics/LED Pixel Panel/20200910_134441.webp","thumbnail":"media/Electronics/LED Pixel Panel/20200910_134441-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-13T00:48:58.329Z","wip":false,"order":7,"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>Custom PCB</strong><br><em>12 x 6 pixel matrix</em></p><h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x72)</strong><br><em>WS2818 • RGB • 24v</em></p><h2>FABRICATION &amp; DISTRIBUTION</h2><p><strong>Custom Rigging</strong><br><em>t-track • t-nuts • rubber washers • bolts</em></p>","related":[{"name":"Temple SF","url":"#project/8252"}],"bannerFit":{"scale":1,"x":47.9,"y":27.7},"thumbnail":"media/Electronics/LED Pixel Panel/20200910_134441-thumb.webp","specsData":[{"id":"c7663470-16b3-4ba1-a295-a9a5b64110bb","title":"Fixtures & FX","items":[{"id":"e8637ca3-4dca-41d5-945d-697eeac4a790","name":"Custom PCB","qty":"","specs":"12 x 6 pixel matrix"}]},{"id":"7dabe810-f058-4cc9-b0c0-6029a9ce1868","title":"PIXELS & DISPLAY","items":[{"id":"63558504-0796-49cf-a8cd-5aa0f05810de","name":"LED Pixels","qty":"72","specs":"WS2818, RGB, 24v"}]},{"id":"5e61eaa1-f00d-464b-a939-757c8e644dc3","title":"Fabrication & Distribution","items":[{"id":"7088ad25-8923-40c3-93f5-df306ca35cfd","name":"Custom Rigging","qty":"","specs":"t-track, t-nuts, rubber washers, bolts"}]}]},{"id":"5416","title":"LVL","category":"Fixtures","tags":["Pixel Mapping","Madrix","Hand tools","Power tools","ArtNet","MIDI","TCP/IP","SPI","Repair","AC/DC Load Calc","Power Distribution","Lighting Design","Wire-to-Board Soldering"],"image":"media/Electronics/LVL/IMG_20191009_231844.webp","description":"<p>Floor channels set on wood inserts. Months of spilled drinks swelled them until the diffusion caved in. The tape was worth saving.</p>","longDescription":"<p>I needed custom acrylic support strips for floor pixels because the existing channels were construction-adhesived into the floor and refused to come out. Someone had installed unsealed tracks using wood inserts. The wood absorbed months of spilled drinks, mop water, and sewage backups until the diffusion caved in and shattered. Even the foam tape holding the strips smelled like club funk. The pixel tape itself was expensive and salvageable. I cut out the shorted sections, scrubbed the tracks, and built new supports out of acrylic. I knew the plastic would survive if the silicone seal ever broke again.</p><p>Wiring sixteen strip runs across the room required heavy power injection to stop voltage drop. My first attempt was unstable. I ran DC wire in parallel and tied the negative leads together back in the supply room, which triggered ground loop flicker across part of the system. The fix was coupling the negative leads close to the pixels above the dancefloor. The pillar modules also fought me because of undersized wire, so I added more injection points and ground jumpers until the signal stabilized.</p><p>Once the power and data lines behaved, I mapped the floor, pillars, and ceiling into a 3D voxel setup. The room runs almost entirely on those pixels. Now the control system drives spatial sweeps through the room, and the floor channels can take a direct hit from a spilled drink without shorting out.</p>","video":"","gallery":[{"url":"media/Electronics/LVL/VID_20181107_194547.mp4","fit":{"scale":1.1,"x":6.6,"y":25},"poster":"media/Electronics/LVL/frame-thumb-1786219096452.webp","thumbnail":"media/Electronics/LVL/frame-thumb-1786219096452-thumb.webp"},{"url":"media/Electronics/LVL/Video Project 10 (3).mp4","fit":{"scale":1.1,"x":79.2,"y":96.8},"poster":"media/Electronics/LVL/frame-thumb-1786219127360.webp","thumbnail":"media/Electronics/LVL/frame-thumb-1786219127360-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20191009_231844.webp","fit":{"scale":1,"x":48,"y":28.1},"thumbnail":"media/Electronics/LVL/IMG_20191009_231844-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20191009_231900.webp","fit":{"scale":1.1,"x":73.3,"y":32.1},"thumbnail":"media/Electronics/LVL/IMG_20191009_231900-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20181107_194215.webp","fit":{"scale":1.15,"x":100,"y":30.7},"thumbnail":"media/Electronics/LVL/IMG_20181107_194215-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180926_042731.webp","fit":{"scale":1,"x":49.1,"y":1},"thumbnail":"media/Electronics/LVL/IMG_20180926_042731-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20190723_101926.webp","fit":{"scale":1,"x":50.9,"y":78.9},"thumbnail":"media/Electronics/LVL/IMG_20190723_101926-thumb.webp"},{"url":"media/Electronics/LVL/VID_20180516_143529.mp4","poster":"media/Electronics/LVL/frame-thumb-1786219215596.webp","thumbnail":"media/Electronics/LVL/frame-thumb-1786219215596-thumb.webp"},{"url":"media/Electronics/LVL/VID_20180627_171922.mp4","fit":{"scale":1.15,"x":1.4,"y":0},"poster":"media/Electronics/LVL/VID_20180627_171922-poster.webp","thumbnail":"media/Electronics/LVL/VID_20180627_171922-poster-thumb.webp"},{"url":"media/Electronics/LVL/VID_20180925_154339.mp4","fit":{"scale":1.15,"x":52.2,"y":66.3},"poster":"media/Electronics/LVL/frame-thumb-1786219264064.webp","thumbnail":"media/Electronics/LVL/frame-thumb-1786219264064-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180926_042750.webp","fit":{"scale":1.35,"x":99.5,"y":41.6},"thumbnail":"media/Electronics/LVL/IMG_20180926_042750-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180627_171913.webp","fit":{"scale":1,"x":55.4,"y":34.1},"thumbnail":"media/Electronics/LVL/IMG_20180627_171913-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180913_155906.webp","fit":{"scale":1,"x":60.7,"y":100},"thumbnail":"media/Electronics/LVL/IMG_20180913_155906-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180912_153940.webp","fit":{"scale":1,"x":55.2,"y":99.8},"thumbnail":"media/Electronics/LVL/IMG_20180912_153940-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180913_193013.webp","fit":{"scale":1.15,"x":0,"y":57},"thumbnail":"media/Electronics/LVL/IMG_20180913_193013-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180912_113756.webp","thumbnail":"media/Electronics/LVL/IMG_20180912_113756-thumb.webp"},{"url":"media/Electronics/LVL/IMG_20180628_121319.webp","fit":{"scale":1.2,"x":83.4,"y":23.7},"thumbnail":"media/Electronics/LVL/IMG_20180628_121319-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-17T17:46:42.266Z","wip":false,"order":2,"specs":"<h2>SOFTWARE &amp; STACK</h2><p><strong>Pixel Control</strong><br><em>Madrix 5.x</em></p>","related":[{"name":"Temple Denver","url":"#project/4382"},{"name":"MIRUS","url":"#project/4939"}],"thumbnailFit":{"scale":1,"x":0,"y":37.7},"bannerFit":{"scale":1,"x":42.1,"y":24.6},"thumbnail":"media/Electronics/LVL/IMG_20191009_231844-thumb.webp","specsData":[{"id":"e7ddab30-0d75-4dbb-9572-cc575815adf5","title":"Software & stack","items":[{"id":"678778b4-98c8-4395-99c2-df5f0aeebd11","name":"Pixel Control","qty":"","specs":"Madrix 5.x"}]}]},{"id":"4939","title":"MIRUS","category":"Lighting","tags":["AC/DC Load Calc","DMX","Hand tools","Lighting Design","Madrix","Power Distribution","Power tools","Wire-to-Board Soldering"],"image":"media/Lighting/MIRUS/IMG_20180614_235653.webp","description":"<p>Blasting saturated light against white walls washes out the art, but the paintings were psychedelic anyway.</p>","longDescription":"<p>Someone handed me a parts list and told me to build a ceiling rig. Another crew had already hung eighty wooden baffles twelve feet above the floor. I had them also press in the RGBW wash strips in routed channels on the bottom. The channels had sharp ninety-degree corners. Bending flexible copper tape around those turns snapped the backing. I ended up doing quite a lot of repairs.</p><p>To keep the install clean, I ran the wiring out the ends of the wood and straight up into a six-foot plenum. I walked across the rafters up there to build the control system. I grouped the baffles into ten zones, pairing one power supply to one DMX decoder with 8 outputs. The power units they bought ran with loud fans. Usually, that ruins an art gallery. Luckily, the room shared a door with a nightclub. The ambient bass swallowed the fan hum.</p><p>I wired the decoders to control each baffle individually while keeping the ceiling on a single DMX universe. During the day, the room needed flat white illumination. At night, we flipped a preset and the ceiling ran heavy color chases. Blasting saturated light against white walls completely washed out the art. Because most of the paintings were psychedelic anyway, I threw out standard gallery rules. We let the colors bleed and turned the room into an extension of the dance floor.</p>","video":"","gallery":[{"url":"media/Lighting/MIRUS/IMG_20180614_235653.webp","fit":{"scale":1,"x":46.8,"y":0},"thumbnail":"media/Lighting/MIRUS/IMG_20180614_235653-thumb.webp"},{"url":"media/Lighting/MIRUS/Video Project 10 (5).mp4","fit":{"scale":1.3,"x":0.3,"y":100},"poster":"media/Lighting/MIRUS/frame-thumb-1786199438087.webp","thumbnail":"media/Lighting/MIRUS/frame-thumb-1786199438087-thumb.webp"},{"url":"media/Lighting/MIRUS/IMG_20180417_174333.webp","fit":{"scale":1,"x":6.6,"y":77.1},"thumbnail":"media/Lighting/MIRUS/IMG_20180417_174333-thumb.webp"},{"url":"media/Lighting/MIRUS/IMG_20180408_233818~2.webp","fit":{"scale":1,"x":49.6,"y":81.7},"thumbnail":"media/Lighting/MIRUS/IMG_20180408_233818~2-thumb.webp"},{"url":"media/Lighting/MIRUS/VID_20180319_194746.mp4","poster":"media/Lighting/MIRUS/VID_20180319_194746-poster.webp","thumbnail":"media/Lighting/MIRUS/VID_20180319_194746-poster-thumb.webp"},{"url":"media/Lighting/MIRUS/IMG_20180311_221410.webp","fit":{"scale":1,"x":51.6,"y":81.4},"thumbnail":"media/Lighting/MIRUS/IMG_20180311_221410-thumb.webp"},{"url":"media/Lighting/MIRUS/IMG_20180311_221426.webp","fit":{"scale":1.25,"x":15.9,"y":28.2},"thumbnail":"media/Lighting/MIRUS/IMG_20180311_221426-thumb.webp"}],"launchLink":"","githubLink":"","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-17T17:47:45.485Z","wip":false,"order":13,"thumbnailFit":{"scale":1.2,"x":0,"y":23.8},"bannerFit":{"scale":1,"x":50.4,"y":27.4},"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>Custom Wood Baffles (x80)</strong><br><em>5m RGBW Strip</em></p><h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Strip (x80)</strong><br><em>Environmental Lights • 5m • RGBW (6000k) • wash strip • 24Vdc</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supplies (x12)</strong><br><em>MEAN WELL • RSP-1000-24 • 24Vdc • 40A</em></p><p><strong>DMX Decoder (x12)</strong><br><em>Environmental Lights • 32ch • 8 RGBW output</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>LED Control</strong><br><em>Madrix 5.x</em></p>","related":[{"name":"Temple Denver","url":"#project/4382"},{"name":"LVL","url":"#project/5416"}],"thumbnail":"media/Lighting/MIRUS/IMG_20180614_235653-thumb.webp","specsData":[{"id":"43d0b178-c6e7-451f-8994-612a14bc0f1d","title":"FIXTURES & FX","items":[{"id":"beac86e1-79e3-4305-be0b-ee1417789754","name":"Custom Wood Baffles","qty":"80","specs":"5m RGBW Strip"}]},{"id":"ada1b23b-9410-489d-8ec9-9446a1ad6f7e","title":"PIXELS & DISPLAY","items":[{"id":"d7b6f77e-ec42-436d-8298-2eaed1f31198","name":"LED Strip","qty":"80","specs":"Environmental Lights, 5m, RGBW (6000k), wash strip, 24Vdc, "}]},{"id":"7fa95e97-485f-4831-972d-26e8cc81b728","title":"POWER & DISTRIBUTION","items":[{"id":"8e53273d-2deb-4043-ad6b-17a693109af5","name":"Power Supplies","qty":"12","specs":"MEAN WELL • RSP-1000-24 • 24Vdc • 40A"},{"id":"55f9aa27-688e-4cc8-967e-cde9b7e08a11","name":"DMX Decoder","qty":"12","specs":"Environmental Lights, 32ch, 8 RGBW output"}]},{"id":"def52289-3940-4dcc-8425-0dc52008c7fe","title":"Software & stack","items":[{"id":"598bc5e8-01ef-4f2d-93b0-b1a4454eda2f","name":"LED Control","qty":"","specs":"Madrix 5.x"}]}]},{"id":"8787","timestamp":"2026-01-17T17:49:41.986Z","title":"Inflatable Tubes","category":"Lighting","image":"media/Lighting/Inflatable Tubes/20230621_172727.webp","description":"<p>Crawling inside an inflated three-foot cylinder on a concrete floor is a disorienting way to wire pixels.</p>","longDescription":"<p>The centerpiece for Denver Pride was an array of eight inflatable tubes rigged to the ceiling beams. Standard LED tape was never going to cut through a club lighting rig. I ordered custom 24-volt pixel strands with double-sided clear lenses. I inflated the three-foot tubes on the concrete floor, turned the strands on, and crawled inside to tie the wiring down. It was disorienting. The tubes had strange twists in unusual directions, and dragging myself over the concrete hurt.</p><p>I ran two strands in parallel inside each tube. Pushing that much load causes voltage drop, so I put a power supply at both ends and severed the positive wire at the midpoint to stop back-feeding. We hoisted them empty and powered the fans in the air. The wireless control system worked perfectly during load-in. Then two thousand people walked into the room. Their cell phones choked the RF environment. Data rates dropped to five frames per second, and the tubes lost connection.</p><p>I used wireless decoders to save money. It is a choice I would reverse today. Luckily, I programmed their default state to a static Pride palette. When the signal dropped, the centerpiece stayed on theme. The rig pushed out enough light that another fabricator called me later to ask what hardware I used. I got the venue through the weekend on the fallback palette and told them to hardwire the data next time.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Lighting Design","Pixel Mapping","Resolume Arena","ArtNet","WLED","Embedded Systems","AC/DC Load Calc"],"gallery":[{"url":"media/Lighting/Inflatable Tubes/20230621_172739.webp","fit":{"scale":1,"x":54.1,"y":81.1},"thumbnail":"media/Lighting/Inflatable Tubes/20230621_172739-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230621_172749.webp","fit":{"scale":1,"x":49.8,"y":76.7},"thumbnail":"media/Lighting/Inflatable Tubes/20230621_172749-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/Video Project 22 (4).mp4","fit":{"scale":1.05,"x":78.4,"y":79.7},"poster":"media/Lighting/Inflatable Tubes/frame-thumb-1786197874300.webp","thumbnail":"media/Lighting/Inflatable Tubes/frame-thumb-1786197874300-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230621_172427.mp4","fit":{"scale":1.05,"x":59.8,"y":49.7},"poster":"media/Lighting/Inflatable Tubes/frame-thumb-1786197988499.webp","thumbnail":"media/Lighting/Inflatable Tubes/frame-thumb-1786197988499-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230621_172541.mp4","fit":{"scale":1.05,"x":95.9,"y":32.7},"poster":"media/Lighting/Inflatable Tubes/frame-thumb-1786198246558.webp","thumbnail":"media/Lighting/Inflatable Tubes/frame-thumb-1786198246558-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230621_172621.mp4","fit":{"scale":1,"x":49.5,"y":22.4},"poster":"media/Lighting/Inflatable Tubes/frame-thumb-1786198333307.webp","thumbnail":"media/Lighting/Inflatable Tubes/frame-thumb-1786198333307-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_205214.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230615_205214-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230616_091904.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230616_091904-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_204414.webp","fit":{"scale":1,"x":58.2,"y":61.9},"thumbnail":"media/Lighting/Inflatable Tubes/20230615_204414-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_194557.webp","fit":{"scale":1,"x":44.6,"y":31.6},"thumbnail":"media/Lighting/Inflatable Tubes/20230615_194557-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_193318.webp","fit":{"scale":1,"x":50,"y":59.8},"thumbnail":"media/Lighting/Inflatable Tubes/20230615_193318-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_223123.webp","fit":{"scale":1,"x":47.9,"y":28.1},"thumbnail":"media/Lighting/Inflatable Tubes/20230615_223123-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230616_095821.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230616_095821-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230605_162502.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230605_162502-thumb.webp"},{"url":"media/Lighting/Inflatable Tubes/20230615_172756.webp","thumbnail":"media/Lighting/Inflatable Tubes/20230615_172756-thumb.webp"}],"files":[],"video":"","order":2,"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>Short Tubes (x4)</strong><br><em>2x UCS1903 strand (23m) • clear lens • 6 LED • RGB • 5px/m • 24Vdc • 115px</em></p><p><strong>Long Tubes (x4)</strong><br><em>2x UCS1903 strand (30m) • clear lens • 6 LED • RGB • 5px/m • 24Vdc • 150px</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supply (x16)</strong><br><em>MEAN WELL • HLG-240H-24 • 24Vdc • 10A</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x16)</strong><br><em>Athom • LS4P-WLED-LA • WLED</em></p><h2>SOFTWARE &amp; STACK</h2><p><strong>Pixel Mapping</strong><br><em>Resolume Arena</em></p>","related":[{"name":"Tracks Discotheque","url":"#project/3671"}],"thumbnailFit":{"scale":1.4,"x":56.3,"y":65.5},"bannerFit":{"scale":1.4,"x":56.5,"y":69.3},"thumbnail":"media/Lighting/Inflatable Tubes/20230621_172727-thumb.webp","specsData":[{"id":"f7a7fc58-35da-4974-a99d-fbd4d05bc8ba","title":"PIXELS & DISPLAY","items":[{"id":"ad536884-ebd6-4f14-aabc-e32faeb755bc","name":"Short Tubes","qty":"4","specs":"2x UCS1903 strand (23m), clear lens, 6 LED, RGB, 5px/m, 24Vdc, 115px, "},{"id":"b4fda374-2d65-4e0f-895d-ed807aeece58","name":"Long Tubes","qty":"4","specs":"2x UCS1903 strand (30m), clear lens, 6 LED, RGB, 5px/m, 24Vdc, 150px, "}]},{"id":"feab1f3b-f525-4bcd-b8c6-1ada43c4eed2","title":"POWER & DISTRIBUTION","items":[{"id":"e7c0943d-6f7f-4b67-b20f-c598df8cf1d6","name":"Power Supply","qty":"16","specs":"MEAN WELL, HLG-240H-24, 24Vdc, 10A"}]},{"id":"9206f0d8-b3da-497b-880e-4c899cbcf803","title":"Embedded electronics","items":[{"id":"50199a95-a4e1-43ef-874b-764cdfe96b8e","name":"Pixel Decoder","qty":"16","specs":"Athom, LS4P-WLED-LA, WLED"}]},{"id":"52f2876a-2088-47a9-a7d2-efeee81af6ed","title":"SOFTWARE & STACK","items":[{"id":"e115ab72-2a4a-4200-b21c-eba758b83234","name":"Pixel Mapping","qty":"","specs":"Resolume Arena"}]}]},{"id":"9925","title":"GeoLens Pro","category":"Software","tags":["React","TypeScript","REST APIs"],"image":"media/Apps/GeoLens Pro/Screenshot_20260118_082950_Chrome.webp","description":"<p>A day on site leaves two hundred photos in one camera roll. This reads the GPS tag and files each one under the job it was shot at.</p>","longDescription":"<p>For a few years I was doing lighting installs and maintenance all over the Denver metro area, and my phone was the job file. Reference photos, shots of patch lists, pages of manuals, and a lot of wiring sketches drawn right on top of the photos. All of it dumped into one camera roll, and I never took the time to sort it. Finding the patch list from a site three weeks ago meant scrolling.</p><p>GeoLens Pro sorts by where you were standing. Each project gets a geofence on a map. Import a batch of photos, or take them live, and the app reads the GPS tag from each one and checks it against every active boundary. If it lands inside one, it files straight to that job. Anything that misses drops into a bin for manual sorting. I added a canvas editor so the wiring notes I was already scribbling could go on the image inside the app instead of in a separate markup tool.</p><p>I prototyped it on Lovable with everything stored locally in the browser. Then I left contract work before it saw a full season, so it never got the real-world run it was built for. Of everything here, it is the one that most needs a job site to prove itself on.</p>","video":"","gallery":[{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082611_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082611_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082803_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082803_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082823_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082823_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082832_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082832_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082925_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082925_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_082950_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_082950_Chrome-thumb.webp"},{"url":"media/Apps/GeoLens Pro/Screenshot_20260118_083031_Chrome.webp","thumbnail":"media/Apps/GeoLens Pro/Screenshot_20260118_083031_Chrome-thumb.webp"},{"url":"media/Apps/ ty":"","specs":"Supabase"},{"id":"35d347b9-6fc6-4ba4-b90a-4e7544249d9d","name":"Deploy","qty":"","specs":"Lovable"}]}]},{"id":"3991","title":"PixelForge","category":"Software","tags":["React","TypeScript","LLM Integration"],"image":"media/Apps/PixelForge/Screenshot 2026-07-25 173231.webp","description":"<p>Pick a category, roll the dice, type nothing. It kept producing the same pose until I found I was feeding old prompts back into the context.</p>","longDescription":"<p>This one exists purely for fun. I am fascinated by how these models think, and I wanted to see how far off the rails I could push an image generator without typing anything. So I put a language model in front of it. You pick a category, roll the dice, and the model hallucinates an abstract prompt before any image rendering starts.</p><p>Early on it fell into a rut. Every character came back in the same pose, run after run. It turned out I was accidentally feeding the previous prompts back into the new context, so the model was quietly agreeing with itself. I isolated the client-side state so the app forgets every old generation between runs. Even with a clean slate, individual models drift toward their own habits, so I added a switch to route prompts across different versions and break the convergence.</p><p>The whole session history lives in the browser. I roll the dice, see what comes out, and roll again.</p>","video":"","gallery":[{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173332.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173332-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173246.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173246-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173231.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173231-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173207.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173207-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173147.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173147-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173126.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173126-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173111.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173111-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173100.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173100-thumb.webp"},{"url":"media/Apps/PixelForge/Screenshot 2026-07-25 173040.webp","thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173040-thumb.webp"}],"launchLink":"https://elusid108.github.io/PixelForge-AI/","githubLink":"https://github.com/Elusid108/PixelForge-AI","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-18T14:24:23.784Z","wip":true,"order":11,"specs":"<h2>SOFTWARE &amp; STACK</h2><p><strong>Framework</strong><br><em>React 18</em></p><p><strong>Language</strong><br><em>TypeScript</em></p><p><strong>Build</strong><br><em>Vite</em></p><p><strong>Styling</strong><br><em>Tailwind CSS</em></p><p><strong>State</strong><br><em>Zustand</em></p><p><strong>AI</strong><br><em>Google Gemini (text) • Google Imagen (image)</em></p><p><strong>Storage</strong><br><em>IndexedDB • localStorage</em></p><p><strong>Export</strong><br><em>JSZip</em></p><p><strong>Deploy</strong><br><em>GitHub Pages</em></p>","related":[],"thumbnail":"media/Apps/PixelForge/Screenshot 2026-07-25 173231-thumb.webp","specsData":[{"id":"d1e21b11-5ae5-4d97-a951-79fb9097f04a","title":"SOFTWARE & STACK","items":[{"id":"185bb6d4-8947-4586-b595-64119e3599de","name":"Framework","qty":"","specs":"React 18"},{"id":"dd4afe1c-6390-4ea4-8a72-a41760db0743","name":"Language","qty":"","specs":"TypeScript"},{"id":"2a01a833-9483-4e4f-97b6-0129e705ba23","name":"Build","qty":"","specs":"Vite"},{"id":"7b30f0d3-10ad-45ae-924c-1f1d797d3a95","name":"Styling","qty":"","specs":"Tailwind CSS"},{"id":"c9d60684-0e73-4433-bd64-c9b4b896af75","name":"State","qty":"","specs":"Zustand"},{"id":"dc4999ec-5bec-4e67-9b2b-17f192b4b8db","name":"AI","qty":"","specs":"Google Gemini (text), Google Imagen (image)"},{"id":"9c1abb2c-e3bf-41db-acc7-ab4ddfe68ea4","name":"Storage","qty":"","specs":"IndexedDB, localStorage"},{"id":"13e52ce9-6c25-46b4-8402-777c55621f50","name":"Export","qty":"","specs":"JSZip"},{"id":"96937077-72d3-448f-b407-c4de75f8e53f","name":"Deploy","qty":"","specs":"GitHub Pages"}]}]},{"id":"7085","title":"Chronicle: Iterative Fiction Engine","category":"Software","tags":["React","JavaScript","LLM Integration"],"image":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 182215.webp","description":"<p>Every turn generates a scene, an illustration, and narration. Without a memory stack, the art drifted and the plot looped.</p>","longDescription":"<p>The longest session I have played was on a ship. I spent it going cabin to cabin looking for a key to open a box, and the game kept generating rooms, illustrating them, and reading them to me. I never found the key. I also have not finished a story end to end yet, because the mechanics are still the thing I am fixing.</p><p>Every turn in Chronicle is generated from scratch: a short scene, an illustration, and narration. You pick one of four choices or type your own. When you have had enough, you hit end and the engine gives you five final choices that lock in the outcome. Early versions fell apart fast. Without a strict memory structure, the art style drifted, the plot looped, and the prompt kept growing until the engine choked on it. I built a memory stack that compresses older events into shorthand while carrying forward the exact visual tags the image model needs. A turn used to take two minutes. Lighter models got it down to twenty seconds.</p><p>It runs with no backend and no build step, which is painful enough that I plan to tear the engine down and start over. The ship is still out there.</p>","video":"","gallery":[{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 184721.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 184721-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 185736.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 185736-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190202.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190202-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190218.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190218-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190442.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190442-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190505.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190505-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190524.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-18 190524-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 173338.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 173338-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181638.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181638-thumb.webp"},{"url":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181802.webp","thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Screenshot 2026-01-26 181802-thumb.webp"},{"url":"m
