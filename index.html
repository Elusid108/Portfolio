            "image": "media/Apps/Portfolio Website Generator/header.webp",
            "description": "<p><br></p>",
            "longDescription": "<h2>Overview</h2><p>Portfolio CMS is a bespoke Content Management System (CMS) designed to bridge the gap between static site generation and dynamic content management. Built to run entirely within the Google Workspace ecosystem, it transforms a simple Google Sheet into a powerful database and backend for a professional, React-based portfolio website. This project eliminates the need for traditional hosting fees, complex database setups, or third-party CMS subscriptions, offering a truly serverless and zero-cost solution for creatives.</p><h2>Key Features</h2><ul><li><strong>Spreadsheet-as-a-Database:</strong> Utilizes Google Sheets as a relational database to store project metadata, categorized tags, gallery links, and global site settings.</li><li><strong>Visual Admin Interface:</strong> A custom-built, responsive web application (deployed via Google Apps Script) serves as the admin panel. It features:</li><li class=\"ql-indent-1\"><strong>Rich Text Editing:</strong> Integrated Quill.js editors for formatting project descriptions with bold, italics, lists, and headers.</li><li class=\"ql-indent-1\"><strong>Dynamic List Management:</strong> Drag-and-drop style interfaces for managing gallery images and downloadable files.</li><li class=\"ql-indent-1\"><strong>Live Preview &amp; Publishing:</strong> One-click publishing that generates a static HTML file, injects the latest data, and saves it directly to Google Drive for hosting via GitHub Pages or similar platforms.</li><li><strong>Smart Automation:</strong></li><li class=\"ql-indent-1\"><strong>Featured Project Logic:</strong> Automatically handles \"Featured\" status across categories, ensuring only one project per category is highlighted on the hero board.</li><li class=\"ql-indent-1\"><strong>Media Handling:</strong> Automatically detects YouTube links to generate thumbnails and embedded players, while standardizing image URLs.</li><li class=\"ql-indent-1\"><strong>Data Sanitization:</strong> Cleans and formats incoming data to ensure consistent front-end rendering.</li><li><strong>Modern Front-End:</strong> The generated website is a single-file React application styled with Tailwind CSS, featuring:</li><li class=\"ql-indent-1\"><strong>Glassmorphism Design:</strong> A modern, dark-mode aesthetic with blurred backdrops and smooth transitions.</li><li class=\"ql-indent-1\"><strong>Responsive Layouts:</strong> Fully adaptive grids for mobile, tablet, and desktop views.</li><li class=\"ql-indent-1\"><strong>Interactive Components:</strong> Custom-built lightboxes, modals, and navigation menus.</li></ul><h2>Technical Stack</h2><ul><li><strong>Backend:</strong> Google Apps Script (Serverless Node.js environment)</li><li><strong>Database:</strong> Google Sheets API</li><li><strong>Frontend (Admin):</strong> HTML5, Tailwind CSS, Vanilla JavaScript</li><li><strong>Frontend (Public Site):</strong> React 18, Tailwind CSS, Lucide React Icons</li><li><strong>Integrations:</strong> EmailJS (Serverless contact form), Google Analytics 4</li></ul><h2>The \"Why\"</h2><p>As a multidisciplinary designer, I needed a way to update my portfolio without touching code every time I finished a project. Existing solutions were either too rigid (Wix/Squarespace) or too complex/expensive for a simple static site (Contentful/Sanity). Portfolio CMS was born from the desire to own the entire stack—data, logic, and presentation—while keeping the maintenance overhead near zero.</p>",

            "image": "media/Lighting/Temple San Francisco/20210516_134200.webp",
            "description": "<p>A comprehensive, hybrid lighting and video installation engineered for seamless cross-system pixel mapping and total venue immersion.</p>",
            "longDescription": "<p>The main room remodel at Temple Nightclub in San Francisco is a dense, hybrid lighting and video installation designed to deliver maximum environmental immersion and operational flexibility. The core architecture integrates a curved video ceiling that wraps behind the DJ, ten custom floor-to-ceiling LED pixel pillars, and a vast array of moving wash fixtures. The primary differentiator of this design is its meticulous flat-black construction across all hardware components. This design choice allows the entire complex infrastructure to vanish completely into the dark when unlit, contrasting sharply with the massive visual output of the active rig.</p><p>Constructed during the 2020 pandemic shutdown, the installation required profound physical and electrical infrastructure modifications before aesthetic integration could begin. To safely accommodate the curved video ceiling, a fire-suppression team was brought in to entirely reroute the sprinklers to deploy beneath the wall. The venue's power capacity was completely overhauled with new 400-amp and 200-amp services and breaker panels, feeding a meticulously mapped network of dedicated and shared circuits based on strict component specifications. Operational efficiency was prioritized throughout the physical build; all rig power was placed on switched relays for centralized shut-down, and independent, hardwired house lighting was installed to allow staff maintenance without activating the complex show systems.</p><p>The defining technical achievement of the installation is the cohesive, cross-system pixel mapping infrastructure layered on top of this robust electrical foundation. By linking the video playback engine directly to the room's environmental lighting—including custom edge-lit VIP tables, illuminated booths, and a double-sided dancefloor monolith—the system translates localized video content into precise color and intensity data distributed across the entire venue. To manage the sheer density and potential output of this rig, the operational strategy enforces highly selective, limited use across all combined systems. This strict design discipline avoids over-lighting the dancefloor while ensuring massive, unified full-room looks can be generated efficiently from centralized media inputs.</p><p><br></p><h2>Specs</h2><p>(144) PixelDots</p><p>(12) 150w Hybrid Zoom Lights</p><p>(40) RGBWA+UV Wash Fixtures</p><p>(2) Radiance Hazers</p><p>(6400) RGBW LED Pixel Pillars</p><p>(234) 1m x 0.5m Video Panels (4.81p)</p><p>(60) 0.5m x 0.5m Video Panels (4.81p)</p>",

            "category": "Art",
            "image": "media/Art/Pixel Emmy Stand/header.webp",
            "description": "<p>A custom 3D printed display stand utilizing high density LED pixels to create dynamic architectural lighting.</p>",
            "longDescription": "<p>This project is a custom display stand designed specifically to house and illuminate an Emmy award. The core objective was to scale down professional live entertainment lighting design principles into a miniature desktop footprint. Unlike standard display cases, this piece treats the award as a practical subject by utilizing a five part optical array to provide structural uplighting, directional side booms, and a dynamic illuminated backdrop.</p><p>The fabrication process combined custom 3D modeling and additive manufacturing using Bambu Lab printers to build a specialized structural enclosure. The physical workflow involved integrating 12 volt WS2815 LED pixels at a high density of 144 per meter throughout the framework. These visual components include a raised pedestal with bounced front lighting, a base styled as a traditional film strip, six sweeping boom towers for side and upward lighting angles, a pleated backdrop, and vertical wall washing strips on the outer edges.</p><p>The primary technical achievement is the thermal and power management system required to safely drive high density LEDs within a plastic enclosure. The fixture operates on a Wasatch Pixels Basic Eight Controller running WLED firmware for precise addressable lighting control. To prevent the 3D printed chassis from warping, the overall current draw is strictly limited in software, successfully balancing optimal visual brightness with safe operating temperatures.</p>",

            "image": "media/Apps/LithoLab/image2.webp",
            "description": "<p>A fully browser-based web application for generating custom-shaped, multi-color 3D printable lithophanes with AI-assisted design tools.</p>",
            "longDescription": "<p><strong>LithoLab </strong>is a client-side web application designed to generate high-fidelity, custom-shaped lithophanes for 3D printing. While standard generators are restricted to traditional four-color CMYK constraints, LithoLab supports customizable, multi-color palettes to achieve superior color accuracy in the final physical print. The project differentiates itself by introducing custom masking capabilities that trim the lithophane into non-standard shapes, along with generating an independently exportable geometric border for polished, multi-part assemblies.</p><p>The system architecture was developed by porting the open-source PIXEStl backend to execute entirely within the browser, avoiding server-side processing overhead. The workflow is managed through a custom frontend interface where users upload source imagery, define masking parameters, and configure border dimensions. Upon export, the software isolates the customized border as a discrete 3D object, allowing users to assign specific filaments and colors when preparing the files in slicing software like Bambu Studio.</p><p>The standout technical achievement is the robust JavaScript implementation of the modified PIXEStl engine, paired with an integrated Google Gemini API for generating base images, structural masks, and file metadata. To solve the hardware constraints of color mapping on advanced machines like the Bambu Lab X1C, a dedicated companion utility called LithoPalletGen was built in parallel. This secondary application handles precise color palette generation, import/export functionality, and material calibration to ensure accurate physical reproduction of the digital models.</p><p><br></p><p>Check out the companion app <a href=\"https://elusid108.github.io/LithoPalletGen/\" target=\"_blank\">LithoPalletGen</a> to generate calibrated pallet files for LithoLab.</p>",

            "image": "media/Apps/Unfold/Screenshot 2026-07-25 154856.webp",
            "description": "<p>A React based web application featuring interactive card decks designed to facilitate meaningful conversations and reconnect people.</p>",
            "longDescription": "<p><strong>Unfold </strong>is a web application designed to help users reconnect with friends and family when relationships become routine. The interactive card game provides structured questions across four distinct decks to prompt reflection and meaningful dialogue. Unlike standard physical card games, Unfold adapts to user preferences by offering three distinct play modes, including a curated journey sequence that gradually deepens the interaction. The digital format optimizes the experience for remote communication over video calls.</p><p>The development process began with rapid prototyping using the Lovable platform to establish the core user experience and interaction logic. Following the initial proof of concept, the project was migrated to a dedicated GitHub repository for independent development and architectural refinement. The primary workflow centers on user choice, allowing individuals to pull from specific decks, combine all cards randomly, or set a defined number of prompts for a structured progression. This flexible logic ensures that users can tailor the depth and pace of their conversations.</p><p>The application operates on a modern React and TypeScript foundation that prioritizes performance and data privacy. The technical core utilizes a custom state management layer built with React Hooks and the LocalStorage API, ensuring all sensitive user interactions remain securely on the client side. The front end integrates Tailwind CSS and Radix UI primitives to deliver an accessible, responsive, and visually refined interface. This UI architecture maintains fluid transitions and robust state handling during complex card drawing interactions.</p>",

            "title": "Pixel Pyramid",
            "category": "Art",
            "image": "media/Art/Pixel Pyramid/20230717_154820.webp",
            "description": "<p>A 3D-printed, single-print LED pixel art sculpture utilizing clear shells and software-limited thermal management for maximum brightness.</p>",
            "longDescription": "<p>The LED pixel pyramid is an internally divided, single-print pixel art sculpture. The primary goal was to create a vibrant, multi-material light installation without the need for complex post-print assembly. While early proofs of concept were successfully prototyped on an IDEX printer using standard black and white filaments, the opaque outer shell severely limited the light transmission to dark environments. By shifting to a clear top shell, the design maximizes luminosity and creates a much more versatile display piece.</p><p>The fabrication process relies heavily on the speed and multi-material capabilities of the Bambu Lab X1C. Moving from rough prototypes to the final model requires continuous printing over a 1 to 3-day cycle, with three filament swaps occurring on every layer. While this approach achieves the necessary visual quality and structural integrity, it introduces unique challenges with material swap waste, which will inform future optimizations using tool-changer machines.</p><p>The primary engineering hurdle involved managing the trapped internal heat generated by the LEDs, which threatened to warp the 3D-printed structure over time. To solve this, precision software-side current limiting was implemented via WLED. This ensures a perfect balance between maximum visual brightness and safe thermal dynamics, preserving the integrity of the piece.</p><p><br></p><h2><strong>Specs</strong></h2><p><strong>Medium:</strong> PLA+ (3 material)</p><p><strong>Color:</strong> Black, White, Transparent</p><p><strong>LEDs: </strong>256</p><p><strong>Driver: </strong>WS2815 (RGB)</p><p><strong>Decoder:</strong> ATHOM (ESP8266)</p><p><strong>Software: </strong>WLED</p>",

        {
            "id": "5632",
            "title": "Pixel Mini Pyramid",
            "category": "Art",
            "tags": [
                "PIXELS",
                "FDM",
                "AMBIENT"
            ],
            "image": "media/Art/Pixel Mini Pyramid/20230726_201532.webp",
            "description": "<p>A compact, USB-C powered 8x8 LED matrix desk piece featuring a scannable 3D printed QR code base.</p>",
            "longDescription": "<p>The Pixel Mini Pyramid is a compact 8x8 LED matrix display tailored specifically for desktop environments. The primary goal was to scale down a previous 16x16 design into a highly portable footprint powered entirely by a standard 5V USB-C connection. It differentiates itself by integrating a giant physical QR code directly into the base structure, transforming a standard lighting piece into an interactive promotional tool that links users directly to my web portfolio.</p><p>The development process required a hybrid modeling approach to balance mechanical and aesthetic requirements. SolidWorks provided the mechanical precision necessary for securely housing the internal electronics, while Blender handled the external geometric elements. During fabrication, the physical assembly was streamlined by utilizing a Bambu Lab X1C to extrude three distinct materials in a single print job. This manufacturing workflow allowed the intricate QR code base and the structural enclosure to be produced cohesively, ensuring tight tolerances for the internal hardware without complex post processing.</p><p>At the core of the project is an ESP32 microcontroller running WLED firmware, providing robust control over the complex light patterns across the addressable 8x8 pixel grid. Integrating 5V USB-C power delivery was a crucial technical requirement, eliminating the need for bulky external power adapters and making the unit self contained. The standout fabrication achievement remains the seamless three material 3D printing process, which successfully merged the interactive promotional requirements with strict mechanical constraints in one automated step.</p>",

        {
            "id": "8000",

            "title": "Pixel Plane Warp",
            "category": "Art",
            "image": "media/Art/Pixel Plane Warp/20230719_221111.webp",
            "description": "<p>A 3D printed LED sculpture that warps a simple two-dimensional plane into a striking floating light display.</p>",
            "longDescription": "<p>Pixel Plane Warp is an internally subdivided, 3D printed LED pixel sculpture designed for display on flat surfaces like tables or pedestals. The core objective is to demonstrate how profound visual effects can emerge from strict design simplicity. Unlike traditional volumetric lighting displays, this piece takes a standard flat plane and distorts it with a single, sweeping wave that terminates in dramatic, opposing points. This geometry, combined with opaque black structural walls, creates the illusion of a floating surface specifically tailored for rendering abstract light patterns.</p><p>The physical fabrication workflow required careful orchestration between mechanical design and organic modeling. The initial geometry and structural framework were engineered in SolidWorks to ensure precise dimensional accuracy and proper mating of the internal subdivisions. The surface was then manipulated in Blender to achieve the sweeping wave and the sharp corner points. The final unified model was fabricated using a Bambu Lab X1C, which provided the tight tolerances necessary to create the opaque black walls that isolate the individual light channels and preserve the crispness of the floating display effect.</p><p>At the core of the piece is an ATHOM ESP8266 based decoder running WLED, which drives the pixel mapping and pattern generation. The primary engineering constraint for this sculpture was thermal management. Heat generation from the LEDs poses a significant risk of warping the internal 3D printed structure. Because the highest point of the warped plane sits at a considerable distance from the light source, balancing light transmission with thermal output required careful calibration. As a result, the sculpture is intentionally optimized for lower light environments, ensuring vibrant visuals while protecting the structural integrity of the print.</p>",

            "image": "media/Fabrication/Field Solder Station/20250317_180657.webp",
            "description": "<p>A portable, field soldering station designed to streamline complex live entertainment installations.</p>",
            "longDescription": "<p>The field solder station is a highly compact, tool carrier engineered to solve the logistical challenges of on site LED installations. Working in unconventional locations like high ladders or cramped spaces under a stage requires immediate access to tools without the burden of a bulky bench setup. This solution differentiates itself by consolidating an entire soldering toolkit into a single portable chassis driven by a standard USB PD battery bank.</p><p>This tool emerged from an iterative prototyping process tested directly in the field during a major San Francisco nightclub installation. Initial concepts explored integrated batteries and complex wiring before the design converged on a simplified approach to maximize reliability and reduce weight. The final iteration logically organizes a TS100 or TS101 iron, solder spool, a bottle of flux, desoldering pump, wick, wet and wire sponges, and rubber feet into an optimized spatial layout.</p><p>I designed the chassis in SolidWorks to tightly pack the required tools into a minimal footprint. Fabricated from PLA using Bambu Lab 3D printers, the structure leverages precision tolerances to secure mechanical hardware like the dual helping hands through a robust friction fit. This precise 3D modeling eliminated the need for secondary mechanical fasteners, resulting in a streamlined and self contained system that reliably supports mobile fabrication work.</p>",

            "description": "<p>A high-impact LED ceiling installation engineered for ultra-low headroom environments using custom-modified dancefloor PCBs.</p>",
            "longDescription": "<p>The objective was to create an immersive LED pixel lighting design for the basement level of Temple nightclub in San Francisco despite severe headroom limitations. This project diverges from standard fixture installations by utilizing custom-modified LED dancefloor PCBs repurposed for ceiling mounting. By stripping the technology down to its bare circuit boards, the design achieves a massive visual impact within a fraction of the traditional spatial footprint.</p><p><br></p><p>The workflow began by sourcing an LED dancefloor manufacturer and collaborating directly with them to engineer custom boards. The physical design required specific functional alterations, including adjusted pixel spacing, enlarged mounting holes, 90-degree wire headers, and a specialized protective backing material. For the physical integration, an aluminum T-track system was mounted directly to the ceiling infrastructure, allowing the custom PCBs to bolt securely into the track for a seamless fit.</p><p><br></p><p>The primary engineering achievement was compressing a high-density lighting matrix into a total vertical profile of under one inch. The system operates on a 24-volt power architecture and utilizes WS2818 addressable pixels. The selection of WS2818 components ensures robust performance through redundant data transmission, preventing single-pixel failures from interrupting the visual array during demanding live operations.</p>",

            "image": "media/Lighting/LVL - Denver/IMG_20191009_231844.webp",
            "description": "<p>An electrical and data overhaul of an immersive pixel lighting rig to ensure stability and enable 3D voxel mapping.</p>",
            "longDescription": "<p>The LVL room at Temple Denver features an immersive, exclusively pixel-based lighting installation with continuous lines running across the floor, ceiling, and pillars. The core goal of this project was to execute a comprehensive structural rewiring of the power and data distribution to transform an unstable installation into a robust, production-ready system. Unlike standard rig assemblies, this overhaul required retrofitting an existing design, demanding precise power management and signal integrity to support advanced, whole-room spatial mapping without compromising the original aesthetic.</p><p>The project workflow centered on meticulous hardware restoration and systemic reconfiguration. Every segment of the existing LED tape was systematically removed, rigorously tested, resoldered, heat-shrinked, and reinstalled to guarantee structural and electrical integrity. To handle the data load, the LED decoder lines were strategically decentralized across the network. Concurrently, the entire power infrastructure was redesigned, efficiently routing power from supplies located in the back room and beneath the DJ booth to ensure consistent performance across the venue's footprint.</p><p>The primary technical constraint of the installation was the extreme length of the pixel runs, which inherently caused severe voltage drop and data signal degradation. This was overcome by running DC wire in parallel with the LED strips to introduce strategic power injection points, guaranteeing uniform brightness and absolute data stability. With the hardware stabilized, the entire room was 3D voxel mapped, allowing the control system to execute volumetric, full-room effects like spatial line sweeps. By isolating specific structural elements into distinct groups, the system can also effectively simulate the behavior of traditional lighting fixtures within a continuous pixel environment.</p>",

            "image": "media/Lighting/MIrus Art Gallery - Denver/IMG_20180614_235653.webp",
            "description": "<p>A dynamic RGBW LED lighting installation integrated into custom wooden ceiling louvers for a modern art gallery.</p>",
            "longDescription": "<p>This project involved the execution and build of a dynamic ceiling lighting installation at the MIRUS Art Gallery in Denver. The primary goal was to provide a versatile lighting environment capable of delivering vibrant psychedelic visuals for modern events while maintaining the ability to produce a clean, solid white wash for displaying traditional paintings. The installation stands out by seamlessly integrating technology into the architecture, utilizing custom fabricated wooden louvers with routed edges to conceal the lighting hardware while maximizing the wash effect across the room.</p><p>Working from a finalized design and parts specification, the build process required precise physical assembly and electrical routing. The workflow began with mounting the RGBW wash LED strips directly into the routed channels of the wooden ceiling louvers. From there, the low voltage wiring was routed through the ceiling infrastructure to connect with the necessary high current power supply units and DMX decoders. This required careful cable management and power distribution planning to ensure reliable operation and clean aesthetics within the gallery space.</p><p>The technical backbone of this installation relies on a streamlined DMX control architecture driven by Madrix Basic software. Because the system utilizes wash strips rather than individually addressable pixels, the entire room's channel count efficiently fits within a single DMX universe. This efficient use of control data, combined with robust high current power supplies and DMX decoders, ensures stable and responsive lighting transitions whether the gallery requires immersive color chases or pristine white illumination.</p>",

            "image": "media/Lighting/Reelworks - Denver/20230621_172727.webp",
            "description": "<p>Custom ultra-bright LED illumination architecture designed for 100-foot inflatable centerpieces at Denver Pride 2023.</p>",
            "longDescription": "<p>This project delivered the centerpiece lighting architecture for Reelworks and Tracks during Denver Pride 2023, designed specifically to illuminate massive 100-foot inflatable tubes. The primary objective was to achieve an exceptionally high brightness level capable of standing out in a highly saturated live event environment. To exceed standard luminous constraints, the project bypassed off-the-shelf solutions in favor of custom-manufactured pixel strands. These bespoke strands featured double-sided LEDs housed behind clear lenses, maximizing light transmission and ensuring high-fidelity color rendering from every viewing angle.</p><p>Executing the design required a precise electrical and mechanical workflow to manage extreme cable lengths and power demands. Two of the custom 100-foot LED strands were run in parallel inside each inflatable structure to compound the overall brightness. Overcoming the inevitable voltage drop across a 100-foot span required an isolated power distribution strategy. Power supplies were strategically mounted at both ends of the tubes, and the positive voltage lines were physically severed at the midpoint. This safely prevented power back-feeding between the discrete power supply units while allowing data to travel seamlessly across the entire fixture.</p><p>The technical foundation of the installation was built on a 24V LED system equipped with redundant data lines, mitigating the risk of pixel failure during the live show. Visual programming and real-time system control were driven entirely through Resolume Arena for large-scale pixel mapping. A significant engineering constraint emerged regarding signal transmission: while wireless decoders performed flawlessly during closed testing, the deployment revealed severe RF interference caused by the dense concentration of attendee cell phones. This provided a critical validation for utilizing hardwired data infrastructure to maintain system stability in electromagnetically noisy, large-scale event spaces.</p>",

            "title": "GeoLens Pro",
            "category": "Apps",
            "tags": [

            "image": "media/Apps/GeoLens/Screenshot_20260118_082950_Chrome.webp",
            "description": "<p><strong>GeoLens Pro</strong>&nbsp;is a mobile-first Progressive Web Application (PWA) designed for field professionals who need to capture, organize, and annotate geo-tagged photos. The app solves the common problem of managing large volumes of field photos by automatically sorting them based on GPS location into predefined job zones.</p>",
            "longDescription": "<h1>GeoLens Pro - Portfolio Breakdown</h1><h2>Overview</h2><p>GeoLens Pro&nbsp;is a mobile-first Progressive Web Application (PWA) designed for field professionals who need to capture, organize, and annotate geo-tagged photos. The app solves the common problem of managing large volumes of field photos by automatically sorting them based on GPS location into predefined job zones.</p><p><br></p><h2>The Problem It Solves</h2><p>Field workers (surveyors, inspectors, contractors, real estate professionals) often capture hundreds of photos across multiple job sites. Manually organizing these photos is:</p><ul><li>Time-consuming&nbsp;- Hours spent sorting and renaming files</li><li>Error-prone&nbsp;- Photos easily get assigned to wrong projects</li><li>Disconnected&nbsp;- No link between photos, locations, and client data</li></ul><p><br></p><h2>The Solution</h2><p>GeoLens Pro uses&nbsp;GPS geofencing&nbsp;to automatically sort photos into jobs the moment they're captured. If you're standing at a job site and take a photo, the app knows exactly which job it belongs to - no manual sorting required.</p><p><br></p><h2>Core Features</h2><h3>1. GPS-Powered Auto-Sort Engine</h3><p>The heart of the application. When a photo is captured or imported:</p><ol><li>GPS coordinates are extracted (live from device or from EXIF metadata)</li><li>The&nbsp;Haversine formula&nbsp;calculates the distance to each active job's origin</li><li>If the photo falls within a job's geofence radius, it's automatically assigned</li><li>If multiple jobs overlap, the closest one wins</li><li>Photos outside all zones go to \"Unassigned\" for manual sorting</li></ol><pre class=\"ql-syntax\" spellcheck=\"false\">// Haversine formula implementation for GPS distance\nconst R = 6371000; // Earth's radius in meters\nconst distance = R * c; // Distance between photo and job origin\nif (distance &lt;= job.radius) → Assign to job\n</pre><h3><br></h3><h3>2. Job Management with Geofencing</h3><ul><li>Define job locations using an interactive&nbsp;Leaflet map</li><li>Set custom geofence radii (feet, meters, miles, or kilometers)</li><li>Visual radius preview on the map</li><li>Jobs can be Active or Archived</li><li>Smart sorting options: Recent Activity, A-Z, Newest, Oldest</li></ul><p><br></p><h3>3. Client CRM</h3><ul><li>Full contact management (company, contact person, email, phone, address)</li><li>Link clients to jobs for organized project tracking</li><li>Alphabetically sorted client list</li><li>Swipe-to-delete with confirmation</li></ul><p><br></p><h3>4. Camera Integration</h3><ul><li>Live camera mode&nbsp;with real-time GPS indicator</li><li>Front/rear camera toggle</li><li>Flash control</li><li>Photo import&nbsp;with EXIF metadata extraction</li><li>High-resolution capture (up to 4032x3024)</li></ul><p><br></p><h3>5. Advanced Photo Editor</h3><ul><li>Multi-layer transparency system&nbsp;- Create annotation layers like slides</li><li>Drawing tools&nbsp;- Brush and eraser with customizable colors and sizes</li><li>Image transforms&nbsp;- Rotate (90 degree increments), flip horizontal/vertical</li><li>Cropping&nbsp;- With coordinate system that maintains drawing positions</li><li>Per-layer transforms&nbsp;- Each layer can have its own crop/rotation</li><li>Undo/redo history</li><li>Layer management (add, delete, rename, reorder)</li></ul><p><br></p><h3>6. Slideshow Viewer</h3><ul><li>Fullscreen presentation mode</li><li>Swipe/tap navigation through all layers</li><li>Title and caption display</li><li>Navigation indicators</li></ul><p><br></p><h3>7. PDF Export</h3><ul><li>Professional document generation with&nbsp;jsPDF</li><li>Header with job title, client info, and location</li><li>2x2 grid layout of all layers (Original + annotations)</li><li>Captions preserved under each image</li><li>Perfect for reports, documentation, or printing</li></ul>",
            "video": "",

            "description": "<p>An interactive generative artwork studio that uses controlled text hallucinations to kickstart creative visual exploration.</p>",
            "longDescription": "<p><strong>PixelForge </strong>is an interactive web application designed to kickstart creative exploration by bridging abstract text generation with high-fidelity image synthesis. Unlike conventional generation interfaces that rely strictly on literal user inputs, PixelForge utilizes controlled AI hallucinations to construct poetic, open-ended prompt foundations. This approach pushes image models past predictable outputs and gives creators a sandbox to discover nuanced visual concepts through either category-focused or open-ended random generation.</p><p>The system workflow coordinates a multi-stage creative pipeline. Activating the randomizer triggers targeted prompt frameworks that generate abstract, poem-like descriptions. Users maintain full creative control with the ability to inspect, refine, or manually edit these text outputs prior to rendering the final image. As generations occur, the platform automatically maintains a comprehensive session history on the left sidebar. This allows users to compare iterative variations, review parameter metadata, and package assets into bulk ZIP downloads directly within the workspace.</p><p>Built on React, TypeScript, Vite, and Tailwind CSS, the application integrates the Gemini API for prompt generation and the Imagen API for visual rendering. A primary technical hurdle involved overcoming model output convergence, where similar prompts yielded overly repetitive visual styles. To solve this, the application features a manual model selector within the settings menu. This allows users to route identical prompts across different model versions to leverage their distinct stylistic interpretations. Local data persistence relies on IndexedDB and LocalStorage to manage client-side image storage and history tracking without external database dependencies.</p>",

            "id": "7085",
            "title": "Chronicle: Iterative Fiction Engine",
            "category": "Apps",

            "image": "media/Apps/Chronicle AI/Screenshot 2026-01-18 190524.webp",
            "description": "<p><strong>Chronicle </strong>is a zero-build, browser-based interactive fiction engine that generates multimodal, AI-driven storytelling in real time.</p>",
            "longDescription": "<p><strong>Chronicle </strong>is a browser-based interactive fiction engine designed to dynamically generate text, images, and audio for a cohesive choose-your-own-adventure experience. It shifts away from standard conversational AI interfaces by enforcing a rigid narrative structure through strict schema validation. This approach ensures every generated turn consistently delivers prose, four distinct choices, scene illustration prompts, and backend lore updates, creating a predictable game loop without relying on a traditional server.</p><p>The application operates entirely client-side using a zero-build React architecture with ES modules and Tailwind CSS. During a session, a user selects a genre and visual style, initiating a turn loop that builds a layered system prompt based on player decisions. The system manages state by maintaining a persistent memory stack, compressing older narrative beats into long-term summaries while preserving recent verbatim prose and relevant character lore. When a player makes a choice, the engine merges the updated codex, appends the new beat, and processes parallel requests for image and audio generation to construct a complete multimodal page.</p><p>The standout technical achievement is the memory engine and structured data parsing powered by the Google Gemini API. By utilizing a strict JSON response schema, the application guarantees that the large language model outputs precisely formatted game data for immediate UI rendering and state management. The engine also tackles the challenge of long-context drift in AI storytelling by filtering and injecting only the most relevant codex entries per turn. Additionally, the system supports real-time text streaming by parsing partial JSON outputs and includes resilient fallback integrations for both text-to-speech and image generation.</p>",

            "description": "<p>A serverless, browser-based note-taking application combining block-level editing with infinite canvas workspaces and Google Drive synchronization.</p>",
            "longDescription": "<p><strong>Strata </strong>is a client-side note-taking application designed to provide hierarchical organization alongside flexible visual workspaces. The primary goal is to deliver a robust productivity tool that runs entirely in the browser without relying on a dedicated backend server. The project differentiates itself by seamlessly blending structured, block-based text editing with an infinite drawing canvas, utilizing the user's existing Google Drive as the primary cloud storage and database mechanism.</p><p>The engineering workflow focuses on delivering a resilient user experience that bridges offline availability and cloud connectivity. The application caches data locally using localStorage for immediate access and pushes updates to Google Drive via automatic debounced saves. The project is currently an active work in progress, with current development focused on resolving known sync issues and refining conflict resolution logic. The development journey included prototyping a standalone desktop variant to enable direct webpage embedding, but active development has pivoted back to the web application to maximize accessibility and maintain a streamlined user workflow.</p><p>The core application is built with React and styled with Tailwind CSS, maintaining a strict zero-dependency architecture outside of the necessary Google APIs. A major technical component of the build is the in-browser Babel transpilation, which allows the application to function entirely on the client side. The infinite canvas relies on custom coordinate system handling with viewport culling and real-time SVG path rendering to ensure smooth panning, zooming, and drawing performance. By directly integrating with the Google Drive API, the system can bypass traditional server storage limitations while natively embedding Google Docs, Sheets, and Slides directly into the workspace.</p>",

            "id": "6962",
            "title": "IdeaForge.AI",
            "category": "Apps",
            "tags": [
                "AI-powered",
                "idea management",
                "brainstorming",
                "project planning"
            ],
            "image": "media/Apps/Brainstormer/Screenshot 2026-02-14 232928.webp",
            "description": "<p>IdeaForge.AI is a comprehensive ideation pipeline that transforms raw thoughts into actionable project strategies utilizing a serverless Google Drive backend.</p>",
            "longDescription": "<p>IdeaForge.AI is a multi-stage idea sifter designed to capture, expand, and execute concepts without initial critique. The core goal is to provide a frictionless environment where users can verbally or textually dump ideas and seamlessly transition them into fully realized projects. This application differentiates itself by completely eliminating traditional cloud database dependencies, opting instead to use the user's personal Google Drive and Google Sheets as the sole backend architecture.</p><p>The workflow begins with an uninhibited idea dump, where users log their thoughts to be automatically tagged and summarized. When an idea shows promise, it is promoted to the brainstorm phase where an AI assistant conducts an interview to extract deeper details and compiles a structured breakdown. Promoting the brainstorm to a project generates an execution strategy, an expense tracker, and a task list. Finally, the campaign section conducts a comprehensive interview to compile a playbook, breaking down discovery, monetization, distribution, and logistics into actionable phases.</p><p>The application frontend is built with React, TypeScript, and Tailwind CSS, utilizing Vite for optimized builds. The standout technical achievement is the custom data layer that interfaces directly with the Google Sheets API and Google Drive API, transforming a standard spreadsheet into a fully functional database. A local database implementation handles offline state and data reconciliation, while a user-provided Gemini API key securely powers the core intelligence for summarizing concepts and generating execution playbooks.</p>",

            "image": "media/Apps/CharGen.AI/Screenshot 2026-07-25 174417.webp",
            "description": "<p>CharGen.AI is a comprehensive, client-side character development engine utilizing Google AI for text and image generation.</p>",
            "longDescription": "<p><strong>CharGen.AI</strong> is a universal character development engine designed to build highly detailed profiles for any archetype, ranging from humans to complex sci-fi and fantasy subjects. The primary goal is to provide a unified workspace for character creation that seamlessly bridges the gap between statistical attributes and visual representation. Unlike standard text-based character generators, this platform features a unique bidirectional workflow. Users can define over 100 conditional attributes to synthesize distinct reference images, or they can reverse the process by using vision models to extract structured physical and psychological data directly from an uploaded piece of reference art.</p><p>The application operates entirely on the client side to prioritize user privacy and eliminate traditional backend infrastructure. Users navigate through an eight-section attribute builder that dynamically adapts its input fields based on the selected species type. As users modify attributes, generate custom outfits, or draft backstories, all data is saved persistently in the browser using IndexedDB. When a user initiates a generation request, the application bundles the current character state and interfaces directly with Google API endpoints. The state management system coordinates these external responses, updating the local character library in real time and allowing users to organize, bulk export, or iterate on their designs without a central server.</p><p>The platform is engineered using React 18 and Vite, relying on Zustand for efficient state management across the complex, deeply nested attribute trees. The standout technical achievement is the synchronized integration of Google Gemini 2.5 Flash for nuanced text generation and image analysis, alongside Imagen 4.0 for high-fidelity visual synthesis. By committing to a strictly serverless architecture, the system requires users to supply their own API keys, guaranteeing zero telemetry and eliminating hosting costs for heavy AI workloads. This constraint necessitated the heavy optimization of IndexedDB to reliably store and manage large payloads of image data and complex JSON character objects locally within the browser.</p>",

            "description": "<p>A vanilla JavaScript color calibration tool utilizing area-averaged pixel sampling for precise multi-material lithophane generation.</p>",
            "longDescription": "<p><strong>LithoPalletGen</strong> is a specialized color calibration application designed to streamline multi-material lithophane workflows by accurately mapping printed filament swatches. Unlike standard single-pixel color pickers, this tool utilizes a configurable area-averaging eyedropper that samples regions ranging from 32 to 256 pixels. This distinct approach neutralizes surface noise, lighting variances, and filament translucency, ensuring statistically accurate color profiles that reflect the physical characteristics of the printed material.</p><p>The tool operates through a split-pane interface that directly pairs a canvas-based image viewer with a hierarchical palette builder. Users upload photographs of physical prints and systematically construct multi-layer color profiles, categorizing base colors alongside ordered layers of increasing material thickness. As users sample the image, a live-updating bounding box overlays the canvas, aggregating color data across hundreds of pixels to actively filter out the textural inconsistencies inherent in FDM prints.</p><p>Engineered as a zero-dependency vanilla JavaScript application with no build step, the system operates entirely client-side, utilizing IndexedDB for persistent image storage and localStorage for palette serialization. The core technical achievement is the real-time pixel averaging engine, which rapidly executes per-frame <code>getImageData</code> computations across large pixel arrays while maintaining fluid cursor responsiveness. A unified color model anchors the architecture, driving a dual-format export system that outputs PIXEstl-compatible JSON in either HSL or hex notation for immediate downstream processing.</p>",

            "description": "<p>A compact, 3D printed bench power supply designed for testing LED lighting installations in the field.</p>",
            "longDescription": "<p>The Field Bench PSU is a portable tool designed to power and test diverse LED products during on-site installations. While standard bench power supplies are bulky and tied to AC mains, this custom unit leverages modular components and a highly versatile interface architecture to provide reliable testing capabilities directly on the job site.</p><p>The physical enclosure was modeled in SolidWorks and fabricated using PLA+ for structural durability. The internal hardware workflow routes power from a 5521-DC input jack through a mini rocker switch into the voltage conversion module. The output side maximizes field flexibility by providing a 5525-DC jack alongside a pair of banana plug jacks equipped with wire screw terminals. This layout allows the hardware to interface with a wide array of standard connectors, or rely on bare wire connections paired with WAGO terminals for rapid setup.</p><p>The primary technical driver is an embedded buck-boost converter capable of handling a 5 to 32VDC input and delivering an equivalent voltage output at up to 5A. A standout operational achievement is the integration of standard USB PD sources, allowing the system to accept a 19V 100W input and reliably convert it to precise 5V, 12V, or 24V outputs. This capability ensures immediate, adaptable power delivery for any low voltage LED architecture encountered in the field.</p>",

            "image": "media/Lighting/Club Lexi/20230508_171150.webp",
            "description": "<p>A low-profile, multi-zone lighting installation designed for simplified DJ operation using a standalone hardware controller.</p>",
            "longDescription": "<p>The Club Lexi project required designing a dual-room lighting rig that merged modern fixture capabilities with a classic discotheque aesthetic. The core goal was to deliver a cohesive, high-energy dance floor experience across two adjacent spaces restricted by low ceilings. This installation differentiates itself through its spatial economy; by utilizing a high-density spine of RGBW moving lights alongside hybrid profile fixtures, the design maximizes limited headroom while generating an immersive visual environment.</p><p>The installation process prioritized both structural efficiency and operational flexibility. To navigate the strict vertical constraints, the entire rig was hung using strut channel mounted flush to the ceiling, bypassing the bulk of standard lighting truss. Custom electrical infrastructure was integrated directly into the layout, placing all fixture power on dedicated switches for safe and immediate equipment management. For the operational workflow, the physical layout was divided into distinct software zones, allowing the venue to scale the lighting footprint and keep half the system powered down during the early hours of operation.</p><p>The primary technical driver of this project is the integration of a Wolfmix WMX1 standalone controller. Because the venue operates without a dedicated lighting director, the control architecture needed to allow DJs to easily manage complex visual states in real-time. The optical package leverages hybrid beam effect fixtures and profile units fitted with custom gobos to properly texture the low-ceiling space. By routing the hardware array through the WMX1, the system overcomes the operational constraint of lacking a technician, successfully balancing sophisticated automated programming with accessible, tactile user control.</p>",

            "image": "media/Lighting/The Orb - Temple _ Denver/ORB2.webp",
            "description": "<p>An 8 foot diameter kinetic LED sphere featuring complex voxel mapping and remote high current DC power distribution.</p>",
            "longDescription": "<p>The Orb is an 8 foot diameter kinetic lighting centerpiece designed for Temple nightclub in Denver. The primary objective was to deliver a massive, three dimensional visual experience that physically interacts with the crowd by moving dynamically on a motorized hoist during headliner performances. It stands apart from standard LED installations by intentionally maximizing negative space within the aluminum frame to create a true volumetric 3D effect rather than a solid luminous surface.</p><p>Inheriting the project in an unfinished state required an immediate evaluation of the system architecture to ensure structural safety and electrical reliability. The physical build involved securing hundreds of individual LED pixel modules to the frame while carefully managing weight and visual sightlines. To preserve the open aesthetic, only the data decoders were housed inside the sphere. The bulky power supply units were relocated above the ceiling, requiring thick gauge copper wiring to transport the power safely down the hoist lines and into the moving structure.</p><p>The core technical achievement of this build was engineering safe and reliable high current DC power distribution over a significant distance. Mitigating the voltage drop from the remote ceiling power supplies to the suspended orb required precise load calculations and rigorous power protection methods. On the control side, the physical layout of the LEDs was translated into an exact 3D voxel map using Madrix software to enable complex volumetric lighting programming.</p>",

            "title": "Basement - Triangle | Denver",
            "category": "Lighting",
            "image": "media/Lighting/The Triangle/IMG_20180614_174327.webp",
            "description": "<p>A mixed-rig nightclub lighting installation featuring video integration, moving profiles, and a custom indirect pixel ceiling.</p>",
            "longDescription": "<p>The basement installation at Triangle in Denver is a comprehensive entertainment environment utilizing a mixed rig of pixels, conventional lighting, and video elements. The primary goal was to create an immersive visual experience across the DJ booth, dancefloor, and bar areas. What sets this design apart is the custom bounce-effect ceiling array. Instead of directing light straight down at the audience, each ceiling slat houses twenty pixel modules pointing upwards. The spaced slats allow the reflected light to bleed through, producing a highly unique and perfectly smooth color gradient effect overhead.</p><p>Executing this design required orchestrating multiple distinct zones into a unified visual system. The physical workflow integrated a front screen and rear backdrop for the DJ booth, moving profile fixtures for the dancefloor, and high impact under-lighting for the bar rails. A major spatial constraint was the acoustic noise generated by the large number of power supplies required for the overhead pixels. To solve this, the installation process involved routing all power and data from an isolated adjacent room, keeping the main club environment entirely free of hardware clutter and fan noise.</p><p>The technical success of this project relies heavily on the implementation of long-range pixel decoders. Transmitting high-speed data and stable power over extended distances introduces significant signal integrity challenges. By leveraging specialized long-range decoding hardware, the system effectively bridges the physical gap between the remote power racks and the ceiling array. This solution overcomes the structural limitations of the venue, ensuring flawless pixel mapping and synchronization across the ceiling without compromising the acoustic or visual aesthetic.</p>",

            "description": "<p>Restoration of a custom, high-channel-count LED installation integrating recycled fluorescent tubes into a modernized venue network.</p>",
            "longDescription": "<p>This project involved the structural restoration and system integration of a legacy lighting centerpiece suspended above the main bar at Que Bueno Suerte!. The primary goal was to salvage an inherited visual asset constructed from recycled four-foot and eight-foot fluorescent tubes and bring it online with a newly installed venue-wide control system. The key differentiator was the strict constraint of working within a pre-existing physical framework, which required reverse-engineering and modernizing a failing, custom-built design rather than executing a standard blank-slate installation.</p><p>The physical workflow required systematically uninstalling dead fixtures, separating the three-tube clusters, and extracting the degraded LED tape from the core of each bundle. Concurrently, the electrical infrastructure underwent a complete overhaul to replace obsolete decoders housed in custom overhead power boxes. This hardware intervention established the necessary communication link, bridging the repaired legacy physical structures with the modern, centralized data network governing the rest of the venue's lighting.</p><p>The upgraded fixtures utilize 5V WS2813 LED strips, selected specifically for their backup data line to provide signal redundancy and prevent future cascade failures within hard-to-access overhead locations. Because the physical design dictated maintaining the original 60-pixel-per-meter density, the resulting display requires an astronomical channel count to operate. Managing this immense data footprint required integrating upgraded decoders capable of processing high-density pixel output while staying continuously synchronized with the venue's overarching control system.</p>",

            "title": "Pixel Negative \"X\"",

            "image": "media/Art/Pixel Negative _X_/20230717_155724.webp",
            "description": "<p>A minimalist LED art installation that transforms from a blank canvas into a textured light display.</p>",
            "longDescription": "<p>Pixel Negative \"X\" is a custom illuminated art piece designed to serve as a minimalist white square when powered off and a complex visual display when activated. The defining feature of this project is the internal geometry of the LED cells. Instead of a standard diffused grid, each pixel is optically isolated and features a physical \"X\" obstruction through its center. This configuration casts a uniform array of negative space across the diffusion layer to create a uniquely textured pattern when displaying multicolor light arrays.</p><p>The development process required precise mechanical design to ensure proper light isolation between adjacent pixels. The structural framework and light baffles were modeled in SolidWorks to exact tolerances before being fabricated. Assembly involved integrating the custom physical grid with the outer material to ensure the hidden internal structure remained completely invisible until the light source was activated.</p><p>Fabrication was executed using a Bambu Lab X1C 3D printer for high dimensional accuracy. The lighting system is driven by an ATHOM ESP8266 microcontroller running WLED software. To ensure ongoing reliability and physical stability, the system utilizes software based current limiting. This precise power management prevents thermal buildup, effectively protecting the printed internal components from heat deformation and warping during extended use.</p>",

            "image": "media/Art/Pixel Seed of Life/20230717_155617.webp",
            "description": "<p>A dual-material LED art installation that conceals a vibrant, geometric pattern behind a minimalist white facade.</p>",
            "longDescription": "<p>Pixel Seed of Life is a dual-material LED pixel art installation designed to reveal a hidden geometric pattern only when illuminated. The core objective is to contrast a minimalist exterior with a vibrant, dynamic interior display, visually representing the concept of open-mindedness. Unlike standard exposed LED matrices, this piece relies on a specialized physical design that appears as a blank white canvas when unpowered, successfully concealing the intricate cellular structure underneath.</p><p>The physical enclosure and internal components were designed entirely in SolidWorks, focusing on precise geometric boundaries. To achieve a seamless and flat exterior face, the main display surface is printed face down on the build plate. The internal architecture features specific cellular subdivisions that physically isolate each light source. This structural light-blocking approach prevents color bleeding between the pixels, ensuring sharp contrast for the underlying geometric pattern when the LEDs activate.</p><p>Fabrication was executed on a Bambu Lab X1C 3D printer to manage the precise dual-material extrusion required for both the light-blocking and light-diffusing layers. The lighting system itself is driven by an ATHOM ESP8266 controller running WLED firmware, which provides complex and customizable lighting patterns. To ensure long-term stability and safety within the printed enclosure, the system utilizes strict current-limiting parameters that actively prevent heat buildup and protect the internal hardware.</p>",

            "image": "media/Art/Pixel Celtic Owl/20220315_175342.webp",
            "description": "<p>A 3D printed LED sculpture utilizing novel internal subdivisions and a flat panel stamping technique.</p>",
            "longDescription": "<p>Pixel Celtic Owl is a 3D printed, internally subdivided LED sculpture designed to map addressable lighting to intricate, non-linear forms. The project advances previous grid-based lighting designs by introducing a novel process for applying internal light isolation to highly complex shapes. This approach enables precise light control within a detailed geometric model, bypassing the physical limitations of standard rectangular LED matrices.</p><p>Constructing the piece required solving the spatial challenges of embedding an irregular object within a controlled lighting environment. The fabrication workflow involved developing a custom modeling technique to generate an intricate internal grid that contours precisely to the 3D model. To manage the overall footprint, the process also incorporated a custom boolean method to stamp the complex geometry into a flat backing panel. This step effectively filled the negative space around the sculpture and provided a secure housing for the electronics.</p><p>The physical enclosure is fabricated from PLA+ using a Bambu Lab X1C 3D printer to achieve precise dimensional accuracy and clean light boundaries between the internal cells. The lighting system is driven by an ATHOM ESP8266 controller running WLED firmware. This hardware combination provides robust, addressable control for the internal pixel layout, merging precise physical manufacturing with reliable open-source lighting software.</p>",

            "title": "Lobby Wall - Tracks | Denver",
            "category": "Lighting",
            "image": "media/Lighting/Lobby Wall - Tracks _ Denver/0321151647.webp",
            "description": "<p>A modular, double-sided LED pixel wall engineered for rapid nightclub deployment and controlled via Madrix software.</p>",
            "longDescription": "<p>This project involved designing and deploying a double-sided LED pixel wall for a major facility remodel at Tracks nightclub in Denver. To overcome a highly compressed installation window, the system was engineered as a fully modular framework rather than a traditional in-place build. This approach allowed for comprehensive off-site assembly and testing, minimizing on-site risk and enabling a complete installation over the course of just two days.</p><p>The fabrication process required custom physical formatting to achieve the necessary visual density. Raw LED pucks were manually soldered with custom wire lengths to account for specific pixel spacing requirements. These custom arrays were then contact-cemented onto standardized pegboard panels in eight-pixel configurations. This modular panelized workflow enabled rigorous pre-installation testing of every segment. Once mounted in the venue, the arrays were finished with frosted plexiglass panels secured on standoffs, providing even light diffusion across both sides of the wall.</p><p>The installation's hardware architecture relies on the WS2801 two-wire protocol, driven by a 16-output SanDevices E682 decoder. To streamline the physical wiring and digital mapping, the power and data topology was organized so that each horizontal row of pegboard modules connects to a dedicated output on the controller. The entire double-sided array is mapped and dynamically driven using Madrix 3.6 lighting control software, allowing for complex, real-time pixel manipulation across the network.</p><p><br></p><h2><strong>Specs</strong></h2><p><strong>Fixtures: </strong>LED Pixels</p><p><strong>Pixels: </strong>520</p><p><strong>Driver: </strong>WS2801 (RGB)</p><p><strong>Decoder: </strong>SanDevices E682</p><p><strong>Software:</strong> Madrix 3.6</p>",

            "description": "<p>A custom-integrated, 3D-printed addressable LED lighting system designed to illuminate a central curved bottle shelf.</p>",

        const Lightbox = ({ images, initialIndex, onClose }) => {

            const touchStartX = useRef(null);

            const minSwipeDistance = 50;

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowLeft') prevImage();
                    if (e.key === 'ArrowRight') nextImage();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [index]);

            const nextImage = () => {
                if (index < images.length - 1) setIndex(index + 1);
                else setIndex(0); 
            };

            const prevImage = () => {
                if (index > 0) setIndex(index - 1);
                else setIndex(images.length - 1); 
            };

            const onTouchStart = (e) => { touchEndX.current = null; touchStartX.current = e.targetTouches[0].clientX; };

                if (!touchStartX.current || !touchEndX.current) return;

                        title="Illumination" 
                        subtitle="Lighting Design" 
                        icon={Lightbulb} 
                        category="Lighting" 
                        onOpenProject={handleOpenProject} 
                        bgColor="bg-black"
                    />
                    
                    <SimpleSection 
                        id="art" 
                        title="Sculpture & Form" 
                        subtitle="Art" 
                        icon={Palette} 
                        category="Art" 
                        onOpenProject={handleOpenProject} 
                        bgColor="bg-zinc-950"
                    />
                    <SimpleSection 
                        id="circuits" 
                        title="Hardware Design" 
                        subtitle="Electronics & PCBs" 
                        icon={Cpu} 
                        category="Circuits" 
                        onOpenProject={handleOpenProject} 
                        bgColor="bg-black"
                    />
                    <SimpleSection 
                        id="apps" 
                        title="Interactive Software" 
                        subtitle="Apps & Games" 
                        icon={Smartphone} 
                        category="Apps" 
                        onOpenProject={handleOpenProject} 
                        bgColor="bg-zinc-950"
                    />
                    <SimpleSection 
                        id="solutions" 
                        title="Custom Tooling" 
                        subtitle="Fabrication & Solutions" 
                        icon={Wrench} 
                        category="Solutions" 
                        onOpenProject={handleOpenProject} 
                        bgColor="bg-black"
                    />
                    <SimpleSection 
                        id="integration" 
                        title="The Backbone" 
                        subtitle="Systems Integration" 
                        icon={Layers} 
                        category="Integration" 
                        onOpenProject={handleOpenProject} 
                        bgColor="bg-zinc-950"
                    />
                    
                    <AboutMe />
                    
                    <Contact />
                    
                    {selectedProject && (
                        <ProjectModal 
                            project={selectedProject} 
                            onClose={handleCloseProject} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
