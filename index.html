name":"Pixel Control","qty":"","specs":"Madrix 5.x"}]}]},{"title":"Bar Backsplash","category":"Lighting","image":"media/Lighting/Bar Backsplash/20241009_111435.webp","thumbnail":"media/Lighting/Bar Backsplash/20241009_111435-thumb.webp","thumbnailFit":{"scale":1,"x":57.1,"y":50.7},"bannerFit":{"scale":1,"x":0,"y":59},"description":"<p>A ratchet strap anchored to the patio fence, a deadblow, and four hours of hammering a trapped LED track sideways.</p>","longDescription":"<p>The bar backsplash was a massive acrylic wall extending to a vaulted ceiling. The original LEDs were one color. I needed to relight the acrylic edges and underlight three glass shelves. The wall was never meant to come apart. The shelves were mounted directly through the acrylic, trapping the bottom LED track under the panels. It was also locked down with double-sided tape. The top and side strips came out quickly. The bottom track was an eight-foot problem.</p><p>My only option was pulling it sideways. I drilled a hole through the aluminum track, hooked a ratchet strap to it, ran the strap out the door, and anchored it to a metal patio fence. I slid a piece of strut channel through the strap as a strike plate. I stood next to the bar and hit the strut with a deadblow. The track inched out bit by bit. It took four hours of hammering to clear the wall.</p><p>Assembly went faster. I skipped the adhesive and slid the new track into the gap. For the shelves, I mounted pixel tape into black channels, firing light up through the bottles. Because the shelves were bolted through the wall, I could not hide the cables. I put the wires inside black wrap and pulled them perfectly straight. If wiring sits in direct eyesight, it has to look intentional. The bright acrylic acts as a backdrop for the bartenders, tying the room together.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering","Repair"],"gallery":[{"url":"media/Lighting/Bar Backsplash/20241009_113728.mp4","fit":{"scale":1.1,"x":67.2,"y":61.3},"poster":"media/Lighting/Bar Backsplash/frame-thumb-1786742341805.webp","thumbnail":"media/Lighting/Bar Backsplash/frame-thumb-1786742341805-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20241009_113753.mp4","fit":{"scale":1,"x":52.1,"y":60.6},"poster":"media/Lighting/Bar Backsplash/frame-thumb-1786742368716.webp","thumbnail":"media/Lighting/Bar Backsplash/frame-thumb-1786742368716-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20250128_113203.mp4","fit":{"scale":1,"x":50,"y":80.5},"poster":"media/Lighting/Bar Backsplash/20250128_113203-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/20250128_113203-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20241028_100715.mp4","fit":{"scale":1,"x":57.3,"y":19.8},"poster":"media/Lighting/Bar Backsplash/20241028_100715-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/20241028_100715-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20241028_101223.mp4","fit":{"scale":1,"x":50.4,"y":31.3},"poster":"media/Lighting/Bar Backsplash/20241028_101223-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/20241028_101223-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240619_123134.webp","fit":{"scale":1,"x":50,"y":54.1},"thumbnail":"media/Lighting/Bar Backsplash/20240619_123134-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20241009_111435-2.webp","fit":{"scale":1,"x":50,"y":50},"thumbnail":"media/Lighting/Bar Backsplash/20241009_111435-thumb-2.webp"},{"url":"media/Lighting/Bar Backsplash/20240205_124008.webp","fit":{"scale":1,"x":50,"y":54.4},"thumbnail":"media/Lighting/Bar Backsplash/20240205_124008-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240205_112043.webp","fit":{"scale":1,"x":46.8,"y":51.1},"thumbnail":"media/Lighting/Bar Backsplash/20240205_112043-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240205_123530.webp","fit":{"scale":1,"x":46.3,"y":11.7},"thumbnail":"media/Lighting/Bar Backsplash/20240205_123530-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240201_132628.webp","fit":{"scale":1,"x":48,"y":24.6},"thumbnail":"media/Lighting/Bar Backsplash/20240201_132628-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240201_132511.webp","fit":{"scale":1,"x":50,"y":29},"thumbnail":"media/Lighting/Bar Backsplash/20240201_132511-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240201_132255.webp","fit":{"scale":1,"x":50.2,"y":28.7},"thumbnail":"media/Lighting/Bar Backsplash/20240201_132255-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240201_131026.webp","fit":{"scale":1,"x":0,"y":60.7},"thumbnail":"media/Lighting/Bar Backsplash/20240201_131026-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240201_131015.webp","fit":{"scale":1.15,"x":76.9,"y":100},"thumbnail":"media/Lighting/Bar Backsplash/20240201_131015-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240201_131202.webp","fit":{"scale":1,"x":49.1,"y":31.6},"thumbnail":"media/Lighting/Bar Backsplash/20240201_131202-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240201_132300.webp","fit":{"scale":1,"x":50.2,"y":57.6},"thumbnail":"media/Lighting/Bar Backsplash/20240201_132300-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240201_131004.webp","fit":{"scale":1,"x":50.9,"y":63.3},"thumbnail":"media/Lighting/Bar Backsplash/20240201_131004-thumb.webp"}],"files":[],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x418)</strong><br><em>20.9m • WS2814 • RGBW (3000k) • 12Vdc • 60/m • 20px/m</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supplies (x2)</strong><br><em>MEAN WELL • HLG-320H-12 • 12Vdc • 22A</em></p><p><strong>Pixel Decoder (x1)</strong><br><em>Advatek • R4D-S</em></p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Alabaster Bar Top","url":"#project/9525"},{"name":"Bar Kicker","url":"#project/468"},{"name":"Bar Tubes","url":"#project/4411"}],"video":"","timestamp":"2026-08-14T21:28:07.028Z","id":"7026","order":6,"specsData":[{"id":"48a6bb27-606d-4cac-a29c-5b7a3c2a72e7","title":"PIXELS & DISPLAY","items":[{"id":"1fb1eef9-ab6d-4dca-bae9-8b0ba85c4dff","name":"LED Pixels","qty":"418","specs":"20.9m, WS2814 • RGBW (3000k) • 12Vdc • 60/m • 20px/m"}]},{"id":"b4972bf9-88b7-4728-a6af-9667f5a1b13b","title":"POWER & DISTRIBUTION","items":[{"id":"d21020e8-d5cc-4c51-8918-19122694f631","name":"Power Supplies","qty":"2","specs":"MEAN WELL • HLG-320H-12 • 12Vdc • 22A"},{"id":"9854588c-7821-4ae3-972b-7e7f9e41a627","name":"Pixel Decoder","qty":"1","specs":"Advatek, R4D-S"}]}]},{"title":"Glow Lounge","category":"Lighting","image":"media/Lighting/Glow Lounge/frame-thumb-1786745346701.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786745346701-thumb.webp","thumbnailFit":{"scale":1.2,"x":33.6,"y":0},"bannerFit":{"scale":1,"x":45.4,"y":25.4},"description":"<p>Three UV panels painted by a member who had passed were not coming down. The rig went around them, aimed at a mirrored torso.</p>","longDescription":"<p>The ceiling at Glow Lounge was 8 feet high. Three art panels hung over the dance floor. A community member painted them with UV paint before he passed away, so they stayed put. I scrapped my plan for pixel strips to save money and pulled down the old rig. The fixtures were gross. Dust choked the fans until they stopped spinning, causing the lights to overheat and thermal cycle. I scrubbed the salvageable units and mapped a new layout around the art.</p><p>Every inch mattered. I mounted strut channels flush to the drywall and bolted them into the joists. I tucked short beam fixtures between the panels and pushed the taller lights to the edges. I bundled the cables along the channel and balanced the rig on 2 circuits. I hung new wash lights next to the DJ, but they got stuck while panning. The metal frames bent during transport and rubbed against the housing. I just bent the yokes back by hand.</p><p>A spinning torso covered in mirrors hung over the floor. I built the show on a Wolfmix WMX1 controller. I could narrow the wash fixtures into tight beams and aim them at the torso and the mirror balls. The light shot across the room just above the crowd. If a patron was exceptionally tall, they would likely get hit in the face. The scattered reflection filled the room. It felt compact and balanced.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Lighting Design","DMX","Power Distribution","Power tools","Repair"],"gallery":[{"url":"media/Lighting/Glow Lounge/Video Project 29.mp4","fit":{"scale":1.3,"x":48.3,"y":0.2},"poster":"media/Lighting/Glow Lounge/frame-thumb-1786747929189.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786747929189-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Video Project 30.mp4","fit":{"scale":1.4,"x":40.8,"y":12.4},"poster":"media/Lighting/Glow Lounge/frame-thumb-1786747967418.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786747967418-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20231203_134428.mp4","fit":{"scale":1.3,"x":22.2,"y":30.7},"poster":"media/Lighting/Glow Lounge/frame-thumb-1786745268005.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786745268005-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20230706_145524.mp4","fit":{"scale":2,"x":45.2,"y":28.7},"poster":"media/Lighting/Glow Lounge/frame-thumb-1786745153988.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786745153988-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20230706_140756.mp4","poster":"media/Lighting/Glow Lounge/20230706_140756-poster.webp","thumbnail":"media/Lighting/Glow Lounge/20230706_140756-poster-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20231203_134407.webp","fit":{"scale":1.25,"x":33.6,"y":64.8},"thumbnail":"media/Lighting/Glow Lounge/20231203_134407-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20231203_134419.webp","fit":{"scale":1.3,"x":21.4,"y":81.2},"thumbnail":"media/Lighting/Glow Lounge/20231203_134419-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20230706_145020.webp","fit":{"scale":1,"x":19.8,"y":27.1},"thumbnail":"media/Lighting/Glow Lounge/20230706_145020-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20240209_122228.webp","fit":{"scale":1.35,"x":37.2,"y":24.7},"thumbnail":"media/Lighting/Glow Lounge/20240209_122228-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20230705_122239.webp","fit":{"scale":1.1,"x":77.5,"y":31.7},"thumbnail":"media/Lighting/Glow Lounge/20230705_122239-thumb.webp"}],"files":[],"specs":"<h2>FIXTURES &amp; FX</h2><p><strong>Beam (x8)</strong><br><em>ColorfulLighting • PD60 • LED • beam 4° • 60W • RGBW • infinite pan &amp; tilt</em></p><p><strong>Beye (x4)</strong><br><em>ColorfulLighting • B6 • LED • wash + FX hybrid • 240W • RGBW</em></p><p><strong>Hybrid (x2)</strong><br><em>Chauvet • Intimidator Hybrid</em></p><h2>COMPUTE &amp; CONTROL</h2><p><strong>Lighting Console (x1)</strong><br><em>WOLFMIX WMX1 • 1u unlocked</em></p>","related":[],"video":"","timestamp":"2026-08-14T22:12:34.696Z","id":"3309","order":10,"specsData":[{"id":"27d573e7-38bd-4778-9512-591f50d76a13","title":"FIXTURES & FX","items":[{"id":"28a35fd9-74b9-41cf-8e29-f62051c22fbd","name":"Beam","qty":"8","specs":"ColorfulLighting, PD60, LED, beam 4°, 60W, RGBW, infinite pan & tilt "},{"id":"f1130102-946e-4416-be80-c474cfccd3f9","name":"Beye","qty":"4","specs":"ColorfulLighting, B6, LED, wash + FX hybrid, 240W, RGBW"},{"id":"822959ea-e0bc-4e00-a24d-5de09436b3a8","name":"Hybrid","qty":"2","specs":"Chauvet, Intimidator Hybrid"}]},{"id":"b458cc90-e634-4fc3-b7de-84c0f67b2ce1","title":"COMPUTE & CONTROL","items":[{"id":"35d316c1-7ca4-4d8f-9f1d-28178fe5ca60","name":"Lighting Console","qty":"1","specs":"WOLFMIX WMX1, 1u unlocked"}]}]},{"title":"Mezzanine Bar","category":"Lighting","image":"media/Lighting/Mezzanine Bar/frame-thumb-1786750929356.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786750929356-thumb.webp","thumbnailFit":{"scale":1,"x":48.6,"y":40.8},"bannerFit":{"scale":1,"x":48.6,"y":37.4},"description":"<p>The bottle shelves turned out to be wood blocks with sheet metal on top. Twenty-three extrusions, and gaps I had to fake in the patch.</p>","longDescription":"<p>I didn't realize how the mezzanine bar at Que Bueno Suerte was built until I got there. The bottle shelves were blocks of wood with sheet metal stacked on top. I needed to wash the bottles from the front without exposing the wiring. I pre-cut 23 segments of aluminum extrusion and built the strips on a workbench. I soldered and heat-shrunk 3000K RGBW tape inside 45-degree channels, leaving wire whips on both ends.</p><p>I stuck the tracks to the top of each metal plate with foam tape. I used Dolphin crimps to splice the segments into four rows. To hide the connections, I ran cables between the wood blocks and sleeved the gaps in wire wrap.</p><p>The space under the bar had a different constraint. At night, the staff turned the mezzanine into a dance floor and shoved heavy tables underneath. Knees, coats, and sliding furniture were going to hit the lighting. I loaded more tape into an extrusion and siliconed it directly to the underside of the bar. I mounted it far enough back to survive the room flips.</p><p>Every line ran to an Advatek decoder and a power supply hidden behind the bar. I patched the rig in Madrix. Because the shelves were staggered, I had to approximate the empty space in the software patch so effects would travel at the right speed. When the rig fired up, the fire presets moved naturally across the metal plates.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Mezzanine Bar/20241003_113337.mp4","fit":{"scale":1,"x":47.5,"y":37.3},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786749159559.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786749159559-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20250128_113555.mp4","fit":{"scale":1.1,"x":100,"y":31.4},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786750929356.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786750929356-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20241003_113152.webp","fit":{"scale":1,"x":50.2,"y":22.4},"thumbnail":"media/Lighting/Mezzanine Bar/20241003_113152-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20241003_113226.mp4","fit":{"scale":1,"x":43.4,"y":8.1},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786749136908.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786749136908-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20241001_110047.mp4","fit":{"scale":1,"x":52.1,"y":29},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786749024242.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786749024242-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20240924_130323.mp4","fit":{"scale":1,"x":50,"y":50},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786748964762.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786748964762-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20240924_125641.mp4","fit":{"scale":1,"x":50,"y":43.7},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786748937445.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786748937445-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20241003_105404.mp4","fit":{"scale":1,"x":50.5,"y":43},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786749049434.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786749049434-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20240924_113225.webp","fit":{"scale":1,"x":19.9,"y":27},"thumbnail":"media/Lighting/Mezzanine Bar/20240924_113225-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20240924_125453.webp","fit":{"scale":1,"x":50,"y":59.8},"thumbnail":"media/Lighting/Mezzanine Bar/20240924_125453-thumb.webp"}],"files":[],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixel Tape (x26.3m)</strong><br><em>qty: 526px • WS2814 • RGBW (3000k) • 12Vdc • 60/m • 20px/m</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supplies (x2)</strong><br><em>MEAN WELL • HLG-320H-12 • 12Vdc • 22A</em></p><p><strong>Pixel Decoder (x1)</strong><br><em>Advatek • R4D-S</em></p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"}],"video":"","timestamp":"2026-08-14T23:16:48.264Z","id":"9280","order":4,"specsData":[{"id":"b17a8cbf-3ff5-462f-80b7-56c22280151c","title":"PIXELS & DISPLAY","items":[{"id":"346a2b07-d67e-48a1-b7af-6896d3628f57","name":"LED Pixel Tape","qty":"26.3m","specs":"qty: 526px, WS2814 • RGBW (3000k) • 12Vdc • 60/m • 20px/m"}]},{"id":"b35a608e-c635-4ec3-b144-886803feec1c","title":"POWER & DISTRIBUTION","items":[{"id":"cf792f41-9a72-4384-828f-e0d685ea9f61","name":"Power Supplies","qty":"2","specs":"MEAN WELL • HLG-320H-12 • 12Vdc • 22A"},{"id":"885e4a48-7afa-46f5-b8b6-d9294139b588","name":"Pixel Decoder","qty":"1","specs":"Advatek, R4D-S"}]}]},{"title":"Bubblescape","category":"Art","image":"media/Art/Bubblescape/frame-thumb-1786909472631.webp","thumbnail":"media/Art/Bubblescape/frame-thumb-1786909472631-thumb.webp","thumbnailFit":{"scale":1,"x":52.1,"y":31.6},"bannerFit":{"scale":1,"x":50,"y":27.7},"description":"<p>Fused spheres, and not one overhang anywhere. An overhang makes a pocket the matrix underneath can never reach.</p>","longDescription":"<p>A cluster of soap bubbles, lit from behind. That was the whole picture in my head. Every piece before this had come out of SolidWorks, but SolidWorks does not want to make bubbles, so this one pulled Blender into the workflow for the first time. I took spheres of different sizes and fused them together until the surface read as a cluster.</p><p>The organic surface made the inside harder. The print uses three materials, black for the mask, white to bounce light, and clear for diffusion, over a 16 x 16 matrix. Keeping the internal grid even under a lumpy exterior was a step up in complexity. The pixels cannot get close enough to the face to hotspot, and the model cannot have a single overhang. An overhang makes a pocket the matrix underneath can never reach, and it shows up as a dead dark spot in the middle of a glowing bubble.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Embedded Systems","ESP8266","FDM 3D Printing","Lighting Design","Pixel Mapping","Rapid Prototyping","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/Bubblescape/20230808_072127~3.mp4","fit":{"scale":1,"x":48.8,"y":30},"poster":"media/Art/Bubblescape/frame-thumb-1786909472631.webp","thumbnail":"media/Art/Bubblescape/frame-thumb-1786909472631-thumb.webp"}],"files":[],"specsData":[{"id":"8fa6b1f5-4c62-41d3-8dbd-aaf51953633f","title":"Pixels & Display","items":[{"id":"57e396e6-ae22-4edb-a552-e2750c4ee23f","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"79457427-bec8-446e-8ea4-0a77be3c21c0","title":"FABRICATION & MATERIALS","items":[{"id":"e22fc588-c149-40f5-8be7-7e6b40c39ba0","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"0bf8202c-9de0-4d94-8e01-60b32a09a9af","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"ab899de2-c93c-40ae-9b45-da67a7a780fd","name":"PLA+ ( White )","qty":"","specs":"bounce"},{"id":"91469a7a-3d75-4284-86a3-7a3e64c11af4","name":"PLA+ ( \"Transparent\" )","qty":"","specs":"diffusion"},{"id":"5e2c97df-8ae3-4b3a-8f5d-f89c13bc4b6a","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"5d04c77b-a111-47c6-969c-d8252fd93b0e","title":"EMBEDDED ELECTRONICS","items":[{"id":"1b852a2a-a2d0-4696-9a76-367d5bcbdbf5","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>bounce</em></p><p><strong>PLA+ ( &quot;Transparent&quot; )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"Celtic Owl","url":"#project/8609"},{"name":"Scream-Face","url":"#project/1829"},{"name":"Face","url":"#project/4827"}],"video":"","timestamp":"2026-08-16T19:45:09.127Z","id":"9191","order":6},{"title":"Zig-Zag","category":"Art","image":"media/Art/Zig-Zag/20231127_070031~2-poster.webp","thumbnail":"media/Art/Zig-Zag/20231127_070031~2-poster-thumb.webp","thumbnailFit":{"scale":1,"x":50,"y":22.4},"bannerFit":{"scale":1,"x":50.2,"y":21.4},"description":"<p>Every other panel keeps its shape inside one cell. This pattern runs across all 256.</p>","longDescription":"<p>Every other panel in this series keeps its shape inside a single cell. Zig-Zag was the first time I let a pattern run across cells. Off, the front is a flat white square. On, a repeating grid of alternating L shapes punches through, and because each L spans several cells the shapes read as one continuous figure across the whole face instead of 256 little pictures.</p><p>Behind the face, a black internal grid divides the board into 10 mm cells so each light stays isolated even where the pattern crosses over. I printed it face down, white diffusion layer first, black walls built directly behind it, with a small controller running WLED for the animation. The whole effect lives or dies on the thickness of that white layer. Too thin and you can see the plastic shapes resting behind it when the piece is off. Too thick and the LEDs cannot push through. One millimeter was the exact limit.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Embedded Systems","ESP8266","FDM 3D Printing","Lighting Design","Pixel Mapping","Rapid Prototyping","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/Zig-Zag/20231127_070031~2.mp4","fit":{"scale":1,"x":50,"y":20.2},"poster":"media/Art/Zig-Zag/frame-thumb-1786909779529.webp","thumbnail":"media/Art/Zig-Zag/frame-thumb-1786909779529-thumb.webp"}],"files":[],"specsData":[{"id":"9eb1b583-1891-4993-80d1-a91d631349e1","title":"Pixels & Display","items":[{"id":"aaa2ba87-1683-4ab1-8699-5eb3c8f53150","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"5c9b259b-7f25-410c-8404-5b9057855f65","title":"FABRICATION & MATERIALS","items":[{"id":"3ad5ea6d-07cf-4b0a-a7cf-3bb5c10cb7fc","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"10b60f8a-68ba-41d4-90fe-78f568a705cd","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"0be04f4f-070f-4450-8a24-b09cbd15d445","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"5bdeb088-a2e6-4ec3-bb3d-326961057fe5","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"013ccf17-ad25-43d0-96d1-308d68bdeec8","title":"EMBEDDED ELECTRONICS","items":[{"id":"932ddc89-c1ad-4c3c-ad5e-8bebbdfd938b","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T19:50:18.919Z","id":"7412","order":15},{"title":"Clay Face","category":"Art","image":"media/Art/Clay Face/frame-thumb-1786910058148.webp","thumbnail":"media/Art/Clay Face/frame-thumb-1786910058148-thumb.webp","thumbnailFit":{"scale":1.15,"x":14.2,"y":39.1},"bannerFit":{"scale":1,"x":50,"y":36.3},"description":"<p>First thing I'd sculpted since grade school. Kept simple enough for the scanner to see it and a 16x16 grid to divide it.</p>","longDescription":"<p>The last time I had sculpted anything by hand was a grade-school art class. I shaped this mask out of white modeling clay, keeping it rough and simple on purpose: simple enough for a hand scanner to read, and simple enough that a 16 x 16 grid could divide it without fighting the surface.</p><p>The scan refused to cooperate anyway. The RevoPop kept leaving holes in the mesh that I struggled to close, and the sculpt did not have enough vertical height at the base to fit the hardware. I ended up running a low-poly pass over the whole scan just to force it into a closed shape. Once I had a solid model, I pulled it into Blender and built the internal subdivision to isolate 256 pixels behind it.</p><p>The result is a rough, hand-made exterior sitting on a perfectly rigid grid of black walls and white diffusion. The two do not look like they belong together until the lights come on.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Embedded Systems","ESP8266","Lighting Design","FDM 3D Printing","Pixel Mapping","Rapid Prototyping","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/Clay Face/20231128_061915.mp4","fit":{"scale":1.1,"x":4.3,"y":41.1},"poster":"media/Art/Clay Face/frame-thumb-1786910058148.webp","thumbnail":"media/Art/Clay Face/frame-thumb-1786910058148-thumb.webp"}],"files":[],"specsData":[{"id":"bf11d302-b13c-4607-bf70-4616effbd140","title":"Pixels & Display","items":[{"id":"87f362fc-2050-4f89-8de3-e242bf1fd0a3","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"a21b8c1b-4789-4009-9467-71c945a870cb","title":"FABRICATION & MATERIALS","items":[{"id":"30e2ab4c-3132-439c-ac35-48ecf959e859","name":"3D Printer","qty":"","specs":"Bambu Labs X1C, "},{"id":"7e1a3b14-d397-4c35-b13d-8e627e7e8313","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"f3a81718-d19b-41ab-a6e5-58a686242043","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"07d92f30-1163-4e0b-a43e-7e183dd4303b","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"3292fb71-0c73-40d8-9821-89e6fdf56dce","title":"EMBEDDED ELECTRONICS","items":[{"id":"b2ef1d1c-e2d7-4878-aa3e-986059791d27","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"Clay Tree","url":"#project/3139"}],"video":"","timestamp":"2026-08-16T19:55:48.429Z","id":"8740","order":8},{"title":"Scream-Face","category":"Art","image":"media/Art/Scream-Face/frame-thumb-1786911394361.webp","thumbnail":"media/Art/Scream-Face/frame-thumb-1786911394361-thumb.webp","thumbnailFit":{"scale":1,"x":47.5,"y":30.9},"bannerFit":{"scale":1,"x":49.3,"y":34},"description":"<p>The face dives deep into a flat surface, dragging the plastic toward the diodes. Ten extra millimeters of frame fixed it.</p>","longDescription":"<p>The face on this one dives deep into the flat surface around it, and those steep, dramatic edges were exactly what I liked about the model. They were also the problem. Put a flat pixel grid behind a curved object and the distance between the light and the plastic changes constantly. At the deepest part of the dip, the plastic sits right on top of the diodes, and every one of them shows up as a harsh bright spot.</p><p>I was not willing to give up the depth and I was not willing to accept hotspots, so I changed the structure instead. I added ten millimeters to the height of the grid's base layer and to the outer frame, which pushed the entire matrix back far enough that even the bottom of the dip stays clear. Ten millimeters is the minimum distance an LED can sit from the surface on any of these prints. This one just needed more room to get there.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","ESP8266","FDM 3D Printing","Lighting Design","Pixel Mapping","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/Scream-Face/20220317_085054.mp4","fit":{"scale":1.15,"x":62.6,"y":34.1},"poster":"media/Art/Scream-Face/frame-thumb-1786911394361.webp","thumbnail":"media/Art/Scream-Face/frame-thumb-1786911394361-thumb.webp"},{"url":"media/Art/Scream-Face/20231002_204000.mp4","fit":{"scale":1.15,"x":81.2,"y":52.9},"poster":"media/Art/Scream-Face/frame-thumb-1786910329347.webp","thumbnail":"media/Art/Scream-Face/frame-thumb-1786910329347-thumb.webp"},{"url":"media/Art/Scream-Face/20231002_203931.mp4","fit":{"scale":1.15,"x":83.5,"y":42.7},"poster":"media/Art/Scream-Face/20231002_203931-poster.webp","thumbnail":"media/Art/Scream-Face/20231002_203931-poster-thumb.webp"}],"files":[],"specsData":[{"id":"6cf14105-abfc-46d0-8e93-1abaea19a1f4","title":"Pixels & Display","items":[{"id":"e98ce34a-e14e-4404-96f0-b5997947a050","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"d1e8f618-8036-4ce8-b824-f7c2fb7c3f82","title":"FABRICATION & MATERIALS","items":[{"id":"acd76efe-ae1c-415b-bc15-9d3628aec09e","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"71ac6208-d082-4654-82e4-14182763d853","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"946a50c2-ff85-40c5-936a-aa50423d5d12","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"73cf60a0-a31c-4819-b950-f8fa52f9fe00","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"456a127b-cb76-405b-a696-6ce88ee067c6","title":"EMBEDDED ELECTRONICS","items":[{"id":"4694546a-cfbd-4ce5-a757-a352bbd87b5d","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"Celtic Owl","url":"#project/8609"},{"name":"Bubblescape","url":"#project/9191"},{"name":"Face","url":"#project/4827"}],"video":"","timestamp":"2026-08-16T20:00:30.235Z","id":"1829","order":4},{"title":"Clay Tree","category":"Art","image":"media/Art/Clay Tree/20231129_193208~2-poster.webp","thumbnail":"media/Art/Clay Tree/20231129_193208~2-poster-thumb.webp","thumbnailFit":{"scale":1,"x":50,"y":53.8},"bannerFit":{"scale":1,"x":50.4,"y":45.4},"description":"<p>I still can't tell you what it is. A tree is the closest word. I sculpted it knowing 256 LEDs were going inside.</p>","longDescription":"<p>I still could not tell you exactly what this shape is. A tree is the closest thing I can think of. I sculpted it in white modeling clay knowing from the start that it would be scanned and filled with LEDs, so the only real requirement was enough depth to hide an internal grid inside it.</p><p>Once the RevoPop scan came out clean, I brought the mesh into Blender and ran it through the same internal subdivision process as the other organic pieces. It printed in dual-color PLA, black for the mask and white for the diffusion, over a 256-pixel matrix. Getting light to punch through an irregular shape meant keeping the outer shell exactly one millimeter thick everywhere. Thicker and the branches went dark. The grid underneath is rigid and square. The thing on top of it is whatever you decide it is.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Embedded Systems","ESP8266","Lighting Design","FDM 3D Printing","Pixel Mapping","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/Clay Tree/20231129_193208~2.mp4","fit":{"scale":1.1,"x":0,"y":40.1},"poster":"media/Art/Clay Tree/frame-thumb-1786910623035.webp","thumbnail":"media/Art/Clay Tree/frame-thumb-1786910623035-thumb.webp"},{"url":"media/Art/Clay Tree/20220330_230338.mp4","fit":{"scale":1,"x":48.9,"y":35.4},"poster":"media/Art/Clay Tree/frame-thumb-1786910729386.webp","thumbnail":"media/Art/Clay Tree/frame-thumb-1786910729386-thumb.webp"}],"files":[],"specsData":[{"id":"8dec7f70-9d41-47ae-8090-ef298c34424b","title":"Pixels & Display","items":[{"id":"07ddd195-63e0-49a3-9f09-451f30951f9b","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"c857c23c-f1d1-4822-beae-d01981497284","title":"FABRICATION & MATERIALS","items":[{"id":"dcb0225a-69e4-44dc-83b0-1aa437e67fa1","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"9b0de3b3-f132-41f4-89bb-b0bbb8858dd3","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"8ce4de72-faa7-489d-aa16-89e93a8dfa98","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"d95a87bc-70b2-4e0e-9bbe-123169f8434e","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"cf164177-1300-4189-9fc2-8f7177b61258","title":"EMBEDDED ELECTRONICS","items":[{"id":"7d60393c-3d9f-4572-aa59-ad8ca656b373","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"Clay Face","url":"#project/8740"}],"video":"","timestamp":"2026-08-16T20:06:37.433Z","id":"3139","order":9},{"title":"Face","category":"Art","image":"media/Art/Face/frame-thumb-1786911050766.webp","thumbnail":"media/Art/Face/frame-thumb-1786911050766-thumb.webp","thumbnailFit":{"scale":1,"x":44.5,"y":21.7},"bannerFit":{"scale":1,"x":50.2,"y":21.4},"description":"<p>Shelved for a year. My printers could not hold a surface smooth enough for a face to read, so I waited for one that could.</p>","longDescription":"<p>A human face on a 16 x 16 grid was one of the first ideas I had when I started making these prints. It sat on the shelf for about a year. My old printers could not do it. The surface came out too rough to read as a face, I could not hold the white layer at a consistent thickness, and the machines flatly refused to print the white-lined walls I needed for internal bounce.</p><p>I shelved it until I got a Bambu Lab X1C. That machine solved the surface finish. I printed the mask and borders in black and the diffusion in white, and then spent the real effort on the one variable that mattered: the exact thickness of that white layer. A face is the least forgiving subject for a low-resolution matrix. Too thick and the expression washes out. Too thin and you see the grid instead of the face. Dialed in, it reads.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Embedded Systems","ESP8266","FDM 3D Printing","Lighting Design","Pixel Mapping","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/Face/20231126_192610~2.mp4","fit":{"scale":1,"x":46.1,"y":20.8},"poster":"media/Art/Face/frame-thumb-1786911050766.webp","thumbnail":"media/Art/Face/frame-thumb-1786911050766-thumb.webp"}],"files":[],"specsData":[{"id":"acf9c148-f475-48bb-b206-fa45de3b1ed7","title":"Pixels & Display","items":[{"id":"b3925085-d9f5-4622-b366-cb7f3b934132","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"ee9f14c5-90e7-41d0-8119-5ba4201ad37b","title":"FABRICATION & MATERIALS","items":[{"id":"e14ce4ef-5e10-48f8-9c92-2e9113fcb1c4","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"7cac5df4-b4c2-42cb-9202-6e7b983bbdbb","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"5ab37a6d-94b2-4dc3-8308-ef0a7df306da","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"c50212d7-a3d4-4d23-a5bd-391e56c46268","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"8887604a-9a6d-4c7e-aa0f-7be689e5fe8f","title":"EMBEDDED ELECTRONICS","items":[{"id":"acf7306e-ccb9-4c39-a22c-caa43297ada3","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"Celtic Owl","url":"#project/8609"},{"name":"Scream-Face","url":"#project/1829"},{"name":"Bubblescape","url":"#project/9191"}],"video":"","timestamp":"2026-08-16T20:11:26.500Z","id":"4827","order":7},{"title":"X","category":"Art","image":"media/Art/X/20231125_093617~2-poster-thumb.webp","thumbnail":"media/Art/X/20231125_093617~2-poster-thumb-thumb.webp","thumbnailFit":{"scale":1.15,"x":76.2,"y":37.3},"bannerFit":{"scale":1,"x":50,"y":27.1},"description":"<p>The first time I put a 3D printer and an LED matrix in the same object. Flat white face, hidden mask, nothing outside to give it away.</p>","longDescription":"<p>I was tired of regular squares. Up to this point I had been building 3D objects with internal subdivisions and putting the texture on the outside. This time I kept the front face perfectly flat and changed the light coming from behind it instead. It was also the first time I really let a 3D printer and an LED matrix become one object, rather than a print sitting on top of some pixels.</p><p>Behind the panel, the grid breaks into 10 mm cells, and each one holds a simple X. For the shapes to read without bleeding into each other, the print had to be exact. I held the white diffusion layer to one millimeter across the entire surface, then printed a one-millimeter black mask directly onto the back of it. The mask is where the shapes actually live. From the front, until it powers on, there is nothing to see.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","ESP8266","Embedded Systems","Lighting Design","FDM 3D Printing","Pixel Mapping","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/X/20231125_093617~2.mp4","fit":{"scale":1.15,"x":23.1,"y":42.3},"poster":"media/Art/X/frame-thumb-1786911519833.webp","thumbnail":"media/Art/X/frame-thumb-1786911519833-thumb.webp"}],"files":[],"specsData":[{"id":"634f4530-dc6e-48fb-8fc9-3e1bdd02880b","title":"Pixels & Display","items":[{"id":"12e66f88-d55e-4658-a3a7-737d3a9f0599","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"1e4365e1-b791-4e72-85c6-35eb180b9916","title":"FABRICATION & MATERIALS","items":[{"id":"6a9333f7-05d5-4a51-961e-89725441a7eb","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"27373795-9ab2-43b4-a050-c12f2c3287bb","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"852a32a5-791a-4aac-99cd-515cf5dd5e54","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"75b6c465-7d8b-4b61-bc9d-0b1a65f5b78f","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"8a7bb458-7250-49a9-9225-97299f27f0bb","title":"EMBEDDED ELECTRONICS","items":[{"id":"7e2016a8-a441-438b-b24d-e12d4a47d0f4","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T20:19:44.564Z","id":"7080","order":16},{"title":"Dot Matrix","category":"Art","image":"media/Art/Dot Matrix/20231125_093701~2-poster.webp","thumbnail":"media/Art/Dot Matrix/20231125_093701~2-poster-thumb.webp","thumbnailFit":{"scale":1,"x":48.4,"y":32.5},"bannerFit":{"scale":1,"x":48.6,"y":41.4},"description":"<p>Temple SF's old dot-matrix rig went in a dumpster to make room for mine. This is that look, rebuilt at 16x16.</p>","longDescription":"<p>The old rigs at Temple Denver and Temple San Francisco both had a specific look, big fields of circular dots, and the San Francisco one was the rig I tore out myself to make room for the new install. I wanted that look back on my wall. Dot Matrix is a flat white square until it powers on, and then 256 circles appear where there were none.</p><p>The circles are not on the surface. They are black filament printed behind a solid white front layer, framing every cell of a 16 by 16 grid from the inside. I tried to run the enclosure on my IDEX printer first and it could not lay down the pattern inside cells that small. It just kept failing. I shelved the project until I got a Bambu X1C, which finally put the two colors down face down on the bed without making a mess. Printing the whole thing face down on a machine that could hold the pattern was the only way to get a surface that flat.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","Embedded Systems","ESP8266","Lighting Design","Pixel Mapping","FDM 3D Printing","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/Dot Matrix/20231125_093701~2.mp4","fit":{"scale":1,"x":50,"y":35.1},"poster":"media/Art/Dot Matrix/20231125_093701~2-poster.webp","thumbnail":"media/Art/Dot Matrix/20231125_093701~2-poster-thumb.webp"}],"files":[],"specsData":[{"id":"46cb4384-3ea3-49b8-8790-f741ca46f0be","title":"Pixels & Display","items":[{"id":"55418469-800c-4cd9-8d1a-9cbf65df6ca4","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"a1842010-fc5d-419a-8492-0ece88747de1","title":"FABRICATION & MATERIALS","items":[{"id":"c36d0da0-fbeb-4792-af47-2487397c852d","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"6e38a2d2-9195-47e6-809d-1a4cf32b8267","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"4b37e776-7d3b-4a20-9414-295ce81e58ba","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"fa4e5e95-8858-4473-aea9-034fd2dc960c","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"35325e48-cd7a-4e73-97ed-2a8ebe7f5eb7","title":"EMBEDDED ELECTRONICS","items":[{"id":"401cf762-050e-47b8-be75-87519027eb95","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"X","url":"#project/7080"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T20:23:22.050Z","id":"5202","order":14},{"title":"Inverted Triangles","category":"Art","image":"media/Art/Inverted Triangles/frame-thumb-1786911861387.webp","thumbnail":"media/Art/Inverted Triangles/frame-thumb-1786911861387-thumb.webp","thumbnailFit":{"scale":1,"x":50.2,"y":31.6},"bannerFit":{"scale":1,"x":50,"y":42.6},"description":"<p>By this one the technique was muscle memory. Designed, printed, and wired in a single day.</p>","longDescription":"<p>Unplugged on a wall, Inverted Triangles is a plain white square. That was the goal: a piece that only exists when the power is on.</p><p>By this point I had the printing technique figured out, and I designed and printed the whole object in a single day. The frame holds a 16 x 16 matrix running WLED. The pattern is a mask of inverted triangles printed in black PLA and hidden directly behind the white front face. When the matrix fires, the black plastic blocks the light and the triangles punch through. When the power drops, they have to vanish completely, and that comes down to one number: the white diffusion layer is exactly one millimeter thick. Any more and the pattern dims. Any less and you can see it when the piece is off.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","ESP8266","Embedded Systems","Lighting Design","Pixel Mapping","FDM 3D Printing","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/Inverted Triangles/20231125_093753~2.mp4","fit":{"scale":1.15,"x":63.2,"y":32.4},"poster":"media/Art/Inverted Triangles/frame-thumb-1786911861387.webp","thumbnail":"media/Art/Inverted Triangles/frame-thumb-1786911861387-thumb.webp"}],"files":[],"specsData":[{"id":"f3bfd48d-cc16-41fd-8410-957eb53d3600","title":"Pixels & Display","items":[{"id":"9eb54260-5938-4918-bcb8-d5c491ebdd17","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"5ec087a4-ac63-4617-9a4a-1f30d5a480e6","title":"FABRICATION & MATERIALS","items":[{"id":"c20d150c-73b5-4e41-8ef5-23f5ab50930f","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"7220bd55-8f04-45dc-8b87-5518a0d17437","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"b178ad13-20b6-468d-96d0-a0fe541233e8","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"56eb9b02-5090-420e-a5eb-9590684c6cdf","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"308e82d8-a7be-4dc3-bf4a-4850aed4edbf","title":"EMBEDDED ELECTRONICS","items":[{"id":"89cecf25-accc-4c1a-8ff3-0d048b94105c","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T20:25:20.687Z","id":"6865","order":17},{"title":"Circles Corner","category":"Art","image":"media/Art/Circles Corner/frame-thumb-1786912100385.webp","thumbnail":"media/Art/Circles Corner/frame-thumb-1786912100385-thumb.webp","thumbnailFit":{"scale":1.15,"x":22.1,"y":30},"bannerFit":{"scale":1.15,"x":27.2,"y":35.1},"description":"<p>One diagonal cut across every cell. The simplest mask in the series, repeated 256 times.</p>","longDescription":"<p>One diagonal cut across every cell. I blacked out half of each of the 256 pixels from behind, so each 10 mm cell works like a tiny gobo with a hard edge through the middle. Off, the face is blank. On, the hidden half-shapes appear through the diffusion all at once.</p><p>It is the simplest mask in the series and the easiest to repeat 256 times, which is part of why it works. The only thing that can break it is bleed. If light from the lit half leaks across into the dark half, the shape is gone. So the black layer behind the white diffusion had to be exactly one millimeter thick, enough for total blackout with no room for the print to get lazy.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Blender","Custom Fabrication","ESP8266","FDM 3D Printing","Lighting Design","Pixel Mapping","SPI","Wire-to-Board Soldering","WLED"],"gallery":[{"url":"media/Art/Circles Corner/20231125_093836~2.mp4","fit":{"scale":1.15,"x":19.4,"y":30.1},"poster":"media/Art/Circles Corner/frame-thumb-1786912100385.webp","thumbnail":"media/Art/Circles Corner/frame-thumb-1786912100385-thumb.webp"}],"files":[],"specsData":[{"id":"ee69bf60-a93d-43a7-91ad-90bbbb101da6","title":"Pixels & Display","items":[{"id":"59258021-4e26-4a9d-be23-689f53aa881b","name":"LED Pixels","qty":"256","specs":"WS2815, RGB, 16 x 16 matrix, black flex pcb, 12Vdc, "}]},{"id":"b9b040d8-cf98-41b1-9bda-665ddac4f0fc","title":"FABRICATION & MATERIALS","items":[{"id":"6e690402-efb1-4900-9170-64c373ae3c36","name":"3D Printer","qty":"","specs":"Bambu Labs X1C"},{"id":"1d549ca7-b0ac-4c87-95a2-a13781045037","name":"PLA+ ( Black )","qty":"","specs":"mask, border"},{"id":"41fee2b9-323c-4178-bc34-3c2e4bf1ed75","name":"PLA+ ( White )","qty":"","specs":"diffusion"},{"id":"aab972da-6955-4c44-8c2b-833ab2339050","name":"PETG ( Black )","qty":"","specs":"frame, internal support"}]},{"id":"4500d21e-1d5c-49a9-be49-c1cadbe22994","title":"EMBEDDED ELECTRONICS","items":[{"id":"cbd09f8c-efa8-4940-afec-e0367736bd87","name":"Pixel Decoder","qty":"1","specs":"Athom, LS2812B-WLED, ESP8266, WLED"}]}],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>LED Pixels (x256)</strong><br><em>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc</em></p><h2>FABRICATION &amp; MATERIALS</h2><p><strong>3D Printer</strong><br><em>Bambu Labs X1C</em></p><p><strong>PLA+ ( Black )</strong><br><em>mask • border</em></p><p><strong>PLA+ ( White )</strong><br><em>diffusion</em></p><p><strong>PETG ( Black )</strong><br><em>frame • internal support</em></p><h2>EMBEDDED ELECTRONICS</h2><p><strong>Pixel Decoder (x1)</strong><br><em>Athom • LS2812B-WLED • ESP8266 • WLED</em></p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Seed of Life","url":"#project/9896"}],"video":"","timestamp":"2026-08-16T20:29:37.203Z","id":"2451","order":11},{"title":"TangiPix","category":"Software","image":"media/Apps/TangiPix/Screenshot 2026-08-22 150517.webp","thumbnail":"media/Apps/TangiPix/Screenshot 2026-08-22 150517-thumb.webp","thumbnailFit":{"scale":1,"x":49.5,"y":0},"bannerFit":{"scale":1,"x":45.7,"y":29.1},"description":"<p>Photo in, bead-curtain schematic out, with a bill of materials and numbered squares for hand sorting. Test subject: the Mona Lisa in neon.</p>","longDescription":"<p>Bead curtains and stacked-brick images were the goal, and I had no way to plan either one. Taking a photo and forcing it into a handful of physical colors sounds simple. It is not. So I built the planner first.</p><p>You drop a photo in, lock it to a grid, and map the cells to whatever inventory of colors you actually have. The engine reduces the image into that strict color space. Because real inventory never matches a photo cleanly, I built a few different rendering options to choose between. The heavy math, k-means clustering in particular, would normally freeze the tab, so I pushed it into a Web Worker. The first real test was forcing the Mona Lisa into a neon rainbow palette. It came back as a PDF schematic with a bill of materials and numbered squares for hand sorting.</p><p>I have not built the bead curtain yet, though it is still a good first project for it. The real destination is bigger. I want to build one of those marble picture machines that drops colored marbles down a series of columns to form an image, then clears it and starts over. TangiPix is the engine that will tell it what to drop.</p>","websiteLink":"","launchLink":"https://elusid108.github.io/TangiPix/","githubLink":"https://github.com/Elusid108/TangiPix","shopLink":"","featured":false,"wip":true,"tags":["TypeScript","React","Vite"],"gallery":[{"url":"media/Apps/TangiPix/Screenshot 2026-08-22 150517.webp","fit":{"scale":1,"x":52.5,"y":47.9},"thumbnail":"media/Apps/TangiPix/Screenshot 2026-08-22 150517-thumb.webp"},{"url":"media/Apps/TangiPix/Screenshot 2026-08-22 150529.webp","fit":{"scale":1,"x":52.7,"y":23.3},"thumbnail":"media/Apps/TangiPix/Screenshot 2026-08-22 150529-thumb.webp"},{"url":"media/Apps/TangiPix/Screenshot 2026-08-22 150548.webp","fit":{"scale":1,"x":50,"y":71.6},"thumbnail":"media/Apps/TangiPix/Screenshot 2026-08-22 150548-thumb.webp"},{"url":"media/Apps/TangiPix/Screenshot 2026-08-22 150613.webp","fit":{"scale":1,"x":51.3,"y":44},"thumbnail":"media/Apps/TangiPix/Screenshot 2026-08-22 150613-thumb.webp"},{"url":"media/Apps/TangiPix/Screenshot 2026-08-22 163010.webp","fit":{"scale":1.1,"x":47.7,"y":94.8},"thumbnail":"media/Apps/TangiPix/Screenshot 2026-08-22 163010-thumb.webp"},{"url":"media/Apps/TangiPix/Screenshot 2026-08-22 163024.webp","fit":{"scale":1.1,"x":52.3,"y":94.3},"thumbnail":"media/Apps/TangiPix/Screenshot 2026-08-22 163024-thumb.webp"},{"url":"media/Apps/TangiPix/Screenshot 2026-08-22 163102.webp","fit":{"scale":1.1,"x":41.9,"y":13.8},"thumbnail":"media/Apps/TangiPix/Screenshot 2026-08-22 163102-thumb.webp"},{"url":"media/Apps/TangiPix/Screenshot 2026-08-22 163229.webp","fit":{"scale":1.1,"x":57.4,"y":14},"thumbnail":"media/Apps/TangiPix/Screenshot 2026-08-22 163229-thumb.webp"}],"files":[{"name":"monalisa_rainbow.pdf","url":"media/Apps/TangiPix/files/monalisa_rainbow.pdf","description":""}],"specsData":[{"id":"8c6a9073-4c8c-4af0-8e69-130b0e05a611","title":"SOFTWARE & STACK","items":[{"id":"e4c2d9e4-2113-4c50-b981-abe311f6c9db","name":"Framework","qty":"","specs":"React 19.1"},{"id":"df919454-4bfe-4543-8e9c-9b5ba8130ac9","name":"Language","qty":"","specs":"TypeScript ~5.9"},{"id":"572139ce-6707-478c-8738-40d8822f4c53","name":"Build","qty":"","specs":"Vite 6.4"},{"id":"c6938eae-40f2-41e8-9606-b2a69994e90b","name":"Styling","qty":"","specs":"Custom CSS"},{"id":"a23adc71-b60c-415d-9102-4d1f74355f0d","name":"Deploy","qty":"","specs":"GitHub Pages"}]}],"specs":"<h2>SOFTWARE &amp; STACK</h2><p><strong>Framework</strong><br><em>React 19.1</em></p><p><strong>Language</strong><br><em>TypeScript ~5.9</em></p><p><strong>Build</strong><br><em>Vite 6.4</em></p><p><strong>Styling</strong><br><em>Custom CSS</em></p><p><strong>Deploy</strong><br><em>GitHub Pages</em></p>","related":[],"video":"","timestamp":"2026-08-22T19:10:36.064Z","id":"2955","order":2},{"title":"BorderBuilder","category":"Software","image":"media/Apps/BorderBuilder/Screenshot 2026-08-22 224715.webp","thumbnailFit":{"scale":1.25,"x":9.6,"y":47.5},"bannerFit":{"scale":1.25,"x":0,"y":32.2},"description":"<p>A lithophane goes in, a printable frame comes out. I tested the geometry on a cog, because if the math survives a cog it survives anything.</p>","longDescription":"<p>Every lithophane needs a frame, and I never once tried to model one by hand. I could have learned enough Blender to do it. That was not the point. I have a whole workflow in my head for going from a photo to a finished, framed, backlit print, and every step I can turn into a custom app is a step I can eventually automate. Frames were the next step.</p><p>BorderBuilder branched off LithoLab. You drop in an exported lithophane, dial in a decorative edge, and export a frame ready to print, with the lithophane seated in the back. It also works on its own for photo frames and mirrors, and it exports DXF files for laser-cutting acrylic light panels. The math for irregular outlines was the hard part. I tested the routing and masks against a complex cog, on the theory that if it survives a cog it survives anything. It took several attempts before the app stopped failing on it.</p><p>It runs in the browser with nothing behind it. The frames print. The Blender tab is still closed.</p>","websiteLink":"","launchLink":"https://elusid108.github.io/BorderBuilder/","githubLink":"https://github.com/Elusid108/BorderBuilder","shopLink":"","featured":false,"wip":true,"tags":["FDM 3D Printing"],"gallery":[{"url":"media/Apps/BorderBuilder/Screenshot 2026-08-22 224715.webp","thumbnail":"media/Apps/BorderBuilder/Screenshot 2026-08-22 224715-thumb.webp"},{"url":"media/Apps/BorderBuilder/Screenshot 2026-08-22 224540.webp","thumbnail":"media/Apps/BorderBuilder/Screenshot 2026-08-22 224540-thumb.webp"},{"url":"media/Apps/BorderBuilder/Screenshot 2026-08-22 224522.webp","thumbnail":"media/Apps/BorderBuilder/Screenshot 2026-08-22 224522-thumb.webp"}],"files":[],"specsData":[{"id":"311aa5f2-39d0-4b36-8772-4d596fa9f9b4","title":"Placeholder","items":[]}],"specs":"<h2>PLACEHOLDER</h2>","related":[{"name":"LithoLab","url":"#project/2944"}],"video":"","timestamp":"2026-08-23T03:28:57.175Z","id":"8287","order":1}],"settings":{"email":"chrismooredesignsllc@gmail.com","instagram":"https://www.instagram.com/pixel_freak/#","linkedin":"https://www.linkedin.com/in/christopher-moore-39a3b6211","github":"https://github.com/Elusid108","emailjs_service":"service_uk1sc0n","emailjs_template":"template_y1ut396","emailjs_public_key":"9xxn3H48uT3zIv6Jl","about_headshot":"media/headshot_1.webp","about_text":"<p>I'm a multidisciplinary technologist and designer currently building a new career in robotics, with a hands-on background in lighting design, rapid prototyping, and interactive systems. My work blends physical fabrication and digital tools, designing lighting installations, building custom electronics, developing apps, and using 3D printing to move quickly from idea to functional object. I'm most at home in the space where creative intent meets technical execution.</p><p><br></p><p>I focus on making systems that are practical, resilient, and thoughtfully designed. That means understanding circuitry and power, iterating hardware through real-world use, and building software that supports the experience without unnecessary complexity. I'm drawn to robotics because it demands the same mindset I've used for years, working with constraints, debugging in the physical world, and designing for safety, feedback, and reliability. I bring a builder's perspective, strong intuition for how things fail, and a deep respect for craftsmanship.</p>","skills_hardware":"Power Distribution, AC/DC Load Calc, Through-Hole Soldering, Wire-to-Board Soldering, SMD Soldering, ESP32, ESP8266, Embedded Systems, Repair","skills_lighting":"Resolume Arena, Madrix, ELM, MA, Roadhog 4, ETC, ChamSys, Capture, Lighting Design, Pixel Mapping, Video Mapping, WLED","skills_software":"React, JavaScript, TypeScript, Node.js, REST APIs, LLM Integration, Google Drive API, Vite","skills_fabrication":"FDM 3D Printing, 3D Scanning, SolidWorks, Custom Fabrication, Rapid Prototyping, Hand tools, Power tools, Blender","skills_systems":"DMX, ArtNet, sACN, OSC, MIDI, TCP/IP, SPI, Show Cockpit, OSCpilot, NDI"}}

        // --- GLOBAL HELPER: URL NORMALIZER ---
        const ensureProtocol = (url) => {
            if (!url) return '';
            if (url.startsWith('mailto:')) return url;
            if (url.startsWith('#')) return url;
            if (url.startsWith('/') || url.startsWith('./') || url.startsWith('../')) return url;
            const trimmed = url.trim();
            if (!/^https?:\/\//i.test(trimmed)) {
                // Relative paths (e.g. media/...) should be served as-is
                if (!/^[a-zA-Z0-9+\-.]+:\/\//.test(trimmed) && !trimmed.includes('://') && trimmed.match(/^[a-zA-Z]+\//)) {
                    return trimmed;
                }
                return `https://${trimmed}`;
            }
            return trimmed;
        };

        const getYouTubeId = (url) => {
            if (!url || typeof url !== 'string') return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            const match = url.trim().match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        // Gallery entries are either a bare URL string or { url, caption } once a
        // caption has been authored in the CMS.
        const mediaSrc = (item) => (typeof item === 'string' ? item : (item?.url || ''));
        const mediaCaption = (item) => (typeof item === 'string' ? '' : (item?.caption || ''));
        const mediaFit = (item) => (typeof item === 'string' ? null : (item?.fit || null));
        const mediaPoster = (item) => (typeof item === 'string' ? null : (item?.poster || null));
        const mediaThumbnail = (item) => (typeof item === 'string' ? null : (item?.thumbnail || null));
        const mediaHasAudio = (item) => typeof item === 'object' && !!item?.hasAudio;

        // Self-hosted (non-YouTube) video files uploaded via the CMS's video
        // converter always come out as .mp4, but a manually-typed URL could point

        const isVideoUrl = (url) => typeof url === 'string' && /\.(mp4|webm|mov|m4v)$/i.test(url.split('?')[0]);

        // Returns inline style for a cropped image. When scale=1, only objectPosition

        const fitStyle = (fit) => {
            if (!fit) return {};
            const { scale = 1, x = 50, y = 50 } = fit;
            if (scale <= 1) return { objectPosition: `${x}% ${y}%` };
            return { transform: `scale(${scale})`, transformOrigin: `${x}% ${y}%`, objectPosition: `${x}% ${y}%` };
        };

        const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])';

        // Confines Tab cycling to `containerRef`, closes on Escape, and returns
        // focus to whatever was focused before the dialog opened. `isActive` lets a
        // parent dialog stand down while a nested one (the lightbox) is on top.
        const useDialog = (containerRef, onClose, isActive = true) => {
            // Read through a ref so the once-only effect below never sees stale state.
            const stateRef = useRef(null);
            stateRef.current = { onClose, isActive };

            useEffect(() => {
                const previouslyFocused = document.activeElement;
                const container = containerRef.current;

                const focusables = () =>
                    Array.from(container ? container.querySelectorAll(FOCUSABLE) : [])
                        .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);

                const first = focusables()[0];
                (first || container)?.focus();

                const onKeyDown = (e) => {
                    if (!stateRef.current.isActive) return;
                    if (e.key === 'Escape') {
                        e.stopPropagation();
                        stateRef.current.onClose();
                        return;
                    }
                    if (e.key !== 'Tab') return;
                    const items = focusables();
                    if (!items.length) { e.preventDefault(); return; }
                    const firstItem = items[0];
                    const lastItem = items[items.length - 1];
                    if (e.shiftKey && (document.activeElement === firstItem || !container.contains(document.activeElement))) {
                        e.preventDefault();
                        lastItem.focus();
                    } else if (!e.shiftKey && document.activeElement === lastItem) {
                        e.preventDefault();
                        firstItem.focus();
                    }
                };

                document.addEventListener('keydown', onKeyDown, true);
                return () => {
                    document.removeEventListener('keydown', onKeyDown, true);
                    if (previouslyFocused && document.contains(previouslyFocused)) previouslyFocused.focus();
                };
            }, []);
        };

        // The CMS editor emits <h1>/<h2>, which collide with the heading level of the
        // section the markup gets embedded in (an <h2> landing inside the <h4>
        // "Specifications" panel reads as a jump back up the outline). Retag to the right
        // level and move the visual size onto a class.
        const demoteHeadings = (html, startLevel) => {
            if (!html) return html;
            const source = String(html);
            const present = [...source.matchAll(/<h([1-6])\b/gi)].map(m => parseInt(m[1], 10));
            if (!present.length) return source;
            // Anchor the shallowest authored heading at startLevel so the outline neither
            // jumps backwards nor skips a level, and keep relative nesting below it.
            const shallowest = Math.min(...present);
            return source.replace(/<(\/?)h([1-6])([^>]*)>/gi, (match, slash, lvl, attrs) => {
                const original = parseInt(lvl, 10);
                const level = Math.min(6, startLevel + original - shallowest);
                if (slash) return `</h${level}>`;
                const cls = `rt-h${original}`;
                const withClass = /class\s*=\s*"/i.test(attrs)
                    ? attrs.replace(/class\s*=\s*"([^"]*)"/i, (m, c) => `class="${c} ${cls}"`)

                return `<h${level}${withClass}>`;
            });
