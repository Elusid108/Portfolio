                                        About Me
                                    </button>
                                    <a href="media/Resume/Robotics%20CV%20v002.pdf" target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center gap-2 px-6 py-3 border border-zinc-600 rounded-lg text-zinc-300 hover:border-cyan-500 hover:text-white transition-colors font-medium">
                                        <FileIcon size={16} aria-hidden="true" /> View Resume
                                        <span className="sr-only">, PDF (opens in a new tab)</span>
                                    </a>
                                </div>
                                <button onClick={() => setShowShopToast(true)} className="w-full py-3 bg-white text-black font-bold rounded-lg hover:bg-zinc-200 transition-colors">
                                    Visit Shop
                                </button>
                            </div>
                            {showShopToast && (
                                <ShopToast onClose={() => setShowShopToast(false)} />
                            )}
                        </div>

                        {/* Grid - 2 cols, 3 rows */}
                        <div className="grid grid-cols-2 gap-4 h-[600px] w-full">
                            <HeroBadge id="lighting" label="Lighting" icon={Lightbulb} color="text-yellow-400" />
                            <HeroBadge id="art" label="Art" icon={Palette} color="text-pink-400" />
                            <HeroBadge id="circuits" label="Electronics" icon={Cpu} color="text-green-400" />
                            <HeroBadge id="apps" label="Apps" icon={Smartphone} color="text-purple-400" />
                            <HeroBadge id="solutions" label="Fabrication" icon={Printer} color="text-orange-400" />
                            <HeroBadge id="integration" label="Integration" icon={Layers} color="text-blue-400" />
                        </div>
                    </div>
                </section>
            );
        };

        const SimpleSection = ({ id, title, subtitle, icon, category, onOpenProject, bgColor = "bg-black" }) => {
            const [expanded, setExpanded] = useState(false);
            const sectionProjects = projects
                .filter(p => p.category === category)
                .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            const visibleProjects = expanded ? sectionProjects : sectionProjects.slice(0, 3);
            const hasMore = sectionProjects.length > 3;
            return (
                <section id={id} className={`py-20 ${bgColor} border-t border-zinc-900`}>
                    <div className="container mx-auto px-6">
                        <SectionHeader title={title} subtitle={subtitle} icon={icon} />
                        {sectionProjects.length > 0 ? (
                            <>
                                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {visibleProjects.map(p => (
                                        <ProjectCard key={p.id} project={p} onOpen={onOpenProject} />
                                    ))}
                                </div>
                                {hasMore && (
                                    <button
                                        onClick={() => setExpanded(!expanded)}
                                        aria-expanded={expanded}
                                        aria-label={expanded ? `Show fewer ${title} projects` : `Show ${sectionProjects.length - 3} more ${title} projects`}
                                        className="mt-6 w-full py-2 border border-zinc-800 rounded-xl text-zinc-300 font-bold hover:bg-zinc-900 hover:border-zinc-600 transition-all"
                                    >
                                        {expanded ? "Show Less" : `Show More (${sectionProjects.length - 3})`}
                                    </button>
                                )}
                            </>
                        ) : (
                            <div className="p-8 border border-dashed border-zinc-800 rounded-xl text-center text-zinc-600">
                                No projects currently listed in this category.
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const Contact = () => {
            const [showModal, setShowModal] = useState(false);

            // Helper to ensure URLs have protocol
            const ensureProtocol = (url) => {
                if (!url) return '';
                if (url.startsWith('mailto:')) return url;
                const trimmed = url.trim();
                // Check if it already starts with http:// or https://
                if (!/^https?:\/\//i.test(trimmed)) {
                    return `https://${trimmed}`;
                }
                return trimmed;
            };

            const emailConfig = {
                service: settings.emailjs_service,
                template: settings.emailjs_template,
                key: settings.emailjs_public_key
            };

            return (
                <section id="contact" className="py-24 bg-zinc-950 border-t border-zinc-900">
                    <div className="container mx-auto px-6 text-center">
                        <h2 className="text-3xl font-bold mb-6">Let's Build Something</h2>
                        <p className="text-zinc-400 max-w-xl mx-auto mb-10">
                            Available for freelance projects and open to full-time opportunities —
                            lighting systems, embedded electronics, rapid prototyping, and software.
                        </p>
                        
                        <div className="flex flex-col md:flex-row justify-center gap-6 flex-wrap">
                            {settings.email && (
                                <button onClick={() => setShowModal(true)} className="px-8 py-4 bg-white text-black font-bold rounded-full hover:bg-cyan-400 hover:text-black transition-all transform hover:-translate-y-1 shadow-lg flex items-center justify-center gap-2">
                                    <Mail size={18} aria-hidden="true" /> Email Me
                                </button>
                            )}
                            <a href="media/Resume/Robotics%20CV%20v002.pdf" target="_blank" rel="noopener noreferrer" className="px-8 py-4 border border-cyan-700 text-cyan-300 font-bold rounded-full hover:bg-cyan-900 hover:border-cyan-500 transition-all flex items-center justify-center gap-2">
                                <FileIcon size={18} aria-hidden="true" /> View Resume
                                <span className="sr-only">, PDF (opens in a new tab)</span>
                            </a>
                            {settings.instagram && (
                                <a href={ensureProtocol(settings.instagram)} target="_blank" rel="noopener noreferrer" className="px-8 py-4 border border-zinc-700 text-white font-bold rounded-full hover:bg-pink-600 hover:border-pink-600 transition-all flex items-center justify-center gap-2">
                                    <Instagram size={18} aria-hidden="true" /> Instagram
                                    <span className="sr-only">(opens in a new tab)</span>
                                </a >
                            )}
                            {settings.linkedin && (
                                <a href={ensureProtocol(settings.linkedin)} target="_blank" rel="noopener noreferrer" className="px-8 py-4 border border-zinc-700 text-white font-bold rounded-full hover:bg-blue-600 hover:border-blue-600 transition-all flex items-center justify-center gap-2">
                                    <Linkedin size={18} aria-hidden="true" /> LinkedIn
                                    <span className="sr-only">(opens in a new tab)</span>
                                </a>
                            )}
                            {settings.github && (
                                <a href={ensureProtocol(settings.github)} target="_blank" rel="noopener noreferrer" className="px-8 py-4 border border-zinc-700 text-white font-bold rounded-full hover:bg-zinc-900 transition-all flex items-center justify-center gap-2">
                                    <Github size={18} aria-hidden="true" /> GitHub
                                    <span className="sr-only">(opens in a new tab)</span>
                                </a>
                            )}
                        </div>
                        
                        <footer className="mt-20 text-zinc-600 text-sm font-mono">
                            &copy; 2026 Chris Moore Designs. All rights reserved.
                        </footer>
                    </div>
                    {showModal && settings.email && <ContactModal email={settings.email} onClose={() => setShowModal(false)} emailConfig={emailConfig} />}
                </section>
            );
        };

        const FilteredView = ({ filter, onClear, onOpenProject }) => {
            const matching = projects.filter(p => p.tags && p.tags.includes(filter));
            return (
                <section className="pt-32 pb-20 bg-black min-h-[60vh]">
                    <div className="container mx-auto px-6">
                        <div className="mb-12">
                            <div className="flex items-center gap-3 text-cyan-400 mb-2 font-mono text-sm uppercase tracking-widest">
                                <Filter size={16} />
                                <span>Filtered by Skill</span>
                            </div>
                            <div className="flex items-center gap-4 flex-wrap">
                                <h2 className="text-3xl md:text-4xl font-bold">{filter}</h2>
                                <button type="button" onClick={onClear} className="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-zinc-400 bg-zinc-800 border border-zinc-700 rounded-lg hover:bg-zinc-700 hover:text-white transition-colors">
                                    <X size={14} /> Clear Filter
                                </button>
                            </div>
                        </div>
                        {matching.length > 0 ? (
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {matching.map(p => (
                                    <ProjectCard key={p.id} project={p} onOpen={onOpenProject} />
                                ))}
                            </div>
                        ) : (
                            <div className="p-12 border border-dashed border-zinc-800 rounded-xl text-center text-zinc-500">
                                <p className="text-lg mb-2">No projects tagged with "{filter}" yet.</p>
                                <p className="text-sm">Tag projects with this skill in the CMS to see them here.</p>
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const App = () => {
            const [selectedProject, setSelectedProject] = useState(null);
            const [activeFilter, setActiveFilter] = useState(null);
            const pushedHash = useRef(false);
            const justOpenedFromCard = useRef(false);

            useEffect(() => {
                const syncFromHash = () => {
                    const hash = window.location.hash;
                    if (hash.startsWith('#project/')) {
                        const id = decodeURIComponent(hash.slice('#project/'.length));
                        const found = projects.find(p => p.id === id);
                        if (found) {
                            if (justOpenedFromCard.current) {
                                justOpenedFromCard.current = false;
                            }
                            setSelectedProject(found);
                        } else {
                            setSelectedProject(null);
                            pushedHash.current = false;
                            justOpenedFromCard.current = false;
                        }
                    } else {
                        setSelectedProject(null);
                        pushedHash.current = false;
                        justOpenedFromCard.current = false;
                    }
                };
                syncFromHash();
                window.addEventListener('hashchange', syncFromHash);
                return () => window.removeEventListener('hashchange', syncFromHash);
            }, []);

            const handleOpenProject = (project) => {
                pushedHash.current = true;
                justOpenedFromCard.current = true;
                window.location.hash = 'project/' + encodeURIComponent(project.id);
            };

            const handleCloseProject = () => {
                pushedHash.current = false;
                justOpenedFromCard.current = false;
                history.replaceState(null, '', window.location.pathname + window.location.search);
                setSelectedProject(null);
            };

            const handleSetFilter = (tag) => {
                setActiveFilter(tag);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleFilterByTag = (tag) => {
                handleCloseProject();
                handleSetFilter(tag);
            };

            const handleNavToSection = (id) => {
                setActiveFilter(null);
                setTimeout(() => {
                    history.replaceState(null, '', '#' + id);
                    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
                }, 0);
            };

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-200 selection:bg-cyan-500/30">
                    <a href="#main-content" className="skip-link">Skip to main content</a>
                    <Nav onNavToSection={handleNavToSection} />
                    <main id="main-content">
                    {activeFilter ? (
                        <FilteredView filter={activeFilter} onClear={() => setActiveFilter(null)} onOpenProject={handleOpenProject} />
                    ) : (
                        <>
                        <Hero />
                        
                        <SimpleSection 
                            id="lighting" 
                            title="Illumination" 
                            subtitle="Lighting Design" 
                            icon={Lightbulb} 
                            category="Lighting" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-black"
                        />
                        
                        <SimpleSection 
                            id="art" 
                            title="Sculpture & Form" 
                            subtitle="Art" 
                            icon={Palette} 
                            category="Art" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-zinc-950"
                        />
                        <SimpleSection 
                            id="circuits" 
                            title="Hardware Design" 
                            subtitle="Electronics & PCBs" 
                            icon={Cpu} 
                            category="Circuits" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-black"
                        />
                        <SimpleSection 
                            id="apps" 
                            title="Interactive Software" 
                            subtitle="Apps & Games" 
                            icon={Smartphone} 
                            category="Apps" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-zinc-950"
                        />
                        <SimpleSection 
                            id="solutions" 
                            title="Custom Tooling" 
                            subtitle="Fabrication & Solutions" 
                            icon={Wrench} 
                            category="Solutions" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-black"
                        />
                        <SimpleSection 
                            id="integration" 
                            title="The Backbone" 
                            subtitle="Systems Integration" 
                            icon={Layers} 
                            category="Integration" 
                            onOpenProject={handleOpenProject} 
                            bgColor="bg-zinc-950"
                        />
                        </>
                    )}
                    
                    <AboutMe onFilterBySkill={handleSetFilter} />
                    
                    <Contact />
                    </main>
                    
                    {selectedProject && (
                        <ProjectModal 
                            project={selectedProject} 
                            onClose={handleCloseProject}
                            onFilterByTag={handleFilterByTag}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
