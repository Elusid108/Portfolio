ance-Floor-Pillars-img-fc08ee-thumb.webp"},{"url":"media/Electronics/Immersive Dance Floor Pillars/Dance-Floor-Pillars-img-1215bc.webp","fit":{"scale":1.3,"x":71.4,"y":67.1},"thumbnail":"media/Electronics/Immersive Dance Floor Pillars/Dance-Floor-Pillars-img-1215bc-thumb.webp"},{"url":"media/Electronics/Immersive Dance Floor Pillars/Dance-Floor-Pillars-img-35e6b6.webp","fit":{"scale":1.1,"x":22.2,"y":48.6},"thumbnail":"media/Electronics/Immersive Dance Floor Pillars/Dance-Floor-Pillars-img-35e6b6-thumb.webp"}],"files":[],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x6400)\u003c/strong>\u003cbr>\u003cem>320m • SM16704 • RGBW (6000k) • 20px/m • 12Vdc\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x10)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • 12Vdc • 50A\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x2)\u003c/strong>\u003cbr>\u003cem>Advatek • PixLite 16 Long Range MK2\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Receiver (x10)\u003c/strong>\u003cbr>\u003cem>Advatek • PixLite Long Range Receiver\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>Mud-In Extrusion ( flat ) (x40)\u003c/strong>\u003cbr>\u003cem>4m • flush • drywall mud-in • opal diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>Mud-In Extrusion ( corner ) (x40)\u003c/strong>\u003cbr>\u003cem>4m • flush • drywall mud-in • opal diffusion\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Temple SF","url":"#project/8252"},{"name":"Immersive Dance Lighting Rig","url":"#project/1"},{"name":"Immersive Video Layer","url":"#project/4250"},{"name":"Immersive Lighting Layer","url":"#project/2395"},{"name":"Extrusion Center Sled","url":"#project/5376"}],"video":"","timestamp":"2026-07-31T21:40:01.374Z","id":"6371","order":6,"thumbnailFit":{"scale":1.15,"x":33.2,"y":41.7},"bannerFit":{"scale":1,"x":50.4,"y":55.7},"thumbnail":"media/Electronics/Immersive Dance Floor Pillars/Dance-Floor-Pillars-img-2141b9-thumb.webp","slug":"immersive-dance-floor-pillars","imageThumb":"media/Electronics/Immersive Dance Floor Pillars/Dance-Floor-Pillars-img-2141b9-thumb.webp"},{"title":"Pixel Louver Lights","category":"Fixtures","image":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-ea80e4.webp","description":"\u003cp>Nobody sells a corner LED channel with louvers in it, so I modeled one and printed enough for 48 cubbies. They were supposed to stay dry.\u003c/p>","longDescription":"\u003cp>I needed to light 48 bar cubbies from the front corners without blasting raw RGB pixels into people's eyes. I have never seen a commercial LED channel with louvers, let alone a corner extrusion built for illumination. I modeled one in SolidWorks and printed 96 of them.\u003c/p>\u003cp>Getting the slide-in backing to fit took a few tries. Factory solder splices on the LED tape created bumps that jammed the plastic. I had to cut the tape strictly between splices to keep it flat. I also added internal zip ties so hanging wires wouldn't rip the solder pads off the strips.\u003c/p>\u003cp>Since the shelves were supposed to stay dry, I used non-waterproof tape. That was a mistake. On busy nights, people set drinks in the cubbies. Spills pooled in the corners, corroded the strips, and shorted them out. If I make these again, I am elevating the electronics off the deck and using waterproof tape.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Custom Fabrication","FDM 3D Printing","Hand tools","Lighting Design","Rapid Prototyping","SolidWorks","Wire-to-Board Soldering"],"gallery":[{"url":"media/Electronics/Pixel Louver Lights/models/Pixel-Louver-Lights-gfx-aecd82.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#505050","opacity":1},{"name":"Part_2","color":"#505050","opacity":1},{"name":"Part_3","color":"#505050","opacity":1}],"view":{"theta":1.576,"phi":3.1416,"radiusScale":2.16,"panX":0,"panY":0},"fit":{"scale":1,"x":50,"y":50},"poster":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-gfx-aecd82-poster.webp","thumbnail":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-gfx-aecd82-poster-thumb.webp"},{"url":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-ea80e4.webp","fit":{"scale":1.3,"x":0,"y":46.7},"thumbnail":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-ea80e4-thumb.webp"},{"url":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-efa6ab.webp","fit":{"scale":1.4,"x":49.1,"y":43.2},"thumbnail":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-efa6ab-thumb.webp"},{"url":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-bf438f.webp","fit":{"scale":1,"x":50,"y":63.7},"thumbnail":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-bf438f-thumb.webp"},{"url":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-78478d.webp","fit":{"scale":1.25,"x":74.5,"y":27.6},"thumbnail":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-78478d-thumb.webp"},{"url":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-683bea.webp","thumbnail":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-683bea-thumb.webp"}],"files":[{"name":"Louver Light.zip","url":"media/Electronics/Pixel Louver Lights/files/Louver Light.zip","description":"Printable .3mf of the 3-piece corner louver fixture. Houses 12 WS2815 pixels in 0.2 m of tape (electronics not included).","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-c86948.webp","thumbnail":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-c86948-thumb.webp","thumbnailFit":{"scale":1.4,"x":49.6,"y":44.1}}],"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Pixel Louver Light (x96)\u003c/strong>\u003cbr>\u003cem>12px • 0.2m\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x1152)\u003c/strong>\u003cbr>\u003cem>230.4m • WS2815 • RGB • 60px/m • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>BambuLabs • X1C • P1P\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ (Black)\u003c/strong>\u003cbr>\u003cem>3 piece assembly\u003c/em>\u003c/p>\u003cp>\u003cstrong>Zipties (x2)\u003c/strong>\u003cbr>\u003cem>Mini\u003c/em>\u003c/p>\u003cp>\u003cstrong>Hook-up Wire\u003c/strong>\u003cbr>\u003cem>18awg\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>CAD\u003c/strong>\u003cbr>\u003cem>SolidWorks 2022\u003c/em>\u003c/p>","related":[{"name":"Bottle shelf","url":"#project/6808"}],"video":"","timestamp":"2026-08-01T15:14:28.453Z","id":"2052","order":1,"thumbnailFit":{"scale":1.2,"x":0.4,"y":41.6},"bannerFit":{"scale":1.15,"x":0.2,"y":40.8},"thumbnail":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-ea80e4-thumb.webp","slug":"pixel-louver-lights","imageThumb":"media/Electronics/Pixel Louver Lights/Pixel-Louver-Lights-img-ea80e4-thumb.webp"},{"title":"Blackout Ceiling Tubes","category":"Lighting","image":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-75a65f.webp","thumbnailFit":{"scale":1.25,"x":58.5,"y":64.3},"bannerFit":{"scale":1.05,"x":100,"y":48.4},"description":"\u003cp>The lowest point of an HVAC duct set the height of the whole rig. Black diffusion on black paint keeps it invisible until dinner service.\u003c/p>","longDescription":"\u003cp>A central HVAC duct and a low mezzanine ceiling had already killed a previous lighting concept. I took the lowest point of that duct as a hard clearance limit and shot a laser level across the room. We hung a flat array of blackout pixel tubes. Standard milky white LED diffusion looks cheap when powered off. I used black diffusion against dark ceiling paint so the rig would visually disappear during the day.\u003c/p>\u003cp>We assembled the five-meter tubes on the floor. A friend helped me lift them onto two six-foot ladders, stringing them up and leveling them a few inches at a time. I originally ran wire inside the casing for power injection at the far end, but it drooped and cast shadows. I ripped the extra wiring out. The strips ran full white from a single end with zero color shift. Black diffusion eats light, but pixel rigs are usually too bright anyway. The physical dimming was exactly what we wanted.\u003c/p>\u003cp>Silent operation meant no fanned power supplies. I split eighteen waterproof units across three circuits. Booting them at once tripped the breakers instantly from inrush current. I wired generic relay PCBs into custom sequencer boxes to stagger the startup by five seconds. The hardware vanishes into the ceiling by afternoon, washes the tables in warm white for dinner, and runs heavy chases when the dance floor opens. The only repair since has been one strip with a single pixel stuck on.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Lighting Design","Pixel Mapping","Madrix","ELM","Capture","Custom Fabrication"],"gallery":[{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-75a65f.webp","fit":{"scale":1,"x":50,"y":68.7},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-75a65f-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-782511.webp","fit":{"scale":1,"x":48.6,"y":69.4},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-782511-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-d48bab.mp4","fit":{"scale":1.35,"x":100,"y":56},"poster":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-d48bab-poster.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-d48bab-poster-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-18c934.mp4","fit":{"scale":1.15,"x":0.2,"y":73.8},"poster":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-18c934-poster.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-18c934-poster-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-8229ba.mp4","fit":{"scale":1.15,"x":99.7,"y":60.6},"poster":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-8229ba-poster.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-8229ba-poster-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-d87b21.mp4","fit":{"scale":1,"x":47.9,"y":72.7},"poster":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-d87b21-poster.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-d87b21-poster-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-d37298.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-d37298-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-13e2c3.webp","fit":{"scale":1.35,"x":0,"y":70.8},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-13e2c3-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-71863a.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-71863a-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-7bdce1.webp","fit":{"scale":1.2,"x":100,"y":27.6},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-7bdce1-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-7e2772.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-7e2772-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-4d6414.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-4d6414-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-0a6366.webp","fit":{"scale":1.35,"x":95.4,"y":41.5},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-0a6366-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-abcbec.mp4","fit":{"scale":1.2,"x":69.9,"y":71},"poster":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-abcbec-poster.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-vid-abcbec-poster-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-d5f785.webp","fit":{"scale":1,"x":50.9,"y":7.6},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-d5f785-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-fcd874.webp","fit":{"scale":1,"x":46.6,"y":86.3},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-fcd874-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-7aefd5.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-7aefd5-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-c8229c.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-c8229c-thumb.webp"}],"files":[],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>Short Tubes (4m) (x15)\u003c/strong>\u003cbr>\u003cem>WS2814 strip (3.9m) • blackout diffusion • RGBW (3000k) • 60/m • 20px/m • 12Vdc • 78px\u003c/em>\u003c/p>\u003cp>\u003cstrong>Mid-length Tubes (4.5m) (x14)\u003c/strong>\u003cbr>\u003cem>WS2814 strip (4.4m) • RGBW (3000k) • blackout diffusion • 60/m • 20px/m • 12Vdc • 88px\u003c/em>\u003c/p>\u003cp>\u003cstrong>Long Tubes (5m) (x7)\u003c/strong>\u003cbr>\u003cem>WS2814 strip (4.9m) • RGBW (3000k) • blackout diffusion • 60/m • 20px/m • 12Vdc • 98px\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supply (x18)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • HLG-320H-12 • 12Vdc • 22A\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x3)\u003c/strong>\u003cbr>\u003cem>Advatek • R4D-S • 12 Universe\u003c/em>\u003c/p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"PSU Sequencer","url":"#project/1430"}],"video":"","timestamp":"2026-08-01T17:08:27.719Z","id":"1612","order":1,"thumbnail":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-75a65f-thumb.webp","slug":"blackout-ceiling-tubes","imageThumb":"media/Lighting/Blackout Ceiling Tubes/Blackout-Ceiling-Tubes-img-75a65f-thumb.webp"},{"title":"LED PSU Boot Sequencer","category":"Tooling","image":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-c72086.webp","thumbnailFit":{"scale":1.4,"x":66.9,"y":46.3},"bannerFit":{"scale":1.6,"x":64.6,"y":54.8},"description":"\u003cp>Eighteen power supplies booting at once trip a breaker every time. Three boxes of relays stagger them five seconds apart.\u003c/p>","longDescription":"\u003cp>I learned about inrush current at Tracks. A large video wall I helped install kept tripping the breakers every time the room powered up, and it took a while to figure out that the power supplies were pulling a huge spike for a fraction of a second before settling down. I have read the inrush line on every spec sheet since.\u003c/p>\u003cp>So when I needed to run eighteen power supplies for the blackout ceiling tubes, I knew what to do. Pulling more electrical circuits cost too much. Instead I built three 3D-printed sequencer boxes to stagger the load. Six supplies per box. Inside, a small power supply runs a relay board as a switch bank. Packing high-voltage lines, relays, and a nest of WAGOs into a sealed case took a few printed revisions before everything fit. Every connection uses a locking connector. Indicator LEDs on the front show which outputs are live, and status lights on the back confirm AC power.\u003c/p>\u003cp>The boxes sit on the black wall just above the rafters. Flipping the main breaker starts a cascade of relay clicks across the room, and every five to ten seconds another section of ceiling wakes up as its capacitors charge. When the cascade finishes, the whole rig runs silent.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","FDM 3D Printing","Power Distribution","Rapid Prototyping","SolidWorks","Assembly Design"],"gallery":[{"url":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-c72086.webp","thumbnail":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-c72086-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-c28bf2.webp","fit":{"scale":1.3,"x":72.1,"y":79.8},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-c28bf2-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-ee6bd3.webp","fit":{"scale":1.2,"x":20.8,"y":94.4},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-ee6bd3-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-f27aac.webp","fit":{"scale":1.2,"x":14.9,"y":34.1},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-f27aac-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-7a2a25.webp","fit":{"scale":1,"x":43,"y":36.2},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-7a2a25-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-0daba7.webp","fit":{"scale":1,"x":52.7,"y":41.3},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-0daba7-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-27dc77.webp","thumbnail":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-27dc77-thumb.webp"}],"files":[],"specs":"\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>BambuLabs • X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>Black PLA+\u003c/strong>\u003cbr>\u003cem>Duramic • 1.75mm\u003c/em>\u003c/p>\u003cp>\u003cstrong>Indicators\u003c/strong>\u003cbr>\u003cem>AC power • relay board power • output power\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>SolidWorks 2022\u003c/strong>\u003c/p>","related":[{"name":"Blackout ceiling","url":"#project/1612"}],"video":"","timestamp":"2026-08-01T21:44:42.857Z","id":"1430","order":6,"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-c72086-thumb.webp","slug":"led-psu-boot-sequencer","imageThumb":"media/Fabrication/LED PSU Boot Sequencer/LED-PSU-Boot-Sequencer-img-c72086-thumb.webp"},{"title":"WiFi VIP Tables","category":"Fixtures","image":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-img-437c97.webp","description":"\u003cp>Thirty-two rotting tables, salvaged for their acrylic. The electronics live in soup containers from the kitchen.\u003c/p>","longDescription":"\u003cp>Temple SF needed 32 illuminated VIP tables, but buying new plastic during the pandemic was too expensive. We had a stack of old ones, but the heavy MDF bases had spent years soaking up spilled drinks. The black acrylic tops were chipped into sharp points, and the hardwired wash strips were dead. The acrylic itself was still good, so we stripped them down to rebuild them.\u003c/p>\u003cp>My carpenter and I routed the acrylic channels deeper for new LED strips and cut a center path for the wiring. We rounded off the sharp edges across all 32 sheets. To replace the ruined MDF, we cut plywood bases, painted them black, and bolted on metal legs. Time got tight, and my 3D printer could not produce enclosures fast enough. I grabbed a stack of plastic soup containers from the kitchen and siliconed them to the underside of each table. They housed an ESP32 decoder and a lithium-ion battery, keeping the electronics safe from spills.\u003c/p>\u003cp>The operator gathered the batteries at the end of the night to charge them at the control rack. I mapped the tables into Madrix over wireless ArtNet. Running Wi-Fi through a crowded club is a fight against RF noise, but high-gain antennas kept the signal alive. I would have chosen legs with a wider base, since the tables could tip if someone leaned hard on the edge. But they salvaged our most expensive material and survived the crowd.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Custom Fabrication","ESP32","Hand tools","Madrix","Power tools","SPI","TCP/IP","Through-Hole Soldering","Pixel Mapping","Power Distribution","Wire-to-Board Soldering","Embedded Systems","Lighting Design","Repair"],"gallery":[{"url":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-vid-d659c4.mp4","poster":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-vid-d659c4-poster.webp","thumbnail":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-vid-d659c4-poster-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-vid-912f4c.mp4","poster":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-vid-912f4c-poster.webp","thumbnail":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-vid-912f4c-poster-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-vid-878241.mp4","poster":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-vid-878241-poster.webp","thumbnail":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-vid-878241-poster-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-img-78be0b.webp"," /WiFi VIP Tables/WiFi-VIP-Tables-img-7b3c54.webp","fit":{"scale":1.1,"x":48,"y":26.8},"thumbnail":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-img-7b3c54-thumb.webp"}],"files":[],"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>VIP Tables (x32)\u003c/strong>\u003cbr>\u003cem>22px • 2.1m • WiFI • acrylic • edge lighting\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x704)\u003c/strong>\u003cbr>\u003cem>67.2m • SM16704 • 60LED/m • 20px/m • 12Vdc\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBTUION\u003c/h2>\u003cp>\u003cstrong>Battery Pack (x32)\u003c/strong>\u003cbr>\u003cem>Li-Ion • 12Vdc\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Microcontroller (x32)\u003c/strong>\u003cbr>\u003cem>ESP32\u003c/em>\u003c/p>","related":[{"name":"Immersive Dance Lighting Rig","url":"#project/1"},{"name":"Temple SF","url":"#project/8252"}],"video":"","timestamp":"2026-08-07T23:07:28.368Z","id":"496","order":2,"thumbnailFit":{"scale":1.3,"x":0,"y":30.9},"bannerFit":{"scale":1.25,"x":46.1,"y":49},"thumbnail":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-img-437c97-thumb.webp","slug":"wifi-vip-tables","imageThumb":"media/Electronics/WiFi VIP Tables/WiFi-VIP-Tables-img-437c97-thumb.webp"},{"title":"Glass VIP Wall","category":"Fixtures","image":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-c13cd6.webp","thumbnailFit":{"scale":1.35,"x":53,"y":100},"bannerFit":{"scale":1.1,"x":24.3,"y":62.6},"description":"\u003cp>Hundred-pound glass panels, walked out on suction cups, to fit a salvaged pixel grid into a five-inch gap.\u003c/p>","longDescription":"\u003cp>The glass mezzanine wall needed a pixel grid sized to the panel, and no such thing exists to buy. I built this one from salvaged parts. I found boxes of 24V waterproof LED strips buried under some stairs during lockdown. It was thousands of dollars of high-end product meant to replace a single dead strand. I gathered enough leftover Madrix Nebula decoders and power supplies to build a proper installation.\u003c/p>\u003cp>The glass panels weighed 100 pounds each. I bought industrial suction cups, got them over the lip, and walked them out by the corners to expose a five-inch working gap. I shot a laser level across the wall to set the rigid track, calculated the physical length of a single pixel, and set the vertical spacing to match exactly.\u003c/p>\u003cp>Voltage drop over a 20-meter run is inevitable. When I ran all channels at full white, the far end tinted red. I countered this by running an 18AWG power injection wire to the opposite end, tying the DC ( - ) lines together across the power supplies behind the last panel. The wall mapped cleanly, but it hit an operational reality. The venue never fixed the house lighting in that area, making our grid the primary light source for VIP. When the dancefloor hit a master blackout, the lounge plunged into pitch black. We had to isolate the mezzanine to ignore blackouts entirely so people could see their drinks.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Hand tools","Madrix","Pixel Mapping","Power Distribution","Power tools","TCP/IP","SPI","Wire-to-Board Soldering","Lighting Design"],"gallery":[{"url":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-vid-d80dc7.mp4","fit":{"scale":1.3,"x":18.8,"y":100},"poster":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-vid-d80dc7-poster.webp","thumbnail":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-vid-d80dc7-poster-thumb.webp"},{"url":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-vid-11c172.mp4","fit":{"scale":1.15,"x":92.2,"y":95.6},"poster":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-vid-11c172-poster.webp","thumbnail":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-vid-11c172-poster-thumb.webp"},{"url":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-vid-1c3485.mp4","fit":{"scale":1.35,"x":0.1,"y" ,"x":0,"y":45.1},"thumbnail":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-afa7fb-thumb.webp"},{"url":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-157fa3.webp","fit":{"scale":1.1,"x":0,"y":48.8},"thumbnail":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-157fa3-thumb.webp"},{"url":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-e9513b.webp","fit":{"scale":1.2,"x":0,"y":68.8},"thumbnail":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-e9513b-thumb.webp"},{"url":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-2352c7.webp","fit":{"scale":1.15,"x":1.9,"y":59.7},"thumbnail":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-2352c7-thumb.webp"}],"files":[],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x1638)\u003c/strong>\u003cbr>\u003cem>Environmental Lights • strips • RGB • 24v • 7px/m\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x12)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • HLG-240H-24 • 24Vdc\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x2)\u003c/strong>\u003cbr>\u003cem>Madrix • Nebula\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Temple SF","url":"#project/8252"},{"name":"Immersive Dance Lighting Rig","url":"#project/1"}],"video":"","timestamp":"2026-08-08T00:49:03.114Z","id":"8983","order":8,"thumbnail":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-c13cd6-thumb.webp","slug":"glass-vip-wall","imageThumb":"media/Electronics/Glass VIP Wall/Glass-VIP-Wall-img-c13cd6-thumb.webp"},{"title":"Pixel Rocks","category":"Art","image":"media/Art/Pixel Rocks/Pixel-Rocks-img-99f168.webp","description":"\u003cp>The director wanted hand-held props that looked sharp enough to stone someone, but glowed from the inside.\u003c/p>","longDescription":"\u003cp>A lighting designer friend needed internally lit rocks for a contemporary ballet. The artistic director wanted them sharp and jagged. They had to look like they could stone someone to death, but fit in one hand.\u003c/p>\u003cp>I hiked outside Denver and collected stones that fit the aesthetic and my 3D scanner. Scanning them let me scale the models up to the size of about a pineapple. I modeled a universal sled that locked into the base of any rock. A custom puck slid inside, holding the battery, the decoder, and the pixel tape. During the run, the live network choked the 2.4GHz decoders, causing some units to freeze on stage. I never used 2.4GHz for show control again.\u003c/p>\u003cp>The design worked because every part of it was modular. I printed the clear PLA shells at five percent infill to keep the brightness high, and built the internal hardware to slide out with a single threaded cap.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Blender","Custom Fabrication","FDM 3D Printing","Pixel Mapping","Rapid Prototyping","SPI","WLED","TCP/IP","ELM","3D Scanning","Lighting Design","Wire-to-Board Soldering","Power Distribution"],"gallery":[{"url":"media/Art/Pixel Rocks/Pixel-Rocks-vid-126441.mp4","fit":{"scale":1.25,"x":7.2,"y":46.4},"poster":"media/Art/Pixel Rocks/Pixel-Rocks-vid-126441-poster.webp","thumbnail":"media/Art/Pixel Rocks/Pixel-Rocks-vid-126441-poster-thumb.webp"},{"url":"media/Art/Pixel Rocks/Pixel-Rocks-vid-32dfd8.mp4","fit":{"scale":1.3,"x":3.5,"y":48.9},"poster":"media/Art/Pixel Rocks/Pixel-Rocks-vid-32dfd8-poster.webp","thumbnail":"media/Art/Pixel Rocks/Pixel-Rocks-vid-32dfd8-poster-thumb.webp"},{"url":"media/Art/Pixel Rocks/Pixel-Rocks-vid-1e5184.mp4","fit":{"scale":1.3,"x":0,"y":51.6},"poster":"media/Art/Pixel Rocks/Pixel-Rocks-vid-1e5184-poster.webp","thumbnail":"media/Art/Pixel Rocks/Pixel-Rocks-vid-1e5184-poster-thumb.webp"},{"url":"media/Art/Pixel Rocks/Pixel-Rocks-vid-353522.mp4","fit":{"scale":1,"x":48.6,"y":59.8},"poster":"media/ 3c/h2>\u003cp>\u003cstrong>Battery (x1)\u003c/strong>\u003cbr>\u003cem>Li-Ion • 12Vdc • 24000mAh\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>PLA+ (white)\u003c/strong>\u003cbr>\u003cem>puck • 15% infill\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ (clear)\u003c/strong>\u003cbr>\u003cem>sled • rocks • 5% infill\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Harvested Athom PCB • WLED • 12Vdc\u003c/em>\u003c/p>","related":[],"video":"","timestamp":"2026-08-08T15:03:36.390Z","id":"6179","order":3,"thumbnailFit":{"scale":1.1,"x":96.9,"y":52.3},"bannerFit":{"scale":1.1,"x":100,"y":51.1},"thumbnail":"media/Art/Pixel Rocks/Pixel-Rocks-img-99f168-thumb.webp","slug":"pixel-rocks","imageThumb":"media/Art/Pixel Rocks/Pixel-Rocks-img-99f168-thumb.webp"},{"title":"Backboard","category":"Fixtures","image":"media/Electronics/Backboard/Backboard-img-3d24c3.webp","thumbnailFit":{"scale":1,"x":30.2,"y":66.7},"bannerFit":{"scale":1,"x":76.6,"y":69.3},"description":"\u003cp>Three days on an extension ladder, pulling thirty-pound plywood panels off a wall that was actively melting.\u003c/p>","longDescription":"\u003cp>Cost was the absolute bottom line on the swept backwall, which ruled out new LED pixel panels before I even priced them. The existing rig was built from thirty-pound plywood panels carrying pixel modules, and I had to salvage it. I pushed all channels to full intensity to see what I was dealing with. It was an active fire hazard. Severed cables were shorting against the metal frame and melting. The previous installer misunderstood load calculations and wire gauges.\u003c/p>\u003cp>I ripped out the bad distribution. Getting to the hardware was worse than the electrical work. The wall curved into a sloped ceiling directly above the DJ booth. I spent three days perched twenty feet up an extension ladder footed on a concrete access ramp. Leaning backward against the curve, I pulled the heavy wood panels. The edges shifted and chipped every time a board came down. We pinched a wire replacing one of them and had to drop it a second time to fix the mistake.\u003c/p>\u003cp>I installed fused DC protection and ran fresh wire to the injection points. I mapped the data runs and swapped the dead modules. I calculated the new hardware so a full software output would only draw an eighty percent physical load. The old pixel wiring was thin and brittle, but tearing the entire system out would have doubled the timeline. The repaired panels went back up the ladder and survived the curved frame.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Hand tools","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Repair"],"gallery":[{"url":"media/Electronics/Backboard/Backboard-vid-07fe80.mp4","fit":{"scale":1.4,"x":18.4,"y":40.5},"poster":"media/Electronics/Backboard/Backboard-vid-07fe80-poster.webp","thumbnail":"media/Electronics/Backboard/Backboard-vid-07fe80-poster-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-3d24c3.webp","fit":{"scale":1,"x":47.7,"y":80.5},"thumbnail":"media/Electronics/Backboard/Backboard-img-3d24c3-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-03eb99.webp","fit":{"scale":1.4,"x":68.6,"y":92.4},"thumbnail":"media/Electronics/Backboard/Backboard-img-03eb99-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-5a93de.webp","fit":{"scale":1.05,"x":89.8,"y":78.7},"thumbnail":"media/Electronics/Backboard/Backboard-img-5a93de-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-f81d34.webp","fit":{"scale":1.15,"x":100,"y":33.2},"thumbnail":"media/Electronics/Backboard/Backboard-img-f81d34-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-f9a5c6.webp","fit":{"scale":1.2,"x":38.8,"y":48.1},"thumbnail":"media/Electronics/Backboard/Backboard-img-f9a5c6-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-df83b9.webp","fit":{"scale":1.25,"x":61.4,"y":70.8},"thumbnail":"media/Electronics/Backboard/Backboard-img-df83b9-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-a0e9a1.webp","fit":{"scale":1.15,"x":8.5,"y":56.9},"thumbnail":"media/Electronics/Backboard/Backboard-img-a0e9a1-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-fb329d.webp","fit":{"scale":1,"x":50,"y":57},"thumbnail":"media/Electronics/Backboard/Backboard-img-fb329d-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-7a4513.webp","fit":{"scale":1.45,"x":54.7,"y":72.4},"thumbnail":"media/Electronics/Backboard/Backboard-img-7a4513-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-52aeb6.webp","fit":{"scale":1.25,"x":69.6,"y":13.4},"thumbnail":"media/Electronics/Backboard/Backboard-img-52aeb6-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-017469.webp","fit":{"scale":1.5,"x":89.9,"y":52.8},"thumbnail":"media/Electronics/Backboard/Backboard-img-017469-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-fd7737.webp","fit":{"scale":1.4,"x":99.7,"y":41.3},"thumbnail":"media/Electronics/Backboard/Backboard-img-fd7737-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-1e87da.webp","fit":{"scale":1.2,"x":0,"y":58.1},"thumbnail":"media/Electronics/Backboard/Backboard-img-1e87da-thumb.webp"},{"url":"media/Electronics/Backboard/Backboard-img-f5a8e9.webp","fit":{"scale":1.1,"x":47.5,"y":62.3},"thumbnail":"media/Electronics/Backboard/Backboard-img-f5a8e9-thumb.webp"}],"files":[],"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Pixel Backboard\u003c/strong>\u003cbr>\u003cem>36 x 40 pixel matrix\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x1440)\u003c/strong>\u003cbr>\u003cem>WS2801 • 12v\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x2)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • 12Vdc • 22A\u003c/em>\u003c/p>\u003cp>\u003cstrong>LED Decoder (x2)\u003c/strong>\u003cbr>\u003cem>Madrix • Nebula\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Temple Denver","url":"#project/4382"}],"video":"","timestamp":"2026-08-08T18:29:33.775Z","id":"3965","order":11,"thumbnail":"media/Electronics/Backboard/Backboard-img-3d24c3-thumb.webp","slug":"backboard","imageThumb":"media/Electronics/Backboard/Backboard-img-3d24c3-thumb.webp"},{"title":"Entrance Hall","category":"Fixtures","image":"media/Electronics/Entrance Hall/Entrance-Hall-img-709dac.webp","description":"\u003cp>A dead thirty-foot LED tunnel, gutted to raw copper and rebuilt inside walls that were glued shut.\u003c/p>","longDescription":"\u003cp>A 30-foot LED tunnel woven through sheet metal and MDF does not have a replacement part number. The original entrance at Temple Denver was a rush job that slowly died. It was never meant to be serviced. Patching a failing rig is a waste of time, so I gutted the entire run down to the raw pixel strips.\u003c/p>\u003cp>Mid-week gave me a two-day window while the club was closed. Getting the walls open was a pain. I found hidden shims and double-sided tape holding the 3/4-inch panels together. My first plan was to pull the aluminum extrusions, but construction adhesive held them fast. I left the tracks in place and removed the old solder to get clean copper. I wired the data chain fresh and rebuilt the power distribution from the ground up. I balanced the load across two 24-volt power supplies above the ceiling. I tied the DC negative lines together to keep the data stable.\u003c/p>\u003cp>If I had built the hallway from scratch, I would have made proper access panels. Instead, I routed the new wires in a repeatable pattern and drove actual screws into the MDF so the walls could be opened later. The rebuilt rig lit the full run perfectly, surviving a heavy enclosure that was originally glued shut.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Hand tools","Madrix","Pixel Mapping","Power Distribution","SPI","TCP/IP","Repair","Power tools","Wire-to-Board Soldering"],"gallery":[{"url":"media/Electronics/Entrance Hall/Entrance-Hall-vid-474244.mp4","fit":{"scale":1,"x":51.8,"y":43},"poster":"media/Electronics/Entrance Hall/Entrance-Hall-vid-474244-poster.webp","thumbnail":"media/Electronics/Entrance Hall/Entrance-Hall-vid-474244-poster-thumb.webp"},{"url":"media/Electronics/Entrance Hall/Entrance-Hall-vid-1ccf0c.mp4","fit":{"scale":1,"x":58.4,"y":37.5},"poster":"media/Electronics/Entrance Hall/Entrance-Hall-vid-1ccf0c-poster.webp","thumbnail":"media/Electronics/Entrance Hall/Entrance-Hall-vid-1ccf0c-poster-thumb.webp"},{"url":"media/Electronics/Entrance Hall/Entrance-Hall-img-94c47d.webp","fit":{"scale":1.15,"x":50.6,"y":38.6},"thumbnail":"media/Electronics/Entrance Hall/Entrance-Hall-img-94c47d-thumb.webp"},{"url":"media/Electronics/Entrance Hall/Entrance-Hall-img-cde927.webp","fit":{"scale":1.65,"x":46.1,"y":3.7},"thumbnail":"media/Electronics/Entrance Hall/Entrance-Hall-img-cde927-thumb.webp"},{"url":"media/Electronics/Entrance Hall/Entrance-Hall-img-5d33df.webp","fit":{"scale":1.2,"x":99.7,"y":21},"thumbnail":"media/Electronics/Entrance Hall/Entrance-Hall-img-5d33df-thumb.webp"},{"url":"media/Electronics/Entrance Hall/Entrance-Hall-vid-694be9.mp4","fit":{"scale":1,"x":47.5,"y":100},"poster":"media/Electronics/Entrance Hall/Entrance-Hall-vid-694be9-poster.webp","thumbnail":"media/Electronics/Entrance Hall/Entrance-Hall-vid-694be9-poster-thumb.webp"}],"files":[],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x1017)\u003c/strong>\u003cbr>\u003cem>Environmental Lights • strips • RGB • 24v • 7px/m\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x2)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • 24Vdc\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Madrix • Nebula\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Temple Denver","url":"#project/4382"}],"video":"","timestamp":"2026-08-08T20:07:41.799Z","id":"5650","order":9,"thumbnailFit":{"scale":1,"x":50,"y":46.5},"bannerFit":{"scale":1,"x":49.1,"y":48.6},"thumbnail":"media/Electronics/Entrance Hall/Entrance-Hall-img-709dac-thumb.webp","slug":"entrance-hall","imageThumb":"media/Electronics/Entrance Hall/Entrance-Hall-img-709dac-thumb.webp"},{"title":"Discobasket","category":"Fixtures","image":"media/Electronics/Discobasket/Discobasket-img-f76af9.webp","thumbnailFit":{"scale":1.15,"x":32.3,"y":44.1},"bannerFit":{"scale":1.1,"x":25.3,"y":40.3},"description":"\u003cp>Six people dancing inside a metal cage will grab whatever is in reach. Aluminum-backed strips, hose clamps buried in hot glue, no sharp edges.\u003c/p>","longDescription":"\u003cp>I had to design an LED strip that survives a crowd grabbing it all night without someone slicing their hands. I added armored pixel sticks to a metal basket for a dance platform in the middle of a nightclub floor.\u003c/p>\u003cp>I heatshrunk the strips to aluminum sticks. I secured them to the cage spokes with hose clamps and buried the hardware in hot glue. I built the basket in halves to fit it through the garage doors across the alley. I programmed the pixel map while it sat in pieces. Data hit a decoder under the deck through a cheap access point bridge or a hardline cable.\u003c/p>\u003cp>The square channel base eventually chewed through the wire insulation. Pull force ripped the solder pads, taking out a couple strips at a time until I spliced new ones in. But when half a dozen people packed inside the cage to dance, the armored sticks survived the crowd.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Custom Fabrication","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering","AC/DC Load Calc","Hand tools","Lighting Design"],"gallery":[{"url":"media/Electronics/Discobasket/Discobasket-img-f76af9.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-img-f76af9-thumb.webp"},{"url":"media/Electronics/Discobasket/Discobasket-img-5e7953.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-img-5e7953-thumb.webp"},{"url":"media/Electronics/Discobasket/Discobasket-img-b3dd9d.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-img-b3dd9d-thumb.webp"},{"url":"media/Electronics/Discobasket/Discobasket-img-139248.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-img-139248-thumb.webp"},{"url":"media/Electronics/Discobasket/Discobasket-img-99c17d.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-img-99c17d-thumb.webp"},{"url":"media/Electronics/Discobasket/Discobasket-vid-a0526c.mp4","fit":{"scale":1.5,"x":48.5,"y":100},"poster":"media/Electronics/Discobasket/Discobasket-vid-a0526c-poster.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-vid-a0526c-poster-thumb.webp"},{"url":"media/Electronics/Discobasket/Discobasket-vid-4171ca.mp4","poster":"media/Electronics/Discobasket/Discobasket-vid-4171ca-poster.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-vid-4171ca-poster-thumb.webp"},{"url":"media/Electronics/Discobasket/Discobasket-img-d58b62.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-img-d58b62-thumb.webp"},{"url":"media/Electronics/Discobasket/Discobasket-img-a297ba.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-img-a297ba-thumb.webp"},{"url":"media/Electronics/Discobasket/Discobasket-img-c0cc5c.webp","thumbnail":"media/Electronics/Discobasket/Discobasket-img-c0cc5c-thumb.webp"}],"files":[],"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>LED Strips (x26)\u003c/strong>\u003cbr>\u003cem>28px • 0.94m • white heat shrink diffusion\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x728)\u003c/strong>\u003cbr>\u003cem>24.3m • WS2812B • 30LED/m • 30px/m • 5Vdc\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBTUION\u003c/h2>\u003cp>\u003cstrong>Power Supply (x1)\u003c/strong>\u003cbr>\u003cem>5Vdc\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>SanDevice E682\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Madrix 3.6\u003c/strong>\u003c/p>","related":[{"name":"Tracks Danceclub","url":"#project/3671"}],"video":"","timestamp":"2026-08-08T20:42:07.206Z","id":"4903","order":12,"thumbnail":"media/Electronics/Discobasket/Discobasket-img-f76af9-thumb.webp","slug":"discobasket","imageThumb":"media/Electronics/Discobasket/Discobasket-img-f76af9-thumb.webp"},{"title":"Pyramid Steps","category":"Lighting","image":"media/Lighting/Pyramid Steps/Pyramid-Steps-img-74a78f.webp","thumbnailFit":{"scale":1.25,"x":33.4,"y":25.9},"bannerFit":{"scale":1.3,"x":54.2,"y":21.5},"description":"\u003cp>Fixing the voltage drop meant sitting on a twelve-foot ledge over the tile with a battery-powered soldering iron.\u003c/p>","longDescription":"\u003cp>The decorative pyramid above the kitchen sat twelve feet over the dining room tile. I wanted to wash the steps with pixel tape. Guests taking the stairs to the second floor had a clear view down the side. I refused to let the hardware show during the day, but it needed enough throw for a clean wash. I mounted 45-degree aluminum extrusions under the lip of each step. To make the track disappear, I pulled a paint match with a digital sensor, printed custom jigs, and sprayed the metal in batches.\u003c/p>\u003cp>The layout wrapped two sides of the pyramid. I tucked fanless power supplies in the corner, wired to receivers on the main rack. Firing it up revealed a voltage drop. The bottom steps shifted color. Fixing it meant adding power injection at the far ends. I sat on the twelve-foot edge, splicing wire over the tile floor with a battery-powered iron. I bundled the new lines in black wire wrap, leaving a clean arc at every corner.\u003c/p>\u003cp>The painted track vanished during the day. At night, the steady voltage let the server push smooth, flowing shapes across the steps. The top of the kitchen rolled with slow waves, and on certain patterns, the pyramid looked like it was on fire.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-949217.mp4","fit":{"scale":1.5,"x":16.2,"y":35},"poster":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-949217-poster.webp","thumbnail":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-949217-poster-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-214122.mp4","poster":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-214122-poster.webp","thumbnail":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-214122-poster-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-11cfb1.mp4","poster":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-11cfb1-poster.webp","thumbnail":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-11cfb1-poster-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/Pyramid-Steps-img-74a78f.webp","thumbnail":"media/Lighting/Pyramid Steps/Pyramid-Steps-img-74a78f-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/Pyramid-Steps-img-7d5d5a.webp","thumbnail":"media/Lighting/Pyramid Steps/Pyramid-Steps-img-7d5d5a-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/Pyramid-Steps-vid-aceba4.mp4","fit":{"scale":1.2,"x":100,"y":42},"pos 5.x\u003c/em>\u003c/p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"}],"video":"","timestamp":"2026-08-09T12:31:15.774Z","id":"1088","order":7,"thumbnail":"media/Lighting/Pyramid Steps/Pyramid-Steps-img-74a78f-thumb.webp","slug":"pyramid-steps","imageThumb":"media/Lighting/Pyramid Steps/Pyramid-Steps-img-74a78f-thumb.webp"},{"title":"Tracks Discotheque","category":"Lighting","image":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-c69f0b.webp","description":"\u003cp>Twenty-six vintage scanners surrounding the crowd, kept alive by cannibalizing dead units in the basement shop.\u003c/p>","longDescription":"\u003cp>Tracks was one of the last classic discotheques left in the country. The design rule was simple: surround the crowd, and keep the focus off the DJ booth. To put the audience directly inside the show, I stacked 26 vintage scanners across three layers in the ceiling. Twelve Trackspot 1s circled the dance floor. Eight Trackspot 2s flanked the sides in straight lines, and six Martin MX10s hung in tilted triangles overhead. I mixed them with pinspots, mirror balls, DataFlash strobes, and modern LEDs, all run from an old GrandMA Light Gen 1 console. Its motorized faders and audio BPM detection were exactly what the room needed.\u003c/p>\u003cp>For an unconventional layer, I built a dynamic truss warmer. I took leftover raw pixel PCBs from the Lobby Wall install, stuck adhesive zip-tie mounts to the back, and strapped them to the bottom pipe of the triangular truss. I aimed them straight up. The point was to illuminate the metal, not light the crowd. If I pointed them down, the bare diodes would sit directly in the patrons' line of sight.\u003c/p>\u003cp>The contrast between the hardware defined the look. Modern moving heads provided the brightness, but the 90s/2000's scanners were incredibly fast and locked onto a beat. The problem was keeping them alive. Stepper motor brakes failed. Scanners would start stuttering during slow movements and lose their tracking. The circuit boards were at least a decade obsolete, so we cannibalized dead units in the basement shop, replacing blown capacitors and motor drive chips to keep the rig running.\u003c/p>\u003cp>I expect a programmed sequence to look the same every time I recall it. With vintage mechanics, that was a constant fight. When a scanner lost its position mid-show, I would drop its intensity to zero and intentionally slam the mirror into its hard stops to force it back into alignment. When the room was packed and the console locked onto the beat, the sheer speed of those old scanners firing overhead proved why the classic club format worked.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Custom Fabrication","DMX","Hand tools","Lighting Design","MA","MIDI","Power Distribution","TCP/IP","SPI","Through-Hole Soldering","Repair"],"gallery":[{"url":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-32aa9e.webp","fit":{"scale":1.3,"x":36.1,"y":34.4},"thumbnail":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-32aa9e-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-b03a32.webp","fit":{"scale":1.25,"x":78.3,"y":45.4},"thumbnail":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-b03a32-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-b73e8e.webp","fit":{"scale":1.45,"x":23.3,"y":57},"thumbnail":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-b73e8e-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-5741bf.webp","fit":{"scale":1.35,"x":54.5,"y":16.8},"thumbnail":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-5741bf-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-6321d3.webp","fit":{"scale":1.15,"x":66.1,"y":46.1},"thumbnail":"media/Lighting/Tracks Discotheque/Tracks-Discotheque-img-6321d3-thumb.webp"},{"url":"media/Lighting/Tracks Di eque-img-c69f0b-thumb.webp"},{"title":"Remote Fill Fog Jets","category":"Lighting","image":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-11473d.webp","thumbnailFit":{"scale":1,"x":95,"y":34.7},"bannerFit":{"scale":1,"x":48.2,"y":34.6},"description":"\u003cp>Fifty-five gallons of fluid pumped into the ceiling to fake a cryo blast. It worked. The poles got slick.\u003c/p>","longDescription":"\u003cp>After Denver cracked down on CO2 permits, securing clearance for an indoor cryo system became legally impossible. I adapted six Antari fog jets using fast dissipating fluid to simulate the massive cold blast the client wanted. With 16ft ceilings, staff couldn't reach them for manual refills. I set up a 55 gallon drum in the dressing room. Two ground pumps pushed fluid to two header tanks in the ceiling, feeding three jets each.\u003c/p>\u003cp>The 30 pound jets lacked a built in way to hang upside down. I built adjustable mounts using strut channel L-brackets and bolted them to the ceiling grid from a scissor lift. They required new dedicated circuits and remote booth switches. During the initial power up, one header tank started pouring fluid from the ceiling. A factory float valve was wired backward, signaling the pump to continue filling an overflowing tank. I sprinted to the dressing room to kill the power, then pulled the tank down for a replacement.\u003c/p>\u003cp>I patched the rig into their ChamSys console. The wash LEDs built into the jets colored the blast and sold the cryo illusion. It worked exactly as intended mechanically, but the vapor condensed on the stage poles. The steel became incredibly slick. The dancers commented, and the only remaining option was for the staff to wipe the poles down between sets.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","DMX","Hand tools","Power Distribution","ChamSys"],"gallery":[{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-vid-26cada.mp4","fit":{"scale":1,"x":50,"y":40.2},"poster":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-vid-26cada-poster.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-vid-26cada-poster-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-vid-c5f11d.mp4","fit":{"scale":1,"x":49.5,"y":30.3},"poster":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-vid-c5f11d-poster.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-vid-c5f11d-poster-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-9c8431.webp","fit":{"scale":1.2,"x":12,"y":29.1},"thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-9c8431-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-b49d72.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-b49d72-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-22a45f.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-22a45f-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-9bbfec.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-9bbfec-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-7d6903.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-7d6903-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-a239c6.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-a239c6-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-vid-9a3da8.mp4","fit":{"scale":1,"x":46.8,"y":14.8},"poster":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-vid-9a3da8-poster.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-vid-9a3da8-poster-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-323f0b.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-323f0b-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-10c18e.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-10c18e-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-90d463.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-90d463-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-5d3951.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-5d3951-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-107bc2.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-107bc2-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-f59c35.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-f59c35-thumb.webp"}],"files":[],"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Fog Jet (x6)\u003c/strong>\u003cbr>\u003cem>Antari • M7-X RGBA • 1516W • 200ml/m max\u003c/em>\u003c/p>\u003cp>\u003cstrong>Liquid Supply System (x2)\u003c/strong>\u003cbr>\u003cem>Antari • LCU-2S • 3 output\u003c/em>\u003c/p>\u003ch2>CONSUMABLES\u003c/h2>\u003cp>\u003cstrong>Fog Fluid (x1)\u003c/strong>\u003cbr>\u003cem>Antari • FLC-200 • 55gal\u003c/em>\u003c/p>","related":[],"video":"","timestamp":"2026-08-09T23:05:35.692Z","id":"6654","order":14,"thumbnail":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-11473d-thumb.webp","slug":"remote-fill-fog-jets","imageThumb":"media/Lighting/Remote Fill Fog Jets/Remote-Fill-Fog-Jets-img-11473d-thumb.webp"},{"title":"Alabaster Bar Top","category":"Lighting","image":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-e1c078.webp","description":"\u003cp>Six hours each morning to lift the stone, wire new pixels, and seal it back down before the bartenders arrived.\u003c/p>","longDescription":"\u003cp>The main bar at Que Bueno Suerte! runs the length of the dining room under vaulted ceilings. The top is solid alabaster. The original contractors wired the low-voltage LEDs using wire nuts. The connections failed, leaving dead spots across the stone. I wanted to install addressable pixels, but the venue doesn't close. I had a six-hour window each morning to finish one section before the 3 PM open.\u003c/p>\u003cp>Every day, I sliced the old adhesive and lifted a piece of stone. I stripped the dead tape, installed narrow 12-volt pixels along the edges, and sealed the alabaster down with quick-dry silicone just before the bartenders arrived. The center section was worse. A 200-pound acrylic table wrapped around a support beam. I used spreader bars to lift it, unbolted the legs, and slowly inched the acrylic onto an adjacent table so it wouldn't crack. I ran new DC wire through the sheet metal studs and hid waterproof power supplies behind the kickers.\u003c/p>\u003cp>For weeks, I locked the finished sections to a static warm white to hide the construction. When the bar finally came online, my Madrix patch wasn't wide enough for a continuous 1500-pixel sweep. I stacked the strips in Z-layers and used fluid effects with mirroring to hide the seams. The alabaster was originally meant for a uniform white. Hitting it with dynamic color created deep internal gradients across the stone.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","Repair","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-vid-1d5414.mp4","fit":{"scale":1.3,"x":48.8,"y":14.8},"poster":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-vid-1d5414-poster.webp","thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-vid-1d5414-poster-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-d5026b.webp","fit":{"scale":1,"x":53,"y":24.3},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-d5026b-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-813dd5.webp","fit":{"scale":1.45,"x":77.7,"y":41.2},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-813dd5-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-5c92de.webp","fit":{"scale":1.15,"x":100,"y":87.6},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-5c92de-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-vid-3ec781.mp4","fit":{"scale":1.15,"x":2.3,"y":35.6},"poster":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-vid-3ec781-poster.webp","thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-vid-3ec781-poster-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-4f6c09.webp","fit":{"scale":1,"x":50.2,"y":23.7},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-4f6c09-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-e39679.webp","fit":{"scale":1,"x":42.2,"y":52.3},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-e39679-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-7812dd.webp","fit":{"scale":1,"x":49.3,"y":40.5},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-7812dd-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-3e1bf7.webp","fit":{"scale":1,"x":49.5,"y":49.7},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-3e1bf7-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-760d15.webp","fit":{"scale":1,"x":49.6,"y":35.1},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-760d15-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-463912.webp","fit":{"scale":1,"x":50.4,"y":46.5},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-463912-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-53508d.webp","fit":{"scale":1.35,"x":56.4,"y":0},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-53508d-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-fc80b0.webp","fit":{"scale":1,"x":49.8,"y":37.6},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-fc80b0-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-484e77.webp","fit":{"scale":1.1,"x":31,"y":36.9},"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-484e77-thumb.webp"}],"files":[],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x3027)\u003c/strong>\u003cbr>\u003cem>25.2m • WS2811 • RGB • 3535 • 120px/m • 12Vdc\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x3)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • HLG-320H-12 • 12Vdc • 22A\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoders (x3)\u003c/strong>\u003cbr>\u003cem>Advatek • 4D-S\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Bar Kicker","url":"#project/468"},{"name":"Bar Backsplash","url":"#project/7026"},{"name":"Bar Tubes","url":"#project/4411"}],"video":"","timestamp":"2026-08-14T18:26:35.295Z","id":"9525","order":12,"thumbnail":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-e1c078-thumb.webp","thumbnailFit":{"scale":1.35,"x":0,"y":20.1},"bannerFit":{"scale":1.5,"x":0,"y":23.9},"slug":"alabaster-bar-top","imageThumb":"media/Lighting/Alabaster Bar Top/Alabaster-Bar-Top-img-e1c078-thumb.webp"},{"title":"Bar Kicker","category":"Lighting","image":"media/Lighting/Bar Kicker/Bar-Kicker-img-2250f7.webp","description":"\u003cp>Two inches of clearance behind a steel rail. The 25-pound panels came up with my toe.\u003c/p>","longDescription":"\u003cp>The original lighting behind the bar was wired like a house. Someone laid a row of white LED modules flat on the floor, hoping the light would bounce through thick amber acrylic. There were nine of these kicker panels at Que Bueno Suerte, built from plywood and weighing 25 pounds each.\u003c/p>\u003cp>I pulled them down, repaired the damaged wood, and built custom neon flex using square tube and WS2814 pixels. I siliconed the flex along the waveform cuts on the back of the acrylic and taped it until it cured.\u003c/p>\u003cp>Because I was also lighting the alabaster bar top above, I had to keep pulling the kickers back off. Getting them back in was a physical fight. I had two inches of clearance blocked by a steel rail. I wedged my heel on the rail, pried a 25-pound sheet up with my toe, and disconnected leads blind with my free hand. I dropped two panels doing this. The impact ripped the silicone right off the back. I remounted the flex with industrial tape on the fly.\u003c/p>\u003cp>When I finally powered the rig up, the physical materials dictated the programming. The amber acrylic completely ate the blue spectrum. I dropped blue from the palette entirely. I built a series of slow sweeps using only red, green, and warm white, giving the lower bar a heavy, saturated accent.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Bar Kicker/Bar-Kicker-vid-943daf.mp4","fit":{"scale":1,"x":50,"y":42.1},"poster":"media/Lighting/Bar Kicker/Bar-Kicker-vid-943daf-poster.webp","thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-vid-943daf-poster-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-vid-380e66.mp4","fit":{"scale":1.3,"x":80.2,"y":46.7},"poster":"media/Lighting/Bar Kicker/Bar-Kicker-vid-380e66-poster.webp","thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-vid-380e66-poster-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-vid-7eb4ef.mp4","fit":{"scale":1,"x":49.3,"y":50.3},"poster":"media/Lighting/Bar Kicker/Bar-Kicker-vid-7eb4ef-poster.webp","thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-vid-7eb4ef-poster-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-img-876946.webp","fit":{"scale":1,"x":50.2,"y":39.8},"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-876946-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-img-0f862b.webp","fit":{"scale":1.05,"x":50,"y":45.9},"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-0f862b-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-vid-a9dc32.mp4","fit":{"scale":1,"x":50.2,"y":62.1},"poster":"media/Lighting/Bar Kicker/Bar-Kicker-vid-a9dc32-poster.webp","thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-vid-a9dc32-poster-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-img-f5507c.webp","fit":{"scale":1,"x":50.2,"y":31.9},"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-f5507c-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-vid-dcfd93.mp4","fit":{"scale":1,"x":49.5,"y":62.7},"poster":"media/Lighting/Bar Kicker/Bar-Kicker-vid-dcfd93-poster.webp","thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-vid-dcfd93-poster-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-img-8b6df4.webp","fit":{"scale":1,"x":49.1,"y":35.4},"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-8b6df4-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-img-12581f.webp","fit":{"scale":1,"x":49.6,"y":37},"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-12581f-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-img-8d2deb.webp","fit":{"scale":1.3,"x":93.5,"y":51.1},"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-8d2deb-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-img-4040e5.webp","fit":{"scale":1,"x":50.4,"y":58.3},"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-4040e5-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-img-da25ef.webp","fit":{"scale":1.6,"x":76.7,"y":50.1},"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-da25ef-thumb.webp"},{"url":"media/Lighting/Bar Kicker/Bar-Kicker-img-1c26c4.webp","fit":{"scale":1.4,"x":66.4,"y":46.3},"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-1c26c4-thumb.webp"}],"files":[],"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Custom Neon Flex (x18)\u003c/strong>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x405)\u003c/strong>\u003cbr>\u003cem>20.25m • WS2814 • RGBW (3000k) • 20px/m • 12Vdc\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x1)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • HLG-320H-12 • 12Vdc • 22A\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Advatek • R4D-S\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Alabaster Bar Top","url":"#project/9525"},{"name":"Bar Backsplash","url":"#project/7026"},{"name":"Bar Tubes","url":"#project/4411"}],"video":"","timestamp":"2026-08-14T19:25:35.032Z","id":"468","order":13,"thumbnail":"media/Lighting/Bar Kicker/Bar-Kicker-img-2250f7-thumb.webp","thumbnailFit":{"scale":1,"x":50,"y":48.4},"bannerFit":{"scale":1,"x":50,"y":47.7},"slug":"bar-kicker","imageThumb":"media/Lighting/Bar Kicker/Bar-Kicker-img-2250f7-thumb.webp"},{"title":"Bar Backsplash","category":"Lighting","image":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-6de8fc.webp","thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-6de8fc-thumb.webp","thumbnailFit":{"scale":1,"x":57.1,"y":50.7},"bannerFit":{"scale":1,"x":0,"y":59},"description":"\u003cp>A ratchet strap anchored to the patio fence, a deadblow, and four hours of hammering a trapped LED track sideways.\u003c/p>","longDescription":"\u003cp>The bar backsplash was a massive acrylic wall extending to a vaulted ceiling. The original LEDs were one color. I needed to relight the acrylic edges and underlight three glass shelves. The wall was never meant to come apart. The shelves were mounted directly through the acrylic, trapping the bottom LED track under the panels. It was also locked down with double-sided tape. The top and side strips came out quickly. The bottom track was an eight-foot problem.\u003c/p>\u003cp>My only option was pulling it sideways. I drilled a hole through the aluminum track, hooked a ratchet strap to it, ran the strap out the door, and anchored it to a metal patio fence. I slid a piece of strut channel through the strap as a strike plate. I stood next to the bar and hit the strut with a deadblow. The track inched out bit by bit. It took four hours of hammering to clear the wall.\u003c/p>\u003cp>Assembly went faster. I skipped the adhesive and slid the new track into the gap. For the shelves, I mounted pixel tape into black channels, firing light up through the bottles. Because the shelves were bolted through the wall, I could not hide the cables. I put the wires inside black wrap and pulled them perfectly straight. If wiring sits in direct eyesight, it has to look intentional. The bright acrylic acts as a backdrop for the bartenders, tying the room together.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering","Repair"],"gallery":[{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-7fb5a9.mp4","fit":{"scale":1.1,"x":67.2,"y":61.3},"poster":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-7fb5a9-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-7fb5a9-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-eda5a4.mp4","fit":{"scale":1,"x":52.1,"y":60.6},"poster":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-eda5a4-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-eda5a4-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-9964ac.mp4","fit":{"scale":1,"x":50,"y":80.5},"poster":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-9964ac-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-9964ac-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-48f37f.mp4","fit":{"scale":1,"x":57.3,"y":19.8},"poster":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-48f37f-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-48f37f-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-da7720.mp4","fit":{"scale":1,"x":50.4,"y":31.3},"poster":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-da7720-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-vid-da7720-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-63ca52.webp","fit":{"scale":1,"x":50,"y":54.1},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-63ca52-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-9d5270.webp","fit":{"scale":1,"x":50,"y":50},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-9d5270-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-7da7f9.webp","fit":{"scale":1,"x":50,"y":54.4},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-7da7f9-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-e49f01.webp","fit":{"scale":1,"x":46.8,"y":51.1},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-e49f01-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-49db6e.webp","fit":{"scale":1,"x":46.3,"y":11.7},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-49db6e-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-ed37b5.webp","fit":{"scale":1,"x":48,"y":24.6},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-ed37b5-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-5a4754.webp","fit":{"scale":1,"x":50,"y":29},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-5a4754-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-acfee2.webp","fit":{"scale":1,"x":50.2,"y":28.7},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-acfee2-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-c404e7.webp","fit":{"scale":1,"x":0,"y":60.7},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-c404e7-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-836007.webp","fit":{"scale":1.15,"x":76.9,"y":100},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-836007-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-fea255.webp","fit":{"scale":1,"x":49.1,"y":31.6},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-fea255-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-79b197.webp","fit":{"scale":1,"x":50.2,"y":57.6},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-79b197-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-6857e7.webp","fit":{"scale":1,"x":50.9,"y":63.3},"thumbnail":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-6857e7-thumb.webp"}],"files":[],"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x418)\u003c/strong>\u003cbr>\u003cem>20.9m • WS2814 • RGBW (3000k) • 12Vdc • 60/m • 20px/m\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x2)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • HLG-320H-12 • 12Vdc • 22A\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Advatek • R4D-S\u003c/em>\u003c/p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Alabaster Bar Top","url":"#project/9525"},{"name":"Bar Kicker","url":"#project/468"},{"name":"Bar Tubes","url":"#project/4411"}],"video":"","timestamp":"2026-08-14T21:28:07.028Z","id":"7026","order":10,"slug":"bar-backsplash","imageThumb":"media/Lighting/Bar Backsplash/Bar-Backsplash-img-6de8fc-thumb.webp"},{"title":"Glow Lounge","category":"Lighting","image":"media/Lighting/Glow Lounge/Glow-Lounge-img-9fcfdb.webp","thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-img-9fcfdb-thumb.webp","thumbnailFit":{"scale":1.2,"x":33.6,"y":0},"bannerFit":{"scale":1,"x":45.4,"y":25.4},"description":"\u003cp>Three UV panels painted by a member who had passed were not coming down. The rig went around them, aimed at a mirrored torso.\u003c/p>","longDescription":"\u003cp>The ceiling at Glow Lounge was 8 feet high. Three art panels hung over the dance floor. A community member painted them with UV paint before he passed away, so they stayed put. I scrapped my plan for pixel strips to save money and pulled down the old rig. The fixtures were gross. Dust choked the fans until they stopped spinning, causing the lights to overheat and thermal cycle. I scrubbed the salvageable units and mapped a new layout around the art.\u003c/p>\u003cp>Every inch mattered. I mounted strut channels flush to the drywall and bolted them into the joists. I tucked short beam fixtures between the panels and pushed the taller lights to the edges. I bundled the cables along the channel and balanced the rig on 2 circuits. I hung new wash lights next to the DJ, but they got stuck while panning. The metal frames bent during transport and rubbed against the housing. I just bent the yokes back by hand.\u003c/p>\u003cp>A spinning torso covered in mirrors hung over the floor. I built the show on a Wolfmix WMX1 controller. I could narrow the wash fixtures into tight beams and aim them at the torso and the mirror balls. The light shot across the room just above the crowd. If a patron was exceptionally tall, they would likely get hit in the face. The scattered reflection filled the room. It felt compact and balanced.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Lighting Design","DMX","Power Distribution","Power tools","Repair"],"gallery":[{"url":"media/Lighting/Glow Lounge/Glow-Lounge-vid-b4f86b.mp4","fit":{"scale":1.3,"x":48.3,"y":0.2},"poster":"media/Lighting/Glow Lounge/Glow-Lounge-vid-b4f86b-poster.webp","thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-vid-b4f86b-poster-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-vid-9933e6.mp4","fit":{"scale":1.4,"x":40.8,"y":12.4},"poster":"media/Lighting/Glow Lounge/Glow-Lounge-vid-9933e6-poster.webp","thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-vid-9933e6-poster-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-vid-430928.mp4","fit":{"scale":1.3,"x":22.2,"y":30.7},"poster":"media/Lighting/Glow Lounge/Glow-Lounge-vid-430928-poster.webp","thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-vid-430928-poster-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-vid-af5348.mp4","fit":{"scale":2,"x":45.2,"y":28.7},"poster":"media/Lighting/Glow Lounge/Glow-Lounge-vid-af5348-poster.webp","thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-vid-af5348-poster-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-vid-3a1612.mp4","poster":"media/Lighting/Glow Lounge/Glow-Lounge-vid-3a1612-poster.webp","thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-vid-3a1612-poster-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-img-d6cf5c.webp","fit":{"scale":1.25,"x":33.6,"y":64.8},"thumbnail":"media/Lighting/Glow Lounge/Glow-Lounge-img-d6cf5c-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Glow-Lounge-img-cd25e7
