Glass VIP Wall/frame-thumb-1786198917895.webp","thumbnail":"media/Lighting/Glass VIP Wall/frame-thumb-1786198917895-thumb.webp"},{"url":"media/Lighting/Glass VIP Wall/20210123_121514.webp","fit":{"scale":1.1,"x":95,"y":55.8},"thumbnail":"media/Lighting/Glass VIP Wall/20210123_121514-thumb.webp"},{"url":"media/Lighting/Glass VIP Wall/20210120_160957.webp","fit":{"scale":1.3,"x":0,"y":45.1},"thumbnail":"media/Lighting/Glass VIP Wall/20210120_160957-thumb.webp"},{"url":"media/Lighting/Glass VIP Wall/20210120_161033.webp","fit":{"scale":1.1,"x":0,"y":48.8},"thumbnail":"media/Lighting/Glass VIP Wall/20210120_161033-thumb.webp"},{"url":"media/Lighting/Glass VIP Wall/20210120_133758.webp","fit":{"scale":1.2,"x":0,"y":68.8},"thumbnail":"media/Lighting/Glass VIP Wall/20210120_133758-thumb.webp"},{"url":"media/Lighting/Glass VIP Wall/20200918_194722.webp","fit":{"scale":1.15,"x":1.9,"y":59.7},"thumbnail":"media/Lighting/Glass VIP Wall/20200918_194722-thumb.webp"}],"files":[],"specs":"<p><strong>Control:</strong> Madrix 5.x</p><p><strong>Fixtures:</strong> (12) 19m</p><p><strong>LED: </strong>5050 RGB</p><p><strong>Pixel Driver:</strong> WS2811</p><p><strong>Pixel Size: </strong>7 LEDs</p><p><strong>LED Spacing: </strong>70/m</p><p><strong>Pixel Voltage: </strong>24vdc</p><p><strong>Decoder: </strong>(2) Madrix Nebula</p><p><strong>Power:</strong> (12) MEAN WELL HLG-240H-24</p>","related":[{"name":"Temple SF","url":"#project/8252"},{"name":"Immersive Dance Lighting Rig","url":"#project/1"}],"video":"","timestamp":"2026-08-08T00:49:03.114Z","id":"8983","order":12,"thumbnail":"media/Lighting/Glass VIP Wall/Screenshot 2026-08-07 204525-thumb.webp"},{"title":"Pixel Rocks","category":"Sculpture","image":"media/Art/Pixel Rocks/Screenshot 2026-08-08 133451.webp","description":"<p>10 wirelessly controlled, 3D printed LED rocks built from topographical scans for a contemporary ballet piece.</p>","longDescription":"<p>My good friend, mentor, and lighting designer for LINES ballet needed internally lit rocks controlled wirelessly from the console. The artistic director rejected my initial hand sculpted models. He wanted them sharp and jagged. They needed to look like they were meant to stone someone to death, but remain small enough to hold in one hand. I hiked outside Denver and collected 30 small stones that fit the aesthetic and my 3D scanner turntable. Working in a digital format let me scale the scans up to the size of about a pineapple. I printed 10 final shells in clear PLA+ at 5% infill. The hollow space kept the LED brightness high. The ballet company handled the faux painting on site.</p><p>The internal hardware needed to be completely modular. I modeled a universal sled that inserted into the base of any rock, locked in by a threaded cap. A custom pixel puck slid into that sled. Each puck held a lithium ion battery, a charge port, a rocker switch, a disassembled ESP8266 based Athom LED decoder running WLED, and two strips of pixel tape. The completed assemblies weighed about 5 lbs.</p><p>We drove them from the light console using ELM over a wireless router. This was the last project where I relied on 2.4GHz WiFi for live show control. The network environment choked the decoders, causing some units to drop control and freeze on stage. I specify 5GHz hardware for wireless pixel control now.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Blender","Custom Fabrication","ESP8266","FDM 3D Printing","Pixel Mapping","Rapid Prototyping","SPI","WLED","TCP/IP","ELM","3D Scanning","Lighting Design","Wire-to-Board Soldering","Power Distribution"],"gallery":[{"url":"media/Art/Pixel Rocks/20240316_154826.mp4","fit":{"scale":1.25,"x":7.2,"y":46.4},"poster":"media/Art/Pixel Rocks/frame-thumb-1786204679695.webp","thumbnail":"media/Art/Pixel Rocks/frame-thumb-1786204679695-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240316_160039.mp4","fit":{"scale":1.3,"x":3.5,"y":48.9},"poster":"media/Art/Pixel Rocks/frame-thumb-1786204756843.webp","thumbnail":"media/Art/Pixel Rocks/frame-thumb-1786204756843-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240320_214804.mp4","fit":{"scale":1.3,"x":0,"y":51.6},"poster":"media/Art/Pixel Rocks/frame-thumb-1786204782132.webp","thumbnail":"media/Art/Pixel Rocks/frame-thumb-1786204782132-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240320_214516.mp4","fit":{"scale":1,"x":48.6,"y":59.8},"poster":"media/Art/Pixel Rocks/frame-thumb-1786204822452.webp","thumbnail":"media/Art/Pixel Rocks/frame-thumb-1786204822452-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240320_214611.webp","thumbnail":"media/Art/Pixel Rocks/20240320_214611-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240320_214607.webp","thumbnail":"media/Art/Pixel Rocks/20240320_214607-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240320_214603.webp","thumbnail":"media/Art/Pixel Rocks/20240320_214603-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240305_203625.webp","thumbnail":"media/Art/Pixel Rocks/20240305_203625-thumb.webp"},{"url":"media/Art/Pixel Rocks/Screenshot 2026-08-08 110901.webp","thumbnail":"media/Art/Pixel Rocks/Screenshot 2026-08-08 110901-thumb.webp"},{"url":"media/Art/Pixel Rocks/Screenshot 2026-08-08 110642.webp","thumbnail":"media/Art/Pixel Rocks/Screenshot 2026-08-08 110642-thumb.webp"},{"url":"media/Art/Pixel Rocks/Screenshot 2026-08-08 110612.webp","thumbnail":"media/Art/Pixel Rocks/Screenshot 2026-08-08 110612-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240216_154213.webp","thumbnail":"media/Art/Pixel Rocks/20240216_154213-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240216_101336.mp4","poster":"media/Art/Pixel Rocks/20240216_101336-poster.webp","thumbnail":"media/Art/Pixel Rocks/20240216_101336-poster-thumb.webp"},{"url":"media/Art/Pixel Rocks/Screenshot 2026-08-08 110851.webp","thumbnail":"media/Art/Pixel Rocks/Screenshot 2026-08-08 110851-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240308_143659.webp","thumbnail":"media/Art/Pixel Rocks/20240308_143659-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240308_143221.webp","thumbnail":"media/Art/Pixel Rocks/20240308_143221-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240216_134433.mp4","fit":{"scale":1.15,"x":36.9,"y":57},"poster":"media/Art/Pixel Rocks/frame-thumb-1786205231291.webp","thumbnail":"media/Art/Pixel Rocks/frame-thumb-1786205231291-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240308_134505.webp","thumbnail":"media/Art/Pixel Rocks/20240308_134505-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240308_134510.webp","thumbnail":"media/Art/Pixel Rocks/20240308_134510-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240308_134502.webp","thumbnail":"media/Art/Pixel Rocks/20240308_134502-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240308_134448.webp","thumbnail":"media/Art/Pixel Rocks/20240308_134448-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240308_134445.webp","thumbnail":"media/Art/Pixel Rocks/20240308_134445-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240308_134455.webp","thumbnail":"media/Art/Pixel Rocks/20240308_134455-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240308_134453.webp","thumbnail":"media/Art/Pixel Rocks/20240308_134453-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240216_095435.webp","thumbnail":"media/Art/Pixel Rocks/20240216_095435-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240212_202342.mp4","poster":"media/Art/Pixel Rocks/20240212_202342-poster.webp","thumbnail":"media/Art/Pixel Rocks/20240212_202342-poster-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240212_163804.webp","thumbnail":"media/Art/Pixel Rocks/20240212_163804-thumb.webp"},{"url":"media/Art/Pixel Rocks/20240212_120443.webp","thumbnail":"media/Art/Pixel Rocks/20240212_120443-thumb.webp"}],"files":[],"specs":"<p><strong>Medium:</strong> PLA+</p><p><strong>Color:</strong> Transparent</p><p><strong>LEDs: </strong>65 (144/m)</p><p><strong>Driver: </strong>WS2815 (RGB)</p><p><strong>Decoder:</strong> Athom ESP8266</p><p><strong>Firmware: </strong>WLED</p>","related":[],"video":"","timestamp":"2026-08-08T15:03:36.390Z","id":"6179","order":1,"thumbnailFit":{"scale":1.1,"x":96.9,"y":52.3},"bannerFit":{"scale":1.1,"x":100,"y":51.1},"thumbnail":"media/Art/Pixel Rocks/Screenshot 2026-08-08 133451-thumb.webp"},{"title":"Backboard","category":"Fixtures","image":"media/Electronics/Backboard/Gemini_Generated_Image_5l003m5l003m5l00.webp","thumbnailFit":{"scale":1,"x":30.2,"y":66.7},"bannerFit":{"scale":1,"x":76.6,"y":69.3},"description":"<p><strong>Temple Nightclub | Denver</strong> - I rebuilt a failing 36x40 resolution LED backwall at Temple Denver to eliminate an active fire hazard.</p>","longDescription":"<p>Temple Denver brought me in to fix a swept LED backwall on their main stage. I pushed 100% intensity through all channels to see where the rig stood. The 36x40 resolution wall was a fire hazard. The previous installer misunderstood load calculations and wire gauges. Severed cables were shorting against the metal frame and melting.</p><p>Getting to the hardware proved worse than the electrical work. The wall curved into a sloped ceiling directly above the DJ booth and VIP seating. I spent 3 days perched 20 ft up an extension ladder footed on a concrete access ramp. Leaning backward against the curve, I pulled and wired 30 lb plywood panels. Each 3/8 in board measured 2x4 ft and carried 20 pixel modules. We pinched a wire replacing one of them and had to drop it again for an extra repair. The wood shifts and chips every time it comes down, so I minimized removals.</p><p>I ripped out the bad distribution and installed fused DC power protection. Fresh 18awg wire went to the injection points to bypass the melted lines. I mapped the data runs and swapped the dead modules. To prevent future software-driven failures, I calculated the new hardware so a 100% software output would draw a maximum 80% physical load. The wall powered up and ran, but the existing pixel wiring was thin and brittle. Ripping the entire system out would have doubled the timeline and cost. We salvaged the existing rig, and the damage cemented my rule to mandate DC power protection on all future builds.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Hand tools","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Repair"],"gallery":[{"url":"media/Electronics/Backboard/20230209_185631.mp4","fit":{"scale":1.4,"x":18.4,"y":40.5},"poster":"media/Electronics/Backboard/frame-thumb-1786217258502.webp","thumbnail":"media/Electronics/Backboard/frame-thumb-1786217258502-thumb.webp"},{"url":"media/Electronics/Backboard/Gemini_Generated_Image_5l003m5l003m5l00.webp","fit":{"scale":1,"x":47.7,"y":80.5},"thumbnail":"media/Electronics/Backboard/Gemini_Generated_Image_5l003m5l003m5l00-thumb.webp"},{"url":"media/Electronics/Backboard/20230209_185750.webp","fit":{"scale":1.4,"x":68.6,"y":92.4},"thumbnail":"media/Electronics/Backboard/20230209_185750-thumb.webp"},{"url":"media/Electronics/Backboard/20230209_135454.webp","fit":{"scale":1.05,"x":89.8,"y":78.7},"thumbnail":"media/Electronics/Backboard/20230209_135454-thumb.webp"},{"url":"media/Electronics/Backboard/20230209_135445.webp","fit":{"scale":1.15,"x":100,"y":33.2},"thumbnail":"media/Electronics/Backboard/20230209_135445-thumb.webp"},{"url":"media/Electronics/Backboard/20230208_132228.webp","fit":{"scale":1.2,"x":38.8,"y":48.1},"thumbnail":"media/Electronics/Backboard/20230208_132228-thumb.webp"},{"url":"media/Electronics/Backboard/20230208_132233.webp","fit":{"scale":1.25,"x":61.4,"y":70.8},"thumbnail":"media/Electronics/Backboard/20230208_132233-thumb.webp"},{"url":"media/Electronics/Backboard/20230206_135253.webp","fit":{"scale":1.15,"x":8.5,"y":56.9},"thumbnail":"media/Electronics/Backboard/20230206_135253-thumb.webp"},{"url":"media/Electronics/Backboard/20230206_074645.webp","fit":{"scale":1,"x":50,"y":57},"thumbnail":"media/Electronics/Backboard/20230206_074645-thumb.webp"},{"url":"media/Electronics/Backboard/20230208_132247.webp","fit":{"scale":1.45,"x":54.7,"y":72.4},"thumbnail":"media/Electronics/Backboard/20230208_132247-thumb.webp"},{"url":"media/Electronics/Backboard/20230206_141002.webp","fit":{"scale":1.25,"x":69.6,"y":13.4},"thumbnail":"media/Electronics/Backboard/20230206_141002-thumb.webp"},{"url":"media/Electronics/Backboard/20230206_183150.webp","fit":{"scale":1.5,"x":89.9,"y":52.8},"thumbnail":"media/Electronics/Backboard/20230206_183150-thumb.webp"},{"url":"media/Electronics/Backboard/20230206_170058.webp","fit":{"scale":1.4,"x":99.7,"y":41.3},"thumbnail":"media/Electronics/Backboard/20230206_170058-thumb.webp"},{"url":"media/Electronics/Backboard/received_1746845682384426.webp","fit":{"scale":1.2,"x":0,"y":58.1},"thumbnail":"media/Electronics/Backboard/received_1746845682384426-thumb.webp"},{"url":"media/Electronics/Backboard/received_500877822236168.webp","fit":{"scale":1.1,"x":47.5,"y":62.3},"thumbnail":"media/Electronics/Backboard/received_500877822236168-thumb.webp"}],"files":[],"specs":"<p><strong>Software:</strong> Madrix 5.x</p><p><strong>Pixels:</strong> 36x40</p><p><strong>Voltage:</strong> 12VDC</p>","related":[{"name":"Temple Denver","url":"#project/4382"}],"video":"","timestamp":"2026-08-08T18:29:33.775Z","id":"3965","order":4,"thumbnail":"media/Electronics/Backboard/Gemini_Generated_Image_5l003m5l003m5l00-thumb.webp"},{"title":"Entrance Hall","category":"Fixtures","image":"media/Electronics/Entrance Hall/VID_20190706_212708-poster.webp","description":"<p><strong>Temple Nightclub | Denver</strong> - I gutted and rebuilt a failing 30 ft LED entrance tunnel down to raw pixel strips to fix a rushed installation.</p>","longDescription":"<p>The entrance tunnel at Temple Denver was a rush job that slowly died. It was 30 ft long and never meant to be serviced. The walls were framed with 3/4 in MDF panels, which are incredibly heavy, and wires were woven haphazardly through sheet metal cutouts. Patching a failing custom LED installation is a waste of time. I decided to gut the entire run down to the pixel strips.</p><p>Mid-week gave me a 2 day window while the club was closed. Getting the tunnel open was a giant pain. I found hidden shims and adhesives in unexpected places. Pulling the aluminum extrusions was my first plan, but construction adhesive held them fast. I left the tracks in place. Removing the old soldering left me with clean copper to wire fresh. Rebuilding the power distribution from the ground up, I balanced the load across a couple 24V power supplies above the ceiling. I tied the DC- lines together to keep the data stable. Reassembling the heavy MDF meant driving screws into panels that were originally held together by double-sided tape.</p><p>My eye instantly snaps to any pixel that drops a color or gets stuck. I can spot a dead point in a data chain by instinct. Powering up the rebuilt rig lit the entire 30 ft run perfectly. Seeing a complex pixel setup firing at 100 percent is always deeply satisfying.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Hand tools","Madrix","Pixel Mapping","Power Distribution","SPI","TCP/IP","Repair","Power tools","Wire-to-Board Soldering"],"gallery":[{"url":"media/Electronics/Entrance Hall/VID_20190706_212708.mp4","fit":{"scale":1,"x":51.8,"y":43},"poster":"media/Electronics/Entrance Hall/frame-thumb-1786220301706.webp","thumbnail":"media/Electronics/Entrance Hall/frame-thumb-1786220301706-thumb.webp"},{"url":"media/Electronics/Entrance Hall/VID_20191113_153132~2.mp4","fit":{"scale":1,"x":58.4,"y":37.5},"poster":"media/Electronics/Entrance Hall/frame-thumb-1786228072983.webp","thumbnail":"media/Electronics/Entrance Hall/frame-thumb-1786228072983-thumb.webp"},{"url":"media/Electronics/Entrance Hall/IMG_20190701_235151.webp","fit":{"scale":1.15,"x":50.6,"y":38.6},"thumbnail":"media/Electronics/Entrance Hall/IMG_20190701_235151-thumb.webp"},{"url":"media/Electronics/Entrance Hall/IMG_20190701_213937.webp","fit":{"scale":1.65,"x":46.1,"y":3.7},"thumbnail":"media/Electronics/Entrance Hall/IMG_20190701_213937-thumb.webp"},{"url":"media/Electronics/Entrance Hall/IMG_20190701_182349.webp","fit":{"scale":1.2,"x":99.7,"y":21},"thumbnail":"media/Electronics/Entrance Hall/IMG_20190701_182349-thumb.webp"},{"url":"media/Electronics/Entrance Hall/VID_20180515_142329.mp4","fit":{"scale":1,"x":47.5,"y":100},"poster":"media/Electronics/Entrance Hall/frame-thumb-1786228003573.webp","thumbnail":"media/Electronics/Entrance Hall/frame-thumb-1786228003573-thumb.webp"}],"files":[],"specs":"<p><strong>Strip:</strong> EnvironmentalLighting pixel tape (salvaged)</p><p><strong>Voltage:</strong> 24vdc</p><p><strong>Runs:</strong> 13 strip runs</p><p><strong>Protocol:</strong> ArtNet</p><p><strong>Control:</strong> Madrix 5.x</p>","related":[{"name":"Temple Denver","url":"#project/4382"}],"video":"","timestamp":"2026-08-08T20:07:41.799Z","id":"5650","order":5,"thumbnailFit":{"scale":1,"x":50,"y":46.5},"bannerFit":{"scale":1,"x":49.1,"y":48.6},"thumbnail":"media/Electronics/Entrance Hall/VID_20190706_212708-poster-thumb.webp"},{"title":"Discobasket","category":"Fixtures","image":"media/Electronics/Discobasket/IMG_20171108_200749.webp","thumbnailFit":{"scale":1.15,"x":32.3,"y":44.1},"bannerFit":{"scale":1.1,"x":25.3,"y":40.3},"description":"<p>I armored LED strips for a repurposed dance platform with aluminum, heat shrink, and hot glue to survive a rowdy nightclub crowd.</p>","longDescription":"<p>The Tracks remodel required lighting an old dance platform that sat right in the middle of a rowdy crowd. I had to armor the rig so people could grab the cage without destroying pixels or slicing their hands. I heatshrunk LED strips to 10 mm aluminum sticks, securing them to the spokes with hose clamps buried in hot glue.</p><p>I built the 4 ft tall metal basket in half to fit it through the warehouse garage doors across the alley. I programmed the pixel map while it sat in pieces. The armored sticks survived the floor, but the sharp square channel base eventually chewed through wire insulation. Pull force ripped the solder pads, taking out 1 or 2 strips at a time until I spliced new ones in.</p><p>Data hit a decoder under the deck via a cheap AP bridge or a hardline cable. When it ran, about 6 people packed inside the cage dancing surrounded by light.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Custom Fabrication","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering","AC/DC Load Calc","Hand tools","Lighting Design"],"gallery":[{"url":"media/Electronics/Discobasket/IMG_20171108_200749.webp","thumbnail":"media/Electronics/Discobasket/IMG_20171108_200749-thumb.webp"},{"url":"media/Electronics/Discobasket/IMG_20171108_194451.webp","thumbnail":"media/Electronics/Discobasket/IMG_20171108_194451-thumb.webp"},{"url":"media/Electronics/Discobasket/20160129_091032.webp","thumbnail":"media/Electronics/Discobasket/20160129_091032-thumb.webp"},{"url":"media/Electronics/Discobasket/20160129_091056.webp","thumbnail":"media/Electronics/Discobasket/20160129_091056-thumb.webp"},{"url":"media/Electronics/Discobasket/0125161647.webp","thumbnail":"media/Electronics/Discobasket/0125161647-thumb.webp"},{"url":"media/Electronics/Discobasket/Disco Basket Programming~2.mp4","fit":{"scale":1.5,"x":48.5,"y":100},"poster":"media/Electronics/Discobasket/frame-thumb-1786319490474.webp","thumbnail":"media/Electronics/Discobasket/frame-thumb-1786319490474-thumb.webp"},{"url":"media/Electronics/Discobasket/0119161413.mp4","poster":"media/Electronics/Discobasket/0119161413-poster.webp","thumbnail":"media/Electronics/Discobasket/0119161413-poster-thumb.webp"},{"url":"media/Electronics/Discobasket/0115161627.webp","thumbnail":"media/Electronics/Discobasket/0115161627-thumb.webp"},{"url":"media/Electronics/Discobasket/20160114_162456.webp","thumbnail":"media/Electronics/Discobasket/20160114_162456-thumb.webp"},{"url":"media/Electronics/Discobasket/0114161357.webp","thumbnail":"media/Electronics/Discobasket/0114161357-thumb.webp"}],"files":[],"specs":"<p><strong>Control: </strong>Madrix 3.6</p>","related":[{"name":"Tracks Danceclub","url":"#project/3671"}],"video":"","timestamp":"2026-08-08T20:42:07.206Z","id":"4903","order":8,"thumbnail":"media/Electronics/Discobasket/IMG_20171108_200749-thumb.webp"},{"title":"Pyramid Steps","category":"Lighting","image":"media/Lighting/Pyramid Steps/20240713_100537.webp","thumbnailFit":{"scale":1.25,"x":33.4,"y":25.9},"bannerFit":{"scale":1.3,"x":54.2,"y":21.5},"description":"<p>Hiding a 12V pixel wash on a wrap-around dining room pyramid required painted extrusion and balancing to solder.</p>","longDescription":"<p>The decorative pyramid above the kitchen at Que Bueno Suerte! sat 12 ft over the dining room tile and bar. I wanted to wash the steps with LED pixel tape. The catch was the sightlines. Guests taking the stairs to the second floor got a straight shot down the side of the structure. The track had to vanish during the day from the ground floor, but look pristine from above.</p><p>I mounted 45 deg aluminum extrusions with frosted lenses. Finding the correct offset required checking sightlines from the main floor to push the track back enough to hide it, while keeping enough forward throw for a clean wash. Hiding the hardware required pulling the exact paint match with a NIX digital sensor. I modeled and 3D printed custom jigs to hold the cut extrusions off the ground, then sprayed them with an airless gun in batches.</p><p>The layout covered 6 steps and 2 partial steps wrapping two sides of the pyramid. I tucked fanless MEAN WELL power supplies in the corner, controlled by wired Advatek receivers tied to the main server rack. Firing it up revealed a problem. The 12V pixel strips suffered voltage drop, causing color shift on the bottom steps. Fixing it required adding power injection points at the far ends and hardwiring the 90 deg corner joints. I sat on the 12 ft edge with my field solder station, splicing the injection points over the tile floor. I wrapped the bundles in wire wrap to create a black arc at every corner.</p><p>Painting the track made it inconsequential under daytime lighting. At night, the clean wiring and steady voltage turned the top of the kitchen into a massive accent for the room.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Pyramid Steps/20240708_123442~2.mp4","fit":{"scale":1.5,"x":16.2,"y":35},"poster":"media/Lighting/Pyramid Steps/frame-thumb-1786279546039.webp","thumbnail":"media/Lighting/Pyramid Steps/frame-thumb-1786279546039-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20250128_112618.mp4","poster":"media/Lighting/Pyramid Steps/20250128_112618-poster.webp","thumbnail":"media/Lighting/Pyramid Steps/20250128_112618-poster-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20250128_112910.mp4","poster":"media/Lighting/Pyramid Steps/20250128_112910-poster.webp","thumbnail":"media/Lighting/Pyramid Steps/20250128_112910-poster-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240713_100537.webp","thumbnail":"media/Lighting/Pyramid Steps/20240713_100537-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240713_100611.webp","thumbnail":"media/Lighting/Pyramid Steps/20240713_100611-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240708_122719.mp4","fit":{"scale":1.2,"x":100,"y":42},"poster":"media/Lighting/Pyramid Steps/frame-thumb-1786279634658.webp","thumbnail":"media/Lighting/Pyramid Steps/frame-thumb-1786279634658-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240708_112007.webp","thumbnail":"media/Lighting/Pyramid Steps/20240708_112007 edia/Lighting/Pyramid Steps/20240624_100556-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240621_121138.webp","fit":{"scale":1,"x":46.1,"y":31.9},"thumbnail":"media/Lighting/Pyramid Steps/20240621_121138-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240621_181128.webp","fit":{"scale":1.15,"x":25.5,"y":39.9},"thumbnail":"media/Lighting/Pyramid Steps/20240621_181128-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240610_140359.webp","fit":{"scale":1.1,"x":0,"y":100},"thumbnail":"media/Lighting/Pyramid Steps/20240610_140359-thumb.webp"},{"url":"media/Lighting/Pyramid Steps/20240528_155832.webp","fit":{"scale":2.4,"x":41.4,"y":54.8},"thumbnail":"media/Lighting/Pyramid Steps/20240528_155832-thumb.webp"}],"files":[],"specs":"<p><strong>Pixels: </strong>1742px<strong> </strong></p><p><strong>LED:</strong> RGBW (3000k)</p><p><strong>IC:</strong> WS2814</p><p><strong>Density:</strong> 60/m (3 x 1) 20px</p><p><strong>Power:</strong> 8 MEAN WELL HLH-320H-12</p><p><strong>Control:</strong> Madrix 5.x</p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"}],"video":"","timestamp":"2026-08-09T12:31:15.774Z","id":"1088","order":3,"thumbnail":"media/Lighting/Pyramid Steps/20240713_100537-thumb.webp"},{"title":"Tracks Discotheque","category":"Lighting","image":"media/Lighting/Tracks Discotheque/FB_IMG_1561801234515.webp","description":"<p>I layered modern LED fixtures with retro 90s scanners to build an immersive discotheque lighting rig.</p>","longDescription":"<p>Tracks was a time capsule and one of the few classic discotheques left in the country. The focus belonged on the music and the crowd, not the DJ. To put the audience directly inside the performance, I stacked multiple lighting layers in the ceiling. We ran TrackSpot 1 and 2 fixtures, Martin MX10 , pinspots, mirror balls, and DataFlash Strobes alongside modern LED lights and a video wall. I controlled the entire mix of legacy and modern gear using a GrandMA Light Gen 1. It was old, but its motorized faders and BPM detection audio input were a perfect fit for the room.</p><p>The contrast between the hardware defined the look. The moving heads provided the brightness, but the vintage scanners were incredibly fast and reacted perfectly to the beat. I expect a programmed sequence to look exactly the same every time I recall it. With vintage mechanics, that was a constant fight. Stepper motor brakes failed and ruined smooth movements. The handmade circuit boards were decades obsolete. We kept the rig alive by cannibalizing parts from dead units in the basement shop and scouring the internet to buy old fixtures to strip down.</p><p>For an unconventional layer, I built a dynamic truss warmer. We had leftover raw pixel PCBs from a lobby installation. I attached adhesive zip-tie mounts to the back of the boards. Because we used triangular truss, I zip-tied the strands to the single bottom center pipe and aimed them straight up at the ceiling. When the room was packed and the console locked onto the beat, the sheer speed of the scanners and the raw pixels firing overhead created an environment where the crowd came to life.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Custom Fabrication","DMX","Hand tools","Lighting Design","MA","MIDI","Power Distribution","TCP/IP","SPI","Through-Hole Soldering","Repair"],"gallery":[{"url":"media/Lighting/Tracks Discotheque/20150922_115556-EDIT.webp","fit":{"scale":1.3,"x":36.1,"y":34.4},"thumbnail":"media/Lighting/Tracks Discotheque/20150922_115556-EDIT-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/20150918_124128.webp","fit":{"scale":1.25,"x":78.3,"y":45.4},"thumbnail":"media/Lighting/Tracks Discotheque/20150918_124128-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/20150922_115652.webp","fit":{"scale":1.45,"x":23.3,"y":57},"thumbnail":"media/Lighting/Tracks Discotheque/20150922_115652-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/20150922 ,"thumbnail":"media/Lighting/Tracks Discotheque/0321151930b-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/0226150011.webp","thumbnail":"media/Lighting/Tracks Discotheque/0226150011-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/0220151603.webp","thumbnail":"media/Lighting/Tracks Discotheque/0220151603-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/0213152006.webp","thumbnail":"media/Lighting/Tracks Discotheque/0213152006-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/0212152029a.webp","thumbnail":"media/Lighting/Tracks Discotheque/0212152029a-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/0212152029.webp","thumbnail":"media/Lighting/Tracks Discotheque/0212152029-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/150907_4533677534676_274913011_n.webp","fit":{"scale":1.1,"x":37.4,"y":98.6},"thumbnail":"media/Lighting/Tracks Discotheque/150907_4533677534676_274913011_n-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/20160315_134734.webp","thumbnail":"media/Lighting/Tracks Discotheque/20160315_134734-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/150605_4530409812985_696799897_n.webp","thumbnail":"media/Lighting/Tracks Discotheque/150605_4530409812985_696799897_n-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/0223151340.webp","fit":{"scale":1.1,"x":23.2,"y":15.9},"thumbnail":"media/Lighting/Tracks Discotheque/0223151340-thumb.webp"},{"url":"media/Lighting/Tracks Discotheque/0221151313.webp","fit":{"scale":1.15,"x":10.4,"y":43.4},"thumbnail":"media/Lighting/Tracks Discotheque/0221151313-thumb.webp"}],"files":[],"specs":"<p>GrandMA Light</p><p>(12) TrackSpot 1</p><p>(8) TrackSpot 2</p><p>(6) MX10</p><p>(4) Mac250</p><p>(8) Beam 200</p><p>(6) DataFlash Strobe</p><p>(12) Intimidator 250</p><p>(8) FlurryQ</p><p>(48) Classic Pinspot</p><p>(48) RGBW Pinspot</p><p>(2) Lasers</p><p>(4) Cryo Jets</p>","related":[{"name":"Discobasket","url":"#project/4903"},{"name":"Lobby Wall","url":"#project/7590"}],"video":"","timestamp":"2026-08-09T16:56:13.594Z","id":"3671","order":15,"thumbnailFit":{"scale":1,"x":69.8,"y":0},"bannerFit":{"scale":1.05,"x":99.8,"y":38.6}},{"title":"Remote Fill Fog Jets","category":"Lighting","image":"media/Lighting/Remote Fill Fog Jets/frame-thumb-1786744075304.webp","thumbnailFit":{"scale":1,"x":95,"y":34.7},"bannerFit":{"scale":1,"x":48.2,"y":34.6},"description":"<p>A 55 gal fluid distribution system feeding 6 inverted fog jets to bypass strict city CO2 permits.</p>","longDescription":"<p>Denver had become strict with CO2 permits following the local increase in grow houses. Securing clearance for a cryo system inside a venue was legally impossible. The client still wanted a massive atmospheric effect for the stage. I adapted 6 Antari fog jets using quick dissipating fluid to simulate the cold blast.</p><p>The venue had 16 ft ceilings, so staff couldn't reach them for manual fluid fills. I installed an Antari fluid distribution system using a 55 gal drum in the dressing room. 2 ground pumps pushed fluid up to 2 header tanks in the ceiling, which then fed 3 jets each. The 1500W jets required new dedicated circuits and remote booth switches. The units lacked a built in way to hang upside down. I built adjustable mounts using strut channel L-brackets and bolted them directly to the existing ceiling grid.</p><p>During the initial power up, 1 header tank immediately started pouring fluid from the ceiling. A factory float valve was wired backward, signaling the pump to continue filling an overflowing tank. I caught the leak quick and pulled the tank down to wait for a replacement part.</p><p>I patched the rig into their Chamsys console. The RGBA wash LEDs built into the jets colored the blast and successfully sold the cryo illusion. It worked exactly as intended mechanically, but the vapor condensed on the metal stage poles. The steel became incredibly slick, and the only remaining option was for the staff to wipe the poles down between sets.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","DMX","Hand tools","Power Distribution","ChamSys"],"gallery":[{"url":"media/Lighting/Remote Fill Fog Jets/20230623_134325.mp4","fit":{"scale":1,"x":50,"y":40.2},"poster":"media/Lighting/Remote Fill Fog Jets/frame-thumb-1786744075304.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/frame-thumb-1786744075304-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230617_140953.mp4","fit":{"scale":1,"x":49.5,"y":30.3},"poster":"media/Lighting/Remote Fill Fog Jets/frame-thumb-1786316596476.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/frame-thumb-1786316596476-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230617_131656.webp","fit":{"scale":1.2,"x":12,"y":29.1},"thumbnail":"media/Lighting/Remote Fill Fog Jets/20230617_131656-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230616_143807.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230616_143807-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230614_140510.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230614_140510-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230616_135939.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230616_135939-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230616_135910.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230616_135910-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230614_134730.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230614_134730-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230616_140923.mp4","fit":{"scale":1,"x":46.8,"y":14.8},"poster":"media/Lighting/Remote Fill Fog Jets/frame-thumb-1786316799010.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/frame-thumb-1786316799010-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230614_154437.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230614_154437-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230614_154426.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230614_154426-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230614_163257.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230614_163257-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230612_152343.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230612_152343-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230614_135405.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230614_135405-thumb.webp"},{"url":"media/Lighting/Remote Fill Fog Jets/20230527_151705.webp","thumbnail":"media/Lighting/Remote Fill Fog Jets/20230527_151705-thumb.webp"}],"files":[],"specs":"<p>(6) Antari M7-X RGBA</p><p>(2) LCU-2S Liquid Supply System</p><p>(1) 55GAL FLC-200</p>","related":[],"video":"","timestamp":"2026-08-09T23:05:35.692Z","id":"6654","order":11,"thumbnail":"media/Lighting/Remote Fill Fog Jets/frame-thumb-1786744075304-thumb.webp"},{"title":"Alabaster Bar Top","category":"Lighting","image":"media/Lighting/Alabaster Bar Top/Gemini_Generated_Image_jevrnrjevrnrjevr.webp","description":"<p>Retrofitting addressable pixels into an active alabaster bar top within a rolling 6 hour daily window.</p>","longDescription":"<p>Walking into Que Bueno Suerte!, the main bar extends the full length of the dining room under vaulted ceilings. The bar top is alabaster. The original contractors treated the low voltage DC lighting like high voltage AC, using wire nuts, leaving dark sections of stone across the bar. I wanted to get the whole surface working again using addressable pixels. The venue could not close. I had a 6 hour window each morning before the 3 PM open to finish a single section.</p><p>I pulled off the alabaster, removed the etched acrylic lighting panel, and stripped the dead static white strips. Narrow 12VDC SK6812 pixels went into the edges to reduce voltage drop. I ran power and data through the bar to 3 Advatek long range decoders, then siliconed the stone back in. Putting it back together was a fight. Hitting a mechanical problem meant racing the opening staff to clear the bar. The center section sat around a support pillar. The acrylic here was incredibly heavy and bolted through the stone. I bought spreader bars to lift it, unbolted the legs, and shoved the entire piece onto an adjacent table to work.</p><p>The project took several weeks. I wrote a temporary patch that locked the new pixels to a static warm white. This matched the surviving original LEDs and hid the ongoing construction. Once every section was online, the density of the new pixels made a standard single line sweep impossible in Madrix. I used fluid effects and mirroring instead. The light hits the edges of the etched acrylic panels and naturally drops off toward the center of the stone.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","Repair","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Alabaster Bar Top/20250225_102012.mp4","fit":{"scale":1.3,"x":48.8,"y":14.8},"poster":"media/Lighting/Alabaster Bar Top/20250225_102012-poster.webp","thumbnail":"media/Lighting/Alabaster Bar Top/20250225_102012-poster-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20250303_144119.webp","fit":{"scale":1,"x":53,"y":24.3},"thumbnail":"media/Lighting/Alabaster Bar Top/20250303_144119-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20250303_104541.webp","fit":{"scale":1.45,"x":77.7,"y":41.2},"thumbnail":"media/Lighting/Alabaster Bar Top/20250303_104541-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20250303_095642.webp","fit":{"scale":1.15,"x":100,"y":87.6},"thumbnail":"media/Lighting/Alabaster Bar Top/20250303_095642-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20241105_140027.mp4","fit":{"scale":1.15,"x":2.3,"y":35.6},"poster":"media/Lighting/Alabaster Bar Top/frame-thumb-1786736490635.webp","thumbnail":"media/Lighting/Alabaster Bar Top/frame-thumb-1786736490635-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20250303_113133.webp","fit":{"scale":1,"x":50.2,"y":23.7},"thumbnail":"media/Lighting/Alabaster Bar Top/20250303_113133-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20250218_100619.webp","fit":{"scale":1,"x":42.2,"y":52.3},"thumbnail":"media/Lighting/Alabaster Bar Top/20250218_100619-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20241105_125434.webp","fit":{"scale":1,"x":49.3,"y":40.5},"thumbnail":"media/Lighting/Alabaster Bar Top/20241105_125434-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20241105_133133.webp","fit":{"scale":1,"x":49.5,"y":49.7},"thumbnail":"media/Lighting/Alabaster Bar Top/20241105_133133-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20241105_132944.webp","fit":{"scale":1,"x":49.6,"y":35.1},"thumbnail":"media/Lighting/Alabaster Bar Top/20241105_132944-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20241105_114849.webp","fit":{"scale":1,"x":50.4,"y":46.5},"thumbnail":"media/Lighting/Alabaster Bar Top/20241105_114849-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20240717_110243.webp","fit":{"scale":1.35,"x":56.4,"y":0},"thumbnail":"media/Lighting/Alabaster Bar Top/20240717_110243-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20240717_111927.webp","fit":{"scale":1,"x":49.8,"y":37.6},"thumbnail":"media/Lighting/Alabaster Bar Top/20240717_111927-thumb.webp"},{"url":"media/Lighting/Alabaster Bar Top/20241105_095347.webp","fit":{"scale":1.1,"x":31,"y":36.9},"thumbnail":"media/Lighting/Alabaster Bar Top/20241105_095347-thumb.webp"}],"files":[],"specs":"<p>3027 RGB Pixels</p><p>2020 SK6812</p><p>12VDC</p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Bar Kicker","url":"#project/468"},{"name":"Bar Backsplash","url":"#project/7026"},{"name":"Bar Tubes","url":"#project/4411"}],"video":"","timestamp":"2026-08-14T18:26:35.295Z","id":"9525","order":7,"thumbnail":"media/Lighting/Alabaster Bar Top/Gemini_Generated_Image_jevrnrjevrnrjevr-thumb.webp","thumbnailFit":{"scale":1.35,"x":0,"y":20.1},"bannerFit":{"scale":1.5,"x":0,"y":23.9}},{"title":"Bar Kicker","category":"Lighting","image":"media/Lighting/Bar Kicker/frame-thumb-1786735695778.webp","description":"<p>I replaced a failing bar lighting system with custom neon flex while fighting severe physical clearance constraints.</p>","longDescription":"<p>The kicker panels at Que Bueno Suerte! were built from plywood and 3/8 in amber acrylic. There were 9 panels total, weighing 25 lb each, mounted beneath the main bar. The original lighting behind them was poorly executed.</p><p>Taking the panels off revealed structural damage. I repaired the wood as I went. For the lighting, I built custom lengths of neon flex using a square flex tube and WS2814 pixels. The rig ran on 12V power with redundant data and a 3000K channel. I pulled 1 panel down at a time, siliconed the flex along the waveform cuts on the acrylic, and taped it until it cured. Everything wired back to an Advatek receiver and a Meanwell supply with DC protection.</p><p>Reinstalling the panels was a physical fight. I had 1 to 2 inches of clearance behind the acrylic, blocked by a 3 inch steel rail. Every time I had to pull a panel, I wedged my heel on the rail, pried the 25 lb sheet up with my toe, and disconnected the leads blind with my free hand. I dropped 2 of the panels doing this. The impact ripped the silicone right off the back. With no time for wet silicone to cure, I remounted the flex with industrial tape on the fly.</p><p>When I finally powered the rig up, the materials dictated the programming. The amber acrylic completely blocked the blue spectrum. I dropped blue from the palette entirely and built the installation a series of slow sweeps using only red, green, and warm white.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Bar Kicker/20250213_105836.mp4","fit":{"scale":1,"x":50,"y":42.1},"poster":"media/Lighting/Bar Kicker/frame-thumb-1786735672995.webp","thumbnail":"media/Lighting/Bar Kicker/frame-thumb-1786735672995-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241023_133244.mp4","fit":{"scale":1.3,"x":80.2,"y":46.7},"poster":"media/Lighting/Bar Kicker/frame-thumb-1786735695778.webp","thumbnail":"media/Lighting/Bar Kicker/frame-thumb-1786735695778-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241023_133211.mp4","fit":{"scale":1,"x":49.3,"y":50.3},"poster":"media/Lighting/Bar Kicker/frame-thumb-1786735632820.webp","thumbnail":"media/Lighting/Bar Kicker/frame-thumb-1786735632820-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241022_103133.webp","fit":{"scale":1,"x":50.2,"y":39.8},"thumbnail":"media/Lighting/Bar Kicker/20241022_103133-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241023_133203.webp","fit":{"scale":1.05,"x":50,"y":45.9},"thumbnail":"media/Lighting/Bar Kicker/20241023_133203-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241022_093856.mp4","fit":{"scale":1,"x":50.2,"y":62.1},"poster":"media/Lighting/Bar Kicker/20241022_093856-poster.webp","thumbnail":"media/Lighting/Bar Kicker/20241022_093856-poster-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241021_110625.webp","fit":{"scale":1,"x":50.2,"y":31.9},"thumbnail":"media/Lighting/Bar Kicker/20241021_110625-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241014_123203.mp4","fit":{"scale":1,"x":49.5,"y":62.7},"poster":"media/Lighting/Bar Kicker/frame-thumb-1786736307487.webp","thumbnail":"media/Lighting/Bar Kicker/frame-thumb-1786736307487-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241015_212554.webp","fit":{"scale":1,"x":49.1,"y":35.4},"thumbnail":"media/Lighting/Bar Kicker/20241015_212554-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241014_124535.webp","fit":{"scale":1,"x":49.6,"y":37},"thumbnail":"media/Lighting/Bar Kicker/20241014_124535-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241030_101013.webp","fit":{"scale":1.3,"x":93.5,"y":51.1},"thumbnail":"media/Lighting/Bar Kicker/20241030_101013-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241030_095959.webp","fit":{"scale":1,"x":50.4,"y":58.3},"thumbnail":"media/Lighting/Bar Kicker/20241030_095959-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20241021_111210.webp","fit":{"scale":1.6,"x":76.7,"y":50.1},"thumbnail":"media/Lighting/Bar Kicker/20241021_111210-thumb.webp"},{"url":"media/Lighting/Bar Kicker/20240717_112628.webp","fit":{"scale":1.4,"x":66.4,"y":46.3},"thumbnail":"media/Lighting/Bar Kicker/20240717_112628-thumb.webp"}],"files":[],"specs":"<p><strong>Panels:</strong> 9</p><p><strong>Pixels:</strong> 405</p><p><strong>LEDs:</strong> 5050 RGBW (3000k)</p><p><strong>Density:</strong> 60/m @ 20/px</p><p><strong>IC: </strong>WS2814</p><p><strong>Voltage:</strong> 12vdc</p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Alabaster Bar Top","url":"#project/9525"},{"name":"Bar Backsplash","url":"#project/7026"},{"name":"Bar Tubes","url":"#project/4411"}],"video":"","timestamp":"2026-08-14T19:25:35.032Z","id":"468","order":8,"thumbnail":"media/Lighting/Bar Kicker/frame-thumb-1786735695778-thumb.webp","thumbnailFit":{"scale":1,"x":50,"y":48.4},"bannerFit":{"scale":1,"x":50,"y":47.7}},{"title":"Bar Backsplash","category":"Lighting","image":"media/Lighting/Bar Backsplash/20241009_111435.webp","thumbnail":"media/Lighting/Bar Backsplash/20241009_111435-thumb.webp","thumbnailFit":{"scale":1,"x":57.1,"y":50.7},"bannerFit":{"scale":1,"x":0,"y":59},"description":"<p>Extracting a secured LED track from behind a permanent acrylic wall using a ratchet strap and a deadblow.</p>","longDescription":"<p>The bar backsplash at Que Bueno Suerte! is a giant acrylic wall extending up to a vaulted ceiling. The original LEDs were burnt out, and the wiring was shot. I needed to relight the edges of the acrylic and underlight the 3 glass bottle shelves. The wall was never meant to come apart, and the shelves were mounted directly through the acrylic after initial assembly. This trapped the bottom LED track under the panels. It was also locked in with double-sided gummy tape.</p><p>I got the top and side strips out quickly. The bottom track was an 8 ft problem. My only option was pulling it out sideways, fighting the friction of the adhesives and the weight of the wall. I drilled a hole through the end of the aluminum track and hooked a ratchet strap to it. I ran the strap across the room, out the door, and anchored it to the welded metal patio fence. Sliding a 2 ft piece of strut channel through the strap gave me a strike plate. I stood next to the bar and hit the strut channel with a deadblow. The track inched out fraction by fraction. It took me about 4 hours in total to get it out. I ran out of time before the venue opened for service, so I packed up and came back the next day to finish the LED installation.</p><p>Assembly was much easier. I skipped the adhesive on the new bottom track. For the glass shelves, I mounted pixel tape into thin black channels and siliconed them face up. They sit mid-shelf, firing light directly up through the bottles. I loomed the wiring and ran it back to an Advatek decoder and a couple of Mean Well power supplies, tying the installation into the main server upstairs. The bright acrylic acts as a prominent backdrop for the bartenders, tying the main bar in with the alabaster top and kicker.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","Wire-to-Board Soldering","Repair"],"gallery":[{"url":"media/Lighting/Bar Backsplash/20241009_113728.mp4","fit":{"scale":1.1,"x":67.2,"y":61.3},"poster":"media/Lighting/Bar Backsplash/frame-thumb-1786742341805.webp","thumbnail":"media/Lighting/Bar Backsplash/frame-thumb-1786742341805-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20241009_113753.mp4","fit":{"scale":1,"x":52.1,"y":60.6},"poster":"media/Lighting/Bar Backsplash/frame-thumb-1786742368716.webp","thumbnail":"media/Lighting/Bar Backsplash/frame-thumb-1786742368716-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20250128_113203.mp4","fit":{"scale":1,"x":50,"y":80.5},"poster":"media/Lighting/Bar Backsplash/20250128_113203-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/20250128_113203-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20241028_100715.mp4","fit":{"scale":1,"x":57.3,"y":19.8},"poster":"media/Lighting/Bar Backsplash/20241028_100715-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/20241028_100715-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20241028_101223.mp4","fit":{"scale":1,"x":50.4,"y":31.3},"poster":"media/Lighting/Bar Backsplash/20241028_101223-poster.webp","thumbnail":"media/Lighting/Bar Backsplash/20241028_101223-poster-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240619_123134.webp","fit":{"scale":1,"x":50,"y":54.1},"thumbnail":"media/Lighting/Bar Backsplash/20240619_123134-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20241009_111435-2.webp","fit":{"scale":1,"x":50,"y":50},"thumbnail":"media/Lighting/Bar Backsplash/20241009_111435-thumb-2.webp"},{"url":"media/Lighting/Bar Backsplash/20240205_124008.webp","fit":{"scale":1,"x":50,"y":54.4},"thumbnail":"media/Lighting/Bar Backsplash/20240205_124008-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240205_112043.webp","fit":{"scale":1,"x":46.8,"y":51.1},"thumbnail":"media/Lighting/Bar Backsplash/20240205_112043-thumb.webp"},{"url":"media/Lighting/Bar Backsplash/20240205_1 ghting","image":"media/Lighting/Glow Lounge/frame-thumb-1786745346701.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786745346701-thumb.webp","thumbnailFit":{"scale":1.2,"x":33.6,"y":0},"bannerFit":{"scale":1,"x":45.4,"y":25.4},"description":"<p>I upgraded the dance floor lighting at Glow Lounge on an 8ft ceiling around a fixed art installation.</p>","longDescription":"<p>Glow Lounge wanted more energy on their dance floor. Budget was the primary constraint. The room had an 8 ft ceiling, and 3 art panels hung angled over the floor. A community member painted them with UV paint before he passed away, so they could not be moved. I scrapped my initial pixel designs to keep costs down. After pulling down the existing rig, I cleaned the usable units and mapped a new layout around the art.</p><p>I found a few open spots and mounted 5 ft strut channels to the ceiling. Four RGBW pixel dot beams went onto each bar, finished with a reused hybrid fixture on the end. I added 2 new B6 FX wash lights flanking the DJ and 2 at the back of the room. I relocated the existing mirror balls into a symmetrical pattern. The centerpiece was a rotating mannequin torso covered entirely in small mirrors.</p><p>The fixtures did not cooperate immediately. The new B6 washes sometimes got stuck while panning. I had to repair a couple of them multiple times to keep them operating correctly.</p><p>The system ran off a Wolfmix WMX1 controller. I narrowed the B6 washes into beams and aimed them at the mirror balls and the spinning torso. The reflection scattered light across the low room and the dance floor.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Custom Fabrication","Lighting Design","DMX","Power Distribution","Power tools","Repair"],"gallery":[{"url":"media/Lighting/Glow Lounge/Video Project 29.mp4","fit":{"scale":1.3,"x":48.3,"y":0.2},"poster":"media/Lighting/Glow Lounge/frame-thumb-1786747929189.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786747929189-thumb.webp"},{"url":"media/Lighting/Glow Lounge/Video Project 30.mp4","fit":{"scale":1.4,"x":40.8,"y":12.4},"poster":"media/Lighting/Glow Lounge/frame-thumb-1786747967418.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786747967418-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20231203_134428.mp4","fit":{"scale":1.3,"x":22.2,"y":30.7},"poster":"media/Lighting/Glow Lounge/frame-thumb-1786745268005.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786745268005-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20230706_145524.mp4","fit":{"scale":2,"x":45.2,"y":28.7},"poster":"media/Lighting/Glow Lounge/frame-thumb-1786745153988.webp","thumbnail":"media/Lighting/Glow Lounge/frame-thumb-1786745153988-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20230706_140756.mp4","poster":"media/Lighting/Glow Lounge/20230706_140756-poster.webp","thumbnail":"media/Lighting/Glow Lounge/20230706_140756-poster-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20231203_134407.webp","fit":{"scale":1.25,"x":33.6,"y":64.8},"thumbnail":"media/Lighting/Glow Lounge/20231203_134407-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20231203_134419.webp","fit":{"scale":1.3,"x":21.4,"y":81.2},"thumbnail":"media/Lighting/Glow Lounge/20231203_134419-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20230706_145020.webp","fit":{"scale":1,"x":19.8,"y":27.1},"thumbnail":"media/Lighting/Glow Lounge/20230706_145020-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20240209_122228.webp","fit":{"scale":1.35,"x":37.2,"y":24.7},"thumbnail":"media/Lighting/Glow Lounge/20240209_122228-thumb.webp"},{"url":"media/Lighting/Glow Lounge/20230705_122239.webp","fit":{"scale":1.1,"x":77.5,"y":31.7},"thumbnail":"media/Lighting/Glow Lounge/20230705_122239-thumb.webp"}],"files":[],"specs":"<p><strong>Controller: </strong>WolfMix WMX1</p><p><strong>Lighting:</strong> (8) PixelDot . (4) B6 FX . (2) Intimidator Hybrid</p>","related":[],"video":"","timestamp":"2026-08-14T22:12:34.696Z","id":"3309","order":10},{"title":"Mezzanine Bar","category":"Lighting","image":"media/Lighting/Mezzanine Bar/frame-thumb-1786750929356.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786750929356-thumb.webp","thumbnailFit":{"scale":1,"x":48.6,"y":40.8},"bannerFit":{"scale":1,"x":48.6,"y":37.4},"description":"<p>Pixel mapping 23 irregular sheet metal shelves and working around dining room furniture at Que Bueno Suerte!</p>","longDescription":"<p>The bottle shelves on the mezzanine at Que Bueno Suerte! were just sheet metal plates stacked on wood blocks. I needed to wash the liquor bottles from the front without exposing the wiring. I custom cut, soldered, and heat-shrunk 23 strips of 3000K RGBW tape. I mounted them inside 45-degree aluminum extrusions and stuck them to the top of each shelf with double-sided foam tape. To hide the wiring, I ran the cables between the wood blocks and sleeved the visible gaps in wire wrap.</p><p>The space under the bar had a different physical constraint. At night, the staff turned the mezzanine into a dance floor and shoved the heavy tables and chairs underneath. I loaded more LED tape into extrusion and siliconed it directly to the underside of the bar. Keeping the profile low and mounting the track far enough back meant the sliding furniture never caught it.</p><p>Every line ran to a single Advatek decoder and a MEAN WELL power supply hidden behind the bar. I mapped the entire rig in Madrix. The 23 irregular shelves created a fun canvas. When the rig fired up, it made a nice addition to the mezzanine, especially fire presets.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","SPI","Wire-to-Board Soldering"],"gallery":[{"url":"media/Lighting/Mezzanine Bar/20241003_113337.mp4","fit":{"scale":1,"x":47.5,"y":37.3},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786749159559.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786749159559-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20250128_113555.mp4","fit":{"scale":1.1,"x":100,"y":31.4},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786750929356.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786750929356-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20241003_113152.webp","fit":{"scale":1,"x":50.2,"y":22.4},"thumbnail":"media/Lighting/Mezzanine Bar/20241003_113152-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20241003_113226.mp4","fit":{"scale":1,"x":43.4,"y":8.1},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786749136908.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786749136908-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20241001_110047.mp4","fit":{"scale":1,"x":52.1,"y":29},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786749024242.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786749024242-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20240924_130323.mp4","fit":{"scale":1,"x":50,"y":50},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786748964762.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786748964762-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20240924_125641.mp4","fit":{"scale":1,"x":50,"y":43.7},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786748937445.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786748937445-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20241003_105404.mp4","fit":{"scale":1,"x":50.5,"y":43},"poster":"media/Lighting/Mezzanine Bar/frame-thumb-1786749049434.webp","thumbnail":"media/Lighting/Mezzanine Bar/frame-thumb-1786749049434-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20240924_113225.webp","fit":{"scale":1,"x":19.9,"y":27},"thumbnail":"media/Lighting/Mezzanine Bar/20240924_113225-thumb.webp"},{"url":"media/Lighting/Mezzanine Bar/20240924_125453.webp","fit":{"scale" intuition for how things fail, and a deep respect for craftsmanship.</p>","skills_hardware":"Power Distribution, AC/DC Load Calc, Through-Hole Soldering, Wire-to-Board Soldering, SMD Soldering, ESP32, ESP8266, Embedded Systems, Repair","skills_lighting":"Resolume Arena, Madrix, ELM, MA, Roadhog 4, ETC, ChamSys, Capture, Lighting Design, Pixel Mapping, Video Mapping, WLED","skills_software":"React, JavaScript, TypeScript, Node.js, REST APIs, LLM Integration, Google Drive API","skills_fabrication":"FDM 3D Printing, 3D Scanning, SolidWorks, Custom Fabrication, Rapid Prototyping, Hand tools, Power tools, Blender","skills_systems":"DMX, ArtNet, sACN, OSC, MIDI, TCP/IP, SPI, Show Cockpit, OSCpilot, NDI"}}

        // --- GLOBAL HELPER: URL NORMALIZER ---
        const ensureProtocol = (url) => {

            if (url.startsWith('/') || url.startsWith('./') || url.startsWith('../')) return url;

            if (!/^https?:\/\//i.test(trimmed)) {
                // Relative paths (e.g. media/...) should be served as-is
                if (!/^[a-zA-Z0-9+\-.]+:\/\//.test(trimmed) && !trimmed.includes('://') && trimmed.match(/^[a-zA-Z]+\//)) {

                return `https://${trimmed}`;

        const isVideoUrl = (url) => typeof url === 'string' && /\.(mp4|webm|mov|m4v)$/i.test(url.split('?')[0]);

        // Returns inline style for a cropped image. When scale=1, only objectPosition
        // is set so CSS hover transitions (e.g. group-hover:scale-105) still work.
        const fitStyle = (fit) => {
            if (!fit) return {};
            const { scale = 1, x = 50, y = 50 } = fit;
            if (scale <= 1) return { objectPosition: `${x}% ${y}%` };
            return { transform: `scale(${scale})`, transformOrigin: `${x}% ${y}%`, objectPosition: `${x}% ${y}%` };
        };

        const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])';

        // Confines Tab cycling to `containerRef`, closes on Escape, and returns
        // focus to whatever was focused before the dialog opened. `isActive` lets a
        // parent dialog stand down while a nested one (the lightbox) is on top.
        const useDialog = (containerRef, onClose, isActive = true) => {
            // Read through a ref so the once-only effect below never sees stale state.
            const stateRef = useRef(null);
            stateRef.current = { onClose, isActive };

            useEffect(() => {
                const previouslyFocused = document.activeElement;
                const container = containerRef.current;

                const focusables = () =>
                    Array.from(container ? container.querySelectorAll(FOCUSABLE) : [])
                        .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);

                const first = focusables()[0];
                (first || container)?.focus();

                const onKeyDown = (e) => {
                    if (!stateRef.current.isActive) return;
                    if (e.key === 'Escape') {
                        e.stopPropagation();
                        stateRef.current.onClose();
                        return;
                    }
                    if (e.key !== 'Tab') return;
                    const items = focusables();
                    if (!items.length) { e.preventDefault(); return; }
                    const firstItem = items[0];
                    const lastItem = items[items.length - 1];
                    if (e.shiftKey && (document.activeElement === firstItem || !container.contains(document.activeElement))) {
                        e.preventDefault();
                        lastItem.focus();
                    } else if (!e.shiftKey && document.activeElement === lastItem) {
                        e.preventDefault();
                        firstItem.focus();
                    }
                };

                document.addEventListener('keydown', onKeyDown, true);
                return () => {
                    document.removeEventListener('keydown', onKeyDown, true);
                    if (previouslyFocused && document.contains(previouslyFocused)) previouslyFocused.focus();
                };
            }, []);
        };

        // The CMS editor emits <h1>/<h2>, which collide with the heading level of the
        // section the markup gets embedded in (an <h2> landing inside the <h4>
        // "Specifications" panel reads as a jump back up the outline). Retag to the right
        // level and move the visual size onto a class.
        const demoteHeadings = (html, startLevel) => {
            if (!html) return html;
            const source = String(html);
            const present = [...source.matchAll(/<h([1-6])\b/gi)].map(m => parseInt(m[1], 10));
            if (!present.length) return source;
            // Anchor the shallowest authored heading at startLevel so the outline neither
            // jumps backwards nor skips a level, and keep relative nesting below it.
            const shallowest = Math.min(...present);
            return source.replace(/<(\/?)h([1-6])([^>]*)>/gi, (match, slash, lvl, attrs) => {
                const original = parseInt(lvl, 10);
                const level = Math.min(6, startLevel + original - shallowest);
                if (slash) return `</h${level}>`;
                const cls = `rt-h${original}`;
                const withClass = /class\s*=\s*"/i.test(attrs)
                    ? attrs.replace(/class\s*=\s*"([^"]*)"/i, (m, c) => `class="${c} ${cls}"`)
                    : `${attrs} class="${cls}"`;
                return `<h${level}${withClass}>`;
            });
        };
