es)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Styling\u003c/strong>\u003cbr>\u003cem>Tailwind CSS (CDN)\u003c/em>\u003c/p>\u003cp>\u003cstrong>AI\u003c/strong>\u003cbr>\u003cem>Google Gemini (text/image/TTS)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Audio\u003c/strong>\u003cbr>\u003cem>Web Speech API (fallback)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Storage\u003c/strong>\u003cbr>\u003cem>localStorage\u003c/em>\u003c/p>\u003cp>\u003cstrong>Deploy\u003c/strong>\u003cbr>\u003cem>GitHub Pages\u003c/em>\u003c/p>","related":[],"thumbnail":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-f5a5af-thumb.webp","slug":"chronicle-iterative-fiction-engine","imageThumb":"media/Apps/Chronicle_ Iterative Fiction Engine/Chronicle-Iterative-Fiction-Engine-img-f5a5af-thumb.webp"},{"id":"6638","title":"Strata - Digital Notebook","category":"Software","tags":["React","Google Drive API"],"image":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-c1a5be.webp","description":"\u003cp>OneNote's notebook structure, an infinite canvas, and a code editor that runs what you write. Every file lives in your own Google Drive.\u003c/p>","longDescription":"\u003cp>The number of files flying around at work on a normal day is overwhelming. Boston Dynamics runs on the Google ecosystem, so it was Docs, Sheets, Slides, links, and snippets of code, and I kept losing track of all of it. My system was native Drive sorting plus a bookmark folder tree, and the bookmark tree had stopped working as a system some time before I admitted it.\u003c/p>\u003cp>Strata is what I built to hold it. I took the three-tier structure of OneNote (notebooks, tabs, pages) as the skeleton, then added block pages for structure and an infinite canvas for the things that do not fit in a page. The piece I use most is a split-screen editor that runs the code you write in it, so a specialized calculator can live right next to the notes that explain it. The one wall I hit was embedding other websites. Almost every site refuses to load inside an iframe, so that became a page of shortcut links instead.\u003c/p>\u003cp>Every file stays in the user's own Google Drive. Sign in with a Google account and it is yours. It is how I keep track of my job now.\u003c/p>","video":"","gallery":[{"url":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-c1a5be.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-c1a5be-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-3deaff.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-3deaff-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-6370fc.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-6370fc-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-d9e935.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-d9e935-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-b5a567.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-b5a567-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-8667b3.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-8667b3-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-2decc7.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-2decc7-thumb.webp"},{"url":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-1e611f.webp","thumbnail":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-1e611f-thumb.webp"}],"launchLink":"https://elusid108.github.io/Strata-vite/","githubLink":"https://github.com/Elusid108/Strata-vite","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-01-24T02:36:52.522Z","wip":true,"order":4,"specs":"","related":[],"thumbnail":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-c1a5be-thumb.webp","thumbnailFit":{"scale":1.4,"x":0,"y":0},"bannerFit":{"scale":1,"x":46.3,"y":0},"slug":"strata-digital-notebook","imageThumb":"media/Apps/Strata - Digital Notebook/Strata-Digital-Notebook-img-c1a5be-thumb.webp"},{"id":"6962","title":"IdeaForge.AI","category":"Software","tags":["React","TypeScript","LLM Integration","Google Drive API"],"image":"media/Apps/IdeaForge.AI/IdeaForge-AI-img-3c4731.webp","description":"\u003cp>Raw thoughts go in. The model interviews you about the gaps, then hands back an execution plan, a budget, and a task list.\u003c/p>","longDescription":"\u003cp>Ideas do not survive contact with criticism, including mine. Most of them get shot down before they have enough shape to defend themselves. I built a place to hold them until they do.\u003c/p>\u003cp>Raw thoughts go in and get tagged. When one shows promise, you promote it to a brainstorm, and the model runs an interview to pull out the details you have not thought about yet. From there it compiles an execution strategy, an expense tracker, and a task list. I prototyped the workflow in Notion first, then rebuilt it on Lovable with a Supabase database. Both meant a monthly subscription for something I use a few times a week, so I stripped the cloud database out and wired the front end straight into Google Sheets and Drive, with a data layer that handles offline edits.\u003c/p>\u003cp>So far I have only run it backwards. I fed it several finished projects, LithoLab among them, to see whether the plans it produced matched what I actually did. They held up well enough that I trust it. I have not yet taken a brand-new idea through it from start to finish. That is the real test.\u003c/p>","video":"","gallery":[{"url":"media/Apps/IdeaForge.AI/IdeaForge-AI-img-3c4731.webp","thumbnail":"media/Apps/IdeaForge.AI/IdeaForge-AI-img-3c4731-thumb.webp"},{"url":"media/Apps/IdeaForge.AI/IdeaForge-AI-img-956569.webp","thumbnail":"media/Apps/IdeaForge.AI/IdeaForge-AI-img-956569-thumb.webp"},{"url":"media/Apps/IdeaForge.AI/IdeaForge-AI-img-43c4c0.webp","thumbnail":"media/Apps/IdeaForge.AI/IdeaForge-AI-img-43c4c0-thumb.webp"}],"launchLink":"https://elusid108.github.io/IdeaForge-AI/","githubLink":"https://github.com/Elusid108/IdeaForge-AI","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-02-15T04:59:58.733Z","wip":true,"order":5,"specs":"\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Framework\u003c/strong>\u003cbr>\u003cem>React 18\u003c/em>\u003c/p>\u003cp>\u003cstrong>Language\u003c/strong>\u003cbr>\u003cem>TypeScript\u003c/em>\u003c/p>\u003cp>\u003cstrong>Build\u003c/strong>\u003cbr>\u003cem>Vite (SWC)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Styling\u003c/strong>\u003cbr>\u003cem>Tailwind CSS • Radix UI\u003c/em>\u003c/p>\u003cp>\u003cstrong>State\u003c/strong>\u003cbr>\u003cem>Zustand\u003c/em>\u003c/p>\u003cp>\u003cstrong>AI\u003c/strong>\u003cbr>\u003cem>Google Gemini\u003c/em>\u003c/p>\u003cp>\u003cstrong>Cloud\u003c/strong>\u003cbr>\u003cem>Google Drive API • Google Sheets API\u003c/em>\u003c/p>\u003cp>\u003cstrong>Testing\u003c/strong>\u003cbr>\u003cem>Vitest\u003c/em>\u003c/p>\u003cp>\u003cstrong>Deploy\u003c/strong>\u003cbr>\u003cem>GitHub Pages\u003c/em>\u003c/p>","related":[],"thumbnail":"media/Apps/IdeaForge.AI/IdeaForge-AI-img-3c4731-thumb.webp","slug":"ideaforge-ai","imageThumb":"media/Apps/IdeaForge.AI/IdeaForge-AI-img-3c4731-thumb.webp"},{"id":"648","title":"CharGen.AI","category":"Software","tags":["React","TypeScript","LLM Integration"],"image":"media/Apps/CharGen.AI/CharGen-AI-img-163816.webp","description":"\u003cp>The vision model kept rendering muscle definition straight through the shirt.\u003c/p>","longDescription":"\u003cp>The end goal is a fully generative tabletop RPG. I want a player to sit down, generate a character with as much or as little detail as they feel like putting in, and come away with a persona that is actually theirs. Character generation was the first piece I could build.\u003c/p>\u003cp>I started it in Gemini Canvas and the app rotted once the file hit a thousand lines. The interface just broke. I moved it to Cursor and split it into modules, and once it compiled, the model started fighting me on basic logic. The vision pipeline could not handle clothing layers. Describe muscle definition and it rendered bare skin straight through the shirt. I fixed the bleed by looping reference images back through the image model to enforce a consistent outfit.\u003c/p>\u003cp>It runs in two directions now. Dial in conditional attributes and it generates a structured profile with artwork, or feed it reference art and the vision model extracts the physical data. Everything saves in the browser. The next step is generating 3D models from the character art so players can print their miniatures and carry the same character into virtual play.\u003c/p>","video":"","gallery":[{"url":"media/Apps/CharGen.AI/CharGen-AI-img-6aa360.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-6aa360-thumb.webp"},{"url":"media/Apps/CharGen.AI/CharGen-AI-img-163816.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-163816-thumb.webp"},{"url":"media/Apps/CharGen.AI/CharGen-AI-img-f7f947.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-f7f947-thumb.webp"},{"url":"media/Apps/CharGen.AI/CharGen-AI-img-d00041.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-d00041-thumb.webp"},{"url":"media/Apps/CharGen.AI/CharGen-AI-img-b23524.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-b23524-thumb.webp"},{"url":"media/Apps/CharGen.AI/CharGen-AI-img-816af3.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-816af3-thumb.webp"},{"url":"media/Apps/CharGen.AI/CharGen-AI-img-944d5c.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-944d5c-thumb.webp"},{"url":"media/Apps/CharGen.AI/CharGen-AI-img-e21e25.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-e21e25-thumb.webp"},{"url":"media/Apps/CharGen.AI/CharGen-AI-img-0c50f7.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-0c50f7-thumb.webp"},{"url":"media/Apps/CharGen.AI/CharGen-AI-img-9e99e3.webp","thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-9e99e3-thumb.webp"}],"launchLink":"https://elusid108.github.io/CharGen.AI/","githubLink":"https://github.com/Elusid108/CharGen.AI","shopLink":"","files":[],"featured":false,"websiteLink":"","timestamp":"2026-03-22T16:37:25.240Z","wip":true,"order":8,"specs":"\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Framework\u003c/strong>\u003cbr>\u003cem>React 18\u003c/em>\u003c/p>\u003cp>\u003cstrong>Language\u003c/strong>\u003cbr>\u003cem>JavaScript\u003c/em>\u003c/p>\u003cp>\u003cstrong>Build\u003c/strong>\u003cbr>\u003cem>Vite 6\u003c/em>\u003c/p>\u003cp>\u003cstrong>Styling\u003c/strong>\u003cbr>\u003cem>Tailwind CSS\u003c/em>\u003c/p>\u003cp>\u003cstrong>State\u003c/strong>\u003cbr>\u003cem>Zustand\u003c/em>\u003c/p>\u003cp>\u003cstrong>AI\u003c/strong>\u003cbr>\u003cem>Google Gemini (text / vision / native image) • Imagen\u003c/em>\u003c/p>\u003cp>\u003cstrong>Storage\u003c/strong>\u003cbr>\u003cem>IndexedDB\u003c/em>\u003c/p>\u003cp>\u003cstrong>Export\u003c/strong>\u003cbr>\u003cem>JSZip\u003c/em>\u003c/p>\u003cp>\u003cstrong>Deploy\u003c/strong>\u003cbr>\u003cem>GitHub Pages\u003c/em>\u003c/p>","related":[],"thumbnail":"media/Apps/CharGen.AI/CharGen-AI-img-163816-thumb.webp","thumbnailFit":{"scale":1.7,"x":60.6,"y":41.8},"bannerFit":{"scale":1,"x":50,"y":50},"slug":"chargen-ai","imageThumb":"media/Apps/CharGen.AI/CharGen-AI-img-163816-thumb.webp"},{"id":"968","title":"LithoPalletGen","category":"Software","tags":["JavaScript"],"image":"media/Apps/LithoPalletGen/LithoPalletGen-img-a40814.webp","description":"\u003cp>Surface texture broke a single-pixel eyedropper, so I wrote a client-side sampler to average colors from physical filament swatches.\u003c/p>","longDescription":"\u003cp>The sunflower field print is also why I bought a second AMS. Cyan, magenta, yellow and white kept turning our faces maroon. The layer thickness killed the light before the mix could land on anything that looked like skin. More filaments would fix it, but only if I could measure exactly what each one did at each thickness.\u003c/p>\u003cp>So I printed a grid of swatches for every filament, stepped from thin to thick, set them on a light panel, and photographed the whole thing. Reading the photo was the hard part. Printed plastic has surface texture, and a single-pixel eyedropper landed on a ridge or a valley and gave a different answer every time. I wrote an area-averaging sampler that aggregates up to 256 pixels per swatch to find the true color. Collapsible palette sets keep multiple materials straight, and the result exports as a JSON file that LithoLab reads directly.\u003c/p>\u003cp>It is vanilla JavaScript with zero dependencies and runs in the browser. It is the reason the two dozen lithophanes since the sunflower print have skin tones instead of maroon.\u003c/p>","video":"","gallery":[{"url":"media/Apps/LithoPalletGen/LithoPalletGen-img-0119d2.webp","thumbnail":"media/Apps/LithoPalletGen/LithoPalletGen-img-0119d2-thumb.webp"},{"url":"media/Apps/LithoPalletGen/LithoPalletGen-img-a40814.webp","thumbnail":"media/Apps/LithoPalletGen/LithoPalletGen-img-a40814-thumb.webp"}],"launchLink":"https://elusid108.github.io/LithoPalletGen/","githubLink":"https://github.com/Elusid108/LithoPalletGen","shopLink":"","files":[{"name":"0.05mm Calibrated pallet file","url":"media/Apps/LithoPalletGen/files/0.05mm_10layer_9 colors.json","description":"9 color calibrated .json file for LithoLab to 0.05mm layer height increments for use with a 0.2mm nozzle"},{"name":"(0.2mm) 0.05mm swatch","url":"media/Apps/LithoPalletGen/files/(0.2mm) 0.05mm swatch.zip","description":"A 2 material color swatch model to be printed with 0.2mm nozzle and 0.05mm layer height at 100% infill."}],"featured":false,"websiteLink":"","timestamp":"2026-06-11T17:19:00.407Z","wip":false,"order":3,"specs":"\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Language\u003c/strong>\u003cbr>\u003cem>vanilla javascript\u003c/em>\u003c/p>\u003cp>\u003cstrong>Build\u003c/strong>\u003cbr>\u003cem>no-build\u003c/em>\u003c/p>\u003cp>\u003cstrong>Engine\u003c/strong>\u003cbr>\u003cem>canvas API (pixel averaging)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Storage\u003c/strong>\u003cbr>\u003cem>IndexedDB • localstorage\u003c/em>\u003c/p>\u003cp>\u003cstrong>Export\u003c/strong>\u003cbr>\u003cem>PIXEstl JSON (HSL/Hex)\u003c/em>\u003c/p>\u003cp>\u003cstrong>Deploy\u003c/strong>\u003cbr>\u003cem>github pages\u003c/em>\u003c/p>","related":[{"name":"Color lithophane generator","url":"#project/2944"}],"thumbnail":"media/Apps/LithoPalletGen/LithoPalletGen-img-a40814-thumb.webp","slug":"lithopalletgen","imageThumb":"media/Apps/LithoPalletGen/LithoPalletGen-img-a40814-thumb.webp"},{"title":"Field Bench PSU","category":"Tooling","image":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-b580b3.webp","description":"\u003cp>5, 12, or 24 volts off a laptop brick. It went up the ladder instead of the steel bench supply, and lasted until the voltmeter drifted.\u003c/p>","longDescription":"\u003cp>I was testing every pixel product before it went up and re-testing segments after they were installed, and each test meant hauling a steel bench power supply up a ladder or cobbling a test rig together out of bits of the rig I was in the middle of installing. It took a long time every time, and I was doing it constantly. On-site pixel work runs on 5, 12, or 24 volts DC. That is all I needed in the air.\u003c/p>\u003cp>I built a portable supply around a buck-boost converter, printed a PLA enclosure for it, and ran it off a laptop brick. I left a direct USB-C port off the chassis because my print tolerances could not hold one cleanly. Assembling it was a fight. The banana plugs needed an awkward ring-crimp split, and threading the retaining nuts inside that footprint was miserable.\u003c/p>\u003cp>The little box replaced the bench rig completely. It came with me to Que Bueno Suerte! to check blackout pixel tubes on the mezzanine before I cut a single one. It survived a few years of site work until the voltage meter drifted and I retired it.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","Power Distribution","Rapid Prototyping"],"gallery":[{"url":"media/Fabrication/Field Bench PSU/models/Field-Bench-PSU-gfx-1a7bd9.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#505050","opacity":1}],"view":{"theta":-0.9451,"phi":1.0796,"radiusScale":3.275,"panX":-0.0263,"panY":0.0625},"fit":{"scale":1.35,"x":54.6,"y":35.9},"poster":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-gfx-1a7bd9-poster.webp","thumbnail":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-gfx-1a7bd9-poster-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-b580b3.webp","fit":{"scale":1,"x":55.2,"y":40.8},"thumbnail":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-b580b3-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-88aa25.webp","thumbnail":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-88aa25-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-000c57.webp","fit":{"scale":1.2,"x":93,"y":51.9},"thumbnail":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-000c57-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-115657.webp","thumbnail":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-115657-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-bdc9ab.webp","thumbnail":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-bdc9ab-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-53a216.webp","thumbnail":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-53a216-thumb.webp"}],"files":[{"name":"Field Bench PSU.zip","url":"media/Fabrication/Field Bench PSU/files/Field Bench PSU.zip","description":"Printable .3mf of the Field Bench PSU enclosure, ready to slice and assemble (electronics not included).","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-b405fc.webp","thumbnail":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-b405fc-thumb.webp","thumbnailFit":{"scale":1.5,"x":47.5,"y":54}}],"video":"","timestamp":"2026-06-21T22:41:13.337Z","id":"707","order":4,"specs":"\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>BambuLabs • X1C • | • TenLog • TL-D3\u003c/em>\u003c/p>\u003cp>\u003cstrong>Black PLA+\u003c/strong>\u003cbr>\u003cem>Duramic • 1.75mm\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>SolidWorks 2022\u003c/strong>\u003c/p>","related":[],"thumbnailFit":{"scale":1.15,"x":2.2,"y":42.1},"bannerFit":{"scale":1.4,"x":28.2,"y":41.4},"thumbnail":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-b580b3-thumb.webp","slug":"field-bench-psu","imageThumb":"media/Fabrication/Field Bench PSU/Field-Bench-PSU-img-b580b3-thumb.webp"},{"title":"Club Lexi","category":"Lighting","image":"media/Lighting/Club Lexi/Club-Lexi-img-1eb635.webp","description":"\u003cp>Ten-foot basement ceiling, 64 fixtures, no truss. Then I handed the DJs live control and watched them find every weak point.\u003c/p>","longDescription":"\u003cp>Club Lexi is a basement trapped under a ceiling just short of ten feet. If I used standard box truss, patrons would be hitting their heads on the moving lights. I hung the entire lighting system from strut channel anchored straight through the drywall into the joists. Working flush against a ceiling leaves zero room to hide a mess. Everything is exposed. I laid out the fixtures in straight lines so I could bundle the cables into tight runs.\u003c/p>\u003cp>An electrician dropped power on dedicated switches, letting the venue kill half the rig early in the night without touching the software. I packed 64 fixtures into the space. I programmed the presets alone on the dance floor with the music blasting. Putting moving heads right above people means watching every inch of clearance. My rule was to never have all fixture types on at the same time. Firing everything at once in a room that low was blinding and unpleasant.\u003c/p>\u003cp>The venue operates without a technician, so a Wolfmix controller sat in the booth for the DJs. Handing them live control immediately exposed the weak points. They dragged fade times to a crawl and assumed the rig was broken when the lights stopped moving. They also mashed the strobe button until the room was unreadable. I locked the hazer to a low-output toggle, built pre-programmed looks to enforce my lighting rules, and set up a hard reset so they could not trap the program.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Capture","Hand tools","Lighting Design","Power tools","DMX","Power Distribution"],"gallery":[{"url":"media/Lighting/Club Lexi/Club-Lexi-vid-7a34a8.mp4","fit":{"scale":1.25,"x":0,"y":0},"poster":"media/Lighting/Club Lexi/Club-Lexi-vid-7a34a8-poster.webp","thumbnail":"media/Lighting/Club Lexi/Club-Lexi-vid-7a34a8-poster-thumb.webp"},{"url":"media/Lighting/Club Lexi/Club-Lexi-img-1eb635.webp","fit":{"scale":1.1,"x":70.6,"y":35.8},"thumbnail":"media/Lighting/Club Lexi/Club-Lexi-img-1eb635-thumb.webp"},{"url":"media/Lighting/Club Lexi/Club-Lexi-img-c252d3.webp","fit":{"scale":1,"x":51.4,"y":59.7},"thumbnail":"media/Lighting/Club Lexi/Club-Lexi-img-c252d3-thumb.webp"},{"url":"media/Lighting/Club Lexi/Club-Lexi-img-f7d4c4.webp","fit":{"scale":1,"x":50,"y":81.1},"thumbnail":"media/Lighting/Club Lexi/Club-Lexi-img-f7d4c4-thumb.webp"},{"url":"media c/em>\u003c/p>\u003ch2>COMPUTE &amp; CONTROL\u003c/h2>\u003cp>\u003cstrong>Lighting Console (x1)\u003c/strong>\u003cbr>\u003cem>WOLFMIX WMX1 • 4u unlocked\u003c/em>\u003c/p>","related":[],"thumbnailFit":{"scale":1,"x":49.8,"y":32.5},"bannerFit":{"scale":1,"x":63.4,"y":48},"thumbnail":"media/Lighting/Club Lexi/Club-Lexi-img-1eb635-thumb.webp","slug":"club-lexi","imageThumb":"media/Lighting/Club Lexi/Club-Lexi-img-1eb635-thumb.webp"},{"id":"6841","timestamp":"2026-06-21T22:54:46.396Z","title":"The Orb","category":"Fixtures","image":"media/Electronics/The Orb/The-Orb-img-7491fa.webp","description":"\u003cp>The installer walked off and left an eight-foot aluminum sphere in halves. Power had to come 35 feet down the hoist.\u003c/p>","longDescription":"\u003cp>The original installer walked off the job and left the frame in two halves. Nobody sells an 8-foot aluminum orb built to hold a 3D pixel array, so finishing it was the only option. One dome was covered in taped-over pixel modules and black spray paint. I stripped the mess and started over.\u003c/p>\u003cp>Keeping the power supplies in the ceiling left empty space inside the frame for the visual effect, but it meant pushing DC power across a 35-foot run. To beat the voltage drop, I installed supplies with remote sense to adjust output voltage in real time.\u003c/p>\u003cp>The whole rig hung from a hoist. Moving heavy copper without snagging required a PVC pipe flange mounted through the center. I spiral-wrapped welding cables and fed them down through the pipe. That guide kept the cables clean and stopped the sphere from spinning as it dropped to the dance floor every night.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":["Power Distribution","ArtNet","AC/DC Load Calc","Pixel Mapping","SPI","Madrix","Hand tools","TCP/IP","Custom Fabrication","Lighting Design"],"gallery":[{"url":"media/Electronics/The Orb/The-Orb-img-085a34.webp","fit":{"scale":1.35,"x":0,"y":52.3},"thumbnail":"media/Electronics/The Orb/The-Orb-img-085a34-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-438471.webp","fit":{"scale":1.25,"x":35.9,"y":51.8},"thumbnail":"media/Electronics/The Orb/The-Orb-img-438471-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-44a75b.webp","fit":{"scale":1.3,"x":0,"y":62.7},"thumbnail":"media/Electronics/The Orb/The-Orb-img-44a75b-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-vid-a9d048.mp4","poster":"media/Electronics/The Orb/The-Orb-vid-a9d048-poster.webp","thumbnail":"media/Electronics/The Orb/The-Orb-vid-a9d048-poster-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-05c51e.webp","fit":{"scale":1,"x":48.4,"y":20.2},"thumbnail":"media/Electronics/The Orb/The-Orb-img-05c51e-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-62bac8.webp","fit":{"scale":1,"x":41.2,"y":40.8},"thumbnail":"media/Electronics/The Orb/The-Orb-img-62bac8-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-e2c00d.webp","fit":{"scale":1,"x":93,"y":32.3},"thumbnail":"media/Electronics/The Orb/The-Orb-img-e2c00d-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-bbf03f.webp","thumbnail":"media/Electronics/The Orb/The-Orb-img-bbf03f-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-13cc8c.webp","fit":{"scale":1.05,"x":27.5,"y":74.2},"thumbnail":"media/Electronics/The Orb/The-Orb-img-13cc8c-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-907c78.webp","fit":{"scale":1,"x":45.9,"y":38.6},"thumbnail":"media/Electronics/The Orb/The-Orb-img-907c78-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-vid-6b472c.mp4","poster":"media/Electronics/The Orb/The-Orb-vid-6b472c-poster.webp","thumbnail":"media/Electronics/The Orb/The-Orb-vid-6b472c-poster-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-vid-3ff733.mp4","poster":"media/Electronics/The Orb/The-Orb-vid-3ff733-poster.webp","thumbnail":"media/Electronics/The Orb/The-Orb-vid-3ff733-poster-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-7839a4.webp","fit":{"scale":1.1,"x":47.4,"y":58.5},"thumbnail":"media/Electronics/The Orb/The-Orb-img-7839a4-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-b56c27.webp","fit":{"scale":1.25,"x":76,"y":45.9},"thumbnail":"media/Electronics/The Orb/The-Orb-img-b56c27-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-3e56bf.webp","fit":{"scale":1.25,"x":68.1,"y":42.9},"thumbnail":"media/Electronics/The Orb/The-Orb-img-3e56bf-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-967f89.webp","fit":{"scale":1,"x":52,"y":58.9},"thumbnail":"media/Electronics/The Orb/The-Orb-img-967f89-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-d21e83.webp","fit":{"scale":1.45,"x":49.8,"y":38.8},"thumbnail":"media/Electronics/The Orb/The-Orb-img-d21e83-thumb.webp"},{"url":"media/Electronics/The Orb/The-Orb-img-b6b7d0.webp","fit":{"scale":1,"x":52.5,"y":26.5,"rotate":0},"thumbnail":"media/Electronics/The Orb/The-Orb-img-b6b7d0-thumb.webp"}],"files":[],"video":"","order":0,"specs":"","related":[{"name":"Temple Denver","url":"#project/4382"},{"name":"Chain Hoist Service","url":"#project/989"}],"thumbnailFit":{"scale":1.55,"x":5.4,"y":37.1},"bannerFit":{"scale":1.2,"x":49.8,"y":29.8},"thumbnail":"media/Electronics/The Orb/The-Orb-img-7491fa-thumb.webp","slug":"the-orb","imageThumb":"media/Electronics/The Orb/The-Orb-img-7491fa-thumb.webp"},{"title":"The Basement","category":"Lighting","image":"media/Lighting/The Basement/The-Basement-img-072b2e.webp","description":"\u003cp>I really don't like looking straight at a light source. Sixty-two slats, four inches under bare concrete, every strand aimed up.\u003c/p>","longDescription":"\u003cp>The basement at Triangle had a concrete ceiling at 10ft high. I despise looking directly at bare light sources. Instead of covering an overhead array in standard diffusion, I decided to bounce the light. A carpenter hung 62 slats under the concrete, leaving a four-inch gap. I mounted a 20-pixel strand on top of each slat, pointing straight up.\u003c/p>\u003cp>I prepped the strands on the ground and wired them as the carpenter worked. I also hung moving lights in the remaining space. That meant rotary-hammering strut channel directly into the ceiling. You get really good at working one-handed when you have to balance on a ladder, hold a fifteen-pound fixture, and thread a bolt. During testing, a loose connection caused the ground to drop and the pixels to flicker. I had zip-tied the wiring tight. With only four inches of clearance, I couldn't squeeze my hands in to pull the cables down. I had to pry the slats back off the ceiling to fix the joints.\u003c/p>\u003cp>I isolated the power supplies in an adjacent room. I didn't know fanless supplies existed then, but the quiet room made programming easier. When the rig ran, you never saw a source. The reflected wash bled through the gaps and filled the negative space. It took fluid and fire effects perfectly, and hiding the hardware kept a low room from feeling crowded.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","DMX","Hand tools","Lighting Design","Pixel Mapping","MIDI","Power tools","Power Distribution","Resolume Arena","SPI","TCP/IP","Video Mapping"],"gallery":[{"url":"media/Lighting/The Basement/The-Basement-img-072b2e.webp","fit":{"scale":1,"x":50,"y":70},"thumbnail":"media/Lighting/The Basement/The-Basement-img-072b2e-thumb.webp"},{"url":"media/Lighting/The Basement/The-Basement-vid-e486ee.mp4","fit":{"scale":1.15,"x":100,"y":31.1},"poster":"media/Lighting/The Basement/The-Basement-vid-e486ee-poster.webp","thumbnail":"media/Lighting/The Basement/The-Basement-vid-e486ee-poster-thumb.webp"},{"url":"media/Lighting/The Basement/The-Basement-vid-4382d2.mp4","fit":{"scale":1.2,"x":15.4,"y":100},"poster":"media/Lighting/The Basement/The-Basement-vid-4382d2-poster.webp","thumbnail":"media/Lighting/The Basement/The-Basement-vid-4382d2-poster-thumb.webp"},{"url":"media/Lighting/The Basement/The-Basement-vid-096503.mp4","fit":{"scale":1.2,"x":81.4,"y":100,"rotate":0},"poster":"media/Lighting/The Basement/The-Basement-vid-096503-poster.webp","thumbnail":"media/Lighting/The Basement/The-Basement-vid-096503-poster-thumb.webp"},{"url":"media/Lighting/The Basement/The-Basement-img-f94086.webp","fit":{"scale":1,"x":57.2,"y":46.7},"thumbnail":"media/Lighting/The Basement/The-Basement-img-f94086-thumb.webp"},{"url":"media/Lighting/The Basement/The-Basement-img-60214e.webp","fit":{"scale":1.3,"x":35.7,"y":39.1},"thumbnail":"media/Lighting/The Basement/The-Basement-img-60214e-thumb.webp"},{"url":"media/Lighting/The Basement/The-Basement-img-7dbabb.webp","thumbnail":"media/Lighting/The Basement/The-Basement-img-7dbabb-thumb.webp"},{"url":"media/Lighting/The Basement/The-Basement-img-48e237.webp","thumbnail":"media/Lighting/The Basement/The-Basement-img-48e237-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T22:55:23.650Z","id":"5045","order":15,"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Intimidator Spot 255 IRC (x6)\u003c/strong>\u003cbr>\u003cem>Chauvet • profile • 60w white • 15° • 8 colors + white • 7 rotating gobos + open\u003c/em>\u003c/p>\u003cp>\u003cstrong>Generic UV LED (x6)\u003c/strong>\u003cbr>\u003cem>dmx\u003c/em>\u003c/p>\u003cp>\u003cstrong>Wood Slats (x62)\u003c/strong>\u003cbr>\u003cem>20px\u003c/em>\u003c/p>\u003cp>\u003cstrong>Drink Rails (x3)\u003c/strong>\u003cbr>\u003cem>frost diffusion\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixel Modules (x1500)\u003c/strong>\u003cbr>\u003cem>WS2801 • RGB • 12Vdc\u003c/em>\u003c/p>\u003cp>\u003cstrong>LED Video Panels (x21)\u003c/strong>\u003cbr>\u003cem>480mm x 480mm • 192 x 192 • 2.5P\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x5)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • 12Vdc\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Advatek • Pixlite 16 Long Range MKII\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Receiver (x5)\u003c/strong>\u003cbr>\u003cem>Advatek • PixLite Long Range Receiver\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>LightJams\u003c/em>\u003c/p>\u003cp>\u003cstrong>Video Control\u003c/strong>\u003cbr>\u003cem>Resolume Arena\u003c/em>\u003c/p>","related":[{"name":"LED Video Panel Service","url":"#project/4623"},{"name":"Lighting & SFX Service","url":"#project/1862"}],"thumbnailFit":{"scale":1,"x":52,"y":68.9},"bannerFit":{"scale":1,"x":50,"y":66.9},"thumbnail":"media/Lighting/The Basement/The-Basement-img-072b2e-thumb.webp","slug":"the-basement","imageThumb":"media/Lighting/The Basement/The-Basement-img-072b2e-thumb.webp"},{"title":"Que Bueno Suerte!","category":"Systems","image":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-img-5d2843.webp","description":"\u003cp>Eleven rigs, two floors, one rack. The old software could not fade the mezzanine without moving the whole building.\u003c/p>","longDescription":"\u003cp>The first version ran on ELM on an upstairs server, and it simply could not hand the complex lighting presets I was looking for.\u003c/p>\u003cp>The wiring came first. I ran long-range decoders back to a single rack in the office, and the cable went wherever it had to: under bars, behind walls, above the kitchen ceiling. Retrofitting the big acrylic etchings meant climbing over dining tables while the old adhesive exploded into a fine powder that turned sticky again the second I started sweating. For control, I built an iPad remote with OSCpilot for the touch interface and Show Cockpit to distribute the signal.\u003c/p>\u003cp>The first version of that remote gave the staff too much. Speed, color shifting, individual clip selection, cross-fading. What I learned is that when something does not respond the way a person expects, they push every fader to maximum or minimum. A rig this size in a packed dining room also breaks in predictable ways. Controllers drop data and need a breaker flipped. Wireless fixtures lose signal through a dense crowd. So I locked the iPad down to a few preset playlists the bartenders could not get lost in, and I put a slide-out KVM in the rack so I could fix the routing myself.\u003c/p>\u003cp>Switching the core to Madrix is what finally made it one show. The test was standing in the dining room and watching a slow color shift start at the alabaster bar top, climb the bottle shelves, and roll across the roof liners without a seam.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":["Madrix","ELM","TCP/IP","OSC","OSCpilot","MIDI","sACN","ArtNet","WLED","Pixel Mapping","Show Cockpit","Custom Fabrication","Power Distribution"],"gallery":[{"url":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-img-5d2843.webp","thumbnail":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-img-5d2843-thumb.webp"},{"url":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-img-a26433.webp","thumbnail":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-img-a26433-thumb.webp"},{"url":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-vid-bc8404.mp4","fit":{"scale":1,"x":50.2,"y":49.4},"poster":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-vid-bc8404-poster.webp","thumbnail":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-vid-bc8404-poster-thumb.webp"},{"url":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-vid-4e964a.mp4","fit":{"scale":1.25,"x":100,"y":35.3},"poster":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-vid-4e964a-poster.webp","thumbnail":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-vid-4e964a-poster-thumb.webp"},{"url":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-img-2c08a5.webp","fit":{"scale":1,"x":47.7,"y":28.9},"thumbnail":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-img-2c08a5-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T23:26:29.795Z","id":"4113","order":0,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x22800)\u003c/strong>\u003cbr>\u003cem>WS2814 • WS2815 • SK6812\u003c/em>\u003c/p>\u003ch2>COMPUTE &amp; CONTROL\u003c/h2>\u003cp>\u003cstrong>Custom PC\u003c/strong>\u003cbr>\u003cem>rackmount • RTX 2080 TI • slide-out KVM\u003c/em>\u003c/p>\u003cp>\u003cstrong>iPad Remote\u003c/strong>\u003cbr>\u003cem>OSC/Pilot • custom touch control\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Advatek PixLite 16 MK2 (x6)\u003c/strong>\u003cbr>\u003cem>Bar Tubes\u003c/em>\u003c/p>\u003cp>\u003cstrong>Athom WLED Decoders\u003c/strong>\u003cbr>\u003cem>Acrylic Etchings\u003c/em>\u003c/p>\u003cp>\u003cstrong>Advatek T8-S MK3 (x2)\u003c/strong>\u003cbr>\u003cem>Alabaster Bar Top • Bar Kicker • Backsplash • Curved Bottle Display • Epoxy Wedges • Pyramid • Blackout Tubes • Mezzanine Tubes • Patio Lights • Roof-Line\u003c/em>\u003c/p>\u003cp>\u003cstrong>Advatek T4-DS (x11)\u003c/strong>\u003cbr>\u003cem>Alabaster Bar Top • Bar Kicker • Backsplash • Curved Bottle Display • Epoxy Wedges • Pyramid • Blackout Tubes • Mezzanine Tubes • Roof-Line\u003c/em>\u003c/p>","related":[{"name":"Mezz tubes","url":"#project/1612"},{"name":"Mezzanine Bar","url":"#project/9280"},{"name":"Pyramid Steps","url":"#project/1088"},{"name":"Curved bottle shelf","url":"#project/6808"},{"name":"Vertical bar tubes","url":"#project/4411"},{"name":"Bar Backsplash","url":"#project/7026"},{"name":"Alabaster Bar Top","url":"#project/9525"},{"name":"Bar Kicker","url":"#project/468"},{"name":"Pixel Louver Lights","url":"#project/2052"},{"name":"LED PSU Boot Sequencer","url":"#project/1430"},{"name":"Architectural Lighting","url":"#project/299"}],"thumbnail":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-img-5d2843-thumb.webp","slug":"que-bueno-suerte","imageThumb":"media/Integration/Que Bueno Suerte!/Que-Bueno-Suerte-img-5d2843-thumb.webp"},{"title":"Bar Tubes","category":"Fixtures","image":"media/Electronics/Bar Tubes/Bar-Tubes-img-b40f69.webp","description":"\u003cp>393 recycled fluorescent tubes, hung in threes, all brittle. A ladder on a flexing ceiling grid is a strong argument for backup data lines.\u003c/p>","longDescription":"\u003cp>The array over the main bar was 393 recycled fluorescent tubes hung in clusters of three. They came with the building and needed serious help. The materials were brittle. If I wasn't locked into saving the original bundles, I would have used plastic tubes and found a better way to hang them.\u003c/p>\u003cp>Because the restaurant was open every day, I could only pull down a few clusters at a time. I stood on a telescoping ladder resting on the ceiling grid, which flexed just enough to make every climb interesting. I lowered the clusters, broke the old wraps, and pulled the dead strip from the center. I swapped the tape for WS2813 LEDs. The backup data line meant a single failed pixel wouldn't force another ladder climb. Up in the power boxes, I gutted the undocumented decoders and wired in Advatek PixLite 16 MK2s. When I first fired the rig up, the current blew the inline fuses. I bumped the fuses to seven amps per tube, and the rig stabilized.\u003c/p>\u003cp>Keeping the original pixel density meant the display needed 70 universes to run. I built a 3D voxel map of the layout to push effects through the depth of the room. The tubes hang at uneven lengths, but the rebuilt bundles survived the daily grind of an open bar, and the backup data lines kept me off that flexing ceiling grid.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Madrix","ELM","TCP/IP","Pixel Mapping","SPI","Repair","Wire-to-Board Soldering","AC/DC Load Calc","Lighting Design","Power Distribution","Hand tools"],"gallery":[{"url":"media/Electronics/Bar Tubes/Bar-Tubes-img-b40f69.webp","thumbnail":"media/Electronics/Bar Tubes/Bar-Tubes-img-b40f69-thumb.webp"},{"url":"media/Electronics/Bar Tubes/Bar-Tubes-vid-16ac16.mp4","poster":"media/Electronics/Bar Tubes/Bar-Tubes-vid-16ac16-poster.webp","thumbnail":"media/Electronics/Bar Tubes/Bar-Tubes-vid-16ac16-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/Bar-Tubes-vid-316f4d.mp4","poster":"media/Electronics/Bar Tubes/Bar-Tubes-vid-316f4d-poster.webp","thumbnail":"media/Electronics/Bar Tubes/Bar-Tubes-vid-316f4d-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/Bar-Tubes-vid-c80934.mp4","poster":"media/Electronics/Bar Tubes/Bar-Tubes-vid-c80934-poster.webp","thumbnail":"media/Electronics/Bar Tubes/Bar-Tubes-vid-c80934-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/Bar-Tubes-vid-2c44c2.mp4","poster":"media/Electronics/Bar Tubes/Bar-Tubes-vid-2c44c2-poster.webp","thumbnail":"media/Electronics/Bar Tubes/Bar-Tubes-vid-2c44c2-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/Bar-Tubes-vid-9a3265.mp4","poster":"media/Electronics/Bar Tubes/Bar-Tubes-vid-9a3265-poster.webp","thumbnail":"media/Electronics/Bar Tubes/Bar-Tubes-vid-9a3265-poster-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T23:30:44.785Z","id":"4411","order":4,"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Short Tubes (x62)\u003c/strong>\u003cbr>\u003cem>4ft • 60px\u003c/em>\u003c/p>\u003cp>\u003cstrong>Long tubes (x69)\u003c/strong>\u003cbr>\u003cem>8ft • 120px\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x11880)\u003c/strong>\u003cbr>\u003cem>198m • WS281x • RGB 60px/m • 5Vdc\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x6)\u003c/strong>\u003cbr>\u003cem>5Vdc\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x6)\u003c/strong>\u003cbr>\u003cem>Advatek • PixLite 16 MK12\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Bar Backsplash","url":"#project/7026"},{"name":"Alabaster Bar Top","url":"#project/9525"},{"name":"Bar Kicker","url":"#project/468"}],"thumbnailFit":{"scale":1.1,"x":33.8,"y":9.4},"bannerFit":{"scale":1.2,"x":30.8,"y":41},"thumbnail":"media/Electronics/Bar Tubes/Bar-Tubes-img-b40f69-thumb.webp","slug":"bar-tubes","imageThumb":"media/Electronics/Bar Tubes/Bar-Tubes-img-b40f69-thumb.webp"},{"title":"Negative \"X\"","category":"Art","image":"media/Art/Negative _X_/Negative-X-img-5ce892.webp","description":"\u003cp>Blocking each cell's center turns 256 pixels into 1,024 converging arrows. It also still catches the print head.\u003c/p>","longDescription":"\u003cp>A gobo is a stencil you drop in front of a stage light to shape the beam. I wanted the pixel equivalent. So instead of an open cell over each LED, I modeled 256 cells with a solid X standing in the middle of every one. Off, the piece is a plain square. On, the X blocks the center of each light and a single square pixel becomes four arrows converging on a point. Run a fluid pattern across it and all those identical obstructions go fuzzy and ripply at once.\u003c/p>\u003cp>It is the piece that fights me. The first print failed when the nozzle dragged across the X pattern and shifted the layers. Printing the face against the build plate helped but never made it reliable. Even on the X1C, the wall thickness inside the X shapes still catches the print head on some runs. When one does finish, a one-millimeter PLA face gives enough diffusion without bleeding between cells, and a current cap in the controller keeps the all-plastic frame from warping under its own heat.\u003c/p>\u003cp>A good copy hung at Glow Lounge for several months.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Rapid Prototyping","Custom Fabrication","Lighting Design"],"gallery":[{"url":"media/Art/Negative _X_/models/Negative-X-gfx-617323.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":-0.0085,"phi":0,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.2,"x":75.4,"y":34.6},"poster":"media/Art/Negative _X_/Negative-X-gfx-617323-poster.webp","thumbnail":"media/Art/Negative _X_/Negative-X-gfx-617323-poster-thumb.webp"},{"url":"media/Art/Negative _X_/Negative-X-vid-c8bbde.mp4","fit":{"scale":1.1,"x":57.6,"y":31.8},"poster":"media/Art/Negative _X_/Negative-X-vid-c8bbde-poster.webp","thumbnail":"media/Art/Negative _X_/Negative-X-vid-c8bbde-poster-thumb.webp"},{"url":"media/Art/Negative _X_/Negative-X-img-610f62.webp","thumbnail":"media/Art/Negative _X_/Negative-X-img-610f62-thumb.webp"},{"url":"media/Art/Negative _X_/Negative-X-img-36541e.webp","thumbnail":"media/Art/Negative _X_/Negative-X-img-36541e-thumb.webp"},{"url":"media/Art/Negative _X_/Negative-X-img-b38619.webp","fit":{"scale":1.4,"x":34.4,"y":24.5},"thumbnail":"media/Art/Negative _X_/Negative-X-img-b38619-thumb.webp"}],"files":[{"name":"Negative X.zip","url":"media/Art/Negative _X_/files/Negative X.zip","description":"Multi‑plate .3mf with every printed part for the Negative X, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Negative _X_/Negative-X-img-a65285.webp","thumbnail":"media/Art/Negative _X_/Negative-X-img-a65285-thumb.webp","thumbnailFit":{"scale":1.35,"x":65.2,"y":51.4}}],"video":"","timestamp":"2026-07-02T22:15:06.716Z","id":"2285","order":13,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Zig-Zag","url":"#project/7412"},{"name":"Seed of Life","url":"#project/9896"}],"thumbnailFit":{"scale":1.3,"x":50.2,"y":48.3},"bannerFit":{"scale":1,"x":59,"y":36.6},"thumbnail":"media/Art/Negative _X_/Negative-X-img-5ce892-thumb.webp","slug":"negative-x","imageThumb":"media/Art/Negative _X_/Negative-X-img-5ce892-thumb.webp"},{"title":"Seed of Life","category":"Art","image":"media/Art/Seed of Life/Seed-of-Life-img-c3c47d.webp","description":"\u003cp>The proof of concept for a sub-series. The corners curled, the grid went soft, and it still hung at Glow Lounge for months.\u003c/p>","longDescription":"\u003cp>Off, it is a white square. Lit in clusters, you see fragments of a pattern. The full Seed of Life only appears when every pixel is on. I built it as a proof of concept, to find out whether a subdivided matrix behind a printed face would actually read.\u003c/p>\u003cp>I printed it face down so the front came out clean, with a one-millimeter face thin enough to pass light and thick enough to hide the black walls behind it. At a ten-millimeter throw there was no need to bounce anything. What I did not account for was heat. I ran the early tests at full brightness inside a sealed enclosure, and over time the corners curled, the internal grid softened enough to move by hand, and the whole unit bowed away from the wall.\u003c/p>\u003cp>It survived, and it taught me the two things every one of these panels now has: vents in the back, and a current limit in the firmware. It hung at Glow Lounge for several months next to Negative \"X\".\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Lighting Design","Rapid Prototyping","Custom Fabrication"],"gallery":[{"url":"media/Art/Seed of Life/models/Seed-of-Life-gfx-5268b5.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":0.0091,"phi":0,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.15,"x":53.1,"y":33.7},"poster":"media/Art/Seed of Life/Seed-of-Life-gfx-5268b5-poster.webp","thumbnail":"media/Art/Seed of Life/Seed-of-Life-gfx-5268b5-poster-thumb.webp"},{"url":"media/Art/Seed of Life/Seed-of-Life-vid-0c1c03.mp4","fit":{"scale":1,"x":51.1,"y":39.8,"rotate":0},"poster":"media/Art/Seed of Life/Seed-of-Life-img-dc2be0.webp","thumbnail":"media/Art/Seed of Life/Seed-of-Life-img-dc2be0-thumb.webp"},{"url":"media/Art/Seed of Life/Seed-of-Life-img-a0f17a.webp","fit":{"scale":1.15,"x":97,"y":31.8},"thumbnail":"media/Art/Seed of Life/Seed-of-Life-img-a0f17a-thumb.webp"},{"url":"media/Art/Seed of Life/Seed-of-Life-img-10b124.webp","fit":{"scale":1.1,"x":64.1,"y":45.5},"thumbnail":"media/Art/Seed of Life/Seed-of-Life-img-10b124-thumb.webp"},{"url":"media/Art/Seed of Life/Seed-of-Life-img-e79cc2.webp","fit":{"scale":1,"x":55.5,"y":62.9},"thumbnail":"media/Art/Seed of Life/Seed-of-Life-img-e79cc2-thumb.webp"},{"url":"media/Art/Seed of Life/Seed-of-Life-img-ed8dbf.webp","fit":{"scale":1,"x":47.7,"y":30.6},"thumbnail":"media/Art/Seed of Life/Seed-of-Life-img-ed8dbf-thumb.webp"}],"files":[{"name":"Seed of Life.zip","url":"media/Art/Seed of Life/files/Seed of Life.zip","description":"Multi‑plate .3mf with every printed part for the Seed of Life, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Seed of Life/Seed-of-Life-img-7f7ea6.webp","thumbnail":"media/Art/Seed of Life/Seed-of-Life-img-7f7ea6-thumb.webp","thumbnailFit":{"scale":1.2,"x":62.1,"y":48.4}}],"video":"","timestamp":"2026-07-02T22:16:10.943Z","id":"9896","order":14,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"X","url":"#project/7080"},{"name":"Dot Matrix","url":"#project/5202"},{"name":"Inverted Triangles","url":"#project/6865"},{"name":"Negative \"X\"","url":"#project/2285"},{"name":"Circles Corner","url":"#project/2451"},{"name":"Zig-Zag","url":"#project/7412"}],"thumbnailFit":{"scale":1.4,"x":45.8,"y":57.9},"bannerFit":{"scale":1.55,"x":100,"y":52.3},"thumbnail":"media/Art/Seed of Life/Seed-of-Life-img-c3c47d-thumb.webp","slug":"seed-of-life","imageThumb":"media/Art/Seed of Life/Seed-of-Life-img-c3c47d-thumb.webp"},{"title":"Celtic Owl","category":"Art","image":"media/Art/Celtic Owl/Celtic-Owl-img-eba219.webp","description":"\u003cp>My workstation crashes on any grid bigger than 16x16. Cutting 256 cells out of Celtic knotwork sat exactly at that limit.\u003c/p>","longDescription":"\u003cp>Off, this reads as a lithophane: a white owl carved in Celtic knotwork, sitting in a black frame. Turn it on and a 16 x 16 grid of light cuts straight through the carving lines. That collision was the idea, a rigid geometric matrix living inside an organic relief.\u003c/p>\u003cp>My workstation laptop crashes if I try to compute an internal grid bigger than 16 by 16, and this piece sat right at that edge. I bought an owl model online and split the work between SolidWorks and Blender, and subtracting 256 cells out of the knotwork was about all the hardware could take. The early prints leaked light everywhere. Stopping the bleed first meant 0.8 mm walls, which took two passes of the nozzle and never came out clean. Moving the job to the X1C with an AMS solved it. A double wall of 0.4 mm black PLA+ now isolates every cell.\u003c/p>\u003cp>The owl looks like a carving until you plug it in.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Rapid Prototyping","Lighting Design","Custom Fabrication","Blender"],"gallery":[{"url":"media/Art/Celtic Owl/models/Celtic-Owl-gfx-1f0aa9.glb","type":"model","format":"3mf","up":"z","parts":[{"name":"Part_1","color":"#9ca3af","opacity":1},{"name":"Part_2","color":"#000000","opacity":1}],"view":{"theta":0.0032,"phi":0.3845,"radiusScale":3.275,"panX":0,"panY":0},"fit":{"scale":1.25,"x":62.1,"y":33.1},"poster":"media/Art/Celtic Owl/Celtic-Owl-gfx-1f0aa9-poster.webp","thumbnail":"media/Art/Celtic Owl/Celtic-Owl-gfx-1f0aa9-poster-thumb.webp"},{"url":"media/Art/Celtic Owl/Celtic-Owl-vid-b755f0.mp4","poster":"media/Art/Celtic Owl/Celtic-Owl-vid-b755f0-poster.webp","thumbnail":"media/Art/Celtic Owl/Celtic-Owl-vid-b755f0-poster-thumb.webp"},{"url":"media/Art/Celtic Owl/Celtic-Owl-img-5daad7.webp","thumbnail":"media/Art/Celtic Owl/Celtic-Owl-img-5daad7-thumb.webp"},{"url":"media/Art/Celtic Owl/Celtic-Owl-img-049416.webp","thumbnail":"media/Art/Celtic Owl/Celtic-Owl-img-049416-thumb.webp"},{"url":"media/Art/Celtic Owl/Celtic-Owl-img-b047b3.webp","thumbnail":"media/Art/Celtic Owl/Celtic-Owl-img-b047b3-thumb.webp"},{"url":"media/Art/Celtic Owl/Celtic-Owl-img-5ccd93.webp","thumbnail":"media/Art/Celtic Owl/Celtic-Owl-img-5ccd93-thumb.webp"}],"files":[{"name":"Celtic Owl.zip","url":"media/Art/Celtic Owl/files/Celtic Owl.zip","description":"Multi‑plate .3mf with every printed part for the Celtic Owl, ready to slice and assemble. Fits a 16x16 WS2815 matrix (electronics not included). Read SAFETY NOTICE.txt before wiring.","license":"CC BY‑NC‑SA 4.0 — free to print and remix, not for resale.","image":"media/Art/Celtic Owl/Celtic-Owl-img-202e80.webp","thumbnail":"media/Art/Celtic Owl/Celtic-Owl-img-202e80-thumb.webp","thumbnailFit":{"scale":1.35,"x":69.1,"y":54.5}}],"video":"","timestamp":"2026-07-02T23:00:41.951Z","id":"8609","order":2,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x256)\u003c/strong>\u003cbr>\u003cem>WS2815 • RGB • 16 x 16 matrix • black flex pcb • 12Vdc\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>Bambu Labs X1C\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( Black )\u003c/strong>\u003cbr>\u003cem>mask • border\u003c/em>\u003c/p>\u003cp>\u003cstrong>PLA+ ( White )\u003c/strong>\u003cbr>\u003cem>bounce • diffusion\u003c/em>\u003c/p>\u003cp>\u003cstrong>PETG ( Black )\u003c/strong>\u003cbr>\u003cem>frame • internal support\u003c/em>\u003c/p>\u003ch2>EMBEDDED ELECTRONICS\u003c/h2>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>Athom • LS2812B-WLED • ESP8266 • WLED\u003c/em>\u003c/p>","related":[{"name":"Scream-Face","url":"#project/1829"},{"name":"Face","url":"#project/4827"},{"name":"Bubblescape","url":"#project/9191"}],"thumbnailFit":{"scale":1.4,"x":37.5,"y":35.6,"rotate":-1},"bannerFit":{"scale":1.45,"x":47.5,"y":32.8,"rotate":-1},"thumbnail":"media/Art/Celtic Owl/Celtic-Owl-img-eba219-thumb.webp","slug":"celtic-owl","imageThumb":"media/Art/Celtic Owl/Celtic-Owl-img-eba219-thumb.webp"},{"title":"Lobby Wall","category":"Fixtures","image":"media/Electronics/Lobby Wall/Lobby-Wall-img-ce2fe2.webp","description":"\u003cp>We spent weeks in the basement soldering five thousand joints by hand, then hung this double-sided array in five days.\u003c/p>","longDescription":"\u003cp>I didn't know you could buy pre-made LED pixel strands. I was just figuring out that addressable pixels existed at all, and they were hard to source. Instead, I built a double-sided LED wall from scratch.\u003c/p>\u003cp>Another tech and I spent weeks in the basement building modular panels. We cut 2' x 4' pegboard sheets. We contact-cemented 8 raw LED pucks to each board. We manually soldered custom wire lengths using 4 conductor wire. We made over 5000 solder joints by hand before we ever hung a panel.\u003c/p>\u003cp>We mounted the rows of pegboard to the lobby wall and covered both sides with frosted plexiglass on standoffs. I wired each row to a SanDevices E682, which is essentially a Christmas light decoder. The initial test run was rough. The pixels flickered badly across the entire wall. I didn't know about power injection yet. I added inline resistors at the inputs to smooth out the data signal, and I retrofitted power injection later.\u003c/p>\u003cp>We had to get the modules out of the basement and onto the wall without shutting the club down. We had exactly five days between open weekends to hang the panels, wire the decoders, and map the array in Madrix. The wall was running when the doors opened that Thursday.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Custom Fabrication","Embedded Systems","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Through-Hole Soldering"],"gallery":[{"url":"media/Electronics/Lobby Wall/Lobby-Wall-vid-af5636.mp4","fit":{"scale":1.35,"x":79.6,"y":54.6},"poster":"media/Electronics/Lobby Wall/Lobby-Wall-vid-af5636-poster.webp","thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-vid-af5636-poster-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-vid-81635f.mp4","fit":{"scale":1.25,"x":30.3,"y":100},"poster":"media/Electronics/Lobby Wall/Lobby-Wall-vid-81635f-poster.webp","thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-vid-81635f-poster-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-img-a84df1.webp","fit":{"scale":1.25,"x":100,"y":45.8},"thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-img-a84df1-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-img-63767a.webp","fit":{"scale":1.35,"x":0,"y":25.4},"thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-img-63767a-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-vid-f6c927.mp4","fit":{"scale":1.4,"x":76.9,"y":100},"poster":"media/Electronics/Lobby Wall/Lobby-Wall-vid-f6c927-poster.webp","thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-vid-f6c927-poster-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-img-683856.webp","fit":{"scale":1.5,"x":25.9,"y":100},"thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-img-683856-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-img-392f74.webp","fit":{"scale":1.3,"x":23.8,"y":100},"thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-img-392f74-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-img-a15ae4.webp","fit":{"scale":1.15,"x":100,"y":55},"thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-img-a15ae4-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-img-7a1b5b.webp","fit":{"scale":1,"x":79.5,"y":52.2,"rotate":0},"thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-img-7a1b5b-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-img-11639b.webp","fit":{"scale":2.45,"x":46.9,"y":53.3},"thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-img-11639b-thumb.webp"},{"url":"media/Electronics/Lobby Wall/Lobby-Wall-img-ef56c2.webp","fit":{"scale":1.3,"x":17.6,"y":11.8},"thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-img-ef56c2-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-20T20:00:01.882Z","id":"7590","order":13,"specs":"\u003ch2>FIXTURES &amp; FX\u003c/h2>\u003cp>\u003cstrong>Modular Panels (x65)\u003c/strong>\u003cbr>\u003cem>8px • 2' x 4' • peg board\u003c/em>\u003c/p>\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x520)\u003c/strong>\u003cbr>\u003cem>WS2811 • 6LED/px • 12Vdc\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBTUION\u003c/h2>\u003cp>\u003cstrong>Power Supply (x1)\u003c/strong>\u003cbr>\u003cem>12Vdc\u003c/em>\u003c/p>\u003cp>\u003cstrong>Pixel Decoder (x1)\u003c/strong>\u003cbr>\u003cem>SanDevice E682\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Madrix 3.6\u003c/strong>\u003c/p>","related":[{"name":"Tracks Discotheque ","url":"#project/3671"}],"bannerFit":{"scale":1.2,"x":66.7,"y":47.6},"thumbnail":"media/Electronics/Lobby Wall/Lobby-Wall-img-ce2fe2-thumb.webp","slug":"lobby-wall","imageThumb":"media/Electronics/Lobby Wall/Lobby-Wall-img-ce2fe2-thumb.webp"},{"title":"Curved Liquor Bottle Display","category":"Lighting","image":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-958ee3.webp","description":"\u003cp>I printed 96 louvered tracks with tolerances so tight a solder joint would prevent assembly.\u003c/p>","longDescription":"\u003cp>I refused to put a diffuser over the LEDs and kill the brightness. The liquor display was an open metal grid. I wanted to hit the glass bottles from multiple angles to make them pop. To preserve the throw distance while hiding raw diodes from guests, I needed custom louvered fixtures.\u003c/p>\u003cp>I designed the tracks and ran my 3D printers for a couple of weeks to manufacture 96 units. A flat bracer slid in behind the LED strip to hold it against the plastic. The fit was so tight I had to use un-spliced sections, because a solder joint would not clear the gap. The diodes poked perfectly through the slots. I wired them all at my house, hiding a strain relief inside the end caps.\u003c/p>\u003cp>The metal frame started at hip level. I sat on a checkout table behind it and used foam tape to mount the fixtures into the corners. With nowhere to hide wiring, I wrapped the routing in black tubing and let the stiff bundle support itself across the gaps.\u003c/p>\u003cp>The array tied into the building's Madrix server. It worked cleanly until guests started abandoning drinks on the shelf. Spills dripped down and corroded the unsealed tape. Because my printed tolerances were so tight, waterproof tape would not fit as a replacement. I had to pry five fixtures off the metal and completely rebuild them. I asked management for a sign to not put drinks there.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Custom Fabrication","Pixel Mapping","Lighting Design","Madrix","SPI","sACN","Hand tools","FDM 3D Printing","ELM","AC/DC Load Calc"],"gallery":[{"url":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-0565c3.webp","fit":{"scale":1.1,"x":0,"y":100},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-0565c3-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-2d9704.webp","fit":{"scale":1.15,"x":0,"y":97.2},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-2d9704-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-vid-896bb5.mp4","fit":{"scale":1.05,"x":38.2,"y":100},"poster":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-vid-896bb5-poster.webp","thumbnail":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-vid-896bb5-poster-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-vid-05cc89.mp4","fit":{"scale":1.45,"x":77.8,"y":40.9},"poster":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-vid-05cc89-poster.webp","thumbnail":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-vid-05cc89-poster-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-vid-e2d073.mp4","fit":{"scale":1.15,"x":6.7,"y":68.7},"poster":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-vid-e2d073-poster.webp","thumbnail":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-vid-e2d073-poster-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-5b47b6.webp","fit":{"scale":1.2,"x":99.1,"y":14.3},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-5b47b6-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-16c266.webp","fit":{"scale":1.55,"x":65.3,"y":49.9},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-16c266-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-510b85.webp","fit":{"scale":1,"x":57.9,"y":55.7},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-510b85-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-20T21:09:12.884Z","id":"6808","order":6,"specs":"\u003ch2>PIXELS &amp; DISPLAY\u003c/h2>\u003cp>\u003cstrong>LED Pixels (x1152)\u003c/strong>\u003cbr>\u003cem>19.2m • WS2815 • RGB • 60px/m • 12Vdc\u003c/em>\u003c/p>\u003ch2>POWER &amp; DISTRIBUTION\u003c/h2>\u003cp>\u003cstrong>Power Supplies (x1)\u003c/strong>\u003cbr>\u003cem>MEAN WELL • HLG-320H-12 • 12Vdc • 22A\u003c/em>\u003c/p>\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>Louver Lights (x96)\u003c/strong>\u003cbr>\u003cem>custom • 3D printed • 45deg • louvers • corner fixture\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>Pixel Control\u003c/strong>\u003cbr>\u003cem>Madrix 5.x\u003c/em>\u003c/p>","related":[{"name":"Control system","url":"#project/4113"},{"name":"Louver lights","url":"#project/2052"}],"bannerFit":{"scale":1.05,"x":85.5,"y":47.5},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-958ee3-thumb.webp","thumbnailFit":{"scale":1.05,"x":53,"y":39.8},"slug":"curved-liquor-bottle-display","imageThumb":"media/Lighting/Curved Liquor Bottle Display/Curved-Liquor-Bottle-Display-img-958ee3-thumb.webp"},{"title":"Temple Denver","category":"Systems","image":"media/Integration/Temple Denver/Temple-Denver-img-473b00.webp","description":"\u003cp>I bridged Resolume and Madrix over NDI until we could read a few words scaled across the room.\u003c/p>","longDescription":"\u003cp>Almost every week a tour manager called to ask whether we could do something else with the video. We sent our specs out in advance, and it did not matter. The big-name DJs would show up with a touring VJ and a drive full of 4K content, and we would watch them try to figure out how to run it on three screens that were each 48 by 48 pixels. The main room's entire resolution was smaller than an app icon. It was comical, and it was also a problem I could somewhat fix.\u003c/p>\u003cp>I needed a bigger canvas without tearing out the hardware. Resolume Arena was already pushing slices of video to the converter boxes for the screens, and Madrix was driving the floor-to-ceiling frosted pixel pillars. I bridged the two machines over NDI so content could cross between them, then networked the Road Hog console to send DMX triggers to the video rig, the pillars, the orb, and the hallway computers. That gave us live master intensity and speed for the whole room from one desk.\u003c/p>\u003cp>Mapping a low-resolution mesh onto the pillars was the headache. The pixel spacing was not an even grid, so scaling an irregular shape across the walls never quite lined up. If I were starting from scratch I would run everything through Madrix. But combined, the room became one uninterrupted canvas just under 200 pixels wide. The test was text. Once we could scale a few words down and read them across the whole room, it was one show, and the touring VJs had somewhere to put their content.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["DMX","ArtNet","sACN","MIDI","Madrix","Resolume Arena","TCP/IP","Video Mapping","Pixel Mapping","NDI","SPI","Roadhog 4"],"gallery":[{"url":"media/Integration/Temple Denver/Temple-Denver-img-11ff6a.webp","fit":{"scale":1,"x":53.2,"y":100,"rotate":0},"thumbnail":"media/Integration/Temple Denver/Temple-Denver-img-11ff6a-thumb.webp"},{"url":"media/Integration/Temple Denver/Temple-Denver-img-473b00.webp","thumbnail":"media/Integration/Temple Denver/Temple-Denver-img-473b00-thumb.webp"},{"url":"media/Integration/Temple Denver/Temple-Denver-vid-a54683.mp4","poster":"media/Integration/Temple Denver/Temple-Denver-vid-a54683-poster.webp","thumbnail":"media/Integration/Temple Denver/Temple-Denver-vid-a54683-poster-thumb.webp"},{"url":"media/Integration/Temple Denver/Temple-Denver-vid-7eeeba.mp4","poster":"media/Integration/Temple Denver/Temple-Denver-vid-7eeeba-poster.webp","thumbnail":"media/Integration/Temple Denver/Temple-Denver-vid-7eeeba-poster-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-25T16:47:23.504Z","id":"4382","order":2,"specs":"","related":[{"name":"The Orb","url":"#project/6841"},{"name":"Backboard Repair","url":"#project/3965"},{"name":"Entrance Hall","url":"#project/5650"},{"name":"LVL","url":"#project/5416"},{"name":"MIRUS","url":"#project/4939"},{"name":"Lighting & SFX Service","url":"#project/1862"},{"name":"Chain Hoist Service","url":"#project/989"}],"thumbnail":"media/Integration/Temple Denver/Temple-Denver-img-473b00-thumb.webp","slug":"temple-denver","imageThumb":"media/Integration/Temple Denver/Temple-Denver-img-473b00-thumb.webp"},{"title":"Extrusion Centering Sled","category":"Tooling","image":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-eb0950.webp","description":"\u003cp>One pillar with a laser level looked awful. The jig found true center on its own, and the other 160 meters took an afternoon.\u003c/p>","longDescription":"\u003cp>I did one pillar with a laser level and it looked awful. The columns at Temple San Francisco were encased in OSB that came out wavy, so a laser gave me a straight line on a surface that was not straight, and any drift in the vertical LED track was going to mirror across ten pillars in a room full of them. I needed the extrusion to find true center on its own.\u003c/p>\u003cp>I built a four-part 3D printed sled, broken into pieces to beat my printer's build plate. The first prints refused to fit inside the aluminum channel. Once I dialed in the width, the interlocking joints held rigid. I rubbed a yellow china marker on the notched ends so I could reference the outer corner extrusions at any height without measuring.\u003c/p>\u003cp>In use, I slid the jig upward with one hand while I matched the ends to find center, and tacked the extrusion with a pneumatic nailer with the other. The 160 meters of track that had been a multi-day problem took a couple of hours. The wavy casing disappeared behind straight lines.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","Rapid Prototyping","Hand tools","Assembly Design"],"gallery":[{"url":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-eb0950.webp","fit":{"scale":1,"x":52.9,"y":98.7},"thumbnail":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-eb0950-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-96d36d.webp","fit":{"scale":1,"x":54.8,"y":49.5},"thumbnail":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-96d36d-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-30b9f0.webp","fit":{"scale":1.05,"x":53.3,"y":100},"thumbnail":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-30b9f0-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-4feb00.webp","fit":{"scale":1,"x":50,"y":72.9},"thumbnail":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-4feb00-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-afa538.webp","fit":{"scale":1,"x":48.4,"y":81.6},"thumbnail":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-afa538-thumb.webp"}],"files":[],"specs":"\u003ch2>FABRICATION &amp; MATERIALS\u003c/h2>\u003cp>\u003cstrong>3D Printer\u003c/strong>\u003cbr>\u003cem>TenLog • TL-D3\u003c/em>\u003c/p>\u003cp>\u003cstrong>Black PLA+\u003c/strong>\u003cbr>\u003cem>Duramic • 1.75mm\u003c/em>\u003c/p>\u003ch2>SOFTWARE &amp; STACK\u003c/h2>\u003cp>\u003cstrong>SolidWorks 2022\u003c/strong>\u003c/p>","related":[{"name":"Immersive Dance Floor Pillars","url":"#project/6371"}],"video":"","timestamp":"2026-07-26T23:20:01.923Z","id":"5376","order":5,"thumbnailFit":{"scale":1.05,"x":5.3,"y":1.8},"bannerFit":{"scale":1,"x":48.8,"y":41.4},"thumbnail":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-eb0950-thumb.webp","slug":"extrusion-centering-sled","imageThumb":"media/Fabrication/Extrusion Centering Sled/Extrusion-Centering-Sled-img-eb0950-thumb.webp"},{"title":"Immersive Dance Floor Pillars","category":"Fixtures","image":"media/Electronics/Immersive Dance Floor Pillars/Dance-Floor-Pillars-img-2141b9.webp","description":"\u003cp>Ten uneven columns, a hundred years old, and no drilling into structural wood. OSB, drywall mud, and weeks of sanding on a scissor lift.\u003c/p>","longDescription":"\u003cp>I needed ten floor-to-ceiling pillars of recessed pixel tape on the dance floor. The original columns were a hundred years old and made of uneven wood. I was not going to drill into structural supports, and you cannot buy a uniform enclosure that wraps a century-old beam.\u003c/p>\u003cp>I encased the columns in OSB to build a straight box. I mounted mud-in aluminum extrusions to the wood with a pneumatic nailer, then filled the gaps with more board. I plastered everything with drywall mud. That meant spending weeks on a scissor lift with an orbital sander hooked to a shop vac. I primed the columns and painted them flat black. Firing the 320 meters of tape made it look like light was jumping straight out of the concrete.\u003c/p>\u003cp>The wiring had to survive a nightclub dance floor. I sealed the bottoms with silicone caulk and ran the base wiring through thin metal tubing to protect it from kick damage. To fight voltage drop across the four-meter strips, power injection lines hid inside the corner moldings. The pillars took the crowd abuse exactly as built.\u003c/p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Wire-to-Board Soldering","Video Mapping","Resolume Arena"],"gallery":[{"url":"media/Electronics/Immersive Dance Floor Pillars/Dance-Floor-Pillars-img-52677d.webp","fit":{"scale":1.25,"x":58.3,"y":44.9},"thumbnail":"media/Electronics/Immersive Dance Floor Pillars/Dance-Floor-Pillars-img-52677d-thumb.webp"},{"url":"media/Electronics/Im
