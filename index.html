through a USB-C to 5521-DC adapter cable or a 24v 5a brick. I left a direct USB-C port off the chassis because my print tolerances could not hold one cleanly.</p><p>Assembling the wiring inside the box was a challenge. I had to build an awkward ring-crimp split to feed the banana plugs, and threading the retaining nuts on in that cramped footprint was frustrating. The screw terminals on the back of the converter module also fought me as I slid the unit into the shell.</p><p>I first brought it to Que Bueno Suerte to test 5m blackout pixel tubes on the mezzanine, verifying every strip before and after cutting. It survived a few years of site work until the built-in voltage meter drifted out of spec and I retired it.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","Power Distribution","Rapid Prototyping"],"gallery":[{"url":"media/Fabrication/Field Bench PSU/20250317_180727.webp","fit":{"scale":1,"x":55.2,"y":40.8},"thumbnail":"media/Fabrication/Field Bench PSU/20250317_180727-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20210309_094910.webp","thumbnail":"media/Fabrication/Field Bench PSU/20210309_094910-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20210308_074801.webp","fit":{"scale":1.2,"x":93,"y":51.9},"thumbnail":"media/Fabrication/Field Bench PSU/20210308_074801-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20210114_091708.webp","thumbnail":"media/Fabrication/Field Bench PSU/20210114_091708-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20201214_013734.webp","thumbnail":"media/Fabrication/Field Bench PSU/20201214_013734-thumb.webp"},{"url":"media/Fabrication/Field Bench PSU/20201214_012422.webp","thumbnail":"media/Fabrication/Field Bench PSU/20201214_012422-thumb.webp"}],"files":[{"name":"Field Bench PSU","url":"media/Fabrication/Field Bench PSU/files/fieldbenchpsu.zip","description":"Download, print, and assemble the Field Bench PSU. Zip file containing 3mf."}],"video":"","timestamp":"2026-06-21T22:41:13.337Z","id":"707","order":4,"specs":"<p><strong>Designed In:</strong> SolidWorks 2022</p><p><strong>Printed On:</strong> Tenlog TL-D3</p><p><strong>Material:</strong> Black PLA+</p><p><strong>Converter:</strong> Buck-boost · 19V laptop brick input</p><p><strong>Output:</strong> 5V-32V DC · max 5A</p><p><strong>Connectors:</strong> Banana plugs · 5521-DC barrel</p>","related":[],"thumbnailFit":{"scale":1.15,"x":2.2,"y":42.1},"bannerFit":{"scale":1.4,"x":28.2,"y":41.4},"thumbnail":"media/Fabrication/Field Bench PSU/20250317_180727-thumb.webp"},{"title":"Club Lexi","category":"Lighting","image":"media/Lighting/Club Lexi/20230508_171150.webp","description":"<p><strong>CrazyHorse | Denver</strong> - I packed 64 fixtures into a low-ceiling basement club using flush-mounted strut channel and DJ-proofed standalone control.</p>","longDescription":"<p>Club Lexi is a basement with three areas (a lounge, a bar, and a main dance floor), all trapped under a ceiling just short of 10 feet. Patrons could jump and touch the rig. Standard box truss would have eaten too much headroom, so I hung the entire system from strut channel mounted flush to the drywall. Working flush against a ceiling means you have zero room above the fixture to route cable or hide a mess. Everything is exposed. I had an electrician drop power at pre-planned locations on dedicated switches, which let the venue kill half the rig across two zones during early hours without touching the software.</p><p>I ran 64 fixtures over 4 universes on a single Wolfmix WMX1. Fitting hybrid profiles and moving heads into a room that low meant watching every inch of clearance. Because the venue operates without a lighting technician, the WMX1 sat in the booth for the DJs to run standalone.</p><p>Handing live control to DJs immediately exposed the weak points. They would twist knobs, drag fade times to a crawl, and assume the rig was broken when the lights stopped responding. They also loved to mash the strobe button until the room was unreadable, and running a Radiance Hazer from the controller turned into a mess. I locked the hazer to a low-output toggle, set up a hard reset so they couldn't trap the program in a crawl, and let the rig do what I built it to do.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Capture","Custom Fabrication","Hand tools","Lighting Design","Power tools","DMX","Power Distribution"],"gallery":[{"url":"media/Lighting/Club Lexi/Club Lexi Comp.mp4","fit":{"scale":1.25,"x":0,"y":0},"poster":"media/Lighting/Club Lexi/frame-thumb-1786199105703.webp","thumbnail":"media/Lighting/Club Lexi/frame-thumb-1786199105703-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230508_171150.webp","fit":{"scale":1.1,"x":70.6,"y":35.8},"thumbnail":"media/Lighting/Club Lexi/20230508_171150-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230508_163509~2.webp","fit":{"scale":1,"x":51.4,"y":59.7},"thumbnail":"media/Lighting/Club Lexi/20230508_163509~2-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230508_144750.webp","fit":{"scale":1,"x":50,"y":81.1},"thumbnail":"media/Lighting/Club Lexi/20230508_144750-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230509_182124.webp","fit":{"scale":1.65,"x":53.6,"y":89.4},"thumbnail":"media/Lighting/Club Lexi/20230509_182124-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230509_100642.webp","fit":{"scale":1.1,"x":49.6,"y":44.8},"thumbnail":"media/Lighting/Club Lexi/20230509_100642-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230502_170747.webp","thumbnail":"media/Lighting/Club Lexi/20230502_170747-thumb.webp"},{"url":"media/Lighting/Club Lexi/IMG_20230502_160224_412.webp","thumbnail":"media/Lighting/Club Lexi/IMG_20230502_160224_412-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230413_155003.webp","fit":{"scale":1,"x":50.2,"y":31.3},"thumbnail":"media/Lighting/Club Lexi/20230413_155003-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230502_134524.webp","thumbnail":"media/Lighting/Club Lexi/20230502_134524-thumb.webp"},{"url":"media/Lighting/Club Lexi/20230502_224801.mp4","poster":"media/Lighting/Club Lexi/20230502_224801-poster.webp","thumbnail":"media/Lighting/Club Lexi/20230502_224801-poster-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T22:45:09.610Z","id":"6350","order":9,"specs":"<p><strong>Pixel Spot:</strong> 34x PixelDots RGBW</p><p><strong>Profile:</strong> 12x Profile Zoom 150W</p><p><strong>Beye:</strong> 18x 6×40W RGBW</p><p><strong>SFX:</strong> 1x Radiance Hazer</p><p><strong>Universes:</strong> 4 sACN</p><p><strong>Control:</strong> Wolfmix WMX1</p>","related":[],"thumbnailFit":{"scale":1,"x":49.8,"y":32.5},"bannerFit":{"scale":1,"x":63.4,"y":48},"thumbnail":"media/Lighting/Club Lexi/20230508_171150-thumb.webp"},{"id":"6841","timestamp":"2026-06-21T22:54:46.396Z","title":"The Orb","category":"Fixtures","image":"media/Electronics/The Orb/MVIMG_20190303_010156_1 (1).webp","description":"<p><strong>Temple Nightclub | Denver</strong> - I finished an 8 ft aluminum LED sphere and ran high-current DC power over 35 ft.</p>","longDescription":"<p>The original installer walked away mid-job, leaving an 8 ft aluminum sphere sitting in 2 halves on the top-floor. 1 dome was partly covered in LED pixel modules zip-tied to the metal, with tape over the lenses and black spray paint over the rest. Masked strands lay scattered across the floor. I stripped the mess and started over.</p><p>Keeping the power supplies in the ceiling left empty space inside the frame for the 3D effect, but it meant pushing DC power across a 35 ft run. To beat the voltage drop, I installed MEAN WELL supplies with load sharing and remote sense that adjusted output voltage in real time. Every circuit stayed under 80% capacity at 100% white load. Inside the sphere, decoders handled the signal for a 3D voxel map in Madrix.</p><p>The whole rig hung from a hoist that dropped it over the crowd. Moving heavy copper without snagging required a PVC pipe with a flange mounted through the center of the orb. I spiral-wrapped 2/0 welding cables around each other and fed them down through the pipe. That guide kept the cables clean during motion and stopped the sphere from spinning as it traveled.</p><p>We finished the build for New Year's Eve 2018. People on the dance floor mostly miss it, but the surrounding VIP tiers get a clear view of the full voxel map. Every night around midnight, the hoist dropped the sphere with the headliner.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Power Distribution","ArtNet","AC/DC Load Calc","Pixel Mapping","SPI","Madrix","Hand tools","TCP/IP","Custom Fabrication","Lighting Design"],"gallery":[{"url":"media/Electronics/The Orb/IMG_20190105_011459.webp","fit":{"scale":1.35,"x":0,"y":52.3},"thumbnail":"media/Electronics/The Orb/IMG_20190105_011459-thumb.webp"},{"url":"media/Electronics/The Orb/MVIMG_20190309_005437.webp","fit":{"scale":1.25,"x":35.9,"y":51.8},"thumbnail":"media/Electronics/The Orb/MVIMG_20190309_005437-thumb.webp"},{"url":"media/Electronics/The Orb/MVIMG_20190203_004035.webp","fit":{"scale":1.3,"x":0,"y":62.7},"thumbnail":"media/Electronics/The Orb/MVIMG_20190203_004035-thumb.webp"},{"url":"media/Electronics/The Orb/Video Project 10 (1).mp4","poster":"media/Electronics/The Orb/Video Project 10 (1)-poster.webp","thumbnail":"media/Electronics/The Orb/Video Project 10 (1)-poster-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181229_194431.webp","fit":{"scale":1,"x":48.4,"y":20.2},"thumbnail":"media/Electronics/The Orb/IMG_20181229_194431-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181228_174028.webp","fit":{"scale":1,"x":41.2,"y":40.8},"thumbnail":"media/Electronics/The Orb/IMG_20181228_174028-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181230_145358.webp","fit":{"scale":1,"x":93,"y":32.3},"thumbnail":"media/Electronics/The Orb/IMG_20181230_145358-thumb.webp"},{"url":"media/Electronics/The Orb/MVIMG_20190912_124434.webp","fit":{"scale":1.05,"x":27.5,"y":74.2},"thumbnail":"media/Electronics/The Orb/MVIMG_20190912_124434-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181228_171913.webp","fit":{"scale":1,"x":45.9,"y":38.6},"thumbnail":"media/Electronics/The Orb/IMG_20181228_171913-thumb.webp"},{"url":"media/Electronics/The Orb/Video Project 10 (2).mp4","poster":"media/Electronics/The Orb/Video Project 10 (2)-poster.webp","thumbnail":"media/Electronics/The Orb/Video Project 10 (2)-poster-thumb.webp"},{"url":"media/Electronics/The Orb/VID_20181223_161426.mp4","poster":"media/Electronics/The Orb/VID_20181223_161426-poster.webp","thumbnail":"media/Electronics/The Orb/VID_20181223_161426-poster-thumb.webp"},{"url":"media/Electronics/The Orb/ORB2.webp","fit":{"scale":1.1,"x":47.4,"y":58.5},"thumbnail":"media/Electronics/The Orb/ORB2-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181211_233714.webp","fit":{"scale":1.25,"x":76,"y":45.9},"thumbnail":"media/Electronics/The Orb/IMG_20181211_233714-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181211_203336.webp","fit":{"scale":1.25,"x":68.1,"y":42.9},"thumbnail":"media/Electronics/The Orb/IMG_20181211_203336-thumb.webp"},{"url":"media/Electronics/The Orb/IMG_20181218_194230.webp","fit":{"scale":1,"x":52,"y":58.9},"thumbnail":"media/Electronics/The Orb/IMG_20181218_194230-thumb.webp"},{"url":"media/Electronics/The Orb/IMG-20181222-WA0000.webp","fit":{"scale":1.45,"x":49.8,"y":38.8},"thumbnail":"media/Electronics/The Orb/IMG-20181222-WA0000-thumb.webp"}],"files":[],"video":"","order":1,"specs":"<p><strong>Form:</strong> 8 ft aluminum sphere</p><p><strong>Voltage:</strong> 12V DC</p><p><strong>Power:</strong> MEAN WELL (remote sense · load sharing) · 35 ft DC run</p><p><strong>Wiring:</strong> 2/0 welding cable · spiral-wrapped · PVC center pipe</p><p><strong>Decoder:</strong> Pixel decoders (internal)</p><p><strong>Control:</strong> Madrix 5.x (3D voxel)</p>","related":[{"name":"Control system","url":"#project/4382"}],"thumbnailFit":{"scale":1.55,"x":5.4,"y":37.1},"bannerFit":{"scale":1.2,"x":49.8,"y":29.8},"thumbnail":"media/Electronics/The Orb/MVIMG_20190303_010156_1 (1)-thumb.webp"},{"title":"The Basement","category":"Lighting","image":"media/Lighting/The Basement/IMG_20180614_174327.webp","description":"<p><strong>Triangle Bar | Denver</strong> - I bounced upward pixels off ceiling slats to light a 10 ft basement club in Denver.</p>","longDescription":"<p>The basement at Triangle in Denver had a concrete ceiling under 10 ft high. I handled the entire build solo as an independent contractor, covering design, procurement, installation, programming, and training. Hanging moving lights overhead meant rotary-hammering 8 pieces of strut channel directly into the ceiling with 2 to 3 anchor points per piece. Working alone on a ladder, the hardest part was simply holding a fixture in place with one hand while threading a bolt or seating a cable with the other.</p><p>I despise looking directly at bare sources. Instead of covering the overhead array in standard diffusion, I pointed the pixel modules upward to bounce light off the ceiling slats. The reflected light bled through the gaps, creating a smooth gradient overhead without blinding the crowd. I also isolated the power supplies in an adjacent room to keep fan noise out of the club. I did not know fanless supplies existed at the time, but the quiet room made programming and maintenance much easier.</p><p>To bridge the gap from the remote racks to the ceiling array, I used long-range decoders. The run distance was short enough for standard decoders, but I wanted to test the hardware on a live build. During testing, loose connections at 2 points caused the ground to drop and the pixels to flicker. Because pixel runs work cleanly up to a break, finding the fault points was straightforward.</p><p>The indirect wash turned a hidden basement into an intimate club. Venue owners and patrons loved the clean look, and hiding the rig in the ceiling structure kept the low room from feeling crowded.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Custom Fabrication","DMX","Hand tools","Lighting Design","Pixel Mapping","MIDI","Power tools","Power Distribution","Resolume Arena","SPI","TCP/IP","Video Mapping"],"gallery":[{"url":"media/Lighting/The Basement/IMG_20180614_174327.webp","fit":{"scale":1,"x":50,"y":70},"thumbnail":"media/Lighting/The Basement/IMG_20180614_174327-thumb.webp"},{"url":"media/Lighting/The Basement/VID_20180708_050000.mp4","fit":{"scale":1.1,"x":99.7,"y":46.6},"poster":"media/Lighting/The Basement/frame-thumb-1786199318423.webp","thumbnail":"media/Lighting/The Basement/frame-thumb-1786199318423-thumb.webp"},{"url":"media/Lighting/The Basement/VID_20180612_163951 (1).mp4","fit":{"scale":1.2,"x":15.4,"y":100},"poster":"media/Lighting/The Basement/frame-thumb-1786199373574.webp","thumbnail":"media/Lighting/The Basement/frame-thumb-1786199373574-thumb.webp"},{"url":"media/Lighting/The Basement/IMG_20180605_151314.webp","fit":{"scale":1,"x":57.2,"y":46.7},"thumbnail":"media/Lighting/The Basement/IMG_20180605_151314-thumb.webp"},{"url":"media/Lighting/The Basement/IMG_20180610_214856.webp","fit":{"scale":1.3,"x":35.7,"y":39.1},"thumbnail":"media/Lighting/The Basement/IMG_20180610_214856-thumb.webp"},{"url":"media/Lighting/The Basement/IMG_20180611_005701.webp","thumbnail":"media/Lighting/The Basement/IMG_20180611_005701-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T22:55:23.650Z","id":"5045","order":13,"specs":"<p><strong>Strip:</strong> RGBW pixel modules (upward-facing)</p><p><strong>Mount:</strong> 8x strut channel · rotary-hammered into concrete</p><p><strong>Decoder:</strong> Long-range receivers</p><p><strong>Power:</strong> Isolated PSU room (fan noise mitigation)</p><p><strong>Control:</strong> Madrix 5.x</p>","related":[],"thumbnailFit":{"scale":1,"x":52,"y":68.9},"bannerFit":{"scale":1,"x":50,"y":66.9},"thumbnail":"media/Lighting/The Basement/IMG_20180614_174327-thumb.webp"},{"title":"Que Bueno Suerte!","category":"Systems","image":"media/Integration/Que Bueno Suerte!/20240606_211259.webp","description":"<p><strong>Que Bueno Suerte! | Denver</strong> - Over 2 years, I wired 11 custom lighting installations into a single restaurant server rack.</p>","longDescription":"<p>My friend let me perpetually add lighting inside Que Bueno Suerte! over 2 years, eventually totaling 11 distinct installations. With so many LEDs, the system risked overpowering the dining room. Finesse was key. Deep reds, oranges, and yellows looked phenomenal against the gold walls and red accents, but only if the hardware stayed invisible in broad daylight. I ran long-range decoders back to a server rack in the upstairs office. Wires snaked under bars, behind walls, above the kitchen ceiling, and inside rafters upstairs. Retrofitting the acrylic etchings meant climbing over tables while brittle adhesive exploded into fine powder that turned sticky again the second I sweated.</p><p>I built an iPad remote early on using OSCpilot for touch control and Show Cockpit for signal distribution. Originally, I ran ELM on the server because it was cheaper and isolated the different rigs easily. The tradeoff was programming flexibility. I couldn't transition one element at a time without shifting the entire building. Switching to Madrix solved the visual output, creating room looks that shifted together across the mezzanine ceiling, alabaster bartop, bottle shelves, and roof liners.</p><p>A rig of this complexity in a packed restaurant breaks in predictable ways. The PixLite 16 controllers above the main bar occasionally drop data and require a breaker flip to reboot. The wireless etchings lose signal through dense crowds. Outdoor fixtures leak water, break their IP rating, and trip breakers. Even the iPad control drops out if staff connect to the wrong network or the WLAN hiccups.</p><p>To keep the system usable for bartenders during a rush, I locked the iPad interface down to basic parameters and playlists of preset looks. For everything else, I installed a slide-out KVM in the rack so I could fix server issues directly. The fine control over the building proved worth the routing headaches, and the warm palettes still sit right in the room.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Madrix","ELM","TCP/IP","OSC","OSCpilot","MIDI","sACN","ArtNet","WLED","Pixel Mapping","ESP8266","Show Cockpit","Custom Fabrication","Power Distribution"],"gallery":[{"url":"media/Integration/Que Bueno Suerte!/20240606_211259.webp","thumbnail":"media/Integration/Que Bueno Suerte!/20240606_211259-thumb.webp"},{"url":"media/Integration/Que Bueno Suerte!/OSCPilot interface.webp","thumbnail":"media/Integration/Que Bueno Suerte!/OSCPilot interface-thumb.webp"},{"url":"media/Integration/Que Bueno Suerte!/20241105_145848.mp4","fit":{"scale":1,"x":50.2,"y":49.4},"poster":"media/Integration/Que Bueno Suerte!/20241105_145848-poster.webp","thumbnail":"media/Integration/Que Bueno Suerte!/20241105_145848-poster-thumb.webp"},{"url":"media/Integration/Que Bueno Suerte!/20241104_121739~2.mp4","fit":{"scale":1.25,"x":100,"y":35.3},"poster":"media/Integration/Que Bueno Suerte!/frame-thumb-1786736906415.webp","thumbnail":"media/Integration/Que Bueno Suerte!/frame-thumb-1786736906415-thumb.webp"},{"url":"media/Integration/Que Bueno Suerte!/20230222_105213.webp","fit":{"scale":1,"x":47.7,"y":28.9},"thumbnail":"media/Integration/Que Bueno Suerte!/20230222_105213-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T23:26:29.795Z","id":"4113","order":0,"specs":"<p><strong>Pixel:</strong> Madrix 5.x · ELM (deprecated)</p><p><strong>Decoder:</strong> Advatek PixLite 16 (wired) · wireless decoders (acrylic etchings)</p><p><strong>Protocol:</strong> sACN · ArtNet</p><p><strong>GPU:</strong> RTX 2080 Ti</p><p><strong>Server:</strong> Slide-out KVM rack</p><p><strong>Control Surface:</strong> iPad · OSCPilot · Show Cockpit</p><p><strong>Installations:</strong> 11 (see related entries)</p><p><strong>Pixels: </strong>22,800</p>","related":[{"name":"Mezz tubes","url":"#project/1612"},{"name":"Mezzanine Bar","url":"#project/9280"},{"name":"Pyramid Steps","url":"#project/1088"},{"name":"Curved bottle shelf","url":"#project/6808"},{"name":"Vertical bar tubes","url":"#project/4411"},{"name":"Bar Backsplash","url":"#project/7026"},{"name":"Alabaster Bar Top","url":"#project/9525"},{"name":"Bar Kicker","url":"#project/468"}],"thumbnail":"media/Integration/Que Bueno Suerte!/20240606_211259-thumb.webp"},{"title":"Bar Tubes","category":"Fixtures","image":"media/Electronics/Bar Tubes/20240619_122306.webp","description":"<p><strong>Que Bueno Suerte! | Denver</strong> - Rebuilding an inherited array of 131 recycled fluorescent tube bundles over an operating bar required 70 universes of control and a 3D voxel map.</p>","longDescription":"<p>The vertical tubes above the main bar at Que Bueno Suerte! came with the building, and by the time I got to them, they needed serious help. The array was made of 62 four-foot and 69 eight-foot recycled fluorescent tubes hung in clusters of 3, with 60/m density LED tape running down the center. After years above a bar, the materials were brittle, and because the restaurant was open every day, I could only take down a few clusters at a time. I stood on a telescoping ladder resting on the ceiling grid (which flexed enough to make every climb interesting), lowered the clusters onto the bar, broke the old wraps, and pulled the dead strip from the center.</p><p>I kept the original pixel spacing so I wouldn't have to redesign the physical bundle, but I swapped the strip for WS2813 LEDs. The backup data line meant a single failed pixel wouldn't force another sketchy ladder climb over an open bar. Up in the custom power boxes, I gutted the original decoders, which had zero documentation, and replaced them with Advatek PixLite 16s to tie the array into the venue-wide system I installed. When I first fired the rig up, it immediately tripped breakers and blew the inline fuses. I eventually bumped the fuse rating to 7A per tube to handle the inrush, and the rig stabilized.</p><p>Because I was locked into the original 60/m density, the display takes an astronomical 35,640 channels across 70 universes to run. Once the hardware was solid, I built a 3D voxel map of the entire layout. Because the tubes hang at uneven lengths and the display isn't a straight line, clean 3D effects can get lost if you push them too hard. But isolating different zones and mapping through the depth of the room turned a partially dead, inherited fixture into the centerpiece of the bar.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Madrix","ELM","TCP/IP","Pixel Mapping","SPI","Repair","Wire-to-Board Soldering","AC/DC Load Calc","Lighting Design","Power Distribution","Hand tools"],"gallery":[{"url":"media/Electronics/Bar Tubes/20240619_122306.webp","thumbnail":"media/Electronics/Bar Tubes/20240619_122306-thumb.webp"},{"url":"media/Electronics/Bar Tubes/Video Project 18 (1).mp4","poster":"media/Electronics/Bar Tubes/Video Project 18 (1)-poster.webp","thumbnail":"media/Electronics/Bar Tubes/Video Project 18 (1)-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/20241029_100945.mp4","poster":"media/Electronics/Bar Tubes/20241029_100945-poster.webp","thumbnail":"media/Electronics/Bar Tubes/20241029_100945-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/20241029_101122.mp4","poster":"media/Electronics/Bar Tubes/20241029_101122-poster.webp","thumbnail":"media/Electronics/Bar Tubes/20241029_101122-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/20241028_103756.mp4","poster":"media/Electronics/Bar Tubes/20241028_103756-poster.webp","thumbnail":"media/Electronics/Bar Tubes/20241028_103756-poster-thumb.webp"},{"url":"media/Electronics/Bar Tubes/20241029_103556.mp4","poster":"media/Electronics/Bar Tubes/20241029_103556-poster.webp","thumbnail":"media/Electronics/Bar Tubes/20241029_103556-poster-thumb.webp"}],"files":[],"video":"","timestamp":"2026-06-21T23:30:44.785Z","id":"4411","order":3,"specs":"<p><strong>Pixels:</strong> 11,880x WS2813 RGBW</p><p><strong>Strip:</strong> 62x 60px (4ft) · 69x 120px (8ft) · 60/m density</p><p><strong>Channels:</strong> 35,640 (70 universes sACN)</p><p><strong>Voltage:</strong> 12V DC</p><p><strong>Decoder:</strong> Advatek PixLite 16</p><p><strong>Power:</strong> 7A fused per tube · custom power boxes</p><p><strong>Control:</strong> Madrix 5.x</p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"Bar Backsplash","url":"#project/7026"},{"name":"Alabaster Bar Top","url":"#project/9525"},{"name":"Bar Kicker","url":"#project/468"}],"thumbnailFit":{"scale":1.1,"x":33.8,"y":9.4},"bannerFit":{"scale":1.2,"x":30.8,"y":41},"thumbnail":"media/Electronics/Bar Tubes/20240619_122306-thumb.webp"},{"title":"Pixel Negative \"X\"","category":"Sculpture","image":"media/Art/Pixel Negative _X_/negative x fix.webp","description":"<p>An internal X obstruction inside each cell turns a white square into an array of 1024 converging arrows.</p>","longDescription":"<p>I wanted to build the pixel diffusion equivalent of a stage gobo. I designed an X obstruction through the center of 256 isolated cells in SolidWorks. Powered off, the piece sat like a plain square. Powered on, the solid X blocked the center of each WS2815 LED and created 4 arrows pointing toward each other.</p><p>My first attempt on a Tenlog TL-D3 failed when the nozzle dragged across the X pattern and caused layer shifts. Printing directly against the buildplate kept the face flat. A 1 mm PLA+ face provided the right balance of diffusion and opacity without bleeding light between cells.</p><p>I capped the current in WLED on an ATHOM ESP8266 controller to stop the PLA+ from heating and warping. Running fluid patterns across the grid made the uniform obstructions look fuzzy and ripply.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Rapid Prototyping","Custom Fabrication","ESP8266","Lighting Design","Pixel Mapping","Wire-to-Board Soldering"],"gallery":[{"url":"media/Art/Pixel Negative _X_/20230717_155724.webp","thumbnail":"media/Art/Pixel Negative _X_/20230717_155724-thumb.webp"},{"url":"media/Art/Pixel Negative _X_/20230717_155731.webp","thumbnail":"media/Art/Pixel Negative _X_/20230717_155731-thumb.webp"},{"url":"media/Art/Pixel Negative _X_/20230808_152442.webp","fit":{"scale":1.4,"x":34.4,"y":24.5},"thumbnail":"media/Art/Pixel Negative _X_/20230808_152442-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-02T22:15:06.716Z","id":"2285","order":6,"specs":"<p><strong>Medium:</strong> PLA+ (2 material)</p><p><strong>Color:</strong> Black, White</p><p><strong>LEDs: </strong>256 (16x16)</p><p><strong>Driver: </strong>WS2815 (RGB)</p><p><strong>Decoder:</strong> ATHOM (ESP8266)</p><p><strong>Firmware: </strong>WLED</p>","related":[],"thumbnailFit":{"scale":1.3,"x":50.2,"y":48.3},"bannerFit":{"scale":1,"x":59,"y":36.6},"thumbnail":"media/Art/Pixel Negative _X_/negative x fix-thumb.webp"},{"title":"Pixel Seed of Life","category":"Sculpture","image":"media/Art/Pixel Seed of Life/seedoflifefix.webp","description":"<p>A 1mm face printed over a subdivided matrix hides the seed of life until the pixels fire.</p>","longDescription":"<p>I built this as a proof of concept to expand what I could do with subdivided matrices. Printed face down, the piece looks like a white square when turned off. Getting that surface required a 1mm face. That thickness balanced structural stability and light transmission without showing bleedthrough from the black walls behind it. With a 10mm throw, bouncing the light was unnecessary.</p><p>Heat became the immediate problem. Early tests ran at full brightness inside sealed enclosures. Over time, the corners curled and the grid walls softened enough to move by hand. Without vent holes on the back, the units bowed away from the wall as the PLA+ heated up. Adding vents and limiting current in the firmware stopped the deformation.</p><p>Now the symbol stays hidden until the matrix powers on. Lighting large clusters of pixels reveals parts of the pattern across the surface. The complete shape only appears when every pixel is active.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","ESP8266","WLED","SPI","Lighting Design","Rapid Prototyping","Custom Fabrication","Wire-to-Board Soldering","Pixel Mapping"],"gallery":[{"url":"media/Art/Pixel Seed of Life/20230717_155617.webp","fit":{"scale":1.15,"x":97,"y":31.8},"thumbnail":"media/Art/Pixel Seed of Life/20230717_155617-thumb.webp"},{"url":"media/Art/Pixel Seed of Life/20230717_155640.webp","fit":{"scale":1.1,"x":64.1,"y":45.5},"thumbnail":"media/Art/Pixel Seed of Life/20230717_155640-thumb.webp"},{"url":"media/Art/Pixel Seed of Life/20230808_152626.webp","fit":{"scale":1,"x":47.7,"y":30.6},"thumbnail":"media/Art/Pixel Seed of Life/20230808_152626-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-02T22:16:10.943Z","id":"9896","order":7,"specs":"<p><strong>Medium:</strong> PLA+ (2 material)</p><p><strong>Color:</strong> Black, White</p><p><strong>LEDs: </strong>256 (16x16)</p><p><strong>Driver: </strong>WS2815 (RGB)</p><p><strong>Decoder:</strong> ATHOM (ESP8266)</p><p><strong>Firmware: </strong>WLED</p>","related":[],"thumbnailFit":{"scale":1.4,"x":45.8,"y":57.9},"bannerFit":{"scale":1.55,"x":100,"y":52.3},"thumbnail":"media/Art/Pixel Seed of Life/seedoflifefix-thumb.webp"},{"title":"Pixel Celtic Owl","category":"Sculpture","image":"media/Art/Pixel Celtic Owl/frame-thumb-1786238531082.webp","description":"<p>An internally subdivided 16x16 LED matrix housed inside a dual-material relief sculpture of an organic Celtic owl.</p>","longDescription":"<p>My workstation laptop crashes if I calculate an internal grid larger than 16x16. This piece was a test to see if I could map that geometric matrix inside an organic shape. I bought an owl model online and split the workflow between SolidWorks and Blender for the first time. The processing load of subtracting those 256 cells from Celtic knotwork pushed my hardware to its limit.</p><p>Early attempts on a Tenlog TL-D3 IDEX printer leaked light everywhere. Stopping the bleed between cells took 0.8 mm walls of black PLA+, which meant 2 passes with a 0.4 mm nozzle. Moving the job to a Bambu Lab X1C with an AMS unit solved the bleed immediately. A 0.4 mm wall of black PLA+ now isolates every cell cleanly.</p><p>The front relief is thin enough to act like a lithophane. When powered off, it reads as a white carving in a black frame. Turn on the ATHOM ESP8266 controller, and the 16x16 grid cuts straight through the surface lines.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","WLED","SPI","Rapid Prototyping","Lighting Design","ESP8266","Custom Fabrication","Blender","Pixel Mapping","Wire-to-Board Soldering"],"gallery":[{"url":"media/Art/Pixel Celtic Owl/20240203_174318~2.mp4","poster":"media/Art/Pixel Celtic Owl/frame-thumb-1786238531082.webp","thumbnail":"media/Art/Pixel Celtic Owl/frame-thumb-1786238531082-thumb.webp"},{"url":"media/Art/Pixel Celtic Owl/20220315_175407.webp","thumbnail":"media/Art/Pixel Celtic Owl/20220315_175407-thumb.webp"},{"url":"media/Art/Pixel Celtic Owl/20220315_175356.webp","thumbnail":"media/Art/Pixel Celtic Owl/20220315_175356-thumb.webp"},{"url":"media/Art/Pixel Celtic Owl/20220315_175342.webp","thumbnail":"media/Art/Pixel Celtic Owl/20220315_175342-thumb.webp"},{"url":"media/Art/Pixel Celtic Owl/Screenshot 2026-07-02 185618.webp","thumbnail":"media/Art/Pixel Celtic Owl/Screenshot 2026-07-02 185618-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-02T23:00:41.951Z","id":"8609","order":5,"specs":"<p><strong>Medium:</strong> PLA+ (2 material)</p><p><strong>Color:</strong> Black, White</p><p><strong>LEDs: </strong>256 (16x16)</p><p><strong>Driver: </strong>WS2815 (RGB)</p><p><strong>Decoder:</strong> ATHOM (ESP8266)</p><p><strong>Firmware: </strong>WLED</p>","related":[],"thumbnailFit":{"scale":1.25,"x":50.3,"y":33.5},"bannerFit":{"scale":1,"x":47.7,"y":31.8},"thumbnail":"media/Art/Pixel Celtic Owl/frame-thumb-1786238531082-thumb.webp"},{"title":"Lobby Wall","category":"Lighting","image":"media/Lighting/Lobby Wall/0321151647.webp","description":"<p><strong>Tracks | Denver </strong>- I built a double-sided wall of LEDs for Tracks in 5 days after soldering 5000 joints by hand.</p>","longDescription":"<p>Tracks could not close for a remodel, so we had 5 days between open weekends to install a double-sided wall of LEDs and as part of a full remodel. It sits right at the entrance where people walk in. To hit that window, another tech and I spent weeks in the club basement and my home shop building modular panels off site. Each 2x4 pegboard panel held 520 raw LED pucks contact-cemented in 8 pixel configurations. Instead of buying pre-made strands, we manually soldered custom wire lengths using lamp cord for power injection, leaving us with over 5000 solder points before we ever hung a panel.</p><p>We mounted the rows of pegboard modules to the wall and wired each row to a dedicated output on a 16 output SanDevices E682 decoder running WS2801 protocol. Frosted plexiglass sheets on standoffs covered both sides to diffuse the light. I mapped the array using Madrix 3.6 software.</p><p>This was one of my first LED pixel builds, and the initial test run was rough. The pixels flickered badly across the wall. I had not linked grounds across multiple power supplies, and I did not know about power injection yet. Adding inline resistors at the inputs smoothed out the data signal, and I later retrofitted power injection at the midpoint. The E682 is a Christmas light decoder and not very rugged, but it worked.</p><p>When we opened the doors that Thursday, regulars gasped walking into the room. Teaching myself pixel mapping on that build launched an entire lighting design focus in my career, even if I should have just bought pre-made LED strands.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","ArtNet","Custom Fabrication","Embedded Systems","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Through-Hole Soldering"],"gallery":[{"url":"media/Lighting/Lobby Wall/Trackswall3.mp4","fit":{"scale":1.35,"x":79.6,"y":54.6},"poster":"media/Lighting/Lobby Wall/frame-thumb-1786199470802.webp","thumbnail":"media/Lighting/Lobby Wall/frame-thumb-1786199470802-thumb.webp"},{"url":"media/Lighting/Lobby Wall/Trackswall2.mp4","fit":{"scale":1.25,"x":30.3,"y":100},"poster":"media/Lighting/Lobby Wall/frame-thumb-1786199551651.webp","thumbnail":"media/Lighting/Lobby Wall/frame-thumb-1786199551651-thumb.webp"},{"url":"media/Lighting/Lobby Wall/0317152322.webp","fit":{"scale":1.25,"x":100,"y":45.8},"thumbnail":"media/Lighting/Lobby Wall/0317152322-thumb.webp"},{"url":"media/Lighting/Lobby Wall/0317152321.webp","fit":{"scale":1.35,"x":0,"y":25.4},"thumbnail":"media/Lighting/Lobby Wall/0317152321-thumb.webp"},{"url":"media/Lighting/Lobby Wall/Trackswall1.mp4","fit":{"scale":1.4,"x":76.9,"y":100},"poster":"media/Lighting/Lobby Wall/frame-thumb-1786199579728.webp","thumbnail":"media/Lighting/Lobby Wall/frame-thumb-1786199579728-thumb.webp"},{"url":"media/Lighting/Lobby Wall/0317152050.webp","fit":{"scale":1.5,"x":25.9,"y":100},"thumbnail":"media/Lighting/Lobby Wall/0317152050-thumb.webp"},{"url":"media/Lighting/Lobby Wall/0315151546.webp","fit":{"scale":1.3,"x":23.8,"y":100},"thumbnail":"media/Lighting/Lobby Wall/0315151546-thumb.webp"},{"url":"media/Lighting/Lobby Wall/0313151634.webp","fit":{"scale":1.15,"x":100,"y":55},"thumbnail":"media/Lighting/Lobby Wall/0313151634-thumb.webp"},{"url":"media/Lighting/Lobby Wall/0312151534.webp","fit":{"scale":2.45,"x":46.9,"y":53.3},"thumbnail":"media/Lighting/Lobby Wall/0312151534-thumb.webp"},{"url":"media/Lighting/Lobby Wall/0221152259b.webp","fit":{"scale":1.3,"x":17.6,"y":11.8},"thumbnail":"media/Lighting/Lobby Wall/0221152259b-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-20T20:00:01.882Z","id":"7590","order":16,"specs":"<p><strong>Pixels:</strong> 520x WS2801 RGB</p><p><strong>Strip:</strong> 1x panel · 6×1 · 12V DC</p><p><strong>Decoder:</strong> SanDevices E682</p><p><strong>Protocol:</strong> WS2801</p><p><strong>Control:</strong> Madrix 3.6</p>","related":[{"name":"Tracks Discotheque ","url":"#project/3671"}],"bannerFit":{"scale":1.2,"x":66.7,"y":47.6},"thumbnail":"media/Lighting/Lobby Wall/0321151647-thumb.webp"},{"title":"Curved Liquor Bottle Display","category":"Lighting","image":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198604784.webp","description":"<p><strong>Que Bueno Suerte! | Denver</strong> - I designed and hardwired 96 custom louvered corner fixtures to illuminate a see-through sheet metal bottle shelf without blinding guests.</p>","longDescription":"<p>Off-the-shelf extrusion was out of the question for the main bottle display at Que Bueno Suerte!. I wanted to aim light up at the bottles from the corners of the display sections without putting a lens or diffuser in front of the LEDs, preserving maximum throw distance and brightness. To keep raw diodes out of the guests' eyes, I 3D printed custom corner fixtures with integrated light-blocking louvers. Getting the louver spacing and angle right took a few rapid prototyping iterations, and the alignment pins snapped off on almost every print, but the LED tape track itself held the end caps in line.</p><p>The shelf is a see-through metal grid, which made hiding the wiring for 96 individual fixtures a project in itself. I handwired the entire array and wrapped the routing in black tubing secured with mini zip ties. Because there was no closed conduit to hide inside, I used double-sided foam tape to mount the louvers and leaned on the physical stiffness of the bundled wire to support its own weight across the grid.</p><p>In action, the shelf is mapped into the rest of the venue's LED pixel installations through a centralized Madrix server, running unified, building-wide dynamic looks. It worked cleanly until the restaurant opened for dancing and guests started abandoning drinks on every flat surface in the room. I had built the shelf for empty display bottles and never anticipated liquids up there. Spills dripped into the tracks and corroded the LED tape, and because of how the louver tracks were dimensioned, standard waterproof silicone tape would not fit as a drop-in replacement. I ended up requesting a sign to keep drinks off the display and keeping spare parts on hand.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Custom Fabrication","Pixel Mapping","Lighting Design","Madrix","SPI","sACN","Hand tools","FDM 3D Printing","ELM","AC/DC Load Calc"],"gallery":[{"url":"media/Lighting/Curved Liquor Bottle Display/Screenshot 2026-08-01 112340.webp","fit":{"scale":1.1,"x":0,"y":100},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/Screenshot 2026-08-01 112340-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/20240419_101740.webp","fit":{"scale":1.15,"x":0,"y":97.2},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/20240419_101740-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/QBS Bottle shelf 2.mp4","fit":{"scale":1.05,"x":38.2,"y":100},"poster":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198542432.webp","thumbnail":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198542432-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/QBS Bottle shelf 3.mp4","fit":{"scale":1.45,"x":77.8,"y":40.9},"poster":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198604784.webp","thumbnail":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198604784-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/QBS Bottle shelf 1.mp4","fit":{"scale":1.15,"x":6.7,"y":68.7},"poster":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198714641.webp","thumbnail":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198714641-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/20240224_083551.webp","fit":{"scale":1.2,"x":99.1,"y":14.3},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/20240224_083551-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/20240409_124553.webp","fit":{"scale":1.55,"x":65.3,"y":49.9},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/20240409_124553-thumb.webp"},{"url":"media/Lighting/Curved Liquor Bottle Display/20240403_095909.webp","fit":{"scale":1,"x":57.9,"y":55.7},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/20240403_095909-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-20T21:09:12.884Z","id":"6808","order":5,"specs":"<p><strong>Pixels:</strong> 1152x WS2815 RGB</p><p><strong>Strip:</strong> 96x 0.2m @ 60/m · 12V DC</p><p><strong>Fixtures:</strong> 96x 3D-printed PLA+ louver corners</p><p><strong>Mounting:</strong> Double-sided tape · black cable wrap</p><p><strong>Control:</strong> Madrix 5.x</p>","related":[{"name":"Control system","url":"#project/4113"},{"name":"Louver lights","url":"#project/2052"}],"bannerFit":{"scale":1.05,"x":85.5,"y":47.5},"thumbnail":"media/Lighting/Curved Liquor Bottle Display/frame-thumb-1786198604784-thumb.webp","thumbnailFit":{"scale":1.05,"x":53,"y":39.8}},{"title":"Temple Denver","category":"Systems","image":"media/Integration/Temple Denver/MVIMG_20190817_211751.webp","description":"<p><strong>Temple - Main Room | Denver</strong> - Bridging Resolume and Madrix over NDI to stretch a 196 pixel canvas across an entire nightclub room.</p>","longDescription":"<p>Touring DJs kept coming through with custom VJ content and nowhere to realistically play it. The venue had 3 screens with a 48x48 resolution, giving the main room an accumulative resolution smaller than a phone icon. To give those artists a usable canvas, I needed to span the room without tearing out the existing hardware.</p><p>This was my first time integrating systems past DMX and MIDI cross triggers alone. Resolume Arena pushed slices of video to converter boxes that output SPI pixel signals, while Madrix ran the floor-to-ceiling custom pixel pillars with about 12 modules per row. Bridging the two over NDI let the content cross between machines. From there, I added DMX triggers from our Roadhog 4 console to the main pixel and video rigs, plus the orb and hallway computers, so we could grab master intensity and speed live.</p><p>Getting the low resolution pixel mesh to map onto the frosted pillars was the hardest problem to solve. The pixel spacing was not an even grid, which made scaling irregular shapes across the room a constant headache. If I were building the rig from the ground up, I would have chosen Madrix for the entire system.</p><p>Combining the setups got us an uninterrupted canvas just under 200 pixels wide. A couple of friends were working with me at the time, and we all geeked out when it finally came together. We could display logos and short messages across the whole wall.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["DMX","ArtNet","sACN","MIDI","Madrix","Resolume Arena","TCP/IP","Video Mapping","Pixel Mapping","NDI","SPI","Roadhog 4"],"gallery":[{"url":"media/Integration/Temple Denver/MVIMG_20190817_211751.webp","thumbnail":"media/Integration/Temple Denver/MVIMG_20190817_211751-thumb.webp"},{"url":"media/Integration/Temple Denver/VID_20190705_212851.mp4","poster":"media/Integration/Temple Denver/VID_20190705_212851-poster.webp","thumbnail":"media/Integration/Temple Denver/VID_20190705_212851-poster-thumb.webp"},{"url":"media/Integration/Temple Denver/Video Project 10 (4).mp4","poster":"media/Integration/Temple Denver/Video Project 10 (4)-poster.webp","thumbnail":"media/Integration/Temple Denver/Video Project 10 (4)-poster-thumb.webp"}],"files":[],"video":"","timestamp":"2026-07-25T16:47:23.504Z","id":"4382","order":2,"specs":"<p><strong>Console:</strong> Roadhog 4</p><p><strong>Pixel:</strong> Madrix 5.x (main room · Orb · hallway)</p><p><strong>Video:</strong> Resolume Arena</p><p><strong>Bridge:</strong> NDI (Resolume → Madrix)</p><p><strong>Protocol:</strong> DMX · sACN · SPI</p><p><strong>Canvas:</strong> ~200px wide across full room</p>","related":[{"name":"The Orb","url":"#project/6841"},{"name":"Backboard Repair","url":"#project/3965"},{"name":"Entrance Hall","url":"#project/5650"}],"thumbnail":"media/Integration/Temple Denver/MVIMG_20190817_211751-thumb.webp"},{"title":"Extrusion Centering Sled","category":"Tooling","image":"media/Fabrication/Extrusion Centering Sled/20200909_213244.webp","description":"<p>A 4 part 3D printed sled aligned 160m of vertical LED track across 10 wavy nightclub pillars.</p>","longDescription":"<p>Temple nightclub in San Francisco had 10 foundational pillars going from floor to ceiling. Each 4m column was boxed in and wavy, but needed 12mm LED track centered vertically on all 4 sides. Because the thin lines mirrored across the room, any drift would be obvious.</p><p>Standard measuring was useless on the uneven casing. I built a 4 part sled that rode inside the center track, breaking the jig into pieces to beat my 3D printer build plate limit. Notched ends marked with yellow china marker referenced the outer corner extrusions at any height. My first prints did not fit inside the channel, taking a couple of tries to dial in the sled width. Once the sizing was right, the interlocking joints held rigid.</p><p>Using the tool on site was fast. As I slid the jig upward, it actively found true center while I tacked the extrusion progressively with a pneumatic nailer. I finished all 160m of track in a couple of hours. The installation hid the wavy casing and kept every line straight.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["FDM 3D Printing","SolidWorks","Custom Fabrication","Rapid Prototyping","Hand tools"],"gallery":[{"url":"media/Fabrication/Extrusion Centering Sled/20200909_213244.webp","fit":{"scale":1,"x":52.9,"y":98.7},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200909_213244-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/20200907_234532.webp","fit":{"scale":1,"x":54.8,"y":49.5},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200907_234532-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/20200909_013406.webp","fit":{"scale":1.05,"x":53.3,"y":100},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200909_013406-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/20200908_090628.webp","fit":{"scale":1,"x":50,"y":72.9},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200908_090628-thumb.webp"},{"url":"media/Fabrication/Extrusion Centering Sled/20200907_231655.webp","fit":{"scale":1,"x":48.4,"y":81.6},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200907_231655-thumb.webp"}],"files":[],"specs":"<p><strong>Designed In:</strong> SolidWorks 2022</p><p><strong>Printed On:</strong> Tenlog TL-D3</p><p><strong>Material:</strong> Black PLA+</p><p><strong>Track Size:</strong> 12mm aluminum extrusion</p>","related":[{"name":"Pixel Pillars","url":"#project/6371"}],"video":"","timestamp":"2026-07-26T23:20:01.923Z","id":"5376","order":2,"thumbnailFit":{"scale":1.05,"x":5.3,"y":1.8},"bannerFit":{"scale":1,"x":48.8,"y":41.4},"thumbnail":"media/Fabrication/Extrusion Centering Sled/20200909_213244-thumb.webp"},{"title":"Dance Floor Pillars","category":"Fixtures","image":"media/Electronics/Dance Floor Pillars/Screenshot_20210306-180716_Photos~2.webp","description":"<p><strong>Temple Nightclub | San Francisco</strong> - I built 320 meters of custom recessed pixel tape into 10 floor-to-ceiling structural pillars on a skeleton budget.</p>","longDescription":"<p>We remodeled the main room at Temple Nightclub in San Francisco during the pandemic lockdowns with a skeleton crew and no budget. I was putting 320 meters of SM16704 RGBW (6000k) pixel tape seemingly built directly into 10 structural pillars on the dance floor. To build recessed tracks without expensive hardware, I wrapped the columns in OSB and mounted mud-in aluminum extrusions with a pneumatic nailer. I filled the remaining gaps with more board, plastered everything with drywall mud, and spent weeks on a scissor lift with an orbital sander hooked to a shop vac. Then I primed the columns, painted them flat black, and sealed the bottoms with silicone caulk.</p><p>The wiring had to survive crowd contact below and attic heat above. At the bottom of each column, thin metal tubing protected 3-conductor 18 AWG wiring from kick damage. Power injection runs went up inside the corner moldings to fight voltage drop across the 4 m strips. At the top, the lines met at a 24-pin ATX power coupler that connected to custom distribution boards above the video ceiling. Working up there meant crawling across strut channel and the backs of video panels in a 16 in gap, fighting condensation and heat while carpet blower fans pushed air toward the rear wall.</p><p>Just 2 weeks before we opened, the owner decided to flip the building entrance 180 degrees, but the main room layout held. Firing all 10 pillars from the dance floor looked like light jumping out of the concrete and vanishing into the ceiling above. Building custom distribution boards for morning hardware swaps took extra time that I would handle differently today, but the rig survived the crowds exactly as built.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","Hand tools","Lighting Design","Madrix","Pixel Mapping","Power Distribution","Power tools","SPI","TCP/IP","Wire-to-Board Soldering","Video Mapping","Resolume Arena"],"gallery":[{"url":"media/Electronics/Dance Floor Pillars/20210423_185515.webp","fit":{"scale":1.25,"x":58.3,"y":44.9},"thumbnail":"media/Electronics/Dance Floor Pillars/20210423_185515-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/20210403_195111.webp","fit":{"scale":1.85,"x":70.6,"y":76.4},"thumbnail":"media/Electronics/Dance Floor Pillars/20210403_195111-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/Video Project 18.mp4","poster":"media/Electronics/Dance Floor Pillars/Video Project 18-poster.webp","thumbnail":"media/Electronics/Dance Floor Pillars/Video Project 18-poster-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/20210403_125209.webp","fit":{"scale":1,"x":50.4,"y":65.9},"thumbnail":"media/Electronics/Dance Floor Pillars/20210403_125209-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/20210403_152329.webp","fit":{"scale":1.2,"x":41,"y":0},"thumbnail":"media/Electronics/Dance Floor Pillars/20210403_152329-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/20210407_133839.webp","fit":{"scale":1.4,"x":19.6,"y":24.8},"thumbnail":"media/Electronics/Dance Floor Pillars/20210407_133839-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/Video Project 17 (2).mp4","poster":"media/Electronics/Dance Floor Pillars/Video Project 17 (2)-poster.webp","thumbnail":"media/Electronics/Dance Floor Pillars/Video Project 17 (2)-poster-thumb.webp"},{"url":"media/Electronics/Dance Floor Pillars/20210403_103112.webp ,12vdc</p>","related":[{"name":"Extrusion Center Sled","url":"#project/5376"},{"name":"Immersive Lighting Rig","url":"#project/1"},{"name":"Cross System Control","url":"#project/8252"}],"video":"","timestamp":"2026-07-31T21:40:01.374Z","id":"6371","order":0,"thumbnailFit":{"scale":1.15,"x":33.2,"y":41.7},"bannerFit":{"scale":1,"x":50.4,"y":55.7},"thumbnail":"media/Electronics/Dance Floor Pillars/Screenshot_20210306-180716_Photos~2-thumb.webp"},{"title":"Pixel Louver Lights","category":"Tooling","image":"media/Fabrication/Pixel Louver Lights/20240322_115100.webp","description":"<p>96 3D-printed louver fixtures that illuminate 48 bar cubbies without shining raw RGB pixels at patrons.</p>","longDescription":"<p>The bar display at Que Bueno Suerte! has 48 cubbies arranged in 4 sets of 3x4. I needed a way to light the bottles from the front corners without blinding patrons walking past the shelves. Using Solidworks, I modeled louver fixtures and printed 96 of them across a Bambu labs X1C and a P1P. Each unit houses 12 WS2815 RGB pixels and mounts to the metal shelf with double-sided tape for simple servicing.</p><p>Getting the slide-in backing to fit required several revisions. Solder splices along the LED tape cause height variations that block the backing from sliding into place, so I cut the tape to avoid the splices entirely. I also added zip ties to hold the wiring. They act as strain relief so hanging cables never rip the solder pads off the strips.</p><p>Because the bottles sit on dry shelves, I installed non-waterproof strips. That caused problems later on. During dancing nights, patrons set drinks on the cubbies, and spills corroded and shorted the pixel strips inside the fixtures. Even with a redundant data line, a fried strip stops working, so I had to pull the dead units and replace the tape.</p><p>Running the strips into the shelves creates a 3D voxel display that sweeps light across the glass from every angle. This was the first time I designed and manufactured a 3D-printed pixel fixture for a live rig.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":true,"wip":false,"tags":["Custom Fabrication","FDM 3D Printing","Hand tools","Lighting Design","Rapid Prototyping","SolidWorks","Wire-to-Board Soldering"],"gallery":[{"url":"media/Fabrication/Pixel Louver Lights/20240401_103859.webp","fit":{"scale":1,"x":50,"y":63.7},"thumbnail":"media/Fabrication/Pixel Louver Lights/20240401_103859-thumb.webp"},{"url":"media/Fabrication/Pixel Louver Lights/20240329_170517.webp","fit":{"scale":1.4,"x":49.1,"y":43.2},"thumbnail":"media/Fabrication/Pixel Louver Lights/20240329_170517-thumb.webp"},{"url":"media/Fabrication/Pixel Louver Lights/20240322_115100.webp","fit":{"scale":1.3,"x":0,"y":46.7},"thumbnail":"media/Fabrication/Pixel Louver Lights/20240322_115100-thumb.webp"},{"url":"media/Fabrication/Pixel Louver Lights/20240324_152125.webp","fit":{"scale":1.25,"x":74.5,"y":27.6},"thumbnail":"media/Fabrication/Pixel Louver Lights/20240324_152125-thumb.webp"},{"url":"media/Fabrication/Pixel Louver Lights/Screenshot 2026-08-01 140532.webp","thumbnail":"media/Fabrication/Pixel Louver Lights/Screenshot 2026-08-01 140532-thumb.webp"}],"files":[{"name":"Louver Light Model","url":"media/Fabrication/Pixel Louver Lights/files/LouverLight.zip","description":"ZIP containing STL files for the pixel louver lights I designed and installed at Que Bueno Suerte! specifically for the curved liquor display install."}],"specs":"<p><strong>Designed In:</strong> SolidWorks 2022</p><p><strong>Printed On:</strong> Bambu Lab X1C · P1P</p><p><strong>Material:</strong> Black PLA+</p><p><strong>Pixels:</strong> 1152x WS2815 RGB · 96x 0.2m @ 60/m · 12V DC</p><p><strong>Mounting:</strong> Double-sided tape · zip-tie strain relief</p>","related":[{"name":"Bottle shelf","url":"#project/6808"}],"video":"","timestamp":"2026-08-01T15:14:28.453Z","id":"2052","order":0,"thumbnailFit":{"scale":1.2,"x":0.4,"y":41.6},"bannerFit":{"scale":1.15,"x":0.2,"y":40.8},"thumbnail":"media/Fabrication/Pixel Louver Lights/20240322_115100-thumb.webp"},{"title":"Blackout Ceiling Tubes","category":"Lighting","image":"media/Lighting/Blackout Ceiling Tubes/20240619_123414.webp","thumbnailFit":{"scale":1.25,"x":58.5,"y":64.3},"bannerFit":{"scale":1.05,"x":100,"y":48.4},"description":"<p><strong>Que Bueno Suerte! | Denver - </strong>18 fanless power supplies drive a blackout 3000K pixel array below a low mezzanine HVAC duct.</p>","longDescription":"<p>A central HVAC duct and a low ceiling above the Que Bueno Suerte! mezzanine had already killed one designer's lighting concept years earlier. I took the lowest point of that duct as a hard clearance limit and shot a laser level across the room to hang a flat array of blackout tubes. The venue needed warm 3000K white for early evening dinner service and high-impact RGBW pixel chases for Latin dance nights. Standard milky white LED diffusion looks cheap when powered off, so I used black diffusion against the dark ceiling paint so the rig would visually disappear during the day.</p><p>I spent a month working overhead from 6ft ladders and restaurant benches, cutting strutchannel and setting cable anchors every 12 in along the beams. I originally ran 18/2 wire inside the tubes for power injection at the far end, but the wire drooped inside the casing and cast obvious shadows. I ripped the extra wiring out entirely and tested the strips from a single end, which ran full white with zero color shift.</p><p>Silent operation meant no fanned power supplies. I specced 18 waterproof MEAN WELL HLG units across 3 new 20A circuits, with each circuit powering a bank of 6 supplies and each supply driving 2 bars through independent fuses. Booting 6 fanless supplies at once tripped the breakers instantly from inrush current. I built custom sequencer boxes to stagger startup by 5 seconds so the capacitors could charge. Long-range decoders fed over 24 universes of sACN pixel data from a rack server in the office, running ENTTEC ELM before I moved the venue to Madrix 5.</p><p>The owner finally got his mezzanine installation without a low-hanging mess above the tables. The array blends into the ceiling paint by afternoon, gives a warm incandescent glow over dinner, and hits hard when the dance floor opens.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["Madrix","Lighting Design","Capture","Custom Fabrication","ELM","Pixel Mapping"],"gallery":[{"url":"media/Lighting/Blackout Ceiling Tubes/20240619_123414.webp","fit":{"scale":1,"x":50,"y":68.7},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20240619_123414-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20240619_123416.webp","fit":{"scale":1,"x":48.6,"y":69.4},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20240619_123416-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20241031_142443.mp4","fit":{"scale":1.35,"x":100,"y":56},"poster":"media/Lighting/Blackout Ceiling Tubes/frame-thumb-1786286915626.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/frame-thumb-1786286915626-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20250128_112650.mp4","fit":{"scale":1.15,"x":0.2,"y":73.8},"poster":"media/Lighting/Blackout Ceiling Tubes/frame-thumb-1786278454156.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/frame-thumb-1786278454156-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20240912_132858.mp4","fit":{"scale":1.15,"x":99.7,"y":60.6},"poster":"media/Lighting/Blackout Ceiling Tubes/frame-thumb-1786286980389.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/frame-thumb-1786286980389-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20230106_152451.mp4","fit":{"scale":1,"x":47.9,"y":72.7},"poster":"media/Lighting/Blackout Ceiling Tubes/20230106_152451-poster.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/20230106_152451-poster-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20230213_090650.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/20230213_090650-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/IMG_20230103_125326_123.webp","fit":{"scale":1.35,"x":0,"y":70.8},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/IMG_20230103_125326_123-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20240103_162353.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/20240103_162353-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20221231_112756.webp","fit":{"scale":1.2,"x":100,"y":27.6},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20221231_112756-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20230102_131900.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/20230102_131900-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Screenshot 2026-08-14 145805.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Screenshot 2026-08-14 145805-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/IMG_20221221_111336_620.webp","fit":{"scale":1.35,"x":95.4,"y":41.5},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/IMG_20221221_111336_620-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20221215_153203.mp4","fit":{"scale":1.2,"x":69.9,"y":71},"poster":"media/Lighting/Blackout Ceiling Tubes/20221215_153203-poster.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/20221215_153203-poster-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20221219_140531.webp","fit":{"scale":1,"x":50.9,"y":7.6},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20221219_140531-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/20221206_172954.webp","fit":{"scale":1,"x":46.6,"y":86.3},"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20221206_172954-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/Mez ceiling 1.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/Mez ceiling 1-thumb.webp"},{"url":"media/Lighting/Blackout Ceiling Tubes/grey view 3.webp","thumbnail":"media/Lighting/Blackout Ceiling Tubes/grey view 3-thumb.webp"}],"files":[],"specs":"<h2>PIXELS &amp; DISPLAY</h2><p><strong>Short Tubes (x15)</strong><br><em>3.9m • blackout diffusion • RGBW (3000k) • 60/m • 20px/m • 78px</em></p><p><strong>Mid-length Tubes (x14)</strong><br><em>4.4m • blackout diffusion • RGBW (3000k) • 60/m • 20px/m • 88px</em></p><p><strong>Long Tubes (x7)</strong><br><em>4.9m • blackout diffusion • RGBW (3000k) • 60/m • 20px/m • 98px</em></p><h2>POWER &amp; DISTRIBUTION</h2><p><strong>Power Supply (x18)</strong><br><em>MEAN WELL • HLG-320H-12</em></p><p><strong>Pixel Decoder (x3)</strong><br><em>Advatek • R4D-S • 12 Universe</em></p>","related":[{"name":"Que Bueno Suerte!","url":"#project/4113"},{"name":"PSU Sequencer","url":"#project/1430"}],"video":"","timestamp":"2026-08-01T17:08:27.719Z","id":"1612","order":1,"thumbnail":"media/Lighting/Blackout Ceiling Tubes/20240619_123414-thumb.webp","specsData":[{"id":"a1dea7dd-2bb9-4392-9aec-d54d4b2369a9","title":"PIXELS & DISPLAY","items":[{"id":"df916682-c3ef-47d1-a062-f5083ea67525","name":"Short Tubes","qty":"15","specs":"3.9m, blackout diffusion, RGBW (3000k), 60/m • 20px/m, 78px"},{"id":"a44354e5-c45d-4c49-8571-c8a5afa27be3","name":"Mid-length Tubes","qty":"14","specs":"4.4m, blackout diffusion, RGBW (3000k) • 60/m • 20px/m, 88px"},{"id":"e7543a7e-621a-45d4-9002-7e72909abc1f","name":"Long Tubes","qty":"7","specs":"4.9m, blackout diffusion, RGBW (3000k) • 60/m • 20px/m, 98px"}]},{"id":"89301d93-762c-4ebb-866e-5c5534a658db","title":"Power & Distribution","items":[{"id":"5427178b-70bc-4c60-91d3-9a017f246326","name":"Power Supply","qty":"18","specs":"MEAN WELL, HLG-320H-12, "},{"id":"a9bb2638-da4d-45e1-ac97-7a261ee4e1c4","name":"Pixel Decoder","qty":"3","specs":"Advatek, R4D-S, 12 Universe"}]}]},{"title":"LED PSU Boot Sequencer","category":"Tooling","image":"media/Fabrication/LED PSU Boot Sequencer/20221201_184622.webp","thumbnailFit":{"scale":1.4,"x":66.9,"y":46.3},"bannerFit":{"scale":1.6,"x":64.6,"y":54.8},"description":"<p>I built 3 3D-printed boot sequencers to stagger 18 power supplies without popping the venue breakers.</p>","longDescription":"<p>Que Bueno Suerte! needed 18 MEAN WELL HLG-320H-12 power supplies to drive an LED pixel ceiling across 3 circuits. Firing up that many capacitors at once meant tripping the breakers from high inrush current. Pulling more electrical circuits cost too much, and commercial gear was overpriced. I built 3 3D-printed boot sequencers instead, putting 6 supplies on each box.</p><p>Inside each unit, a small MEAN WELL supply ran a relay board that acted as an automated switch bank. Packing high-voltage lines, relay boards, and a nest of WAGOs cleanly into a sealed case without risking a short took several enclosure revisions. Every connection used locking connectors, with indicator LEDs on the front to show live outputs and status lights on the back to verify AC power. I capped the lighting load at 80% of maximum capacity when every channel ran at full brightness. That headroom kept heat down and made the hardware impossible to kill with software mistakes.</p><p>I mounted the boxes on the black wall just above the display rafters. Flipping the power starts a cascade of relay clicks across the room. Every 5 to 10 seconds, another ceiling section wakes up segment by segment as the capacitors charge and the DC output stabilizes. Once the boot sequence finishes, the whole rig runs silent.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","FDM 3D Printing","Power Distribution","Rapid Prototyping","SolidWorks"],"gallery":[{"url":"media/Fabrication/LED PSU Boot Sequencer/20221201_184622.webp","thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221201_184622-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221121_105826.webp","fit":{"scale":1.3,"x":72.1,"y":79.8},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221121_105826-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221121_105841.webp","fit":{"scale":1.2,"x":20.8,"y":94.4},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221121_105841-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221121_105849.webp","fit":{"scale":1.2,"x":14.9,"y":34.1},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221121_105849-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221121_190624.webp","fit":{"scale":1,"x":43,"y":36.2},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221121_190624-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221130_082043.webp","fit":{"scale":1,"x":52.7,"y":41.3},"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221130_082043-thumb.webp"},{"url":"media/Fabrication/LED PSU Boot Sequencer/20221020_204730.webp","thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221020_204730-thumb.webp"}],"files":[],"specs":"<p><strong>Designed In:</strong> SolidWorks 2022</p><p><strong>Printed On:</strong> Bambu Lab X1C</p><p><strong>Material:</strong> Black PLA+</p><p><strong>Connectors:</strong> Locking connectors · WAGO junction blocks</p><p><strong>Indicators:</strong> Front output LEDs · rear AC status lights</p>","related":[{"name":"Blackout ceiling","url":"#project/1612"}],"video":"","timestamp":"2026-08-01T21:44:42.857Z","id":"1430","order":1,"thumbnail":"media/Fabrication/LED PSU Boot Sequencer/20221201_184622-thumb.webp"},{"title":"WiFi VIP Tables","category":"Fixtures","image":"media/Electronics/WiFi VIP Tables/Screenshot 2026-08-07 201527.webp","description":"<p>I salvaged 32 waterlogged acrylic VIP tables into wireless ArtNet pixel fixtures using routers and kitchen soup containers.</p>","longDescription":"<p>Temple SF had 32 old VIP tables with heavy laminated MDF bases and black acrylic tops. The MDF had soaked up spilled drinks for years, expanding and separating, while the acrylic had sharp, chipped corners that were a hazard in a drunk crowd. Most of the hardwired RGB wash strips underneath were already dead. Buying new plastic during the pandemic was too expensive and too slow, but the acrylic sheets were still good. I decided to strip them down and rebuild them from scratch.</p><p>My carpenter and I used a router with a shop vac attached to carve the existing acrylic channels deeper for new LED strips and cut a center path for the wiring. We rounded the top and bottom edges across all 32 sheets, which eliminated the sharp corners and gave the acrylic a smooth, clean line from every angle. To replace the ruined MDF bases, I cut plywood sheets, painted them black, and secured them to the underside so we could attach modern metal legs.</p><p>Time got tight toward the end, and my 3D printer could not produce clean enclosures fast enough. I walked into the kitchen, grabbed a stack of plastic soup containers, and siliconed them to the center underside of each table to house an ESP32 decoder and a Li-ion battery. The electronics sat safely out of reach of nightly spills. For power management, I built a charging station on the side of the control rack. The lighting operator gathered the batteries at the end of the night to charge them, then swapped them back in before doors opened.</p><p>I mapped all 32 tables into Madrix 5.x over wireless ArtNet so they matched the colors of the main room lighting rig. Running Wi-Fi control through a crowded club floor is always a fight against RF noise, but high-gain antennas on the receivers kept the signal alive. The tables fit the room, survived the crowd, and salvaged the most expensive material we had.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["ArtNet","Custom Fabrication","ESP32","Hand tools","Madrix","Power tools","SPI","TCP/IP","Through-Hole Soldering","Pixel Mapping","Power Distribution","Wire-to-Board Soldering","Embedded Systems","Lighting Design","Repair"],"gallery":[{"url":"media/Electronics/WiFi VIP Tables/20210625_144028.mp4","poster":"media/Electronics/WiFi VIP Tables/20210625_144028-poster.webp","thumbnail":"media/Electronics/WiFi VIP Tables/20210625_144028-poster-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210519_113326.mp4","poster":"media/Electronics/WiFi VIP Tables/20210519_113326-poster.webp","thumbnail":"media/Electronics/WiFi VIP Tables/20210519_113326-poster-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210623_212915.webp","fit":{"scale":1.35,"x":10.3,"y":30.5},"thumbnail":"media/Electronics/WiFi VIP Tables/20210623_212915-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210623_212433.webp","fit":{"scale":1.15,"x":53.6,"y":28.3},"thumbnail":"media/Electronics/WiFi VIP Tables/20210623_212433-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210511_184836.webp","fit":{"scale":1.55,"x":60.5,"y":16.1},"thumbnail":"media/Electronics/WiFi VIP Tables/20210511_184836-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210713_100708.webp","fit":{"scale":1.7,"x":64.6,"y":40.4},"thumbnail":"media/Electronics/WiFi VIP Tables/20210713_100708-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210423_122623.webp","fit":{"scale":1.45,"x":19.7,"y":43.6},"thumbnail":"media/Electronics/WiFi VIP Tables/20210423_122623-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210420_124426.mp4","poster":"media/Electronics/WiFi VIP Tables/20210420_124426-poster.webp","thumbnail":"media/Electronics/WiFi VIP Tables/20210420_124426-poster-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210429_192055.webp","fit":{"scale":1.2,"x":71.1,"y":54.7},"thumbnail":"media/Electronics/WiFi VIP Tables/20210429_192055-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20201025_135746.webp","fit":{"scale":1.4,"x":5.1,"y":52.8},"thumbnail":"media/Electronics/WiFi VIP Tables/20201025_135746-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20210428_145442.webp","fit":{"scale":1.1,"x":52.4,"y":45},"thumbnail":"media/Electronics/WiFi VIP Tables/20210428_145442-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20201024_020009.webp","fit":{"scale":1,"x":49.3,"y":39.8},"thumbnail":"media/Electronics/WiFi VIP Tables/20201024_020009-thumb.webp"},{"url":"media/Electronics/WiFi VIP Tables/20201026_122846.webp","fit":{"scale":1.1,"x":48,"y":26.8},"thumbnail":"media/Electronics/WiFi VIP Tables/20201026_122846-thumb.webp"}],"files":[],"specs":"<p><strong>Control:</strong> Madrix 5.x</p><p><strong>Fixtures:</strong> (32) 2.1m</p><p><strong>LED: </strong>5050 RGBW (6000k)</p><p><strong>Pixel Driver:</strong> SM16704</p><p><strong>Pixel Size: </strong>3 LEDs</p><p><strong>LED Spacing: </strong>60/m</p><p><strong>Pixel Voltage: </strong>12vdc</p><p><strong>Decoder: ESP32</strong></p><p><strong>Power: </strong>12vdc Li-ion</p>","related":[{"name":"Immersive lighting","url":"#project/1"},{"name":"Temple SF control","url":"#project/8252"}],"video":"","timestamp":"2026-08-07T23:07:28.368Z","id":"496","order":6,"thumbnailFit":{"scale":1.3,"x":0,"y":30.9},"bannerFit":{"scale":1.25,"x":46.1,"y":49},"thumbnail":"media/Electronics/WiFi VIP Tables/Screenshot 2026-08-07 201527-thumb.webp"},{"title":"Glass VIP Wall","category":"Lighting","image":"media/Lighting/Glass VIP Wall/Screenshot 2026-08-07 204525.webp","thumbnailFit":{"scale":1.35,"x":53,"y":100},"bannerFit":{"scale":1.1,"x":24.3,"y":62.6},"description":"<p><strong>Temple Nightclub | San Francisco </strong>- I found thousands of dollars of buried 24V LED strip under a staircase during lockdown and turned it into a 1:1 pixel grid for the mezzanine.</p>","longDescription":"<p>During the COVID-19 lockdown at Temple SF, we had time on our hands and scoured the building. Back in an overflowing hallway, inside a cubby under some stairs, I found several boxes of brand new, 20m long, 24V waterproof LED strips from Environmental Lighting left over from the original install. I also found the rigid mounting track. It was thousands of dollars of high-end product buried in the bowels of the club, meant to replace a single dead strand of pixels at the bottom of the long glass mezzanine wall. I gathered enough salvaged Madrix Nebula decoders and power supplies to build a proper installation.</p><p>The glass panels were around 100 pounds each. I bought industrial suction cups, used body mechanics to get them over the lip, and walked them out by the corners to expose a five-inch working gap. I shot a laser level across the far wall to set the rigid track, then calculated the physical length of a single pixel on the strips. I set the vertical spacing between the tracks to match that measurement exactly, building a 1:1 pixel grid that ran in one continuous shot across the raised VIP area.</p><p>Even with 24V strips and thick power rails, voltage drop over a 20m run is inevitable. When I ran all channels at full white, the strips gradually tinted red toward the far end. I countered this by running an 18AWG power injection wire across the top of the channels to the opposite end, and tied the DC- lines together across the silent, waterproof power supplies and two Nebulas behind the far glass panel.</p><p>When we powered it up, the wall mapped cleanly into the main room programming and transformed the mezzanine. But it immediately created an operational problem: because the venue never fixed the house lighting in that area, our pixel wall was the primary light source for VIP. When the main dancefloor system hit a master blackout, the lounge plunged into pitch black, generating immediate complaints from people trying to drink. We ended up having to isolate the mezzanine wall to ignore master blackouts entirely.</p>","websiteLink":"","launchLink":"","githubLink":"","shopLink":"","featured":false,"wip":false,"tags":["AC/DC Load Calc","Custom Fabrication","ArtNet","Hand tools","Madrix","Pixel Mapping","Power Distribution","Power tools","TCP/IP","SPI","Wire-to-Board Soldering","Lighting Design"],"
